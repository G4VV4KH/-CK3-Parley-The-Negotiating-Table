 # V3, ИТЕРАЦИЯ 6 - ОДОЛЖЕННЫЙ ЭКРАН БРАКА
 # 8 ключей, тот же набор имён, что и в английском файле. Ещё два ключа
 # переписаны на месте (tnt_picker_title_spouse, tnt_btn_edit_marriage) и там же
 # помечены.
 #
 # ЧТО ИМЕННО ОДОЛЖЕНО. Взаимодействие tnt_stage_marriage_interaction
 # (common\character_interactions\tnt_12_marriage_picker.txt) выставляет
 # `interface = marriage` и НЕ выставляет `special_interaction`, поэтому
 # открывается родное игровое окно сватовства - два портрета, оба двора,
 # шестнадцать отборов, переключатель линии и большая свадьба, - а НИКОГО НЕ
 # ЖЕНЯТ. Выбранная там пара лишь вносится в обсуждаемый договор.
 #
 # ЧЕГО МЫ НЕ ВЛАСТНЫ ИЗМЕНИТЬ - ЭТО НАДПИСЬ НА БОЛЬШОЙ КНОПКЕ. Она читается как
 # «Отправить предложение», потому что GAME\gui\interaction_marriage.gui:229
 # жёстко задаёт text = "send_marriage_proposal_button_name", а сама кнопка живёт
 # в interaction_templates.gui:95-102. Переименовать её значило бы переопределить
 # родной файл .gui (R1) или переименовать ту же кнопку в настоящем игровом окне
 # брака. ПОЭТОМУ ВСЕ КЛЮЧИ НИЖЕ НАПИСАНЫ С ОГЛЯДКОЙ НА ЭТУ НАДПИСЬ: ни один из
 # них не обещает на ней других слов, и каждый из трёх, что игрок прочтёт РАНЬШЕ -
 # подсказка кнопки открытия, строка рядом с ней и заголовок с телом самого окна, -
 # прямо говорит, что подтверждение ВНОСИТ ПАРУ В ДОГОВОР и что никого не венчают,
 # пока договор не принят целиком.
 #
 # ВЕНЧАНИЕ И ОБРУЧЕНИЕ - РАЗНЫЕ ВЕЩИ, И ЗДЕСЬ ОНИ НЕ СМЕШАНЫ: взрослых венчают,
 # когда договор исполняется, детей обручают, а большая свадьба - это обещание, и
 # отмеченную ею пару обручают. Раздел P2 сформулирован так же; ничего иного тут
 # не сказано.
 #
 # ИМЯ ВЗАИМОДЕЙСТВИЯ - ЭТО САМ КЛЮЧ ОБЪЕКТА, как подробно разобрано в разделе W
 # (_character_interactions.info:120-123; в игре -
 # GAME\localization\english\interactions_l_english.yml:245
 # arrange_marriage_interaction:0 "Arrange Marriage"). В меню по правому щелчку он
 # не появится - is_shown требует уже открытых переговоров именно с этим
 # партнёром, - но движок всё равно его ищет.
 tnt_stage_marriage_interaction:0 "Внести брачную партию в договор"
 # ЗАГОЛОВОК ОДОЛЖЕННОГО ОКНА. send_name - это то, что печатает
 # interaction_marriage.gui:44 через
 # [CharacterInteractionConfirmationWindow.GetSendName]. Строка одна, поэтому она
 # говорит главное: это запись в договоре, а не предложение.
 tnt_stage_marriage_send:0 "Внести эту партию в договор"
 # СТРОКА НАД СПИСКОМ КАНДИДАТОВ (поле `prompt` взаимодействия; рисуется по центру,
 # interaction_marriage.gui:338-345 — прямо над списком, где ваниль рисует полоски
 # «Возможный союз»). Это text_single с autoresize = no, поэтому строка ОБЯЗАНА быть
 # одной и короткой: ни \n, ни абзацев. Полная формулировка — в
 # tnt_stage_no_alliance_tt и в описании взаимодействия.
 tnt_stage_marriage_prompt:0 "#high Достаточно близкая партия теперь приносит с собой союз#! — тот самый, что игра даёт за собственный брачный сговор, в день, когда скреплён договор."
 # ТОТ ЖЕ ФАКТ ПОЛНОСТЬЮ — печатается в блоке эффектов, когда выбраны оба супруга.
 #
 # ПУНКТ 5 ДОБАВЛЯЕТ ТРЕТИЙ АБЗАЦ: факт был верен и бесполезен. Он говорил игроку,
 # чего брак в договоре НЕ делает, и не оставлял ему выхода. Подсказка выход
 # называет, и каждое её условие прочитано в ванили, а не выдумано —
 # GAME\common\character_interactions\00_alliance.txt:
 #   negotiate_alliance_interaction, is_shown :1128-1151 — пара должна УЖЕ быть
 #     роднёй (is_any_family_relation_or_spouse_trigger, 00_family_triggers.txt:230),
 #     либо роднёй названых братьев, либо связанной заложнической клятвой, либо
 #     главами союзных домов. Достоинство ЭТУ дверь чужому не открывает — о нём
 #     следующий абзац.
 #   блок OR в is_valid :1182-1283 — супруг (:1186), родитель / дед / прадед
 #     (:1188-1190), ребёнок / внук / правнук (:1191-1193), дядя или тётя (:1194),
 #     племянник или племянница (:1195), брат или сестра (:1196); ЛИБО супруг
 #     одного правителя — близкая родня, племянник или дядя другого (:1205-1235, в
 #     обе стороны); ЛИБО ребёнок, родитель, брат или сестра одного состоит в браке
 #     с ребёнком, родителем, братом или сестрой другого (:1237-1258). ИМЕННО ЭТИ
 #     ДВА СЛУЧАЯ И ПОКУПАЕТ СВАДЬБА В ДОГОВОРЕ — потому подсказка и велит родниться
 #     близко.
 #   плоские строки выше :1155-1181 — плен, война друг с другом, ещё не остывший
 #     refused_alliance_opinion (:1167-1178) и ОБЕ стороны ниже ранга гегемонии
 #     (:1180-1181, highest_held_title_tier < tier_hegemony = 6,
 #     00_title_tiers_values.txt:7). Последнее названо вслух: гегемон, читающий
 #     подсказку, которая у него не сработает, назовёт её багом.
 # ДОСТОИНСТВО — ЭТО ВТОРАЯ ДВЕРЬ, А НЕ КЛЮЧ К ПЕРВОЙ. has_perk =
 # defensive_negotiations_perk стоит в блоке OR (:1184), но is_shown всё равно
 # требует родства, поэтому настоящее применение достоинства — его собственное
 # взаимодействие: perk_alliance_interaction :2379-2416 родства не требует вовсе,
 # скрыто, пока показано «Договориться о союзе» (:2410-2413), не работает с
 # собственным сеньором и собственным вассалом (:2397-2398, :2423-2424), допускает
 # лишь один такой договор разом (:2427-2440) и требует, чтобы ни одна из сторон не
 # воевала (:2442-2452).
 # ТРИ НАЗВАНИЯ ВСТАВЛЕНЫ КАК $...$, чтобы каждый язык печатал родную подпись игры,
 # а не наш перевод (ванильные russian\interactions_l_russian.yml:1366, :1363 и
 # russian\lifestyles\perks_l_russian.yml:108; сама ваниль пользуется ровно этой
 # формой — russian\tutorial_objectives_l_russian.yml, hint_perk_negotiate_allies).
 # РАУНД 10: ПРИЧИНА ИЗ V15 ОПРОВЕРГНУТА, ВЫВОД ОСТАЁТСЯ. Два утверждения, стоявшие
 # здесь, ИЗМЕРЕНЫ И ЛОЖНЫ; повторять их нельзя.
 # (1) «Полоски у кандидатов читать стоит — дверь ниже открывается ровно на этом
 #     родстве». Это два разных предиката: герб рисует C++ в сватовской панели
 #     (GAME\gui\interaction_marriage.gui:433-459, тултип на :443), а «дверь» — это
 #     блок OR у negotiate_alliance (00_alliance.txt:1182-1268), и они ВЗАИМНО
 #     ИСКЛЮЧАЮЩИ: is_shown прячет то взаимодействие, как только двое уже союзники
 #     (:1123). Да и полосок рядом с этим текстом на экране нет: список кандидатов —
 #     visible = Not(HasPickedCharacters) (:247), а этот блок — :182.
 # (2) «Игра держит военный союз за родством, поэтому свадьба, к которой он
 #     прилагался бы втихую, отдавала бы заслуженное за деньги». Ванильная свадьба
 #     ИМЕННО ЧТО его прилагает: special_interaction = arrange_marriage_interaction
 #     «sets up alliances» (_character_interactions.info:580, повтор :661), у движка
 #     есть предикат yields_alliance (00_rules.txt:807), и ваниль РАЗРЫВАЕТ этот союз
 #     при разрыве помолвки (00_marriage_interaction_effects.txt:1659-1668) —
 #     разорвать можно лишь созданное. Значит, отказ — НАШ, а не игры: пикер намеренно
 #     не ставит special_interaction, и ключ теперь говорит именно это. Абзацы-
 #     подсказки ниже не тронуты и по-прежнему верны.
 tnt_stage_no_alliance_tt:0 "#high Партия, вписанная в этот договор, теперь создаёт союз.#! Это правило самой игры, а не мода: игра смотрит, насколько близко каждый из двоих в родстве с тем правителем, который его отдаёт, и если пара достаточно близка с обеих сторон, вы с ним становитесь союзниками в тот самый миг, когда договор скреплён, — ровно так, как всегда делало её собственное #high «$arrange_marriage_interaction$»#!. За этим столом [Concept('alliance', 'союз')|E] никто не покупает: такого условия на листе нет и не будет — он просто приходит вместе с браком.\n\n#weak Значит, союзным знакам, которые игра рисует в этом окне, снова можно верить — полоске силы «Возможный союз» у кандидата и маленьким гербам с короной рядом с ней. Живут они в списке кандидатов, а список уходит с экрана, едва выбраны оба портрета, — так что к тому мигу, когда вы читаете эти строки, ничего подобного на странице уже нет; зато строка, напечатанная прямо над этим абзацем, отвечает за пару, что сейчас перед вами, и это ответ самой игры, а не догадка о нём.#!\n\n#weak Союз держится на самой паре: он живёт ровно столько, сколько стоит их брак, и обрывается вместе с ним — средствами самой игры. Если кто-то из двоих ещё ребёнок, пару обручат, а не поженят, и союз с первого же дня стоит на этой помолвке. Договор выдержит несколько пар, и о каждой судят отдельно.#!"
 # РАУНД 9 — ПРИГОВОР ИМЕННО ТОЙ ПАРЕ, ЧТО СЕЙЧАС НА ЭКРАНЕ. Ключ выше излагает
 # ПРАВИЛО; эти два — ФАКТ об этих двух портретах. Пул мода устроен так, что ответ
 # «нет» выпадает куда чаще, чем игрок ожидает: брак придворного с придворным —
 # самое частое, что даёт это окно, — не открывает ни одной двери к союзу. Решает
 # T52 tnt_pair_opens_alliance_trigger (common\scripted_triggers\tnt_41_gates.txt) —
 # ванильное OR, переписанное на состояние ПОСЛЕ свадьбы:
 # GAME\common\character_interactions\00_alliance.txt:1186, :1205-1219, :1221-1235,
 # :1237-1258. Печатается из on_accept взаимодействия, поэтому закон 10a сюда не
 # достаёт и вставка $key$ здесь безопасна; ту же форму if/custom_tooltip ваниль
 # везёт в 00_artifact_interactions.txt:397-431.
 # РАУНД 11 — ТРИ ИЗМЕРЕННЫЕ ПРАВКИ; ПЕРВАЯ ОТЗЫВАЕТ ОБЕЩАНИЕ.
 # (1) СТРОКА «ОТКРЫВАЕТ» ГОВОРИЛА «станет доступно на этом правителе», А T52 ЭТОГО
 #     НЕ ДОКАЗЫВАЕТ. T52 переписывает ОДИН блок — родственное OR из
 #     is_valid_showing_failures_only взаимодействия negotiate_alliance
 #     (00_alliance.txt:1182-1283). Взаимодействие запирает куда большее, и ничего
 #     из этого нельзя знать в тот миг, когда партию вносят в договор:
 #     дипломатическая досягаемость (use_diplomatic_range по умолчанию YES,
 #     _character_interactions.info:106-108, и negotiate_alliance его не объявляет;
 #     порядок отправки ставит проверку дальности на :681 — ДО is_shown на :683);
 #     собственные строки is_shown (:1120-1153) — оба всё ещё правители, эти двое
 #     ещё не союзники, а актор либо человек, либо герцог и выше; и плоские строки
 #     is_valid над OR (:1155-1181) — оба играбельны и не в плену, не воюют друг с
 #     другом, за ним не стоит свежего refused_alliance_opinion, и оба НИЖЕ ранга
 #     гегемонии. ВЫБРАНО СМЯГЧИТЬ СТРОКУ, А НЕ РАСШИРЯТЬ T52, и причина записана
 #     в шапке самого T52: всё перечисленное — ПРЕХОДЯЩЕЕ СОСТОЯНИЕ, читаемое за
 #     годы до свадьбы, так что вшить его значило бы переворачивать структурный
 #     приговор из-за мимолётной войны и печатать «закрыто» там, где дверь на деле
 #     открывается. Теперь строка утверждает ровно то, что доказывает триггер, —
 #     условие РОДСТВА, — а остальное названо как взвешиваемое позже.
 #     ОСТАВЛЕНО ДРУГОЙ ПОЛОСЕ ЭТОГО ЖЕ РАУНДА: если брак по сделке начнёт ДАВАТЬ
 #     союз через create_alliance, ключ перестаёт быть прогнозом вовсе и
 #     переписывается той полосой; здесь ничего не предрешено ни в ту, ни в другую
 #     сторону — тронута только ложная половина.
 # (2) ОГОВОРКА ПРО ДЕДА И ВНУКА ВЕРНА ЛИШЬ ДЛЯ ОДНОЙ ДВЕРИ. Двери 2 и 3
 #     (:1205-1219, :1221-1235) проверяют is_close_family_of, а близкая родня у
 #     ванили — «родители, ДЕДЫ И БАБКИ, дети, ВНУКИ, братья и сёстры»
 #     (GAME\localization\english\game_concepts_l_english.yml:1237) — и рядом с ней
 #     стоят is_nibling_of и is_uncle_or_aunt_of. Круг до ребёнка/родителя/брата
 #     сужает только дверь 4 (:1237-1258). Оговорка теперь дана по дверям.
 # (3) НИКАКОЙ ГЕРБ НЕ ПОЯВЛЯЕТСЯ ПОСЛЕ ВЫБОРА ОБОИХ ПОРТРЕТОВ — ИЗМЕРЕНО ПО .gui.
 #     Поверхность «Возможный союз» ОДНА: alliances_grid внутри СТРОКИ КАНДИДАТА
 #     (GAME\gui\interaction_marriage.gui:433-459) — hbox_alliance_strength, та
 #     самая полоска, на :445, и coa_realm_tiny_crown на :452, с общей подсказкой
 #     MATCHMAKER_INTERACTION_ALLIANCE (:443), текст которой —
 #     "#T Potential alliance#!\n[Character.GetPrimaryTitle.GetName]"
 #     (GAME\localization\english\specialinteractions_l_english.yml:642). Весь
 #     список кандидатов — visible = Not(HasPickedCharacters) (:247), а состояние
 #     «оба выбраны» (:182) показывает две метки престижа (:143-175), MARRIAGE_INFO
 #     (:208, = [MarriageInfo.GetMarriageOrBetrothal]), коробку деталей брака
 #     (interaction_templates.gui:105-220 — тип брака, дом/матрилинейность, шанс
 #     детей, инбридинг, наследуемые черты) и блок эффектов (:216) — и НИ ОДНОГО
 #     союзного виджета. Оба ключа теперь называют настоящие знаки.
 # *** УКАЗАНИЕ «СВЕРХ» ОТОЗВАНО И ВЕРНУТЬСЯ НЕ ДОЛЖНО. *** Один раунд этот ключ
 # предлагал игроку САМОМУ прибавить эту величину к заголовку, и третий отчёт —
 # это измерение того, чего стоит такая просьба: он прочитал -9 здесь, +106 в
 # сделке и сообщил о рассинхроне, а не выполнил сложение. Заголовок теперь
 # tnt_stage_pair_deal_delta_value, союз ВНУТРИ него, поэтому фраза говорит «уже
 # учтено» и предупреждает не прибавлять дважды. Сама величина по смыслу та же,
 # но теперь УМНОЖЕНА на расположение партнёра: она обязана быть в одной валюте с
 # заголовком, под которым стоит, — постоянное правило в шапке
 # tnt_stage_alliance_offer_value.
 tnt_stage_alliance_opens_tt:0 "#high Эта партия СОЗДАЁТ союз между вами и им.#! Не дверь, в которую можно постучаться потом, а сам союз — в тот день, когда договор скреплён, едва эти двое обвенчаны или обручены. Это правило самой игры, ровно то же, которому следует её #high «$arrange_marriage_interaction$»#!: она смотрит, насколько близко каждый из двоих в родстве с тем правителем, что его отдаёт, — и здесь пара близка с обеих сторон. Больше от вас ничего не требуется, и отказать он не может: союз приходит вместе с договором.\n\n#high Это [SCOPE.ScriptValue('tnt_stage_alliance_offer_value')|+=0] очков договора — и они УЖЕ ВНУТРИ числа, напечатанного за эту партию выше. Не прибавляйте их второй раз.#! За союз договор платит один раз: если союз уже открывает пара, лежащая на столе, эта не добавляет к цене ничего, а становится второй причиной, на которой держится пакт."
 tnt_stage_alliance_shut_tt:0 "#high Эта партия НЕ создаёт союза.#! Игра меряет, насколько близко каждый из двоих в родстве с тем правителем, который его отдаёт, складывает оба расстояния и допускает союз, лишь пока эта сумма невелика. Брак двух придворных не роднит никого за столом — такая пара не даёт союза; чужак, выбранный в вашем же зале, ничем не лучше. Отдайте свою кровь за его — ребёнка, внука, брата или сестру, родителя — или встаньте под венец сами, и сумма уложится в предел игры. Это то же правило, по которому работает её собственное #high «$arrange_marriage_interaction$»#!, и считают его сразу с обеих сторон: близкий выбор с вашей стороны не искупит дальнего с его."
 # *** 2026-08-24 — ТРЕТИЙ ВЕРДИКТ. ОН ПОЯВИЛСЯ ПОТОМУ, ЧТО КЛЮЧ ОТКАЗА НАЗЫВАЛ
 # *** УЖЕ СОЮЗНОМУ ИГРОКУ НЕВЕРНУЮ ПРИЧИНУ. *** У `if`, который печатает ключ
 # согласия, появилась ВТОРАЯ строка — правители не должны быть в союзе уже
 # сейчас, чтобы вердикт и цена умирали на одном и том же входе, — а стоявший за
 # ним `else` по-прежнему объяснял любой отказ ОДНОЙ ЛИШЬ дальностью родства и
 # советовал отдать свою кровь за кровь партнёра. Тот, кто уже в союзе с
 # партнёром и ставит собственного сына против его дочери, проходит правило
 # родства без единой оговорки, читает этот совет и принимает его за указание
 # сделать ровно то, что он только что сделал; дальше он перебирает всё более
 # близкую родню и всякий раз получает тот же отказ с тем же ложным объяснением.
 # Вместо этого вердикт разделён на три ветви, и данный ключ — средняя из них
 # (common\character_interactions\tnt_12_marriage_picker.txt, on_accept).
 # СТРОКА УСЛОВНА, ПОТОМУ ЧТО УСЛОВНА САМА ВЕТВЬ. Она срабатывает независимо от
 # того, проходит пара правило родства или нет, поэтому утверждать она вправе
 # лишь достоверное — нового пакта нет, очков договора за союз нет, второй платы
 # нет — и никогда не вправе заявлять, что пара подходит. Половина «если пара
 # достаточно близка» — это словами высказанная асимметрия, которая уже
 # отгружена: ДАРОВАНИЕ намеренно не несёт проверки на существующий союз, ведь
 # каждый подходящий брак записывается ещё одной причиной, на которой держится
 # пакт (tnt_34_marriage.txt:2274-2290), а ЦЕНА такую проверку несёт, чтобы никто
 # не заплатил дважды. Два вопроса — две проверки; сводить их воедино нельзя.
 # НИ ОДНОГО КВАДРАТНОГО ТОКЕНА И НИ ОДНОГО ВЛОЖЕННОГО КЛЮЧА — намеренно. Закон
 # 10a сюда не дотягивается: это custom_tooltip взаимодействия, а не путь
 # BuildTooltip, — но ключу они и не нужны, а отсутствие токенов безопаснее.
 tnt_stage_alliance_already_tt:0 "#high Вы уже в союзе с ним, поэтому эта партия не открывает нового пакта.#! Пакт, который у вас уже есть, нельзя заключить дважды: за союз к этой партии не прибавится ни одного очка договора, и платы за него договор не возьмёт. Если пара достаточно близка по крови и правило самой игры её принимает, венчание просто запишется ещё одной причиной, на которой держится ваш нынешний союз; если же нет — союз останется ровно таким, каким был. В любом случае сама партия по-прежнему стоит очков, напечатанных выше, а пакт между вами и им остаётся нетронутым."
 # ДВЕ ПОДПИСИ, КОТОРЫЕ ДВИЖОК СОБИРАЕТ ИЗ ИМЕНИ ВЗАИМОДЕЙСТВИЯ, — и причина, по
 # которой на экране висел сырой ключ «actor_secondary_tnt_stage_marriage_interaction»:
 # сватовскому взаимодействию нужны actor_secondary_<имя> и recipient_secondary_<имя>
 # для двух выбранных персонажей. Ванильная пара —
 # GAME\localization\english\interactions_l_english.yml:252-255
 #   actor_secondary_arrange_marriage_interaction:0 "[spouse|E]"
 #   recipient_secondary_arrange_marriage_interaction:0 "[spouse|E]"
 # Ваниль пишет «супруг», потому что она устраивает свадьбу. Мы вносим запись в
 # договор, поэтому подпись называет СТОРОНУ — единственное, чего не прочитать по
 # портрету. Два слова: это подпись под портретом, а не фраза.
 actor_secondary_tnt_stage_marriage_interaction:0 "Ваш кандидат"
 recipient_secondary_tnt_stage_marriage_interaction:0 "Их кандидат"
 # ОЧКИ ПРЯМО В ВАНИЛЬНОМ ОКНЕ, В ТОТ МОМЕНТ, КОГДА ВЫБРАНЫ ОБА. Это
 # custom_tooltip из on_accept взаимодействия tnt_stage_marriage_interaction;
 # движок рисует его в блоке, который существует только при выбранной паре
 # (interaction_marriage.gui:182, :216). `SCOPE` — ванильный токен «тот скриптовый
 # контекст, в котором разворачивается этот текст», и именно он проносит
 # scope:tnt_sp / scope:tnt_sr / scope:tnt_p внутрь script value; ровно эта форма
 # стоит в council_tasks_l_english.yml:83. Значения делегируют расчёт той же
 # формуле пары, что и сама сделка, — но «делегирует» и «равно числу в центре окна
 # переговоров» это РАЗНЫЕ утверждения, и ТРИ раунда подряд этот ключ печатал не
 # ту величину.
 # *** ПЕРВЫЙ РАУНД ПЕРЕПИСАЛ ОБЕЩАНИЕ. ВТОРОЙ ПОМЕНЯЛ ЧИСЛО НА СТРОКУ ЛИСТА.
 # *** ТРЕТИЙ ПЕРЕСТАЛ УГАДЫВАТЬ И ПЕЧАТАЕТ АРИФМЕТИКУ САМИХ ВЕСОВ. *** Третий
 # отчёт назвал причину, которую первые два не увидели: «рассинхрон — пишется
 # „очков за этот брак -9“ в превью пары, а на деле в сделке появляется +106
 # (думаю, это из-за силы союза)». Так и есть: -9 + 115 = +106, где 115 — это
 # tnt_alliance_worth_value, плата за союз, который брак СОЗДАЁТ. Любой прежний
 # заголовок — tnt_stage_pair_net_value в первом раунде, tnt_stage_pair_raw_net_value
 # во втором — был парой БЕЗ этого слагаемого, поэтому никакая формулировка не
 # могла свести два числа: свести их могло только само слагаемое.
 # ПОЭТОМУ ЗАГОЛОВОК ТЕПЕРЬ ПЕЧАТАЕТ tnt_stage_pair_deal_delta_value = предложено
 # минус запрошено плюс союз — слагаемое к слагаемому то, на сколько сдвинется
 # tnt_ai_accept_value, когда пара встанет на стол, и с тем же `round = yes`. Три
 # слагаемых напечатаны строкой ниже В ТОМ ПОРЯДКЕ, В КАКОМ ОНИ СКЛАДЫВАЮТСЯ,
 # чтобы сумму можно было проверить глазами, а строка про союз прямо говорит, что
 # он УЖЕ ВНУТРИ заголовка, а не сверх него, — именно это сложение прежде
 # предлагал сделать в уме tnt_stage_alliance_opens_tt, и именно его игрок не
 # сделал. Число строки листа сохранило собственную подписанную строку, так что
 # ничего не отняли. Полный разбор — в шапке tnt_stage_pair_deal_delta_value.
 # ЕДИНСТВЕННЫЙ ОСТАТОК НАЗВАН НА ЭКРАНЕ, А НЕ СПРЯТАН: со второй пары скидка за
 # объём делает дельту завышенной на несколько очков (почему точность там стоила
 # бы второй копии лестницы скидки — сказано в шапке значения).
 tnt_stage_pair_points_line:0 "Эта партия сдвигает договор на [SCOPE.ScriptValue('tnt_stage_pair_deal_delta_value')|+=0] — ровно настолько сдвинутся весы в окне переговоров, когда вы её добавите.\n#weak Предлагаем [SCOPE.ScriptValue('tnt_stage_pair_gain_value')|0], просим [SCOPE.ScriptValue('tnt_stage_pair_loss_value')|0], и союз, который создаёт этот брак, — [SCOPE.ScriptValue('tnt_stage_alliance_offer_value')|+=0]. Эти три числа И ЕСТЬ число выше: союз уже внутри него, а не сверх него. Предложенное вами он ценит с множителем ×[SCOPE.ScriptValue('tnt_deal_mult_value')|2], а большая свадьба, если её пообещать, стоит [SCOPE.ScriptValue('tnt_stage_grand_offer_value')|+=0] из этого предложения.#!\n#weak СОБСТВЕННАЯ строка этой пары в договоре несёт другое число: [SCOPE.ScriptValue('tnt_stage_pair_raw_net_value')|+=0] — сам брак, без его расположения и без союза. Верны оба; на весах показано первое.#!\n#weak Со второго брака в одном договоре первое число — ОЦЕНКА, а не точный сдвиг: скидка за объём применяется ко всей стопке браков, а большая свадьба и страх между вами двумя оплачиваются ОДИН РАЗ ЗА ДОГОВОР, но учитываются заново в строке каждого брака. Ошибка может достигать десятков очков в любую сторону. На первом браке число точное.#!"
 # =====================================================================
 # ТО ЖЕ ЧИСЛО, ПОВЕШЕННОЕ НА САМУ ОПЦИЮ. Движок пересобирает current_description
 # опции при её переключении — поле для этого и существует, — тогда как для описания
 # эффектов взаимодействия такой гарантии нет, из-за чего галочка и выглядела
 # бездействующей. `$GRAND_WEDDING_PROMISE_INFO$` — ванильный текст этой опции
 # (00_marriage_interactions.txt:780), оставлен впереди, чтобы игрок по-прежнему
 # читал, ЧТО такое большая свадьба.
 # РАУНД 9 — ЛОВУШКА, У КОТОРОЙ НЕ БЫЛО НИ СТРОЧКИ ТЕКСТА, а провалиться в неё
 # игрок может по-настоящему. tnt_wed_grand_pair_effect (tnt_34_marriage.txt)
 # вызывает create_betrothal для главной пары даже тогда, когда обоим за 16, и если
 # движок это принимает, пара с этого момента несёт promised_grand_wedding_*.
 # Ванильная тревога-завершение после этого явным NOR отказывается на них
 # срабатывать — GAME\common\important_actions\00_marriage_actions.txt:147-150, где
 # ваниль сама пишет, что такой паре «should trigger the specific Organize Grand
 # Wedding action», — а единственный выход назван в
 # GAME\localization\english\game_concepts_l_english.yml:525: «Grand Wedding
 # Betrothals are converted into a Marriage by completing a wedding activity».
 # Игрок, не устроивший пир, остаётся с вечной помолвкой и без единой подсказки.
 # НОЛЬ НОВЫХ КЛЮЧЕЙ: одно предложение дописано к строке, которая и так описывает
 # эту опцию, потому что её тултип — единственное место, где предупреждение читают
 # в момент выбора. Сама ванильная механика НЕ трогается.
 tnt_stage_grand_info:0 "$GRAND_WEDDING_PROMISE_INFO$\n\n#high Стоит [SCOPE.ScriptValue('tnt_stage_grand_offer_value')|+=0] очков договора#! за эту пару — сверх ценности самого брака.\n\n#weak Пара останется ОБРУЧЁННОЙ, пока вы и вправду не проведёте торжество. #high Союз пира не ждёт#! — он стоит на самой помолвке со дня, когда скреплён договор, и держится ровно столько, сколько держится эта помолвка. Обычная игровая тревога об обручённых, которым уже пора под венец, на такую пару намеренно молчит — вместо неё эту пару ведёт тревога «Устроить пышную свадьбу», и приходит она тому, кто дал обещание.#!"
 # ТЕЛО РЯДОМ С ПАНЕЛЬЮ. Это последнее, что игрок читает перед тем, как нажать
 # кнопку, подписанную не нами, - поэтому здесь эта подпись названа вслух.
 # АБЗАЦ ПРО СОЮЗЫ ВОЗВРАЩЁН СЮДА ИЗ tnt_btn_stage_marriage_tip. В английском
 # файле он всегда стоял на этом ключе, в русском — на подсказке кнопки, и из-за
 # этого расхождения русский игрок читал предупреждение не в том окне, о котором
 # оно говорит: «Игра рисует в ЭТОМ окне свои подсказки про союзы» на подсказке
 # кнопки указывало в пустоту, а в самом окне брака — единственном, где игра эти
 # подсказки и рисует, — предупреждения не было вовсе. Ключ служит полем `desc`
 # взаимодействия (common\character_interactions\tnt_12_marriage_picker.txt:101),
 # то есть шапкой ванильного окна брака, — это и есть то самое «это окно».
 # ПУНКТ 4 V15: пятый абзац объявлял союз «отдельным условием договора со своей ценой,
 # добавлять его или нет — ваше решение». Ни такого условия, ни такой цены нет: строка
 # союза выведена. Прежде эта фраза уже правилась (из «Союз есть отдельным условием» в
 # «Союз — отдельное условие»: первый оборот не по-русски) — теперь заменена целиком.
 # Обоснование отказа и ссылки на ваниль — в комментарии к ключу
 # tnt_stage_no_alliance_tt выше; здесь короткая форма, потому что следующий абзац и так
 # несёт полезную половину.
 # ПУНКТ 5: короткая форма подсказки — в закрывающем абзаце. Полное изложение
 # ванильного условия со ссылками на файл и строки лежит на ключе
 # tnt_stage_no_alliance_tt выше; здесь игроку достаточно понять, что БЛИЗКУЮ
 # партию стоит выбирать, и что именно она даёт ему потом.
 # РАУНД 11 — ВТОРОЙ АБЗАЦ ЦИТИРУЕТ ВАНИЛЬНУЮ КНОПКУ, И ОДИН ЯЗЫК ВЫДУМАЛ СВОЮ.
 # Надпись — ванильный send_marriage_proposal_button_name
 # (GAME\localization\<lang>\tutorial_l_<lang>.yml:268, english :325), привязка —
 # GAME\gui\interaction_marriage.gui:229. Она процитирована ПРОСТЫМ ТЕКСТОМ, а не
 # как $send_marriage_proposal_button_name$, чтобы фраза несла кавычки своего
 # языка, — именно поэтому она и способна разойтись с оригиналом. Замерено в этом
 # раунде по всем девяти: восемь совпали с ванилью дословно; simp_chinese
 # цитировал наш собственный перевод «Send Proposal», тогда как кнопка на том
 # языке читается 求婚 (tutorial_l_simp_chinese.yml:268). Исправлено только там.
 # КНОПКУ ЦИТИРУЮТ ДВА КЛЮЧА, А НЕ ОДИН, и второй легко пропустить — он лежит в
 # другом разделе: tnt_btn_stage_marriage_tip, подсказка кнопки запуска в
 # gui\tnt_panel_marriage.gui. У simp_chinese там стояла та же неверная надпись;
 # исправлено тем же правкой. НЕ третья площадка: tnt_confirm_opt_yes — НАШ
 # СОБСТВЕННЫЙ заголовок опции («Отправить предложение») в событии подтверждения
 # договора, к ванильной кнопке отношения не имеет; совпадение русского значения
 # с ванильным случайно и «сводить» их нельзя ни в ту, ни в другую сторону.
 # ЛЮБОЙ РАУНД, ПРАВЯЩИЙ ЛЮБОЙ ИЗ ЭТИХ КЛЮЧЕЙ, ОБЯЗАН СВЕРИТЬ ЦИТАТУ С ВАНИЛЬНЫМ
 # ЗНАЧЕНИЕМ НА ТОМ ЖЕ ЯЗЫКЕ: неверная надпись отправляет игрока искать кнопку,
 # которой на экране нет.
 tnt_stage_marriage_desc:0 "Вы выбираете брачную партию для договора, который лежит на столе. #high Вы не отправляете предложение о браке.#!\n\nШирокая кнопка ниже подписана самой игрой — #high «Отправить предложение»#!, — и этой надписи здесь не изменить. Она никому ничего не отправляет и никого не венчает: она вносит эту пару в обсуждаемый договор, рядом с золотом и землями, и условия договора пересчитываются уже вместе с ней.\n\n#high Никого не обвенчают и не обручат, пока другая сторона не примет договор целиком.#! Если в договоре откажут или его бросят, партия просто не состоится.\n\n#weak Выберите по одному человеку от каждого двора, укажите линию наследования и подтвердите. Возвращаться сюда можно сколько угодно раз: договор выдержит любое число пар.#!\n\n#weak Игра рисует в этом окне свои подсказки про союзы — #high теперь им снова можно верить#!. Партия, вписанная в договор, несёт тот же союз, что несёт её собственное #high «$arrange_marriage_interaction$»#!, и по правилу самой игры: она смотрит, насколько близко каждый из двоих в родстве с тем правителем, что его отдаёт, и если пара достаточно близка с обеих сторон, вы с ним становитесь союзниками в тот самый миг, когда договор скреплён.#!\n\n#weak Приговор о паре, которую вы и вправду выбрали, напечатан выше — и это ответ самой игры, а не догадка: и строку, и сам союз решает одна и та же проверка. Брак двух придворных по-прежнему не даёт союза никому. Союз держится на самой паре: он живёт ровно столько, сколько стоит их брак; а если кто-то из двоих ещё ребёнок, он с первого же дня стоит на помолвке.#!"
 # КНОПКА ОТКРЫТИЯ в брачной панели договора (gui\tnt_panel_marriage.gui).
 # «Обычный экран» - это честно: именно его игра открывает для простого брака.
 tnt_btn_stage_marriage:0 "Выбрать пару на обычном экране брака"
 # ФИКС 3 V4. Строка в центре теперь кнопка (тип tnt_action_line), а кнопка —
 # единственный виджет строки, которого может касаться мышь, поэтому описанию самого
 # условия больше негде жить: оно приклеено перед подсказкой кнопки здесь. Вставка
 # `$КЛЮЧ$` — ванильный механизм, только в английской локализации игры 359 таких
 # вставок вида `$…_desc$`.
 tnt_btn_stage_marriage_full:0 "$tnt_item_marriage_desc$\n\n$tnt_btn_stage_marriage_tip$"
 # Её подсказка. Она обязана нести всё предупреждение ОДНА: игрок, который верит
 # подсказке и щёлкает сразу, больше ничего нашего не прочтёт, пока перед ним не
 # окажется родная надпись игры.
 tnt_btn_stage_marriage_tip:0 "Откроет привычный игровой экран брака: оба двора рядом, все отборы и поиск, два портрета и линия наследования.\n\n#high Никого не венчает.#! Пара, которую вы там подтвердите, вносится в этот договор, а венчание — или обручение, если кто-то из двоих ещё ребёнок, — состоится лишь тогда, когда договор будет принят целиком.\n\n#weak Помните о надписи самой игры: широкая кнопка в том окне подписана «Отправить предложение». Никакого предложения она никому не отправляет — она добавляет пару сюда. Тех же двоих можно выбрать и вручную в списках ниже, и только там уже внесённой в договор паре можно сменить линию наследования.#!"
 # Строка рядом с кнопкой, на самой панели. Одна строка - и в ней то единственное,
 # что нельзя понять неверно.
 tnt_marriage_stage_note:0 "#weak Ничего не отправляется и никого не венчают — пара вносится в этот договор.#!"
 # ДВА ОТКАЗА, КОТОРЫЕ НУЖНЫ ПЕРЕКЛЮЧАТЕЛЮ БОЛЬШОЙ СВАДЬБЫ В ОДОЛЖЕННОМ ОКНЕ.
 # tnt_err_grand_host укладывает в одну фразу весь семистрочный запрет для
 # устроителя (T44 tnt_wed_host_gate_trigger; родные строки игры -
 # 00_marriage_interactions.txt:763-793), потому что у переключателя есть место
 # ровно на одну; шесть ключей tnt_err_grand_* из раздела P2 по-прежнему отвечают
 # за наш собственный переключатель и называют причины по одной.
 tnt_err_grand_host:0 "Сейчас вам не обещать большую свадьбу: нужен землевладелец выше барона по титулу, дополнение #high Tours & Tournaments#! с расширенными занятиями, золото на приём — и чтобы за вами не оставалось прежнего обещания.\n\n#weak И это именно обещание: отмеченную пару обручают, вы становитесь обещанным устроителем, а созвать гостей и заплатить за торжество придётся вам самим. Если срок истечёт, нарушенное слово вам не забудут.#!"
 tnt_err_grand_taken:0 "Большая свадьба в этом договоре уже обещана. Сначала снимите отметку в брачной панели самого договора: один договор — одно торжество, одна отмеченная пара."

 # =========================================================================
 # ВСТУПИТЕЛЬНОЕ СОБЫТИЕ (12) - пункт 23 задания, events\tnt_intro_events.txt
 # Один праймер в виде письма при первом снятии паузы. Его desc СОБИРАЕТСЯ из
 # четырёх швов: главный абзац, ОДНА строка частоты по настройке
 # tnt_ai_offer_rate, ОДНА строка мира по настройке tnt_ai_treaties и
 # заключительная подсказка. Правила швов несущие: tnt_intro_desc_main
 # ЗАКАНЧИВАЕТСЯ на \n\n; каждая строка tnt_intro_desc_world_* НАЧИНАЕТСЯ с
 # одного пробела, потому что продолжает абзац строки частоты;
 # tnt_intro_desc_close НАЧИНАЕТСЯ с \n\n. Заключительная строка цитирует
 # надпись кнопки tnt_open_negotiations точно так, как она издана на каждом
 # языке.
 # =========================================================================
 tnt_intro_title:0 "Искусство договора"
 tnt_intro_desc_main:0 "Из вашей канцелярии разошлась весть: отныне этот двор ведёт переговоры по-новому. Любого правителя можно позвать к столу — золото кладётся против присяги, невеста против перемирия, услуга против короны, — и всякое условие ложится на одни весы, одни и те же для обеих сторон.\n\n"
 tnt_intro_desc_rate_normal:0 "Ждите посольств время от времени: за год до вас доберётся не больше одного письма со всего света разом, а правитель, однажды написавший, года три вынашивает новое предложение."
 tnt_intro_desc_rate_frequent:0 "Ждите, что дорога к вашим воротам не будет пустовать: от посольства до посольства едва ли пройдёт полгода, и правители будут возвращаться к мысли о вас уже через год."
 tnt_intro_desc_rate_rare:0 "Ждите долгого молчания: между письмами будут проходить годы, и просить чаще придётся вам самим."
 tnt_intro_desc_rate_off:0 "Писем не будет: ваши ворота затворены для посольств, и всякий торг начнётся с вас."
 tnt_intro_desc_rate_test:0 "Гонцам велено не ехать, а бежать: предложение отыщет вас в первые же месяцы. Шаг проверочный, не придворный."
 tnt_intro_desc_world_rare:0 " За вашими рубежами те же весы служат тихо: время от времени два двора заключат собственную сделку, и вы узнаете о ней, когда она вас коснётся."
 tnt_intro_desc_world_common:0 " За вашими рубежами те же весы не знают покоя: чужие дворы заключают сделки между собой круглый год."
 tnt_intro_desc_world_off:0 " За вашими рубежами всё по старине: новый обычай в ходу лишь за теми столами, где сидите вы сами."
 tnt_intro_desc_close:0 "\n\nЧтобы самому позвать правителя к столу, щёлкните по нему правой кнопкой мыши и выберите #high «Начать переговоры о договоре»#!."
 tnt_intro_opt_ok:0 "Что ж, к столу."

