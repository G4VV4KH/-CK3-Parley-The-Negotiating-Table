 # V3, ИТЕРАЦИЯ 2: эта строка больше не описывает постоянное требование в 15..95
 # очков. Значение идёт от 0 до 40 и равно 0 для обычного по нраву партнёра,
 # который не выше вас титулом; оно растёт лишь от жадности, гордости и разницы в
