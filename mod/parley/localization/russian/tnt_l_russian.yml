  # --- P2. Неограниченное число браков и обещание большой свадьбы (29) ------
  #     СБОРКА 3, ИТЕРАЦИЯ 4, дословно по просьбе игрока: «неограниченное число
  #     браков в одной сделке и опция БОЛЬШОЙ СВАДЬБЫ».
  #
  # ТЕПЕРЬ СДЕЛКА ХРАНИТ СПИСОК ПАР — tnt_wed_list, по одному элементу на пару.
  # Элемент — это супруг СО СТОРОНЫ ИГРОКА, а вторая половина пары хранится НА
  # ЭТОМ ЖЕ персонаже как tnt_wed_partner: у списков переменных CK3 нет доступа
  # по индексу ни из скрипта, ни из интерфейса, поэтому два параллельных списка
  # никогда нельзя было бы свести в пары. Всё, что ниже называет пару, читает её
  # с ОДНОГО персонажа: tnt_wed_pair_row и tnt_wed_row_line вычисляются с
  # Character самой строки в контексте, а у tnt_wed_grand_couple строки нет,
  # поэтому он идёт через tnt_wed_principal.
  #
  # ПОЧЕМУ СЧЁТ СЧИТАЕТСЯ В ЛОКАЛИЗАЦИИ, А НЕ ЗНАЧЕНИЕМ СКРИПТА. В .gui `text =`
  # это одно выражение, и передать параметр в ключ локализации оно не может — та
  # же причина, по которой счётчики раздела Q выглядят именно так. Зато сама
  # локализация умеет читать размер модели данных, и оригинал делает это в
  # GAME\localization\english\ledger\ledger_filtersorts_l_english.yml:441.
  # Поэтому никакого нового значения изобретать не пришлось (закон R2), а число
  # не может разойтись со списком, потому что оно И ЕСТЬ список.
  #
  # СЛОВО «ОБЕЩАНИЕ» НЕСЁТ НАГРУЗКУ И НЕ ЯВЛЯЕТСЯ ОГОВОРКОЙ. Механика — родная,
  # set_grand_wedding_betrothal_variables: отмеченную пару ОБРУЧАЮТ, игрок
  # становится обещанным устроителем, идёт отсчёт срока, и игра сама
  # предупреждает его перед истечением. Мод не создаёт и не назначает никакого
  # мероприятия — устроить и оплатить торжество остаётся заботой хозяина, а за
  # нарушенное слово наказывает сама игра. Ни один ключ этого раздела нельзя
  # переписать так, будто свадьба «состоится».
