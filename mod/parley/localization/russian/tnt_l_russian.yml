 # --- T. Союз внутри одной державы (0) -----------------------------------
 # Сборка 3 разрешает союз между сюзереном и его вассалом; призвать по такому
 # союзу по-прежнему нельзя ни в одну сторону
 # (GAME\common\scripted_triggers\00_war_and_peace_triggers.txt:166-221), и
 # tnt_item_alliance_desc в разделе C прямо об этом говорит. Особая строка,
 # которая переименовывала себя по этому случаю — второй, слабый вид союза, —
 # УБРАНА постановлением о единообразных союзах (короб REMOVED в
 # tnt_41_gates.txt:93): .gui теперь привязывает простые ключи, так что пара
 # переименования tnt_item_alliance_inrealm / tnt_tt_ally_inrealm потеряла
 # последнего читателя и изъята из обоих языков.
 # FORWARD (автор values). Понадобится только если баланс примет рекомендацию
 # раздела 1.8 файла NOTES3-gates и оценит союз внутри державы в 0,35 от
 # призывного. [DESC ROW] БЕЗ МАКРОСА ЗНАЧЕНИЯ.

 # --- U. Скрытие недоступных строк (1) -----------------------------------
