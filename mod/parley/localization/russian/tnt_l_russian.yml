 # Решение о демонтаже мода (common\decisions\tnt_86_uninstall.txt): уборка
 # сохранения перед отпиской, та же пятиключевая схема, что у пары о послах
 # выше. Всё тело решения — удаление переменных, которое не рисует
 # автоподсказки (закон 10), поэтому ключ _effect_tt несёт все последствия
 # целиком: что удалено (всё написанное модом, у всех персонажей), что
 # аннулировано (неотвеченные письма, незавершённые переговоры), что
 # остаётся (каждый заключённый договор — ванильные итоги) и порядок
 # действий «сохранить, затем отключить».
 # Заголовок ГРУППЫ решений об удалении мода. Ключ собирается движком как
 # "decision_group_type" + <ключ>, поэтому он не начинается с tnt_
 # (GAME\common\decision_group_types\_decision_group_types.info:1). Сама группа
 # объявлена в common\decision_group_types\tnt_92_decision_groups.txt и держит
 # ОБА решения об удалении - это и решение аддона MCA, - так что панель
 # показывает ОДИН сворачиваемый заголовок внизу списка вместо двух кнопок,
 # стоящих среди игровых решений. Ванильная схема названий - «<X> решения»
 # (decision_group_types_l_russian.yml). Ни [..], ни #разметки по замыслу.
 decision_group_type_tnt_uninstall:0 "Решения, связанные с удалением модов"
 tnt_uninstall_decision:0 "Убрать стол переговоров"
 tnt_uninstall_decision_desc:0 "Послы распущены, записи сожжены, сам стол вынесен из залы. Примите это решение непосредственно перед отключением мода: оно вычищает из сохранения все следы «Парлея». Неотвеченные письма и незавершённые переговоры аннулируются; все уже заключённые договоры остаются в силе."
 tnt_uninstall_decision_tooltip:0 "Готовит это сохранение к игре без Parley: The Negotiating Table. Удаляет все переменные, весь компромат и все модификаторы отношения, созданные модом, у всех персонажей мира. Итоги заключённых сделок — браки, переданные титулы, вассальные клятвы — не затрагиваются."
 tnt_uninstall_decision_confirm:0 "Вымести дочиста"
 tnt_uninstall_decision_effect_tt:0 "Все переменные, списки, метки, компромат и модификаторы отношения, созданные модом, удалены у всех персонажей мира. Неотвеченные письма и незавершённые переговоры аннулированы. Сохраните игру и лишь затем отключите мод: сохранение теперь свободно от «Парлея»."

 # --- W. ВЫВЕДЕНО: три взаимодействия для ИИ ------------------------------
 # Этапы B и C-1 везли здесь три обычных взаимодействия персонажа — 46 ключей
 # обрамления, заголовков options_heading, подписей send_option и строк
 # разбора согласия. Файл, который их определял, удалён, а предложение ИИ
 # теперь приходит письмом из раздела V, поэтому ключи уходили постепенно;
 # последние шесть (два options_heading и четыре подписи send_option, всё ещё
 # вставлявшие токены $TWD_*$ из localization_values, кормить которые больше
 # нечему) изъяты из обоих языков зачисткой неиспользуемых ключей.

 # --- X. Сообщения о договорах между ИИ (10) - этап C-2 ------------------
 # ЗАГОЛОВОК ОБЩИЙ НАМЕРЕННО. Сообщение рисуется из ленты много позже, чем
 # отработал эффект, поэтому обращаться из его локализации к временному
 # сохранённому scope небезопасно; личности несут left_icon и right_icon, а вид
 # договора — custom_tooltip.
 tnt_ai_msg_treaty:0 "Заключён договор"
 # V13, ПУНКТ 1: две следующие строки ОСИРОТЕЛИ и ОСТАВЛЕНЫ ЗАДАННЫМИ.
 # Песочница не составляла ничего, кроме союзов и перемирий, поэтому вывод двух
 # условий забрал у неё оба самых частых договора; замена — продажа артефакта и
 # брак ниже. См. заметку над tnt_item_alliance в разделе C.
 tnt_ai_msg_tt_truce:0 "Они купили золотом десять лет мира."
 tnt_ai_msg_tt_ally:0 "Они купили золотом военный союз."
 tnt_ai_msg_tt_hook:0 "Теперь один должен другому услугу, купленную за золото."
 # Расширение 1 V4, архетип A5. Формулировка говорит лишь то, что соседи и правда
 # видят: золото ушло в одну сторону, а обратно ничего не пришло, — и называет
 # причину, не утверждая, будто война была объявлена вслух.
 # Пункт A2 V4, архетип A6. Соседи видят то же, что и при ультиматуме, — золото ушло
 # в одну сторону; разница в причине, а долг — причина, которую стоит назвать.
 tnt_ai_msg_tt_hookcall:0 "Долг взыскан: один держал над другим [Concept('hook', 'крючок')|E] и получил своё золотом."
 tnt_ai_msg_tt_ultimatum:0 "Золото ушло только в одну сторону: тот, кто слабее, заплатил за то, чтобы его оставили в покое."
 # Волна отменённого запрета, E20/E21 (tnt_38_ai_world.txt:1516, :1579). Тот же
 # регистр, что у пяти выше: только то, что видят соседи, и без ссылок на
 # персонажей — лента рисует сообщение, когда scope уже мертвы.
 tnt_ai_msg_tt_title:0 "Земля перешла из рук в руки за золото: один из двух государей купил у другого графство."
 tnt_ai_msg_tt_vassal:0 "Держава преклонила колено: слабейший государь присягнул сильнейшему — за золото и покровительство."
 tnt_ai_msg_tt_submission:0 "Держава подчинилась под угрозой: несоизмеримо более сильный государь принудил слабого независимого соседа к вассальной присяге без платы."
 # ЗАМЕНА ПО ПУНКТУ 1 V13. Вывод союза и пакта опустошил песочницу договоров
 # между ИИ, забрав два самых частых её договора, и постановление пользователя
 # было дать миру новый материал, а не позволить ему затихнуть. Эти две
 # подсказки закрывают продажу артефакта и брак между двумя домами ИИ. Регистр
 # тот же, что у шести выше, и по той же причине: лента рисует сообщение много
 # позже, чем отработал эффект, поэтому оно вправе говорить лишь то, что видят
 # соседи, и не вправе называть персонажей.
 tnt_ai_msg_tt_artifact:0 "Сокровище перешло из рук в руки за золото: один из двух государей выкупил у другого вещь из его палат."
 tnt_ai_msg_tt_wed:0 "Два дома соединились: государи сговорились о браке между своими родичами, и с ним отошло приданое золотом."

 # --- Y. Правило игры «договоры между ИИ» (7) ----------------------------
 # Второе дозволенное исключение из закона о префиксе tnt_. Три значения _desc —
 # это то место, где правило ОПИСАНО для игрока, чего и требует задание: каждое
 # называет частоту, называет всё, чем молчаливый пульс вообще может
 # торговать — теперь включая продажу графства и оплаченную присягу E20/E21, —
 # и называет цену.
 # Правило запирает ОДНО: молчаливый пульс договоров между ИИ из
 # tnt_72_ai_world.txt.
 # НАДГРОБИЕ 2026-08-19. Фраза, что стояла здесь прежде, — «оно НЕ запирает три
 # взаимодействия раздела W, обычные взаимодействия, которые игрок видит и на
 # которые отвечает», — вычеркнута как ложная в обеих половинах. Раздел W
 # УПРАЗДНЁН (о том говорит его собственный заголовок), а файл, о котором она
 # спорила, common\character_interactions\tnt_11_ai_interactions.txt, НИКОГДА НЕ
 # ПОСТАВЛЯЛСЯ — см. надгробие в tnt_81_ai_rules.txt:11-20. Пульс — единственное,
 # что это правило когда-либо запирало. Сохранено, а не удалено, чтобы неверное
 # утверждение не было высказано вновь.
 rule_tnt_ai_treaties:0 "Parley: договоры между ИИ"
 setting_tnt_ai_treaties_off:0 "Отключены"
 setting_tnt_ai_treaties_off_desc:0 "Правители под управлением ИИ никогда не заключают договоров друг с другом за вашей спиной.\n\n#weak Не стоит ровно ничего: одна проверка в год и больше никакой работы. ИИ по-прежнему может торговаться #high с вами#!.#!"
 setting_tnt_ai_treaties_rare:0 "Редко"
 setting_tnt_ai_treaties_rare_desc:0 "Соседние правители под управлением ИИ время от времени сговариваются между собой — примерно горстка договоров в год на всю карту.\n\nТак молча торгуют золотом, услугами, взысканными долгами, ультиматумами и артефактами; там, где правители уже дружны, может быть продано за полную цену пограничное графство, а более слабому соседу — заплачено за вассальную присягу. Король или император с подавляющим перевесом может вместо этого угрозой принудить слабого независимого соседа к вассальной присяге. #high Браки между домами тоже заключаются молча, и никого не спрашивают.#! Вам сообщат о всяком договоре, в котором участвует тот, с кем вы граничите, состоите в союзе или воюете."
 setting_tnt_ai_treaties_common:0 "Часто"
 setting_tnt_ai_treaties_common_desc:0 "Примерно втрое чаще, чем «Редко», — для карты, где дворы не умолкают.\n\nТе же обмениваемые условия и тот же трёхлетний предел на каждого правителя, поэтому разогнаться этому некуда.\n\n#weak Это значение по умолчанию.#!"

 # Как часто правитель под управлением ИИ сам присылает ВАМ готовое предложение письмом.
 rule_tnt_ai_offer_rate:0 "Parley: предложения вам"
 setting_tnt_ai_offer_rate_off:0 "Никогда"
 setting_tnt_ai_offer_rate_off_desc:0 "Ни один правитель не напишет вам со своим договором.\n\n#weak Вы по-прежнему можете начать переговоры с кем угодно сами, а правители под управлением ИИ по-прежнему договариваются между собой, если это разрешено соответствующим правилом.#!"
 setting_tnt_ai_offer_rate_rare:0 "Редко"
 setting_tnt_ai_offer_rate_rare_desc:0 "Письмо приходит лишь время от времени — между посольствами проходят годы.\n\n#weak Для партии, где просить предпочитаете вы.#!"
 setting_tnt_ai_offer_rate_normal:0 "Обычно"
 setting_tnt_ai_offer_rate_normal_desc:0 "Сосед пишет вам не чаще раза в год, а каждый правитель выжидает три года, прежде чем составить новое предложение."
 setting_tnt_ai_offer_rate_frequent:0 "Часто"
 setting_tnt_ai_offer_rate_frequent_desc:0 "Посольства являются несколько раз в год, и правители возвращаются к мысли о вас гораздо быстрее.\n\nКаждое предложение по-прежнему оценивается теми же весами, что вы видите в окне переговоров, поэтому оживлённая карта не означает щедрой.\n\n#weak Это значение по умолчанию.#!"
 setting_tnt_ai_offer_rate_test:0 "Проверка — очень часто"
 setting_tnt_ai_offer_rate_test_desc:0 "#N Для проверки мода, а не для игры.#! Сроки ожидания сокращены до нескольких недель, так что предложение должно дойти до вас в первые месяцы партии.\n\n#weak Убедитесь, что письма работают, и верните правило на «Часто».#!"

 # Диагностическая запись хода мыслей ИИ по сделкам. Для игры — выключено.
 rule_tnt_ai_telemetry:0 "Parley: диагностический журнал"
 setting_tnt_ai_telemetry_off:0 "Выключен"
 setting_tnt_ai_telemetry_off_desc:0 "Диагностика не ведётся — именно это и нужно для игры.\n\n#weak Значение по умолчанию, и оно ничего не стоит: одна проверка правила там, где иначе была бы записана строка.#!"
 setting_tnt_ai_telemetry_on:0 "Включён"
 setting_tnt_ai_telemetry_on_desc:0 "Записывает в #high error.log#! по строке на каждое решение правителя под управлением ИИ о договоре: кого он рассматривал, что выложил на стол, во сколько оценил сделку и #high почему отказался#!.\n\nОколо 600–1600 строк за полгода игрового времени. На игру не влияет никак.\n\n#weak Включите перед длительным прогоном без присмотра, а потом отдайте журнал на разбор.#!"
 setting_tnt_ai_telemetry_verbose:0 "Подробный"
 setting_tnt_ai_telemetry_verbose_desc:0 "Как «Включён», и вдобавок по строке на каждого правителя под управлением ИИ раз в год — перед броском на сделку между ИИ.\n\nЭто тысячи дополнительных строк. Единственное, что они дают, — умение отличить #high пульс не запускался#! от #high запускался, но бросок не выпал#!.\n\n#weak Только для короткого проверочного прогона.#!"

 # --- Y2. Игровое правило: вес угрозы (9) --------------------------------
 # N — масштаб формулы угрозы: common\script_values\tnt_57_threat_values.txt
 # (tnt_threat_scale_value) и common\game_rules\tnt_80_game_rules.txt.
 # ОДНО число делает ДВА дела, и все четыре _desc обязаны говорить об обоих:
 # угроза открывается, когда её вес достигает черты, И РОВНО ЭТОТ ЖЕ ВЕС
 # угроза прибавляет договору (tnt_50_values.txt, строка-фигура 5). Поэтому
 # ступени читаются как БОЛЬШЕ УГРОЗ против МЕНЬШЕ УГРОЗ — слова самого
 # пользователя, — а не как голые числа, и ни один _desc не печатает N.
 # АРИФМЕТИКА ЗА ЭТИМ ТЕКСТОМ, чтобы никто не переписал его во враньё: при
 # равных имени и ужасе ступень требует войска 1 + 100/N, то есть 3,00x на
 # «Редко», 2,00x на «Обычно», 1,67x на «Часто», 1,50x на «Постоянно»; а вес
 # двойного войска равен самому N, то есть 50 / 100 / 150 / 200 против
 # потолка союза в 150 (tnt_50_values.txt:1326) — вот почему перевесить
 # заключённый союз вправе обещать только ступень «Постоянно».
 # НИ ОДНОГО КЛЮЧА tnt_err_* с этим правилом НЕ РОЖДАЕТСЯ, по тому же
 # принципу, что и у денежных ступеней (tnt_80_game_rules.txt:175-180):
 # уцелевшая причина у переключателя объясняет серую клетку, а _desc самой
 # ступени — это место, где игрок и выбрал масштаб. Ключа
 # game_rule_category_* тоже нет: game_modes, ai и tweaks есть в ванили.
 rule_tnt_threat_scale:0 "Parley: угрозы за столом"
 setting_tnt_threat_scale_rare:0 "Редко"
 setting_tnt_threat_scale_rare_desc:0 "Коэффициент N = 2,5. Для любой угрозы нужно #high не менее 100 очков сделки#!. При равных престиже и ужасе для этого требуется соотношение войск 41:1.\n\n#weak Более высокие престиж и ужас снижают необходимый перевес в войсках. Отставание от цели на целую ступень престижа обнуляет силу угрозы. Правила одинаковы для игрока и ИИ.#!"
 setting_tnt_threat_scale_normal:0 "Обычно"
 setting_tnt_threat_scale_normal_desc:0 "Коэффициент N = 5. Для любой угрозы нужно #high не менее 100 очков сделки#!. При равных престиже и ужасе минимальное соотношение войск — #high 21:1#!.\n\nБолее высокие престиж и ужас снижают необходимый перевес в войсках. Отставание от цели на целую ступень престижа обнуляет силу угрозы.\n\n#weak Настройка по умолчанию. Правила одинаковы для игрока и ИИ.#!"
 setting_tnt_threat_scale_frequent:0 "Часто"
 setting_tnt_threat_scale_frequent_desc:0 "Коэффициент N = 7,5. Для любой угрозы по-прежнему нужно #high не менее 100 очков сделки#!.\n\n#weak Более высокие престиж и ужас снижают необходимый перевес в войсках. Отставание от цели на целую ступень престижа обнуляет силу угрозы. Правила одинаковы для игрока и ИИ.#!"
 setting_tnt_threat_scale_constant:0 "Постоянно"
 setting_tnt_threat_scale_constant_desc:0 "Коэффициент N = 10. Для любой угрозы нужно #high не менее 100 очков сделки#!. При равных престиже и ужасе минимальное соотношение войск — #high 11:1#!.\n\n#weak Более высокие престиж и ужас снижают необходимый перевес в войсках. Отставание от цели на целую ступень престижа обнуляет силу угрозы. Правила одинаковы для игрока и ИИ.#!"

 # =========================================================================
 # РАЗДЕЛ Z — ДОПОЛНЕНИЯ ИТЕРАЦИИ 1
 #
 # Z.1  БЛОК ОБЩИХ УСЛОВИЙ. Союз и пакт о ненападении — это ОДИН договор между
 #      двумя правителями, поэтому каждый из них теперь одна строка в средней
 #      колонке, а не по строке на каждую сторону. tnt_mutual_header — заголовок
 #      этого блока (tnt_diplomacy_window.gui:986). В значениях остались строки
 #      с суффиксом _p (tnt_50_values.txt:1179, :1186), поэтому
 #      tnt_bd_alliance_p и tnt_bd_truce_p ПЕРЕПИСАНЫ как общие для двух сторон
 #      и больше не говорят «Вы отдаёте». tnt_bd_alliance_r и tnt_bd_truce_r
 #      несут ту же формулировку, но читателя у них не осталось
 #      (tnt_50_values.txt:1389) — см. loc_keys_now_unused. R8 соблюдён: ни в
 #      одном ключе разбора нет токена значения.
 #
 # Z.2  СКИДКА ЗА ВЫХОД ЗА ПРЕДЕЛ ДОМЕНА УБРАНА (пункт 13), а вместе с ней исчез
 #      и единственный читатель ключей tnt_bd_domain_p / tnt_bd_domain_r.
 #      Превышение предела домена теперь не стоит ни одного очка — от него остались
 #      только две красные строки счётчика в панелях выбора и сделки. ОБА КЛЮЧА
 #      НИЖЕ ОСТАВЛЕНЫ КАК «СИРОТЫ» в обоих языках, по общему правилу из
 #      common\scripted_triggers\tnt_41_gates.txt:309-316: неиспользуемый ключ
 #      ничего не стоит, а отсутствующий печатается на экране сырым. Если их
 #      когда-нибудь удалят, оба языка должны быть исправлены одной правкой.
 #
 # Z.3  ПРАВИЛО ЧАСТОТЫ ПРЕДЛОЖЕНИЙ ОТ ИИ вышло под своим ОКОНЧАТЕЛЬНЫМ
 #      именем tnt_ai_offer_rate (common\game_rules\tnt_81_ai_rules.txt; его
 #      ключи — в разделе Y выше, значение по умолчанию теперь
 #      tnt_ai_offer_rate_frequent). Десять ключей setting_tnt_ai_offers_*,
 #      которые этот раздел объявил для чернового имени правила, не отвечали
 #      ни одному правилу на диске и изъяты из обоих языков зачисткой
 #      неиспользуемых ключей.
 tnt_mutual_header:0 "Между вами двумя"
 # ОСИРОТЕЛИ по пункту 13 — эти два ключа разбора больше не читает ни одно значение.
 # Оставлены, а не удалены: см. Z.2 выше.
 tnt_bd_domain_p:0 "Титулы сверх предела их домена — для них они дешевле"
 tnt_bd_domain_r:0 "Титулы сверх предела вашего домена — для вас они дешевле"

 # =========================================================================
 # V3, ИТЕРАЦИЯ 3 - КРУПНЫЙ ШАГ, ГОТОВЫЕ СУММЫ И АВТОПОДБОР
 # 23 ключа (21 плюс две строки tnt_ab_lumpy_*, добавленные в конец блока в
 # V5), тот же набор имён, что и в английском файле.
 #
 # Ни один ключ не печатает сумму, которой не может знать: подписи говорят, ЧТО
 # кнопка делает, а не какое число получится. Арифметика - в подсказках.
 #
 # Терминология сохранена по файлу: благочестие, престиж, влияние, услуга.
 # =========================================================================

 # --- Крупный шаг. Один текст на все валюты; отличается только влияние.
 tnt_tt_step_huge_add:0 "Добавить сразу много.\n\n#weak Золото, престиж и благочестие - по 1000 за щелчок. Влияние - 250, потому что само влияние никогда не переходит за 1000.#!"
 tnt_tt_step_huge_sub:0 "Убрать сразу много.\n\n#weak Золото, престиж и благочестие - по 1000 за щелчок. Влияние - 250, потому что само влияние никогда не переходит за 1000.#!"

 # --- Кнопка готовых сумм в строке. Многоточие - общепонятный знак «здесь есть
 #     ещё выбор», и единственная подпись, которую не нужно переводить.
 tnt_preset_open:0 "…"
 tnt_tt_preset_open:0 "Задать сумму одним щелчком.\n\n#weak Обычная величина дара, половина запаса, всё посильное - или ничего.#!"

 # --- Само окно выбора.
 tnt_preset_menu_header:0 "Сколько?"
 tnt_preset_std_gold:0 "Доход за год"
 tnt_preset_std_gift:0 "Обычный дар"
 tnt_preset_half:0 "Половина"
 tnt_preset_max:0 "Всё, что могу"
 tnt_preset_max_r:0 "Всё, что может партнёр"
 tnt_preset_none:0 "Ничего"

 # tnt_preset_std_gift - это НЕ «за год». У престижа, благочестия и влияния в CK3
 # нет годового дохода (в игре нет ни monthly_prestige, ни monthly_piety, ни
 # monthly_influence), поэтому речь идёт об обычном даре - о том, сколько принято
 # давать властителю такого положения за услугу подобного размера.
 tnt_tt_preset_std_gold:0 "Предложить доход за один год.\n\n#weak Не больше того, что действительно лежит в казне.#!"
 tnt_tt_preset_std_gift:0 "Предложить столько, сколько принято за услугу такого размера, - сколько ожидает властитель его положения.\n\n#weak Не больше того, что действительно есть в запасе. У престижа, благочестия и влияния нет годового дохода, поэтому «дохода за год» для них попросту не бывает.#!"
 tnt_tt_preset_half:0 "Предложить половину запаса."
 tnt_tt_preset_max:0 "Предложить всё, что можно себе позволить."
 tnt_tt_preset_none:0 "Убрать эту валюту со стола."

