 # V13, ПУНКТ 1 — ВЫВЕДЕНЫ: ВОЕННЫЙ СОЮЗ, ПАКТ О НЕНАПАДЕНИИ И ДАРОВАНИЕ
 # ПРЕТЕНЗИИ. ЭТО ОСОЗНАННЫЙ ОТКАЗ ПО ЗАМЫСЛУ, А НЕ ПОЧИНКА ОШИБКИ. Ничего
 # здесь не было сломано. Ваниль запирает все три за вложением образа жизни, на
 # которое игрок обязан потратить фокус: союз и перемирие — за дипломатическим
 # перком defensive_negotiations_perk из ветви внешних сношений
 # (GAME\common\character_interactions\00_alliance.txt:1184 и
 # GAME\common\scripted_triggers\03_fp2_scripted_triggers.txt:732, где OR
 # открывается с `always = no`), претензию — за вложением в УЧЁНОСТЬ: её
 # изготавливает задача придворного капеллана task_fabricate_claim, и качество
 # исхода привязано к учёности
 # (GAME\common\council_tasks\00_court_chaplain_tasks.txt:1088, :1120, :1126).
 # Покупка любого из трёх за этим столом обходит это вложение стороной, поэтому
 # мод отказывается от условий намеренно. Полные надгробия лежат рядом с
 # E22/E25 в common\scripted_effects\tnt_32_apply.txt; эта заметка — их
 # локализационная половина.
 #
 # ОСТАВЛЕНЫ ЗАДАННЫМИ НАМЕРЕННО — ТРИДЦАТЬ ВОСЕМЬ КЛЮЧЕЙ ТЕРЯЮТ ЭТИМ ПРОХОДОМ
 # ПОСЛЕДНЮЮ ССЫЛКУ, И НИ ОДИН НЕ УДАЛЁН. Число ключей закреплено, и наборы двух
 # файлов обязаны совпадать; ключ, на который никто не ссылается, не стоит
 # ничего, а незаданный печатает на экране свой сырой идентификатор либо рушит
 # вычисление, которое его называет. НЕ ВЫЧИЩАТЬ ИХ. Где они, по разделам:
 #   B  tnt_label_years
 #   C  tnt_item_alliance, tnt_item_alliance_desc, tnt_tt_alliance_glut,
 #      tnt_item_truce, tnt_item_truce_desc, tnt_item_claim, tnt_item_claim_desc
 #   D  tnt_bd_alliance_p, tnt_bd_truce_p, tnt_bd_claim_p, tnt_bd_claim_r
 #   G  tnt_picker_title_claim
 #   J  tnt_err_claim_invalid, tnt_err_ally_invalid, tnt_err_truce_invalid,
 #      tnt_err_ally_already, tnt_err_ally_at_war, tnt_err_ally_same_realm,
 #      tnt_err_ally_hegemon, tnt_err_ally_not_ruler, tnt_err_truce_same_realm,
 #      tnt_err_truce_self
 #   M  tnt_truce_negotiated
 #   Q  tnt_sel_count_claim_p, tnt_sel_count_claim_r, tnt_multi_count_claim_p,
 #      tnt_multi_count_claim_r
 #   U  tnt_err_truce_dead
 #   V  tnt_ai_offer_desc_a1, tnt_ai_offer_desc_a2, tnt_ai_offer_desc_a6,
 #      tnt_ai_offer_desc_a11 (тексты писем четырёх выведенных замыслов),
 #      tnt_ai_offer_row_alliance, tnt_ai_offer_row_truce,
 #      tnt_ai_offer_row_claim_r
 #   X  tnt_ai_msg_tt_truce, tnt_ai_msg_tt_ally
 # tnt_err_claim_invalid не имел ссылок и ДО этого прохода, так что новых сирот
 # тридцать семь из тридцати восьми. tnt_bd_alliance_r, tnt_bd_truce_r и
 # tnt_truce_nonwar тоже осиротели раньше и не затронуты.
 #
 # ПЯТЬ ИЗ НИХ ДЕРЖАТ ДВА SCRIPT VALUE И НЕ ДОЛЖНЫ БЫТЬ УДАЛЕНЫ НИКОГДА:
 # tnt_sel_count_claim_p / _r, tnt_multi_count_claim_p / _r и
 # tnt_ai_offer_row_claim_r называют tnt_count_sel_claim_p_value или
 # tnt_count_sel_claim_r_value через GetPlayer.MakeScope.ScriptValue(...). Оба
 # значения оставлены ЗАДАННЫМИ и выпотрошены до постоянного 0 в
 # tnt_54_multiselect_values.txt — ровно так же, как tnt_count_sel_prisoner_p_value
 # (:1056-1080). Удаление этих пяти ключей выглядело бы как разрешение удалить и
 # два значения, а вместе эти правки и дают отказ с сырым ключом, за который мод
 # однажды уже заплатил.
 #
 # ОСТАЮТСЯ ЖИВЫМИ И НИ К ОДНОМУ ИЗ ТРЁХ СЕМЕЙСТВ НЕ ОТНОСЯТСЯ — не выводить их
 # за компанию: tnt_mutual_header (под ним по-прежнему стоит брачная строка,
 # gui\tnt_diplomacy_window.gui:1633), tnt_ai_goal_claim (код цели 1, «у него
 # притязание на вашу землю», пишет A8, покупка земли), tnt_relmod_ally (строка
 # мнения, читающая is_allied_to на живом мире, а не переменную условия,
 # tnt_51_relation_values.txt:684) и tnt_stage_no_alliance_tt (брачный выбор,
 # tnt_12_marriage_picker.txt:747).
 # =========================================================================
 tnt_item_alliance:0 "Военный союз"
 # ===================================================================
 # wars_l_english.yml. Наше называет обе стороны и не называет титул, потому что за
 # титул эта война и не ведётся.
 # Печатается из on_declaration казус белли, потому что именно тогда снимок tnt_w_*
 # свеж; к моменту победы он уже восстановлен и израсходован. Все числа читаются
 # живьём с атакующего, размеры списков — через GetDataModelSize, который ваниль тоже
 # печатает в локализации (ledger_filtersorts_l_english.yml:441). Нули показываются, а
 # не скрываются: договор — это перечень того, что в нём ЕСТЬ, и читатель, увидевший
 # «Графств: 0», понимает, что война не про землю.
 tnt_err_ab_already_fair:0 "Договор уже стоит ровно на #high +1#! — уравновешивать больше нечего"
 tnt_err_ab_empty:0 "На столе пока нечего уравновешивать"
