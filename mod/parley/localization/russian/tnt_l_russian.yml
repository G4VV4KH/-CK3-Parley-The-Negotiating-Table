 tnt_err_ward_p_unavailable:0 "У вас нет ребёнка, которого можно отдать на воспитание, либо их двор не примет воспитанника."
 tnt_err_ward_r_unavailable:0 "У партнёра нет ребёнка для воспитания, либо ваш двор не примет воспитанника."
 tnt_err_courtier_p_unavailable:0 "Из вашего двора некого передать: несогласные, связанные клятвой и заключённые остаются."
 tnt_err_courtier_r_unavailable:0 "Из двора партнёра вам некого передать."
 tnt_err_subject_and_vassal:0 "Договору, который несёт присягу целой державы, не нужен ещё и вассал, выковырянный из неё отдельно. Уберите со стола присягу либо уберите вассала."
 tnt_err_subject_r_unavailable:0 "Сейчас никого из вассалов партнёра вам передать нельзя: вы должны сами владеть землёй и быть готовы взять новых подданных, а вы двое должны быть в мире."
 tnt_err_subject_p_unavailable:0 "Сейчас никого из ваших вассалов передать нельзя, и дело может быть не в вашей стороне стола: принимающий правитель должен сам владеть землёй и быть готов взять новых подданных, а вы двое должны быть в мире."
 tnt_err_indep_p_unavailable:0 "Освобождение сейчас невозможно: партнёр должен быть вашим вассалом, вы оба — в мире (и никто из ваших вассалов не воюет с ним), его владения не должны входить в ваши де-юре титулы, и он не должен быть вашим соправителем."
 tnt_err_indep_r_unavailable:0 "Освобождение сейчас невозможно: вы должны быть вассалом партнёра, вы оба — в мире (и никто из его вассалов не воюет с вами), ваши владения не должны входить в его де-юре титулы, и вы не должны быть его соправителем."
 # КЛЮЧ ЖИВОЙ, НО В V16 УКОРОЧЕН (пункт 5). Он НЕ осиротел: это по-прежнему текст
 # custom_description внутри is_valid у tnt_send_offer, то есть он лежит на пути
 # BuildTooltip и обязан оставаться без макросов [..] (закон проекта 10; он всегда
 # был чист, и укорачивание ничего не добавило). Ушла вторая половина — «а один
 # человек не может быть сразу заложником и воспитанником»: четыре строки
 # tnt_people_pair_trigger, сравнивавшие заложника с воспитанником,
 # закомментированы вместе с семейством, и триггер теперь заявляет одно правило —
 # переданный ему запрет держать сразу независимость и присягу. Отказ не вправе
 # называть правило, которое договору больше не нарушить.
 tnt_err_people_pair:0 "Договор противоречит сам себе: нельзя одним махом и отпустить вассала, и принять присягу."

 # --- V. Письмо от ИИ (66) - пункт 4, этап AI-1 --------------------------
 # ЧИСЛО В ЗАГОЛОВКЕ ПЕРЕМЕРЕНО, А НЕ ПРИБАВЛЕНО. Оно стояло как (44) с того
 # прохода, что создал раздел, и четыре последующих прохода его не трогали;
 # до V13 раздел держал 55 ключей, после V13 — 66.
 # Событие tnt_ai_offer.0002 приходит НА ИГРОКА, поэтому root — игрок, а ИИ —
 # scope:tnt_deal_partner. Именно из-за этого все 55 script value мода сохраняют
 # свой прежний смысл, а встроенный виджет заново использует
 # tnt_balance_header / _accept / _reject без изменений.
 # ЭТО САМЫЙ ЗАМЕТНЫЙ НОВЫЙ ТЕКСТ В МОДЕ. Каждая ветвь замысла называет ровно
 # те условия, которые записал её собственный составитель
 # (tnt_37_ai_offer.txt), и ничего больше, — поэтому письмо не может
 # пообещать условие, которого в предложении нет. ЦИФРЫ печатают строки
 # tnt_ai_offer_row_* во встроенном виджете, а не проза: кто именно платит,
 # решается уже после выбора замысла.
 tnt_ai_offer_title:0 "Посольство от [tnt_deal_partner.GetTitledFirstName]"
 # V13, ПУНКТ 1: tnt_ai_offer_desc_a1 (простой пакт) и _a2 (союз) ОСИРОТЕЛИ и
 # ОСТАВЛЕНЫ ЗАДАННЫМИ — замыслы 1 и 2 выведены вместе со своими условиями, а
 # индексы 1, 2, 6 и 11 сожжены и не переиспользуются. Обращение то же, что с
 # _a5 ниже. См. заметку над tnt_item_alliance в разделе C.
 tnt_ai_offer_desc_a1:0 "Гонца [tnt_deal_partner.GetTitledFirstName] вводят, не дав ему отряхнуть дорожную пыль, и он переходит к делу с прямотой человека, который скакал во весь дух.\n\nЕго господин не желает с вами ссоры. Он просит клятвенный договор: #high десять лет#! ни один из вас не обнажит меч против другого, — и привёз золота, чтобы обещание держалось, ибо слово не стоит ничего, и он это знает."
 tnt_ai_offer_desc_a2:0 "[tnt_deal_partner.GetTitledFirstName] прислал не писца, а родича, и это уже половина послания.\n\nРечь о военном союзе, скреплённом клятвой: ваши знамёна и его поднимутся вместе, и каждый сможет позвать другого, когда придёт война, — а придёт она, знаете вы оба."
 tnt_ai_offer_desc_a3:0 "Посол [tnt_deal_partner.GetTitledFirstName] говорит негромко и не просит ничего, что можно положить на чашу весов.\n\nЕго господину нужно ваше слово: одна услуга в долг, которую он потребует в час, выбранный им самим. Такие долги всегда взыскивают в наихудшую минуту — именно поэтому их и стоит покупать."
 tnt_ai_offer_desc_a9:0 "[tnt_deal_partner.GetTitledFirstName] не присылает ни дара, ни лести — только напоминание.\n\nЗа вами долг, и посол прибыл его взыскать. То, что он кладёт на стол, — не просьба, а расчёт: долг назван вслух, и условия ниже его закрывают."
 # ВЫВЕДЕНО ВМЕСТЕ С СЕМЕЙСТВОМ ПЛЕННИКОВ (пункт 7): замысел A5 — это письмо о
 # выкупе, и просить ему нечего, раз условий о пленниках больше нет. За весь
 # прошлый заход оно не составилось ни разу, так что игрок его и не читал.
 # Ключ остаётся заданным — см. надгробие над блоком пленников в разделе C.
 tnt_ai_offer_desc_a5:0 "Посол [tnt_deal_partner.GetTitledFirstName] не садится и не делает вида, будто речь о высокой политике.\n\nВ ваших темницах гниют люди его дома и его присяги. Господин хочет вернуть их домой и привёз довольно, чтобы вам было не жаль опустевших темниц."
 # V13, ПУНКТ 1: ОСИРОТЕЛ, ОСТАВЛЕН ЗАДАННЫМ — A6 был гордым пактом, то есть
 # перемирием, оплаченным престижем, и выводится вместе с перемирием. САМ
 # ПРЕСТИЖ НЕ ВЫВЕДЕН: лесенка доплаты по-прежнему пишет tnt_prestige_r.
 # Исчез лишь единственный замысел, который писал его напрямую.
 tnt_ai_offer_desc_a6:0 "Это посольство прибывает с герольдами, рогами и целой свитой свидетелей: [tnt_deal_partner.GetTitledFirstName] хочет, чтобы весь свет видел, что здесь будет подписано.\n\nСуть — взаимный пакт на #high десять лет#!, и, чтобы скрепить его на людях, его господин уступит вам часть собственного [Concept('prestige', 'престижа')|E] перед лицом всех собравшихся дворов. От мира, купленного так громко, ни одной из сторон уже не отпереться."
 # ВОЛНА ОТМЕНЁННОГО ЗАПРЕТА — «нужно использовать весь масштаб опций»:
 # замысел 8 покупает землю игрока, 10 продаёт собственную, 11 продаёт
 # претензию на собственный титул, 13 продаёт артефакт, 14 предлагает присягу,
 # 15 предлагает воспитанника (ветвь a15 — в events\tnt_ai_events.txt:1037-1043, а
 # НЕ в :327-368, как эта строка утверждала четыре прохода; и 11, и 15 теперь
 # выведены, их ветви закомментированы). Регистр и
 # единственный доступный scope, tnt_deal_partner, те же, что в a1-a6. КАКИЕ
 # именно титулы или люди имеются в виду, показывают строки сводки и стол
 # встречного предложения, а не проза. О правителе, как и в a1-a6, русский
 # текст говорит в мужском роде единственного числа — приём ванильной русской
 # локализации для персонажа неизвестного пола.
 tnt_ai_offer_desc_a8:0 "[tnt_deal_partner.GetTitledFirstName] пишет о границах и о золоте. Есть земля под вашей рукой — она названа в условиях ниже, — которой пристало бы стоять под его знаменем, и он предпочтёт купить её честно, нежели тайно желать. Цена выписана сполна; печать ждёт вашего ответа."
 tnt_ai_offer_desc_a10:0 "[tnt_deal_partner.GetTitledFirstName] предлагает землю. Одно из его владений — оно названо ниже — ему более в тягость, чем в прибыток, и он охотнее увидит его в ваших руках, а свою казну — полнее. Спрошенная с вас цена стоит среди условий."
 # V13, ПУНКТ 1: ОСИРОТЕЛ, ОСТАВЛЕН ЗАДАННЫМ — A11 продавал претензию, а
 # семейство претензий выведено. Индекс 11 сожжён.
 tnt_ai_offer_desc_a11:0 "[tnt_deal_partner.GetTitledFirstName] предлагает не землю, а законный путь к ней: претензию на один из собственных титулов, писанную и скреплённую печатью, — предъявить её вы вольны, когда сочтёте нужным. Чернила стряпчих дешевле солдатской крови, хотя и не даром, как свидетельствуют условия ниже."
 tnt_ai_offer_desc_a13:0 "Посланник от [tnt_deal_partner.GetTitledFirstName] открывает привезённое сокровище: вещь из его собственных палат, названную в условиях ниже. Её предлагают за честное золото — такие вещи достойнее обретают новых хозяев за столом переговоров, нежели на поле брани."
 tnt_ai_offer_desc_a14:0 "[tnt_deal_partner.GetTitledFirstName] пишет слова, что редкий государь доверит пергаменту: он готов преклонить колено. Его держава перейдёт под вашу защиту, его знамёна — под ваши, но не даром: цена выписана в условиях ниже. Взвесьте всё: принесённую присягу нелегко взять назад."
 # ВЫВЕДЕНО ВМЕСТЕ С СЕМЕЙСТВОМ ВОСПИТАННИКА (V16, пункт 5): ОСТАВЛЕН ЗАДАННЫМ.
 # ЗАМЫСЕЛ 15 УЖЕ УБРАН ИЗ СОСТАВИТЕЛЯ — это измерено, а не предположено: во всём
 # моде больше нет места, которое писало бы `tnt_ai_offer_arch value = 15`, так
 # что эту ветвь ни одно письмо уже не выберет, а индекс 15 сожжён. Читающий этот
 # ключ triggered_desc выводится вместе с ним; пока тот короб ещё жив, он всего
 # лишь недостижим, но не ошибочен. Обращение то же, что с _a5 и _a11 выше.
 # ЭТО ПИСЬМО ИГРОК ЧИТАЛ: за прогон 2026-08-17 A15 составился 4 раза, 3 письма
 # дошли до него и все 3 были отвергнуты — с него просили 798, 512 и 91 золота
 # ЗА ТО, ЧТО ОН ПРИМЕТ РЕБЁНКА, то есть игрок платил за право сделать ИИ
 # услугу. Это ошибка направления, стоящая за ошибкой в очках.
 # САМОЕ ТЁПЛОЕ ПИСЬМО ИИ О РЕБЁНКЕ УХОДИТ ВМЕСТЕ С СЕМЕЙСТВОМ, и заменить этот
 # регистр нечем: проза A18 о заложнике — это залог, а не узы меж домами.
 # См. заметку над tnt_item_ward в разделе C.
 tnt_ai_offer_desc_a15:0 "[tnt_deal_partner.GetTitledFirstName] просит места у вашего очага — не себе, а своему дитяти, названному ниже: пусть растёт при вашем дворе. Такой воспитанник — и честь, и узы меж домами; что следует при ребёнке, выписано в условиях."
 # A16 — СОСТАВЛЕННОЕ ПРЕДЛОЖЕНИЕ БРАКА (events\tnt_ai_events.txt:1056, ветвь
 # var:tnt_ai_offer_arch = 16). Проза нарочно не называет чету: курсор
 # разметки составителя (tnt_spouse_p/_r) очищается при закреплении пары, и
 # текст, потянувшийся к нему, разрешался бы о мёртвые переменные — то же
 # правило записано в комментарии самого события (:383-389). Саму чету —
 # имена и портреты — несёт строка пары под tnt_ai_offer_row_marriage ниже.
 tnt_ai_offer_desc_a16:0 "Мой посланник везёт предложение дороже золота: соединим наши дома. Я предлагаю особу своей крови в супруги особе вашей, дабы у двух наших родов было одно будущее. Чета названа ниже; взвесьте её, как любую мою сделку."
 # V13, ПУНКТ 2 — ЧЕТЫРЕ ЗАМЫСЛА, ЗАКРЫВАЮЩИЕ ПРОБЕЛ В ОХВАТЕ.
 # 17 просит освободить его от присяги и кладёт за это графство,
 # 18 отдаёт родича в заложники, 19 выкупает одного взрослого слугу из
 # вашего двора, 20 преклоняет колено на условиях договора, вписанных в лист.
 # Проза не называет ни графства, ни ребёнка, ни человека: это дело строк
 # сводки (tnt_ai_offer_row_* ниже) — ровно как у a8-a15.
 tnt_ai_offer_desc_a17:0 "[tnt_deal_partner.GetTitledFirstName] пишет как вассал, что взвесил свою присягу и нашёл её тяжкой.\n\nОн просит освободить его от вассальной клятвы — чтобы знамёна снова были его собственными, а его зал не отвечал никому, — и просит не даром: что он кладёт взамен, стоит среди условий ниже. Возвращённая клятва — не нарушенная клятва, но и возвращают её не задёшево."
 tnt_ai_offer_desc_a18:0 "Посольство [tnt_deal_partner.GetTitledFirstName] прибывает не с пустыми руками, и привозит оно не золото.\n\nДитя их собственной крови, названное ниже, отдаётся вам в заложники — порукой тому, что данное вам слово устоит, пока ребёнок под вашим кровом. Что они просят за столь дорогой залог, вписано в условия."
 tnt_ai_offer_desc_a19:0 "[tnt_deal_partner.GetTitledFirstName] прослышал о человеке при вашем дворе и желает его себе.\n\nОн назван ниже. Вас просят отпустить его к ним на службу и не ждут этой милости даром — кошель стоит среди условий. Один слуга для большого зала — малость; цена, предложенная за него, — нет."
 tnt_ai_offer_desc_a20:0 "[tnt_deal_partner.GetTitledFirstName] готов преклонить колено — но не вслепую.\n\nЕго владения перейдут под вашу корону на условиях, вписанных в договор ниже: что он станет вам отдавать и что намерен сохранить за собой. Присяга, купленная честной ценой, держится дольше присяги отнятой. Прочтите условия, прежде чем скрепить их печатью."
 tnt_ai_offer_desc_generic:0 "Объявляют посла [tnt_deal_partner.GetTitledFirstName]; он кланяется и кладёт на стол запечатанное предложение. Условия его господина писаны ниже собственной его рукой, и посол ждёт ответа."
 tnt_ai_offer_desc_outro:0 "\n\n#weak Ваши дипломаты взвесили это на тех же весах, которыми пользуетесь вы сами.#!"

 # V10, слой 3 системы целей: строка мотива перед текстом письма. Каждая
 # кончается на \n\n; tnt_ai_goal_blank пуст - письмо без особого мотива
 # читается ровно как раньше.
 tnt_ai_goal_claim:0 "#weak Ваши осведомители шепчут: у этого дома есть притязание на вашу землю, и золото кажется им дешевле крови.#!\n\n"
 tnt_ai_goal_dejure:0 "#weak Ваши законники подтверждают: земля, о которой пойдёт речь, по древнему праву тянет к их короне — и они этого не забыли.#!\n\n"
 # ВЫВЕДЕНО ВМЕСТЕ С СЕМЕЙСТВОМ ПЛЕННИКОВ (пункт 7) — единственная строка
 # побуждения, называющая темницу. Ключ остаётся заданным.
 tnt_ai_goal_kin:0 "#weak Причину искать недалеко: в вашей темнице сидит их родная кровь.#!\n\n"
 tnt_ai_goal_menaced:0 "#weak Ваши люди на границах доносят: над их землёй навис сосед сильнее их, и им спешно нужны друзья.#!\n\n"
 tnt_ai_goal_rich:0 "#weak Ваши купцы знают точно: их казна ломится от золота, которому ищут применение.#!\n\n"
 tnt_ai_goal_poor:0 "#weak Ваши купцы шепчут: их казна пуста, и им отчаянно нужно золото.#!\n\n"
 tnt_ai_goal_overdomain:0 "#weak Ваши законники замечают: у них больше земли, чем дозволено держать одной руке, — излишек ищет покупателя.#!\n\n"
 tnt_ai_goal_heir:0 "#weak При их дворе это не тайна: наследник вошёл в возраст, а брачное ложе пустует — им нужна партия.#!\n\n"
 # ВЫВЕДЕНО ВМЕСТЕ С СЕМЕЙСТВОМ ВОСПИТАННИКА (V16, пункт 5): ОСТАВЛЕН ЗАДАННЫМ.
 # Это код цели 9, и единственный во всём моде, кто его записывал, сидел внутри
 # записи замысла 15 (tnt_37_ai_offer.txt, ветвь «трое живых малолетних детей») —
 # один писатель, сверено со всеми 39 записями цели в этом файле, поэтому код стал
 # недостижим в тот же миг, как A15 покинул бросок. Читающий этот ключ
 # triggered_desc выводится вместе с ним.
 # КОД ЦЕЛИ 9 ТЕПЕРЬ СОЖЖЁН, рядом с кодом 3: переиспользуй
 # его — и над живым письмом встанет мотив выведенного замысла. Обращение то же,
 # что с tnt_ai_goal_kin выше. См. заметку над tnt_item_ward в разделе C.
 tnt_ai_goal_brood:0 "#weak Ваши люди посмеиваются: их залы полны детей, и каждому нужен двор, стол и наставник.#!\n\n"
 tnt_ai_goal_schemer:0 "#weak Ваши осведомители предупреждают: этот двор соткан из шёпота, и его хозяин не покупает обещаний, которых не собирается предъявить.#!\n\n"
