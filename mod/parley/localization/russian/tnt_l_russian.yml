 #                     :1207, :1327)
 # Раздел 7 файла NOTES3-multiselect просит «не создавать обе семьи», считая,
 # что tnt_multi_count_* нигде в коде нет. Теперь есть: их создал автор gui.
 # На обе семьи ссылается живой `text =`, поэтому обе обязаны существовать,
 # иначе на экран попадёт сырое имя ключа. Они читают те же шесть script value и
 # различаются только формулировкой, потому что одна стоит под заголовком
 # панели, а другая — под названием строки.
 # `text =` в .gui не умеет передавать ключу параметр, поэтому каждый счётчик
