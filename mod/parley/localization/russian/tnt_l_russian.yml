 tnt_treaty_favor_opinion:0 "Выгодный договор"
 # ===================================================================
 # ИСПОЛЬЗОВАНИЕ КРЮЧКА, КОТОРЫЙ У ВАС ЕСТЬ (пункт 2 V4). Подстрока называет силу
 # живьём, поэтому устареть не может, и говорит «крючка нет», а не молчит, когда его
 # нет: строка теперь видна в любом случае.
 # Пункт A2 V4 — зеркало: ОН взыскивает долг, который держит на НАС. В окне только
 # для чтения; переменную ставит его составитель. Число отрицательное, потому что
