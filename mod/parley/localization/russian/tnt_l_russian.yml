l_russian:
 # =========================================================================
 # PARLEY: THE NEGOTIATING TABLE - русская локализация
 #
 # НАБОР КЛЮЧЕЙ ОДИНАКОВ ВО ВСЕХ ДЕВЯТИ ЯЗЫКАХ И В ТОМ ЖЕ ПОРЯДКЕ — веер закона
 # 9: english, french, german, japanese, korean, polish, russian, simp_chinese,
 # spanish. Сравнение колонок ключей любых двух файлов обязано возвращать пустой
 # результат.
 #
 # *** ЧИСЛУ В ЭТОЙ ШАПКЕ ВЕРИТЬ НЕЛЬЗЯ. *** Здесь несколько раундов стояло
 # «570», пока в дереве было 615: каждый заход, добавляющий ключ, обязан помнить
 # про девять шапок — и не помнит ни один. ЖИВОЕ ЧИСЛО ПЕЧАТАЕТ tnt_family_gate
 # .ps1 в проверке 4 рядом с именем этого файла, и именно она принуждает веер
 # (тождество наборов ключей плюс паритет токенов по каждому языку). Смотреть
 # туда. Поштучная арифметика проходов ниже оставлена такой, какой её писали
 # авторы, и давно не сходится: это история, а не измерение.
 # ПЕРЕМЕРЕНО И ИСПРАВЛЕНО В V16: в шапке обоих языков стояло 566, а оба файла
 # держали 570, — значит устарела шапка, а не файлы: и раздел 2.9 CLAUDE.md, и
 # пункт 4 проверочного списка говорят 570 с последней сверки. Четыре ключа,
 # которых шапка не досчитала, добавил проход, не оставивший себе записи ниже.
 # Проверяется именно равенство 570 = 570; эта строка обязана с ним сходиться.
 #
 # V16, ПУНКТ 5 — СЕМЕЙСТВО ВОСПИТАННИКА ВЫВЕДЕНО: 570 -> 570.
 #   НИ ОДИН КЛЮЧ НЕ ДОБАВЛЕН И НИ ОДИН НЕ УДАЛЁН. Двенадцать ключей теряют
 #   последнего читателя, и все двенадцать ОСТАЮТСЯ ЗАДАННЫМИ и помечены там, где
 #   стоят. Главная заметка — над tnt_item_ward в разделе C, остальные одиннадцать
 #   смотрят на неё, ровно как сироты семейства союза смотрят на
 #   tnt_item_alliance. Вывод семейства ни разу не стоил этому файлу ни одного
 #   ключа, и причина — закон проекта 9: ключ, заданный лишь в одном языке, в
 #   другом печатает собственный идентификатор, поэтому файлы пришпилены друг к
 #   другу, и «уборка» сироты — это как раз способ сорвать эту шпильку.
 #   ОДИН ЖИВОЙ КЛЮЧ ПЕРЕПИСАН, ИДЕНТИФИКАТОР ТОТ ЖЕ: у tnt_err_people_pair убрана
 #   половина про «заложника и воспитанника». Четыре строки, сравнивавшие
 #   заложника с воспитанником, уходят вместе с семейством, и его триггер держит
 #   теперь одно правило — запрет на независимость и присягу разом, — а серая
 #   кнопка не вправе называть
 #   правило, которое договору больше не нарушить. Ключ был и остаётся без
 #   макросов [..].
 #   ИНДЕКС ЗАМЫСЛА 15 И КОД ЦЕЛИ 9 СОЖЖЕНЫ и не переиспользуются: сожжённые
 #   индексы теперь 1, 2, 4, 5, 6, 7, 11, 12, 15, сожжённые коды цели — 3 и 9.
 #   И описание письма, и строка мотива ветвятся по этим числам, поэтому
 #   переиспользованный номер напечатал бы над живым письмом прозу выведенного
 #   замысла.
 #
 # V13, ПУНКТЫ 1 И 2: 553 -> 566, И НИ ОДИН КЛЮЧ НЕ УДАЛЁН.
 #   +11 (пункт 2) Четыре текста писем (a17-a20), три строки мотива
 #       (yoke/talent/surety) и четыре строки сводки для четырёх замыслов,
 #       которые делают достижимыми для ИИ независимость, заложника, передачу
 #       придворного и вассальный договор. Девяти строкам с подробностями по
 #       обязанностям новые ключи НЕ НУЖНЫ: tnt_ob_tt_council / _revoke / _war /
 #       _fort / _coin / _succ уже есть в разделе S и переводят себя сами через
 #       GetSubjectContractType().GetObligationName(), а остальное закрывают
 #       ванильные low_obligations_taxes / low_obligations_levies /
 #       religious_protection_tt.
 #   +2  (пункт 1) tnt_ai_msg_tt_artifact и tnt_ai_msg_tt_wed в разделе X —
 #       замена содержимого для песочницы договоров между ИИ. Вывод союза и
 #       пакта отнял у неё оба договора, какие она вообще составляла, поэтому
 #       мир получает взамен продажу артефакта и брак.
 #   -0  ПУНКТ 1 НЕ УДАЛЯЕТ НИЧЕГО. Он выводит три семейства условий — военный
 #       союз, пакт о ненападении и дарование претензии, — и ТРИДЦАТЬ ВОСЕМЬ
 #       ключей теряют последнюю ссылку. Все до одного остаются заданными и
 #       помечены там, где стоят; главная заметка — над tnt_item_alliance в
 #       разделе C, и пять из тридцати восьми — та самая причина, по которой
 #       два script value обязаны остаться заданными. НЕ ВЫЧИЩАТЬ ИХ.
 #   Тем же проходом ПЕРЕМЕРЕНЫ два заголовка разделов: V стоял как (44) при 55
 #   ключах и теперь читается (66); X стоял как (8), держал 8, теперь (10).
 #
 # ПРОХОД ПО ПУНКТАМ 1, 3, 5 И 7: 551 -> 553.
 #   +2  tnt_bd_gain_panel, tnt_bd_relation_panel — два последних двойника
 #       «_panel» у цифр весов. Добавлены потому, что гнездо подписи на панели
 #       шириной 169 px и обрезает длинные ключи `desc` (пункт 3). Подробности —
 #       в разделе D.
 #   Пункт 5 («по прежнему очень много нелокализованных переменных, например
 #       tnt_err_threat_unafraid») НЕ ДОБАВИЛ НИЧЕГО: предпосылка не
 #       воспроизводится. Все ключи, на которые ссылается мод, заданы —
 #       tnt_err_threat_unafraid в том числе, — и в error.log того захода нет ни
 #       одного tnt_ключа без локализации. Игрок видит ОБРЕЗАННУЮ подпись, а не
 #       непереведённую; поэтому починка выше — про ширину. Не тратьте на это
 #       следующий проход, добавляя ключи.
 #   Пункты 1 и 7 вывели обещание не нападать и семейство пленников. Их ключи
 #       ОСТАВЛЕНЫ ЗАДАННЫМИ и помечены как выведенные там, где они заданы;
 #       ничего не удалено, и число ключей не убыло. Надгробия — в разделе C.
 #
 # СВЕРКА СБОРКИ 3 СДЕЛАНА МЕХАНИЧЕСКИ. Все места мода, где может стоять ключ
 # локализации, извлечены скриптом и сопоставлены с заданными ключами:
 #   .gui   `text = "ключ"` / `tooltip = "ключ"` / `Localize('ключ')`
 #   .txt   desc= / custom_tooltip= / custom_description{text=} / title= /
 #          send_name= / notification_text= / answer_accept_key= /
 #          answer_reject_key= / options_heading= / send_option{localization=} /
 #          option{name=} в событии / add_truce{name=}
 #   выводимые: ключи модификаторов, идентификаторы типов рычагов влияния,
 #          идентификаторы правила игры и его настроек
 #   data_binding\tnt_macros.txt:268  TntHookTier -> tnt_hook_tier_0..3
 #   v1 содержал 114.  Сборка 2: 172.  Сборка 3: +202 = 374.
 #
 # 202 ДОБАВЛЕННЫХ КЛЮЧА, ПО ВЛАДЕЛЬЦАМ:
 #   расширенный выбор брака       22   (раздел P)
 #   множественный выбор + домен   22   (Q)
 #   уровни рычагов влияния        10   (R)
 #   лист вассального договора     65   (S)
 #   союз внутри одной державы      3   (T)
 #   скрытие недоступных строк      1   (U)
 #   письмо от ИИ                  21   (V)
 #   три взаимодействия ИИ         46   (W)
 #   сообщения о договорах ИИ       5   (X)
 #   правило игры для ИИ            7   (Y)
 # 188 из 202 уже используются реальным местом. Остальные 14 — ОБЪЯВЛЕНЫ
 # ЗАРАНЕЕ, каждый помечен ниже словом FORWARD и назван автор, который сделает
 # его рабочим. Правило то же, что и в сборке 2: неиспользуемый ключ ничего не
 # стоит, а отсутствующий печатает на экране своё сырое имя.
 #
 # В СБОРКЕ 3 ПЕРЕПИСАНЫ ТРИ СУЩЕСТВУЮЩИХ КЛЮЧА, идентификаторы не менялись:
 #   tnt_item_alliance_desc  — прежний текст утверждал, что «любая сторона может
 #       призвать другую на войну», а для пары «сюзерен — вассал» это ЛОЖЬ, и
 #       именно такую пару сборка 3 теперь разрешает
 #       (NOTES3-gates-interaction.md, раздел 4.2).
 #   tnt_item_marriage_desc  — прежний хвост говорил, что пару «подбирают за
 #       вас». Теперь игрок сам выбирает обоих супругов и линию наследования
 #       (NOTES3-marriage, раздел 3.F).
 #   tnt_item_hook_desc      — строка больше не одна услуга, а выбор из трёх
 #       уровней: слабая, сильная, вечная (NOTES3-hooks-contracts, раздел 6.1).
 #
 # НАКОНЕЦ УДАЛЁН: tnt_err_marriage_nobody. Правка 3.D.1 внесена — брачные
 # переключатели теперь сообщают tnt_err_no_spouse_p / _r / tnt_err_pair_illegal
 # (tnt_20_scripted_guis.txt), — так что ключ потерял последнего читателя и
 # изъят из обоих языков, ровно как назначал раздел 3.1 файла 30-V2-DESIGN.
 #
 # V5 ДОБАВЛЯЕТ 30 КЛЮЧЕЙ, 487 -> 517, И ПЕРЕПИСЫВАЕТ ОДИН:
 #   четырём новым условиям пункта 19 — заложник, дарование независимости,
 #     воспитанник, передача придворных — принадлежат 27 из них: 8 в разделе C
 #     (четыре названия строк и четыре подсказки), 8 в разделе D, 9 в разделе G
 #     и 2 в разделе Q.
 #     V16: ВОСПИТАННИК ВЫВЕДЕН, и у пункта 19 остаётся три живых условия. Эта
 #     арифметика оставлена ровно такой, какой её писали, — по правилу «ЧИСЛО В
 #     ШАПКЕ» в начале файла: она записывает прошлый проход, а семь ключей
 #     воспитанника, которые она посчитала (2 в C, 2 в D, 3 в G), по-прежнему заданы,
 #     поэтому итог, в который она складывается, не изменился.
 #   кнопке равновесия принадлежат 2: tnt_ab_lumpy_hint и tnt_ab_lumpy_line —
 #     они в блоке «V3, итерация 3» далеко ниже.
 #   пункту 22 принадлежит 1, tnt_tt_alliance_glut в разделе C, И ПЕРЕПИСАННЫЙ
 #     tnt_relmod_ally в разделе E: блок «−15 за каждый уже заключённый союз»
 #     из tnt_relmod_ally_value удалён (tnt_51_relation_values.txt:684-707 —
 #     теперь просто +10), поэтому прежняя подпись «Уже заключённые союзы»
 #     обещала штраф, которого в строке больше нет. Сам штраф не исчез: он стал
 #     множителем внутри условия о союзе и намеренно не имеет собственной
 #     строки разбора — ради этого и существует tnt_tt_alliance_glut.
 # tnt_tt_alliance_glut — единственный ключ этого прохода, объявленный заранее:
 # ни один файл .gui не входил в задачу автора, который его написал. Остальные
 # 29 читаются живыми местами уже сегодня: строки и панели четырёх новых
 # условий изданы тем же проходом в gui\tnt_diplomacy_window.gui,
 # gui\tnt_panels.gui и gui\tnt_panel_people.gui.
 #
 # ПРОХОД «PARLEY»: 526 -> 538 КЛЮЧЕЙ, И БРЕНД УХОДИТ ИЗ ЗНАЧЕНИЙ.
 #   Перед проходом оба файла держали по 526 ключей, а не 517, как выходит по
 #   старой арифметике выше: девять ключей отказов пункта 19
 #   (tnt_err_hostage_p_unavailable .. tnt_err_people_pair) вышли без записи в
 #   этой описи. Проход: +12 в разделе V (шесть текстов письма a8-a15 волны
 #   отменённого запрета и шесть строк сводки), +2 в разделе X (подсказки
 #   песочницы о титуле и присяге), -2 в разделе N2 (решение о паузе вывело
 #   пару сообщения — см. надгробие там). Каждое ЗНАЧЕНИЕ с «Total War
 #   Diplomacy» теперь читается «Parley», а два описания правила договоров
 #   между ИИ перестали утверждать, будто титулы и присяга молча не переходят
 #   никогда: E20/E21 в tnt_38_ai_world.txt торгуют именно ими — под своими
 #   строгими затворами.
 #
 # ПРОХОД «МЕТКА ДАРА»: 537 -> 538, И ОПИСЬ ПРИВЕДЕНА К ИСТИНЕ.
 #   Добавлен ОДИН ключ, tnt_ai_gift_line в разделе V — строка письма для
 #   var:tnt_ai_gift (пункты 5+9 задания), ОБЪЯВЛЕНА ЗАРАНЕЕ (автор: gui) и
 #   помечена на месте. Прежний итог 538 был НА ЕДИНИЦУ ВЫШЕ файлов, где
 #   лежало 537 ключей: удаление tnt_bd_ally_inrealm в V7 — единственного
 #   ключа раздела T — из итога так и не вычли (заголовок того раздела теперь
 #   честно говорит 0), а заголовок раздела P всё ещё называл 22 при 24
 #   ключах, которые раздел держит на деле. Итоги прежних проходов выше —
 #   ИСТОРИЯ, они остаются как написаны; живая правда — счёт в шапке файла и
 #   счётчики заголовков разделов.
 #   Тем же проходом ПЕРЕПИСАНЫ четыре ключа, идентификаторы прежние:
 #   tnt_ai_offer_row_title_p / _title_r / _claim_r / _artifact_r
 #   читались как фразы-счётчики с тех времён, когда счётчик был всем, что
 #   письмо показывало; теперь виджет называет каждый предмет строками ниже
 #   (tnt_offer_summary.gui:422-810), поэтому заголовок указывает на них
 #   («названа ниже») и держит счётчик в форме подписи, которую не ломает
 #   никакое число.
 #
 # ПРОХОД «БРАЧНОЕ ПИСЬМО»: 538 -> 540, И ЛОЖНОЕ ПРЕДУПРЕЖДЕНИЕ ОБЕЗВРЕЖЕНО.
 #   Добавлены ДВА ключа в разделе V для замысла A16 — составленного
 #   предложения брака: tnt_ai_offer_desc_a16, проза письма
 #   (events\tnt_ai_events.txt:1056), и tnt_ai_offer_row_marriage — заголовок
 #   над строками пар письма (tnt_offer_summary.gui:848); сами пары
 #   переиспользуют изданный tnt_wed_pair_row, третьего ключа нет. Тем же
 #   проходом ПЕРЕПИСАН ОДИН ключ, tnt_err_too_many: прежний текст утверждал
 #   предел домена, которого ни один запрет и ни одна цена не проверяют для
 #   претензий и артефактов, — видимое лицо ошибки «артефакты считаются в
 #   предел домена», — а о пределе домена вправе говорить только
 #   tnt_domain_warning. Сегодня ключ недостижим и хранится как
 #   предупреждение будущего предела; всё постановление — в его комментарии
 #   в разделе Q.
 #
 # НАМЕРЕННО НЕИСПОЛЬЗУЕМЫЕ КЛЮЧИ — заданы, но нигде не упоминаются:
 #   tnt_err_vassal_invalid   (со сборки 2: его заменили девять конкретных
 #   причин обёртки T15).
 #   tnt_picker_available и tnt_picker_chosen БОЛЬШЕ НЕ из этого числа: сборка 3
 #   создаёт tnt_multiselect_columns — gui\tnt_panels.gui:1310, :1342 и
 #   gui\tnt_panel_multiselect.gui:591, :664.
 #   на tnt_err_ally_same_realm ссылается только определённый, но никем не
 #   вызываемый T14 (tnt_40_triggers.txt:814), который нарочно сохраняет
 #   постановление tnt_41_gates.txt:309-316; tnt_err_truce_same_realm СНОВА
 #   РАБОЧИЙ — пункт 3 V5 вернул строку в T21 (tnt_41_gates.txt:633).
 #   Удалять нельзя ни тот, ни другой.
 #
 # В РАЗДЕЛАХ D и E И В СТРОКАХ, ПОМЕЧЕННЫХ [DESC ROW], НЕТ МАКРОСА ЗНАЧЕНИЯ.
 # Это строки `desc` у script value или у блока ai_accept взаимодействия;
 # GetScriptValueBreakdown и GetAcceptanceBreakdown рисуют число в отдельной
 # колонке справа, поэтому макрос значения внутри подписи напечатал бы его
 # дважды (закон проекта R10). Это касается всех 36 ключей раздела D, всех 8
 # раздела E, девяти строк tnt_bd_ob_* (ключ tnt_bd_ally_inrealm удалён вместе со своей переменной в V7; 18 строк
 # tnt_ai_bd_* ушли вместе с взаимодействиями раздела W).
 # Во ВСЕХ остальных ключах допустимы $токены$, [функции данных] и цветовые
 # теги #high #low #weak #P #N #I, каждый закрывается через #!.
 #
 # Функции данных, применённые в локализации; каждая подтверждена реальной
 # строкой ванильной локализации, ни одна не выдумана:
 #   [GetPlayer.MakeScope.ScriptValue('x')|0]
 #        GAME\localization\english\buildings_l_english.yml:2341
 #   [GetPlayer.MakeScope.Var('x').GetValue|0]
 #        activities\coronation_activity_l_english.yml:196
 #   [GetPlayer.MakeScope.Var('x').Char.GetShortUIName]
 #        обращение через переменную: activities\survey_activity_l_english.yml:697
 #   [<сохранённый_scope>.GetTitledFirstName]   8526 применений в ванили
 #   [GetSubjectContractType( 'T' ).GetObligationName( 'L' )|l]  1224 применения
 #   [GetSubjectContractType( 'T' ).GetObligationNameShortNoTooltip( 'L' )]
 #        english\dlc\tgp\dlc_tgp_faction_l_english.yml:168, :170, :172, :174.
 #        *** GetObligationNameNoTooltip НЕ СУЩЕСТВУЕТ (W-7) ***
 #   [Character.GetAge]                   в собственном scope строки datamodel
 #
 # НАЗВАНИЯ УРОВНЕЙ НАЛОГОВ И ОПОЛЧЕНИЯ (tnt_ob_tax_lvl0..4,
 # tnt_ob_levy_lvl0..4) ЗАПИСАНЫ ФУНКЦИЕЙ ДАННЫХ, А НЕ СЛОВАМИ. Это не
 # английский текст в русском файле: функция возвращает ванильное русское
 # название уровня и остаётся верной при любом обновлении игры. Тот же приём
 # применён в десяти ключах tnt_ob_tt_*, где ещё и весь окружающий текст взят у
 # ванили дословно (gui\specialinteractions_l_russian.yml:63-76).
 #
 # Ссылки на игровые термины даны в форме [Concept('ключ', 'слово')|E], которую
 # ванильная русская локализация использует именно для падежей:
 # court_positions_l_russian.yml:119 — [Concept('influence', 'влияния')|E].
 # Термины взяты из ванильной русской локализации: престиж, благочестие,
 # влияние, вассал, претензия, перемирие, вассальный договор, обязательство,
 # предел домена, уровень репутации, культура, инновация, развитие, графство,
 # матрилинейный, патрилинейный, помолвка.
 #
 # Единственное намеренное исключение из правила «в русском файле нет
 # английского текста» — собственное название мода (Parley) в заголовках
 # шести правил игры.
 #
 # Кодировка: UTF-8 С BOM (BOM заново проставляется отдельным шагом на
 # PowerShell после каждой правки — инструмент записи BOM не пишет).
 # =========================================================================

 # --- A. Взаимодействие (3) ----------------------------------------------
 tnt_open_negotiations:0 "Начать переговоры о договоре"
 tnt_open_negotiations_desc:0 "Выложить на стол полный договор: [recipient.GetShortUIName] увидит все условия сразу, с обеих сторон."
 # ИМЯ ЭТОГО КЛЮЧА ВЫВОДИТ ДВИЖОК, У НЕГО НЕТ МЕСТА ВЫЗОВА. <id взаимодействия>
 # _extra_icon — фиксированная подсказка значка, который движок рисует в строке
 # меню правого клика (GAME\common\character_interactions\
 # _character_interactions.info:150-155). У нас его включает БЛОК
 # should_use_extra_icon, а в нём ДВА параметрических вызова триггеров, соединённых по «И»:
 # tnt_can_threat_trigger И tnt_door_open_trigger, оба с { A = scope:actor  B = scope:recipient },
 # common\character_interactions\tnt_10_interaction.txt:203-206, поэтому значок
 # появляется тогда, когда страх на него подействует И строка вообще нажимается, ДО
 # открытия окна. Пути BuildTooltip здесь нет, значит закон 10a не действует и
 # тексикон @icon! законен: у ванили та же форма — hook_extra_icon:0
 # "@weak_hook_icon! [hook|E] available"
 # (GAME\localization\english\interactions_l_english.yml:262). ПОСЛЕ РЕШЕНИЯ О СООТНОШЕНИИ НИКАКИХ «ЧЕТЫРЁХ УСЛОВИЙ» НЕТ: у tnt_can_threat_trigger ДВЕ строки — tnt_threat_points_value против порога 100 и пятнадцатилетний откат (common\scripted_triggers\tnt_41_gates.txt:2388-2402), — а tnt_door_open_trigger (:2991-2994) добавляет по «И» «не в войне с ним» и «его мнение о вас не на самом дне».
 # В самом значении названы только две строки угрозы: это более слабое утверждение, а значит, оно верно всякий раз, когда значок нарисован.
 tnt_open_negotiations_extra_icon:0 "@dread_icon! На него можно надавить — войско, имя и ужас вместе набирают тот вес, который нужен угрозе, и прошлая угроза забыта"

