 # --- C. Восемнадцать позиций сделки -------------------------------------
 # Порядок строк совпадает с порядком в колонках tnt_diplomacy_window.gui.
 # Позиция с индексом 2, ежегодная дань, ВЫВЕДЕНА: её код и её ключи удалены,
 # а сам индекс не переиспользуется. ЧЕТЫРНАДЦАТЬ СТАЛО ВОСЕМНАДЦАТЬЮ в V5:
 # пункт 19 утвердил ровно четыре новых условия, и это последние четыре строки
 # обеих колонок — дарование независимости, заложник, воспитанник, передача
 # придворных: gui\tnt_diplomacy_window.gui:1170-1302 (ваша колонка) и
 # :2167-2254 (колонка партнёра). В разделе они стоят в конце, поэтому порядок
 # строк по-прежнему совпадает с колонками.
 # V16, ПУНКТ 5: СТРОКА ВОСПИТАННИКА ВЫВЕДЕНА, и у пункта 19 остаётся три живых
 # условия. Обе колонки теряют строку одной и той же правкой, поэтому порядок
 # строк и дальше совпадает с колонками: вывод всегда оставляет в этом разделе
 # дыру посередине, а не перенумерацию. Пара ключей остаётся заданной; главная
 # заметка — над tnt_item_ward ниже.
 # Сборка 3 переписывает три описания — см. заголовок файла. Строки, которые
 # невозможны по существу, теперь СКРЫВАЮТСЯ, а не блокируются
 # (tnt_41_gates.txt, макрос TntRow), поэтому большая часть раздела J почти
 # никогда не показывается. Если строка всё-таки видна и на ней отказ, значит
 # игроку не хватает того, что он способен исправить, — и текст обязан сказать,
 # чего именно.
 # «(разово)» УБРАНО (пункт 3). Уточнение отличало эту строку только от ежегодной
 # дани с индексом 2, а та выведена (см. заголовок раздела выше), — то есть
 # отличало золото уже ни от чего, но занимало 128 px при 120 px, отведённых
 # строке валюты под название (gui\tnt_types.gui:546-554): подпись упиралась
 # прямо в первую кнопку счётчика.
 # Смысл единовременности остался там, где для него есть место, — в
 # tnt_item_gold_desc.
 tnt_item_gold:0 "Золото"
 tnt_item_gold_desc:0 "Единовременная выплата [gold_i] из казны: деньги переходят в тот же миг, когда договор заключён."
 tnt_item_prestige:0 "Престиж"
 tnt_item_prestige_desc:0 "[prestige_i] [Concept('prestige', 'престиж')|E], обещанный за столом переговоров.\n\n#weak Это не сундук, переходящий из рук в руки: отдающий теряет сумму, а получающий её приобретает — двумя отдельными действиями, и ничто их не связывает. Поэтому предложение вообще нельзя отправить, если в момент нажатия «Предложить» у отдающего нет всей обещанной суммы.#!"
 tnt_item_piety:0 "Благочестие"
 tnt_item_piety_desc:0 "[piety_i] [Concept('piety', 'благочестие')|E], обещанное за столом переговоров.\n\n#weak И здесь два отдельных действия, а не перенос: сколько одна сторона теряет, столько другая получает. Предложение нельзя отправить, если в момент нажатия «Предложить» у отдающего нет всей обещанной суммы.#!"
 tnt_item_influence:0 "Влияние"
 tnt_item_influence_desc:0 "[influence_i] [Concept('influence', 'влияние')|E], обещанное за столом переговоров.\n\n#weak [Concept('influence', 'Влияние')|E] существует только при той форме правления, что на нём держится, поэтому строки появляются лишь тогда, когда такая форма правления есть у обеих сторон: отдать влияние правителю без такого запаса значило бы не сделать ничего. Здесь тоже два отдельных действия, и предложение нельзя отправить, если в момент нажатия «Предложить» у отдающего нет всей обещанной суммы.#!"
