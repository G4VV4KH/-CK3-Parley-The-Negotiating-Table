 # --- O. Правила игры: расширенные условия и торговля валютами (15) -------
 # Одно из двух дозволенных исключений из закона о префиксе tnt_: движок сам
 # выводит ключи rule_<id> / setting_<id> / setting_<id>_desc из правила и его
 # настроек (GAME\common\game_rules\_game_rules.info:1-19).
 rule_tnt_advanced_terms:0 "Parley: расширенные условия"
 setting_tnt_advanced_terms_on:0 "Включены"
 setting_tnt_advanced_terms_on_desc:0 "Помолвки, передачу титулов и вассальную присягу можно выкладывать на стол переговоров. Если выключить, ИИ перестанет предлагать браки и письмами."
 setting_tnt_advanced_terms_off:0 "Отключены"
 setting_tnt_advanced_terms_off_desc:0 "Помолвки, передача титулов и вассальная присяга на стол переговоров не выкладываются."
 # Два правила торговли валютами (common\game_rules\tnt_80_game_rules.txt:181,
 # :217 — обе по-прежнему по умолчанию включены). W2 ПРЕВРАТИЛ ОБА В СТУПЕНИ:
 # престиж — «никогда / только с равными и ниже / всегда», благочестие —
 # «никогда / только одна вера / только одна религия / всегда», поэтому в блоке
 # стало 16 ключей вместо 10. Идентификаторы _on и _off СОХРАНЕНЫ, так что эти
 # четыре ключа — те же самые четыре ключа; переписан только текст, потому что
 # «ни одно предложение ИИ его не содержит» — теперь обещание одной ступени
 # _off, а не всего правила.
 # Каждое описание перечисляет всё, что ступень гасит, — строки, траты кнопки
 # равновесия и письма ИИ, — потому что описание настройки и есть то место, где
 # игрок читает правило, и намеренно единственное такое место: ступень ПРЯЧЕТ
 # свои строки, а не гасит их, поэтому ни одного ключа tnt_err_* не заведено.
 # «Включена»/«Отключена» согласованы с «торговлей» (женский род), как
 # «Включены» у advanced_terms согласовано с «условиями».
