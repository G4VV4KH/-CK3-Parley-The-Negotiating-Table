 setting_tnt_trade_prestige_off_desc:0 "Престиж не обменивается ни с кем и никогда: обе строки престижа исчезают со стола переговоров, кнопка равновесия никогда не тратит престиж, и ни одно предложение ИИ его не содержит. Золото, благочестие и влияние не затронуты."
 rule_tnt_trade_piety:0 "Parley: торговля благочестием"
