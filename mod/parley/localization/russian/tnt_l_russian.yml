 # УГРОЗА (расширение 1 V4). Все числа в подстроке и в подсказке читаются живьём,
 # поэтому здесь нечему устареть при перекалибровке tnt_57_threat_values.txt.
 # Формулировки нигде не обещают войну: угроза — это давление, а война — отдельная
 # кнопка.
 # ИМЯ САМОГО МОДИФИКАТОРА МНЕНИЯ (common\opinion_modifiers\tnt_61_opinions.txt).
 # Модификатор мнения локализуется по собственному идентификатору, и без этого ключа
