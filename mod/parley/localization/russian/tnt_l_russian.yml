 # ТРИ ПАНЕЛИ ВЫБОРА ЛЮДЕЙ ПО ПУНКТУ 19 (9 ключей), gui\tnt_panel_people.gui:
 # наложение с индексом 16 — заложник, 17 — воспитанник, 18 — придворные, и у
 # каждого сторона 0 — ваша, сторона 1 — партнёра.
 # V16, ПУНКТ 5: ПАНЕЛЕЙ ДВЕ, А НЕ ТРИ. Панель воспитанника закомментирована, а
 # НАЛОЖЕНИЕ С ИНДЕКСОМ 17 УШЛО В СПЯЧКУ — не переназначать его, ровно как индекс
 # 8 остаётся спящим после вывода панели пленников. Панели заложника и придворных
 # держат 16 и 18, а общие типы в gui\tnt_types.gui не тронуты: заложник
 # по-прежнему пользуется обоими.
 #
 # ЗАГОЛОВКИ НАМЕРЕННО РАЗДЕЛЕНЫ ПО СТОРОНАМ, ровно как у панели третьей стороны
 # выше. «Выберите заложника» без указания, чей он, — единственная фраза во всём
 # этом интерфейсе, которая способна тихо поменять стороны местами, а меняется
 # при этом чей-то ребёнок.
 #
 # СТРОКИ ПРАВИЛА, НАПРОТИВ, ОБЩИЕ ДЛЯ ОБЕИХ СТОРОН: один ключ на две панели
 # (tnt_panel_people.gui:128 и :182 читают один и тот же ключ), потому что
 # правило одно, кто бы ни отдавал. Их печатает text_multi, у которого
 # default_format уже «#weak», поэтому своего цветового тега строки не несут.
 # КАЖДУЮ НАДО ДЕРЖАТЬ В СОГЛАСИИ С ЕЁ ТРИГГЕРОМ — tnt_hostage_candidate_trigger,
 # tnt_courtier_candidate_trigger в
 # common\scripted_triggers\tnt_42_people_gates.txt (третьим был
 # tnt_ward_candidate_trigger, в V16 он закомментирован вместе с семейством), —
 # а также с
 # tnt_person_unique_trigger: именно он не пускает во все эти списки того, кто
 # уже обещан в другом пункте договора. Список, который никто не мог объяснить,
 # и был той причиной, по которой строка правила впервые появилась у панели
 # ненападения; если триггер сузится, той же правкой сужается и фраза.
 #
 # tnt_picker_rule_courtier — ЕДИНСТВЕННОЕ МЕСТО, ГДЕ НАЗВАН ПРЕДЕЛ В ТРИ
 # ПРИДВОРНЫХ. Признака «предел достигнут» у этого условия нет, поэтому
 # предупреждающая строка, которой пользуются другие панели множественного
 # выбора, здесь выключена и предел обязана нести строка правила.
 # Оговорка про соперников — постановление R5: замысел требовал цены −200 за
 # выдачу человека его же сопернику, инвариант I6 запрещает отрицательную цену,
 # поэтому вышел отказ, а отказ, о котором игроку не сказали, неотличим от
 # пропавшего имени.
 tnt_picker_title_hostage_p:0 "Выберите заложника, которого отправите вы"
 tnt_picker_title_hostage_r:0 "Выберите заложника, которого отправит он"
