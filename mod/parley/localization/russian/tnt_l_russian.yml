 # ОПОВЕЩЕНИЕ В «ТЕКУЩЕЙ ОБСТАНОВКЕ» (13) —
 # common\important_actions\tnt_91_alerts.txt
 # Полный набор ключей, который ваниль возит для записи с
 # combine_into_one = yes и без блока `unimportant`: <key> / _label / _desc /
 # _click (95 из 95) плюс четыре ключа _combined* (85-87 из 95). Образец —
 # GAME\localization\english\important_actions_l_english.yml:521-529
 # (action_can_vassalize).
 # ЗАКОН 10 ЭТИХ СТРОК НЕ КАСАЕТСЯ: локализация важных действий рисуется
 # системой подсказок самих важных действий по реальному скоупу, а не через
 # GetScriptedGui(S).BuildTooltip — привязка
 # tooltip = "[ImportantActionItem.GetTooltip]" в
 # GAME\gui\hud_notification_templates.gui:2407, и в ванильном файле 619
 # токенов [..] на 1220 ключей. Значит, токены и #разметка здесь безопасны —
 # ровно как в tnt_open_negotiations_extra_icon.
 # НИКАКОГО $NUM$: _important_actions.info:38 его описывает, но в ванильной
 # локализации он не встречается НИ РАЗУ — по закону 1 это недоказанная форма,
 # поэтому заголовок группы не обещает числа.
 # ОГОВОРКА, КОТОРАЯ ОБЯЗАНА ПЕРЕЖИТЬ ПЕРЕВОД: в _combined_group_description на
 # всех девяти языках названы ТРИ выборки — вассалы, сюзерены и соседи по суше
 # И ЗА МОРЕМ, — потому что именно их и обходит свод
 # (tnt_91_alerts.txt:296, :363, :388). Выкиньте оговорку — и оповещение соврёт.
 # Формулировки намеренно повторяют tnt_open_negotiations_extra_icon, чтобы
 # значок в меню правой кнопки и это оповещение звучали одним голосом.
 # =========================================================================
 tnt_action_can_lean_on:0 "@dread_icon! Перевес на вашей стороне"
 tnt_action_can_lean_on_label:0 "@dread_icon! [recipient.GetPrimaryTitle.Custom('GetTierIcon')][recipient.GetUINameNoTooltip] — на него можно надавить"
 tnt_action_can_lean_on_desc:0 "[recipient.GetUIName] — на него можно надавить: ваше войско, ваше имя и ваш ужас, каждое против его собственного, набирают тот вес, который нужен угрозе, и прошлая угроза забыта. Выложите угрозу на стол — и ровно этот вес прибавится к тому, что он готов снести, так что он заплатит больше, лишь бы закончить разговор."
 tnt_action_can_lean_on_click:0 "#I Щёлкните, чтобы начать переговоры о договоре#!"
 tnt_action_can_lean_on_combined_label:0 "[recipient.GetPrimaryTitle.Custom('GetTierIcon')] [recipient.GetUINameNoTooltip]"
 tnt_action_can_lean_on_combined_group_label:0 "@dread_icon! Правители, над которыми у вас перевес"
 tnt_action_can_lean_on_combined_group_name:0 "@dread_icon! На кого можно надавить"
 tnt_action_can_lean_on_combined_group_description:0 "Среди ваших вассалов, ваших сюзеренов и соседей — по суше и за морем — на каждого из этих правителей можно надавить: ваше войско, ваше имя и ваш ужас, каждое против его собственного, набирают тот вес, который нужен угрозе, и прошлая угроза забыта. Начните с любым из них переговоры и отметьте «Угрожать», чтобы положить угрозу на стол."
 # =========================================================================
 # ОПЫТ I2: ДЕФЕКТ ПОДСКАЗКИ «has no localization».
 # РАУНД 7 написан 2026-08-19; ПРИГОВОР РАУНДА 7 и ИСПРАВЛЕНИЕ РАУНДА 8 добавлены
 # 2026-08-23. СНАЧАЛА прочтите два абзаца «ВОСЬМОЙ РАУНД» ниже: они отменяют и
 # план перекрёста, и гипотезу тире, за которые ратует более старый текст.
 #
 # *** НЕ «ПРИВОДИТЬ В ПОРЯДОК» tnt_err_threat_weak / _unknown / _nofear /
 # *** _recent (ищите их грепом; номера строк в этом блоке протухали дважды и
 # *** чинить их не стоит). Их
 # *** точные байты суть измерительный прибор живого опыта. Семь раундов
 # *** провалились на этом дефекте, и ЧЕТЫРЕ из них выпустили исправление
 # *** вместе с гипотезой сразу, так что не выяснилось ничего. `_unafraid`
 # *** ВЫВЕДЕН в восьмом раунде, см. ниже. Прочтите этот
 # *** блок, прежде чем трогать те четыре строки.
 # *** Блок дописан именно В КОНЕЦ файла: вставка над ключами сдвинула бы все
 # *** номера строк .yml ниже 442, а на них ссылаются четыре комментария в
 # *** gui\tnt_panel_contract.gui и два в
 # *** common\script_values\tnt_54_multiselect_values.txt.
 #
 # ЕДИНСТВЕННОЕ НАБЛЮДЕНИЕ, КОТОРОЕ ЕСТЬ У ПРОЕКТА. parley\temp\screen5.png:
 # РУССКАЯ сессия, 23 февраля 1185 года, партнёр атабег Караджа. Погашенный
 # флажок «Угрожать» показал ОДНУ строку, курсивом пурпурного цвета с красным
 # (!):
 #     tnt_err_threat_unafraid has no localization
 # Строки 1, 2 и 4 той же подсказки ПРОШЛИ, поэтому не описывались, и рядом не
 # отрисовалось ничего. Мод ни разу не видели отрисовывающим предложение из
 # custom_description на пути BuildTooltip. Счёт таков: отрисовок 0, сообщение
 # 1, не наблюдалось 44. Все «контроли», на которые опирались прежние раунды,
 # были выводом из отсутствия, а не измерением: семь из них перечислены и
 # опровергнуты в заголовке _docs\tools\tnt_bare_tooltip_row_check.ps1.
 #
 # ЧТО ЗНАЧИТ ЭТО СООБЩЕНИЕ, ПО ДВОИЧНОМУ ФАЙЛУ. «%s has no localization» лежит
 # в ck3.exe по смещению 72140771, между «Current level cannot be automatically
 # flattened. Use custom_tooltip or custom_description» (72140672) и «Trigger
 # loc for '%s' is missing» (72140792). Последние две суть РАЗНЫЕ отказы:
 # «Trigger loc ... is missing» значит, что у триггера нет записи в
 # common\trigger_localization\, а «%s has no localization» значит, что
 # НАЗВАННЫЙ КЛЮЧ ЛОКАЛИЗАЦИИ НЕ УДАЛОСЬ РАЗРЕШИТЬ. Стало быть, %s есть ключ
 # локализации, а tnt_err_threat_unafraid есть ключ, а не имя триггера. Все
 # раунды, читавшие это сообщение как называющее ТРИГГЕР, читали его неверно;
 # именно поэтому этот файл теперь участник расследования, а не свидетель.
 #
 # УЖЕ ИСКЛЮЧЕНО ИЗМЕРЕНИЕМ: ничего из этого выводить заново не нужно. Имя
 # ключа чисто в ASCII в обоих .yml (выписаны все кодовые точки: ни омоглифа,
 # ни символа нулевой ширины); оба файла разбираются канонически (0
 # неканонических строк из 2102 и 2036, ровно две кавычки на строку данных, ни
 # одного многострочного значения); наборы ключей совпадают, 570 = 570, ни
 # дубля, ни одностороннего ключа. КЛЮЧ ЗАГРУЖЕН. Разметку «#high 75#!» и
 # «#high 40#!», которую этот ключ носил прежде, сняли в шестом раунде, и
 # симптом это исправление пережил.
 #
 # ЕДИНСТВЕННАЯ ПЕРЕМЕННАЯ, ЖИВАЯ ВНУТРИ ЭТОГО ФАЙЛА: ТИРЕ U+2014 в ЗНАЧЕНИИ
 # описываемого ключа. Из четырёх ключей угрозы русский несёт его ровно на двух
 # (_unknown в строке 440, _unafraid в строке 441), английский на одном
 # (_unafraid, строка 414 там). Screen5 есть русская сессия, значит правит
 # русский: из 45 достижимых ключей custom_description тире несут 6, не несут
 # 39, и единственный когда-либо наблюдавшийся ключ входит в эти 6. Это 1 из 1
 # против 0 из 0: ни доказательство, ни опровержение. Механически гипотеза
 # слаба, ибо символ внутри ЗНАЧЕНИЯ не может сорвать поиск КЛЮЧА, однако
 # оправдание шестого раунда опиралось на tnt_err_no_influence_gov, ключ, ни
 # разу не описанный, так что вопрос НЕ РЕШЁН, а не закрыт.
 # ПЕРЕПИСЬ ТЕПЕРЬ МЕХАНИЧЕСКАЯ, и на глаз её больше никто не считает: ПРОХОД E
 # в _docs\tools\tnt_bare_tooltip_row_check.ps1 печатает её при каждом запуске и
 # независимо воспроизводит те же числа — по-русски 6 из 45
 # (tnt_err_grand_not_dominant, tnt_err_indep_p_unavailable,
 # tnt_err_indep_r_unavailable, tnt_err_no_influence_gov,
 # tnt_err_threat_unafraid, tnt_err_threat_unknown), по-английски 2 из 45
 # (tnt_err_courtier_p_unavailable, tnt_err_threat_unafraid). При нулевой
 # гипотезе вероятность того, что единственное наблюдение попадёт на ключ с
 # тире, есть 6/45, то есть 13%: ничего примечательного. У прохода есть
 # переключатель -FailOnEmDash; он ВЫКЛЮЧЕН и ОБЯЗАН оставаться выключенным,
 # пока наведение не докажет гипотезу. Заставить недоказанную догадку запирать
 # пусковые ворота значило бы повторить ошибку шестого раунда, лишь обрядив её в
 # инструмент.
 #
 # *** СЕДЬМОЙ РАУНД ЗАКОНЧЕН. ПРОШЁЛ НЕ ПЕРЕКРЁСТ, А ПЕРЕИМЕНОВАНИЕ. ***
 # Описанный ниже перекрёст так и не был взведён. Вместо него было выпущено
 # ПЕРЕИМЕНОВАНИЕ ключа строки 3: tnt_err_threat_unafraid -> tnt_err_threat_nofear
 # при побайтово том же значении, то есть та же логика одной переменной: имя
 # меняется, всё прочее держится. ЗАХОД ИГРОКА ОТ 2026-08-23 НАПЕЧАТАЛ
 #     tnt_err_threat_nofear has no localization
 # значит отказ ПОСЛЕДОВАЛ за переименованием. Это оправдывает ИМЯ ключа и
 # обвиняет СТРОКУ или САМУ КОНСТРУКЦИЮ, и потому абзац про тире выше есть
 # теперь история, а не живая гипотеза: сообщение пережило переименование, а
 # переименование не может изменить ни одного знака внутри значения.
 #
 # ИСПРАВЛЕНИЕ ВОСЬМОГО РАУНДА, И ПОЧЕМУ ОНО ЕСТЬ КОНТРОЛЬ, А НЕ ОЧЕРЕДНАЯ
 # ДОГАДКА. Единственное, чем строка 3 отличалась от всего остального мода, был
 # ЛИСТ: блочный параметризованный движковый триггер
 # has_dread_level_towards = { target level } внутри tnt_threat_feared_trigger. У
 # него НЕТ ни одной записи в ванильном common\trigger_localization\ (1636 записей
 # в 51 файле), тогда как у всех прочих листьев этой подсказки запись есть. Он был
 # 1 из 90 строк переписи и 1 из 45 достижимых ключей. Восьмой раунд заменил эту
 # ветвь двумя описуемыми листьями: dread >= 30 против того, кто
 # target_is_liege_or_above по отношению к угрожающему. ТЕПЕРЬ ТАКОГО ЛИСТА НЕТ
 # НИГДЕ НИ НА ОДНОМ ОПИСЫВАЕМОМ ПУТИ, а ПРОХОД G в
 # _docs\tools\tnt_bare_tooltip_row_check.ps1 отныне ОТКАЗЫВАЕТ на этой форме, а
 # не отмечает её заметкой.
 # СЛЕДУЮЩЕЕ НАВЕДЕНИЕ РЕШАЕТ ДЕЛО В ЛЮБУЮ СТОРОНУ:
 #   * появилось ПРЕДЛОЖЕНИЕ -> лист и был причиной, вопрос закрыт.
 #   * «tnt_err_threat_nofear has no localization» СНОВА -> гипотеза листа МЕРТВА,
 #     ибо такого листа больше нет, и подтверждена гипотеза (f): все 45 ключей
 #     причин надо ЗАМЕНЯТЬ, а не чинить. НЕ ИЩИТЕ ОЧЕРЕДНОЙ ЛИСТ.
 #
 # tnt_err_threat_unafraid ВЫВЕДЕН И УДАЛЁН из всех девяти языков. Опыт, которому
 # он служил, закончен, а после исправления его текст описывал правило, которого у
 # мода больше нет; протухший сирота в девяти языках есть ловушка, а не запасная
 # часть. Будущий опыт над ключом заводит свой ключ сразу во всех девяти файлах,
 # чего закон 9 требует и без того. Счёт ядра сдвинулся с 578 на 577 на язык.
 #
 # ====== ПЕРВАЯ ФАЗА: ЧЕТЫРЕ ДАРОВЫХ НАВЕДЕНИЯ И НИ ОДНОЙ ПРАВКИ ======
 # ГЛАВНЫЙ ВОПРОС ЛЕЖИТ ВОВСЕ НЕ В ЭТОМ ФАЙЛЕ, и решается он без изменения хотя
 # бы одного байта. ГИПОТЕЗА (f): custom_description внутри is_valid скриптового
 # GUI, до которого добирается ScriptedGui.BuildTooltip, может просто НЕ
 # ПОДДЕРЖИВАТЬСЯ обходчиком описаний движка. Тогда сообщение печатали бы все 45
 # достижимых ключей, и весь замысел мода с подсказками-причинами надо не
 # латать, а ЗАМЕНЯТЬ. Основание: В ВАНИЛИ НЕТ НИ ОДНОГО ПРИМЕРА ЭТОЙ
 # КОНСТРУКЦИИ. ScriptedGui.BuildTooltip встречается во всём ванильном дереве
 # gui ровно дважды (<vanilla>\gui\window_faith.gui:902 и :915), и оба раза
 # ведёт к is_valid из ОДНОГО голого параметризованного вызова, внутри которого
 # custom_description нет вовсе
 # (<vanilla>\common\scripted_guis\00_religion.txt:317-319 и :333-335). Те
 # ванильные scripted_guis, которые custom_description всё-таки используют,
 # достигаются совсем иными путями. Стало быть, во всей игре так делает один
 # лишь мод; наблюдаемая доля отрисовок на этой поверхности есть 0 из 1; и шесть
 # раундов правок ВНУТРИ конструкции не изменили ничего — чего и следует ждать,
 # если виновата сама конструкция.
 #
 # КАК ЧИТАТЬ ЛЮБУЮ ИЗ ПЯТИ ПРОБ. Сообщайте КАЖДУЮ строку в рамке дословно.
 # Строка, читающаяся как предложение, есть ОТРИСОВКА; строка вида
 # «<ключ> has no localization» курсивом пурпурного цвета с красным (!) есть
 # СООБЩЕНИЕ. Прошедшие строки не описываются вовсе, поэтому рамка из одной
 # строки есть ОБЫЧНЫЙ вид и сама по себе ничего не доказывает: принять её за
 # доказательство и значит повторить бессодержательный контроль № 1.
 #   ПРОБА A  «Угрожать» против партнёра, чьё войско БОЛЬШЕ вашего. Когда он
 #            сильнее, строка не скрывается: visible в
 #            gui\tnt_diplomacy_window.gui:1706 есть голое
 #            "[TntRow('tnt_show_threat_p')]" без второго сомножителя, а TntRow
 #            опирается на tnt_hide_unavailable, которую никто не пишет
 #            (data_binding\tnt_macros.txt:201-205), так что она верна
 #            безусловно. Тогда строка 1, tnt_err_threat_weak (строка 439 этого
 #            файла, tnt_20_scripted_guis.txt:552), НЕ ПРОХОДИТ и описывается
 #            впервые за всю историю проекта. Значение её простое: ни тире, ни
 #            разметки, ни лексемы, а единственный её лист
 #            max_military_strength запись в ванили ИМЕЕТ.
 #            ОТРИСОВАЛОСЬ -> (f) умирает и (h) умирает: поверхность работает
 #            для простого ключа со всеми записями, а дефект присущ именно
 #            строке 3. НАПЕЧАТАЛОСЬ -> (f) подтверждена для практических целей,
 #            а (a), (b), (c), (d') и (g) разом теряют значение.
 #   ПРОБА B  «Использовать крючок» в ЛЕВОМ столбце, когда крючка на него нет.
 #            Это состояние ПО УМОЛЧАНИЮ и буквально состояние screen5, так что
 #            готовить ничего не нужно. tnt_err_usehook_none (строка 427 этого
 #            файла, tnt_23_usehook.txt:27) есть простое значение над ОДНИМ
 #            ПРОСТЫМ листом, у которого записи нет по построению:
 #            tnt_usehook_strength_value >= 1 есть скриптовое значение, а из 1636
 #            имён записей trigger_localization в ванили (51 файл; счёт мой,
 #            токенизатором этого же проекта) ни одно не есть скриптовое
 #            значение.
 #            ОТРИСОВАЛОСЬ -> (d') тяжело повреждена, (f) умирает.
 #            НАПЕЧАТАЛОСЬ -> (d') сильно подтверждена на другом GUI, другом
 #            ключе, простом значении и ПРОСТОМ листе, а (a), (b) и (g) умирают
 #            все три в одном наблюдении.
 #   ПРОБА C  «Предложить» при пустом столе, то есть в том же собственном
 #            состоянии screen5. tnt_err_nothing (строка 871 этого файла,
 #            tnt_20_scripted_guis.txt:1423) над tnt_offer_nonempty_trigger ->
 #            tnt_items_count_value > 0 (tnt_40_triggers.txt:1000-1001). Когда на
 #            столе ничего нет, все прочие строки нехватки проходят, так что
 #            ждите чистой рамки из ОДНОЙ строки. Это независимое повторение
 #            пробы B ещё через один уровень рекурсии скриптовых триггеров и
 #            прямая проверка бессодержательного контроля № 6, утверждавшего,
 #            будто эта строка «отказывает при всяком пустом окне, ни разу не
 #            напечатав».
 #   ПРОБА D  «Вассальная присяга» в ЛЕВОМ столбце, ПОКА идёт война с ним.
 #            tnt_err_vassal_mutual_war (строка 918 этого файла,
 #            tnt_20_scripted_guis.txt:1028, а для стороны _r то же на :1153)
 #            есть NOT = { root = { is_at_war_with = var:tnt_partner } }; записи
 #            в ванили есть у ОБОИХ листьев, значение простое. Ждите, что не
 #            пройдут и прочие вассальные строки (ранг, стена); сообщайте каждую
 #            строку.
 #            ОТРИСОВАЛОСЬ -> независимое подтверждение пробы A на ВТОРОМ GUI,
 #            значит (f) умирает дважды. НАПЕЧАТАЛОСЬ -> (f) подтверждена на
 #            втором GUI, на простом ключе со всеми записями. Решает в любом
 #            случае.
 #   ПРОБА E  ПОПУТНЫЙ ВАНИЛЬНЫЙ КОНТРОЛЬ, мод в нём не участвует: погашенная
 #            кнопка «Создать / Воссоздать главу веры» в окне веры
 #            (<vanilla>\gui\window_faith.gui:894-918). Она видна только на
 #            ВАШЕЙ вере, только при доктрине главы веры и только когда титул
 #            главы отсутствует (:897) либо существует без держателя (:910), так
 #            что её может и не оказаться; берите, если есть.
 #            НАПЕЧАТАЛОСЬ «can_create_head_of_faith_title_trigger has no
 #            localization» -> бессодержательный контроль № 5 рушится, и (h)
 #            становится ведущим объяснением. ОТРИСОВАЛОСЬ предложение -> голые
 #            строки на этой поверхности наконец доказаны безопасными
 #            наблюдением, а не утверждением.
 #
 # *** ЭТИ ТРИ КЛЮЧА ТЕПЕРЬ ТОЖЕ ПРИБОРЫ — ИХ ТОЖЕ НЕ «ПРИВОДИТЬ В ПОРЯДОК». ***
 # tnt_err_usehook_none (строка 427), tnt_err_nothing (строка 871) и
 # tnt_err_vassal_mutual_war (строка 918). Каждый намеренно ПРОСТ: ни тире, ни
 # разметки, ни лексемы «[..]», ни вложенного ключа в знаках доллара; и эта
 # простота И ЕСТЬ контроль. Всякое украшение, добавленное к любому из трёх,
 # губит ту пробу, которую он несёт, а проба дороже украшения.
 #
 # ВОСЬМОЙ РАУНД СНЯЛ ТИРЕ ПОПУТНО, А НЕ КАК ИСПРАВЛЕНИЕ. Ключ
 # tnt_err_threat_nofear всё равно надо было переписать во всех девяти языках,
 # ибо у правила появилась третья ступень, и предложение перестроено через
 # двоеточие в каждом языке, а не заменой тире на дефис: дефис там, где
 # по-русски требуется тире, был бы новой ошибкой, а не исправлением.
 #   ныне: "Он вас не боится: нужен ужас не ниже 75, либо 40 против того, кто не отличается смелостью, либо 20 против того, кто находится под вашей властью" (последняя ступень 30 -> 20 после прогона D; цитата сверена со строкой 463)
 #
 # tnt_err_threat_unknown ТИРЕ СОХРАНЯЕТ, И ЭТО РЕШЕНИЕ, А НЕ НЕДОСМОТР. Заготовка
 # «Ваше имя должно хоть что-то весить: уровень престижа выше нулевого» остаётся
 # НЕ ПРИМЕНЁННОЙ: этот ключ есть теперь лучший из оставшихся контролей на тире -
 # та же подсказка, тот же русский заход, живое тире в значении, и он ОТКАЗЫВАЕТ
 # всякий раз, когда уровень престижа игрока нулевой. Снять с него тире значит
 # уничтожить контроль ради гипотезы, которая после переименования и без того
 # ослабла. ДЕФИС ВНУТРИ СЛОВА «что-то» ЕСТЬ U+002D И ЕСТЬ ВЕРНОЕ РУССКОЕ
 # НАПИСАНИЕ. Никогда не прогоняйте по этим значениям посимвольную замену тире:
 # правки только пословные и только по якорю. 24.08.2026, РЕШЕНИЕ О СООТНОШЕНИИ: ЭТОТ КОНТРОЛЬ МЁРТВ, а не просто выведен. tnt_err_threat_unknown сохранял тире потому, что ОТКАЗЫВАЛ при нулевом уровне престижа, — а эта строка теперь внутри tnt_threat_points_value, так что ключ ничего не описывает и недостижим. Роль прибора перешла к tnt_err_threat_weak, и он по той же доктрине переписан ЧЕРЕЗ ДВОЕТОЧИЕ на всех девяти языках: описываемый ключ остаётся без тире. Если гипотезу когда-нибудь оживят, ей нужна НОВАЯ живая строка с тире, а не эта.
 #
 # МЕХАНИЧЕСКИЙ СТРАЖ: _docs\tools\tnt_bare_tooltip_row_check.ps1 печатает
 # перепись тире по всем достижимым ключам custom_description как ЗАМЕТКУ, а
 # его переключатель -FailOnEmDash обращает эту перепись в ОТКАЗ в тот день,
 # когда гипотеза будет доказана. ПРОХОД F того же инструмента сторожит теперь
 # ВЫПУЩЕННЫЙ состав строк угрозы (weak / unknown / nofear / recent, плюс
 # no_partner в trigger_else) и проверяет, что tnt_err_threat_unafraid отсутствует
 # в обоих авторских .yml, так что впредь никому не придётся гадать, взведён ли
 # опыт. ПРОХОД G есть тот самый новый ОТКАЗ восьмого раунда.
 # =========================================================================
 tnt_msg_stale:0 "Условия изменились"
 tnt_err_deal_changed:0 "Договор больше нельзя исполнить в записанном виде; обмен не состоялся."
