 setting_tnt_trade_prestige_on_desc:0 "Престиж можно предлагать и требовать за столом переговоров с любым партнёром — это доступно и вам, и правителям под управлением ИИ. Самая широкая из трёх настроек."
 setting_tnt_trade_prestige_peer:0 "Только с равными и ниже"
 setting_tnt_trade_prestige_peer_desc:0 "Престиж можно менять только с правителем, чей уровень репутации не выше вашего, — славу не продают вверх. Сядьте за стол с тем, кто именитее вас, и обе строки престижа на этих переговорах просто исчезнут, кнопка равновесия не потратит ни очка престижа, и ни одно его письмо не запросит престиж. Со всеми остальными ничего не меняется."
