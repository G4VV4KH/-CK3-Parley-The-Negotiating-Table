 tnt_usehook_strong:0 "Сильный крючок — использование его не расходует"
 tnt_usehook_weak:0 "Слабый крючок — взыскание его израсходует"
 tnt_usehook_none:0 "У вас нет на него крючка"
 tnt_bd_usehook_p:0 "Взысканный крючок"
 tnt_err_usehook_none:0 "У вас нет крючка на него, чтобы его тратить"
 # === ПРИБОР ОПЫТА I2: семейство tnt_err_threat_* ниже есть измерительный прибор,
 # === а не обычный текст. НЕ ПРАВИТЬ. Приговор в конце этого файла и у самой
 # === строки, common\scripted_guis\tnt_20_scripted_guis.txt. 24.08.2026: решение о соотношении оставило ОДНУ строку доверия, поэтому _weak ПЕРЕПИСАН и стал прибором закона 10d вместо _nofear — та же поверхность, та же обёртка custom_tooltip, тот же контроль; _unknown и _nofear ЗАКРЕПЛЕНЫ и не проверяют ничего. ===
 tnt_item_threat:0 "Угрожать"
 tnt_item_threat_desc:0 "Дать ему понять, чего будет стоить отказ. Это не объявление войны: ничего не подписано и никто не идёт в поход. Это вес на столе, и он действует на правителя, который вас никогда не полюбит, — то есть там, где бессильно золото.\n\nЕго вес — это #high насколько ваше войско перевешивает его войско#!, поднятое или сбитое тем, #high насколько ваше имя громче его имени#!, и тем, #high насколько ваш ужас страшнее его ужаса#!. Отставание на целую ступень престижа закрывает угрозу совсем, каким бы ни было ваше войско, — а тот самый вес, который открывает угрозу, ровно на столько же и склоняет договор в вашу пользу.\n\n#weak Он это запомнит. Договор, подписанный под угрозой, обойдётся вам в «$tnt_threat_opinion$» — #high −100#! к мнению, затухая пятнадцать лет, — а поскольку именно его расположение придаёт вес вашим дарам, взятое страхом сегодня означает, что ваше золото будет покупать у него меньше целое поколение. Но платит не одно ваше золото: ваша собственная натура судит этот поступок. Иная совесть понесёт его вес сама, собственным #high стрессом#!, а правителю более холодному станет только легче оттого, что рычаг наконец пущен в ход. В окне подтверждения вы увидите и свойства, которые отозвались, и точную величину, — прежде чем посол тронется в путь.#!"
 # ЗДЕСЬ НЕЛЬЗЯ `SCOPE.ScriptValue`. Этот токен означает «тот скриптовый контекст, в
 # котором разворачивается текст», и существует, когда движок собирает подсказку
 # внутри эффекта (поэтому им законно пользуется tnt_stage_pair_points_line). Этот
 # ключ печатается из blockoverride в .gui, где скриптового контекста нет — только
 # датаконтексты, — поэтому он обязан сам назвать свой root, ровно как tnt_wed_count.
 tnt_threat_sub:0 "Войско [GetPlayer.MakeScope.ScriptValue('tnt_threat_ratio_value')|1] к 1, имя ×[GetPlayer.MakeScope.ScriptValue('tnt_threat_rep_term_value')|0], ужас ×[GetPlayer.MakeScope.ScriptValue('tnt_threat_dread_term_value')|2]"
 tnt_bd_threat_p:0 "Прямое давление"
 tnt_bd_threat_panel:0 "Давление"
 tnt_err_threat_weak:0 "Для угрозы нужно не менее 100 очков сделки от военной мощи, престижа и ужаса. Этот минимум одинаков для игрока и ИИ."
 tnt_err_threat_relation:0 "Угрожать можно только независимому правителю, который не является вашим союзником и не связан с вами заложником"
 tnt_err_threat_unknown:0 "Ваше имя должно хоть что-то весить — уровень престижа выше нулевого"
 # tnt_err_threat_unafraid ВЫВЕДЕН в раунде 8 (I2). Эта надгробная строка держит счёт строк, чтобы ни одна ссылка на .yml не сдвинулась. ОСИРОТЕЛИ 24.08.2026 ПО РЕШЕНИЮ О СООТНОШЕНИИ, НО ОСТАВЛЕНЫ ЗАДАННЫМИ НА ВСЕХ ДЕВЯТИ ЯЗЫКАХ: у tnt_err_threat_unknown выше и tnt_err_threat_nofear ниже НЕТ ни одной строки-условия — их правила теперь внутри tnt_threat_points_value. Закон 9 (выведенное имя остаётся читаемым, чтобы возврат не требовал раскопок) и контроль опыта 10d. НЕ УДАЛЯТЬ И НЕ ИСПОЛЬЗОВАТЬ ПОД ДРУГИМ СМЫСЛОМ.
 tnt_err_threat_nofear:0 "Он вас не боится: нужен ужас не ниже 75, либо 40 против того, кто не отличается смелостью, либо 20 против того, кто находится под вашей властью"
 tnt_err_threat_recent:0 "Он ещё помнит вашу прошлую угрозу. Дайте памяти остыть, прежде чем давить снова"
 # ===================================================================
 # V13, ПУНКТ 1: ОСИРОТЕЛ, ОСТАВЛЕН ЗАДАННЫМ — строка союза выведена. Он же
 # был единственным читателем tnt_tt_alliance_glut: тот подставлялся токеном
 # $...$ в последнем абзаце, — так что и этот ключ осиротел вместе с ним.
 tnt_item_alliance_desc:0 "Один официальный союз, в который вы вступаете вдвоём, — его не передают с одной стороны на другую. После этого любая из сторон может призвать другую на войну, а отказ от призыва ударит по [Concept('prestige', 'престижу')|E].\n\n#weak Одна строка на один союз: он либо есть в договоре, либо нет.#!\n\n#weak Со своим [Concept('liege', 'сюзереном')|E] или со своим [Concept('vassal', 'вассалом')|E] это союз-обязательство, а не призыв к оружию: сюзерен и вассал не могут вызвать друг друга на войну — так устроена сама игра. Но союз настоящий: он учитывается везде, где учитываются союзы, и переживёт тот день, когда один из вас выйдет из чужого домена.#!\n\n#weak $tnt_tt_alliance_glut$#!"
 # ПРЕСЫЩЕНИЕ СОЮЗАМИ (пункт 22) — ЕДИНСТВЕННАЯ ПЛАТА ЗА ЭТИМ СТОЛОМ, У КОТОРОЙ
 # НЕТ СТРОКИ РАЗБОРА. Ванильные множители союза не выдуманы заново, а перенесены
 # в условие о союзе (постановление пользователя по пункту 22), и число уже
 # заключённых союзов — один из них: tnt_ally_glut_self_value и
 # tnt_ally_glut_partner_value умножают всё условие целиком
 # (tnt_50_values.txt:704, :768, применяются в :1084-1085) и воспроизводят
 # лесенку «×0.5 за каждого союзника, который не вассал и не сюзерен»
 # (MSM:181-204) вместе со строками −15 из 00_alliance.txt:2126-2146 и
 # :2148-2169. МНОЖИТЕЛЬ — единственная форма, безопасная для инварианта I4:
 # множитель тянет неотрицательное слагаемое к нулю, но не проводит его сквозь
 # ноль. Плата за эту форму в том, что в разборе для неё нет строки, — поэтому
 # эта фраза и есть единственное место, где игрок вообще может узнать правило.
 # ОБЪЯВЛЕН ЗАРАНЕЕ: ни один файл .gui не входил в задачу автора, поэтому ключ
 # пока никто не читает. Его подключит тот, кто добавит подсказку строке союза.
 tnt_tt_alliance_glut:0 "Каждый уже заключённый союз обесценивает следующий. Начиная со второго союзника — не считая вашего сеньора и ваших вассалов — каждый существующий союз вдвое снижает ценность нового договора в глазах партнёра; его собственные союзники точно так же обесценивают договор для вас."
 # V13, ПУНКТ 1: ОСИРОТЕЛИ, ОСТАВЛЕНЫ ЗАДАННЫМИ — строка пакта выведена.
 tnt_item_truce:0 "Пакт о ненападении"
 tnt_item_truce_desc:0 "Один пакт, в который вы вступаете вдвоём: ни одна из сторон не может объявить войну другой в течение #high десяти лет#!.\n\n#weak Одна строка на один пакт: он либо есть в договоре, либо нет.#!"
 tnt_item_marriage:0 "Брачный союз"
 tnt_item_marriage_desc:0 "Союз двух домов, и #high сколько угодно пар в одном договоре#!. Выберите по человеку с каждой стороны, задайте линию наследования и добавьте пару; если кто-то из двоих ещё ребёнок, эту пару обручат, а не поженят.\n\n#weak Каждая следующая пара ценится партнёром чуть ниже предыдущей, а издержки брака для него не снижаются никогда, — так что несколько хороших браков выгоднее дюжины пустых. Дом, которому предлагают породниться ниже своего ранга, берёт за это надбавку, и чем шире разрыв, тем она тяжелее. Одной паре можно вдобавок обещать большую свадьбу.#!\n\n#high Достаточно близкая партия теперь приносит с собой союз#! — ровно так же, как это делает собственный брачный сговор игры, — и цена договора этот союз уже учитывает: партия, дающая союз, стоит дороже той, что его не даёт. #weak Подсказкам «Возможный союз», которые брачный экран рисует у кандидатов, снова можно верить.#!"
 tnt_item_title:0 "Передача титула"
 tnt_item_title_desc:0 "Отдать титул графского ранга или выше вместе со всем, что ему подчинено.\n\n#weak Сколько угодно за раз. Столичное графство и первый титул на стол не выкладываются. Земля сверх того, что вмещает домен, — всё равно земля: её возьмут и заплатят полную цену, а с перегрузкой домена пусть разбираются собственные управители.#!"
 # V13, ПУНКТ 1: ОСИРОТЕЛИ, ОСТАВЛЕНЫ ЗАДАННЫМИ — выведены оба поколения
 # дарования претензии: и одиночный выбор, и множественный.
 tnt_item_claim:0 "Дарование претензии"
 tnt_item_claim_desc:0 "Даровать слабую [Concept('claim', 'претензию')|E] на один из титулов отдающей стороны — прямое приглашение к будущей войне и весьма тяжёлая уступка.\n\n#weak Сколько угодно за раз.#!"
 # ===================================================================
 # ===================================================================
 # ВЫВЕДЕННЫЕ УСЛОВИЯ — СЕМЕЙСТВО ПЛЕННИКОВ (пункт 7). Оба пункта о пленниках,
 # и «всех разом», и списочный, были построены, испытаны в игре и СНЯТЫ НА
 # НЕОПРЕДЕЛЁННЫЙ СРОК. Причина, названная самим пользователем, записана рядом
 # с кодом: сделать пленников как следует можно лишь с опорой на ВАНИЛЬНУЮ
 # систему пленников, а не на собственный учёт этого мода.
 # Полное решение — в надгробии в common\scripted_effects\tnt_32_apply.txt.
 #
 # ВСЕ СЕМЬ КЛЮЧЕЙ НИЖЕ ОСТАЮТСЯ ЗАДАННЫМИ, И ЭТО НАМЕРЕННО, А НЕ НЕДОСМОТР:
 # оба файла держат одинаковое число ключей с совпадающими наборами, поэтому
 # удаление любого из них рушит сверку сразу в двух файлах; неиспользуемый ключ
 # ничего не стоит, а незаданный печатается на экране сырым идентификатором, и
 # сырой ключ внутри подсказки — записанный в этом моде класс падений.
 # Возвращение условия не должно требовать нового перевода.
 # tnt_multi_count_prisoner_p и tnt_sel_count_prisoner_p по-прежнему читают
 # tnt_count_sel_prisoner_p_value — оно оставлено рабочим именно ради них.
 # ===================================================================
 # ОСВОБОЖДЕНИЕ ВЫБРАННЫХ ПЛЕННИКОВ (пункт A1 V4) — списочный пункт рядом с пунктом
 # «всех». Ключи счёта повторяют форму трёх других мультиселект-пунктов, поэтому бейдж,
 # подпись строки и деталь в листе читают одно и то же число.
 tnt_item_prisoner_multi:0 "Освободить выбранных"
 tnt_item_prisoner_multi_desc:0 "Открыть темницу для тех, кого вы назовёте, и ни для кого больше.\n\n#weak Цена пленника — это его ранг и его кровь: #high 10#! за любого, #high +15#! если он родня другой стороне, #high +10#! если он вообще держит титул, и #high +15 / +25 / +40 / +60#! по мере того, как титул доходит до графства, герцогства, королевства и империи. Пленный король стоит дороже дюжины безвестных — в этом и смысл выбора.#!\n\n#weak Любой выбор здесь отменяет пункт #high «Освобождение пленников»#!: иначе за одних и тех же людей заплатили бы дважды.#!"
 tnt_multi_count_prisoner_p:0 "Названо пленников: [GetPlayer.MakeScope.ScriptValue('tnt_count_sel_prisoner_p_value')|0]"
 tnt_sel_count_prisoner_p:0 "Названо: [GetPlayer.MakeScope.ScriptValue('tnt_count_sel_prisoner_p_value')|0]"
 tnt_picker_title_prisoner:0 "Выберите, кого освободить"
 # ===================================================================
 tnt_item_prisoners:0 "Освобождение пленников"
 tnt_item_prisoners_desc:0 "Отдающая сторона открывает темницы для всех пленников, связанных с другой стороной кровью или вассальной клятвой."
 tnt_item_hook:0 "Услуга"
 tnt_item_hook_desc:0 "Задолжать другой стороне [hook_i] услугу. Есть три степени: #high слабая#! держится десять лет и тратится при первом же использовании; #high сильная#! держится двадцать лет, годится снова и снова и требует пяти лет перерыва между применениями; #high вечная#! не истекает никогда, не тратится вовсе и требует тех же пяти лет перерыва между применениями.\n\n#weak Щелчок — степень выше, правый щелчок — ниже. Услугу нельзя обещать, если тот, кто должен её получить, уже держит рычаг влияния на того, кто её обещает.#!"
 tnt_item_artifact:0 "Артефакт"
 tnt_item_artifact_desc:0 "Отдать [artifact_i] артефакт из сокровищницы отдающей стороны.\n\n#weak Сколько угодно за раз. Не показываются предметы, которые сама игра не даёт передать: коронные регалии, привязанные к титулу, династические знамёна и реликвии своей веры при иноверце-получателе.#!"
 # ===================================================================
 # ВЫВЕДЕННОЕ УСЛОВИЕ — ОБЕЩАНИЕ НЕ НАПАДАТЬ НА ТРЕТЬЕ ЛИЦО (пункт 1). Оно было
 # построено, было испытано в игре и признано ИЗБЫТОЧНЫМ ДЛЯ ПРИЯТНОЙ ИГРЫ и
 # СНЯТО НА НЕОПРЕДЕЛЁННЫЙ СРОК — не удалено. Надгробие с решением лежит рядом
 # с кодом, в common\scripted_effects\tnt_32_apply.txt.
 #
 # Девять его ключей остаются заданными по тем же причинам, что изложены над
 # блоком пленников выше, а у tnt_truce_nonwar есть и своя: это `name` живого
 # add_truce_one_way, поэтому во всех сохранениях, сделанных до вывода условия,
 # односторонние перемирия по-прежнему печатают эту строку по имени. Удаление
 # поставило бы сырой ключ в уже идущую партию.
 # ===================================================================
 tnt_item_nonwar:0 "Обещание не нападать"
 tnt_item_nonwar_desc:0 "Заключить одностороннее [Concept('truce', 'перемирие')|E] с третьим правителем на #high десять лет#!; нарушить перемирие можно лишь ценой сурового наказания.\n\nКого можно назвать: правителей, чьи державы граничат с державой обещающего, и владельцев титулов, на которые у обещающего есть претензия. Нельзя назвать самих переговорщиков, союзников обещающего и тех, с кем у него уже действует перемирие.\n\n#weak Взамен другая сторона ничего не должна: тот, кто клянётся, просто не поднимает оружия.#!"
 tnt_item_vassal:0 "Вассальная присяга"
 tnt_item_vassal_desc:0 "Один правитель преклоняет колено и становится [Concept('vassal', 'вассалом')|E] другого — вместе со всей своей державой. Самое тяжёлое условие, какое можно выложить на этот стол, и единственное, к которому прилагается договор, доступный для правки."
 # ===================================================================
 # ЧЕТЫРЕ НОВЫХ УСЛОВИЯ ПУНКТА 19. У каждого ОДИН ключ названия на обе колонки —
 # колонка сама говорит, чья родня отправляется в путь, — и ОДИН ключ _desc,
 # привязанный ровно в одном месте: в blockoverride «tnt_row_tooltip» строки.
 #
 # КАЖДЫЙ _desc — СЛИЯНИЕ ДВУХ ЗАЯВОК, И ЭТО НЕ КОМПРОМИСС. Каждый из этих
 # четырёх ключей написали два автора: один — подсказку строки в одну фразу,
 # другой — ПРАВИЛО ОТБОРА, которое действительно проверяет триггер кандидата
 # (common\scripted_triggers\tnt_42_people_gates.txt, ворота P1, P5/P6, P9, P13).
 # Ключ хранит одну строку, у строки одна подсказка, а обе половины объявлены
 # несущими — поэтому подсказка несёт обе: сначала что это за условие, затем
 # кого можно назвать. У tnt_item_nonwar_desc выше та же форма ещё с v1.
 #
 # ЗАЧЕМ ПРАВИЛО ОТБОРА ВООБЩЕ В ТЕКСТЕ. Эти строки СКРЫВАЮТСЯ, когда никто не
 # подходит (макрос TntRow), и игрок, не прочитавший правила, никогда не узнает,
 # почему вчерашняя строка сегодня исчезла. Условие, которое будет скрывать
 # строку чаще всего, названо намеренно — третий воспитанник у одного опекуна
 # (ванильное num_of_relation_ward < 2) и земли внутри собственного владения
 # сюзерена по праву де-юре: необъяснённая пропажа строки читается как поломка.
 # V16: пример с третьим воспитанником теперь ИСТОРИЯ — строка воспитанника
 # выведена, её ворота закомментированы, и правило, которому учит этот абзац,
 # живёт лишь в трёх оставшихся условиях. Абзац сохранён потому, что дело в
 # рассуждении: скрытая строка всё равно обязана нести своё правило отбора в
 # подсказке, и теперь это держат описания заложника и придворных ниже.
 #
 # ОДИН КЛЮЧ, ДВА НАПРАВЛЕНИЯ, И ЛОВУШКА В ЭТОМ: «даровать независимость» в
 # ВАШЕЙ колонке освобождает ВАШЕГО вассала, в ЕГО колонке — ВАС. Описание
 # говорит об этом прямо; строки разбора _p/_r раздела D повторяют то же самое,
 # а шесть заголовков панелей раздела G разделены по сторонам ровно поэтому же.
 tnt_item_indep:0 "Даровать независимость"
 tnt_item_indep_desc:0 "Вассал освобождается от присяги и становится независимым правителем. С вашей стороны стола свободу обретает ваш собственный вассал; с его стороны — вы сами. Один договор не может нести одновременно и это, и присягу на верность.\n\n#weak Предложить это можно лишь там, где вы двое уже стоите как сюзерен и прямой вассал, освобождаемый владеет собственной землёй, ни одна из держав не ведёт войны, а его земли не входят во владения сюзерена по праву де-юре.#!"
 tnt_item_hostage:0 "Заложник"
 tnt_item_hostage_desc:0 "Близкий родственник дающего — ребёнок, внук, брат, сестра, племянник или племянница — отправляется ко двору другой стороны и живёт там заложником, залогом этого договора. Он гость по обычным правилам игры о заложниках, а не узник.\n\n#weak В заложники можно отдать лишь безземельных, неженатых и необручённых родичей, уже находящихся при его дворе, и никогда — собственного регента.#!"
 # ВЫВЕДЕНО ВМЕСТЕ С СЕМЕЙСТВОМ ВОСПИТАННИКА (V16, пункт 5) — И ЭТО ГЛАВНАЯ
 # ЗАМЕТКА, НА КОТОРУЮ СМОТРЯТ ОСТАЛЬНЫЕ ОДИННАДЦАТЬ КЛЮЧЕЙ ЭТОГО СЕМЕЙСТВА,
 # ровно как ключи семейства союза смотрят на tnt_item_alliance выше.
 # Причина, названная игроком: условие слишком легко обращается в выгоду по
 # очкам, а строка заложника уже покрывает то же самое по духу. Разбор это
 # подтвердил и установил, что дело НЕ в одном числе: tnt_val_ward_p_value
 # оценивает ребёнка по ванильной лесенке заложника, а её строки за разницу в
 # положении срабатывают, когда ДАЮЩИЙ выше ПОЛУЧАТЕЛЯ, — получателя же
 # выбирает сам игрок. Оттого до +190 очков цены назначает он сам, а понизить
 # множитель настолько, чтобы это прекратить, значит смять всех детей ниже
 # наследника на нижний предел min = 10.
 # ДВЕНАДЦАТЬ КЛЮЧЕЙ ТЕРЯЮТ ПОСЛЕДНЕГО ЧИТАТЕЛЯ, И НИ ОДИН НЕ УДАЛЁН:
 # tnt_item_ward, tnt_item_ward_desc, tnt_bd_ward_p, tnt_bd_ward_r,
 # tnt_picker_title_ward_p, tnt_picker_title_ward_r, tnt_picker_rule_ward,
 # tnt_err_ward_p_unavailable, tnt_err_ward_r_unavailable,
 # tnt_ai_offer_desc_a15, tnt_ai_offer_row_ward_r, tnt_ai_goal_brood. Каждый
 # помечен там, где стоит. Число ключей ЗАКРЕПЛЕНО — 570 = 570, наборы ключей
 # совпадают (закон проекта 9, пункт 4 проверочного списка), — поэтому удаление
 # выведенного ключа ЛОМАЕТ проверку совпадения, а не «убирает лишнее».
 # ЗАМЫСЕЛ 15 ВЫВОДИТСЯ ВМЕСТЕ С СЕМЕЙСТВОМ, ИНДЕКС 15 СОЖЖЁН и никогда не
 # переиспользуется: сожжены теперь 1, 2, 4, 5, 6, 7, 11, 12, 15, а первый
 # свободный по-прежнему 21. Вместе с индексом сожжён код цели 9 — см.
 # tnt_ai_goal_brood ниже.
 # ЧЕГО СТРОКА ЗАЛОЖНИКА НЕ НАСЛЕДУЕТ, записано, чтобы возрождающему не искать
 # это заново: заложника опекун НЕ ВОСПИТЫВАЕТ — ванильный hostage_depart_effect
 # первым же действием снимает отношение опекунства; в заложники берут не только
 # детей; и это была единственная строка стола, читавшаяся как союз домов, а не
 # как мера безопасности.
 # ЕСЛИ ЭТО КОГДА-НИБУДЬ ВОЗРОДЯТ — ТОЛЬКО ПЛЕЧО _r. Вся выгода сидит в _p:
 # воспитанник, которого игрок ПРИНИМАЕТ, стоит ему денег, и на нём не заработать.
 tnt_item_ward:0 "Воспитанник"
 tnt_item_ward_desc:0 "Ребёнок из двора дающего отправляется на воспитание ко двору другого правителя. Опекуном становится сам этот правитель — третьего лица выбирать не нужно.\n\n#weak Предложить можно лишь детей, находящихся при его дворе и способных отправиться в путь; опекун не может взять третьего воспитанника.#!"
 tnt_item_courtier:0 "Придворные"
 tnt_item_courtier_desc:0 "Придворные переходят ко двору другой стороны, каждый вместе с супругом и малолетними детьми.\n\n#weak Отдать можно лишь взрослых безземельных обитателей двора дающего, не занимающих в нём никакой должности, — не наследника, не супруга, не регента, не советников, не рыцарей и не придворных чинов, — и никогда того, кого получатель считает соперником.#!"
 tnt_item_subject_desc:0 "Выбранные вассалы дающей стороны меняют сюзерена и переходят в державу другого правителя вместе со всеми своими титулами и всеми своими подвассалами.\n\n#weak Их вассальный договор пишется заново на обычных условиях принимающей державы, так что прежние особые обязательства пропадают. Перемирия после передачи не возникает, и вернуть вассала обратно через границу державы нельзя ничем, кроме войны. Передать можно лишь прямого вассала, владеющего графством или больше, стоящего рангом ниже принимающего правителя и ни с кем из участников не воюющего, — никогда регента и никогда наследника, — а вассала, уже переданного по договору, нельзя передавать снова три года.#!"
 tnt_item_subject:0 "Передать вассала"

