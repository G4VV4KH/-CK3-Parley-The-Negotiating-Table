 tnt_item_usehook_r:0 "Он взыскивает ваш долг"
 tnt_item_usehook_r_desc:0 "Он держит над вами [Concept('hook', 'крючок')|E] и намерен им воспользоваться, поэтому ждёт, что договор это учтёт.\n\n#weak Это нельзя выключить: рычаг его, а не ваш. Он заставляет его ПРОСИТЬ БОЛЬШЕ справедливой цены: #high −45#! за услугу, которую можно взыскать, #high −120#! если рычаг уровня шантажа. Подпишете — долг израсходован: слабый крючок исчезнет, сильный останется.#!\n\n#weak Отказ не стоит ничего, кроме самого договора.#!"
 tnt_usehook_r_sub:0 "[Select_CString( GreaterThanOrEqualTo_CFixedPoint( GetPlayer.MakeScope.ScriptValue('tnt_usehook_r_strength_value'), '(CFixedPoint)2' ), Localize('tnt_usehook_strong'), Localize('tnt_usehook_weak') )]"
 tnt_bd_usehook_r:0 "Взысканный с вас долг"
 tnt_item_usehook:0 "Использовать крючок"
 tnt_item_usehook_desc:0 "Потратить рычаг, который у вас уже есть. Это обратное направление к #high «Дать крючок»#!: там вы отдаёте ему власть над собой, здесь — взыскиваете долг с него.\n\nРаботает на правителе, который вас никогда не полюбит, поэтому его вес не зависит от расположения — в отличие от всего, что вы можете дать.\n\n#weak Взысканный [Concept('hook', 'крючок')|E] стоит #high +45#!, рычаг уровня шантажа — #high +120#!. Что переживает использование, решает сама игра: слабый крючок расходуется при подписании договора, сильный — нет. Тратится он только если договор действительно заключён: крючок, потраченный на несостоявшийся договор, был бы выброшен зря.#!\n\n#weak Взыскать долг давит на вас ровно так же, как угроза. Ваша собственная натура судит этот поступок: иная совесть понесёт его собственным #high стрессом#!, а правителю более холодному станет только легче оттого, что рычаг наконец пущен в ход. В окне подтверждения будут названы свойства, которые отозвались, — прежде чем посол тронется в путь.#!"
 tnt_usehook_sub:0 "[Select_CString( GreaterThanOrEqualTo_CFixedPoint( GetPlayer.MakeScope.ScriptValue('tnt_usehook_strength_value'), '(CFixedPoint)2' ), Localize('tnt_usehook_strong'), Select_CString( GreaterThanOrEqualTo_CFixedPoint( GetPlayer.MakeScope.ScriptValue('tnt_usehook_strength_value'), '(CFixedPoint)1' ), Localize('tnt_usehook_weak'), Localize('tnt_usehook_none') ) )]"
 # НАМЕРЕННО НЕИСПОЛЬЗУЕМЫЕ — и, в отличие от прочих сирот этого файла, ровно у
 # этих трёх пометки не было, отчего каждая сверка поднимала их заново. Это
 # названия уровней крючка из времён до TntHookTier; сегодня уровни печатает
 # data_binding\tnt_macros.txt ключами tnt_hook_tier_0..3.
 # Хранятся потому, что неиспользуемый ключ ничего не стоит, а возвращённый
 # пришлось бы переводить заново. НЕ ПУТАТЬ с рабочим tnt_err_usehook_none
