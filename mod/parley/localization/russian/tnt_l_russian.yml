 tnt_ob_coin_label:0 "Право на монету"
 tnt_ob_coin_desc:0 "Подданный чеканит собственную монету: #high +0,3#! к ежемесячному [Concept('development', 'развитию')|E] в его столичном [Concept('county', 'графстве')|E].\n\n#weak Сюзерен теряет за это 2% собственного роста развития, и требуется, чтобы [Concept('culture', 'культура')|E] сюзерена открыла инновацию «$innovation_currency_02$».#!"
 tnt_ob_succ_label:0 "Только раздел"
 tnt_ob_succ_desc:0 "#N Это условие выгодно сюзерену, а не подданному.#! Подданный заперт в разделении наследства и никакими законами из него не выйдет: #high -5#! к мнению о сюзерене.\n\n#weak Галочка здесь качает чашу в другую сторону: это то, что вы забираете, а не то, что даёте.#!"
