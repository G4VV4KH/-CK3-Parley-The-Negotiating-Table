 # ДВЕ СТРОКИ О КРУПНЫХ УСЛОВИЯХ, обе в подсказке самой кнопки
 # (common\scripted_guis\tnt_22_v2.txt:2246, :2256).
 # tnt_ab_lumpy_hint привязан с `always = yes` и БЕЗ trigger_if, то есть это
 # постоянное описание кнопки: оно обязано быть верным и до первого нажатия, и
 # после. Формулировка предписана самим договором взамен удалённой подсказки о
 # переборе (пункт 1.C / R2), и в ней два обещания, которые нельзя терять при
 # переводе: повторное нажатие ДОБАВЛЯЕТ ещё, а удаление ЗАПОМИНАЕТСЯ.
 # tnt_ab_lumpy_line стоит внутри trigger_if по var:tnt_ab_lumpy_n > 0, поэтому
 # появляется только после нажатия, которое и правда взяло крупное условие.
 # ЧИСЛО НАМЕРЕННО НЕ ВСТАВЛЕНО В ТЕКСТ: пока переменная есть, она равна 1..3,
 # но tnt_39_autobalance.txt удаляет её, когда нажатие не взяло ничего, а сырой
 # или отсутствующий ключ внутри подсказки обрывает вычисление всей подсказки.
 tnt_ab_lumpy_hint:0 "Нажмите ещё раз, чтобы добавить больше. То, что кнопка добавила, а вы затем убрали, повторно предложено не будет."
 tnt_ab_lumpy_line:0 "Его казна пуста, поэтому прошлое нажатие взяло условия с его стороны стола: земли, притязание или вассальную присягу."

