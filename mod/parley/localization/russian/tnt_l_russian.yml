 tnt_bd_floor:0 "Презрение обнуляет дары, но не обращает их во вред"
 # Двойники «_panel» для строк выше. МИНУС ПРИНАДЛЕЖИТ ТОЛЬКО ПАНЕЛИ.
 # tnt_bd_loss и tnt_bd_threshold служат `desc` тех двух строк внутри
 # tnt_ai_accept_value, где стоит `multiply = -1` (tnt_50_values.txt:1399,
 # :1413), а GetScriptValueBreakdown печатает уже отрицательное число строки в
 # своей отдельной колонке — то есть минус в подписи выводился дважды
 # («- Что партнёр отдаёт   -90»). Центральная панель печатает те же цифры БЕЗ
 # знака (`|0`, tnt_types.gui), поэтому там знак обязана давать подпись.
 #
 # ПУНКТ 3 ДОБАВЛЯЕТ ЕЩЁ ДВА ДВОЙНИКА — уже не ради знака, а ради ширины. Все
 # четыре цифры центральной панели делят одно гнездо подписи шириной 169 px
 # (tnt_types.gui:1233-1244), а text_single там объявлен с `autoresize = no`,
 # поэтому слишком длинная подпись не переносится, а ОБРЕЗАЕТСЯ. Именно это и
 # снято на скриншоте: панель читала подписи прямо с длинных ключей `desc` и
 # выводила «Что партнёр получ ...» и «Отношения — доля ...». Полные
 # формулировки остаются в ключах `desc`, где у подсказки разбора есть место;
 # панель теперь читает эти двойники. Привязка — gui\tnt_types.gui:1769 и :1805.
 #
 # РАСЧЁТ ШИРИНЫ: 169 px шрифтом Font_Size_Small — это около 22 знаков. Все
 # подписи ниже в него укладываются. tnt_bd_threshold_panel не укладывался: его
 # 36 знаков и дали третье многоточие на том же скриншоте («Запрос сверх — дол
 # ...»), поэтому он не удваивается, а сокращается на месте — ключ и так
 # принадлежит одной лишь панели, второго читателя у него нет. Тире заменено
 # запятой ради тех же знаков.
 # У двойника прибытка нет зачина «Что...», который сохранён у двойника убытка:
 # подпись убытка укладывается в 20 знаков, и обрезанной её никто не видел, —
 # поэтому она оставлена ровно такой, какой была, а не переписана ради симметрии.
 tnt_bd_gain_panel:0 "+ Партнёр получает"
 tnt_bd_loss_panel:0 "- Что партнёр отдаёт"
 tnt_bd_relation_panel:0 "Отношения, доля"
 tnt_bd_threshold_panel:0 "Запрос сверх, доля"

