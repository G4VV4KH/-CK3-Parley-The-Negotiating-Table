 tnt_err_truce_same_realm:0 "Vous ne pourriez jamais marcher l’un contre l’autre : un pacte suppose deux dirigeants qui le pourraient, deux seigneurs indépendants ou deux vassaux d’une même couronne. Il n’y a rien à promettre ici."
