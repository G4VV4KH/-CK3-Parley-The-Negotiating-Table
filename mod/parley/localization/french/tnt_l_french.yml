 tnt_bd_ob_tax:0 "Contrat : impôts"
 tnt_bd_ob_levy:0 "Contrat : levées"
 tnt_bd_ob_relig:0 "Contrat : protection religieuse"
 tnt_bd_ob_council:0 "Contrat : siège au conseil"
 tnt_bd_ob_revoke:0 "Contrat : titres protégés"
 tnt_bd_ob_war:0 "Contrat : libre déclaration de guerre"
 tnt_bd_ob_fort:0 "Contrat : droits de fortification"
 tnt_bd_ob_coin:0 "Contrat : droit de battre monnaie"
 tnt_bd_ob_succ:0 "Contrat : partage forcé"
 tnt_err_truce_dead:0 "L’un de vous n’est plus parmi les vivants."
 tnt_err_hostage_p_unavailable:0 "Vous n’avez personne à envoyer comme otage, ou personne des vôtres ne peut servir de garantie pour vous."
 tnt_err_hostage_r_unavailable:0 "Le partenaire n’a personne à envoyer comme otage, ou vous ne pouvez pas servir de garantie pour lui."
 tnt_err_ward_p_unavailable:0 "Vous n’avez pas d’enfant à confier à sa garde, ou sa cour ne peut en élever aucun."
 tnt_err_ward_r_unavailable:0 "Le partenaire n’a pas d’enfant à confier à votre garde, ou votre cour ne peut en élever aucun."
 tnt_err_courtier_p_unavailable:0 "Personne dans votre cour ne peut être remis : les récalcitrants, ceux qui tiennent une charge et les prisonniers restent tous."
 tnt_err_courtier_r_unavailable:0 "Personne dans la cour du partenaire ne peut vous être remis."
 tnt_err_subject_and_vassal:0 "Un traité qui emporte le vasselage d'un pays entier n'a nul besoin qu'on en arrache aussi un vassal. Retirez le serment de la table, ou retirez-en le vassal."
 tnt_err_subject_r_unavailable:0 "Aucun de leurs vassaux ne peut vous être remis pour l'instant : vous devez posséder des terres et accepter de nouveaux sujets, et vous devez être en paix tous les deux."
 tnt_err_subject_p_unavailable:0 "Aucun de vos vassaux ne peut être remis pour l'instant, et cela peut tenir à leur côté de la table plutôt qu'au vôtre : le dirigeant qui les recevrait doit posséder des terres et accepter de nouveaux sujets, et vous devez être en paix tous les deux."
 tnt_err_indep_p_unavailable:0 "L’affranchissement est impossible pour l’instant : le partenaire doit être votre vassal, vous devez être tous deux en paix (et aucun de vos vassaux en guerre contre lui), ses terres doivent se trouver hors de vos propres titres de jure, et il ne doit pas être votre dyarque."
 tnt_err_indep_r_unavailable:0 "L’affranchissement est impossible pour l’instant : vous devez être son vassal, vous devez être tous deux en paix (et aucun de ses vassaux en guerre contre vous), vos terres doivent se trouver hors de ses titres de jure, et vous ne devez pas être son dyarque."
 tnt_err_people_pair:0 "Ce traité se contredit : il ne peut pas affranchir un vassal et en prendre un dans le même souffle."
 tnt_ai_offer_title:0 "Une ambassade envoyée par [tnt_deal_partner.GetTitledFirstName]"
 tnt_ai_offer_desc_a1:0 "Un héraut envoyé par [tnt_deal_partner.GetTitledFirstName] est introduit, la poussière du chemin encore au manteau, et va droit au fait avec la rudesse d’un homme qui a chevauché dur.\n\nSon maître ne veut nulle querelle avec vous. Il demande un pacte juré : pendant #high dix ans#!, aucun de vous deux ne tirera l’épée contre l’autre, et il a apporté de quoi lier la promesse, car une parole ne coûte rien et il le sait."
 tnt_ai_offer_desc_a2:0 "[tnt_deal_partner.GetTitledFirstName] n’envoie pas un clerc mais un parent, et c’est déjà la moitié du message.\n\nCe que l’on vous propose est une alliance militaire jurée : vos bannières et les siennes levées ensemble, chacun libre d’appeler l’autre quand viendra la guerre, comme vous savez tous deux qu’elle viendra."
 tnt_ai_offer_desc_a3:0 "L’émissaire que dépêche [tnt_deal_partner.GetTitledFirstName] parle doucement et ne demande rien qui se pèse sur une balance.\n\nSon maître veut plutôt votre parole : une faveur due, à réclamer au moment de son choix. Ces dettes-là se recouvrent toujours au pire moment possible, et c’est précisément ce qui les rend dignes d’être achetées."
 tnt_ai_offer_desc_a9:0 "[tnt_deal_partner.GetTitledFirstName] n’envoie ni présent ni flatterie, seulement un rappel.\n\nUne faveur est due, et l’émissaire est venu la voir honorée. Ce qu’il pose sur la table n’est pas une requête mais un compte : la dette est nommée à voix haute, et les conditions ci-dessous sont ce qui la soldera."
 tnt_ai_offer_desc_a5:0 "L’émissaire que dépêche [tnt_deal_partner.GetTitledFirstName] ne s’assied pas et ne prétend pas qu’il s’agisse ici d’art politique.\n\nDes hommes et des femmes de sa maison et de sa fidélité pourrissent dans vos geôles. Son maître les veut chez lui, et il a apporté de quoi rendre la perte du geôlier profitable."
 tnt_ai_offer_desc_a6:0 "Cette ambassade arrive avec hérauts, trompes et cortège de témoins : [tnt_deal_partner.GetTitledFirstName] entend que le monde entier voie ce qui se signera ici.\n\nLe fond en est un pacte mutuel de #high dix ans#!, et pour le sceller en public son maître vous cédera une part de son propre [prestige|E] devant les cours assemblées. Une paix achetée si haut est difficile à renier, d’un côté comme de l’autre."
 tnt_ai_offer_desc_a8:0 "[tnt_deal_partner.GetTitledFirstName] écrit de frontières et de monnaie. Il est de vos terres — nommées dans les conditions ci-dessous — qui se tiendraient plus naturellement sous sa bannière, et il préfère les acheter honnêtement que les convoiter en silence. Le prix est exposé en entier ; le sceau attend votre réponse."
 tnt_ai_offer_desc_a10:0 "[tnt_deal_partner.GetTitledFirstName] offre de la terre. Une de ses possessions — nommée ci-dessous — lui est plus charge que profit, et il la verrait volontiers entre vos mains, ses coffres alourdis d’autant. Le prix qu’on vous en demande figure parmi les conditions."
 tnt_ai_offer_desc_a11:0 "[tnt_deal_partner.GetTitledFirstName] n’offre pas de la terre mais un chemin légal vers elle : une revendication sur l’un de ses propres titres, écrite et scellée, à vous de la faire valoir quand bon vous semblera. L’encre des juristes coûte moins cher que le sang des soldats — quoiqu’elle ne soit pas gratuite, comme l’attestent les conditions ci-dessous."
 tnt_ai_offer_desc_a13:0 "Un émissaire envoyé par [tnt_deal_partner.GetTitledFirstName] découvre un trésor apporté pour vos yeux : une pièce de sa propre salle, nommée dans les conditions ci-dessous. Elle est offerte contre bon argent — ces choses-là trouvent de nouveaux maîtres avec plus de grâce autour d’une table que sur un champ de bataille."
 tnt_ai_offer_desc_a14:0 "[tnt_deal_partner.GetTitledFirstName] écrit des mots que peu de dirigeants confient au parchemin : il est prêt à mettre genou à terre. Son pays passerait sous votre protection et ses bannières sous les vôtres — moyennant contrepartie, exposée dans les conditions ci-dessous. Pesez-le bien : une fidélité jurée ne se reprend pas à la légère."
 tnt_ai_offer_desc_a15:0 "[tnt_deal_partner.GetTitledFirstName] demande une place à votre foyer — non pour lui-même, mais pour son enfant, nommé ci-dessous, afin qu’il soit élevé à votre cour. Un tel pupille est à la fois un honneur et un lien entre maisons ; ce qui accompagne l’enfant est exposé dans les conditions."
 tnt_ai_offer_desc_a16:0 "Mon émissaire porte une proposition plus précieuse que l’or : que nos maisons soient unies. J’offre quelqu’un de mon propre sang pour épouser quelqu’un du vôtre, afin que nos deux lignées partagent un même avenir. L’union est nommée ci-dessous ; pesez-la comme vous pèseriez n’importe quel marché venu de moi."
 tnt_ai_offer_desc_a17:0 "[tnt_deal_partner.GetTitledFirstName] écrit en vassal qui a pesé son serment et l’a trouvé lourd.\n\nIl demande à être délié de sa fidélité envers vous — ses bannières à lui de nouveau, sa salle ne répondant à personne — et il ne le demande pas pour rien : ce qu’il dépose en échange figure parmi les conditions ci-dessous. Un serment rendu n’est pas un serment rompu ; il ne se rend pas non plus à la légère."
 tnt_ai_offer_desc_a18:0 "L’ambassade envoyée par [tnt_deal_partner.GetTitledFirstName] ne vient pas les mains vides, et ce qu’elle apporte n’est pas de l’or.\n\nUn enfant de son propre sang, nommé ci-dessous, est confié à votre garde comme otage — garantie que la parole donnée tiendra tant que l’enfant sera sous votre toit. Ce que l’on demande en retour d’un gage si cher est inscrit dans les conditions."
 tnt_ai_offer_desc_a19:0 "[tnt_deal_partner.GetTitledFirstName] a entendu parler d’un homme de votre cour, et le veut.\n\nIl est nommé ci-dessous. On vous demande de le laisser partir à son service, et l’on n’attend pas cette faveur pour rien : la bourse figure parmi les conditions. Un serviteur est peu de chose pour une grande maison ; le prix offert pour lui ne l’est pas."
 tnt_ai_offer_desc_a20:0 "[tnt_deal_partner.GetTitledFirstName] est prêt à mettre genou à terre — mais pas en aveugle.\n\nSon pays passerait sous votre couronne aux conditions inscrites dans le contrat ci-dessous : ce qu’il vous rendra, et ce qu’il entend garder pour lui. Une fidélité achetée à juste prix se tient plus longtemps qu’une fidélité prise. Lisez les conditions avant de les sceller."
 tnt_ai_offer_desc_generic:0 "Un émissaire envoyé par [tnt_deal_partner.GetTitledFirstName] est annoncé, s’incline et pose sur la table une proposition scellée. Les conditions sont écrites ci-dessous de la main même de son maître, et il attend votre réponse."
 tnt_ai_offer_desc_outro:0 "\n\n#weak Vos diplomates l’ont pesée sur les mêmes balances que celles dont vous vous servez.#!"
 tnt_ai_goal_claim:0 "#weak Vos informateurs le murmurent : cette maison nourrit une revendication sur vos terres, et l’or lui paraît moins cher que le sang.#!\n\n"
 tnt_ai_goal_dejure:0 "#weak Vos hommes de loi le confirment : la terre en question penche vers sa couronne par droit ancien, et il ne l’a pas oublié.#!\n\n"
 tnt_ai_goal_kin:0 "#weak La raison n’est pas loin à chercher : son propre sang croupit dans vos geôles.#!\n\n"
 tnt_ai_goal_menaced:0 "#weak Vos hommes des marches le rapportent : un voisin plus fort pèse sur ses terres, et il a un besoin urgent d’amis.#!\n\n"
 tnt_ai_goal_rich:0 "#weak Vos marchands en sont certains : son trésor regorge d’or en quête d’un emploi.#!\n\n"
 tnt_ai_goal_poor:0 "#weak Vos marchands le chuchotent : ses coffres sont vides, et il est aux abois pour de l’argent.#!\n\n"
 tnt_ai_goal_overdomain:0 "#weak Vos hommes de loi l’observent : il tient plus de terres qu’une seule main n’en peut justement garder, et le surplus cherche preneur.#!\n\n"
 tnt_ai_goal_heir:0 "#weak Ce n’est un secret pour personne à sa cour : l’héritier est en âge et le lit conjugal reste vide ; il leur faut une union.#!\n\n"
 tnt_ai_goal_brood:0 "#weak Vos gens en plaisantent : ses salles grouillent d’enfants, et chacun d’eux réclame une cour, une table et un précepteur.#!\n\n"
 tnt_ai_goal_schemer:0 "#weak Vos informateurs vous en avertissent : cette cour est bâtie de chuchotements, et son maître n’achète jamais une promesse qu’il n’ait l’intention de dépenser.#!\n\n"
 tnt_ai_goal_yoke:0 "#weak Vos intendants le tiennent de ses serviteurs : le serment pèse mal à cette maison, et ses seigneurs parlent de l’ancienne liberté.#!\n\n"
 tnt_ai_goal_talent:0 "#weak Votre chambellan en nomme la raison : ses salles manquent d’un homme de ce métier, et les vôtres en ont un.#!\n\n"
 tnt_ai_goal_surety:0 "#weak Vos émissaires le lisent sans peine : il entend mettre sa bonne foi hors de tout doute, et il gagera du sang pour cela.#!\n\n"
 tnt_ai_goal_might:0 "#weak Vos hommes des marches le rapportent : son ost est rassemblé et désœuvré, et il compte vos levées depuis quelque temps.#!\n\n"
 tnt_ai_goal_blank:0 ""
 tnt_ai_offer_opt_accept:0 "Accepter ces conditions"
 tnt_ai_offer_opt_counter:0 "Ouvrir la table des négociations"
 tnt_ai_offer_counter_tt:0 "#high Ouvre votre propre fenêtre de négociation, ses conditions déjà posées dessus.#! Modifiez-les, rayez ce qui vous déplaît, ajoutez vos propres exigences, puis renvoyez le traité remodelé. Rien n’est promis tant que vous n’avez pas pressé Proposer."
 tnt_ai_offer_opt_decline:0 "Renvoyer l’ambassade"
 tnt_ai_offer_opt_hush:0 "Renvoyer l’ambassade, et n’en plus recevoir aucune"
 tnt_ai_offer_hush_tt:0 "Aucun dirigeant ne vous abordera avec un traité pendant #high dix ans#!."
 tnt_ai_demand_title:0 "Une exigence de [tnt_deal_partner.GetTitledFirstName]"
 tnt_ai_demand_desc_a21:0 "L’envoyé de [tnt_deal_partner.GetTitledFirstName] n’apporte ni présent ni proposition. Il énonce une somme, et dit que son maître serait navré qu’on lui donne un motif de venir la percevoir lui-même. Puis il reste debout et attend, et ne s’assied pas."
 tnt_ai_demand_desc_outro:0 "\n\n#weak Payez, et le monde saura que vous avez payé. Renvoyez-le, et le monde le saura aussi.#!"
 tnt_ai_demand_opt_pay:0 "Lui payer ce qu’il exige"
 tnt_ai_demand_pay_tt:0 "#high L’argent est compté et l’envoyé repart satisfait.#! Son renom en grandit, et ceux qui l’apprendront le craindront plus aisément. Il ne redemandera rien avant quinze ans."
 tnt_ai_demand_opt_refuse:0 "Le renvoyer les mains vides"
 tnt_ai_demand_refuse_tt:0 "#high Il n’obtient rien.#! Mais un envoyé est entré dans votre salle, a fixé un prix et en est reparti sans réponse — votre cour l’a vu, et votre renom en souffre. Le sien en souffre aussi : une menace refusée est une menace que l’on a mesurée. Il ne redemandera rien avant quinze ans."
 tnt_ai_demand_refuse_free_tt:0 "#high Il n’obtient rien, et cela ne vous coûte rien.#! Votre ost n’est plus celui qu’il avait compté. Son renom en souffre, et il ne redemandera rien avant quinze ans."
