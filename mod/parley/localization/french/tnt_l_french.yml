 tnt_err_vassal_mutual_war:0 "La fidélité ne peut être jurée qu’une fois terminée la guerre entre les deux parties."
 tnt_err_vassal_government:0 "Cette forme de gouvernement ne peut ni donner ni recevoir la fidélité : une compagnie de mercenaires, un ordre sacré et un aventurier sans terre se tiennent tous hors de la chaîne féodale."
 tnt_err_vassal_sworn_order:0 "Il n’y a pas de fidélité à prendre ici. L’un de ces deux se tient tout à fait hors de la chaîne féodale, tenu par des vœux qu’aucune couronne ne commande, ou tenu par rien du tout, et aucun traité ne peut faire d’une telle partie un seigneur lige ou un vassal."
 tnt_err_vassal_confederation:0 "Un membre d’une confédération ne peut pas jurer fidélité."
 tnt_err_vassal_state:0 "Les deux parties doivent être vivantes, titrées et en liberté."
