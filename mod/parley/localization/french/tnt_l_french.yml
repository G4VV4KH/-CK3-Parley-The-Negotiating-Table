l_french:
 # =========================================================================
 # PARLEY: THE NEGOTIATING TABLE - French localization
 #
 # GENERATED FILE. The key set is exactly the english one - 625 keys, in the
 # same order (house law 9). Only the VALUES are translated: every
 # datafunction token and every nested loc-key reference is carried over
 # verbatim from english, and the colour markup pairs are preserved one for
 # one. Game terms follow the vanilla CK3 French localization.
 #
 # The long doctrine comments belong to the english and russian files and are
 # deliberately not duplicated here.
 #
 # Encoding: UTF-8 WITH BOM, LF endings, one trailing newline.
 # =========================================================================
 tnt_open_negotiations:0 "Négocier un traité"
 tnt_open_negotiations_desc:0 "Envoyer un émissaire à [recipient.GetShortUIName] et poser sur la table un traité complet : chaque clause, les deux parties à la fois."
 tnt_open_negotiations_extra_icon:0 "@dread_icon! Vous pouvez faire pression sur lui : armée, nom et redoutabilité atteignent ensemble le poids qu’exige une menace, et il a oublié votre dernière menace"
 tnt_window_title:0 "Négociations diplomatiques"
 tnt_col_actor:0 "Vous offrez"
 tnt_col_partner:0 "Le partenaire offre"
 tnt_balance_header:0 "Réponse du partenaire"
 tnt_balance_accept:0 "#P Le partenaire est enclin à accepter#!"
 tnt_balance_reject:0 "#N Le partenaire est enclin à refuser#!"
 tnt_scale_note:0 "Ce nombre est la réponse du partenaire : au-dessus de zéro, il signe. Chaque clause est évaluée à ce qu’elle vaudrait si vous l’aviez négociée seule, et son opinion de vous, la foi, la parenté et tout ce qu’il veut recevoir en plus y sont déjà comptés. La barre est cette même réponse déployée : tout ce qui le pousse vers le oui contre tout ce qui le pousse vers le non, si bien qu’au moment où la barre dépasse le milieu, il accepte."
 tnt_label_points:0 "pts"
 tnt_label_years:0 "#weak Dure dix ans#!"
 tnt_picker_empty:0 "#weak Rien de disponible#!"
 tnt_picker_empty_artifact:0 "#weak Rien de ce que possède cette partie ne peut changer de mains : les joyaux de la couronne suivent leur titre, les bannières dynastiques restent à la dynastie, et les reliques de sa propre foi ne vont qu’à des coreligionnaires.#!"
 tnt_item_gold:0 "Or"
 tnt_item_gold_desc:0 "Un versement unique de [gold_i] pris sur le trésor, remis à l’instant même où le traité est scellé."
 tnt_item_prestige:0 "Prestige"
 tnt_item_prestige_desc:0 "[prestige_i] [prestige|E] promis d’un bord à l’autre de la table.\n\n#weak Ce n’est pas un coffre qui change de mains : le donneur perd le montant et le receveur le gagne en deux gestes distincts, et rien ne lie les deux. L’offre ne peut donc pas être envoyée si le donneur ne détient pas la somme entière au moment où l’on presse Proposer.#!"
 tnt_item_piety:0 "Piété"
 tnt_item_piety_desc:0 "[piety_i] [piety|E] promise d’un bord à l’autre de la table.\n\n#weak Deux gestes distincts ici encore, et non un transfert : ce qu’une partie perd, l’autre le gagne. L’offre ne peut être envoyée si le donneur ne détient pas la somme entière au moment où l’on presse Proposer.#!"
 tnt_item_influence:0 "Influence"
 tnt_item_influence_desc:0 "[influence_i] [influence|E] promise d’un bord à l’autre de la table.\n\n#weak L’[influence|E] n’existe que sous une forme de gouvernement qui en use, aussi ces lignes n’apparaissent-elles que si les deux formes de gouvernement en usent : la remettre à un dirigeant qui n’a pas cette réserve ne ferait rien du tout. Deux gestes distincts ici encore, et l’offre ne peut être envoyée si le donneur ne détient pas la somme entière au moment où l’on presse Proposer.#!"
 tnt_item_alliance:0 "Alliance militaire"
 tnt_err_ab_already_fair:0 "Le traité se tient déjà exactement à #high +1#! : il n’y a plus rien à équilibrer"
 tnt_err_ab_empty:0 "Il n’y a encore rien sur la table à équilibrer"
 tnt_threat_opinion:0 "M’a menacé"
 tnt_treaty_favor_opinion:0 "Traité favorable"
 tnt_item_usehook_r:0 "Le partenaire réclame son dû"
 tnt_item_usehook_r_desc:0 "Le partenaire détient un [hook|E] sur vous et compte s’en servir : il attend donc du traité qu’il en tienne compte.\n\n#weak Vous ne pouvez pas désactiver cette ligne : ce levier est le sien, pas le vôtre. Il le pousse à EXIGER PLUS qu’un prix juste : #high -45#! pour une faveur qu’il peut réclamer, #high -120#! si le levier relève du chantage. Signez, et la dette est consommée : un hameçon faible disparaît, un hameçon fort demeure.#!\n\n#weak Refuser ne coûte rien, sinon le traité.#!"
 tnt_usehook_r_sub:0 "[Select_CString( GreaterThanOrEqualTo_CFixedPoint( GetPlayer.MakeScope.ScriptValue('tnt_usehook_r_strength_value'), '(CFixedPoint)2' ), Localize('tnt_usehook_strong'), Localize('tnt_usehook_weak') )]"
 tnt_bd_usehook_r:0 "Une dette réclamée contre vous"
 tnt_item_usehook:0 "Réclamer votre dû"
 tnt_item_usehook_desc:0 "Dépenser le levier que vous détenez déjà sur le partenaire. C’est l’inverse de #high Faveur due#! : celle-là lui remet une faveur sur vous, celle-ci encaisse la faveur qu’il vous doit.\n\nElle agit sur un dirigeant qui ne vous aimera jamais : son poids ne dépend pas de son estime, contrairement à tout ce que vous pourriez lui donner.\n\n#weak Un [hook|E] que vous réclamez vaut #high +45#! ; un levier relevant du chantage vaut #high +120#!. C’est le jeu lui-même qui décide de ce qu’un hameçon endure : un hameçon faible est consommé à la signature du traité, un hameçon fort ne l’est pas. Il n’est dépensé que si le traité est réellement conclu : une faveur réclamée pour un traité qui n’a jamais eu lieu serait une faveur jetée.#!\n\n#weak Réclamer une dette pèse sur vous exactement comme une menace. Votre propre nature juge l’acte : certaines consciences en portent le poids, en #high stress#! ; un dirigeant plus froid, lui, se trouve soulagé d’avoir enfin usé de son ascendant, et la fenêtre de confirmation nomme les traits qui ont répondu avant que l’émissaire ne prenne la route.#!"
 tnt_usehook_sub:0 "[Select_CString( GreaterThanOrEqualTo_CFixedPoint( GetPlayer.MakeScope.ScriptValue('tnt_usehook_strength_value'), '(CFixedPoint)2' ), Localize('tnt_usehook_strong'), Select_CString( GreaterThanOrEqualTo_CFixedPoint( GetPlayer.MakeScope.ScriptValue('tnt_usehook_strength_value'), '(CFixedPoint)1' ), Localize('tnt_usehook_weak'), Localize('tnt_usehook_none') ) )]"
 tnt_usehook_strong:0 "Hameçon fort : il survit à son usage"
 tnt_usehook_weak:0 "Hameçon faible : le réclamer le consomme"
 tnt_usehook_none:0 "Vous ne détenez aucun hameçon sur le partenaire"
 tnt_bd_usehook_p:0 "Une dette réclamée"
 tnt_err_usehook_none:0 "Vous ne détenez aucun hameçon à dépenser sur le partenaire"
 tnt_item_threat:0 "Menacer le partenaire"
 tnt_item_threat_desc:0 "Faire comprendre au partenaire ce qu’un refus lui coûterait. Ce n’est pas une déclaration : rien n’est juré et aucune armée ne se met en marche. C’est un poids posé sur la table, et il agit sur un dirigeant qui ne vous aimera jamais, ce que l’or est justement incapable de faire.\n\nCe poids, c’est #high de combien votre armée surpasse la sienne#!, relevé ou abaissé par #high de combien votre nom l’emporte sur le sien#! et par #high de combien votre redoutabilité dépasse la sienne#!. Un rang de gloire de moins que lui referme la menace entièrement, si grande que soit votre armée — et le poids qui ouvre la menace est exactement celui qu’elle ajoute ensuite au traité, en votre faveur.\n\n#weak Il s’en souviendra. Un traité signé sous la menace vous coûte « $tnt_threat_opinion$ », #high -100#! d’opinion qui s’estompent sur quinze ans, et comme c’est son estime qui donne du prix à vos dons, prendre par la peur aujourd’hui, c’est acheter moins avec le même or pendant une génération. Mais votre or n’est pas seul à payer : votre propre nature juge l’acte. Certaines consciences en portent le poids elles-mêmes, en #high stress#! ; un dirigeant plus froid, lui, se trouve soulagé d’avoir enfin usé de son ascendant. La fenêtre de confirmation nomme les traits qui ont répondu, et le chiffre exact, avant que l’émissaire ne prenne la route.#!"
 tnt_threat_sub:0 "Armée [GetPlayer.MakeScope.ScriptValue('tnt_threat_ratio_value')|1] contre 1, nom ×[GetPlayer.MakeScope.ScriptValue('tnt_threat_rep_term_value')|0], redoutabilité ×[GetPlayer.MakeScope.ScriptValue('tnt_threat_dread_term_value')|2]"
 tnt_bd_threat_p:0 "Pression brute"
 tnt_bd_threat_panel:0 "Pression"
 tnt_err_threat_weak:0 "Une menace exige au moins 100 points de transaction grâce à la puissance militaire, au prestige et à la redoutabilité. Ce minimum est identique pour le joueur et l’IA."
 tnt_err_threat_relation:0 "Vous ne pouvez menacer qu’un dirigeant indépendant qui n’est ni votre allié ni lié à vous par un otage"
 tnt_err_threat_unknown:0 "Votre nom doit peser quelque chose : niveau de gloire supérieur à zéro"
 # tnt_err_threat_unafraid RETIRED round 8 (I2). This tombstone holds the line count so no .yml citation moves. ORPHANED 2026-08-24 BY THE RATIO RULING, KEPT DEFINED IN ALL NINE: tnt_err_threat_unknown above and tnt_err_threat_nofear below have ZERO rows - their rules are inside tnt_threat_points_value now. Law 9 and the law-10d control. DO NOT DELETE, DO NOT RE-USE FOR ANOTHER MEANING.
 tnt_err_threat_nofear:0 "Le partenaire ne vous craint pas. Votre redoutabilité doit atteindre 75, ou 40 contre un homme qui n’est pas brave, ou 20 contre un homme placé sous votre autorité"
 tnt_err_threat_recent:0 "Le partenaire se souvient encore de votre dernière menace. Laissez le souvenir s’effacer avant d’appuyer de nouveau"
 tnt_item_alliance_desc:0 "Une alliance en bonne et due forme, jurée par vous deux ensemble : ce n’est pas une chose qu’une partie remet à l’autre. Chacun peut ensuite appeler l’autre à la guerre, et refuser cet appel coûte du [prestige|E].\n\n#weak Une seule ligne pour un seul pacte : il est dans le traité ou il n’y est pas.#!\n\n#weak Jurée avec votre propre [liege|E] ou votre propre [vassal|E], c’est un pacte permanent plutôt qu’un appel aux armes : le jeu n’autorise pas un seigneur lige et son vassal à se convoquer l’un l’autre, mais l’alliance est réelle, elle compte partout où les alliances comptent, et elle survit au jour où l’un de vous quitte le pays de l’autre.#!\n\n#weak $tnt_tt_alliance_glut$#!"
 tnt_tt_alliance_glut:0 "Chaque alliance que vous détenez déjà rend la suivante moins chère à acheter. À partir de votre deuxième allié — sans compter votre propre seigneur lige ni vos propres vassaux —, chaque alliance existante divise par deux ce qu’un nouveau pacte vaut aux yeux d’un partenaire, et ses propres alliés lui font subir le même sort."
 tnt_item_truce:0 "Pacte de non-agression"
 tnt_item_truce_desc:0 "Un pacte que vous concluez ensemble : ni l’un ni l’autre ne peut déclarer la guerre à l’autre pendant #high dix ans#!.\n\n#weak Une seule ligne pour un seul pacte : il est dans le traité ou il n’y est pas.#!"
 tnt_item_marriage:0 "Pacte matrimonial"
 tnt_item_marriage_desc:0 "Une union entre les deux maisons, et #high autant de couples dans un même traité que vous le voulez#!. Choisissez une personne de chaque côté, fixez la lignée que suivront les enfants, puis ajoutez le couple ; si l’un des deux est encore un enfant, le couple est fiancé plutôt que marié.\n\n#weak Chaque couple après le premier vaut au partenaire un peu moins que le précédent, tandis que ce qu’une union lui coûte ne diminue jamais : quelques bonnes unions valent mieux qu’une douzaine d’unions de remplissage. Une maison à qui l’on demande d’épouser au-dessous de son rang fait payer la déchéance, et plus l’écart est grand, plus l’addition est lourde. Un couple peut en outre se voir promettre un grand mariage.#!\n\n#high Une union assez proche apporte désormais une alliance avec elle#!, exactement comme le fait le mariage arrangé du jeu lui-même — et le prix du traité la porte : une union qui vous allie vaut plus qu’une union qui ne le fait pas. #weak Les indications « Potentielle alliance » que l’écran des mariages affiche à côté des candidats peuvent de nouveau être crues.#!"
 tnt_item_title:0 "Céder un titre"
 tnt_item_title_desc:0 "Remettre un titre détenu de rang comtal ou supérieur, avec tout ce qui en dépend.\n\n#weak Autant que vous le voulez à la fois. Une capitale et un titre principal ne sont jamais sur la table. Une terre qui dépasse ce que le domaine du receveur peut porter reste une terre : il la prendra, la paiera à son plein prix, et répondra devant ses propres intendants de la charge qui s’ensuit.#!"
 tnt_item_claim:0 "Accorder une revendication"
 tnt_item_claim_desc:0 "Accorder, sur un titre que le donneur détient lui-même, une [claim|E] qu’il ne fait pas encore valoir : une invitation ouverte à une guerre future, et une grave concession.\n\n#weak Autant que vous le voulez à la fois.#!"
 tnt_item_prisoner_multi:0 "Libérer des captifs choisis"
 tnt_item_prisoner_multi_desc:0 "Ouvrir vos geôles aux seuls captifs que vous désignez.\n\n#weak Ce qui fait le prix d’un captif, c’est son rang et son sang : #high 10#! pour n’importe qui, #high +15#! s’il est parent de l’autre partie, #high +10#! s’il détient un titre quel qu’il soit, et #high +15 / +25 / +40 / +60#! selon que ce titre atteint le comté, le duché, le royaume ou l’empire. Un roi captif vaut donc plus qu’une douzaine d’inconnus, et c’est là tout l’intérêt de choisir.#!\n\n#weak Désigner quiconque ici l’emporte sur #high Libérer les prisonniers#! : sans quoi les deux clauses paieraient deux fois pour les mêmes hommes.#!"
 tnt_multi_count_prisoner_p:0 "Captifs désignés : [GetPlayer.MakeScope.ScriptValue('tnt_count_sel_prisoner_p_value')|0]"
 tnt_sel_count_prisoner_p:0 "Désignés : [GetPlayer.MakeScope.ScriptValue('tnt_count_sel_prisoner_p_value')|0]"
 tnt_picker_title_prisoner:0 "Choisir les captifs à libérer"
 tnt_item_prisoners:0 "Libérer les prisonniers"
 tnt_item_prisoners_desc:0 "La partie qui libère ouvre ses geôles à tout prisonnier lié à l’autre partie par le sang ou par la fidélité."
 tnt_item_hook:0 "Faveur due"
 tnt_item_hook_desc:0 "Devoir une [hook_i] faveur à l’autre partie. Trois degrés : une faveur #high faible#! dure dix ans et se consomme dès le premier usage ; une faveur #high forte#! dure vingt ans, sert encore et encore, et demande cinq ans de repos entre deux usages ; une faveur #high éternelle#! n’expire jamais, ne se consomme jamais, et demande les mêmes cinq ans de repos entre deux usages.\n\n#weak Clic pour monter d’un degré, clic droit pour descendre. Une faveur ne peut être promise si la partie qui la recevrait détient déjà un hameçon sur celle qui la devrait.#!"
 tnt_item_artifact:0 "Artefact"
 tnt_item_artifact_desc:0 "Remettre un [artifact_i] artefact pris dans le trésor du donneur.\n\n#weak Autant que vous le voulez à la fois. Les pièces que le jeu lui-même retient chez leur maître ne figurent pas dans la liste : les joyaux de couronne attachés à un titre, les bannières dynastiques, et les reliques de la foi du donneur offertes à qui ne partage pas cette foi.#!"
 tnt_item_nonwar:0 "Promettre de ne pas attaquer"
 tnt_item_nonwar_desc:0 "Jurer une [truce|E] unilatérale avec un tiers pour #high dix ans#! ; rompre une trêve entraîne une lourde pénalité.\n\nQui peut être désigné : les dirigeants dont le pays borde celui du jureur, et les détenteurs de titres sur lesquels le jureur a une revendication. Jamais les deux négociateurs, ni les alliés du jureur, ni quiconque est déjà sous trêve avec lui.\n\n#weak L’autre partie ne doit rien en retour : le jureur retient simplement son bras.#!"
 tnt_item_vassal:0 "Jurer fidélité"
 tnt_item_vassal_desc:0 "Un dirigeant met genou à terre et devient le [vassal|E] de l’autre, avec tout son pays. La plus lourde clause que cette table puisse porter, et la seule qui s’accompagne d’un contrat écrit que vous pouvez amender."
 tnt_item_indep:0 "Accorder l’indépendance"
 tnt_item_indep_desc:0 "Un vassal est délié de son serment de fidélité et devient un dirigeant indépendant. De votre côté de la table, c’est votre propre vassal qui s’en va libre ; du côté du partenaire, c’est vous. Un traité ne peut porter cette clause et un serment de fidélité à la fois.\n\n#weak Elle ne peut être proposée que si vous vous tenez déjà l’un envers l’autre comme seigneur lige et vassal direct, si celui qui serait libéré détient des terres en propre, si aucun des deux pays n’est en guerre, et si ses terres ne font pas partie de l’héritage de jure de son seigneur lige.#!"
 tnt_item_hostage:0 "Otage"
 tnt_item_hostage_desc:0 "Un proche parent du donneur — un enfant, un petit-enfant, un frère ou une sœur, un neveu ou une nièce — gagne l’autre cour et y demeure comme otage, en garantie de ce traité. Il y est un invité, selon les règles d’otage du jeu lui-même, et non un prisonnier.\n\n#weak Seuls des parents sans terre, non mariés et non fiancés, déjà présents à sa propre cour, peuvent être engagés, et jamais son propre régent.#!"
 tnt_item_ward:0 "Pupille"
 tnt_item_ward_desc:0 "Un enfant de la cour du donneur est envoyé pour être élevé par l’autre dirigeant. Celui-ci en devient lui-même le tuteur — il n’y a pas de tiers à choisir.\n\n#weak Seuls les enfants de sa propre cour en état de voyager peuvent être proposés, et un tuteur ne peut prendre un troisième pupille.#!"
 tnt_item_courtier:0 "Courtisans"
 tnt_item_courtier_desc:0 "Des courtisans changent de maison, chacun emmenant avec lui son conjoint et ses jeunes enfants.\n\n#weak Seuls les membres adultes et sans terre de la cour du donneur qui n’y occupent aucune charge peuvent être remis — ni son héritier, ni son conjoint, ni son régent, ni ses conseillers, ni ses chevaliers, ni ses officiers de cour — et jamais un homme que le receveur tient pour rival.#!"
 tnt_item_subject_desc:0 "Les vassaux choisis changent de seigneur lige et passent dans le pays de l'autre dirigeant, emportant tous les titres qu'ils détiennent et tous leurs propres vassaux.\n\n#weak Leur contrat vassalique est réécrit aux conditions ordinaires du pays d'accueil : les obligations particulières disparaissent. Aucune trêve ne suit le transfert, et rien dans le jeu ne ramène un vassal de l'autre côté d'une frontière, sinon la guerre. Seuls des vassaux directs détenant au moins un comté, de rang inférieur au dirigeant qui les reçoit et en paix avec tous les intéressés peuvent être remis — jamais un régent, jamais un héritier — et un vassal déjà déplacé par un traité ne peut l'être à nouveau avant trois ans.#!"
 tnt_item_subject:0 "Transférer un vassal"
