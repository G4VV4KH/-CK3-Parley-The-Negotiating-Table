 tnt_err_vassal_tier:0 "Un vassal doit être de rang inférieur à son seigneur lige."
 tnt_err_vassal_wall:0 "La Garde de Nuit ne prête d’autre serment que le sien. Ceux qui tiennent le Mur ne prennent ni ne donnent de seigneur lige, et aucun traité ne peut les lier à un pays."
 tnt_confirm_title:0 "Sceller le traité ?"
 tnt_confirm_desc:0 "Les conditions sont posées sur la table, la cire et le sceau à portée de main.\n\nUne fois l’émissaire parti, [tnt_deal_partner.GetShortUIName] entendra l’offre exactement telle qu’elle est : rien d’ajouté, rien de retiré."
