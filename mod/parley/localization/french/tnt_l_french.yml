 tnt_action_can_lean_on_combined_group_label:0 "@dread_icon! Dirigeants sur qui vous avez l’avantage"
 tnt_action_can_lean_on_combined_group_name:0 "@dread_icon! Dirigeants sur qui faire pression"
 tnt_action_can_lean_on_combined_group_description:0 "Parmi vos propres vassaux, vos suzerains et les voisins de vos frontières comme d’outre-mer, on peut faire pression sur chacun de ces dirigeants : votre armée, votre nom et votre redoutabilité, chacun mesuré au sien, atteignent le poids qu’exige une menace, et il a oublié votre dernière menace. Ouvrez des négociations avec l’un d’eux et cochez « Menacer le partenaire » pour poser la menace sur la table."
 tnt_msg_stale:0 "Les conditions ont changé"
 tnt_err_deal_changed:0 "L’accord ne peut plus être exécuté tel qu’il est rédigé ; aucun échange n’a eu lieu."
