 tnt_truce_nonwar:0 "Serment de ne pas attaquer"
 rule_tnt_advanced_terms:0 "Parley : clauses avancées"
 setting_tnt_advanced_terms_on:0 "Activées"
 setting_tnt_advanced_terms_on_desc:0 "Les fiançailles, les titres cédés et le serment de fidélité peuvent s’échanger à la table des négociations. Désactivez la règle et les dirigeants de l’IA cessent aussi de proposer des mariages par lettre."
 setting_tnt_advanced_terms_off:0 "Désactivées"
 setting_tnt_advanced_terms_off_desc:0 "Les fiançailles, les titres cédés et le serment de fidélité sont masqués à la table des négociations."
 rule_tnt_trade_prestige:0 "Parley : échange de prestige"
 setting_tnt_trade_prestige_on:0 "Activé"
 setting_tnt_trade_prestige_on_desc:0 "Le prestige peut être offert et exigé à la table des négociations avec n’importe quel partenaire, par vous comme par les dirigeants de l’IA. Le plus large des trois réglages."
 setting_tnt_trade_prestige_peer:0 "Pairs et inférieurs seulement"
 setting_tnt_trade_prestige_peer_desc:0 "Le prestige ne s’échange qu’avec un dirigeant dont le niveau de gloire n’est pas supérieur au vôtre : la renommée ne se vend pas vers le haut. Asseyez-vous face à plus illustre que vous et les deux lignes de prestige disparaissent tout simplement pour cette négociation, le bouton d’équilibrage ne dépense aucun prestige, et aucune de ses lettres n’en réclame. Avec tous les autres, rien ne change."
 setting_tnt_trade_prestige_off:0 "Désactivé"
 setting_tnt_trade_prestige_off_desc:0 "Le prestige ne s’échange jamais, avec personne : les deux lignes de prestige disparaissent de la table des négociations, le bouton d’équilibrage ne dépense jamais de prestige, et aucune offre de l’IA n’en contient. L’or, la piété et l’influence ne sont pas touchés."
 rule_tnt_trade_piety:0 "Parley : échange de piété"
 setting_tnt_trade_piety_on:0 "Activé"
 setting_tnt_trade_piety_on_desc:0 "La piété peut être offerte et exigée à la table des négociations avec n’importe quel partenaire, par vous comme par les dirigeants de l’IA. Le plus large des quatre réglages."
 setting_tnt_trade_piety_faith:0 "Même foi seulement"
 setting_tnt_trade_piety_faith_desc:0 "La piété ne s’échange qu’entre deux dirigeants de la même foi : la dévotion ne vaut rien devant le clergé d’autrui. Asseyez-vous face à un partenaire d’une autre foi et les deux lignes de piété disparaissent tout simplement pour cette négociation, le bouton d’équilibrage ne dépense aucune piété, et aucune de ses lettres n’en réclame."
 setting_tnt_trade_piety_religion:0 "Même religion seulement"
 setting_tnt_trade_piety_religion_desc:0 "La piété s’échange dès que les deux dirigeants partagent une religion, même si leurs fois diffèrent : un catholique et un orthodoxe échangent encore leur dévotion, un catholique et un sunnite non. Face à un partenaire d’une autre religion, les deux lignes de piété disparaissent tout simplement pour cette négociation, le bouton d’équilibrage ne dépense aucune piété, et aucune de ses lettres n’en réclame."
 setting_tnt_trade_piety_off:0 "Désactivé"
 setting_tnt_trade_piety_off_desc:0 "La piété ne s’échange jamais, avec personne : les deux lignes de piété disparaissent de la table des négociations, le bouton d’équilibrage ne dépense jamais de piété, et aucune offre de l’IA n’en contient. L’or, le prestige et l’influence ne sont pas touchés."
