 tnt_ai_offer_row_contract:0 "Le contrat de sa fidélité, tel qu’il voudrait le voir écrit (termes modifiés : [GetPlayer.MakeScope.ScriptValue('tnt_ob_changed_value')|0]) :"
 tnt_ai_offer_row_marriage:0 "Un mariage est proposé entre les maisons :"
 tnt_ai_offer_row_usehook_r:0 "Il réclame une [hook_i] faveur que vous lui devez"
 tnt_ai_offer_row_word_kept:0 "Ce marché ne lui sourit plus, mais il l’a offert et il l’honorera"
 tnt_ai_gift_line:0 "Envoyé par haute estime : les conditions valent plus que ce qui est demandé en retour. Cette lettre est un présent délibéré."
 tnt_refuse_envoys_decision:0 "Ne plus recevoir d’ambassades"
 tnt_refuse_envoys_decision_desc:0 "Le mot court discrètement sur toutes les routes et dans tous les ports : cette cour a fini d’écouter les porteurs de traités. Que les dirigeants gardent leurs propositions. Vos propres émissaires chevauchent comme avant : la porte est barrée de l’intérieur, et la barre est dans votre main."
 tnt_refuse_envoys_decision_tooltip:0 "Aucun dirigeant ne vous abordera avec un traité jusqu’à ce que vous en décidiez autrement. Les négociations que vous ouvrez vous-même ne sont pas touchées."
 tnt_refuse_envoys_decision_confirm:0 "Barrer la porte"
 tnt_refuse_envoys_decision_effect_tt:0 "Aucun dirigeant ne vous abordera avec un traité tant que vous n’aurez pas révoqué cette décision."
 tnt_accept_envoys_decision:0 "Recevoir de nouveau les ambassades"
 tnt_accept_envoys_decision_desc:0 "La barre est levée et l’on dit aux gardiens de la porte de s’écarter : les porteurs de traités peuvent de nouveau être introduits, leurs sceaux intacts, leurs offres pesées sur les mêmes balances qu’auparavant."
 tnt_accept_envoys_decision_tooltip:0 "Les ambassades porteuses de traités peuvent de nouveau atteindre votre cour, dès aujourd’hui."
 tnt_accept_envoys_decision_confirm:0 "Ouvrir les portes"
 tnt_accept_envoys_decision_effect_tt:0 "Les ambassades porteuses d’offres de traité peuvent de nouveau atteindre votre cour, et cela sur-le-champ, non au terme de l’ancien silence."
 decision_group_type_tnt_uninstall:0 "Décisions de retrait de mod"
 tnt_uninstall_decision:0 "Replier la table des négociations"
 tnt_uninstall_decision_desc:0 "Les émissaires sont congédiés, les registres brûlés, la table elle-même emportée hors de la salle. Prenez cette décision juste avant de retirer le mod : elle balaie de la sauvegarde toute trace que Parley garde en ce monde. Les lettres sans réponse et les négociations à demi bâties sont annulées ; tout traité déjà conclu demeure."
 tnt_uninstall_decision_tooltip:0 "Prépare cette sauvegarde à être jouée sans Parley: The Negotiating Table. Retire toute variable, tout hameçon et toute opinion que le mod a écrits, sur chaque personnage du monde. Les accords conclus — mariages, titres cédés, serments de fidélité — ne sont pas touchés."
 tnt_uninstall_decision_confirm:0 "Faire place nette"
 tnt_uninstall_decision_effect_tt:0 "Toute variable, toute liste, toute marque de personnage, tout hameçon et toute opinion écrits par Parley sont retirés de chaque personnage du monde. Toute lettre d’offre sans réponse et toute négociation à demi bâtie sont annulées. Sauvegardez la partie, puis désactivez le mod : la sauvegarde est désormais nette de Parley."
 tnt_ai_msg_treaty:0 "Un traité est signé"
 tnt_ai_msg_tt_truce:0 "Ils ont acheté dix ans de paix avec de l’or."
 tnt_ai_msg_tt_ally:0 "Ils ont acheté une alliance militaire avec de l’or."
 tnt_ai_msg_tt_hook:0 "L’un doit désormais une faveur à l’autre, achetée avec de l’or."
 tnt_ai_msg_tt_hookcall:0 "Une dette a été réclamée : l’un d’eux détenait un [hook|E] sur l’autre et s’est fait payer en or."
 tnt_ai_msg_tt_ultimatum:0 "De l’or a changé de mains dans un seul sens. Le plus faible des deux a payé pour qu’on le laisse en paix."
 tnt_ai_msg_tt_title:0 "De la terre a changé de mains contre de l’or : l’un des deux dirigeants a acheté un comté à l’autre."
 tnt_ai_msg_tt_vassal:0 "Un pays a plié le genou : le dirigeant le plus faible a juré fidélité au plus fort, contre de l’or et une protection."
 tnt_ai_msg_tt_submission:0 "Un pays s’est soumis sous la menace : un souverain d’une force écrasante a contraint un voisin indépendant plus faible à lui jurer fidélité, sans paiement."
 tnt_ai_msg_tt_artifact:0 "Un trésor a changé de mains contre de l’or : l’un des deux dirigeants a acheté une pièce de la salle de l’autre."
 tnt_ai_msg_tt_wed:0 "Deux maisons sont unies : les dirigeants ont convenu d’un mariage entre leurs parents, et une dot en or l’a accompagné."
 rule_tnt_ai_treaties:0 "Parley : traités entre IA"
 setting_tnt_ai_treaties_off:0 "Désactivés"
 setting_tnt_ai_treaties_off_desc:0 "Les dirigeants de l’IA ne concluent jamais de traités entre eux dans votre dos.\n\n#weak Ne coûte absolument rien : une consultation par an, et rien de plus. L’IA peut toujours traiter avec #high vous#!.#!"
 setting_tnt_ai_treaties_rare:0 "Occasionnels"
 setting_tnt_ai_treaties_rare_desc:0 "Les dirigeants de l’IA voisins concluent de temps à autre des marchés entre eux : environ une poignée de traités par an sur toute la carte.\n\nOr, faveurs dues, dettes réclamées, ultimatums et artefacts s’échangent ainsi ; entre parties déjà amies, un comté frontalier peut être vendu à son plein prix, ou un voisin plus faible payé pour jurer fidélité. Un roi ou empereur d’une force écrasante peut au contraire contraindre un voisin indépendant plus faible à lui jurer fidélité sous la menace. #high Les mariages entre maisons s’échangent silencieusement eux aussi, et nul n’est consulté d’abord.#! Vous êtes averti chaque fois qu’un traité concerne quelqu’un dont vous bordez les terres, à qui vous êtes allié, ou que vous combattez."
 setting_tnt_ai_treaties_common:0 "Fréquents"
 setting_tnt_ai_treaties_common_desc:0 "Environ trois fois le rythme d’Occasionnels, pour une carte dont les cours parlent sans cesse.\n\nLes mêmes clauses échangeables, et la même limite de trois ans par dirigeant, de sorte que rien ne s’emballe.\n\n#weak C’est le réglage par défaut.#!"
 rule_tnt_ai_offer_rate:0 "Parley : offres qui vous sont envoyées"
 setting_tnt_ai_offer_rate_off:0 "Jamais"
 setting_tnt_ai_offer_rate_off_desc:0 "Aucun dirigeant ne vous écrit jamais pour vous proposer un traité de son cru.\n\n#weak Vous pouvez toujours ouvrir vous-même des négociations avec qui vous voulez, et les dirigeants de l’IA continuent de traiter entre eux si l’autre règle le permet.#!"
 setting_tnt_ai_offer_rate_rare:0 "Rares"
 setting_tnt_ai_offer_rate_rare_desc:0 "Une lettre n’arrive que de loin en loin : attendez-vous à des années de calme entre deux émissaires.\n\n#weak Pour une partie où vous préférez être celui qui demande.#!"
 setting_tnt_ai_offer_rate_normal:0 "Normales"
 setting_tnt_ai_offer_rate_normal_desc:0 "Un voisin vous écrit au plus une fois par an, et chaque dirigeant attend trois ans avant de composer une nouvelle offre."
 setting_tnt_ai_offer_rate_frequent:0 "Fréquentes"
 setting_tnt_ai_offer_rate_frequent_desc:0 "Les émissaires se présentent plusieurs fois par an, et les dirigeants vous reconsidèrent bien plus tôt.\n\nChaque offre reste évaluée sur les mêmes balances que celles de la fenêtre de négociation : une carte plus animée n’est pas une carte plus généreuse.\n\n#weak C’est le réglage par défaut.#!"
 setting_tnt_ai_offer_rate_test:0 "Test : très fréquentes"
 setting_tnt_ai_offer_rate_test_desc:0 "#N Pour tester le mod, non pour jouer.#! Les délais d’attente sont réduits à quelques semaines : une offre devrait vous parvenir dans les mois qui suivent le début de la partie.\n\n#weak Servez-vous-en pour vérifier que les lettres fonctionnent, puis remettez la règle sur Fréquentes.#!"
 rule_tnt_ai_telemetry:0 "Parley : journal de diagnostic"
 setting_tnt_ai_telemetry_off:0 "Désactivé"
 setting_tnt_ai_telemetry_off_desc:0 "Aucune journalisation de diagnostic, ce qu’il faut pour jouer.\n\n#weak C’est le réglage par défaut et il ne coûte rien : une consultation de règle là où une ligne aurait été écrite.#!"
 setting_tnt_ai_telemetry_on:0 "Activé"
 setting_tnt_ai_telemetry_on_desc:0 "Écrit une ligne dans #high error.log#! pour chaque décision qu’un dirigeant de l’IA prend au sujet d’un traité : qui il a considéré, ce qu’il a posé sur la table, à combien il a évalué l’accord, et #high pourquoi il s’est retiré#!.\n\nEnviron 600 à 1600 lignes par demi-année de jeu. Le jeu n’en est affecté en aucune façon.\n\n#weak Activez ceci avant une longue partie laissée à elle-même, puis envoyez le journal pour lecture.#!"
 setting_tnt_ai_telemetry_verbose:0 "Détaillé"
 setting_tnt_ai_telemetry_verbose_desc:0 "Comme Activé, plus une ligne par dirigeant de l’IA et par an, prise avant le tirage des dés entre IA.\n\nDes milliers de lignes supplémentaires. Cela ne sert qu’à distinguer #high l’impulsion n’a jamais tourné#! de #high elle a tourné et les dés ont dit non#!.\n\n#weak Pour une courte partie de vérification seulement.#!"
 rule_tnt_threat_scale:0 "Parley : les menaces à la table"
 setting_tnt_threat_scale_rare:0 "Rares"
 setting_tnt_threat_scale_rare_desc:0 "Coefficient N = 2,5. Toute menace exige #high au moins 100 points de transaction#!. À prestige et redoutabilité égaux, il faut un rapport de forces de 41 contre 1.\n\n#weak Un prestige et une redoutabilité supérieurs réduisent l’avantage militaire nécessaire. Un niveau de prestige entier sous celui de la cible annule la valeur de la menace. Ces règles valent pour le joueur comme pour l’IA.#!"
 setting_tnt_threat_scale_normal:0 "Normales"
 setting_tnt_threat_scale_normal_desc:0 "Coefficient N = 5. Toute menace exige #high au moins 100 points de transaction#!. À prestige et redoutabilité égaux, le rapport de forces minimal est de #high 21 contre 1#!.\n\nUn prestige et une redoutabilité supérieurs réduisent l’avantage militaire nécessaire. Un niveau de prestige entier sous celui de la cible annule la valeur de la menace.\n\n#weak Réglage par défaut. Ces règles valent pour le joueur comme pour l’IA.#!"
 setting_tnt_threat_scale_frequent:0 "Fréquentes"
 setting_tnt_threat_scale_frequent_desc:0 "Coefficient N = 7,5. Toute menace exige toujours #high au moins 100 points de transaction#!.\n\n#weak Un prestige et une redoutabilité supérieurs réduisent l’avantage militaire nécessaire. Un niveau de prestige entier sous celui de la cible annule la valeur de la menace. Ces règles valent pour le joueur comme pour l’IA.#!"
 setting_tnt_threat_scale_constant:0 "Omniprésentes"
 setting_tnt_threat_scale_constant_desc:0 "Coefficient N = 10. Toute menace exige #high au moins 100 points de transaction#!. À prestige et redoutabilité égaux, le rapport de forces minimal est de #high 11 contre 1#!.\n\n#weak Un prestige et une redoutabilité supérieurs réduisent l’avantage militaire nécessaire. Un niveau de prestige entier sous celui de la cible annule la valeur de la menace. Ces règles valent pour le joueur comme pour l’IA.#!"
 tnt_mutual_header:0 "Entre vous deux"
 tnt_bd_domain_p:0 "Titres au-delà de la limite de son domaine : ils lui valent moins"
 tnt_bd_domain_r:0 "Titres au-delà de la limite de votre domaine : ils vous valent moins"
 tnt_tt_step_huge_add:0 "Ajouter une grande quantité d’un coup.\n\n#weak Or, prestige et piété : 1000 par clic. Influence : 250, car l’influence elle-même ne dépasse jamais 1000.#!"
 tnt_tt_step_huge_sub:0 "Retirer une grande quantité d’un coup.\n\n#weak Or, prestige et piété : 1000 par clic. Influence : 250, car l’influence elle-même ne dépasse jamais 1000.#!"
 tnt_preset_open:0 "…"
 tnt_tt_preset_open:0 "Fixer un montant en un clic.\n\n#weak Un montant d’usage, la moitié de ce qui est détenu, tout ce qui peut être payé, ou rien du tout.#!"
 tnt_preset_menu_header:0 "Combien ?"
 tnt_preset_std_gold:0 "Un an de revenus"
 tnt_preset_std_gift:0 "Un présent d’usage"
 tnt_preset_half:0 "La moitié"
 tnt_preset_max:0 "Tout ce que je peux"
 tnt_preset_max_r:0 "Tout ce qu’il peut"
 tnt_preset_none:0 "Rien"
 tnt_tt_preset_std_gold:0 "Offrir une année de revenus.\n\n#weak Plafonné à ce qui se trouve réellement dans le trésor.#!"
 tnt_tt_preset_std_gift:0 "Offrir le montant d’usage pour une faveur de cette taille : ce qu’un dirigeant de son rang attend.\n\n#weak Plafonné à ce qui est réellement détenu. Le prestige, la piété et l’influence n’ont pas de revenu annuel : il n’existe donc pas d’« année » de ces trois-là à offrir.#!"
 tnt_tt_preset_half:0 "Offrir la moitié de ce qui est détenu."
 tnt_tt_preset_max:0 "Offrir tout ce qui peut être payé."
 tnt_tt_preset_none:0 "Retirer cette ressource de la table."
 tnt_autobalance_btn:0 "Équilibrer"
 tnt_tt_autobalance:0 "Ajuster l’or, le prestige, la piété et l’influence posés sur la table jusqu’à ce que l’offre soit tout juste acceptable pour le partenaire.\n\nCela joue dans les deux sens : le bouton adoucit une offre qu’il refuserait, et il #high rogne celle qu’il accepterait trop facilement#!, de sorte que vous ne payez jamais trop.\n\n#weak Il n’ajoute rien d’autre, ni terre, ni revendication, ni mariage, ni faveur, et il n’offre jamais plus que ce qui peut réellement être payé.#!"
 tnt_ab_state_balanced:0 "#P Équilibré.#! L’offre se tient désormais tout juste dans ce que le partenaire acceptera."
 tnt_ab_state_minimal:0 "Déjà au minimum. Rien n’avait besoin d’être changé."
 tnt_ab_state_unreachable:0 "#N Hors d’atteinte.#! Le partenaire refuse encore, même avec tout ce que vous pouvez payer."
 tnt_ab_lumpy_hint:0 "Pressez de nouveau pour continuer à ajouter. Tout ce que ce bouton a ajouté et que vous avez ensuite retiré ne sera plus proposé."
 tnt_ab_lumpy_line:0 "Sa bourse était vide : la dernière pression a donc pris des clauses de son côté de la table, une terre, une revendication ou sa fidélité."
 tnt_stage_marriage_interaction:0 "Ajouter une union au traité"
 tnt_stage_marriage_send:0 "Ajouter cette union au traité"
 tnt_stage_marriage_prompt:0 "#high Une union assez proche apporte désormais l’alliance avec elle#! - la même que le jeu accorde pour son propre mariage arrangé, le jour où le traité est scellé."
 tnt_stage_no_alliance_tt:0 "#high Une union inscrite dans ce traité crée désormais une alliance.#! C’est la règle du jeu lui-même et non celle de ce mod : le jeu pèse à quel point chacun des deux est proche parent du dirigeant qui le donne, et si le couple est assez proche des deux côtés, vous et lui êtes alliés dès l’instant où le traité est scellé — exactement comme l’a toujours fait #high $arrange_marriage_interaction$#! du jeu. Personne n’achète d’[alliances|E] à cette table : il n’y a pas de clause de ce genre sur la feuille, et il n’y en aura jamais ; elle vient simplement avec le mariage.\n\n#weak Les signes d’alliance que le jeu dessine lui-même dans cette fenêtre peuvent donc de nouveau être crus — la barre de force « Potentielle alliance » à côté de chaque candidat et les petits blasons couronnés juste à côté. Ils vivent dans la liste des candidats, et cette liste quitte l’écran à l’instant où les deux portraits sont choisis, si bien qu’au moment où vous lisez ceci il n’en reste plus rien sur la page ; mais le verdict imprimé juste au-dessus de ce paragraphe répond pour le couple devant vous, et c’est la réponse du jeu lui-même, non une prévision.#!\n\n#weak L’alliance repose sur le couple lui-même : elle dure exactement aussi longtemps que leur union et s’éteint avec elle, par les rouages du jeu. Si l’un des deux est encore un enfant, le couple est fiancé plutôt que marié, et l’alliance tient sur ces fiançailles dès le premier jour. Un traité peut porter plusieurs couples, et chacun est jugé pour lui-même.#!"
 tnt_stage_alliance_opens_tt:0 "#high Cette union CRÉE une alliance entre vous et lui.#! Non pas une porte à laquelle frapper plus tard, mais l’alliance elle-même, le jour où le traité est scellé, dès que ces deux-là sont mariés ou fiancés. C’est la règle du jeu lui-même, exactement celle que suit son #high $arrange_marriage_interaction$#! : le jeu pèse à quel point chacun des deux est proche parent du dirigeant qui le donne, et ce couple est assez proche des deux côtés. Rien de plus ne vous est demandé, et il ne peut pas refuser : elle vient avec le traité.\n\n#high Cela vaut [SCOPE.ScriptValue('tnt_stage_alliance_offer_value')|+=0] points de traité — et ils sont DÉJÀ COMPRIS dans le chiffre imprimé ci-dessus pour cette union. Ne les ajoutez pas une seconde fois.#! Un traité ne paie l’alliance qu’une seule fois : si un couple déjà posé sur la table l’ouvre, celui-ci n’ajoute rien au prix et devient une seconde raison sur laquelle le pacte tient."
 tnt_stage_alliance_shut_tt:0 "#high Cette union NE crée PAS d’alliance.#! Le jeu mesure à quel point chacun des deux est proche parent du dirigeant qui le remet, additionne les deux distances et n’accorde l’alliance que tant que cette somme reste faible. Une union entre deux courtisans n’apparente personne à cette table : un tel couple n’allie personne, et un inconnu tiré de votre propre salle ne vaut pas mieux. Mariez votre propre sang au sien — un enfant, un petit-enfant, un frère ou une sœur, un père ou une mère — ou tenez-vous vous-même à l’autel, et la somme rentre dans la limite du jeu. C’est la règle même qui gouverne #high $arrange_marriage_interaction$#! du jeu, et elle se mesure des deux côtés à la fois : un choix proche de votre côté ne rachète pas un choix lointain du sien."
 tnt_stage_alliance_already_tt:0 "#high Vous êtes déjà son allié, et cette union n’ouvre donc aucun nouveau pacte.#! Un pacte que vous détenez déjà ne se conclut pas une seconde fois : l’alliance n’ajoute aucun point de traité par-dessus cette union, et le traité ne vous en fait rien payer. Si le couple est d’un sang assez proche pour satisfaire à la règle du jeu lui-même, le mariage sera simplement inscrit comme une raison de plus sur laquelle repose l’alliance que vous avez déjà ; s’il ne l’est pas, l’alliance restera exactement telle qu’elle était. Dans les deux cas, l’union elle-même vaut toujours les points imprimés ci-dessus, et le pacte entre vous et lui demeure intact."
 actor_secondary_tnt_stage_marriage_interaction:0 "Votre candidat"
 recipient_secondary_tnt_stage_marriage_interaction:0 "Son candidat"
 tnt_stage_pair_points_line:0 "Cette union déplace le traité de [SCOPE.ScriptValue('tnt_stage_pair_deal_delta_value')|+=0] — exactement de combien bouge la balance de la fenêtre de négociation quand vous la posez sur la table.\n#weak Offert [SCOPE.ScriptValue('tnt_stage_pair_gain_value')|0], demandé [SCOPE.ScriptValue('tnt_stage_pair_loss_value')|0], et l’alliance que cette union crée : [SCOPE.ScriptValue('tnt_stage_alliance_offer_value')|+=0]. Ces trois chiffres SONT celui du dessus : l’alliance est dedans, jamais en plus. Il estime ce que vous offrez à x[SCOPE.ScriptValue('tnt_deal_mult_value')|2], et un grand mariage, si vous le promettez, vaut [SCOPE.ScriptValue('tnt_stage_grand_offer_value')|+=0] de cette offre.#!\n#weak La ligne PROPRE de ce couple dans le traité porte un autre chiffre : [SCOPE.ScriptValue('tnt_stage_pair_raw_net_value')|+=0] — l’union seule, avant son estime et avant l’alliance. Les deux sont vrais ; la balance montre le premier.#!\n#weak À partir de la deuxième union du même traité, le premier chiffre est une ESTIMATION et non le déplacement exact : une remise de volume s’applique à l’ensemble des mariages, et la grande noce comme la terreur entre vous deux se paient UNE SEULE FOIS PAR TRAITÉ tout en étant recomptées à la ligne de chaque union. L’écart peut atteindre des dizaines de points, dans un sens comme dans l’autre. À la première union, le chiffre est exact.#!"
 tnt_stage_grand_info:0 "$GRAND_WEDDING_PROMISE_INFO$\n\n#high Vaut [SCOPE.ScriptValue('tnt_stage_grand_offer_value')|+=0] points de traité#! pour ce couple, en plus de l’union elle-même.\n\n#weak Ils restent FIANCÉS tant que vous n’aurez pas réellement tenu les noces. #high L’alliance, elle, n’attend pas la fête#! : elle tient sur les fiançailles mêmes, dès le jour où le traité est scellé, et elle dure exactement aussi longtemps qu’elles. L’alerte ordinaire du jeu pour un couple fiancé désormais en âge de se marier se tait à dessein sur un couple à qui l’on a promis une grande noce : c’est l’alerte « Organiser une grande noce » qui prend ce couple en charge, et elle va à celui qui a fait la promesse.#!"
 tnt_stage_marriage_desc:0 "Vous choisissez une union pour le traité posé sur la table. #high Vous n’envoyez pas une demande en mariage.#!\n\nLe large bouton ci-dessous porte la mention #high « Envoyer la proposition »#! du fait du jeu lui-même, et ce libellé ne peut pas être changé ici. Il n’envoie rien et ne marie personne : il inscrit ce couple dans le traité que vous négociez, à côté de l’or et de la terre, et les conditions du traité sont réévaluées avec l’union dedans.\n\n#high Personne n’est marié et personne n’est fiancé tant que l’autre partie n’a pas accepté le traité entier.#! Si le traité est refusé ou abandonné, l’union n’aura tout simplement jamais eu lieu.\n\n#weak Choisissez une personne dans chaque maisonnée, fixez la lignée, et confirmez. Revenez aussi souvent qu’il vous plaira : un traité peut porter un nombre quelconque de couples.#!\n\n#weak Le jeu affiche ici ses propres indications sur les alliances — #high vous pouvez de nouveau les croire#!. Une union inscrite dans un traité porte désormais la même alliance que porte #high $arrange_marriage_interaction$#! du jeu, et selon la règle du jeu lui-même : il pèse à quel point chacun des deux est proche parent du dirigeant qui le donne, et si le couple est assez proche des deux côtés, vous et lui êtes alliés dès l’instant où le traité est scellé.#!\n\n#weak Le verdict sur le couple que vous avez réellement choisi est imprimé plus haut, et c’est la réponse du jeu lui-même, non une supposition : une seule et même épreuve décide cette ligne et l’alliance. Une union entre deux courtisans n’allie toujours personne. L’alliance repose sur le couple : elle dure aussi longtemps que leur union ; et si l’un des deux est encore un enfant, elle tient sur les fiançailles dès le premier jour.#!"
 tnt_btn_stage_marriage:0 "Choisir une union sur l’écran classique"
 tnt_btn_stage_marriage_full:0 "$tnt_item_marriage_desc$\n\n$tnt_btn_stage_marriage_tip$"
 tnt_btn_stage_marriage_tip:0 "Ouvre l’écran de mariage du jeu lui-même : les deux maisonnées côte à côte, tous les filtres et la recherche, les deux portraits, et la lignée.\n\n#high Il ne marie personne.#! Le couple que vous y confirmez est inscrit dans ce traité, et la noce — ou les fiançailles, si l’un des deux est un enfant — n’a lieu que lorsque le traité entier est accepté.\n\n#weak Prenez garde aux mots du jeu : le large bouton de cette fenêtre porte la mention « Envoyer la proposition ». Il n’envoie de proposition à personne, il ajoute le couple ici. Les deux mêmes personnes peuvent aussi être choisies à la main dans les listes ci-dessous, seul endroit où un couple déjà inscrit au traité peut changer de lignée.#!"
 tnt_marriage_stage_note:0 "#weak Rien n’est envoyé et personne ne se marie : le couple est inscrit dans ce traité.#!"
 tnt_err_grand_host:0 "Vous ne pouvez pas promettre un grand mariage pour l’instant : il y faut un dirigeant titré de rang supérieur à baron, #high Tours & Tournaments#! avec ses activités avancées, assez d’or pour recevoir, et aucune promesse de votre part encore en suspens.\n\n#weak Et c’est bien une promesse : le couple honoré est fiancé, vous devenez l’hôte promis, et organiser la fête comme la payer reste votre affaire. Laissez la promesse expirer, et la parole rompue se retient.#!"
 tnt_err_grand_taken:0 "Un grand mariage est déjà promis dans ce traité. Décochez-le d’abord dans le panneau de mariage du traité : un traité, une fête, un couple honoré."
 tnt_intro_title:0 "L’art du traité"
 tnt_intro_desc_main:0 "Une nouvelle est partie de votre chancellerie : cette cour négocie désormais à la mode nouvelle. Tout dirigeant peut être appelé à la table — l’or pesé contre la fidélité, une épouse contre une trêve, une faveur contre une couronne — et chaque clause est posée sur une seule paire de balances, la même pour les deux parties.\n\n"
 tnt_intro_desc_rate_normal:0 "Attendez-vous à des ambassades de loin en loin : pas plus d’une lettre par an ne vous trouvera, du monde entier réuni, et un dirigeant dont vous avez eu des nouvelles rumine quelque trois ans avant d’écrire de nouveau."
 tnt_intro_desc_rate_frequent:0 "Attendez-vous à voir la route de vos portes bien fréquentée : à peine une demi-année passera entre une ambassade et la suivante, et les dirigeants reviennent à vous dans l’année."
 tnt_intro_desc_rate_rare:0 "Attendez-vous à de longs silences : des années passeront entre deux lettres, et c’est surtout à vous qu’il reviendra de demander."
 tnt_intro_desc_rate_off:0 "Aucune lettre ne viendra : vos portes sont closes aux ambassades, et toute négociation commencera par vous."
 tnt_intro_desc_rate_test:0 "Les courriers ont reçu l’ordre de courir, non de chevaucher : une offre devrait vous trouver en quelques mois. Un rythme d’essai, non un rythme de cour."
 tnt_intro_desc_world_rare:0 " Au-delà de vos frontières, les mêmes balances servent en silence : de temps à autre deux cours concluent un marché de leur côté, et la nouvelle vous en parvient lorsqu’elle vous touche."
 tnt_intro_desc_world_common:0 " Au-delà de vos frontières, les mêmes balances s’agitent sans relâche : les cours étrangères concluent leurs propres marchés toute l’année."
 tnt_intro_desc_world_off:0 " Au-delà de vos frontières, l’ancienne manière subsiste : la mode nouvelle ne se pratique qu’aux tables où vous siégez vous-même."
 tnt_intro_desc_close:0 "\n\nPour appeler vous-même un dirigeant à la table, faites un clic droit sur lui et choisissez #high Négocier un traité#!."
 tnt_intro_opt_ok:0 "À la table, donc."

