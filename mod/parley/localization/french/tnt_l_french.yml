 tnt_stepper_hook_tt:0 "#weak Clic gauche : une faveur plus forte. Clic droit : une plus faible.#!\n\n#weak Une faveur ne peut pas dépasser le degré nul tant que la partie qui la recevrait détient déjà un hameçon sur celle qui la devrait.#!"
 tnt_err_hook_taken_p:0 "Le partenaire détient déjà une faveur sur vous, et une seconde ne peut être promise avant que celle-là soit dépensée."
 tnt_err_hook_taken_r:0 "Vous détenez déjà une faveur sur le partenaire, et une seconde ne peut être promise avant que celle-là soit dépensée."
 tnt_picker_title_contract:0 "Les termes de la fidélité"
 tnt_btn_edit_contract:0 "Amender les termes du serment."
 tnt_ob_note_p:0 "#high Vous#! êtes celui qui met genou à terre. Chaque terme ci-dessous vous lie, vous et vos héritiers."
 tnt_ob_note_r:0 "#high Le partenaire#! est celui qui met genou à terre. Chaque terme ci-dessous le lie, lui et ses héritiers."
 tnt_ob_note_none:0 "Aucun serment n’est encore sur la table. Activez #high Jurer fidélité#! dans l’une ou l’autre colonne, et les termes de ce serment seront vôtres à écrire : impôts, levées, et les droits que le sujet conserve."
 tnt_ob_note_gov:0 "Cette forme de gouvernement n’a pas de [vassal_contract|E] négociable : seul un sujet féodal apporte à la table des impôts, des levées et des droits."
 tnt_ob_reset_btn:0 "Serment simple"
 tnt_ob_reset_tt:0 "Ramener chaque terme au serment de fidélité nu : impôts ordinaires, levées ordinaires, et aucun des droits ci-dessous."
 tnt_ob_total_label:0 "Ces termes valent"
 tnt_ctx_contract:0 "Termes de la fidélité : [GetPlayer.MakeScope.ScriptValue('tnt_ob_changed_value')|0] modifiés, pour [GetPlayer.MakeScope.ScriptValue('tnt_ob_sheet_total_value')|0]"
 tnt_ob_group_obligations:0 "Ce que le sujet doit"
 tnt_ob_group_obligations_tt:0 "Les deux obligations qui viennent avec le serment lui-même, allant chacune de rien du tout à exorbitant.\n\n#weak Toutes deux se tiennent au milieu tant que vous n’y touchez pas, et le milieu est ce que dit un [vassal_contract|E] ordinaire.#!"
 tnt_ob_group_rights:0 "Ce que le sujet conserve"
 tnt_ob_group_rights_tt:0 "Les droits que le seigneur lige abandonne, une clause à la fois.\n\n#weak Aucun n’appartient à un serment ordinaire : chaque sceau ci-dessous est donc une concession, sauf le dernier, où le seigneur lige prend au lieu de donner.#!"
 tnt_ob_status_default:0 "Un serment ordinaire : rien de modifié."
 tnt_ob_status_changed:0 "Modifiés : #high [GetPlayer.MakeScope.ScriptValue('tnt_ob_changed_value')|0]#! termes sur neuf."
 tnt_ob_tax_label:0 "Impôts"
 tnt_ob_tax_desc:0 "La part de ses revenus que le sujet remet chaque mois à son seigneur lige.\n\n#weak Descendez l’échelle et le sujet garde davantage, ce qui est un cadeau à celui qui met genou à terre ; montez-la et le seigneur lige prend davantage. Un serment de fidélité simple se tient au milieu.#!"
 tnt_ob_tax_step_tt:0 "#weak Clic gauche : un cran. Clic droit : jusqu’au bout.#!"
 tnt_ob_tax_lvl0:0 "[GetSubjectContractType( 'feudal_government_taxes' ).GetObligationNameShortNoTooltip( 'feudal_tax_exempt' )]"
 tnt_ob_tax_lvl1:0 "[GetSubjectContractType( 'feudal_government_taxes' ).GetObligationNameShortNoTooltip( 'feudal_tax_low' )]"
 tnt_ob_tax_lvl2:0 "[GetSubjectContractType( 'feudal_government_taxes' ).GetObligationNameShortNoTooltip( 'feudal_tax_normal' )]"
 tnt_ob_tax_lvl3:0 "[GetSubjectContractType( 'feudal_government_taxes' ).GetObligationNameShortNoTooltip( 'feudal_tax_high' )]"
 tnt_ob_tax_lvl4:0 "[GetSubjectContractType( 'feudal_government_taxes' ).GetObligationNameShortNoTooltip( 'feudal_tax_extortionate' )]"
 tnt_ob_levy_label:0 "Levées"
 tnt_ob_levy_desc:0 "Le nombre de levées du sujet que le seigneur lige peut appeler.\n\n#weak Descendez l’échelle et le sujet garde ses hommes chez lui ; montez-la et le seigneur lige les convoque. Un serment de fidélité simple se tient au milieu.#!"
 tnt_ob_levy_step_tt:0 "#weak Clic gauche : un cran. Clic droit : jusqu’au bout.#!"
 tnt_ob_levy_lvl0:0 "[GetSubjectContractType( 'feudal_government_levies' ).GetObligationNameShortNoTooltip( 'feudal_levies_exempt' )]"
 tnt_ob_levy_lvl1:0 "[GetSubjectContractType( 'feudal_government_levies' ).GetObligationNameShortNoTooltip( 'feudal_levies_low' )]"
 tnt_ob_levy_lvl2:0 "[GetSubjectContractType( 'feudal_government_levies' ).GetObligationNameShortNoTooltip( 'feudal_levies_normal' )]"
 tnt_ob_levy_lvl3:0 "[GetSubjectContractType( 'feudal_government_levies' ).GetObligationNameShortNoTooltip( 'feudal_levies_high' )]"
 tnt_ob_levy_lvl4:0 "[GetSubjectContractType( 'feudal_government_levies' ).GetObligationNameShortNoTooltip( 'feudal_levies_extortionate' )]"
 tnt_ob_relig_label:0 "Protection religieuse"
 tnt_ob_relig_desc:0 "Le sujet peut garder sa propre foi en paix : #high +5#! d’opinion envers son seigneur lige, #high +5#! d’opinion dans ses propres comtés, et il ne peut jamais être persécuté pour ce qu’il croit.\n\n#weak Le droit le plus précieux de cette feuille, et il ne vaut rien si vous suivez tous deux la même foi.#!"
 tnt_ob_council_label:0 "Siège garanti au conseil"
 tnt_ob_council_desc:0 "Le sujet peut exiger un siège au conseil de son seigneur lige et ne peut se le voir refuser : #high +5#! d’opinion envers son seigneur lige.\n\n#weak Cela coûte au seigneur lige 2 d’opinion auprès de ses vassaux puissants, qui voient d’un mauvais œil un siège promis d’avance.#!"
 tnt_ob_revoke_label:0 "Titres non révocables"
 tnt_ob_revoke_desc:0 "Le seigneur lige renonce au droit de retirer ses titres au sujet : #high +5#! d’opinion envers son seigneur lige.\n\n#weak Ce que le seigneur lige abandonne ici, c’est l’instrument ordinaire de la discipline.#!"
 tnt_ob_war_label:0 "Peut déclarer la guerre librement"
 tnt_ob_war_desc:0 "Le sujet n’est plus tenu par les règles de son seigneur lige en matière de guerre : #high +5#! d’opinion envers son seigneur lige.\n\n#weak Les guerres ainsi commencées restent au sujet à gagner ou à perdre.#!"
 tnt_ob_fort_label:0 "Droits de fortification"
 tnt_ob_fort_desc:0 "Le sujet bâtit des châteaux à moindre coût et tient chaque fort d’un niveau plus haut.\n\n#weak Cela coûte au seigneur lige un dixième de l’impôt que ce contrat rapporte, et exige que la [culture|E] du seigneur lige ait débloqué #high $innovation_battlements$#!.#!"
 tnt_ob_coin_label:0 "Droit de battre monnaie"
 tnt_ob_coin_desc:0 "Le sujet bat sa propre monnaie : #high +0.3#! de [development|E] mensuel dans son [county|E] de capitale.\n\n#weak Le seigneur lige y perd 2 % de sa propre croissance de développement, et cela exige que la [culture|E] du seigneur lige ait débloqué #high $innovation_currency_02$#!.#!"
 tnt_ob_succ_label:0 "Partage forcé"
 tnt_ob_succ_desc:0 "#N Ce terme favorise le seigneur lige, non le sujet.#! Le sujet est enfermé dans la succession par partage et ne pourra jamais en sortir par la loi : #high -5#! d’opinion envers son seigneur lige.\n\n#weak Le cocher déplace la balance dans l’autre sens : c’est une chose que vous prenez, non que vous donnez.#!"
 tnt_ob_req_feudal:0 "Seul un sujet féodal a des impôts, des levées et des droits à négocier : activez d’abord #high Jurer fidélité#! dans l’une des deux colonnes."
 tnt_ob_req_relig:0 "Il faut que vous ne suiviez pas la même foi pour que cela protège quoi que ce soit."
 tnt_ob_req_fort:0 "La culture du seigneur lige doit avoir débloqué l’innovation #high $innovation_battlements$#!."
 tnt_ob_req_coin:0 "La culture du seigneur lige doit avoir débloqué l’innovation #high $innovation_currency_02$#!."
 tnt_ob_req_succ:0 "Le sujet doit pouvoir tenir la succession #high $confederate_partition_succession_law$#!."
 tnt_ob_req_revoke:0 "Pas tant que la foi du seigneur lige taxe les fidèles d’une autre foi et que vous ne partagez pas la même."
 tnt_ob_tt_tax_exempt:0 "Le [vassal_contract|E] commence avec [GetSubjectContractType( 'feudal_government_taxes' ).GetObligationName( 'feudal_tax_exempt' )]"
 tnt_ob_tt_tax_extortionate:0 "Le [vassal_contract|E] commence avec [GetSubjectContractType( 'feudal_government_taxes' ).GetObligationName( 'feudal_tax_extortionate' )]"
 tnt_ob_tt_levy_exempt:0 "Le [vassal_contract|E] commence avec [GetSubjectContractType( 'feudal_government_levies' ).GetObligationName( 'feudal_levies_exempt' )]"
 tnt_ob_tt_levy_extortionate:0 "Le [vassal_contract|E] commence avec [GetSubjectContractType( 'feudal_government_levies' ).GetObligationName( 'feudal_levies_extortionate' )]"
 tnt_ob_tt_council:0 "Le [vassal_contract|E] commence avec [GetSubjectContractType( 'council_rights' ).GetObligationName( 'council_rights_guaranteed' )]"
 tnt_ob_tt_revoke:0 "Le [vassal_contract|E] commence avec [GetSubjectContractType( 'title_revocation_rights' ).GetObligationName( 'title_revocation_rights_protected' )]"
 tnt_ob_tt_war:0 "Le [vassal_contract|E] commence avec [GetSubjectContractType( 'war_declaration_rights' ).GetObligationName( 'war_declaration_rights_allowed' )]"
 tnt_ob_tt_fort:0 "Le [vassal_contract|E] commence avec [GetSubjectContractType( 'fortification_rights' ).GetObligationName( 'fortification_rights_granted' )]"
 tnt_ob_tt_coin:0 "Le [vassal_contract|E] commence avec [GetSubjectContractType( 'coinage_rights' ).GetObligationName( 'coinage_rights_granted' )]"
