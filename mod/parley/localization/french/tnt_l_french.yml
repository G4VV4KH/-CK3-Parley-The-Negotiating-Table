 tnt_wed_row_line_matri:0 "[matrilineal|E]"
 tnt_wed_row_line_patri:0 "[patrilineal|E]"
 tnt_wed_row_line_tip:0 "La maison dans laquelle naîtront les enfants de ce couple. Cliquez pour changer : #high [patrilineal|E]#! les donne à la maison du père, #high [matrilineal|E]#! à celle de la mère.\n\n#weak Chaque couple du traité porte sa propre lignée, et c’est aussi la lignée qui décide si vous pouvez accueillir leur grand mariage.#!"
 tnt_wed_taper:0 "Chaque couple après le premier vaut au partenaire un peu moins que le précédent, tandis que ce qu’une union lui #high coûte#! — un héritier cédé, une lignée abandonnée — ne connaît aucune remise.\n\nTrois couples valent environ #high 2.7#! unions isolées ; un cinquième n’ajoute que #high 0.6#!, et au-delà le gain cesse tout à fait de croître.\n\n#weak Deux ou trois bonnes unions valent donc mieux qu’une douzaine d’unions de remplissage.#!"
 tnt_wed_grand:0 "Promettre un grand mariage"
 tnt_wed_grand_desc:0 "Donner votre parole de célébrer l’une de ces unions par une grande fête. #high Le couple honoré est fiancé plutôt que marié#!, et l’autre partie estime l’union bien davantage pour l’honneur qui s’y attache.\n\nCe que vous prenez sur vous : vous devenez l’hôte promis, et votre parole ne court que quelques années. #high Organiser la noce, convoquer les invités et tout payer reste votre affaire#! : rien n’est prévu à votre place, et jusque-là les deux ne sont que fiancés. Laissez la promesse expirer, et la parole rompue ne sera pas oubliée.\n\n#weak Un seul couple par traité peut être honoré, il doit être de votre propre parenté, et la lignée dominante doit être la vôtre.#!"
 tnt_wed_grand_couple:0 "Un grand mariage est promis à [GetPlayer.MakeScope.Var('tnt_wed_principal').Char.GetShortUIName] et [GetPlayer.MakeScope.Var('tnt_wed_principal').Char.MakeScope.Var('tnt_wed_partner').Char.GetShortUIName]"
