 tnt_action_can_lean_on:0 "@dread_icon! L’avantage est de votre côté"
 tnt_action_can_lean_on_label:0 "@dread_icon! Vous pouvez faire pression sur [recipient.GetPrimaryTitle.Custom('GetTierIcon')][recipient.GetUINameNoTooltip]"
 tnt_action_can_lean_on_desc:0 "[recipient.GetUIName] : vous pouvez faire pression sur lui — votre armée, votre nom et votre redoutabilité, chacun mesuré au sien, atteignent le poids qu’exige une menace, et il a oublié votre dernière menace. Posez la menace sur la table et ce même poids s’ajoute à ce qu’il est prêt à supporter : il paiera davantage pour en finir."
 tnt_action_can_lean_on_click:0 "#I Cliquer pour négocier un traité#!"
