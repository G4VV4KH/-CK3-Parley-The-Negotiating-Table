 rule_tnt_trade_prestige:0 "Parley：威望交易"
 setting_tnt_trade_prestige_on:0 "可用"
 setting_tnt_trade_prestige_on_desc:0 "可以向任何统治者提出或索取威望。玩家与AI遵守相同规则。"
 setting_tnt_trade_prestige_faith:0 "仅限同一信仰"
 setting_tnt_trade_prestige_faith_desc:0 "威望只能在同一信仰的统治者之间转移。仅仅同属一个宗教并不足够。玩家与AI遵守相同规则。"
 setting_tnt_trade_prestige_lower:0 "仅限较低威望等级"
 setting_tnt_trade_prestige_lower_desc:0 "威望只能从威望等级严格更高的统治者转移给等级更低的统治者。等级相同时禁止转移；持有的威望点数不影响判定。玩家与AI遵守相同规则。"
 setting_tnt_trade_prestige_peer:0 "仅限同级及以下"
 setting_tnt_trade_prestige_peer_desc:0 "只有给予者的威望等级不低于接收者时，才可转移威望。反方向单独判定。玩家与AI遵守相同规则。"
 setting_tnt_trade_prestige_off:0 "禁用"
 setting_tnt_trade_prestige_off_desc:0 "玩家与AI均不能交易威望。其他资源不受影响。"
 rule_tnt_trade_piety:0 "Parley：虔诚交易"
 setting_tnt_trade_piety_on:0 "可用"
 setting_tnt_trade_piety_on_desc:0 "可以向任何统治者提出或索取虔诚。玩家与AI遵守相同规则。"
 setting_tnt_trade_piety_faith:0 "仅限同一信仰"
 setting_tnt_trade_piety_faith_desc:0 "虔诚只能在同一信仰的统治者之间转移。仅仅同属一个宗教并不足够。玩家与AI遵守相同规则。"
 setting_tnt_trade_piety_faith_lower:0 "同信仰且奉献等级较低"
 setting_tnt_trade_piety_faith_lower_desc:0 "虔诚只能在同一信仰的统治者之间转移，且给予者的奉献等级必须严格高于接受者。等级相同时不可转移。比较的是奉献等级，而非当前虔诚点数；以实际转移方向为准，与谁发起谈判无关。玩家与AI遵守相同规则。"
 setting_tnt_trade_piety_different_faith:0 "仅限不同信仰"
 setting_tnt_trade_piety_different_faith_desc:0 "虔诚只能在不同信仰的统治者之间转移，包括同一宗教内的不同信仰。玩家与AI遵守相同规则。"
 setting_tnt_trade_piety_religion:0 "仅限同一宗教"
 setting_tnt_trade_piety_religion_desc:0 "同一宗教的统治者之间可以转移虔诚，即使他们信仰不同。玩家与AI遵守相同规则。"
 setting_tnt_trade_piety_off:0 "禁用"
 setting_tnt_trade_piety_off_desc:0 "玩家与AI均不能交易虔诚。其他资源不受影响。"
