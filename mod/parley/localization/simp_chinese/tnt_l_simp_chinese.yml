 tnt_ai_offer_row_prisoners_p:0 "对方要你从地牢中释放他的亲族与封臣"
 tnt_ai_offer_row_title_p:0 "对方想买下你的土地——已在下方点明（头衔：[GetPlayer.MakeScope.ScriptValue('tnt_count_sel_title_p_value')|0]）"
 tnt_ai_offer_row_title_r:0 "对方向你出让他的土地——已在下方点明（头衔：[GetPlayer.MakeScope.ScriptValue('tnt_count_sel_title_r_value')|0]）"
 tnt_ai_offer_row_claim_r:0 "对方向你出让对其土地的宣称——已在下方点明（已选：[GetPlayer.MakeScope.ScriptValue('tnt_count_sel_claim_r_value')|0]）"
 tnt_ai_offer_row_artifact_r:0 "对方从自己的厅堂中拿出珍宝——已在下方点明（已选：[GetPlayer.MakeScope.ScriptValue('tnt_count_sel_artifact_r_value')|0]）"
 tnt_ai_offer_row_vassal_r:0 "对方愿意宣誓效忠，成为你的封臣"
 tnt_ai_offer_row_ward_r:0 "对方愿将其孩子[GetPlayer.MakeScope.Var('tnt_ward_r').Char.GetUINameNoTooltip]送到你的宫廷中抚养"
 tnt_ai_offer_row_indep_p:0 "对方请你解除他的效忠"
 tnt_ai_offer_row_hostage_r:0 "对方把其亲族[GetPlayer.MakeScope.Var('tnt_hostage_r').Char.GetUINameNoTooltip]送交你处充作人质"
 tnt_ai_offer_row_courtier_p:0 "对方想把你宫廷中的一人收入麾下——已在下方点明（已选：[GetPlayer.MakeScope.ScriptValue('tnt_count_sel_courtier_p_value')|0]）"
 tnt_ai_offer_row_contract:0 "他所希望写定的效忠契约（已改动条款：[GetPlayer.MakeScope.ScriptValue('tnt_ob_changed_value')|0]）："
 tnt_ai_offer_row_marriage:0 "两家之间提议的婚事："
 tnt_ai_offer_row_usehook_r:0 "对方正在索还你欠下的[hook_i]人情"
 tnt_ai_offer_row_word_kept:0 "对方对这笔交易已不再热心，但既然是他提出的，他就会守约"
 tnt_ai_gift_line:0 "出于敬重而送来：这些条款的价值高于所索求的回报。这封信是一份刻意为之的馈赠。"
 tnt_refuse_envoys_decision:0 "不再接见使团"
 tnt_refuse_envoys_decision_desc:0 "消息悄悄沿着每一条道路、传入每一处港口：这座宫廷不再听取递送条约的人。有提议的统治者，尽可自己留着。你自己的使节照旧出行——门是从里面闩上的，而门闩就在你手里。"
 tnt_refuse_envoys_decision_tooltip:0 "在你另行发话之前，不会再有统治者带着条约来找你。你自己发起的谈判不受影响。"
 tnt_refuse_envoys_decision_confirm:0 "闩上大门"
 tnt_refuse_envoys_decision_effect_tt:0 "在你撤回此决议之前，不会再有统治者带着条约来找你。"
 tnt_accept_envoys_decision:0 "重新接见使团"
 tnt_accept_envoys_decision_desc:0 "门闩取下，门卫奉命让开：递送条约的人可以再度被领进来，封印完好，他们的提议仍按一贯的那杆秤称量。"
 tnt_accept_envoys_decision_tooltip:0 "自今日起，携带条约的使团可以再度抵达你的宫廷。"
 tnt_accept_envoys_decision_confirm:0 "打开大门"
 tnt_accept_envoys_decision_effect_tt:0 "携带条约提议的使团可以再度抵达你的宫廷——即刻生效，而不必等旧日的沉默期满。"
 decision_group_type_tnt_uninstall:0 "模组移除决议"
 tnt_uninstall_decision:0 "撤去谈判桌"
 tnt_uninstall_decision_desc:0 "使节遣散，账册焚毁，桌子本身也被抬出了厅堂。请在移除本模组之前立刻采用此决议：它会把Parley在这个世界中留下的一切痕迹从存档里清扫干净。尚未答复的来信与尚未完成的谈判一概作废；已经缔结的每一份条约仍然有效。"
 tnt_uninstall_decision_tooltip:0 "为在没有Parley: The Negotiating Table的情况下继续游戏做好准备。移除本模组在世界上每一个角色身上写下的每一个变量、每一份牵制与每一项好感修正。已经完成的交易——婚姻、割让的头衔、效忠誓约——不受影响。"
 tnt_uninstall_decision_confirm:0 "清扫干净"
 tnt_uninstall_decision_effect_tt:0 "由Parley写下的每一个变量、列表、角色标记、牵制与好感修正，都会从世界上每一个角色身上移除。任何尚未答复的提议信件与尚未完成的谈判都会作废。保存游戏，然后再停用本模组：这份存档已经不含Parley的任何残留。"
 tnt_ai_msg_treaty:0 "一份条约已经签订"
 tnt_ai_msg_tt_truce:0 "他们用金钱买下了十年的和平。"
 tnt_ai_msg_tt_ally:0 "他们用金钱买下了一份军事同盟。"
 tnt_ai_msg_tt_hook:0 "其中一方现在欠另一方一份人情，是用金钱买来的。"
 tnt_ai_msg_tt_hookcall:0 "一笔债被讨走了：其中一方握有对另一方的[hook|E]，并以金钱收讫。"
 tnt_ai_msg_tt_ultimatum:0 "金钱只朝一个方向易手。二者之中较弱的一方付了钱，换得对方不来相扰。"
 tnt_ai_msg_tt_title:0 "土地以金钱易手：两位统治者中的一位从另一位手中买下了一个伯爵领。"
 tnt_ai_msg_tt_vassal:0 "一个领地屈膝了：较弱的统治者向较强者宣誓效忠，换取金钱与庇护。"
 tnt_ai_msg_tt_submission:0 "一个领地屈服于威胁：实力占绝对优势的统治者迫使较弱的独立邻国无偿宣誓效忠。"
 tnt_ai_msg_tt_artifact:0 "一件珍宝以金钱易手：两位统治者中的一位从另一位的厅堂里买走了一件器物。"
 tnt_ai_msg_tt_wed:0 "两个家族结为姻亲：两位统治者议定了各自亲族之间的一桩婚事，并附上了一份金钱嫁妆。"
 rule_tnt_ai_treaties:0 "Parley：AI之间的条约"
 setting_tnt_ai_treaties_off:0 "禁用"
 setting_tnt_ai_treaties_off_desc:0 "AI统治者绝不会背着你彼此缔结条约。\n\n#weak 完全没有开销：一年一次查询，此外再无工作。AI仍然可以与#high 你#!谈条件。#!"
 setting_tnt_ai_treaties_rare:0 "偶尔"
 setting_tnt_ai_treaties_rare_desc:0 "相邻的AI统治者偶尔会彼此达成交易——整张地图上一年大约寥寥数份条约。\n\n以此方式交易的有金钱、欠下的人情、索还的债、最后通牒与宝物；若双方本就交好，边境的伯爵领可能按足价出售，较弱的邻人也可能收钱宣誓效忠。实力占绝对优势的国王或皇帝也可以转而以威胁迫使较弱的独立邻国宣誓效忠。#high 家族之间的婚事同样会被悄然交易，事先不会征询任何人。#!只要条约牵涉到与你接壤、与你结盟或与你交战的人，你就会收到通报。"
 setting_tnt_ai_treaties_common:0 "频繁"
 setting_tnt_ai_treaties_common_desc:0 "约为“偶尔”的三倍，适合一张各处宫廷都在不停交谈的地图。\n\n可交易的条款相同，对每一位统治者同样有三年的间隔限制，因此不会失控。\n\n#weak 这是默认值。#!"
 rule_tnt_ai_offer_rate:0 "Parley：送到你手上的提议"
 setting_tnt_ai_offer_rate_off:0 "从不"
 setting_tnt_ai_offer_rate_off_desc:0 "不会有统治者带着自己的条约给你写信。\n\n#weak 你仍然可以自己与任何人开启谈判；若另一条规则允许，AI统治者之间也照旧往来。#!"
 setting_tnt_ai_offer_rate_rare:0 "稀少"
 setting_tnt_ai_offer_rate_rare_desc:0 "信件只是偶尔到来——两位使节之间要静上好几年。\n\n#weak 适合一场你更愿意自己开口去问的游戏。#!"
 setting_tnt_ai_offer_rate_normal:0 "普通"
 setting_tnt_ai_offer_rate_normal_desc:0 "邻人一年至多给你写一封信，而每一位统治者要等三年才会再拟一份提议。"
 setting_tnt_ai_offer_rate_frequent:0 "频繁"
 setting_tnt_ai_offer_rate_frequent_desc:0 "使节一年来访数次，统治者也会更快地重新把你放在心上。\n\n每一份提议仍按你在谈判窗口中看到的同一杆秤计价，因此地图更热闹并不意味着更慷慨。\n\n#weak 这是默认值。#!"
 setting_tnt_ai_offer_rate_test:0 "测试——极其频繁"
 setting_tnt_ai_offer_rate_test_desc:0 "#N 用于测试模组，不适合正常游玩。#!等待期被压缩到几周，因此开局数月之内就应当有提议送到你手上。\n\n#weak 用它确认信件功能正常，然后把规则调回“频繁”。#!"
 rule_tnt_ai_telemetry:0 "Parley：诊断日志"
 setting_tnt_ai_telemetry_off:0 "关闭"
 setting_tnt_ai_telemetry_off_desc:0 "不记录任何诊断日志，正常游玩就该如此。\n\n#weak 这是默认值，且没有任何开销：本该写一行日志的地方，只做一次规则查询。#!"
 setting_tnt_ai_telemetry_on:0 "开启"
 setting_tnt_ai_telemetry_on_desc:0 "AI统治者关于条约做出的每一个决定，都会在#high error.log#!中写下一行：它考虑了谁、往桌上放了什么、把这笔交易定价为多少，以及#high 它为何走开#!。\n\n每半个游戏年约600至1600行。游戏体验不会受到任何影响。\n\n#weak 在一次长时间无人看管的运行之前打开它，随后把日志送去查阅。#!"
 setting_tnt_ai_telemetry_verbose:0 "详细"
 setting_tnt_ai_telemetry_verbose_desc:0 "与“开启”相同，另外每一位AI统治者每年在AI之间掷骰之前再记一行。\n\n会多出数千行。它换来的唯一好处，是能分清#high 脉冲从未运行#!与#high 运行了但骰子说不#!。\n\n#weak 仅用于一次简短的验证运行。#!"
 rule_tnt_threat_frequency:0 "Parley：威胁频率"
 setting_tnt_threat_frequency_unlimited:0 "0年"
 setting_tnt_threat_frequency_unlimited_desc:0 "对不同统治者发出威胁之间没有额外冷却时间。默认设置。原有的15年内不得再次威胁同一统治者的限制仍对玩家和AI生效。"
 setting_tnt_threat_frequency_1_year:0 "1年"
 setting_tnt_threat_frequency_1_year_desc:0 "使用威胁后，该统治者在1年内无法威胁任何人。玩家与AI适用相同规则。原有的15年内不得再次威胁同一统治者的限制也予以保留。"
 setting_tnt_threat_frequency_5_years:0 "5年"
 setting_tnt_threat_frequency_5_years_desc:0 "使用威胁后，该统治者在5年内无法威胁任何人。玩家与AI适用相同规则。原有的15年内不得再次威胁同一统治者的限制也予以保留。"
 setting_tnt_threat_frequency_10_years:0 "10年"
 setting_tnt_threat_frequency_10_years_desc:0 "使用威胁后，该统治者在10年内无法威胁任何人。玩家与AI适用相同规则。原有的15年内不得再次威胁同一统治者的限制也予以保留。"
 tnt_err_threat_cooldown:0 "你最近已使用过威胁，在威胁冷却时间结束前无法威胁任何人。"
 rule_tnt_threat_scale:0 "Parley：威胁强度"
 setting_tnt_threat_scale_rare:0 "弱"
 setting_tnt_threat_scale_rare_desc:0 "系数N = 2.5。任何威胁都需要#high 至少100点交易分数#!。威望与恐怖相同时，所需兵力比为41:1。\n\n#weak 更高的威望与恐怖会降低所需的兵力优势。威望等级比目标低整整一级时，威胁的分值归零。玩家与AI适用相同规则。#!"
 setting_tnt_threat_scale_normal:0 "标准"
 setting_tnt_threat_scale_normal_desc:0 "系数N = 5。任何威胁都需要#high 至少100点交易分数#!。威望与恐怖相同时，最低兵力比为#high 21:1#!。\n\n更高的威望与恐怖会降低所需的兵力优势。威望等级比目标低整整一级时，威胁的分值归零。\n\n#weak 默认设置。玩家与AI适用相同规则。#!"
 setting_tnt_threat_scale_frequent:0 "强"
 setting_tnt_threat_scale_frequent_desc:0 "系数N = 7.5。任何威胁仍然需要#high 至少100点交易分数#!。\n\n#weak 更高的威望与恐怖会降低所需的兵力优势。威望等级比目标低整整一级时，威胁的分值归零。玩家与AI适用相同规则。#!"
 setting_tnt_threat_scale_constant:0 "很强"
 setting_tnt_threat_scale_constant_desc:0 "系数N = 10。任何威胁都需要#high 至少100点交易分数#!。威望与恐怖相同时，最低兵力比为#high 11:1#!。\n\n#weak 更高的威望与恐怖会降低所需的兵力优势。威望等级比目标低整整一级时，威胁的分值归零。玩家与AI适用相同规则。#!"
 tnt_mutual_header:0 "你们二人之间"
 tnt_bd_domain_p:0 "超出对方直辖上限的头衔：对他价值更低"
 tnt_bd_domain_r:0 "超出你直辖上限的头衔：对你价值更低"
 tnt_tt_step_huge_add:0 "一次加上一大笔。\n\n#weak 金钱、威望与虔诚：每次点击1000。影响力：250，因为影响力本身从不超过1000。#!"
 tnt_tt_step_huge_sub:0 "一次减去一大笔。\n\n#weak 金钱、威望与虔诚：每次点击1000。影响力：250，因为影响力本身从不超过1000。#!"
 tnt_preset_open:0 "…"
 tnt_tt_preset_open:0 "一键设定数额。\n\n#weak 惯例的数额、手上所有的一半、力所能及的全部，或者干脆不给。#!"
 tnt_preset_menu_header:0 "给多少？"
 tnt_preset_std_gold:0 "一年的收入"
 tnt_preset_std_gift:0 "惯例的馈赠"
 tnt_preset_half:0 "一半"
 tnt_preset_max:0 "我力所能及的全部"
 tnt_preset_max_r:0 "对方力所能及的全部"
 tnt_preset_none:0 "不给"
 tnt_tt_preset_std_gold:0 "提出一年的收入。\n\n#weak 以国库中实际拥有的数额为上限。#!"
 tnt_tt_preset_std_gift:0 "提出这般大小的人情所对应的惯例数额——一位这种身份的统治者所期待的数目。\n\n#weak 以实际持有的数额为上限。威望、虔诚与影响力没有年收入，因此并不存在“一年的量”可供提出。#!"
 tnt_tt_preset_half:0 "提出手上所有的一半。"
 tnt_tt_preset_max:0 "提出力所能及的全部。"
 tnt_tt_preset_none:0 "把这项通货从桌上撤下。"
 tnt_autobalance_btn:0 "自动配平"
 tnt_tt_autobalance:0 "调整桌上的金钱、威望、虔诚与影响力，直到这份提议恰好为对方所能接受。\n\n它双向起作用：既会为对方本会拒绝的提议加码，也会#high 削减对方过于轻易就会接受的提议#!，使你永不多付。\n\n#weak 它不会添加别的东西——不加土地、不加宣称、不加婚事、不加人情——也绝不会开出实际付不出的数额。#!"
 tnt_ab_state_balanced:0 "#P 已配平。#!这份提议现在恰好落在对方会接受的范围之内。"
 tnt_ab_state_minimal:0 "已经是最低限度，无需改动。"
 tnt_ab_state_unreachable:0 "#N 力所不及。#!纵使你付出所能付出的一切，对方仍然拒绝。"
 tnt_ab_state_closest:0 "提议可以接受。自动平衡无法用可用资源将评分恰好调整为+1。"
 tnt_ab_lumpy_hint:0 "再按一次可以继续添加。此按钮添加过而又被你移除的任何东西，都不会再次提出。"
 tnt_ab_lumpy_line:0 "对方的钱袋已空，因此上一次按下改从他那一侧取走条款：土地、宣称，或者他的效忠。"
 tnt_stage_marriage_interaction:0 "为条约添加一桩婚配"
 tnt_stage_marriage_send:0 "把这桩婚配加入条约"
 tnt_stage_marriage_prompt:0 "#high 足够亲近的联姻，如今会连同盟一起带来#!——与游戏为自己安排的婚姻所给的同盟相同，就在条约用印的那一天。"
 tnt_stage_no_alliance_tt:0 "#high 写进这份条约的婚配，如今会缔结同盟。#!这是游戏自己的规矩，而非本模组的规矩：游戏会衡量二人各自与交出他的那位统治者有多亲近，若双方都足够亲近，条约用印的那一刻你与他便结为同盟——与游戏自带的#high $arrange_marriage_interaction$#!一贯所为完全相同。这张桌上没有人购买[alliances|E]：条款清单上没有这样一项，将来也不会有；同盟只是随婚事一同到来。\n\n#weak 因此，游戏自己在本窗口画出的同盟迹象又可以相信了——每位人选旁那道「潜在同盟」强度条，以及紧挨着它的、戴着小王冠的纹章。它们都长在人选名单里，两幅肖像一经选定名单便随即离屏，所以当你读到这段话时，本页上已经一个都不剩；但紧接在本段之上印出的那句判词，正是在回答眼前这一对，而且那是游戏自己的答案，不是预测。#!\n\n#weak 同盟依托于这一对本身：他们的婚事延续多久，同盟便延续多久，婚事一断，同盟也随游戏自身的机制而断。若其中一人尚未成年，这一对便是订婚而非成婚，同盟从第一天起便立在这桩婚约之上。一份条约可以载有数对，每一对各自判定。#!"
 tnt_stage_alliance_opens_tt:0 "#high 这桩亲事会在你与他之间「缔结」同盟。#!那不是日后再去叩的门，而是同盟本身：就在条约用印的那一天，这两人成婚或订婚的那一刻。这是游戏自己的规矩，与它的#high $arrange_marriage_interaction$#!所遵循的完全相同：游戏会衡量二人各自与交出他的那位统治者有多亲近，而这一对在双方都足够亲近。你无需再做什么，他也无法拒绝——同盟随条约一同到来。\n\n#high 它值[SCOPE.ScriptValue('tnt_stage_alliance_offer_value')|+=0]条约点数，而这已经「包含」在上面为这桩亲事印出的数字之内。请勿再加一次。#!一份条约只为同盟付一次账：若桌上已有一对开启了同盟，这一对便不再增加代价，而是成为盟约所依托的第二个理由。"
 tnt_stage_alliance_shut_tt:0 "#high 这桩亲事不会缔结同盟。#!游戏会衡量二人各自与交出他的那位统治者有多亲近，把两段距离相加，只有这个和足够小的时候才允许同盟。两名廷臣之间的婚姻，与桌前任何一位都不结亲，所以这样一对谁也结不成同盟；从你自己厅堂里挑出的外人同样如此。把你自己的血脉嫁与他的血脉——子女、孙辈、兄弟姐妹、父母——或者你亲自站到祭坛前，这个和便落进游戏的限度之内。这与游戏自带的#high $arrange_marriage_interaction$#!所依据的规矩相同，而且是两边同时衡量：你这边选得再近，也补不上他那边选得太远。"
 tnt_stage_alliance_already_tt:0 "#high 你与他已是盟友，因此这桩亲事不会开启新的盟约。#!已经结下的盟约无法再结第二次：同盟不会在这桩亲事之上另加条约点数，条约也不会为此向你收取代价。若这两人的血脉足够亲近，合乎游戏自己的规矩，这桩婚事只会被记作你现有同盟所依托的又一个理由；若不够亲近，这段同盟便一如从前，分毫不改。无论哪一种，这桩亲事本身仍值上面印出的点数，你与他之间的盟约也不受触动。"
 actor_secondary_tnt_stage_marriage_interaction:0 "你方人选"
 recipient_secondary_tnt_stage_marriage_interaction:0 "对方人选"
 tnt_stage_pair_points_line:0 "这桩亲事会把条约推动[SCOPE.ScriptValue('tnt_stage_pair_deal_delta_value')|+=0]——把它摆上桌时，谈判窗口里的天平正是移动这么多。\n#weak 给予[SCOPE.ScriptValue('tnt_stage_pair_gain_value')|0]，索取[SCOPE.ScriptValue('tnt_stage_pair_loss_value')|0]，以及这桩亲事所缔结的同盟[SCOPE.ScriptValue('tnt_stage_alliance_offer_value')|+=0]。这三个数字「就是」上面那个数：同盟在其中，绝不另加。他把你所给之物按×[SCOPE.ScriptValue('tnt_deal_mult_value')|2]计价；若你许诺大婚，它值这份给予中的[SCOPE.ScriptValue('tnt_stage_grand_offer_value')|+=0]。#!\n#weak 条约里这一对「自己那一行」载的是另一个数：[SCOPE.ScriptValue('tnt_stage_pair_raw_net_value')|+=0]——不计他的好感、也不计同盟的亲事本身。两者皆真；天平显示的是第一个。#!\n#weak 同一条约中从第二桩亲事起，第一个数字只是「估算」，并非确切的变动量：数量折扣作用于整叠婚事，而大婚与你二人之间的威慑每份条约只付一次，却在每桩亲事的那一行里被重复计入。误差可达数十点，可能偏高也可能偏低。第一桩亲事时它是精确的。#!"
 tnt_stage_grand_info:0 "$GRAND_WEDDING_PROMISE_INFO$\n\n#high 为这一对带来[SCOPE.ScriptValue('tnt_stage_grand_offer_value')|+=0]条约点数#!，在婚事本身的价值之外另计。\n\n#weak 在你真正举办婚宴之前，这两人始终只是订婚。#high 同盟却不等这场婚宴#!——它自条约用印之日起便立在这桩婚约本身之上，婚约维持多久，同盟便维持多久。游戏自带的那条“未婚夫妻现在可以完婚”提示，对获得盛大婚礼承诺的一对刻意保持沉默——接手这对的是“举办盛大婚礼”提示，它会送到许下承诺的那个人手中。#!"
 tnt_stage_marriage_desc:0 "你正在为桌上的条约挑选一桩婚配。#high 你不是在送出婚姻提议。#!\n\n下方那个宽按钮上的字样是游戏自己写的#high “求婚”#!，此处无法更改。它既不向谁求婚，也不会让任何人成婚：它把这一对写进你正在谈判的条约里，与金钱、土地并列，条约的条款随即会连同这桩婚事一起重新计价。\n\n#high 在对方接受整份条约之前，没有人成婚，也没有人订婚。#!若条约被拒绝或被放弃，这桩婚配便等于从未发生。\n\n#weak 在双方家族中各选一人，定下子嗣所随的世系，然后确认。你想回来多少次都行——一份条约可以载有任意数目的配对。#!\n\n#weak 本窗口中游戏会给出它自己关于同盟的提示——#high 如今又可以相信它们了#!。写进条约的婚配，现在与游戏自带的#high $arrange_marriage_interaction$#!带来同一份同盟，而且依的是游戏自己的规矩：它衡量二人各自与交出他的那位统治者有多亲近，若双方都足够亲近，条约用印的那一刻你与他便结为同盟。#!\n\n#weak 你实际选定的这一对的判词就印在上方，那是游戏自己的答案，而非猜测——同一道检验既决定那句判词，也决定同盟本身。两名廷臣之间的婚事，依旧谁也结不成同盟。同盟依托于这一对：他们的婚事延续多久，同盟便延续多久；若其中一人尚未成年，它自第一天起便立在婚约之上。#!"
 tnt_btn_stage_marriage:0 "在经典界面上挑选婚配"
 tnt_btn_stage_marriage_full:0 "$tnt_item_marriage_desc$\n\n$tnt_btn_stage_marriage_tip$"
 tnt_btn_stage_marriage_tip:0 "打开游戏自带的婚姻界面：双方家族并排列出，全部筛选与搜索、两幅肖像，以及子嗣世系。\n\n#high 它不会让任何人成婚。#!你在那里确认的一对会被记入本条约，而成婚——或者订婚，若二人之中有一位尚未成年——只有在整份条约达成时才会发生。\n\n#weak 请留意游戏自己的用词：那个窗口里的宽按钮写着“求婚”。它不会向任何人求婚，只是把这一对加到此处。同样这两个人也可以在下方的名单中手动挑选，而那也是唯一能为已在条约中的一对改动世系的地方。#!"
 tnt_marriage_stage_note:0 "#weak 什么都不会送出，也没有人成婚——这一对只是被记入本条约。#!"
 tnt_err_grand_host:0 "你现在无法承诺大婚：这需要一位等级高于男爵的有地统治者、附带进阶活动的#high Tours & Tournaments#!、足够举办的金钱，并且你名下没有尚未兑现的承诺。\n\n#weak 而且这确实只是一个承诺：受此殊荣的一对先行订婚，你成为承诺中的东道主，筹办筵席与支付花费仍旧是你自己的事。若让承诺过期，失信之事会被人记住。#!"
 tnt_err_grand_taken:0 "本条约中已经承诺过一场大婚。请先在条约自己的婚姻面板中取消勾选——一份条约，一场筵席，一对受此殊荣的新人。"
 tnt_intro_title:0 "缔约之术"
 tnt_intro_desc_main:0 "你的文书院已经放出话去：此后这座宫廷按新的规矩谈判。任何统治者都可以被请到桌前——金钱可以与效忠相称，新娘可以与停战相称，人情可以与王冠相称——而每一项条款都放在同一杆秤上，双方共用这一杆秤。\n\n"
 tnt_intro_desc_rate_normal:0 "使团会时不时到来：全天下加在一起，一年之内至多有一封信找到你；而写过信的统治者要盘算三年左右才会再度提笔。"
 tnt_intro_desc_rate_frequent:0 "通往你城门的道路会被踏得很熟：两支使团之间难有半年之隔，统治者们不出一年就会重新想起你。"
 tnt_intro_desc_rate_rare:0 "沉默会很漫长：两封信之间要隔上数年，开口去问的事多半得由你自己来做。"
 tnt_intro_desc_rate_off:0 "不会有信件到来：你的城门对使团紧闭，一切谈判都得由你开头。"
 tnt_intro_desc_rate_test:0 "信使奉命奔跑而不是骑行：几个月之内就该有一份提议找到你。这是测试的节奏，不是宫廷的节奏。"
 tnt_intro_desc_world_rare:0 " 在你的边境之外，同一杆秤也在悄悄地用着：两座宫廷时不时会做成一笔自己的交易，而当它牵涉到你时，消息才会传到你耳中。"
 tnt_intro_desc_world_common:0 " 在你的边境之外，同一杆秤忙碌地摆动着：异邦的宫廷一年到头都在做成自己的交易。"
 tnt_intro_desc_world_off:0 " 在你的边境之外，旧规矩依然通行：新的规矩只在你亲自落座的桌上施行。"
 tnt_intro_desc_close:0 "\n\n要亲自把一位统治者请到桌前，请右键点击他，然后选择#high 商议条约#!。"
 tnt_intro_opt_ok:0 "那么，就到桌前来吧。"

