 tnt_ob_war_label:0 "可自由宣战"
 tnt_ob_war_desc:0 "臣属不再受其领主关于开战的规矩约束：对其领主的好感#high +5#!。\n\n#weak 由此发动的战争，胜负仍旧由臣属自己承担。#!"
 tnt_ob_fort_label:0 "筑城权"
 tnt_ob_fort_desc:0 "臣属修建城堡更为便宜，且每一座要塞的等级都高出一级。\n\n#weak 这会让领主损失本契约所得赋税的十分之一，并且需要领主的[culture|E]已经解锁#high $innovation_battlements$#!。#!"
 tnt_ob_coin_label:0 "铸币权"
