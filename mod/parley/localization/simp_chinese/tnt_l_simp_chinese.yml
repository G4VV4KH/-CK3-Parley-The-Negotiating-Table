 tnt_wed_taper:0 "第一对之后，每一对在对方眼中都比前一对略低一些，而一桩婚事让他#high 付出#!的代价——交出一位继承人、让出一条世系——却从不打折。\n\n三对大约相当于#high 2.7#!桩单独的婚事；第五对只增加#high 0.6#!，再往后收益便不再增长。\n\n#weak 所以两三桩好亲事胜过一打凑数的。#!"
 tnt_wed_grand:0 "承诺大婚"
 tnt_wed_grand_desc:0 "你以言为誓，将以一场盛大的筵席庆贺其中一桩婚事。#high 受此殊荣的一对是订婚而非成婚#!，而对方会因这份体面而看重这桩婚事得多。\n\n你所承担的：你成为承诺中的东道主，而你的诺言只有几年有效。#high 筹办婚礼、召集宾客、支付一切花费，仍旧是你自己的事#!——没有人替你安排，在你办成之前，这二人不过是订了婚而已。若让承诺过期，失信之事不会被人忘记。\n\n#weak 一份条约中只能有一对获此殊荣，且必须是你自己的亲族，主导世系也必须归你。#!"
