 tnt_bd_indep_p:0 "你方给出：脱离你的宗主权"
 tnt_bd_hostage_p:0 "你方给出：人质"
 tnt_bd_ward_p:0 "你方给出：交付抚养的孩童"
 tnt_bd_courtier_p:0 "你方给出：廷臣"
 tnt_bd_subject_p:0 "你方给出：自己的封臣"
