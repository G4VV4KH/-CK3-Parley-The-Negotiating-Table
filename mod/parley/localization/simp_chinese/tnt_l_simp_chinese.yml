 tnt_bd_prestige_p:0 "你方给出：威望"
 tnt_bd_piety_p:0 "你方给出：虔诚"
 tnt_bd_influence_p:0 "你方给出：影响力"
 tnt_bd_alliance_p:0 "这桩联姻带来的同盟"
