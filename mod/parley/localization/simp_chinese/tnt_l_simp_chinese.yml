 tnt_ob_council_label:0 "保证内阁席位"
 tnt_ob_council_desc:0 "臣属可以要求在其领主的内阁中占有一席，且不得被拒：对其领主的好感#high +5#!。\n\n#weak 这会让领主在强力封臣中损失2点好感，他们不满有席位被许了出去。#!"
 tnt_ob_revoke_label:0 "头衔不可剥夺"
