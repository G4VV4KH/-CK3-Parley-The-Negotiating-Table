 # is carried over from the english value unchanged.
 # The doctrine comments belong to the english and russian files and are
 # deliberately NOT duplicated here.
 # Encoding: UTF-8 WITH BOM, LF endings, one trailing newline.
 # =====================================================================
 tnt_open_negotiations:0 "商议条约"
 tnt_open_negotiations_desc:0 "派遣使节前往[recipient.GetShortUIName]处，把一份完整的条约摆上谈判桌——所有条款，双方一并议定。[actor.Custom('TntThreatCooldownStatus')]"
 tnt_bd_floor_panel:0 "赠礼下限修正"
 tnt_threat_cooldown_status:0 "\n\n#high 威胁冷却#!\n剩余天数: [GetVarTimeRemaining(tnt_cooldown_actor.MakeScope, 'tnt_threat_cooldown')|0] (结束日期 [GetCurrentDateWithDiff(GetVarTimeRemaining(tnt_cooldown_actor.MakeScope, 'tnt_threat_cooldown'))])."
 tnt_threat_cooldown_short:0 "冷却: [GetVarTimeRemaining(tnt_cooldown_actor.MakeScope, 'tnt_threat_cooldown')|0]天"
 tnt_threat_cooldown_empty:0 ""
 tnt_open_negotiations_extra_icon:0 "@dread_icon! 你可以向他施压——兵力、威望与恐怖合在一起，已够上威胁所需的分量，上一次威胁也已被淡忘"
 tnt_window_title:0 "外交谈判"
 tnt_col_actor:0 "你方给出"
 tnt_col_partner:0 "对方给出"
 tnt_balance_header:0 "对方的答复"
 tnt_balance_accept:0 "#P 对方倾向于接受#!"
 tnt_balance_reject:0 "#N 对方倾向于拒绝#!"
 tnt_scale_note:0 "这个数字就是对方的答复：高于零，他就签字。每一项条款都按单独议定时的价值计价，而他对你的好感、信仰、亲缘以及他额外想要的东西，都已经算在里面。进度条是同一个答复的展开：一切促使他点头的因素，对抗一切促使他摇头的因素——所以条一旦越过中线，他就会同意。"
 tnt_label_points:0 "点"
 tnt_label_years:0 "#weak 为期10年#!"
 tnt_picker_empty:0 "#weak 没有可选之物#!"
 tnt_picker_empty_artifact:0 "#weak 这一方名下没有可以易手之物：王室礼器随其头衔而走，宗族旗帜留在宗族之内，本信仰的圣物只能交予同信者。#!"
 tnt_item_gold:0 "金钱"
 tnt_item_gold_desc:0 "自国库一次性支付[gold_i]，条约用印的那一刻即行交割。"
 tnt_item_prestige:0 "威望"
 tnt_item_prestige_desc:0 "[prestige_i] [prestige|E]，在谈判桌上许诺给对方。\n\n#weak 这并不是一只钱箱易手：给予方扣除，接受方获得，是两笔各自独立的记账，两者之间并无牵连。因此，按下“提议”的那一刻，若给予方手上没有足额，提议根本无法送出。#!"
 tnt_item_piety:0 "虔诚"
 tnt_item_piety_desc:0 "[piety_i] [piety|E]，在谈判桌上许诺给对方。\n\n#weak 同样是两笔各自独立的记账，而非一次转移：一方扣除多少，另一方便获得多少。按下“提议”的那一刻，若给予方手上没有足额，提议无法送出。#!"
 tnt_item_influence:0 "影响力"
 tnt_item_influence_desc:0 "[influence_i] [influence|E]，在谈判桌上许诺给对方。\n\n#weak [influence|E]只存在于以其运转的政体之下，因此只有当双方的政体都以其运转时，这两行才会出现——把它交给根本没有此项储备的统治者，等于什么也没做。此处同样是两笔各自独立的记账；按下“提议”的那一刻，若给予方手上没有足额，提议无法送出。#!"
 tnt_item_alliance:0 "军事同盟"
 tnt_err_ab_already_fair:0 "条约已经恰好停在#high +1#!，再无可配平之处"
 tnt_err_ab_empty:0 "桌上还没有可以配平的东西"
 tnt_threat_opinion:0 "曾威胁我"
 tnt_treaty_favor_opinion:0 "有利的条约"
 tnt_item_usehook_r:0 "对方索还你的人情"
 tnt_item_usehook_r_desc:0 "对方握有对你的[hook|E]，并且打算动用，因此指望条约把这一点算进去。\n\n#weak 这不是你能关掉的开关：筹码在他手里，不在你手里。它会让他索要高于公道价的条件：可以索还的人情为#high -45#!，若筹码达到勒索的分量则为#high -120#!。一旦签字，这笔债即被动用——弱牵制就此消失，强牵制则依然存在。#!\n\n#weak 拒绝不会付出别的代价，只是没有这份条约。#!"
 tnt_usehook_r_sub:0 "[Select_CString( GreaterThanOrEqualTo_CFixedPoint( GetPlayer.MakeScope.ScriptValue('tnt_usehook_r_strength_value'), '(CFixedPoint)2' ), Localize('tnt_usehook_strong'), Localize('tnt_usehook_weak') )]"
 tnt_bd_usehook_r:0 "对你索还的人情"
 tnt_item_usehook:0 "索还牵制"
 tnt_item_usehook_desc:0 "动用你已经握有的、对他的筹码。这与#high 授予牵制#!方向相反：那一项是把对你的人情交到他手里，这一项则是索回他欠你的人情。\n\n它对一个永远不会喜欢你的统治者同样奏效，因此其分量不受他对你好感的影响——这与你可能给他的一切都不同。\n\n#weak 你索还的[hook|E]值#high +45#!；勒索分量的筹码值#high +120#!。牵制能否留存由游戏本身裁定：弱牵制在条约签订时被用掉，强牵制则不会。它只在条约当真达成时才被动用——为一份从未成立的条约索还人情，等于白白扔掉一份人情。#!\n\n#weak 索还一笔旧债压在你身上，与威胁分毫不差。你自己的性情会评判这桩行径：有良心者会把它化作自己的#high 压力#!，而更冷酷的统治者反倒因终于动用了筹码而心中一松；是哪些特质作出了回应，会在使节动身之前的确认窗口中显示。#!"
 tnt_usehook_sub:0 "[Select_CString( GreaterThanOrEqualTo_CFixedPoint( GetPlayer.MakeScope.ScriptValue('tnt_usehook_strength_value'), '(CFixedPoint)2' ), Localize('tnt_usehook_strong'), Select_CString( GreaterThanOrEqualTo_CFixedPoint( GetPlayer.MakeScope.ScriptValue('tnt_usehook_strength_value'), '(CFixedPoint)1' ), Localize('tnt_usehook_weak'), Localize('tnt_usehook_none') ) )]"
 tnt_usehook_strong:0 "强牵制——动用之后依然存在"
 tnt_usehook_weak:0 "弱牵制——一经索还即被用掉"
 tnt_usehook_none:0 "你对他没有任何牵制"
 tnt_bd_usehook_p:0 "索还的牵制"
 tnt_err_usehook_none:0 "你对他没有可以动用的牵制"
 tnt_item_threat:0 "威胁对方"
 tnt_item_threat_desc:0 "让对方明白拒绝的代价。这不是宣战：没有立下任何誓言，也没有一兵一卒开拔。它只是压在桌上的分量，而且对一个永远不会喜欢你的统治者同样奏效——这正是金钱做不到的。\n\n它的分量取决于#high 你的兵力比他多出多少#!，再由#high 你的威望比他高出多少#!与#high 你的恐怖比他更甚多少#!抬高或压低。威望等级整整低他一级，便足以彻底关上这道威胁，纵有千军万马也无用——而开启威胁的那份分量，正是威胁随后为条约添在你这一边的分量。\n\n#weak 他会记住这件事。在威胁之下签订的条约会让你背上$tnt_threat_opinion$，#high -100#!好感，十五年内逐渐消退——而正因为他的好感决定了你所赠之物值多少，今日以恐惧夺取，就意味着此后一代人里你的金钱在他那里买得更少。付出代价的还不只是金钱：你自己的性情会评判这桩行径。有良心者会把这份重量化作自己的#high 压力#!，而更冷酷的统治者反倒因终于动用了筹码而心中一松。是哪些特质作出了回应，以及具体数字，都会在使节动身之前的确认窗口中显示。#!"
 tnt_threat_sub:0 "兵力[GetPlayer.MakeScope.ScriptValue('tnt_threat_ratio_value')|1]比1，威望×[GetPlayer.MakeScope.ScriptValue('tnt_threat_rep_term_value')|0]，恐怖×[GetPlayer.MakeScope.ScriptValue('tnt_threat_dread_term_value')|2]"
 tnt_bd_threat_p:0 "赤裸裸的施压"
 tnt_bd_threat_panel:0 "施压"
 tnt_err_threat_weak:0 "威胁需要通过军事实力、威望和恐怖获得至少100点交易分数。玩家与AI适用相同的最低要求。"
 tnt_err_threat_relation:0 "只能威胁既非你的盟友、又未与你建立人质关系的独立统治者"
 tnt_err_threat_unknown:0 "你的名号必须有些分量：威望等级须高于零"
 # tnt_err_threat_unafraid RETIRED round 8 (I2). This tombstone holds the line count so no .yml citation moves. ORPHANED 2026-08-24 BY THE RATIO RULING, KEPT DEFINED IN ALL NINE: tnt_err_threat_unknown above and tnt_err_threat_nofear below have ZERO rows - their rules are inside tnt_threat_points_value now. Law 9 and the law-10d control. DO NOT DELETE, DO NOT RE-USE FOR ANOTHER MEANING.
 tnt_err_threat_nofear:0 "他并不畏惧你：你的恐怖值须达到75，若对方并非无畏之人则须达到40，若对方受你统辖则须达到20"
 tnt_err_threat_recent:0 "他还记得你上一次的威胁。等这段记忆淡去，再对他施压"
 tnt_item_alliance_desc:0 "一份正式的同盟，由你们二人共同立誓——不是一方递给另一方的东西。此后任何一方都可以召唤对方参战，拒绝召唤则要付出[prestige|E]。\n\n#weak 一份盟约只占一行：要么在条约里，要么不在。#!\n\n#weak 若与你自己的[liege|E]或自己的[vassal|E]立誓，它便是一份长期盟约而非参战之约：游戏不允许领主与其封臣互相召唤，但同盟确实成立，在一切统计同盟的地方都算数，并且在你们之中一方离开另一方领地之后依然存续。#!\n\n#weak $tnt_tt_alliance_glut$#!"
 tnt_tt_alliance_glut:0 "你已有的每一份同盟，都会让下一份变得更便宜。自第二位盟友起——不计你自己的领主与你自己的封臣——每多一份现有同盟，一份新盟约在对方眼中的价值便减半；他自己的盟友对他也是一样。"
 tnt_item_truce:0 "互不侵犯协议"
 tnt_item_truce_desc:0 "你们二人共同订立的一份协议：#high 十年#!之内任何一方都不得向对方宣战。\n\n#weak 一份盟约只占一行：要么在条约里，要么不在。#!"
 tnt_item_marriage:0 "联姻"
 tnt_item_marriage_desc:0 "两个家族之间的婚配，而且#high 一份条约里想放多少对就放多少对#!。在双方各选一人，定下子嗣所随的世系，然后把这一对加入条约；若其中一人尚未成年，这一对便是订婚而非成婚。\n\n#weak 第一对之后，每一对在对方眼中都比前一对略低一些，而一桩婚事让他付出的代价却从不缩水——所以几桩好亲事胜过一打凑数的。要一个家族下嫁低于自身等级的门第，是要收费的，差距越大，收费越重。其中一对还可以获得大婚的承诺。#!\n\n#high 足够亲近的婚配，如今会连同盟一起带来#!，与游戏为自己安排的婚姻完全一样；而条约的价钱已经把这份同盟算了进去，所以能结成同盟的婚配，比结不成的更值钱。#weak 婚姻界面在人选旁画出的「潜在同盟」提示，如今又可以相信了。#!"
 tnt_item_title:0 "割让头衔"
 tnt_item_title_desc:0 "交出一个持有的伯爵级或以上头衔，连同其下的一切。\n\n#weak 一次想给多少个都行。都城与主头衔永远不会摆上桌。超出对方直辖所能承载的土地仍然是土地——他会照单全收，付足价钱，至于由此而来的重负，就让他自己的总管去操心。#!"
 tnt_item_claim:0 "授予宣称"
 tnt_item_claim_desc:0 "对给予方自己持有的头衔授予一份未曾主张的[claim|E]——这等于公开邀请一场未来的战争，是一项重大的让步。\n\n#weak 一次想给多少个都行。#!"
 tnt_item_prisoner_multi:0 "释放指定俘虏"
 tnt_item_prisoner_multi_desc:0 "只为你点名的俘虏打开地牢，其余不放。\n\n#weak 一名俘虏值多少，取决于他的等级与血统：任何人#high 10#!，若是对方的亲族则#high +15#!，若持有任何头衔则#high +10#!，头衔达到伯爵、公爵、国王或皇帝级别时依次#high +15 / +25 / +40 / +60#!。因此一位被俘的国王抵得上一打无名之辈——这正是要点名挑选的道理。#!\n\n#weak 只要在此处选了人，就会覆盖#high 释放囚犯#!：否则同一批人会被算两次价钱。#!"
 tnt_multi_count_prisoner_p:0 "已点名的俘虏：[GetPlayer.MakeScope.ScriptValue('tnt_count_sel_prisoner_p_value')|0]"
 tnt_sel_count_prisoner_p:0 "已点名：[GetPlayer.MakeScope.ScriptValue('tnt_count_sel_prisoner_p_value')|0]"
 tnt_picker_title_prisoner:0 "选择要释放的俘虏"
 tnt_item_prisoners:0 "释放囚犯"
 tnt_item_prisoners_desc:0 "释放方向对方所有以血缘或效忠相系的囚犯敞开地牢。"
 tnt_item_hook:0 "欠下人情"
 tnt_item_hook_desc:0 "欠对方一份[hook_i]人情。共有三种分量：#high 弱#!人情持续十年，第一次动用即被耗尽；#high 强#!人情持续二十年，可以反复动用，两次之间需间隔五年；#high 永恒#!人情永不失效、永不耗尽，两次动用之间同样间隔五年。\n\n#weak 左键点击提高分量，右键点击降低。若接受方已经握有对给予方的人情，便不能再许诺一份。#!"
 tnt_item_artifact:0 "宝物"
 tnt_item_artifact_desc:0 "从给予方自己的宝库中交出一件[artifact_i]宝物。\n\n#weak 一次想给多少件都行。游戏本身规定不得外流的物件不会列出：与头衔绑定的王室礼器、宗族旗帜，以及跨信仰赠出的、属于给予方本信仰的圣物。#!"
 tnt_item_nonwar:0 "承诺不进攻"
 tnt_item_nonwar_desc:0 "与第三方统治者立下为期#high 十年#!的单方面[truce|E]；撕毁停战协议会招致严厉惩罚。\n\n可以点名的对象：领地与立誓者接壤的统治者，以及立誓者拥有宣称的头衔的持有者——绝不包括谈判双方、立誓者的盟友，或已经与其处于停战之中的人。\n\n#weak 对方无需任何回报——立誓者只是按住自己的手而已。#!"
 tnt_item_vassal:0 "宣誓效忠"
 tnt_item_vassal_desc:0 "一位统治者屈膝，连同整个领地成为另一位的[vassal|E]。这是这张桌子所能容纳的最重条款——也是唯一附带一份可供你修改的书面契约的条款。"
 tnt_item_indep:0 "准许独立"
 tnt_item_indep_desc:0 "一位封臣被解除效忠誓言，成为独立统治者。摆在你这一侧，走脱的是你自己的封臣；摆在他那一侧，走脱的就是你。一份条约不能同时载有此项与效忠誓言。\n\n#weak 只有当你们二人已经是领主与直属封臣、将被解除者本人持有土地、双方领地都不处于战争之中，且他的土地不属于其领主自身的法理继承范围时，才能提出此项。#!"
 tnt_item_hostage:0 "人质"
 tnt_item_hostage_desc:0 "给予方的一位近亲——子女、孙辈、兄弟姐妹或侄甥——前往对方宫廷，作为人质居住其间，为这份条约作保。按游戏自身的人质规则，他是客人而不是囚犯。\n\n#weak 只有已经身处其本人宫廷、无地、未婚且未订婚的亲族才可以抵押，其摄政则绝不可以。#!"
 tnt_item_ward:0 "被监护人"
 tnt_item_ward_desc:0 "给予方宫廷中的一名孩童被送去由对方统治者抚养。那位统治者本人即成为监护人——没有第三方可供挑选。\n\n#weak 只有身处其本人宫廷、适合远行的孩童才能被提出，而一位监护人不得接收第三名被监护人。#!"
 tnt_item_courtier:0 "廷臣"
 tnt_item_courtier_desc:0 "廷臣改换门庭，各自带走配偶与年幼的子女。\n\n#weak 只有给予方宫廷中已成年、无地且不担任任何职位的成员才能交出——不含其继承人、配偶、摄政、阁臣、骑士与宫廷官员——接受方视为仇敌的人则绝不可以。#!"
 tnt_item_subject_desc:0 "选中的封臣改换领主，带着自己持有的全部头衔和自己的全部封臣，转入另一位统治者的领地。\n\n#weak 他们的封臣契约会按接收方领地的通常条件重写，原有的特殊义务因而消失。转让不会带来停战协议；封臣一旦越过领地边界，除了战争之外没有任何办法把他要回来。只有持有伯爵领及以上、地位低于接收方统治者、且与所有相关者都不处于战争状态的直属封臣才能交出——摄政与继承人绝不可以——而已被条约转让过的封臣，三年之内不得再次转让。#!"
 tnt_item_subject:0 "转让封臣"
 tnt_bd_base:0 "起始基准"
