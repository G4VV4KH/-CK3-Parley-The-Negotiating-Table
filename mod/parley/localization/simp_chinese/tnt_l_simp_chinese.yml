 tnt_ai_offer_row_prestige_p:0 "对方向你索要[prestige_i] [GetPlayer.MakeScope.Var('tnt_prestige_p').GetValue|0]"
 tnt_ai_offer_row_piety_p:0 "对方向你索要[piety_i] [GetPlayer.MakeScope.Var('tnt_piety_p').GetValue|0]"
