 tnt_err_subject_and_vassal:0 "一份已经载明整个领地效忠的条约，不需要再从中单独抠出一名封臣。要么把效忠誓约撤下谈判桌，要么把这名封臣撤下。"
 tnt_err_subject_r_unavailable:0 "眼下对方的封臣一个也转让不到你这里：你必须自己有领土，并且愿意再接纳臣属，而且你们两人必须处于和平状态。"
 tnt_err_subject_p_unavailable:0 "眼下你的封臣一个也转让不出去，原因可能不在你这一侧，而在对方：接收的统治者必须自己有领土，并且愿意再接纳臣属，而且你们两人必须处于和平状态。"
 tnt_err_indep_p_unavailable:0 "此刻无法解除效忠：对方必须是你的封臣，双方都处于和平（且你的封臣中无人与对方交战），对方的土地必须在你自己的法理头衔之外，并且对方不能是你的共治者。"
 tnt_err_indep_r_unavailable:0 "此刻无法解除效忠：你必须是对方的封臣，双方都处于和平（且对方的封臣中无人与你交战），你的土地必须在对方的法理头衔之外，并且你不能是对方的共治者。"
 tnt_err_people_pair:0 "这份条约自相矛盾：不能一面释放封臣，一面又收下一位封臣。"
 tnt_ai_offer_title:0 "[tnt_deal_partner.GetTitledFirstName]的使团"
 tnt_ai_offer_desc_a1:0 "[tnt_deal_partner.GetTitledFirstName]的信使被领了进来，斗篷上还沾着一路的风尘，开口便直截了当，像个一路疾驰而来的人。\n\n他的主人不愿与你结怨，请求订立一份誓约：#high 十年#!之内双方都不对对方拔剑——他还带来了钱币，用以约束这个诺言，因为空口无凭，这一点他心知肚明。"
 tnt_ai_offer_desc_a2:0 "[tnt_deal_partner.GetTitledFirstName]派来的不是书记官，而是一位亲族，这本身就已说明了一半。\n\n他提议的是一份立誓的军事同盟：你的旗帜与他的旗帜一同举起，战事来临时任何一方都可以召唤对方——而战事必至，你们二人都清楚。"
 tnt_ai_offer_desc_a3:0 "[tnt_deal_partner.GetTitledFirstName]的使节说话轻声细语，所求之物没有一样能放上秤盘。\n\n他的主人要的是你的一句话：欠下一份人情，由他自己挑时候来索。这一类债总是在最糟糕的时刻被讨走——而这恰恰正是它值得买下的缘由。"
 tnt_ai_offer_desc_a9:0 "[tnt_deal_partner.GetTitledFirstName]既未送来礼物，也不带奉承之词，只送来一句提醒。\n\n有一份人情尚未偿清，使节此来正是要看它兑现。他摆上桌的不是请求，而是一笔账目：债项当众念出，以下的条款就是了结它的方式。"
 tnt_ai_offer_desc_a5:0 "[tnt_deal_partner.GetTitledFirstName]的使节没有落座，也懒得把这件事说成什么邦交大计。\n\n有一些属于他家族、向他效忠的男男女女，正烂在你的地牢里。他的主人要他们回家，而他带来的东西，足以让你觉得少几个囚犯并不吃亏。"
 tnt_ai_offer_desc_a6:0 "这支使团带着传令官、号角与一长串见证者而来：[tnt_deal_partner.GetTitledFirstName]要让全天下都看见此处签下的东西。\n\n内容是一份为期#high 十年#!的互不侵犯协议；为了当众用印，他们的主人愿意在群臣列席之下让出自己的一部分[prestige|E]给你。如此大张旗鼓买来的和平，哪一方都难以反口不认。"
 tnt_ai_offer_desc_a8:0 "[tnt_deal_partner.GetTitledFirstName]来信谈的是边界与钱币。你名下有一块土地——已在下列条款中点明——归入他的旗下会自然得多，而他宁愿老老实实买下，也不愿暗地里觊觎。价钱已经开列清楚；印玺只等你的答复。"
 tnt_ai_offer_desc_a10:0 "[tnt_deal_partner.GetTitledFirstName]拿土地来做交易。他名下的一处领地——下面已经点明——于他而言累赘多过好处，他宁可看它落到你手里，而自己的金库沉一些。向你索要的价钱就列在条款之中。"
 tnt_ai_offer_desc_a11:0 "[tnt_deal_partner.GetTitledFirstName]拿出的不是土地，而是一条通往土地的合法途径：一份对他自己某个头衔的宣称，落笔用印，任你择时主张。讼师的墨水比士卒的鲜血便宜——虽说也不白给，下列条款便是明证。"
 tnt_ai_offer_desc_a13:0 "[tnt_deal_partner.GetTitledFirstName]的使节揭开了专程带来给你过目的珍宝：出自他自己厅堂的一件器物，已在下列条款中点明。它以实打实的钱币出售——这一类东西在谈判桌上另换新主，总比在战场上体面。"
 tnt_ai_offer_desc_a14:0 "[tnt_deal_partner.GetTitledFirstName]写下了少有统治者敢托付于羊皮纸的话：他愿意屈膝。他的领地将转入你的庇护之下，他的旗帜将归于你的旗下——当然要有相应的代价，已列于下列条款。仔细掂量：效忠一旦立誓，就不是轻易能收回的。"
 tnt_ai_offer_desc_a15:0 "[tnt_deal_partner.GetTitledFirstName]求在你的炉边讨一个位置——不是为他自己，而是为他的孩子，下面已经点明，要送到你的宫廷中抚养。这样一名受养的孩子既是一份体面，也是两个家族之间的一条纽带；随孩子一同送来的东西，已列于条款之中。"
 tnt_ai_offer_desc_a16:0 "我的使节带来一项比黄金更珍贵的提议：让我们两家结为姻亲。我愿以自己的一位血亲，与你的一位成婚，好让我们两支世系共有一个未来。婚配已列于下方；请像掂量我任何一桩买卖那样掂量它。"
 tnt_ai_offer_desc_a17:0 "[tnt_deal_partner.GetTitledFirstName]以一个掂量过自己誓言、觉得它沉重的封臣的口吻来信。\n\n他请求解除对你的效忠——旗帜重归自己，厅堂不必向任何人交代——而他并非空手来求：他愿意交换的东西就列在下列条款之中。归还的誓言不等于背弃的誓言；但也不是轻易就能还回去的。"
 tnt_ai_offer_desc_a18:0 "[tnt_deal_partner.GetTitledFirstName]的使团并非空手而来，而所带之物也不是金钱。\n\n他自己血脉中的一名孩子，下面已经点明，被送来交由你照看，充作人质——只要孩子在你的屋檐之下，他对你的诺言便有担保。为这样一份贵重的抵押，他所索求的回报已写进条款。"
 tnt_ai_offer_desc_a19:0 "[tnt_deal_partner.GetTitledFirstName]听说你宫廷中有这么一个人，想要他。\n\n此人已在下面点明。他请你放此人过去为他效力，也不指望这份人情白得——钱袋就摆在条款之中。对一座大厅堂而言，少一名侍从算不得什么；为他开出的价钱却不小。"
 tnt_ai_offer_desc_a20:0 "[tnt_deal_partner.GetTitledFirstName]愿意屈膝——但不是盲目地屈膝。\n\n他的领地将按下列契约中写定的条件转入你的王冠之下：他会向你缴纳什么，又打算为自己留下什么。以公道价钱换来的效忠，比夺来的效忠维持得更久。用印之前，请先读条款。"
 tnt_ai_offer_desc_generic:0 "[tnt_deal_partner.GetTitledFirstName]的使节被通报入内，行礼，把一份封印的提议放在案上。条款由其主人亲笔写就，列于下方，他正等着你的答复。"
 tnt_ai_offer_desc_outro:0 "\n\n#weak 你的外交官已经用你自己惯用的那杆秤，把它称过一遍。#!"
 tnt_ai_goal_claim:0 "#weak 你的耳目低声禀报：那个家族一直惦记着对你土地的宣称，而他们觉得金钱比鲜血便宜。#!\n\n"
 tnt_ai_goal_dejure:0 "#weak 你的律法官证实了此事：按古老的权利，那片土地本该归于他的王冠——而他们并没有忘记。#!\n\n"
 tnt_ai_goal_kin:0 "#weak 缘由不必远求：他自己的血亲正关在你的地牢里。#!\n\n"
 tnt_ai_goal_menaced:0 "#weak 你的边境人马来报：有一位更强的邻人正压在他的土地之上，他急需朋友。#!\n\n"
 tnt_ai_goal_rich:0 "#weak 你的商人确知此事：他的国库里金钱堆得发沉，正愁没有去处。#!\n\n"
 tnt_ai_goal_poor:0 "#weak 你的商人低声说：他的金库已经见底，正急着要钱。#!\n\n"
 tnt_ai_goal_overdomain:0 "#weak 你的律法官注意到：他手里的土地已超过一只手所能名正言顺地握住的数目——多出来的那些正在找买主。#!\n\n"
 tnt_ai_goal_heir:0 "#weak 这在他的宫廷里不是秘密：继承人已到年纪，婚床却还空着——他需要一桩亲事。#!\n\n"
 tnt_ai_goal_brood:0 "#weak 你的人拿这件事说笑：他的厅堂里挤满了孩子，而每一个都需要一处宫廷、一副碗筷和一位老师。#!\n\n"
 tnt_ai_goal_schemer:0 "#weak 你的耳目提醒你：那座宫廷是由窃窃私语砌成的，它的主人从不买下一个自己不打算动用的承诺。#!\n\n"
 tnt_ai_goal_yoke:0 "#weak 你的总管们从对方的仆役口中听说：那个家族戴着这份誓言并不舒服，其领主们时常提起旧日的自由。#!\n\n"
 tnt_ai_goal_talent:0 "#weak 你的内廷总管点明了缘由：他的厅堂里缺一个懂这门手艺的人，而你的厅堂里恰好有一个。#!\n\n"
 tnt_ai_goal_surety:0 "#weak 你的使节看得明白：他要让自己的诚意再无可疑之处，并且愿意为此抵押血亲。#!\n\n"
 tnt_ai_goal_might:0 "#weak 你的边境守军回报：他的兵马已经集结，却闲置不动，而他近来一直在清点你的征召兵。#!\n\n"
 tnt_ai_goal_blank:0 ""
 tnt_ai_offer_opt_accept:0 "接受这些条款"
 tnt_ai_offer_opt_counter:0 "打开谈判桌"
 tnt_ai_offer_counter_tt:0 "#high 打开你自己的谈判窗口，对方的条款已经摆在上面。#!你可以改动其中任何一项，划掉不喜欢的，添上自己的要求——再把重塑过的条约送回去。在你按下“提议”之前，什么都不算许诺。"
 tnt_ai_offer_opt_decline:0 "打发他们走"
 tnt_ai_offer_opt_hush:0 "打发他们走，并且不再接见使团"
 tnt_ai_offer_hush_tt:0 "#high 十年#!之内不会再有统治者带着条约来找你。"
 tnt_ai_demand_title:0 "[tnt_deal_partner.GetTitledFirstName]的索求"
 tnt_ai_demand_desc_a21:0 "[tnt_deal_partner.GetTitledFirstName]的使者既没带礼物，也没带提议。他报出一个数目，又说他的主君并不愿意被逼得亲自来收。说完便站着等，始终不肯落座。"
 tnt_ai_demand_desc_outro:0 "\n\n#weak 付了钱，天下都会知道你付了。把人打发走，天下也一样会知道。#!"
 tnt_ai_demand_opt_pay:0 "照他要的数目付钱"
 tnt_ai_demand_pay_tt:0 "#high 金币被一枚枚数出，使者满意地离去。#! 他的名声因此更盛，听闻此事的人会更容易怕他。往后十五年，他不会再来索求。"
 tnt_ai_demand_opt_refuse:0 "让他空手回去"
 tnt_ai_demand_refuse_tt:0 "#high 他一无所得。#! 可是使者进了你的厅堂，报了价，又无人应答地走了 — 你的朝臣都看见了，你的威望因此受损。他自己的名声也受损：被拒绝的威胁，就是被掂量过的威胁。往后十五年，他不会再来索求。"
 tnt_ai_demand_refuse_free_tt:0 "#high 他一无所得，而你也分文未失。#! 你的兵马已不是他当初清点的那支。他的名声因此受损，往后十五年也不会再来索求。"
