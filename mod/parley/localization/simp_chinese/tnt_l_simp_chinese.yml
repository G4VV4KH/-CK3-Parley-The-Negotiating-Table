 tnt_ob_group_obligations:0 "臣属所付"
 tnt_ob_group_obligations_tt:0 "随誓约本身而来的两项义务，各自从完全免除一直到敲骨吸髓。\n\n#weak 在你挪动它们之前，两者都停在中档，而中档正是一份普通[vassal_contract|E]的规定。#!"
