 tnt_picker_rule_hostage:0 "담보로 설 수 있는 가까운 친족만 여기에 나타납니다. 이 조약의 다른 곳에 이미 약속된 사람은 나오지 않습니다."
 tnt_picker_rule_ward:0 "다른 곳에서 길러질 만큼 아직 어린 아이만, 그리고 자기 후견인이 없는 아이만 여기에 나타납니다."
 tnt_picker_rule_courtier:0 "떠날 수 있는 궁정 신하만 나타납니다. 자문위원도, 원수도, 땅을 받은 봉신도 나오지 않습니다. 거래가 감당하는 만큼 고르십시오."
 tnt_picker_rule_subject:0 "백작령 이상을 가지고, 받는 군주보다 격이 낮으며, 관련된 누구와도 싸우고 있지 않은 직속 봉신만 나타납니다. 섭정도, 후계자도, 최근 삼 년 안에 조약으로 옮겨진 사람도 나오지 않습니다. 거래가 감당하는 만큼 고르십시오."
