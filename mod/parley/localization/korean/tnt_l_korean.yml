 tnt_action_can_lean_on:0 "@dread_icon! 우위는 당신에게 있습니다"
 tnt_action_can_lean_on_label:0 "@dread_icon! [recipient.GetPrimaryTitle.Custom('GetTierIcon')][recipient.GetUINameNoTooltip](을)를 위협할 수 있습니다"
 tnt_action_can_lean_on_desc:0 "[recipient.GetUIName](을)를 위협할 수 있습니다. 당신의 군대와 위신과 공포가 저마다 상대의 것과 견주어 위협에 필요한 무게에 이르렀고, 지난번 위협은 이미 잊혔습니다. 위협을 탁자에 올리면 바로 그 무게가 상대가 감당할 몫에 더해져, 상대는 대화를 끝내려 더 많이 내놓을 것입니다."
 tnt_action_can_lean_on_click:0 "#I 클릭하여 조약 교섭 시작하기#!"
 tnt_action_can_lean_on_combined_label:0 "[recipient.GetPrimaryTitle.Custom('GetTierIcon')] [recipient.GetUINameNoTooltip]"
 tnt_action_can_lean_on_combined_group_label:0 "@dread_icon! 당신이 우위에 선 영주들"
 tnt_action_can_lean_on_combined_group_name:0 "@dread_icon! 위협할 수 있는 영주"
 tnt_action_can_lean_on_combined_group_description:0 "당신의 봉신과 당신의 주군, 그리고 국경과 바다 건너의 이웃 가운데 여기 오른 영주들은 모두 위협할 수 있습니다. 당신의 군대와 위신과 공포가 저마다 상대의 것과 견주어 위협에 필요한 무게에 이르렀고, 지난번 위협은 이미 잊혔습니다. 그중 누구와든 교섭을 시작한 뒤 「협박하기」를 선택하면 위협이 탁자 위에 오릅니다."
 tnt_msg_stale:0 "조건이 변경되었습니다"
 tnt_err_deal_changed:0 "이 합의는 더 이상 적힌 대로 이행할 수 없습니다. 아무것도 교환되지 않았습니다."
