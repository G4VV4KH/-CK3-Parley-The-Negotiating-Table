l_korean:
 # =========================================================================
 # PARLEY: THE NEGOTIATING TABLE - Korean localization
 #
 # GENERATED FILE. 625 keys - the SAME KEY SET IN THE SAME ORDER as
 # localization\english\tnt_l_english.yml (house law 9, the nine-language
 # fan). English is the canon this was translated from; every game term
 # follows the vanilla Korean localization
 # (<vanilla>\game\localization\korean), so Piety is 신앙도, Prestige 위신,
 # Influence 영향력, Dread 공포, Hook 구실, Betrothal 약혼, Vassal 봉신,
 # Liege 주군, Claim 명분, Artifact 유물, Hostage 인질, Ward 피후견인,
 # Obligations 책무, Grand wedding 대규모 결혼식.
 #
 # Every [..] datafunction, every $key$ reference and every #markup pair is
 # carried over VERBATIM from the English value; nothing inside a bracket or
 # a $..$ is ever translated. Numbers and comparison shapes are unchanged.
 # The long doctrine comments of the English and Russian files stay theirs -
 # this file carries keys only.
 #
 # Encoding: UTF-8 WITH BOM, LF endings, one trailing newline.
 # =========================================================================
 tnt_open_negotiations:0 "조약 교섭"
 tnt_open_negotiations_desc:0 "[recipient.GetShortUIName]에게 사절을 보내 온전한 조약을 탁자 위에 펼칩니다. 모든 조항을, 양쪽의 것을 한꺼번에.[actor.Custom('TntThreatCooldownStatus')]"
 tnt_bd_floor_panel:0 "선물 하한 보정"
 tnt_threat_cooldown_status:0 "\n\n#high 위협 대기 시간#!\n남은 일수: [GetVarTimeRemaining(tnt_cooldown_actor.MakeScope, 'tnt_threat_cooldown')|0] (종료일 [GetCurrentDateWithDiff(GetVarTimeRemaining(tnt_cooldown_actor.MakeScope, 'tnt_threat_cooldown'))])."
 tnt_threat_cooldown_short:0 "대기 시간: [GetVarTimeRemaining(tnt_cooldown_actor.MakeScope, 'tnt_threat_cooldown')|0]일"
 tnt_threat_cooldown_empty:0 ""
 tnt_open_negotiations_extra_icon:0 "@dread_icon! 이 상대는 위협할 수 있습니다. 군대와 위신과 공포가 함께 위협에 필요한 무게에 이르렀고, 지난번 위협은 이미 잊혔습니다"
 tnt_window_title:0 "외교 교섭"
 tnt_col_actor:0 "당신의 제안"
 tnt_col_partner:0 "상대의 제안"
 tnt_balance_header:0 "상대의 답변"
 tnt_balance_accept:0 "#P 상대는 수락하려 합니다#!"
 tnt_balance_reject:0 "#N 상대는 거절하려 합니다#!"
 tnt_scale_note:0 "이 숫자가 곧 상대의 답변입니다. 0보다 크면 상대는 서명합니다. 모든 조항은 그것 하나만 따로 교섭했을 때의 값어치로 매겨지며, 상대가 당신에게 품은 의견과 신앙, 혈연, 그리고 상대가 덤으로 바라는 것까지 이미 셈에 들어 있습니다. 막대는 같은 답변을 펼쳐 놓은 것입니다. 상대를 승낙 쪽으로 미는 모든 것이 거절 쪽으로 미는 모든 것과 맞서 있으므로, 막대가 한가운데를 넘어서는 순간 상대는 동의합니다."
 tnt_label_points:0 "점"
 tnt_label_years:0 "#weak 10년간 유효#!"
 tnt_picker_empty:0 "#weak 내놓을 것이 없습니다#!"
 tnt_picker_empty_artifact:0 "#weak 이쪽이 가진 것 가운데 넘길 수 있는 물건이 없습니다. 왕관 보물은 작위를 따라가고, 가문 깃발은 가문에 남으며, 자기 신앙의 성유물은 같은 신앙을 가진 이에게만 건넬 수 있습니다.#!"
 tnt_item_gold:0 "금화"
 tnt_item_gold_desc:0 "국고에서 [gold_i]를 한 번에 지불합니다. 조약에 인장이 찍히는 그 순간 넘어갑니다."
 tnt_item_prestige:0 "위신"
 tnt_item_prestige_desc:0 "[prestige_i] [prestige|E]을 탁자 너머로 약속합니다.\n\n#weak 궤짝이 통째로 건너가는 일이 아닙니다. 주는 쪽이 그만큼 잃고 받는 쪽이 그만큼 얻는, 서로 이어지지 않은 두 번의 처리입니다. 그래서 제안하기를 누르는 순간 주는 쪽이 전액을 지니고 있지 않으면 제안 자체를 보낼 수 없습니다.#!"
 tnt_item_piety:0 "신앙도"
 tnt_item_piety_desc:0 "[piety_i] [piety|E]를 탁자 너머로 약속합니다.\n\n#weak 여기서도 옮겨 담는 것이 아니라 별개의 두 처리입니다. 한쪽이 잃은 만큼 다른 쪽이 얻습니다. 제안하기를 누르는 순간 주는 쪽이 전액을 지니고 있지 않으면 제안을 보낼 수 없습니다.#!"
 tnt_item_influence:0 "영향력"
 tnt_item_influence_desc:0 "[influence_i] [influence|E]을 탁자 너머로 약속합니다.\n\n#weak [influence|E]은 그것으로 굴러가는 통치 형태에서만 존재하므로, 이 줄은 양쪽 모두 그런 통치 형태일 때에만 나타납니다. 그런 자원이 없는 영주에게 건네 보아야 아무 일도 일어나지 않습니다. 여기서도 별개의 두 처리이며, 제안하기를 누르는 순간 주는 쪽이 전액을 지니고 있지 않으면 제안을 보낼 수 없습니다.#!"
 tnt_item_alliance:0 "군사 동맹"
 tnt_err_ab_already_fair:0 "조약은 이미 정확히 #high +1#!에 놓여 있습니다. 더 맞출 것이 남아 있지 않습니다"
 tnt_err_ab_empty:0 "아직 탁자 위에 맞출 것이 아무것도 없습니다"
 tnt_threat_opinion:0 "나를 협박함"
 tnt_treaty_favor_opinion:0 "유리한 조약"
 tnt_item_usehook_r:0 "상대가 빚을 청구함"
 tnt_item_usehook_r_desc:0 "상대는 당신에게 [hook|E]을 쥐고 있으며 그것을 쓸 작정이므로, 조약이 그것을 셈에 넣기를 기대합니다.\n\n#weak 이것은 당신이 끌 수 있는 것이 아닙니다. 지렛대는 상대의 것이지 당신의 것이 아닙니다. 그래서 상대는 공정한 값보다 더 많이 요구합니다. 청구할 수 있는 호의라면 #high -45#!, 협박에 준하는 지렛대라면 #high -120#!입니다. 서명하면 빚은 소진됩니다. 약한 구실은 사라지고 강한 구실은 남습니다.#!\n\n#weak 거절해도 잃는 것은 조약뿐입니다.#!"
 tnt_usehook_r_sub:0 "[Select_CString( GreaterThanOrEqualTo_CFixedPoint( GetPlayer.MakeScope.ScriptValue('tnt_usehook_r_strength_value'), '(CFixedPoint)2' ), Localize('tnt_usehook_strong'), Localize('tnt_usehook_weak') )]"
 tnt_bd_usehook_r:0 "당신에게 청구된 빚"
 tnt_item_usehook:0 "구실 청구"
 tnt_item_usehook_desc:0 "이미 당신이 상대에게 쥐고 있는 지렛대를 씁니다. 이것은 #high 갚을 호의#!와 반대 방향입니다. 그쪽은 당신이 갚아야 할 호의를 상대에게 건네는 것이고, 이쪽은 상대가 당신에게 진 호의를 거두어들이는 것입니다.\n\n당신을 결코 좋아하지 않을 영주에게도 통하므로, 그 무게는 상대의 호감에 좌우되지 않습니다. 당신이 상대에게 줄 수 있는 다른 모든 것과 다릅니다.\n\n#weak 청구하는 [hook|E]은 #high +45#!, 협박에 준하는 지렛대는 #high +120#!의 값어치입니다. 구실이 무엇을 견디는지는 게임 자체가 정합니다. 약한 구실은 조약이 맺어질 때 소진되고 강한 구실은 그렇지 않습니다. 실제로 조약이 성립될 때에만 소진됩니다. 성사되지 않은 조약을 위해 청구한 호의는 버린 호의일 테니까요.#!\n\n#weak 빚을 거두어들이는 일은 협박과 똑같이 당신을 짓누릅니다. 당신 자신의 천성이 이 행위를 판단합니다. 양심이 있는 자는 그것을 스스로의 #high 스트레스#!로 짊어지고, 더 차가운 영주는 오히려 지렛대를 마침내 썼다는 데에 마음이 놓이며, 어떤 특성이 응답했는지는 사절이 길을 떠나기 전 확인 창에 표시됩니다.#!"
 tnt_usehook_sub:0 "[Select_CString( GreaterThanOrEqualTo_CFixedPoint( GetPlayer.MakeScope.ScriptValue('tnt_usehook_strength_value'), '(CFixedPoint)2' ), Localize('tnt_usehook_strong'), Select_CString( GreaterThanOrEqualTo_CFixedPoint( GetPlayer.MakeScope.ScriptValue('tnt_usehook_strength_value'), '(CFixedPoint)1' ), Localize('tnt_usehook_weak'), Localize('tnt_usehook_none') ) )]"
 tnt_usehook_strong:0 "강한 구실, 써도 사라지지 않습니다"
 tnt_usehook_weak:0 "약한 구실, 청구하면 소진됩니다"
 tnt_usehook_none:0 "상대에게 쥔 구실이 없습니다"
 tnt_bd_usehook_p:0 "청구한 구실"
 tnt_err_usehook_none:0 "상대에게 쓸 구실을 쥐고 있지 않습니다"
 tnt_item_threat:0 "협박하기"
 tnt_item_threat_desc:0 "거절이 무엇을 뜻하는지 상대가 알게 합니다. 이것은 선전포고가 아닙니다. 맹세한 것도 없고 진군하는 군대도 없습니다. 탁자에 얹는 무게이며, 당신을 결코 좋아하지 않을 영주에게도 통합니다. 바로 금화로는 할 수 없는 일입니다.\n\n그 무게는 #high 당신의 군대가 상대의 군대를 얼마나 앞서는가#!이며, 여기에 #high 당신의 위신이 상대의 위신을 얼마나 앞서는가#!와 #high 당신의 공포가 상대의 공포를 얼마나 앞서는가#!가 더하거나 덜어냅니다. 위신 단계가 상대보다 통째로 하나 낮으면 군대가 아무리 커도 위협은 완전히 닫힙니다. 그리고 위협을 연 바로 그 무게가 그대로 조약을 당신에게 유리하게 기울이는 무게가 됩니다.\n\n#weak 상대는 이를 기억합니다. 협박 아래 맺은 조약은 $tnt_threat_opinion$, 곧 #high -100#! 의견을 치르며 그 기억은 15년에 걸쳐 흐려집니다. 당신의 선물에 값어치를 부여하는 것이 바로 상대의 호감이므로, 오늘 두려움으로 빼앗는다는 것은 한 세대 동안 당신의 금화가 상대에게서 더 적게 사들인다는 뜻입니다. 값을 치르는 것은 금화만이 아닙니다. 당신 자신의 천성이 이 행위를 판단합니다. 양심이 있는 자는 그 무게를 스스로의 #high 스트레스#!로 짊어지고, 더 차가운 영주는 오히려 지렛대를 마침내 썼다는 데에 마음이 놓입니다. 어떤 특성이 응답했는지와 정확한 수치는 사절이 길을 떠나기 전 확인 창에 표시됩니다.#!"
 tnt_threat_sub:0 "군대 [GetPlayer.MakeScope.ScriptValue('tnt_threat_ratio_value')|1] 대 1, 위신 ×[GetPlayer.MakeScope.ScriptValue('tnt_threat_rep_term_value')|0], 공포 ×[GetPlayer.MakeScope.ScriptValue('tnt_threat_dread_term_value')|2]"
 tnt_bd_threat_p:0 "노골적인 압박"
 tnt_bd_threat_panel:0 "압박"
 tnt_err_threat_weak:0 "위협에는 군사력, 위신, 공포로 얻는 거래 점수가 최소 100점 필요합니다. 이 기준은 플레이어와 AI에 똑같이 적용됩니다."
 tnt_err_threat_relation:0 "위협은 당신의 동맹도 아니고 인질로 얽히지도 않은 독립 영주에게만 사용할 수 있습니다"
 tnt_err_threat_unknown:0 "당신의 이름에 얼마간 무게가 있어야 합니다. 명예 단계가 최하위를 넘어야 합니다"
 # tnt_err_threat_unafraid RETIRED round 8 (I2). This tombstone holds the line count so no .yml citation moves. ORPHANED 2026-08-24 BY THE RATIO RULING, KEPT DEFINED IN ALL NINE: tnt_err_threat_unknown above and tnt_err_threat_nofear below have ZERO rows - their rules are inside tnt_threat_points_value now. Law 9 and the law-10d control. DO NOT DELETE, DO NOT RE-USE FOR ANOTHER MEANING.
 tnt_err_threat_nofear:0 "상대는 당신을 두려워하지 않습니다. 당신의 공포가 75에 이르거나, 담대하지 않은 자를 상대로는 40, 당신의 지배를 받는 자를 상대로는 20에 이르러야 합니다"
 tnt_err_threat_recent:0 "상대는 지난번 협박을 아직 기억하고 있습니다. 다시 압박하기 전에 그 기억이 흐려지도록 두십시오"
 tnt_item_alliance_desc:0 "두 사람이 함께 맹세하는 하나의 공식 동맹입니다. 한쪽이 다른 쪽에게 건네주는 것이 아닙니다. 이후 어느 쪽이든 상대를 전쟁에 부를 수 있으며, 그 부름을 거절하면 [prestige|E]을 치릅니다.\n\n#weak 하나의 협약에 하나의 줄입니다. 조약에 들어 있거나 들어 있지 않거나 둘 중 하나입니다.#!\n\n#weak 자신의 [liege|E]이나 자신의 [vassal|E]과 맺으면 참전 요청이 아니라 상시 협약이 됩니다. 게임은 주군과 봉신이 서로를 소집하도록 허용하지 않지만, 동맹 자체는 실재하고 동맹을 세는 모든 곳에서 세어지며, 둘 중 하나가 상대의 봉역을 떠난 뒤에도 남습니다.#!\n\n#weak $tnt_tt_alliance_glut$#!"
 tnt_tt_alliance_glut:0 "이미 맺고 있는 동맹이 많을수록 다음 동맹을 사들이기가 싸집니다. 자신의 주군과 자신의 봉신은 빼고 세어, 두 번째 동맹부터는 기존 동맹 하나마다 새 협약이 상대에게 지니는 값어치가 절반으로 줄어듭니다. 상대의 동맹도 상대에게 똑같이 작용합니다."
 tnt_item_truce:0 "불가침 협약"
 tnt_item_truce_desc:0 "두 사람이 함께 맺는 하나의 협약입니다. #high 10년#! 동안 어느 쪽도 상대에게 전쟁을 선포할 수 없습니다.\n\n#weak 하나의 협약에 하나의 줄입니다. 조약에 들어 있거나 들어 있지 않거나 둘 중 하나입니다.#!"
 tnt_item_marriage:0 "혼인 협약"
 tnt_item_marriage_desc:0 "두 가문 사이의 혼사이며, #high 한 조약에 원하는 만큼 여러 쌍#!을 담을 수 있습니다. 양쪽에서 한 사람씩 고르고 자녀가 따를 혈통을 정한 다음 부부를 더하십시오. 둘 중 하나가 아직 아이라면 그 쌍은 혼인이 아니라 약혼이 됩니다.\n\n#weak 첫 쌍 다음의 부부는 앞의 쌍보다 상대에게 조금씩 덜 값어치가 있는 반면, 혼사가 상대에게 지우는 부담은 결코 줄지 않습니다. 그러므로 잘 고른 몇 쌍이 억지로 채운 열두 쌍보다 낫습니다. 자기 가문보다 낮은 격과 혼인하기를 요구받은 가문은 그 격차에 값을 매기며, 격차가 클수록 값은 가팔라집니다. 한 쌍에게는 대규모 결혼식을 약속할 수도 있습니다.#!\n\n#high 충분히 가까운 혼사는 이제 동맹까지 함께 가져옵니다#!. 게임이 스스로 주선한 혼인과 똑같습니다. 그리고 조약의 값이 이 동맹을 이미 셈에 넣으므로, 동맹을 낳는 혼사는 그러지 못하는 혼사보다 값어치가 큽니다. #weak 혼인 화면이 후보 옆에 그리는 「잠재적 동맹」 안내는 다시 믿어도 됩니다.#!"
 tnt_item_title:0 "작위 양도"
 tnt_item_title_desc:0 "백작령 이상 등급의 보유 작위를, 그 아래 딸린 모든 것과 함께 넘깁니다.\n\n#weak 한 번에 원하는 만큼 넘길 수 있습니다. 수도와 대표 작위는 결코 탁자에 오르지 않습니다. 상대의 직할령이 감당할 수 있는 한계를 넘는 땅도 땅입니다. 상대는 받아 갈 것이고 온전한 값을 치를 것이며, 그로 인한 부담은 자기 집사들과 셈할 것입니다.#!"
 tnt_item_claim:0 "명분 부여"
 tnt_item_claim_desc:0 "주는 쪽이 스스로 보유한 작위에 대해 행사되지 않은 [claim|E]을 넘깁니다. 훗날의 전쟁을 향한 공공연한 초대이자 중대한 양보입니다.\n\n#weak 한 번에 원하는 만큼 넘길 수 있습니다.#!"
 tnt_item_prisoner_multi:0 "지목한 포로 석방"
 tnt_item_prisoner_multi_desc:0 "당신이 이름을 대는 포로만 지하 감옥에서 풀어 주고, 그 밖의 누구도 풀지 않습니다.\n\n#weak 포로의 값어치는 그 지위와 혈통입니다. 누구든 #high 10#!, 상대의 친족이면 #high +15#!, 작위를 하나라도 가졌으면 #high +10#!, 그 작위가 백작령이나 공작령, 왕국, 제국에 이를수록 #high +15 / +25 / +40 / +60#!입니다. 그러므로 사로잡힌 왕 하나가 이름 없는 열둘보다 값집니다. 골라내는 까닭이 바로 그것입니다.#!\n\n#weak 여기서 누구든 고르면 #high 포로 석방#!을 덮어씁니다. 그러지 않으면 같은 사람들에게 두 번 값을 치르게 됩니다.#!"
 tnt_multi_count_prisoner_p:0 "지목한 포로: [GetPlayer.MakeScope.ScriptValue('tnt_count_sel_prisoner_p_value')|0]명"
 tnt_sel_count_prisoner_p:0 "지목: [GetPlayer.MakeScope.ScriptValue('tnt_count_sel_prisoner_p_value')|0]명"
 tnt_picker_title_prisoner:0 "석방할 포로 선택"
 tnt_item_prisoners:0 "포로 석방"
 tnt_item_prisoners_desc:0 "풀어 주는 쪽이 상대와 혈연이나 충성으로 묶인 모든 죄수에게 지하 감옥을 엽니다."
 tnt_item_hook:0 "갚을 호의"
 tnt_item_hook_desc:0 "상대에게 [hook_i] 호의를 하나 빚집니다. 세 등급이 있습니다. #high 약한#! 호의는 10년을 가고 처음 쓰일 때 소진됩니다. #high 강한#! 호의는 20년을 가고 몇 번이든 다시 쓸 수 있으며 사용 사이에 5년을 쉽니다. #high 영원한#! 호의는 만료되지도 소진되지도 않으며, 마찬가지로 사용 사이에 5년을 쉽니다.\n\n#weak 왼쪽 클릭으로 등급을 올리고 오른쪽 클릭으로 내립니다. 호의를 받게 될 쪽이 이미 호의를 지게 될 쪽에게 구실을 쥐고 있다면 호의를 약속할 수 없습니다.#!"
 tnt_item_artifact:0 "유물"
 tnt_item_artifact_desc:0 "주는 쪽의 보물고에서 [artifact_i] 유물을 넘깁니다.\n\n#weak 한 번에 원하는 만큼 넘길 수 있습니다. 게임이 스스로 붙잡아 두는 물건은 목록에 오르지 않습니다. 작위에 묶인 왕관 보물, 가문 깃발, 그리고 신앙이 다른 상대에게 건네려는 주는 쪽 자기 신앙의 성유물이 그렇습니다.#!"
 tnt_item_nonwar:0 "불가침 약속"
 tnt_item_nonwar_desc:0 "제3의 영주와 #high 10년#!짜리 일방 [truce|E]을 맹세합니다. 휴전을 깨면 가혹한 대가가 따릅니다.\n\n지목할 수 있는 자는 약속하는 쪽과 봉역이 맞닿은 영주, 그리고 약속하는 쪽이 명분을 가진 작위의 소유주입니다. 교섭 중인 두 사람과 약속하는 쪽의 동맹, 이미 그와 휴전 중인 자는 결코 지목할 수 없습니다.\n\n#weak 상대는 그 대가로 아무것도 지지 않습니다. 맹세하는 쪽이 손을 거둘 뿐입니다.#!"
 tnt_item_vassal:0 "충성 서약"
 tnt_item_vassal_desc:0 "한 영주가 무릎을 꿇고 봉역째로 다른 쪽의 [vassal|E]이 됩니다. 이 탁자가 담을 수 있는 가장 무거운 조항이며, 당신이 직접 손볼 수 있는 계약서가 딸린 유일한 조항입니다."
 tnt_item_indep:0 "독립 부여"
 tnt_item_indep_desc:0 "봉신이 충성 서약에서 풀려나 독립 영주가 됩니다. 당신 쪽 탁자에 놓이면 당신의 봉신이 풀려나는 것이고, 상대 쪽에 놓이면 당신이 풀려나는 것입니다. 하나의 조약이 이것과 충성 서약을 동시에 담을 수는 없습니다.\n\n#weak 두 사람이 이미 주군과 직속 봉신으로 서 있고, 풀려날 쪽이 자기 땅을 가지고 있으며, 어느 봉역도 전쟁 중이 아니고, 그 땅이 주군 자신의 규범 권역 상속분에 속하지 않을 때에만 내놓을 수 있습니다.#!"
 tnt_item_hostage:0 "인질"
 tnt_item_hostage_desc:0 "주는 쪽의 가까운 친족, 곧 자녀나 손자녀, 형제자매, 조카가 상대의 궁정으로 건너가 이 조약의 담보로 그곳에 머뭅니다. 죄수가 아니라 게임 자체의 인질 규칙을 따르는 손님입니다.\n\n#weak 땅이 없고 혼인도 약혼도 하지 않았으며 이미 자기 궁정에 있는 친족만 담보로 세울 수 있고, 자신의 섭정은 결코 세울 수 없습니다.#!"
 tnt_item_ward:0 "피후견인"
 tnt_item_ward_desc:0 "주는 쪽 궁정의 아이 하나를 상대 영주가 기르도록 보냅니다. 그 영주가 직접 후견인이 되며, 따로 고를 제3자는 없습니다.\n\n#weak 자기 궁정에 있으면서 길을 떠날 수 있는 아이만 내놓을 수 있고, 후견인은 세 번째 피후견인을 받을 수 없습니다.#!"
 tnt_item_courtier:0 "궁정 신하"
 tnt_item_courtier_desc:0 "궁정 신하가 가문을 옮기며, 각자 배우자와 어린 자녀를 데리고 갑니다.\n\n#weak 주는 쪽 궁정에서 성인이고 땅이 없으며 아무 직책도 맡지 않은 자만 넘길 수 있습니다. 후계자와 배우자, 섭정, 자문위원, 기사, 궁정 관리는 넘길 수 없으며, 받는 쪽이 원수로 여기는 자도 결코 넘길 수 없습니다.#!"
 tnt_item_subject_desc:0 "고른 봉신이 주군을 바꾸어, 자기가 가진 모든 작위와 자기 봉신 전부를 데리고 상대 군주의 봉역으로 넘어갑니다.\n\n#weak 봉신 계약은 받는 쪽 봉역의 평범한 조건으로 새로 쓰이므로 특별한 의무는 사라집니다. 넘긴다고 휴전이 따라오지도 않고, 봉역의 경계를 넘어간 봉신을 되돌릴 방법은 전쟁 말고는 이 게임에 없습니다. 넘길 수 있는 것은 백작령 이상을 가지고, 받는 군주보다 격이 낮으며, 관련된 누구와도 싸우고 있지 않은 직속 봉신뿐입니다. 섭정과 후계자는 결코 넘길 수 없고, 조약으로 한 번 옮겨진 봉신은 삼 년 동안 다시 옮길 수 없습니다.#!"
