 tnt_err_truce_dead:0 "두 사람 가운데 하나가 더는 살아 있지 않습니다."
 tnt_err_hostage_p_unavailable:0 "인질로 보낼 사람이 없거나, 상대가 당신을 위해 담보를 맡으려 하지 않습니다."
 tnt_err_hostage_r_unavailable:0 "상대에게 인질로 보낼 사람이 없거나, 당신이 상대를 위해 담보를 맡을 수 없습니다."
 tnt_err_ward_p_unavailable:0 "상대의 손에 맡길 아이가 없거나, 상대의 궁정이 아이를 기를 수 없습니다."
 tnt_err_ward_r_unavailable:0 "상대에게 당신의 손에 맡길 아이가 없거나, 당신의 궁정이 아이를 기를 수 없습니다."
 tnt_err_courtier_p_unavailable:0 "당신의 궁정에서 넘길 수 있는 사람이 없습니다. 원치 않는 자와 서약에 매인 자, 갇힌 자는 모두 남습니다."
 tnt_err_courtier_r_unavailable:0 "상대의 궁정에서 당신에게 넘길 수 있는 사람이 없습니다."
 tnt_err_subject_and_vassal:0 "봉역 전체의 신종을 담은 조약에 거기서 하나만 뽑아낸 봉신까지 필요하지는 않습니다. 신종 서약을 탁자에서 내리거나, 그 봉신을 내리십시오."
 tnt_err_subject_r_unavailable:0 "지금은 상대의 봉신 가운데 누구도 당신에게 넘길 수 없습니다. 당신이 스스로 땅을 가지고 있어야 하고 더 많은 신하를 받을 뜻이 있어야 하며, 두 사람이 평화 상태여야 합니다."
 tnt_err_subject_p_unavailable:0 "지금은 당신의 봉신 가운데 누구도 넘길 수 없습니다. 당신 쪽이 아니라 상대 쪽 사정일 수도 있습니다. 받을 군주가 스스로 땅을 가지고 있어야 하고 더 많은 신하를 받을 뜻이 있어야 하며, 두 사람이 평화 상태여야 합니다."
 tnt_err_indep_p_unavailable:0 "지금은 풀어 줄 수 없습니다. 상대가 당신의 봉신이어야 하고, 두 사람 모두 평화로워야 하며(당신의 어느 봉신도 상대와 전쟁 중이 아니어야 하며), 상대의 땅이 당신 자신의 규범 권역 작위 밖에 있어야 하고, 상대가 당신의 부제가 아니어야 합니다."
 tnt_err_indep_r_unavailable:0 "지금은 풀려날 수 없습니다. 당신이 상대의 봉신이어야 하고, 두 사람 모두 평화로워야 하며(상대의 어느 봉신도 당신과 전쟁 중이 아니어야 하며), 당신의 땅이 상대의 규범 권역 작위 밖에 있어야 하고, 당신이 상대의 부제가 아니어야 합니다."
 tnt_err_people_pair:0 "이 조약은 스스로 모순됩니다. 봉신을 풀어 주면서 동시에 봉신을 받을 수는 없습니다."
 tnt_ai_offer_title:0 "[tnt_deal_partner.GetTitledFirstName]의 사절단"
 tnt_ai_offer_desc_a1:0 "[tnt_deal_partner.GetTitledFirstName]의 전령이 외투에 아직 길 먼지를 얹은 채 안내되어 들어와, 험하게 달려온 자다운 무뚝뚝함으로 곧장 본론을 꺼냅니다.\n\n그의 주군은 당신과 다툴 뜻이 없습니다. 그가 청하는 것은 맹세한 협약입니다. #high 10년#! 동안 어느 쪽도 상대에게 칼을 뽑지 않는다는 것입니다. 그리고 그 약속을 묶으려 돈을 가져왔습니다. 말은 값이 없다는 것을 그도 알기 때문입니다."
 tnt_ai_offer_desc_a2:0 "[tnt_deal_partner.GetTitledFirstName]은(는) 서기가 아니라 친족을 보냈고, 그 사실 자체가 이미 절반의 전언입니다.\n\n그가 내놓는 것은 맹세한 군사 동맹입니다. 당신의 깃발과 그들의 깃발을 함께 올리고, 전쟁이 닥치면 서로를 부를 수 있게 하자는 것입니다. 전쟁이 닥치리라는 것은 두 사람 모두 알고 있습니다."
 tnt_ai_offer_desc_a3:0 "[tnt_deal_partner.GetTitledFirstName]의 사절은 나직이 말하며, 저울에 달 수 있는 것은 아무것도 청하지 않습니다.\n\n그의 주군이 원하는 것은 당신의 말입니다. 갚아야 할 호의 하나를, 자기가 고른 때에 청구하겠다는 것입니다. 그런 빚은 언제나 가장 나쁜 순간에 거두어집니다. 바로 그 점이 그것을 사 둘 만한 것으로 만듭니다."
 tnt_ai_offer_desc_a9:0 "[tnt_deal_partner.GetTitledFirstName]은(는) 선물도 아첨도 보내지 않고, 다만 상기시킵니다.\n\n갚아야 할 호의가 있고, 사절은 그것이 지켜지는 것을 보러 왔습니다. 그가 탁자에 올리는 것은 청원이 아니라 셈입니다. 빚의 이름이 소리 내어 불리고, 아래의 조항이 그 빚을 갚을 것입니다."
 tnt_ai_offer_desc_a5:0 "[tnt_deal_partner.GetTitledFirstName]의 사절은 앉지 않으며, 이것이 국사인 척하지도 않습니다.\n\n그들의 가문과 그들의 충성에 속한 남녀가 당신의 지하 감옥에서 썩고 있습니다. 그들의 주군은 그들을 집으로 데려가고자 하며, 간수의 손실이 당신에게 아깝지 않을 만큼은 가져왔습니다."
 tnt_ai_offer_desc_a6:0 "이 사절단은 전령과 나팔과 줄지어 선 증인들을 거느리고 옵니다. [tnt_deal_partner.GetTitledFirstName]은(는) 여기서 무엇이 서명되든 온 세상이 보기를 바랍니다.\n\n요지는 #high 10년#!짜리 상호 협약이며, 그것을 사람들 앞에서 봉인하기 위해 그들의 주군은 모인 궁정 앞에서 자기 [prestige|E] 일부를 당신에게 내놓겠다고 합니다. 그렇게 요란하게 산 평화는 어느 쪽도 부인하기 어렵습니다."
 tnt_ai_offer_desc_a8:0 "[tnt_deal_partner.GetTitledFirstName]은(는) 국경과 돈에 관해 씁니다. 아래 조항에 이름이 오른 당신의 땅 가운데 그들의 깃발 아래 놓이는 편이 더 자연스러운 곳이 있고, 그들은 조용히 탐하기보다 정직하게 사들이려 합니다. 값은 남김없이 적혀 있고, 인장은 당신의 답을 기다립니다."
 tnt_ai_offer_desc_a10:0 "[tnt_deal_partner.GetTitledFirstName]은(는) 땅을 내놓습니다. 아래에 이름이 오른 그들의 영지 하나는 그들에게 이득보다 짐이며, 그 땅이 당신의 손에 있고 자기 금고가 무거워지는 편을 바랍니다. 당신에게 청하는 값은 조항 가운데 적혀 있습니다."
 tnt_ai_offer_desc_a11:0 "[tnt_deal_partner.GetTitledFirstName]은(는) 땅이 아니라 땅으로 가는 합법적인 길을 내놓습니다. 자기 작위 하나에 대한 명분을 문서로 써서 봉인해, 당신이 마음 내킬 때 행사하도록 넘기겠다는 것입니다. 법률가의 잉크는 병사의 피보다 쌉니다. 물론 공짜는 아니며, 아래 조항이 그것을 증언합니다."
 tnt_ai_offer_desc_a13:0 "[tnt_deal_partner.GetTitledFirstName]의 사절이 당신의 눈앞에서 가져온 보물의 덮개를 벗깁니다. 아래 조항에 이름이 오른, 그들의 전당에서 나온 물건입니다. 정직한 돈을 받고 내놓는 것입니다. 그런 물건은 전장을 건너기보다 탁자를 건너 새 주인을 만나는 편이 더 우아합니다."
 tnt_ai_offer_desc_a14:0 "[tnt_deal_partner.GetTitledFirstName]은(는) 영주가 좀처럼 양피지에 맡기지 않는 말을 적어 보냅니다. 무릎을 꿇을 뜻이 있다는 것입니다. 그들의 봉역은 당신의 보호 아래로, 그들의 깃발은 당신의 깃발 아래로 들어옵니다. 물론 대가가 있으며 아래 조항에 적혀 있습니다. 잘 헤아리십시오. 한번 맹세한 충성은 가볍게 거두어지지 않습니다."
 tnt_ai_offer_desc_a15:0 "[tnt_deal_partner.GetTitledFirstName]은(는) 당신의 화롯가에 한 자리를 청합니다. 자신을 위해서가 아니라, 아래에 이름이 오른 자기 아이를 당신의 궁정에서 기르게 해 달라는 것입니다. 그런 피후견인은 명예이자 두 가문을 잇는 끈입니다. 아이와 함께 오는 것은 조항에 적혀 있습니다."
 tnt_ai_offer_desc_a16:0 "나의 사절은 금화보다 값진 제안을 지니고 갑니다. 우리 두 가문을 하나로 잇읍시다. 내 피를 이은 사람 하나를 그대의 피를 이은 사람과 혼인시키겠으니, 두 혈통이 하나의 미래를 나누게 하십시오. 혼사는 아래에 적혀 있으니, 나의 어떤 거래를 저울질하듯 헤아려 보십시오."
 tnt_ai_offer_desc_a17:0 "[tnt_deal_partner.GetTitledFirstName]은(는) 자기 서약을 저울질해 보고 그것이 무겁다고 여긴 봉신으로서 씁니다.\n\n그는 당신의 충성 서약에서 풀려나기를 청합니다. 자기 깃발을 되찾고 자기 전당이 누구에게도 답하지 않기를 바랍니다. 그리고 그것을 거저 청하지는 않습니다. 그가 그 대가로 내려놓는 것은 아래 조항 가운데 있습니다. 돌려준 서약은 깨진 서약이 아니지만, 가볍게 돌려주는 것도 아닙니다."
 tnt_ai_offer_desc_a18:0 "[tnt_deal_partner.GetTitledFirstName]의 사절단은 빈손으로 오지 않았고, 가져온 것은 금화가 아닙니다.\n\n아래에 이름이 오른 그들 자신의 피를 이은 아이를 인질로 당신의 손에 맡깁니다. 그 아이가 당신의 지붕 아래 있는 동안 당신에게 한 말이 지켜지리라는 담보입니다. 그토록 값진 담보의 대가로 그들이 청하는 것은 조항에 적혀 있습니다."
 tnt_ai_offer_desc_a19:0 "[tnt_deal_partner.GetTitledFirstName]은(는) 당신의 궁정에 있는 한 사람의 이야기를 듣고 그를 원합니다.\n\n그는 아래에 이름이 올라 있습니다. 그들은 그 사람을 자기들의 봉사로 넘겨 달라고 청하며, 거저 얻으리라 기대하지 않습니다. 돈주머니가 조항 가운데 놓여 있습니다. 큰 전당에 신하 하나는 작은 일이지만, 그에게 매겨진 값은 작지 않습니다."
 tnt_ai_offer_desc_a20:0 "[tnt_deal_partner.GetTitledFirstName]은(는) 무릎을 꿇을 뜻이 있습니다. 다만 눈을 감고 꿇지는 않습니다.\n\n그들의 봉역은 아래 계약에 적힌 조건 아래 당신의 왕관으로 들어옵니다. 무엇을 당신에게 바칠 것인지, 무엇을 자기들 몫으로 지킬 것인지가 거기 있습니다. 공정한 값에 산 충성은 빼앗은 충성보다 오래갑니다. 봉인하기 전에 조항을 읽으십시오."
 tnt_ai_offer_desc_generic:0 "[tnt_deal_partner.GetTitledFirstName]의 사절이 안내되어 들어와 절하고, 봉인된 제안서를 탁자 위에 놓습니다. 조항은 그 주군이 손수 적어 아래에 있으며, 그는 당신의 답을 기다립니다."
 tnt_ai_offer_desc_outro:0 "\n\n#weak 당신의 외교관들이 당신이 쓰는 것과 같은 저울로 이것을 달아 보았습니다.#!"
 tnt_ai_goal_claim:0 "#weak 당신의 정보원이 귀띔합니다. 그 가문은 당신의 땅에 명분을 품고 있으며, 피보다 금화가 싸다고 여긴다는 것입니다.#!\n\n"
 tnt_ai_goal_dejure:0 "#weak 당신의 법관들이 확인해 줍니다. 문제의 땅은 오랜 권리로 그들의 왕관 쪽으로 기울어 있으며, 그들은 그것을 잊지 않았습니다.#!\n\n"
 tnt_ai_goal_kin:0 "#weak 까닭을 멀리서 찾을 것도 없습니다. 그들 자신의 피가 당신의 지하 감옥에 앉아 있습니다.#!\n\n"
 tnt_ai_goal_menaced:0 "#weak 국경의 병사들이 보고합니다. 더 강한 이웃이 그들의 땅 위로 어른거리고 있어 벗이 급히 필요하다는 것입니다.#!\n\n"
 tnt_ai_goal_rich:0 "#weak 당신의 상인들이 확실히 알고 있습니다. 그들의 금고는 쓸 곳을 찾는 금화로 신음하고 있습니다.#!\n\n"
 tnt_ai_goal_poor:0 "#weak 당신의 상인들이 수군댑니다. 그들의 금고는 텅 비었고 돈이 절실하다는 것입니다.#!\n\n"
 tnt_ai_goal_overdomain:0 "#weak 당신의 법관들이 짚어 냅니다. 그들은 한 손으로 마땅히 쥘 수 있는 것보다 많은 땅을 쥐고 있으며, 남는 땅은 살 사람을 찾고 있습니다.#!\n\n"
 tnt_ai_goal_heir:0 "#weak 그들의 궁정에서는 비밀도 아닙니다. 후계자는 나이가 찼고 혼인의 자리는 비어 있으니, 혼사가 필요합니다.#!\n\n"
 tnt_ai_goal_brood:0 "#weak 당신의 백성들이 우스갯소리를 합니다. 그 전당은 아이들로 넘쳐 나고, 하나하나에게 궁정과 식탁과 스승이 필요하다는 것입니다.#!\n\n"
 tnt_ai_goal_schemer:0 "#weak 당신의 정보원이 경고합니다. 그 궁정은 속삭임으로 지어졌고, 그 주인은 쓸 작정이 없는 약속은 결코 사지 않습니다.#!\n\n"
 tnt_ai_goal_yoke:0 "#weak 당신의 집사들이 그 집 하인들에게서 듣습니다. 그 가문에는 서약이 거북하게 얹혀 있고, 그 영주들은 옛 자유를 입에 올린다는 것입니다.#!\n\n"
 tnt_ai_goal_talent:0 "#weak 당신의 시종장이 까닭을 짚습니다. 그들의 전당에는 그런 재주를 가진 사람이 없고, 당신의 전당에는 있습니다.#!\n\n"
 tnt_ai_goal_surety:0 "#weak 당신의 사절들이 분명히 읽어 냅니다. 그들은 자기들의 신의를 당신이 의심할 수 없는 곳에 두려 하며, 그러기 위해 피를 담보로 내놓을 것입니다.#!\n\n"
 tnt_ai_goal_might:0 "#weak 국경의 병사들이 보고합니다. 그의 군세는 소집된 채 할 일 없이 머물고 있으며, 그는 당신의 징집병 수를 세고 있다고 합니다.#!\n\n"
 tnt_ai_goal_blank:0 ""
 tnt_ai_offer_opt_accept:0 "이 조항을 받아들인다"
 tnt_ai_offer_opt_counter:0 "교섭 탁자를 연다"
 tnt_ai_offer_counter_tt:0 "#high 상대의 조항이 이미 펼쳐진 채로 당신의 교섭 창을 엽니다.#! 무엇이든 바꾸고, 마음에 들지 않는 것은 지우고, 당신의 요구를 더해 조약을 다시 짜서 돌려보낼 수 있습니다. 제안하기를 누르기 전까지는 아무것도 약속되지 않습니다."
 tnt_ai_offer_opt_decline:0 "돌려보낸다"
 tnt_ai_offer_opt_hush:0 "돌려보내고, 더는 사절을 받지 않는다"
 tnt_ai_offer_hush_tt:0 "#high 10년#! 동안 어떤 영주도 조약을 들고 당신을 찾지 않습니다."
 tnt_ai_demand_title:0 "[tnt_deal_partner.GetTitledFirstName]의 요구"
 tnt_ai_demand_desc_a21:0 "[tnt_deal_partner.GetTitledFirstName]의 사절은 선물도 제안도 가져오지 않았습니다. 그는 액수를 말하고, 자기 주군이 직접 걷으러 올 구실을 주게 된다면 유감스러운 일이 될 것이라 덧붙입니다. 그러고는 선 채로 기다릴 뿐, 자리에 앉지 않습니다."
 tnt_ai_demand_desc_outro:0 "\n\n#weak 값을 치르면 치렀다는 사실이 세상에 알려질 것입니다. 돌려보내면 그 또한 알려질 것입니다.#!"
 tnt_ai_demand_opt_pay:0 "요구한 만큼 지불한다"
 tnt_ai_demand_pay_tt:0 "#high 돈이 세어 나가고 사절은 흡족한 얼굴로 떠납니다.#! 그의 이름은 그만큼 높아지고, 이 소식을 들은 자들은 그를 더 쉽게 두려워할 것입니다. 앞으로 15년 동안 그는 다시 요구하지 않습니다."
 tnt_ai_demand_opt_refuse:0 "빈손으로 돌려보낸다"
 tnt_ai_demand_refuse_tt:0 "#high 그는 아무것도 얻지 못합니다.#! 그러나 사절이 당신의 홀에 들어와 값을 부르고 답 없이 떠났습니다 — 궁정이 그것을 보았고, 당신의 위신은 그만큼 상합니다. 그의 이름도 상합니다. 거절당한 위협은 이미 재어진 위협이기 때문입니다. 앞으로 15년 동안 그는 다시 요구하지 않습니다."
 tnt_ai_demand_refuse_free_tt:0 "#high 그는 아무것도 얻지 못하고, 당신도 아무것도 잃지 않습니다.#! 당신의 군세는 더 이상 그가 세었던 그 군세가 아닙니다. 그의 이름은 그만큼 상하며, 앞으로 15년 동안 다시 요구하지 않습니다."
 tnt_ai_offer_row_alliance:0 "두 사람 사이에 맺는 군사 동맹"
 tnt_ai_offer_row_truce:0 "두 사람 사이의 10년 불가침 협약"
