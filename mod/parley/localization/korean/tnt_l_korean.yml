 rule_tnt_advanced_terms:0 "Parley: 고급 조항"
 setting_tnt_advanced_terms_on:0 "활성화"
 setting_tnt_advanced_terms_on_desc:0 "약혼과 작위 양도, 충성 서약을 교섭 탁자에서 거래할 수 있습니다. 이 규칙을 끄면 AI 영주가 편지로 혼인을 제안하는 일도 함께 사라집니다."
 setting_tnt_advanced_terms_off:0 "비활성화"
 setting_tnt_advanced_terms_off_desc:0 "약혼과 작위 양도, 충성 서약이 교섭 탁자에서 감춰집니다."
 rule_tnt_advanced_valuation:0 "Parley: 고급 조건 가치 평가"
 setting_tnt_advanced_valuation_classic:0 "기존"
 setting_tnt_advanced_valuation_classic_desc:0 "기존 상한을 포함하여 고급 조건의 원래 가격을 사용합니다. 기본 설정이며, 이 설정이 없는 이전 저장 파일에도 적용됩니다."
 setting_tnt_advanced_valuation_scaled:0 "규모 반영"
 setting_tnt_advanced_valuation_scaled_desc:0 "영토 및 통치자 이전 가치는 실제 영토와 개발도에, 인물 가치는 유용성과 정치적 중요성에 따라 달라집니다. 플레이어와 AI 모두에게 적용됩니다. 조건을 해제하거나 자원 거래 규칙을 바꾸지 않습니다."

 rule_tnt_trade_prestige:0 "Parley: 위신 거래"
 setting_tnt_trade_prestige_on:0 "사용 가능"
 setting_tnt_trade_prestige_on_desc:0 "모든 영주에게 위신을 제안하거나 요구할 수 있습니다. 플레이어와 AI에 같은 규칙이 적용됩니다."
 setting_tnt_trade_prestige_faith:0 "같은 신앙만"
 setting_tnt_trade_prestige_faith_desc:0 "위신은 같은 신앙을 믿는 영주 사이에서만 이전할 수 있습니다. 종교가 같다는 것만으로는 부족합니다. 플레이어와 AI에 같은 규칙이 적용됩니다."
 setting_tnt_trade_prestige_lower:0 "더 낮은 명예 단계만"
 setting_tnt_trade_prestige_lower_desc:0 "위신은 명예 단계가 더 높은 영주에게서 더 낮은 영주에게로만 이전할 수 있습니다. 같은 단계는 허용되지 않으며, 보유한 위신의 양은 관계없습니다. 플레이어와 AI에 같은 규칙이 적용됩니다."
 setting_tnt_trade_prestige_peer:0 "동급 이하만"
 setting_tnt_trade_prestige_peer_desc:0 "위신은 주는 쪽의 명예 단계가 받는 쪽 이상일 때만 이전할 수 있습니다. 반대 방향은 별도로 확인합니다. 플레이어와 AI에 같은 규칙이 적용됩니다."
 setting_tnt_trade_prestige_off:0 "비활성화"
 setting_tnt_trade_prestige_off_desc:0 "플레이어와 AI 모두 위신을 거래할 수 없습니다. 다른 자원에는 영향을 주지 않습니다."
 rule_tnt_trade_piety:0 "Parley: 신앙도 거래"
 setting_tnt_trade_piety_on:0 "사용 가능"
 setting_tnt_trade_piety_on_desc:0 "모든 영주에게 신앙도를 제안하거나 요구할 수 있습니다. 플레이어와 AI에 같은 규칙이 적용됩니다."
 setting_tnt_trade_piety_faith:0 "같은 신앙만"
 setting_tnt_trade_piety_faith_desc:0 "신앙도는 같은 신앙을 믿는 영주 사이에서만 이전할 수 있습니다. 종교가 같다는 것만으로는 부족합니다. 플레이어와 AI에 같은 규칙이 적용됩니다."
 setting_tnt_trade_piety_faith_lower:0 "같은 신앙: 낮은 헌신만"
 setting_tnt_trade_piety_faith_lower_desc:0 "신앙도는 같은 신앙을 믿는 영주 사이에서만, 더 높은 헌신 단계에서 더 낮은 단계로 이전할 수 있습니다. 단계가 같으면 이전할 수 없습니다. 현재 신앙도 수치가 아니라 헌신 단계를 비교하며, 협상 개시자와 관계없이 실제 이전 방향을 기준으로 판단합니다. 플레이어와 AI에 같은 규칙이 적용됩니다."
 setting_tnt_trade_piety_different_faith:0 "다른 신앙만"
 setting_tnt_trade_piety_different_faith_desc:0 "신앙도는 서로 다른 신앙을 믿는 영주 사이에서만 이전할 수 있습니다. 같은 종교 안의 다른 신앙도 포함됩니다. 플레이어와 AI에 같은 규칙이 적용됩니다."
 setting_tnt_trade_piety_religion:0 "같은 종교만"
 setting_tnt_trade_piety_religion_desc:0 "신앙이 달라도 두 영주의 종교가 같으면 신앙도를 이전할 수 있습니다. 플레이어와 AI에 같은 규칙이 적용됩니다."
 setting_tnt_trade_piety_off:0 "비활성화"
 setting_tnt_trade_piety_off_desc:0 "플레이어와 AI 모두 신앙도를 거래할 수 없습니다. 다른 자원에는 영향을 주지 않습니다."
 tnt_err_prestige_trade_rule:0 "게임 규칙상 이 방향으로 위신을 이전할 수 없습니다. 이 지불 항목을 제거하거나 거래를 다시 조정하십시오."
