 tnt_wed_row_line_matri:0 "[matrilineal|E]"
 tnt_wed_row_line_patri:0 "[patrilineal|E]"
 tnt_wed_row_line_tip:0 "이 부부의 자녀가 어느 가문으로 태어나는지 정합니다. 클릭하여 바꿉니다. #high [patrilineal|E]#!는 아버지의 가문에, #high [matrilineal|E]#!는 어머니의 가문에 자녀를 줍니다.\n\n#weak 조약의 모든 부부가 저마다 혈통을 지니며, 이 혈통이 당신이 그 부부의 대규모 결혼식을 주최할 수 있는지도 결정합니다.#!"
 tnt_wed_taper:0 "첫 쌍 다음의 부부는 앞의 쌍보다 상대에게 조금씩 덜 값어치가 있는 반면, 혼사가 상대에게 지우는 #high 부담#!, 곧 내주는 후계자와 넘겨주는 혈통은 결코 깎이지 않습니다.\n\n세 쌍은 홑 혼사 약 #high 2.7#!건의 값어치이며, 다섯 번째 쌍은 #high 0.6#!건밖에 더하지 못하고, 그 뒤로는 이득이 아예 늘지 않습니다.\n\n#weak 그러므로 잘 고른 두세 쌍이 억지로 채운 열두 쌍보다 낫습니다.#!"
 tnt_wed_grand:0 "대규모 결혼식 약속"
 tnt_wed_grand_desc:0 "이 혼사 가운데 하나를 큰 잔치로 기리겠다고 약속합니다. #high 기려지는 부부는 혼인이 아니라 약혼합니다#!. 그리고 상대는 그 명예 덕에 혼사를 훨씬 높이 칩니다.\n\n당신이 지는 몫은 이렇습니다. 당신은 주최를 약속한 사람이 되며, 그 약속은 몇 해 동안만 유효합니다. #high 혼례를 마련하고 손님을 부르고 그 모든 비용을 대는 일은 여전히 당신의 몫입니다#!. 아무것도 대신 준비되지 않으며, 당신이 치르기 전까지 두 사람은 약혼 상태로만 남습니다. 약속을 흘려보내면 어긴 말은 잊히지 않습니다.\n\n#weak 한 조약에서 한 쌍만 기릴 수 있고, 그 쌍은 당신의 친족이어야 하며, 우세한 혈통이 당신 쪽이어야 합니다.#!"
 tnt_wed_grand_couple:0 "[GetPlayer.MakeScope.Var('tnt_wed_principal').Char.GetShortUIName](와)과 [GetPlayer.MakeScope.Var('tnt_wed_principal').Char.MakeScope.Var('tnt_wed_partner').Char.GetShortUIName]에게 대규모 결혼식을 약속했습니다"
 tnt_wed_principal_tag:0 "대규모 결혼식"
 tnt_wed_set_principal_tip:0 "대규모 결혼식을 이 부부에게 옮깁니다. 한 조약에서 기릴 수 있는 부부는 하나뿐이며, 조약이 봉인되기 전까지 그 명예를 옮기는 데에는 아무 비용도 들지 않습니다."
 tnt_item_wed_dread:0 "당신에 대한 두려움"
 tnt_wed_dread_detail:0 "상대는 당신을 두려워합니다. 내주기는 쉽고, 스스로 혼인하기는 꺼립니다"
