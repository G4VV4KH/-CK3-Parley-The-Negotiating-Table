 tnt_hook_tier_0:0 "구실 없음"
 tnt_hook_tier_1:0 "약한 호의"
 tnt_hook_tier_2:0 "강한 호의"
 tnt_hook_tier_3:0 "영원한 호의"
 tnt_stepper_hook_tt:0 "#weak 왼쪽 클릭: 더 강한 호의. 오른쪽 클릭: 더 약한 호의.#!\n\n#weak 호의를 받게 될 쪽이 이미 호의를 지게 될 쪽에게 구실을 쥐고 있다면, 호의를 없음보다 위로 올릴 수 없습니다.#!"
 tnt_err_hook_taken_p:0 "상대가 이미 당신에게 호의를 쥐고 있습니다. 그것이 소진되기 전에는 두 번째를 약속할 수 없습니다."
 tnt_err_hook_taken_r:0 "당신이 이미 상대에게 호의를 쥐고 있습니다. 그것이 소진되기 전에는 두 번째를 약속할 수 없습니다."
 tnt_picker_title_contract:0 "충성 서약의 조건"
 tnt_btn_edit_contract:0 "서약의 조건을 손봅니다."
 tnt_ob_note_p:0 "무릎을 꿇는 쪽은 #high 당신#!입니다. 아래의 모든 조항이 당신과 당신의 후계자를 묶습니다."
 tnt_ob_note_r:0 "무릎을 꿇는 쪽은 #high 상대#!입니다. 아래의 모든 조항이 상대와 그 후계자를 묶습니다."
 tnt_ob_note_none:0 "아직 탁자에 서약이 없습니다. 어느 쪽 칸에서든 #high 충성 서약#!을 켜면 그 서약의 조건, 곧 세금과 징집병, 그리고 봉신이 지키는 권리를 당신이 쓰게 됩니다."
 tnt_ob_note_gov:0 "이 통치 형태에는 교섭할 [vassal_contract|E]이 없습니다. 세금과 징집병과 권리를 탁자에 올리는 것은 봉건 봉신뿐입니다."
 tnt_ob_reset_btn:0 "평범한 서약"
 tnt_ob_reset_tt:0 "모든 조항을 맨 충성 서약으로 되돌립니다. 보통 세금, 보통 징집병, 그리고 아래의 권리는 하나도 없습니다."
 tnt_ob_total_label:0 "이 조건의 값어치"
 tnt_ctx_contract:0 "충성 서약 조건: [GetPlayer.MakeScope.ScriptValue('tnt_ob_changed_value')|0]개 변경, 값어치 [GetPlayer.MakeScope.ScriptValue('tnt_ob_sheet_total_value')|0]"
 tnt_ob_group_obligations:0 "봉신이 바치는 것"
 tnt_ob_group_obligations_tt:0 "서약 자체에 딸린 두 가지 책무이며, 각각 전혀 없음부터 착취 수준까지 오르내립니다.\n\n#weak 손대기 전에는 둘 다 한가운데에 있으며, 그 한가운데가 곧 보통의 [vassal_contract|E]입니다.#!"
 tnt_ob_group_rights:0 "봉신이 지키는 것"
 tnt_ob_group_rights_tt:0 "주군이 한 조항씩 내주는 권리입니다.\n\n#weak 어느 것도 평범한 서약에 속하지 않으므로 아래의 모든 봉인은 양보입니다. 다만 마지막 하나는 주군이 주는 것이 아니라 가져가는 것입니다.#!"
 tnt_ob_status_default:0 "평범한 서약입니다. 바뀐 것이 없습니다."
 tnt_ob_status_changed:0 "변경됨: 아홉 조항 가운데 #high [GetPlayer.MakeScope.ScriptValue('tnt_ob_changed_value')|0]#!개."
 tnt_ob_tax_label:0 "세금"
 tnt_ob_tax_desc:0 "봉신이 매달 소득 가운데 얼마를 주군에게 바치는지 정합니다.\n\n#weak 사다리를 내리면 봉신이 더 많이 갖게 되니 무릎 꿇는 쪽에게 주는 선물이고, 올리면 주군이 더 많이 가져갑니다. 맨 충성 서약은 한가운데에 있습니다.#!"
 tnt_ob_tax_step_tt:0 "#weak 왼쪽 클릭: 한 칸. 오른쪽 클릭: 끝까지.#!"
 tnt_ob_tax_lvl0:0 "[GetSubjectContractType( 'feudal_government_taxes' ).GetObligationNameShortNoTooltip( 'feudal_tax_exempt' )]"
 tnt_ob_tax_lvl1:0 "[GetSubjectContractType( 'feudal_government_taxes' ).GetObligationNameShortNoTooltip( 'feudal_tax_low' )]"
 tnt_ob_tax_lvl2:0 "[GetSubjectContractType( 'feudal_government_taxes' ).GetObligationNameShortNoTooltip( 'feudal_tax_normal' )]"
 tnt_ob_tax_lvl3:0 "[GetSubjectContractType( 'feudal_government_taxes' ).GetObligationNameShortNoTooltip( 'feudal_tax_high' )]"
 tnt_ob_tax_lvl4:0 "[GetSubjectContractType( 'feudal_government_taxes' ).GetObligationNameShortNoTooltip( 'feudal_tax_extortionate' )]"
 tnt_ob_levy_label:0 "징집병"
 tnt_ob_levy_desc:0 "주군이 봉신의 징집병을 얼마나 일으킬 수 있는지 정합니다.\n\n#weak 사다리를 내리면 봉신이 병사를 집에 두고, 올리면 주군이 불러냅니다. 맨 충성 서약은 한가운데에 있습니다.#!"
 tnt_ob_levy_step_tt:0 "#weak 왼쪽 클릭: 한 칸. 오른쪽 클릭: 끝까지.#!"
 tnt_ob_levy_lvl0:0 "[GetSubjectContractType( 'feudal_government_levies' ).GetObligationNameShortNoTooltip( 'feudal_levies_exempt' )]"
 tnt_ob_levy_lvl1:0 "[GetSubjectContractType( 'feudal_government_levies' ).GetObligationNameShortNoTooltip( 'feudal_levies_low' )]"
 tnt_ob_levy_lvl2:0 "[GetSubjectContractType( 'feudal_government_levies' ).GetObligationNameShortNoTooltip( 'feudal_levies_normal' )]"
 tnt_ob_levy_lvl3:0 "[GetSubjectContractType( 'feudal_government_levies' ).GetObligationNameShortNoTooltip( 'feudal_levies_high' )]"
 tnt_ob_levy_lvl4:0 "[GetSubjectContractType( 'feudal_government_levies' ).GetObligationNameShortNoTooltip( 'feudal_levies_extortionate' )]"
 tnt_ob_relig_label:0 "종교 보호"
 tnt_ob_relig_desc:0 "봉신이 자기 신앙을 평온히 지킬 수 있습니다. 주군에 대한 의견 #high +5#!, 자기 백작령에서의 의견 #high +5#!, 그리고 믿는 바를 이유로 결코 박해받지 않습니다.\n\n#weak 이 문서에서 가장 값진 권리이지만, 두 사람의 신앙이 다르지 않으면 아무 의미도 없습니다.#!"
 tnt_ob_council_label:0 "자문회 의석 보장"
 tnt_ob_council_desc:0 "봉신이 주군의 자문회 의석을 요구할 수 있으며 거절당하지 않습니다. 주군에 대한 의견 #high +5#!.\n\n#weak 약속으로 넘어간 의석을 못마땅해하는 권세 봉신들에게서 주군은 의견 2를 잃습니다.#!"
 tnt_ob_revoke_label:0 "작위 박탈 불가"
 tnt_ob_revoke_desc:0 "주군이 봉신의 작위를 거두어들일 권리를 포기합니다. 주군에 대한 의견 #high +5#!.\n\n#weak 여기서 주군이 내놓는 것은 기강을 세우는 통상의 수단입니다.#!"
 tnt_ob_war_label:0 "자유로운 선전포고"
 tnt_ob_war_desc:0 "봉신이 전쟁에 관한 주군의 규칙에 더는 매이지 않습니다. 주군에 대한 의견 #high +5#!.\n\n#weak 그렇게 시작한 전쟁도 여전히 봉신 자신이 이기거나 지는 전쟁입니다.#!"
 tnt_ob_fort_label:0 "축성 권리"
 tnt_ob_fort_desc:0 "봉신이 성을 더 싸게 짓고 모든 요새를 한 단계 높게 유지합니다.\n\n#weak 주군은 이 계약이 낳는 세금의 10분의 1을 잃으며, 주군의 [culture|E]가 #high $innovation_battlements$#!을 이미 열어 두어야 합니다.#!"
 tnt_ob_coin_label:0 "주화 발행권"
 tnt_ob_coin_desc:0 "봉신이 자기 주화를 찍습니다. 수도 [county|E]에서 월 [development|E] #high +0.3#!.\n\n#weak 주군은 그 대가로 자기 개발도 성장의 2%를 잃으며, 주군의 [culture|E]가 #high $innovation_currency_02$#!을 이미 열어 두어야 합니다.#!"
 tnt_ob_succ_label:0 "분할 상속 강제"
 tnt_ob_succ_desc:0 "#N 이 조항은 봉신이 아니라 주군에게 유리합니다.#! 봉신이 분할 상속에 묶여 결코 법으로 빠져나갈 수 없게 됩니다. 주군에 대한 의견 #high -5#!.\n\n#weak 이것을 표시하면 저울이 반대쪽으로 움직입니다. 주는 것이 아니라 가져가는 것이기 때문입니다.#!"
 tnt_ob_req_feudal:0 "세금과 징집병과 권리를 교섭할 수 있는 것은 봉건 봉신뿐입니다. 먼저 두 칸 가운데 하나에서 #high 충성 서약#!을 켜십시오."
 tnt_ob_req_relig:0 "이것이 무언가를 지키려면 두 사람의 신앙이 서로 달라야 합니다."
 tnt_ob_req_fort:0 "주군의 문화가 #high $innovation_battlements$#! 혁신을 열어 두어야 합니다."
 tnt_ob_req_coin:0 "주군의 문화가 #high $innovation_currency_02$#! 혁신을 열어 두어야 합니다."
 tnt_ob_req_succ:0 "봉신이 #high $confederate_partition_succession_law$#! 승계법을 유지할 수 있어야 합니다."
 tnt_ob_req_revoke:0 "주군의 신앙이 다른 신앙을 가진 자에게 세금을 물리고 두 사람의 신앙이 서로 다른 동안에는 안 됩니다."
 tnt_ob_tt_tax_exempt:0 "[vassal_contract|E]이 [GetSubjectContractType( 'feudal_government_taxes' ).GetObligationName( 'feudal_tax_exempt' )](으)로 시작합니다"
 tnt_ob_tt_tax_extortionate:0 "[vassal_contract|E]이 [GetSubjectContractType( 'feudal_government_taxes' ).GetObligationName( 'feudal_tax_extortionate' )](으)로 시작합니다"
