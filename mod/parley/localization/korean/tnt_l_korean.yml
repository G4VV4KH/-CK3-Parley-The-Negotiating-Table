 tnt_ai_offer_row_influence_p:0 "상대가 당신에게 요구: [influence_i] [GetPlayer.MakeScope.Var('tnt_influence_p').GetValue|0]"
 tnt_ai_offer_row_hook_p:0 "상대는 당신이 [hook_i] 호의를 하나 빚기를 요구합니다"
 tnt_ai_offer_row_prisoners_p:0 "상대는 자기 친족과 봉신을 당신의 지하 감옥에서 풀어 주기를 요구합니다"
 tnt_ai_offer_row_title_p:0 "상대가 당신의 땅을 사려 합니다. 아래에 이름이 있습니다 (작위: [GetPlayer.MakeScope.ScriptValue('tnt_count_sel_title_p_value')|0]개)"
 tnt_ai_offer_row_title_r:0 "상대가 자기 땅을 내놓습니다. 아래에 이름이 있습니다 (작위: [GetPlayer.MakeScope.ScriptValue('tnt_count_sel_title_r_value')|0]개)"
 tnt_ai_offer_row_claim_r:0 "상대가 자기 땅에 대한 명분을 내놓습니다. 아래에 이름이 있습니다 (선택: [GetPlayer.MakeScope.ScriptValue('tnt_count_sel_claim_r_value')|0]개)"
 tnt_ai_offer_row_artifact_r:0 "상대가 자기 전당의 보물을 내놓습니다. 아래에 이름이 있습니다 (선택: [GetPlayer.MakeScope.ScriptValue('tnt_count_sel_artifact_r_value')|0]개)"
 tnt_ai_offer_row_vassal_r:0 "상대가 충성을 맹세하고 당신의 봉신이 되겠다고 합니다"
 tnt_ai_offer_row_ward_r:0 "상대가 자기 아이 [GetPlayer.MakeScope.Var('tnt_ward_r').Char.GetUINameNoTooltip](을)를 당신의 궁정에서 기르도록 내놓습니다"
 tnt_ai_offer_row_indep_p:0 "상대는 자신을 충성 서약에서 풀어 주기를 요구합니다"
 tnt_ai_offer_row_hostage_r:0 "상대가 자기 친족 [GetPlayer.MakeScope.Var('tnt_hostage_r').Char.GetUINameNoTooltip](을)를 인질로 당신의 손에 맡깁니다"
 tnt_ai_offer_row_courtier_p:0 "상대가 당신 궁정의 사람을 자기 봉사로 데려가려 합니다. 아래에 이름이 있습니다 (선택: [GetPlayer.MakeScope.ScriptValue('tnt_count_sel_courtier_p_value')|0]명)"
 tnt_ai_offer_row_contract:0 "상대가 바라는 대로 쓰인 충성의 계약 (변경된 조항: [GetPlayer.MakeScope.ScriptValue('tnt_ob_changed_value')|0]개):"
 tnt_ai_offer_row_marriage:0 "두 가문 사이의 혼인이 제안되었습니다:"
 tnt_ai_offer_row_usehook_r:0 "상대가 당신이 진 [hook_i] 호의를 청구합니다"
 tnt_ai_offer_row_word_kept:0 "상대는 이제 이 거래가 내키지 않지만, 스스로 내놓은 것이므로 지킬 것입니다"
 tnt_ai_gift_line:0 "높은 호의에서 보낸 것입니다. 내놓은 조항이 그 대가로 청하는 것보다 값집니다. 이 편지는 의도된 선물입니다."
 tnt_refuse_envoys_decision:0 "사절 접견 중단"
 tnt_refuse_envoys_decision_desc:0 "모든 길과 모든 항구에 조용히 말이 돌았습니다. 이 궁정은 이제 조약을 들고 오는 자의 말을 듣지 않습니다. 제안이 있는 영주는 그것을 품고 있으면 됩니다. 당신의 사절은 전과 같이 길을 떠납니다. 문은 안쪽에서 걸렸고, 빗장은 당신의 손에 있습니다."
 tnt_refuse_envoys_decision_tooltip:0 "당신이 달리 말하기 전까지 어떤 영주도 조약을 들고 당신을 찾지 않습니다. 당신이 직접 여는 교섭은 그대로입니다."
 tnt_refuse_envoys_decision_confirm:0 "문을 걸어 잠근다"
 tnt_refuse_envoys_decision_effect_tt:0 "이 결정을 되돌리기 전까지 어떤 영주도 조약을 들고 당신을 찾지 않습니다."
 tnt_accept_envoys_decision:0 "사절 접견 재개"
 tnt_accept_envoys_decision_desc:0 "빗장이 풀리고 문지기들은 물러서라는 말을 듣습니다. 조약을 들고 오는 자들이 다시 안내되어 들어오고, 그 인장은 뜯기지 않은 채, 그 제안은 예전과 같은 저울에 오릅니다."
 tnt_accept_envoys_decision_tooltip:0 "조약을 실은 사절단이 오늘부터 다시 당신의 궁정에 닿을 수 있습니다."
 tnt_accept_envoys_decision_confirm:0 "문을 연다"
 tnt_accept_envoys_decision_effect_tt:0 "조약 제안을 실은 사절단이 다시 당신의 궁정에 닿을 수 있습니다. 예전의 침묵이 끝났을 때가 아니라 당장부터입니다."
 decision_group_type_tnt_uninstall:0 "모드 제거 결단"
 tnt_uninstall_decision:0 "교섭 탁자를 치운다"
 tnt_uninstall_decision_desc:0 "사절들은 해산하고 장부는 불태우며 탁자 자체를 전당 밖으로 내갑니다. 모드를 제거하기 직전에 이 결정을 내리십시오. Parley가 이 세계에 남긴 모든 흔적을 저장 파일에서 쓸어냅니다. 답하지 않은 편지와 짓다 만 교섭은 무효가 되고, 이미 맺어진 조약은 모두 그대로 남습니다."
 tnt_uninstall_decision_tooltip:0 "이 저장 파일을 Parley: The Negotiating Table 없이 플레이할 수 있도록 준비합니다. 이 모드가 세계의 모든 인물에게 쓴 변수와 구실과 의견 수정치를 모두 제거합니다. 이미 맺어진 거래, 곧 혼인과 넘겨준 작위와 충성 서약은 건드리지 않습니다."
 tnt_uninstall_decision_confirm:0 "깨끗이 쓸어낸다"
 tnt_uninstall_decision_effect_tt:0 "Parley가 쓴 모든 변수와 목록, 인물 표식, 구실, 의견 수정치가 세계의 모든 인물에게서 제거됩니다. 답하지 않은 제안 편지와 짓다 만 교섭은 모두 무효가 됩니다. 게임을 저장한 다음 모드를 끄십시오. 그러면 저장 파일에 Parley의 흔적은 남지 않습니다."
 tnt_ai_msg_treaty:0 "조약이 맺어졌습니다"
 tnt_ai_msg_tt_truce:0 "두 사람이 금화로 10년의 평화를 샀습니다."
 tnt_ai_msg_tt_ally:0 "두 사람이 금화로 군사 동맹을 샀습니다."
 tnt_ai_msg_tt_hook:0 "이제 한쪽이 다른 쪽에게 호의를 빚졌습니다. 금화로 산 것입니다."
 tnt_ai_msg_tt_hookcall:0 "빚이 청구되었습니다. 둘 가운데 하나가 다른 쪽에게 [hook|E]을 쥐고 있었고, 금화로 거두었습니다."
 tnt_ai_msg_tt_ultimatum:0 "금화가 한쪽으로만 건너갔습니다. 둘 가운데 약한 쪽이 건드리지 말라며 값을 치렀습니다."
 tnt_ai_msg_tt_title:0 "땅이 금화를 받고 주인을 바꾸었습니다. 두 영주 가운데 하나가 다른 쪽에게서 백작령을 사들였습니다."
 tnt_ai_msg_tt_vassal:0 "한 봉역이 무릎을 꿇었습니다. 약한 영주가 금화와 보호를 받고 강한 영주에게 충성을 맹세했습니다."
 tnt_ai_msg_tt_submission:0 "한 봉역이 위협에 굴복했습니다. 압도적으로 강한 영주가 더 약한 독립 이웃에게 대가 없이 충성을 맹세하도록 강요했습니다."
 tnt_ai_msg_tt_artifact:0 "보물이 금화를 받고 주인을 바꾸었습니다. 두 영주 가운데 하나가 다른 쪽의 전당에서 물건 하나를 사들였습니다."
 tnt_ai_msg_tt_wed:0 "두 가문이 이어졌습니다. 두 영주가 친족 사이의 혼인에 합의했고, 금화 지참금이 함께 갔습니다."
 rule_tnt_ai_treaties:0 "Parley: AI 사이의 조약"
 setting_tnt_ai_treaties_off:0 "비활성화"
 setting_tnt_ai_treaties_off_desc:0 "AI 영주들은 당신 몰래 서로 조약을 맺지 않습니다.\n\n#weak 비용은 전혀 들지 않습니다. 한 해에 조회 한 번이면 그것으로 끝입니다. AI는 여전히 #high 당신#!과는 흥정할 수 있습니다.#!"
 setting_tnt_ai_treaties_rare:0 "가끔"
 setting_tnt_ai_treaties_rare_desc:0 "이웃한 AI 영주들이 이따금 서로 흥정을 맺습니다. 지도 전체에서 한 해에 몇 건 정도입니다.\n\n금화와 빚진 호의, 청구된 빚, 최후통첩, 유물이 이렇게 거래됩니다. 이미 사이가 좋은 당사자끼리는 국경의 백작령이 제값에 팔리거나, 약한 이웃이 충성을 맹세하는 대가를 받기도 합니다. 압도적으로 강한 왕이나 황제는 대신 위협으로 더 약한 독립 이웃에게 충성을 강요할 수 있습니다. #high 가문 사이의 혼인도 조용히 거래되며, 아무에게도 먼저 묻지 않습니다.#! 당신과 국경을 맞대거나 동맹이거나 싸우고 있는 누군가가 얽힌 조약이면 당신에게 알려집니다."
 setting_tnt_ai_treaties_common:0 "자주"
 setting_tnt_ai_treaties_common_desc:0 "가끔의 약 세 배 빈도이며, 궁정들이 늘 이야기를 나누는 지도를 위한 설정입니다.\n\n거래할 수 있는 조항은 같고, 영주 한 명당 3년 제한도 같으므로 걷잡을 수 없이 늘어나지는 않습니다.\n\n#weak 기본값입니다.#!"
 rule_tnt_ai_offer_rate:0 "Parley: 당신에게 오는 제안"
 setting_tnt_ai_offer_rate_off:0 "없음"
 setting_tnt_ai_offer_rate_off_desc:0 "어떤 영주도 자기 조약을 들고 당신에게 편지를 쓰지 않습니다.\n\n#weak 당신은 여전히 누구와도 직접 교섭을 열 수 있고, 해당 규칙이 허락한다면 AI 영주끼리는 계속 거래합니다.#!"
 setting_tnt_ai_offer_rate_rare:0 "드물게"
 setting_tnt_ai_offer_rate_rare_desc:0 "편지는 어쩌다 한 번만 옵니다. 사절과 사절 사이에 여러 해의 침묵을 각오하십시오.\n\n#weak 청하는 쪽이 당신이기를 바라는 게임을 위한 설정입니다.#!"
 setting_tnt_ai_offer_rate_normal:0 "보통"
 setting_tnt_ai_offer_rate_normal_desc:0 "이웃은 많아야 한 해에 한 번 당신에게 편지를 쓰고, 영주마다 다음 제안을 짜기까지 3년을 기다립니다."
 setting_tnt_ai_offer_rate_frequent:0 "자주"
 setting_tnt_ai_offer_rate_frequent_desc:0 "사절이 한 해에도 여러 번 찾아오고, 영주들이 훨씬 빨리 당신을 다시 떠올립니다.\n\n모든 제안은 여전히 교섭 창에서 보는 것과 같은 저울로 값이 매겨지므로, 분주한 지도가 곧 후한 지도라는 뜻은 아닙니다.\n\n#weak 기본값입니다.#!"
 setting_tnt_ai_offer_rate_test:0 "시험용: 매우 자주"
 setting_tnt_ai_offer_rate_test_desc:0 "#N 플레이가 아니라 모드를 시험하기 위한 설정입니다.#! 대기 기간이 몇 주로 줄어들어, 시작한 지 몇 달 안에 제안이 닿을 것입니다.\n\n#weak 편지가 작동하는지 확인한 뒤 규칙을 자주로 되돌리십시오.#!"
 rule_tnt_ai_telemetry:0 "Parley: 진단 기록"
 setting_tnt_ai_telemetry_off:0 "끔"
 setting_tnt_ai_telemetry_off_desc:0 "진단 기록을 남기지 않습니다. 플레이할 때에는 이것이 맞습니다.\n\n#weak 기본값이며 비용이 없습니다. 줄이 쓰였을 자리마다 규칙 조회 한 번이 있을 뿐입니다.#!"
 setting_tnt_ai_telemetry_on:0 "켬"
 setting_tnt_ai_telemetry_on_desc:0 "AI 영주가 조약에 관해 내리는 판단마다 #high error.log#!에 한 줄을 씁니다. 누구를 살폈는지, 탁자에 무엇을 올렸는지, 거래를 얼마로 매겼는지, 그리고 #high 왜 물러섰는지#!를 남깁니다.\n\n게임 반년마다 약 600에서 1600줄입니다. 게임 진행에는 아무 영향도 없습니다.\n\n#weak 오래 방치하는 실행 전에 켜 두었다가 기록을 넘겨 읽게 하십시오.#!"
 setting_tnt_ai_telemetry_verbose:0 "상세"
 setting_tnt_ai_telemetry_verbose_desc:0 "켬과 같고, 더하여 AI 사이의 주사위를 굴리기 전에 AI 영주마다 해마다 한 줄을 더 씁니다.\n\n수천 줄이 더 늘어납니다. 이것으로 얻는 단 하나는 #high 파동이 아예 돌지 않은 것#!과 #high 돌았는데 주사위가 아니라고 한 것#!을 구별하는 일입니다.\n\n#weak 짧은 확인 실행에만 쓰십시오.#!"
 rule_tnt_threat_frequency:0 "Parley: 위협 빈도"
 setting_tnt_threat_frequency_unlimited:0 "0년"
 setting_tnt_threat_frequency_unlimited_desc:0 "서로 다른 영주를 위협할 때 추가 대기 시간이 없습니다. 기본 설정입니다. 같은 영주를 15년 동안 다시 위협할 수 없는 기존 제한은 플레이어와 AI 모두에게 계속 적용됩니다."
 setting_tnt_threat_frequency_1_year:0 "1년"
 setting_tnt_threat_frequency_1_year_desc:0 "위협을 사용한 영주는 이후 1년 동안 누구도 위협할 수 없습니다. 플레이어와 AI에 똑같이 적용됩니다. 같은 영주를 15년 동안 다시 위협할 수 없는 기존 제한도 유지됩니다."
 setting_tnt_threat_frequency_5_years:0 "5년"
 setting_tnt_threat_frequency_5_years_desc:0 "위협을 사용한 영주는 이후 5년 동안 누구도 위협할 수 없습니다. 플레이어와 AI에 똑같이 적용됩니다. 같은 영주를 15년 동안 다시 위협할 수 없는 기존 제한도 유지됩니다."
 setting_tnt_threat_frequency_10_years:0 "10년"
 setting_tnt_threat_frequency_10_years_desc:0 "위협을 사용한 영주는 이후 10년 동안 누구도 위협할 수 없습니다. 플레이어와 AI에 똑같이 적용됩니다. 같은 영주를 15년 동안 다시 위협할 수 없는 기존 제한도 유지됩니다."
 tnt_err_threat_cooldown:0 "최근 위협을 사용했으므로 위협 대기 시간이 끝날 때까지 누구도 위협할 수 없습니다."
 rule_tnt_threat_scale:0 "Parley: 위협 강도"
 setting_tnt_threat_scale_rare:0 "약함"
 setting_tnt_threat_scale_rare_desc:0 "계수 N = 2.5. 모든 위협에는 #high 거래 점수 최소 100점#!이 필요합니다. 위신과 공포가 같다면 병력 비율 41:1이 필요합니다.\n\n#weak 위신과 공포가 높을수록 필요한 병력 우위는 줄어듭니다. 위신 단계가 대상보다 한 단계 낮으면 위협의 가치는 0이 됩니다. 플레이어와 AI에 같은 규칙이 적용됩니다.#!"
 setting_tnt_threat_scale_normal:0 "보통"
 setting_tnt_threat_scale_normal_desc:0 "계수 N = 5. 모든 위협에는 #high 거래 점수 최소 100점#!이 필요합니다. 위신과 공포가 같다면 최소 병력 비율은 #high 21:1#!입니다.\n\n위신과 공포가 높을수록 필요한 병력 우위는 줄어듭니다. 위신 단계가 대상보다 한 단계 낮으면 위협의 가치는 0이 됩니다.\n\n#weak 기본 설정입니다. 플레이어와 AI에 같은 규칙이 적용됩니다.#!"
 setting_tnt_threat_scale_frequent:0 "강함"
 setting_tnt_threat_scale_frequent_desc:0 "계수 N = 7.5. 모든 위협에는 여전히 #high 거래 점수 최소 100점#!이 필요합니다.\n\n#weak 위신과 공포가 높을수록 필요한 병력 우위는 줄어듭니다. 위신 단계가 대상보다 한 단계 낮으면 위협의 가치는 0이 됩니다. 플레이어와 AI에 같은 규칙이 적용됩니다.#!"
 setting_tnt_threat_scale_constant:0 "매우 강함"
 setting_tnt_threat_scale_constant_desc:0 "계수 N = 10. 모든 위협에는 #high 거래 점수 최소 100점#!이 필요합니다. 위신과 공포가 같다면 최소 병력 비율은 #high 11:1#!입니다.\n\n#weak 위신과 공포가 높을수록 필요한 병력 우위는 줄어듭니다. 위신 단계가 대상보다 한 단계 낮으면 위협의 가치는 0이 됩니다. 플레이어와 AI에 같은 규칙이 적용됩니다.#!"
 tnt_mutual_header:0 "두 사람 사이"
 tnt_bd_domain_p:0 "상대의 직할령 한계를 넘는 작위, 상대에게 값어치가 낮음"
 tnt_bd_domain_r:0 "당신의 직할령 한계를 넘는 작위, 당신에게 값어치가 낮음"
 tnt_tt_step_huge_add:0 "한 번에 큰 액수를 더합니다.\n\n#weak 금화와 위신과 신앙도는 클릭당 1000. 영향력은 250입니다. 영향력 자체가 1000을 넘지 않기 때문입니다.#!"
 tnt_tt_step_huge_sub:0 "한 번에 큰 액수를 뺍니다.\n\n#weak 금화와 위신과 신앙도는 클릭당 1000. 영향력은 250입니다. 영향력 자체가 1000을 넘지 않기 때문입니다.#!"
 tnt_preset_open:0 "…"
 tnt_tt_preset_open:0 "한 번의 클릭으로 액수를 정합니다.\n\n#weak 관례적인 액수, 지닌 것의 절반, 감당할 수 있는 전부, 또는 아예 없음 가운데 고릅니다.#!"
 tnt_preset_menu_header:0 "얼마나?"
 tnt_preset_std_gold:0 "한 해 수입"
 tnt_preset_std_gift:0 "관례적인 선물"
 tnt_preset_half:0 "절반"
 tnt_preset_max:0 "낼 수 있는 전부"
 tnt_preset_max_r:0 "상대가 낼 수 있는 전부"
 tnt_preset_none:0 "없음"
 tnt_tt_preset_std_gold:0 "한 해 수입만큼 내놓습니다.\n\n#weak 실제로 국고에 있는 만큼으로 제한됩니다.#!"
 tnt_tt_preset_std_gift:0 "이만한 호의에 관례적인 액수, 곧 그만한 격의 영주가 기대하는 만큼을 내놓습니다.\n\n#weak 실제로 지닌 만큼으로 제한됩니다. 위신과 신앙도와 영향력에는 연간 수입이 없으므로, 내놓을 한 해 치라는 것도 없습니다.#!"
 tnt_tt_preset_half:0 "지닌 것의 절반을 내놓습니다."
 tnt_tt_preset_max:0 "감당할 수 있는 전부를 내놓습니다."
 tnt_tt_preset_none:0 "이 자원을 탁자에서 내립니다."
 tnt_autobalance_btn:0 "자동 균형"
 tnt_tt_autobalance:0 "상대가 겨우 받아들일 만한 지점이 될 때까지 탁자 위의 금화와 위신과 신앙도와 영향력을 조정합니다.\n\n양방향으로 작동합니다. 상대가 거절할 제안은 달게 만들고, #high 너무 쉽게 받아들일 제안은 깎아 내므로#! 결코 과하게 치르지 않습니다.\n\n#weak 그 밖에는 아무것도 더하지 않습니다. 땅도 명분도 혼사도 호의도 더하지 않으며, 실제로 치를 수 있는 것보다 많이 내놓는 일도 없습니다.#!"
 tnt_ab_state_balanced:0 "#P 균형을 맞췄습니다.#! 제안이 이제 상대가 받아들일 범위 안에 겨우 들어왔습니다."
 tnt_ab_state_minimal:0 "이미 최소입니다. 바꿀 것이 없었습니다."
 tnt_ab_state_unreachable:0 "#N 손이 닿지 않습니다.#! 당신이 치를 수 있는 전부를 얹어도 상대는 여전히 거절합니다."
 tnt_ab_state_closest:0 "수락 가능한 제안입니다. 사용 가능한 자원으로는 자동 균형 조정이 정확히 +1에 도달하지 못했습니다."
 tnt_ab_lumpy_hint:0 "다시 누르면 계속 더합니다. 이 단추가 더했다가 당신이 빼 버린 것은 다시 내놓지 않습니다."
 tnt_ab_lumpy_line:0 "상대의 지갑이 비어 있어, 마지막으로 누를 때에는 상대 쪽 탁자에서 조항을 가져왔습니다. 땅이거나, 명분이거나, 상대의 충성입니다."
 tnt_stage_marriage_interaction:0 "조약에 혼사 더하기"
 tnt_stage_marriage_send:0 "이 혼사를 조약에 더한다"
 tnt_stage_marriage_prompt:0 "#high 충분히 가까운 혼사는 이제 동맹까지 함께 가져옵니다#! ― 게임이 스스로 주선한 혼인에 주는 것과 같은 동맹이, 조약을 봉인한 날에 맺어집니다."
 tnt_stage_no_alliance_tt:0 "#high 이 조약에 적어 넣은 혼사는 이제 동맹을 만듭니다.#! 이는 이 모드의 규칙이 아니라 게임 자체의 규칙입니다. 게임은 두 사람이 각각 그를 내주는 영주와 얼마나 가까운 혈연인지를 따지고, 양쪽 모두 충분히 가깝다면 조약이 봉인되는 순간 당신과 그는 동맹이 됩니다. 게임 자체의 #high $arrange_marriage_interaction$#!이 예부터 해 온 것과 똑같습니다. 이 탁자에서 [alliances|E]을 사는 사람은 없습니다. 그런 조항은 문서에 없고 앞으로도 없을 것입니다. 동맹은 그저 혼인에 딸려 옵니다.\n\n#weak 그러므로 이 창에서 게임이 스스로 그리는 동맹 표시는 다시 믿어도 됩니다. 후보 옆의 「잠재적 동맹」 세기 막대와 그 옆의 작은 왕관 달린 문장 말입니다. 둘 다 후보 목록 안에 있고, 목록은 두 초상을 고르는 순간 화면에서 사라지므로 당신이 이 글을 읽을 때에는 그런 것이 남아 있지 않습니다. 그러나 이 문단 바로 위에 찍힌 판정이 눈앞의 두 사람에 대해 답해 주며, 그것은 예측이 아니라 게임 자체의 답입니다.#!\n\n#weak 동맹은 부부 자신에게 기댑니다. 그러므로 그들의 혼사가 이어지는 동안 이어지고, 혼사가 끝나면 게임 자체의 장치로 함께 끝납니다. 둘 중 하나가 아직 아이라면 그 쌍은 혼인이 아니라 약혼이 되며, 동맹은 첫날부터 그 약혼 위에 섭니다. 하나의 조약은 여러 쌍을 담을 수 있고, 각 쌍은 저마다 따로 판정됩니다.#!"
 tnt_stage_alliance_opens_tt:0 "#high 이 혼사는 당신과 그 사이에 동맹을 「만듭니다」.#! 나중에 두드릴 문이 아니라 동맹 그 자체이며, 조약이 봉인되는 날, 이 두 사람이 혼인하거나 약혼하는 순간에 생깁니다. 이는 게임 자체의 규칙이며, 게임의 #high $arrange_marriage_interaction$#!이 따르는 바로 그 규칙입니다. 게임은 두 사람이 각각 그를 내주는 영주와 얼마나 가까운 혈연인지를 따지는데, 이 쌍은 양쪽 모두 충분히 가깝습니다. 당신에게 더 요구되는 것은 없고, 그도 거절할 수 없습니다. 동맹은 조약과 함께 옵니다.\n\n#high 그 값은 조약 점수로 [SCOPE.ScriptValue('tnt_stage_alliance_offer_value')|+=0]이며, 위에 찍힌 이 혼사의 숫자에 「이미 포함되어」 있습니다. 두 번 더하지 마십시오.#! 조약은 동맹의 값을 한 번만 치릅니다. 이미 탁자에 오른 쌍이 동맹을 열었다면 이 쌍은 값에 아무것도 더하지 않고, 협약이 기대는 두 번째 이유가 됩니다."
 tnt_stage_alliance_shut_tt:0 "#high 이 혼사는 동맹을 만들지 않습니다.#! 게임은 두 사람이 각각 그를 넘겨주는 영주와 얼마나 가까운 혈연인지를 재고, 두 거리를 더한 다음, 그 합이 작을 때에만 동맹을 허락합니다. 궁정인끼리의 혼인은 이 탁자의 누구와도 혈연을 맺지 못하므로 그런 쌍은 아무도 동맹시키지 못하며, 당신의 홀에서 고른 낯선 이도 마찬가지입니다. 당신의 핏줄을 그의 핏줄과 맺어 주십시오. 자녀, 손자녀, 형제자매, 부모 말입니다. 아니면 당신이 몸소 제단에 서십시오. 그러면 합은 게임이 정한 한계 안에 들어옵니다. 이는 게임 자체의 #high $arrange_marriage_interaction$#!을 다스리는 것과 같은 규칙이며, 양쪽을 동시에 잽니다. 당신 쪽의 가까운 선택이 그쪽의 먼 선택을 메워 주지는 못합니다."
 tnt_stage_alliance_already_tt:0 "#high 당신은 이미 그와 동맹을 맺고 있으므로, 이 혼사는 새로운 협약을 열지 않습니다.#! 이미 맺고 있는 협약을 두 번 맺을 수는 없습니다. 이 혼사 위에 동맹 몫의 조약 점수가 더해지지 않으며, 조약이 그 값을 당신에게 물리지도 않습니다. 두 사람의 핏줄이 게임 자체의 규칙을 만족할 만큼 가깝다면, 그 혼인은 당신이 이미 가진 동맹이 기대는 또 하나의 이유로 적힐 뿐입니다. 그만큼 가깝지 않다면 동맹은 있던 그대로 남습니다. 어느 쪽이든 혼사 자체는 위에 찍힌 점수만큼의 값을 그대로 지니며, 당신과 그 사이의 협약도 손대지 않은 채로 남습니다."
 actor_secondary_tnt_stage_marriage_interaction:0 "당신 쪽 후보"
 recipient_secondary_tnt_stage_marriage_interaction:0 "상대 쪽 후보"
 tnt_stage_pair_points_line:0 "이 혼사는 조약을 [SCOPE.ScriptValue('tnt_stage_pair_deal_delta_value')|+=0]만큼 움직입니다. 탁자에 올렸을 때 협상 창의 저울이 실제로 움직이는 바로 그 값입니다.\n#weak 주는 값 [SCOPE.ScriptValue('tnt_stage_pair_gain_value')|0], 요구하는 값 [SCOPE.ScriptValue('tnt_stage_pair_loss_value')|0], 그리고 이 혼사가 만드는 동맹 [SCOPE.ScriptValue('tnt_stage_alliance_offer_value')|+=0]. 이 셋이 위의 숫자 「그 자체」입니다. 동맹은 위 숫자 안에 있으며 그 위에 더해지지 않습니다. 그는 당신의 제안을 x[SCOPE.ScriptValue('tnt_deal_mult_value')|2]로 값매기며, 대규모 결혼식을 약속한다면 그 제안 가운데 [SCOPE.ScriptValue('tnt_stage_grand_offer_value')|+=0]에 해당합니다.#!\n#weak 조약 안에서 이 부부의 「고유한 행」은 다른 숫자를 지닙니다: [SCOPE.ScriptValue('tnt_stage_pair_raw_net_value')|+=0] — 그의 호감과 동맹을 뺀, 혼사 그 자체의 값입니다. 둘 다 참이며, 저울이 보여 주는 것은 첫 번째입니다.#!\n#weak 같은 조약에서 두 번째 혼사부터 첫 번째 숫자는 정확한 변동량이 아니라 「어림값」입니다. 혼인 전체에 물량 할인이 적용되고, 대규모 결혼식과 두 사람 사이의 공포는 조약당 한 번만 지불되는데도 혼사마다 그 행에서 다시 계산됩니다. 오차는 수십 점에 이르며 높게도 낮게도 나옵니다. 첫 혼사에서는 정확합니다.#!"
 tnt_stage_grand_info:0 "$GRAND_WEDDING_PROMISE_INFO$\n\n혼사 자체와는 별도로 이 부부에게 #high 조약 점수 [SCOPE.ScriptValue('tnt_stage_grand_offer_value')|+=0]#!의 값어치가 있습니다.\n\n#weak 실제로 혼례 잔치를 열기 전까지 두 사람은 약혼 상태로 남습니다. #high 동맹은 잔치를 기다리지 않습니다#!. 조약이 봉인된 날부터 약혼 그 자체 위에 서며, 그 약혼이 이어지는 동안 꼭 그만큼 이어집니다. 약혼자가 이제 혼인할 수 있음을 알리는 일반 경보는 대혼례를 약속받은 짝에게는 일부러 뜨지 않습니다. 대신 「대혼례 거행」 경보가 그 짝을 맡으며, 약속한 사람에게 전해집니다.#!"
 tnt_stage_marriage_desc:0 "당신은 탁자 위의 조약에 담을 혼사를 고르고 있습니다. #high 혼인 제안을 보내는 것이 아닙니다.#!\n\n아래의 넓은 단추는 게임 자체가 #high 제안 보내기#!라고 이름 붙인 것이며 그 문구는 여기서 바꿀 수 없습니다. 그 단추는 아무것도 보내지 않고 아무도 혼인시키지 않습니다. 지금 교섭 중인 조약에 이 부부를 금화와 땅 옆에 적어 넣고, 조약의 조항은 이 혼사를 넣은 채로 다시 값이 매겨집니다.\n\n#high 상대가 조약 전체를 받아들이기 전에는 아무도 혼인하지 않고 아무도 약혼하지 않습니다.#! 조약이 거절되거나 버려지면 그 혼사는 아예 없었던 일이 됩니다.\n\n#weak 양쪽 가솔에서 한 사람씩 고르고 혈통을 정한 다음 확정하십시오. 원하는 만큼 다시 오십시오. 하나의 조약은 몇 쌍이든 담을 수 있습니다.#!\n\n#weak 게임은 이 창에서 동맹에 관한 자기 안내를 내놓으며, #high 이제 그것들을 다시 믿어도 됩니다#!. 조약에서 맺은 혼사는 이제 게임 자체의 #high $arrange_marriage_interaction$#!이 가져오는 것과 같은 동맹을 가져오며, 그것도 게임 자체의 규칙에 따릅니다. 두 사람이 각각 그를 내주는 영주와 얼마나 가까운 혈연인지를 따져, 양쪽 모두 충분히 가깝다면 조약이 봉인되는 순간 당신과 그는 동맹이 됩니다.#!\n\n#weak 당신이 실제로 고른 두 사람에 대한 판정은 위에 찍혀 있으며, 그것은 짐작이 아니라 게임 자체의 답입니다. 그 한 줄과 동맹 자체를 똑같은 하나의 검사가 결정합니다. 궁정인끼리의 혼사는 여전히 아무도 동맹시키지 못합니다. 동맹은 부부에게 기대므로 그들의 혼사가 이어지는 동안 이어지고, 둘 중 하나가 아직 아이라면 첫날부터 약혼 위에 섭니다.#!"
 tnt_btn_stage_marriage:0 "고전 화면에서 혼사 고르기"
 tnt_btn_stage_marriage_full:0 "$tnt_item_marriage_desc$\n\n$tnt_btn_stage_marriage_tip$"
 tnt_btn_stage_marriage_tip:0 "게임 자체의 결혼 화면을 엽니다. 두 가솔이 나란히 놓이고, 모든 여과기와 검색, 두 초상화, 그리고 혈통이 함께 있습니다.\n\n#high 아무도 혼인시키지 않습니다.#! 거기서 확정한 부부는 이 조약에 기록되며, 혼례는, 둘 중 하나가 아이라면 약혼은, 조약 전체가 합의될 때에만 이루어집니다.\n\n#weak 게임 자체의 문구에 주의하십시오. 그 창의 넓은 단추에는 제안 보내기라고 적혀 있습니다. 그 단추는 누구에게도 제안을 보내지 않고 여기에 부부를 더할 뿐입니다. 같은 두 사람을 아래의 목록에서 직접 고를 수도 있으며, 이미 조약에 담긴 부부의 혈통을 바꿀 수 있는 곳은 그곳뿐입니다.#!"
 tnt_marriage_stage_note:0 "#weak 아무것도 보내지 않고 아무도 혼인하지 않습니다. 부부가 이 조약에 기록될 뿐입니다.#!"
 tnt_err_grand_host:0 "지금은 대규모 결혼식을 약속할 수 없습니다. 남작보다 높은 등급의 땅을 받은 영주여야 하고, 고급 활동이 딸린 #high Tours and Tournaments#!가 있어야 하며, 주최할 만한 금화가 있어야 하고, 아직 지키지 못한 약속이 남아 있어서는 안 됩니다.\n\n#weak 그리고 이것은 약속입니다. 기려지는 부부는 약혼하고, 당신은 주최를 약속한 사람이 되며, 잔치를 마련하고 비용을 대는 일은 여전히 당신의 몫입니다. 약속을 흘려보내면 어긴 말은 기억됩니다.#!"
 tnt_err_grand_taken:0 "이 조약에는 이미 대규모 결혼식이 약속되어 있습니다. 먼저 조약의 혼인 창에서 표시를 해제하십시오. 한 조약에 한 잔치, 한 부부입니다."
 tnt_intro_title:0 "조약의 기술"
 tnt_intro_desc_main:0 "당신의 상서청에서 소식이 퍼졌습니다. 이 궁정은 이제 새로운 방식으로 교섭합니다. 어떤 영주든 탁자로 부를 수 있습니다. 금화를 충성에, 신부를 휴전에, 호의를 왕관에 달아 보고, 모든 조항을 한 쌍의 저울에, 양쪽 모두에게 같은 저울에 올립니다.\n\n"
 tnt_intro_desc_rate_normal:0 "사절은 이따금 오리라 여기십시오. 온 세상을 통틀어 한 해에 한 통을 넘지 않고, 한 번 소식을 전한 영주는 다시 쓰기까지 세 해쯤 뜸을 들입니다."
 tnt_intro_desc_rate_frequent:0 "당신의 문으로 오는 길이 잘 닳으리라 여기십시오. 사절과 사절 사이에 반년도 채 지나지 않고, 영주들은 한 해 안에 다시 당신을 떠올립니다."
 tnt_intro_desc_rate_rare:0 "긴 침묵을 각오하십시오. 편지와 편지 사이에 여러 해가 지나고, 청하는 일은 대개 당신의 몫이 됩니다."
 tnt_intro_desc_rate_off:0 "편지는 오지 않습니다. 당신의 문은 사절에게 닫혀 있으며, 모든 교섭은 당신에게서 시작됩니다."
 tnt_intro_desc_rate_test:0 "파발꾼들은 말을 타지 말고 달리라는 명을 받았습니다. 몇 달 안에 제안이 닿을 것입니다. 궁정의 걸음이 아니라 시험의 걸음입니다."
 tnt_intro_desc_world_rare:0 " 국경 너머에서도 같은 저울이 조용히 일합니다. 이따금 두 궁정이 자기들끼리 흥정을 맺고, 그 소식은 당신과 얽힐 때 당신에게 닿습니다."
 tnt_intro_desc_world_common:0 " 국경 너머에서 같은 저울이 분주히 흔들립니다. 바깥 궁정들은 한 해 내내 자기들끼리 흥정을 맺습니다."
 tnt_intro_desc_world_off:0 " 국경 너머에서는 옛 방식이 그대로입니다. 새로운 방식은 당신이 몸소 앉는 탁자에서만 행해집니다."
 tnt_intro_desc_close:0 "\n\n영주를 직접 탁자로 부르려면 그를 오른쪽 클릭하고 #high 조약 교섭#!을 고르십시오."
 tnt_intro_opt_ok:0 "그럼, 탁자로."

