 tnt_ai_offer_row_hook_p:0 "Partner żąda od ciebie [hook_i] należnej przysługi"
 tnt_ai_offer_row_prisoners_p:0 "Partner żąda uwolnienia jego krewnych i wasali z twoich lochów"
 tnt_ai_offer_row_title_p:0 "Partner chce kupić twoją ziemię – wymienioną poniżej (tytuły: [GetPlayer.MakeScope.ScriptValue('tnt_count_sel_title_p_value')|0])"
 tnt_ai_offer_row_title_r:0 "Partner oferuje ci swoją ziemię – wymienioną poniżej (tytuły: [GetPlayer.MakeScope.ScriptValue('tnt_count_sel_title_r_value')|0])"
 tnt_ai_offer_row_claim_r:0 "Partner oferuje ci roszczenie do swojej ziemi – wymienione poniżej (wybrano: [GetPlayer.MakeScope.ScriptValue('tnt_count_sel_claim_r_value')|0])"
 tnt_ai_offer_row_artifact_r:0 "Partner oferuje skarb ze swojej sali – wymieniony poniżej (wybrano: [GetPlayer.MakeScope.ScriptValue('tnt_count_sel_artifact_r_value')|0])"
 tnt_ai_offer_row_vassal_r:0 "Partner oferuje złożenie przysięgi wierności i zostanie twoim wasalem"
 tnt_ai_offer_row_ward_r:0 "Partner oddaje swoje dziecko, [GetPlayer.MakeScope.Var('tnt_ward_r').Char.GetUINameNoTooltip], na wychowanie na twoim dworze"
 tnt_ai_offer_row_indep_p:0 "Partner żąda zwolnienia go z przysięgi wierności"
 tnt_ai_offer_row_hostage_r:0 "Partner śle swojego krewnego, [GetPlayer.MakeScope.Var('tnt_hostage_r').Char.GetUINameNoTooltip], pod twoją pieczę jako zakładnika"
 tnt_ai_offer_row_courtier_p:0 "Partner chce wziąć kogoś z twojego dworu na swoją służbę – wymieniono poniżej (wybrano: [GetPlayer.MakeScope.ScriptValue('tnt_count_sel_courtier_p_value')|0])"
 tnt_ai_offer_row_contract:0 "Kontrakt jego wierności w kształcie, jakiego sobie życzy (zmienionych warunków: [GetPlayer.MakeScope.ScriptValue('tnt_ob_changed_value')|0]):"
 tnt_ai_offer_row_marriage:0 "Proponowane jest małżeństwo między rodami:"
 tnt_ai_offer_row_usehook_r:0 "Partner ściąga [hook_i] przysługę, którą ma u ciebie"
 tnt_ai_offer_row_word_kept:0 "Partnerowi ten układ już nie w smak, ale sam go zaproponował i słowa dotrzyma"
 tnt_ai_gift_line:0 "Przysłane z wielkiego szacunku: warunki są warte więcej niż to, czego partner żąda w zamian. Ten list jest darem z rozmysłem."
 tnt_refuse_envoys_decision:0 "Nie przyjmuj więcej poselstw"
 tnt_refuse_envoys_decision_desc:0 "Cicho puszczono wieść każdą drogą i do każdego portu: ten dwór skończył ze słuchaniem posłów z traktatami. Władcy z propozycjami niech je sobie zatrzymają. Twoi właśni posłowie jeżdżą jak dotąd – drzwi zaryglowano od środka, a rygiel trzymasz w ręku."
 tnt_refuse_envoys_decision_tooltip:0 "Żaden władca nie przystąpi do ciebie z traktatem, dopóki nie postanowisz inaczej. Rokowań otwieranych przez ciebie to nie dotyczy."
 tnt_refuse_envoys_decision_confirm:0 "Zarygluj drzwi"
 tnt_refuse_envoys_decision_effect_tt:0 "Żaden władca nie przystąpi do ciebie z traktatem, dopóki nie odwrócisz tej decyzji."
 tnt_accept_envoys_decision:0 "Przyjmuj poselstwa ponownie"
 tnt_accept_envoys_decision_desc:0 "Rygiel podniesiono, a strażnikom bram kazano ustąpić: posłów z traktatami znów można wprowadzać, z pieczęciami nienaruszonymi, a ich oferty ważyć na tej samej co zawsze wadze."
 tnt_accept_envoys_decision_tooltip:0 "Poselstwa z traktatami mogą znów docierać na twój dwór – od dziś."
 tnt_accept_envoys_decision_confirm:0 "Otwórz bramy"
 tnt_accept_envoys_decision_effect_tt:0 "Poselstwa z ofertami traktatów mogą znów docierać na twój dwór – natychmiast, a nie dopiero wtedy, gdy dawna cisza sama by wygasła."
 decision_group_type_tnt_uninstall:0 "Decyzje dotyczące usuwania modów"
 tnt_uninstall_decision:0 "Złóż stół rokowań"
 tnt_uninstall_decision_desc:0 "Posłowie odprawieni, rejestry spalone, sam stół wyniesiony z sali. Podejmij tę decyzję bezpośrednio przed usunięciem moda: wymiata ona z zapisu gry każdy ślad, jaki Parley trzyma w tym świecie. Listy bez odpowiedzi i niedokończone rokowania zostają unieważnione; każdy już zawarty traktat pozostaje w mocy."
 tnt_uninstall_decision_tooltip:0 "Przygotowuje ten zapis do gry bez Parley: The Negotiating Table. Usuwa każdą zmienną, każdy hak i każdą opinię zapisane przez ten mod, u każdej postaci na świecie. Zawartych układów – małżeństw, odstąpionych tytułów, przysiąg wierności – to nie tyka."
 tnt_uninstall_decision_confirm:0 "Wymieć do czysta"
 tnt_uninstall_decision_effect_tt:0 "Każda zmienna, lista, flaga postaci, hak i opinia zapisane przez Parley zostają usunięte u każdej postaci na świecie. Każdy list z ofertą bez odpowiedzi i każde niedokończone rokowania zostają unieważnione. Zapisz grę, a potem wyłącz mod: zapis jest teraz czysty od Parley."
 tnt_ai_msg_treaty:0 "Podpisano traktat"
 tnt_ai_msg_tt_truce:0 "Kupili złotem dziesięcioletni pokój."
 tnt_ai_msg_tt_ally:0 "Kupili złotem sojusz wojskowy."
 tnt_ai_msg_tt_hook:0 "Jeden z nich jest teraz drugiemu winien przysługę, kupioną za złoto."
 tnt_ai_msg_tt_hookcall:0 "Ściągnięto dług: jeden z nich trzymał [Concept('hook', 'hak')|E] nad drugim i zainkasował go w złocie."
 tnt_ai_msg_tt_ultimatum:0 "Złoto zmieniło ręce tylko w jedną stronę. Słabszy z dwóch zapłacił za to, by go zostawiono w spokoju."
 tnt_ai_msg_tt_title:0 "Ziemia zmieniła ręce za złoto: jeden z dwóch władców odkupił od drugiego hrabstwo."
 tnt_ai_msg_tt_vassal:0 "Państwo uklękło: słabszy władca złożył silniejszemu przysięgę wierności – za złoto i opiekę."
 tnt_ai_msg_tt_submission:0 "Państwo uległo groźbie: przytłaczająco silniejszy władca zmusił słabszego niezależnego sąsiada do przysięgi wierności bez zapłaty."
 tnt_ai_msg_tt_artifact:0 "Skarb zmienił ręce za złoto: jeden z dwóch władców odkupił przedmiot z sali drugiego."
 tnt_ai_msg_tt_wed:0 "Dwa rody połączone: władcy uzgodnili małżeństwo między swoimi krewnymi, a wraz z nim poszedł posag w złocie."
 rule_tnt_ai_treaties:0 "Parley: traktaty między władcami SI"
 setting_tnt_ai_treaties_off:0 "Wyłączone"
 setting_tnt_ai_treaties_off_desc:0 "Władcy kierowani przez SI nigdy nie zawierają traktatów między sobą za twoimi plecami.\n\n#weak Nie kosztuje to zgoła nic: jedno sprawdzenie na rok i ani jednej pracy więcej. SI może nadal targować się z #high tobą#!.#!"
 setting_tnt_ai_treaties_rare:0 "Sporadyczne"
 setting_tnt_ai_treaties_rare_desc:0 "Sąsiadujący władcy SI od czasu do czasu dobijają ze sobą targu – z grubsza garść traktatów rocznie na całej mapie.\n\nTą drogą handluje się złotem, należnymi przysługami, ściąganymi długami, ultimatami i artefaktami; tam, gdzie strony już się lubią, przygraniczne hrabstwo może pójść za pełną wartość, a słabszemu sąsiadowi można zapłacić za przysięgę wierności. Król lub cesarz o przytłaczającej przewadze może zamiast tego groźbą zmusić słabszego niezależnego sąsiada do przysięgi wierności. #high Po cichu handluje się także małżeństwami między rodami i nikogo się wprzód nie pyta.#! Dowiadujesz się o każdym traktacie, w którym bierze udział ktoś, z kim graniczysz, z kim jesteś w sojuszu lub z kim walczysz."
 setting_tnt_ai_treaties_common:0 "Częste"
 setting_tnt_ai_treaties_common_desc:0 "Około trzy razy częściej niż przy ustawieniu sporadycznym – dla mapy, na której dwory rozmawiają bez przerwy.\n\nTe same warunki do wymiany i ten sam trzyletni odstęp dla każdego władcy, więc rzecz nie wymknie się spod kontroli.\n\n#weak To ustawienie domyślne.#!"
 rule_tnt_ai_offer_rate:0 "Parley: oferty przysyłane tobie"
 setting_tnt_ai_offer_rate_off:0 "Nigdy"
 setting_tnt_ai_offer_rate_off_desc:0 "Żaden władca nigdy nie napisze do ciebie z własnym traktatem.\n\n#weak Nadal możesz sam otworzyć rokowania z kimkolwiek, a władcy SI nadal układają się między sobą, jeśli tamta zasada na to pozwala.#!"
 setting_tnt_ai_offer_rate_rare:0 "Rzadkie"
 setting_tnt_ai_offer_rate_rare_desc:0 "List przychodzi tylko od czasu do czasu – spodziewaj się lat ciszy między poselstwami.\n\n#weak Dla gry, w której wolisz pytać sam.#!"
 setting_tnt_ai_offer_rate_normal:0 "Zwykłe"
 setting_tnt_ai_offer_rate_normal_desc:0 "Sąsiad pisze do ciebie najwyżej raz na rok, a każdy władca czeka trzy lata, zanim ułoży kolejną ofertę."
 setting_tnt_ai_offer_rate_frequent:0 "Częste"
 setting_tnt_ai_offer_rate_frequent_desc:0 "Posłowie zajeżdżają kilka razy do roku, a władcy wracają myślą do ciebie znacznie prędzej.\n\nKażda oferta wciąż jest wyceniana tą samą wagą, którą widzisz w oknie rokowań, więc ruchliwsza mapa nie znaczy hojniejsza.\n\n#weak To ustawienie domyślne.#!"
 setting_tnt_ai_offer_rate_test:0 "Testowe – bardzo częste"
 setting_tnt_ai_offer_rate_test_desc:0 "#N Do testowania moda, nie do gry.#! Okresy oczekiwania skrócono do kilku tygodni, więc oferta powinna dotrzeć do ciebie w ciągu miesięcy od rozpoczęcia rozgrywki.\n\n#weak Użyj tego, aby potwierdzić, że listy działają, a potem przestaw zasadę z powrotem na „Częste”.#!"
 rule_tnt_ai_telemetry:0 "Parley: dziennik diagnostyczny"
 setting_tnt_ai_telemetry_off:0 "Wyłączony"
 setting_tnt_ai_telemetry_off_desc:0 "Żadnych zapisów diagnostycznych – i o to właśnie chodzi przy zwykłej grze.\n\n#weak To ustawienie domyślne i nie kosztuje nic: jedno sprawdzenie zasady wszędzie tam, gdzie zostałby zapisany wiersz.#!"
 setting_tnt_ai_telemetry_on:0 "Włączony"
 setting_tnt_ai_telemetry_on_desc:0 "Zapisuje jeden wiersz do #high error.log#! dla każdej decyzji, jaką władca SI podejmuje w sprawie traktatu: kogo rozważał, co położył na stole, na ile wycenił układ i #high dlaczego odszedł od stołu#!.\n\nOkoło 600 do 1600 wierszy na pół roku gry. Na rozgrywkę nie wpływa to w żaden sposób.\n\n#weak Włącz to przed długim biegiem bez nadzoru, a potem prześlij dziennik do odczytania.#!"
 setting_tnt_ai_telemetry_verbose:0 "Szczegółowy"
 setting_tnt_ai_telemetry_verbose_desc:0 "Jak przy ustawieniu włączonym, a ponadto jeden wiersz na każdego władcę SI rocznie, zapisywany przed rzutem kośćmi na traktaty między SI.\n\nTysiące dodatkowych wierszy. Kupuje to jedną jedyną rzecz: odróżnienie #high impuls nigdy się nie odpalił#! od #high odpalił się, a kości powiedziały nie#!.\n\n#weak Wyłącznie na krótki bieg potwierdzający.#!"
 rule_tnt_threat_frequency:0 "Parley: częstotliwość gróźb"
 setting_tnt_threat_frequency_unlimited:0 "0 lat"
 setting_tnt_threat_frequency_unlimited_desc:0 "Brak dodatkowej przerwy między groźbami wobec różnych władców. Ustawienie domyślne. Dotychczasowy zakaz ponownego grożenia temu samemu władcy przez 15 lat nadal obowiązuje gracza i SI."
 setting_tnt_threat_frequency_1_year:0 "1 rok"
 setting_tnt_threat_frequency_1_year_desc:0 "Po użyciu groźby dany władca nie może grozić nikomu przez 1 rok. Zasada działa tak samo dla gracza i SI. Dotychczasowy zakaz ponownego grożenia temu samemu władcy przez 15 lat również pozostaje w mocy."
 setting_tnt_threat_frequency_5_years:0 "5 lat"
 setting_tnt_threat_frequency_5_years_desc:0 "Po użyciu groźby dany władca nie może grozić nikomu przez 5 lat. Zasada działa tak samo dla gracza i SI. Dotychczasowy zakaz ponownego grożenia temu samemu władcy przez 15 lat również pozostaje w mocy."
 setting_tnt_threat_frequency_10_years:0 "10 lat"
 setting_tnt_threat_frequency_10_years_desc:0 "Po użyciu groźby dany władca nie może grozić nikomu przez 10 lat. Zasada działa tak samo dla gracza i SI. Dotychczasowy zakaz ponownego grożenia temu samemu władcy przez 15 lat również pozostaje w mocy."
 tnt_err_threat_cooldown:0 "Niedawno użyto groźby. Nie możesz grozić nikomu, dopóki nie upłynie przerwa między groźbami."
 rule_tnt_threat_scale:0 "Parley: siła gróźb"
 setting_tnt_threat_scale_rare:0 "Słaba"
 setting_tnt_threat_scale_rare_desc:0 "Współczynnik N = 2,5. Każda groźba wymaga #high co najmniej 100 punktów umowy#!. Przy równym prestiżu i postrachu potrzeba stosunku sił 41:1.\n\n#weak Wyższy prestiż i postrach zmniejszają wymaganą przewagę wojskową. Pełny poziom prestiżu poniżej celu zeruje wartość groźby. Zasady są takie same dla gracza i SI.#!"
 setting_tnt_threat_scale_normal:0 "Normalna"
 setting_tnt_threat_scale_normal_desc:0 "Współczynnik N = 5. Każda groźba wymaga #high co najmniej 100 punktów umowy#!. Przy równym prestiżu i postrachu minimalny stosunek sił to #high 21:1#!.\n\nWyższy prestiż i postrach zmniejszają wymaganą przewagę wojskową. Pełny poziom prestiżu poniżej celu zeruje wartość groźby.\n\n#weak Ustawienie domyślne. Zasady są takie same dla gracza i SI.#!"
 setting_tnt_threat_scale_frequent:0 "Silna"
 setting_tnt_threat_scale_frequent_desc:0 "Współczynnik N = 7,5. Każda groźba nadal wymaga #high co najmniej 100 punktów umowy#!.\n\n#weak Wyższy prestiż i postrach zmniejszają wymaganą przewagę wojskową. Pełny poziom prestiżu poniżej celu zeruje wartość groźby. Zasady są takie same dla gracza i SI.#!"
 setting_tnt_threat_scale_constant:0 "Bardzo silna"
 setting_tnt_threat_scale_constant_desc:0 "Współczynnik N = 10. Każda groźba wymaga #high co najmniej 100 punktów umowy#!. Przy równym prestiżu i postrachu minimalny stosunek sił to #high 11:1#!.\n\n#weak Wyższy prestiż i postrach zmniejszają wymaganą przewagę wojskową. Pełny poziom prestiżu poniżej celu zeruje wartość groźby. Zasady są takie same dla gracza i SI.#!"
 tnt_mutual_header:0 "Między wami dwojgiem"
 tnt_bd_domain_p:0 "Tytuły ponad jego limitem domeny – warte dla niego mniej"
 tnt_bd_domain_r:0 "Tytuły ponad twoim limitem domeny – warte dla ciebie mniej"
 tnt_tt_step_huge_add:0 "Dodaj naraz dużą kwotę.\n\n#weak Złoto, prestiż i pobożność: 1000 na kliknięcie. Wpływ: 250, bo sam wpływ nigdy nie przekracza 1000.#!"
 tnt_tt_step_huge_sub:0 "Odejmij naraz dużą kwotę.\n\n#weak Złoto, prestiż i pobożność: 1000 na kliknięcie. Wpływ: 250, bo sam wpływ nigdy nie przekracza 1000.#!"
 tnt_preset_open:0 "…"
 tnt_tt_preset_open:0 "Ustaw kwotę jednym kliknięciem.\n\n#weak Kwota zwyczajowa, połowa posiadanego zasobu, wszystko, na co stać, albo zgoła nic.#!"
 tnt_preset_menu_header:0 "Ile?"
 tnt_preset_std_gold:0 "Roczny dochód"
 tnt_preset_std_gift:0 "Zwyczajowy dar"
 tnt_preset_half:0 "Połowa"
 tnt_preset_max:0 "Ile zdołam"
 tnt_preset_max_r:0 "Ile zdoła partner"
 tnt_preset_none:0 "Nic"
 tnt_tt_preset_std_gold:0 "Zaoferuj roczny dochód.\n\n#weak Ograniczone do tego, co naprawdę leży w skarbcu.#!"
 tnt_tt_preset_std_gift:0 "Zaoferuj kwotę zwyczajową dla przysługi tej wielkości – tyle, ile spodziewa się władca jego pozycji.\n\n#weak Ograniczone do tego, co naprawdę posiadasz. Prestiż, pobożność i wpływ nie mają rocznego dochodu, więc nie ma z nich „rocznej wartości” do zaoferowania.#!"
 tnt_tt_preset_half:0 "Zaoferuj połowę posiadanego zasobu."
 tnt_tt_preset_max:0 "Zaoferuj wszystko, na co cię stać."
 tnt_tt_preset_none:0 "Zdejmij ten zasób ze stołu."
 tnt_autobalance_btn:0 "Wyrównaj"
 tnt_tt_autobalance:0 "Dostosuj złoto, prestiż, pobożność i wpływ na stole tak, by oferta stała się dla partnera ledwie do przyjęcia.\n\nDziała w obie strony: dosładza ofertę, którą partner by odrzucił, i #high przycina taką, którą przyjąłby zbyt łatwo#!, więc nigdy nie przepłacisz.\n\n#weak Niczego innego nie dokłada – ani ziemi, ani roszczenia, ani małżeństwa, ani przysługi – i nigdy nie oferuje więcej, niż da się naprawdę zapłacić.#!"
 tnt_ab_state_balanced:0 "#P Wyrównane.#! Oferta mieści się teraz tuż w granicach tego, co partner przyjmie."
 tnt_ab_state_minimal:0 "Już minimalna. Nic nie wymagało zmiany."
 tnt_ab_state_unreachable:0 "#N Poza zasięgiem.#! Partner nadal odmawia, nawet gdy dołożysz wszystko, na co cię stać."
 tnt_ab_state_closest:0 "Oferta do przyjęcia. Automatyczne równoważenie nie mogło osiągnąć +1 przy dostępnych zasobach."
 tnt_ab_lumpy_hint:0 "Naciśnij ponownie, aby dokładać dalej. Cokolwiek ten przycisk dołożył, a potem zostało usunięte, nie trafi na stół po raz drugi."
 tnt_ab_lumpy_line:0 "Sakiewka partnera była pusta, więc ostatnie naciśnięcie sięgnęło zamiast tego po warunki z jego strony stołu: ziemię, roszczenie albo jego przysięgę wierności."
 tnt_stage_marriage_interaction:0 "Dodaj partię do traktatu"
 tnt_stage_marriage_send:0 "Dodaj tę partię do traktatu"
 tnt_stage_marriage_prompt:0 "#high Dość bliska partia przynosi teraz sojusz ze sobą#! - ten sam, który gra daje za własne zaaranżowane małżeństwo, w dniu przypieczętowania traktatu."
 tnt_stage_no_alliance_tt:0 "#high Partia wpisana do tego traktatu tworzy teraz sojusz.#! To reguła samej gry, a nie tego moda: gra waży, jak blisko spokrewnione jest każde z dwojga z władcą, który je oddaje, i jeśli para jest dość bliska po obu stronach, ty i on jesteście sojusznikami z chwilą przypieczętowania traktatu – dokładnie tak, jak od zawsze czyni własna interakcja gry #high $arrange_marriage_interaction$#!. Nikt przy tym stole nie kupuje [Concept('alliances', 'sojuszu')|E]: takiego warunku nie ma na arkuszu i nigdy nie będzie; sojusz przychodzi po prostu razem z małżeństwem.\n\n#weak Znakom sojuszu, które gra sama rysuje w tym oknie, można więc znowu ufać – paskowi siły „Potencjalny sojusz” przy każdym kandydacie i małym ukoronowanym herbom obok niego. Siedzą w liście kandydatów, a lista znika z ekranu w chwili, gdy wybrane są oba portrety, więc zanim przeczytasz te słowa, nic takiego nie zostaje już na stronie; ale werdykt wydrukowany tuż nad tym akapitem odpowiada za parę przed tobą, i jest to odpowiedź samej gry, a nie przewidywanie.#!\n\n#weak Sojusz opiera się na samej parze: trwa dokładnie tak długo, jak ich związek, i gaśnie razem z nim, własnymi trybami gry. Jeśli któreś z dwojga jest jeszcze dzieckiem, para zostaje zaręczona, a nie poślubiona, a sojusz od pierwszego dnia stoi na tych zaręczynach. Traktat może nieść kilka par, a każda jest sądzona osobno.#!"
 tnt_stage_alliance_opens_tt:0 "#high Ta partia TWORZY sojusz między tobą a nim.#! Nie drzwi, do których zapukasz później, lecz sam sojusz - w dniu przypieczętowania traktatu, w chwili gdy tych dwoje bierze ślub albo zostaje zaręczonych. To reguła samej gry, dokładnie ta sama, którą kieruje się jej #high $arrange_marriage_interaction$#!: gra waży, jak blisko spokrewnione jest każde z dwojga z władcą, który je oddaje, a ta para jest dość bliska po obu stronach. Nic więcej nie jest od ciebie wymagane, a on nie może odmówić - sojusz przychodzi wraz z traktatem.\n\n#high Warte to [SCOPE.ScriptValue('tnt_stage_alliance_offer_value')|+=0] punktów traktatowych – i są one JUŻ ZAWARTE w liczbie wypisanej wyżej dla tej partii. Nie dodawaj ich po raz drugi.#! Traktat płaci za sojusz tylko raz: jeśli otwiera go para już leżąca na stole, ta nie dokłada nic do ceny, lecz staje się drugim powodem, na którym pakt się opiera."
 tnt_stage_alliance_shut_tt:0 "#high Ta partia NIE tworzy sojuszu.#! Gra mierzy, jak blisko spokrewnione jest każde z dwojga z władcą, który je wydaje, sumuje obie odległości i przyznaje sojusz tylko dopóty, dopóki ta suma pozostaje mała. Małżeństwo dwojga dworzan nie czyni krewnym nikogo przy tym stole, więc taka para nikogo nie łączy sojuszem; obcy wyciągnięty z twojej własnej sali nie jest lepszy. Wydaj własną krew za jego - dziecko, wnuka, brata lub siostrę, rodzica - albo sam stań przed ołtarzem, a suma zmieści się w granicy gry. To ta sama reguła, która rządzi własną interakcją gry #high $arrange_marriage_interaction$#!, i mierzy się ją po obu stronach naraz: bliski wybór po twojej stronie nie odkupi dalekiego po jego."
 tnt_stage_alliance_already_tt:0 "#high Jesteś już jego sojusznikiem, więc ta partia nie otwiera żadnego nowego paktu.#! Paktu, który już masz, nie zawiera się po raz drugi: sojusz nie dokłada do tej partii żadnych punktów traktatowych, a traktat nie każe ci za niego płacić. Jeśli para jest dość blisko spokrewniona, by sprostać regule samej gry, ślub zostanie po prostu zapisany jako jeszcze jeden powód, na którym opiera się sojusz, który już masz; jeśli nie jest, sojusz pozostanie dokładnie taki, jaki był. Tak czy owak sama partia wciąż warta jest tyle punktów, ile wypisano wyżej, a pakt między tobą a nim pozostaje nietknięty."
 actor_secondary_tnt_stage_marriage_interaction:0 "Twój kandydat"
 recipient_secondary_tnt_stage_marriage_interaction:0 "Kandydat partnera"
 tnt_stage_pair_points_line:0 "Ta partia przesuwa traktat o [SCOPE.ScriptValue('tnt_stage_pair_deal_delta_value')|+=0] – dokładnie o tyle przechyla się szala w oknie negocjacji, gdy położysz ją na stole.\n#weak Oferowane [SCOPE.ScriptValue('tnt_stage_pair_gain_value')|0], żądane [SCOPE.ScriptValue('tnt_stage_pair_loss_value')|0] oraz sojusz, który ta partia tworzy: [SCOPE.ScriptValue('tnt_stage_alliance_offer_value')|+=0]. Te trzy liczby SĄ liczbą powyżej – sojusz siedzi w niej, nigdy ponad nią. Twoją ofertę ceni z mnożnikiem x[SCOPE.ScriptValue('tnt_deal_mult_value')|2], a wielki ślub, jeśli go obiecasz, wart jest [SCOPE.ScriptValue('tnt_stage_grand_offer_value')|+=0] tej oferty.#!\n#weak WŁASNY wiersz tej pary w traktacie niesie inną liczbę: [SCOPE.ScriptValue('tnt_stage_pair_raw_net_value')|+=0] – samą partię, bez jego względów i bez sojuszu. Obie są prawdziwe; szala pokazuje pierwszą.#!\n#weak Od drugiej partii w tym samym traktacie pierwsza liczba jest SZACUNKIEM, a nie dokładnym przesunięciem: rabat ilościowy obejmuje cały stos małżeństw, a wielki ślub i groza między wami dwoma płacone są RAZ NA TRAKTAT, lecz doliczane ponownie w wierszu każdej partii. Rozbieżność może sięgać dziesiątek punktów, w górę albo w dół. Przy pierwszej partii liczba jest dokładna.#!"
 tnt_stage_grand_info:0 "$GRAND_WEDDING_PROMISE_INFO$\n\n#high Warte [SCOPE.ScriptValue('tnt_stage_grand_offer_value')|+=0] punktów traktatowych#! dla tej pary, ponad samą partię.\n\n#weak Pozostają ZARĘCZENI, dopóki naprawdę nie wyprawisz uczty. #high Sojusz nie czeka na ucztę#! - stoi na samych zaręczynach, od dnia przypieczętowania traktatu, i trwa dokładnie tak długo jak one. Zwykły alert gry o zaręczonej parze, która może już zawrzeć małżeństwo, celowo milczy przy parze, której obiecano wielkie wesele - zamiast niego taką parę prowadzi alert „Wypraw wielkie wesele”, a trafia on do tego, kto złożył obietnicę.#!"
 tnt_stage_marriage_desc:0 "Wybierasz partię do traktatu leżącego na stole. #high Nie wysyłasz propozycji małżeństwa.#!\n\nSzeroki przycisk poniżej sama gra podpisuje jako #high „Wyślij propozycję”#! i tego brzmienia nie da się tu zmienić. Nie wysyła on niczego i nikogo nie żeni: wpisuje tę parę do traktatu, który negocjujesz, obok złota i ziemi, a warunki traktatu zostają wycenione na nowo, już z tą partią w środku.\n\n#high Nikt nie bierze ślubu i nikt nie zostaje zaręczony, dopóki druga strona nie przyjmie całego traktatu.#! Jeśli traktat zostanie odrzucony albo porzucony, partia po prostu nigdy nie zaistniała.\n\n#weak Wybierz po jednej osobie z każdego dworu, ustal dziedziczenie rodu i potwierdź. Wracaj tu, ile razy zechcesz – traktat może nieść dowolnie wiele par.#!\n\n#weak Gra wyświetla w tym oknie własne podpowiedzi o sojuszach – #high możesz im znowu wierzyć#!. Partia wpisana do traktatu niesie teraz ten sam sojusz, który niesie własna interakcja gry #high $arrange_marriage_interaction$#!, i to według reguły samej gry: waży ona, jak blisko spokrewnione jest każde z dwojga z władcą, który je oddaje, a jeśli para jest dość bliska po obu stronach, ty i on jesteście sojusznikami z chwilą przypieczętowania traktatu.#!\n\n#weak Werdykt o parze, którą naprawdę wybrałeś, wydrukowany jest wyżej i jest to odpowiedź samej gry, a nie domysł – jedna i ta sama próba rozstrzyga ten wiersz i sam sojusz. Partia dwojga dworzan nadal nikogo nie łączy sojuszem. Sojusz opiera się na parze: trwa tak długo, jak ich związek; a jeśli któreś z dwojga jest jeszcze dzieckiem, stoi od pierwszego dnia na zaręczynach.#!"
 tnt_btn_stage_marriage:0 "Wybierz partię na klasycznym ekranie"
 tnt_btn_stage_marriage_full:0 "$tnt_item_marriage_desc$\n\n$tnt_btn_stage_marriage_tip$"
 tnt_btn_stage_marriage_tip:0 "Otwiera własny ekran małżeństw gry: oba dwory obok siebie, wszystkie filtry i wyszukiwarka, dwa portrety oraz dziedziczenie rodu.\n\n#high Nikogo nie żeni.#! Para, którą tam zatwierdzisz, zostaje zapisana w tym traktacie, a ślub – albo zaręczyny, jeśli któreś z dwojga jest dzieckiem – następuje dopiero wtedy, gdy cały traktat zostanie przyjęty.\n\n#weak Zwróć uwagę na brzmienie samej gry: szeroki przycisk w tamtym oknie głosi „Wyślij propozycję”. Nie wysyła on nikomu żadnej propozycji – dodaje parę tutaj. Tych samych dwoje można też wskazać ręcznie na listach poniżej, a to jedyne miejsce, w którym parze już wpisanej do traktatu można zmienić linię.#!"
 tnt_marriage_stage_note:0 "#weak Nic nie zostaje wysłane i nikt nie bierze ślubu – para zostaje zapisana w tym traktacie.#!"
 tnt_err_grand_host:0 "Nie możesz teraz obiecać wielkiego ślubu: potrzeba do tego władcy z ziemią o randze wyższej niż baron, dodatku #high Tours & Tournaments#! z jego rozbudowanymi aktywnościami, złota na wyprawienie uczty oraz braku innej twojej obietnicy wciąż niespełnionej.\n\n#weak A jest to obietnica: uhonorowana para zostaje zaręczona, ty zostajesz obiecanym gospodarzem, a wyprawienie uczty i opłacenie jej pozostaje twoją rzeczą. Pozwól obietnicy wygasnąć, a złamane słowo zostanie zapamiętane.#!"
 tnt_err_grand_taken:0 "W tym traktacie wielki ślub jest już obiecany. Najpierw odznacz go w traktatowym panelu małżeństw – jeden traktat, jedna uczta, jedna uhonorowana para."
 tnt_intro_title:0 "Sztuka traktatu"
 tnt_intro_desc_main:0 "Z twojej kancelarii poszła wieść: ten dwór układa się odtąd na nową modłę. Każdego władcę można wezwać do stołu – złoto ważone przeciw wierności, panna młoda przeciw rozejmowi, przysługa przeciw koronie – a każdy warunek kładzie się na jedną wagę, tę samą dla obu stron.\n\n"
 tnt_intro_desc_rate_normal:0 "Spodziewaj się poselstw od czasu do czasu: nie więcej niż jeden list rocznie cię odnajdzie, z całego świata razem wziętego, a władca, od którego raz przyszła wieść, duma jakieś trzy lata, zanim napisze znowu."
 tnt_intro_desc_rate_frequent:0 "Spodziewaj się drogi do twoich bram dobrze ubitej: ledwie pół roku minie od jednego poselstwa do następnego, a władcy wracają myślą do ciebie jeszcze w tym samym roku."
 tnt_intro_desc_rate_rare:0 "Spodziewaj się długiego milczenia: między listami miną lata, a pytać przyjdzie przeważnie tobie."
 tnt_intro_desc_rate_off:0 "Listy nie przyjdą żadne: twoje bramy są dla poselstw zamknięte, a wszelkie układy zaczną się od ciebie."
 tnt_intro_desc_rate_test:0 "Kurierom kazano biec, a nie jechać: oferta powinna cię odnaleźć w ciągu kilku miesięcy. Tempo testowe, nie dworskie."
 tnt_intro_desc_world_rare:0 " Za twoimi granicami ta sama waga służy po cichu: co jakiś czas dwa dwory dobijają własnego targu, a wieść o tym dochodzi do ciebie wtedy, gdy cię dotyczy."
 tnt_intro_desc_world_common:0 " Za twoimi granicami ta sama waga chodzi bez wytchnienia: obce dwory dobijają własnych targów przez okrągły rok."
 tnt_intro_desc_world_off:0 " Za twoimi granicami trzymają się dawne obyczaje: nowa moda panuje tylko przy tych stołach, przy których siedzisz ty."
 tnt_intro_desc_close:0 "\n\nAby samemu wezwać władcę do stołu, kliknij go prawym przyciskiem i wybierz #high Negocjuj traktat#!."
 tnt_intro_opt_ok:0 "Do stołu zatem."

