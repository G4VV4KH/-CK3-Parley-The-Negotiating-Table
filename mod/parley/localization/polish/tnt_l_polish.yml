l_polish:
 # =========================================================================
 # PARLEY: THE NEGOTIATING TABLE - Polish localization. GENERATED FILE.
 # The key set and the key ORDER are identical to
 # localization\english\tnt_l_english.yml - 625 keys, house law 9 (the
 # nine-language fan). Every doctrine comment stays in the english and
 # russian files; this file carries keys only.
 # Game terms follow the VANILLA CK3 Polish localization exactly
 # (Pobozn./Prestiz/Wplyw/Postrach/Hak/Wasal/Senior/Rozejm/Zakladnik/...).
 # Concept links use vanilla Polish's own two-argument form
 # [Concept('x', 'inflected')|E] so the noun can decline; the canonical
 # concept key is always the one the english value names, so token parity
 # holds (gate check 4 normalizes both link forms to the same concept).
 # Encoding: UTF-8 WITH BOM, LF, one trailing newline.
 # =========================================================================
 tnt_open_negotiations:0 "Negocjuj traktat"
 tnt_open_negotiations_desc:0 "Wyślij posła do [recipient.GetShortUIName] i połóż na stole pełny traktat – wszystkie warunki, obie strony naraz.[actor.Custom('TntThreatCooldownStatus')]"
 tnt_bd_floor_panel:0 "Próg darów"
 tnt_threat_cooldown_status:0 "\n\n#high Przerwa między groźbami#!\nPozostało dni: [GetVarTimeRemaining(tnt_cooldown_actor.MakeScope, 'tnt_threat_cooldown')|0] (do [GetCurrentDateWithDiff(GetVarTimeRemaining(tnt_cooldown_actor.MakeScope, 'tnt_threat_cooldown'))])."
 tnt_threat_cooldown_short:0 "Przerwa: [GetVarTimeRemaining(tnt_cooldown_actor.MakeScope, 'tnt_threat_cooldown')|0] d."
 tnt_threat_cooldown_empty:0 ""
 tnt_open_negotiations_extra_icon:0 "@dread_icon! Możesz na niego naciskać – wojsko, imię i postrach razem sięgają wagi, jakiej wymaga groźba, a ostatnia groźba poszła w niepamięć"
 tnt_window_title:0 "Rokowania dyplomatyczne"
 tnt_col_actor:0 "Ty oferujesz"
 tnt_col_partner:0 "Partner oferuje"
 tnt_balance_header:0 "Odpowiedź partnera"
 tnt_balance_accept:0 "#P Partner skłania się ku zgodzie#!"
 tnt_balance_reject:0 "#N Partner skłania się ku odmowie#!"
 tnt_scale_note:0 "Ta liczba jest odpowiedzią partnera: powyżej zera – podpisze. Każdy warunek wyceniono tak, jakby uzgadniano go osobno, a opinia partnera o tobie, wiara, pokrewieństwo i wszystko, czego partner chce ponadto, są już w niej wliczone. Pasek to ta sama odpowiedź, tylko rozłożona: wszystko, co pcha partnera ku zgodzie, przeciw wszystkiemu, co pcha go ku odmowie – w chwili, gdy pasek minie środek, partner przystanie na układ."
 tnt_label_points:0 "pkt"
 tnt_label_years:0 "#weak Trwa 10 lat#!"
 tnt_picker_empty:0 "#weak Nic dostępnego#!"
 tnt_picker_empty_artifact:0 "#weak Nic z majątku tej strony nie może zmienić właściciela: klejnoty koronne idą za tytułem, sztandary dynastyczne zostają w dynastii, relikwie własnej wiary trafiają wyłącznie do współwyznawców.#!"
 tnt_item_gold:0 "Złoto"
 tnt_item_gold_desc:0 "Jednorazowa wypłata [gold_i] ze skarbca, przekazana w tej samej chwili, w której traktat zostaje przypieczętowany."
 tnt_item_prestige:0 "Prestiż"
 tnt_item_prestige_desc:0 "[prestige_i] [Concept('prestige', 'prestiż')|E] obiecany przy stole rokowań.\n\n#weak To nie skrzynia przechodząca z rąk do rąk: dający traci kwotę, a biorący ją zyskuje – dwoma osobnymi ruchami, których nic ze sobą nie wiąże. Dlatego oferty w ogóle nie da się wysłać, jeśli w chwili naciśnięcia „Zaproponuj” dający nie ma całej obiecanej sumy.#!"
 tnt_item_piety:0 "Pobożność"
 tnt_item_piety_desc:0 "[piety_i] [Concept('piety', 'pobożność')|E] obiecana przy stole rokowań.\n\n#weak I tutaj są to dwa osobne ruchy, a nie przeniesienie: ile jedna strona traci, tyle druga zyskuje. Oferty nie da się wysłać, jeśli w chwili naciśnięcia „Zaproponuj” dający nie ma całej obiecanej sumy.#!"
 tnt_item_influence:0 "Wpływ"
 tnt_item_influence_desc:0 "[influence_i] [Concept('influence', 'wpływ')|E] obiecany przy stole rokowań.\n\n#weak [Concept('influence', 'Wpływ')|E] istnieje wyłącznie przy tej formie rządów, która się na nim opiera, więc te wiersze pojawiają się tylko wtedy, gdy obie strony mają taką formę rządów – oddanie wpływu władcy bez takiego zasobu nie dałoby zgoła nic. Także tutaj są to dwa osobne ruchy, a oferty nie da się wysłać, jeśli w chwili naciśnięcia „Zaproponuj” dający nie ma całej obiecanej sumy.#!"
 tnt_item_alliance:0 "Sojusz wojskowy"
 tnt_err_ab_already_fair:0 "Traktat stoi dokładnie na #high +1#! – nie ma już czego równoważyć"
 tnt_err_ab_empty:0 "Na stole nie ma jeszcze czego równoważyć"
 tnt_threat_opinion:0 "Groził mi"
 tnt_treaty_favor_opinion:0 "Korzystny traktat"
 tnt_item_usehook_r:0 "Partner ściąga twój dług"
 tnt_item_usehook_r_desc:0 "Partner ma na ciebie [Concept('hook', 'hak')|E] i zamierza go użyć, więc oczekuje, że traktat to uwzględni.\n\n#weak Tego nie da się wyłączyć – to jego dźwignia, nie twoja. Sprawia ona, że partner ŻĄDA WIĘCEJ niż uczciwa cena: #high -45#! za przysługę, którą może ściągnąć, #high -120#! jeśli dźwignia ma siłę szantażu. Podpiszesz – dług zostanie zużyty: hak słaby zniknie, mocny pozostanie.#!\n\n#weak Odmowa nie kosztuje nic prócz samego traktatu.#!"
 tnt_usehook_r_sub:0 "[Select_CString( GreaterThanOrEqualTo_CFixedPoint( GetPlayer.MakeScope.ScriptValue('tnt_usehook_r_strength_value'), '(CFixedPoint)2' ), Localize('tnt_usehook_strong'), Localize('tnt_usehook_weak') )]"
 tnt_bd_usehook_r:0 "Ściągnięty z ciebie dług"
 tnt_item_usehook:0 "Ściągnij hak"
 tnt_item_usehook_desc:0 "Wykorzystaj dźwignię, którą już masz nad partnerem. To odwrotny kierunek niż #high Należna przysługa#!: tam oddajesz mu władzę nad sobą, tutaj ściągasz dług z niego.\n\nDziała na władcy, który nigdy cię nie polubi, więc jego waga nie zależy od względów partnera – w przeciwieństwie do wszystkiego, co możesz mu dać.\n\n#weak Ściągnięty [Concept('hook', 'hak')|E] wart jest #high +45#!, dźwignia o sile szantażu – #high +120#!. Co przetrwa użycie, rozstrzyga sama gra: hak słaby zużywa się z chwilą podpisania traktatu, mocny nie. Zostaje wydany tylko wtedy, gdy traktat naprawdę dojdzie do skutku – przysługa ściągnięta pod traktat, którego nie było, byłaby przysługą wyrzuconą w błoto.#!\n\n#weak Ściągnięcie długu ciąży na tobie dokładnie tak samo jak groźba. Twoja własna natura osądza ten czyn: niejedno sumienie poniesie go własnym #high stresem#!, a władcy zimniejszemu ulży, że wreszcie użył swojej przewagi. W oknie potwierdzenia zobaczysz, które cechy się odezwały, zanim poseł ruszy w drogę.#!"
 tnt_usehook_sub:0 "[Select_CString( GreaterThanOrEqualTo_CFixedPoint( GetPlayer.MakeScope.ScriptValue('tnt_usehook_strength_value'), '(CFixedPoint)2' ), Localize('tnt_usehook_strong'), Select_CString( GreaterThanOrEqualTo_CFixedPoint( GetPlayer.MakeScope.ScriptValue('tnt_usehook_strength_value'), '(CFixedPoint)1' ), Localize('tnt_usehook_weak'), Localize('tnt_usehook_none') ) )]"
 tnt_usehook_strong:0 "Hak mocny – użycie go nie zużywa"
 tnt_usehook_weak:0 "Hak słaby – ściągnięcie go zużywa"
 tnt_usehook_none:0 "Nie masz na partnera żadnego haka"
 tnt_bd_usehook_p:0 "Ściągnięty hak"
 tnt_err_usehook_none:0 "Nie masz na partnera haka do wykorzystania"
 tnt_item_threat:0 "Zagroź partnerowi"
 tnt_item_threat_desc:0 "Daj partnerowi do zrozumienia, ile kosztowałaby go odmowa. To nie wypowiedzenie wojny: nikt niczego nie przysięga i żadne wojsko nie rusza w pole. To ciężar położony na stole, a działa on na władcę, który nigdy cię nie polubi – czyli dokładnie tam, gdzie złoto jest bezsilne.\n\nTa waga to #high o ile twoje wojsko przewyższa jego#!, podniesione lub obniżone przez to, #high o ile twoje imię góruje nad jego#!, oraz przez to, #high o ile twój postrach jest straszliwszy od jego#!. Cały jeden szczebel sławy niżej od niego zamyka groźbę zupełnie, choćby wojsko twoje było nie wiedzieć jak wielkie – a waga, która groźbę otwiera, jest dokładnie tą, którą groźba dokłada potem do traktatu na twoją korzyść.\n\n#weak Partner to zapamięta. Traktat podpisany pod groźbą kosztuje cię „$tnt_threat_opinion$” – #high -100#! do opinii, wygasające przez piętnaście lat – a ponieważ to właśnie jego względy nadają wagę twoim darom, wzięcie czegoś strachem dzisiaj oznacza, że przez pokolenie twoje złoto kupi u niego mniej. Ale płaci nie samo twoje złoto: twoja własna natura osądza ten czyn. Niejedno sumienie poniesie ten ciężar samo, własnym #high stresem#!, a władcy zimniejszemu ulży, że wreszcie użył swojej przewagi. W oknie potwierdzenia zobaczysz, które cechy się odezwały, i dokładną wielkość, zanim poseł ruszy w drogę.#!"
 tnt_threat_sub:0 "Wojsko [GetPlayer.MakeScope.ScriptValue('tnt_threat_ratio_value')|1] do 1, imię ×[GetPlayer.MakeScope.ScriptValue('tnt_threat_rep_term_value')|0], postrach ×[GetPlayer.MakeScope.ScriptValue('tnt_threat_dread_term_value')|2]"
 tnt_bd_threat_p:0 "Czysty nacisk"
 tnt_bd_threat_panel:0 "Nacisk"
 tnt_err_threat_weak:0 "Groźba wymaga co najmniej 100 punktów umowy wynikających z siły wojskowej, prestiżu i postrachu. To samo minimum obowiązuje gracza i SI."
 tnt_err_threat_relation:0 "Grozić można tylko niezależnemu władcy, który nie jest twoim sojusznikiem ani nie łączy go z tobą zakładnik"
 tnt_err_threat_unknown:0 "Twoje imię musi cokolwiek znaczyć – poziom sławy wyższy niż zerowy"
 # tnt_err_threat_unafraid RETIRED round 8 (I2). This tombstone holds the line count so no .yml citation moves. ORPHANED 2026-08-24 BY THE RATIO RULING, KEPT DEFINED IN ALL NINE: tnt_err_threat_unknown above and tnt_err_threat_nofear below have ZERO rows - their rules are inside tnt_threat_points_value now. Law 9 and the law-10d control. DO NOT DELETE, DO NOT RE-USE FOR ANOTHER MEANING.
 tnt_err_threat_nofear:0 "Partner się ciebie nie boi. Twój postrach musi sięgnąć 75, albo 40 wobec kogoś, komu brak odwagi, albo 20 wobec kogoś, kto ci podlega"
 tnt_err_threat_recent:0 "Partner wciąż pamięta twoją poprzednią groźbę. Pozwól pamięci ostygnąć, zanim znów na niego naciśniesz"
 tnt_item_alliance_desc:0 "Jeden formalny sojusz, zaprzysiężony przez was oboje – nie jest to rzecz, którą jedna strona wręcza drugiej. Odtąd każda ze stron może wezwać drugą na wojnę, a odmowa takiego wezwania kosztuje [Concept('prestige', 'prestiż')|E].\n\n#weak Jeden wiersz na jeden pakt: albo jest w traktacie, albo go nie ma.#!\n\n#weak Zaprzysiężony z własnym [Concept('liege', 'seniorem')|E] lub własnym [Concept('vassal', 'wasalem')|E] jest trwałym przymierzem, a nie wezwaniem do broni: gra nie pozwala seniorowi i jego wasalowi wzywać się nawzajem, ale sojusz jest prawdziwy, liczy się wszędzie tam, gdzie liczą się sojusze, i przetrwa dzień, w którym jedno z was opuści państwo drugiego.#!\n\n#weak $tnt_tt_alliance_glut$#!"
 tnt_tt_alliance_glut:0 "Każdy sojusz, który już masz, obniża cenę następnego. Od drugiego sojusznika wzwyż – nie licząc własnego seniora ani własnych wasali – każdy istniejący sojusz o połowę zmniejsza wartość nowego paktu w oczach partnera, a jego własni sojusznicy robią to samo po jego stronie."
 tnt_item_truce:0 "Pakt o nieagresji"
 tnt_item_truce_desc:0 "Jeden pakt, w który wchodzicie oboje: przez #high dziesięć lat#! żadna ze stron nie może wypowiedzieć drugiej wojny.\n\n#weak Jeden wiersz na jeden pakt: albo jest w traktacie, albo go nie ma.#!"
 tnt_item_marriage:0 "Układ małżeński"
 tnt_item_marriage_desc:0 "Związek dwóch rodów, a par w jednym traktacie #high może być dowolnie wiele#!. Wybierz po jednej osobie z każdej strony, ustal, do czyjego rodu pójdą dzieci, i dodaj parę; jeśli któreś z dwojga jest jeszcze dzieckiem, para zostanie zaręczona, a nie poślubiona.\n\n#weak Każda kolejna para znaczy dla partnera nieco mniej niż poprzednia, a koszt małżeństwa po jego stronie nie maleje nigdy – kilka dobrych partii jest więc warte więcej niż tuzin pustych. Ród, któremu proponuje się związek poniżej własnej rangi, liczy sobie za taki mezalians, a im szersza przepaść, tym wyższa dopłata. Jednej parze można ponadto obiecać wielki ślub.#!\n\n#high Dość bliska partia przynosi teraz ze sobą sojusz#!, dokładnie tak jak własne zaaranżowane małżeństwo gry – a cena traktatu ten sojusz uwzględnia, więc partia, która was łączy sojuszem, warta jest więcej niż taka, która tego nie robi. #weak Podpowiedziom „Potencjalny sojusz”, które ekran małżeństw pokazuje przy kandydatach, można znowu wierzyć.#!"
 tnt_item_title:0 "Odstąpienie tytułu"
 tnt_item_title_desc:0 "Oddaj posiadany tytuł rangi hrabstwa lub wyższej wraz ze wszystkim, co mu podlega.\n\n#weak Naraz dowolnie wiele. Stolica i tytuł główny nigdy nie trafiają na stół. Nadal można zaoferować ziemie przekraczające limit domeny odbiorcy; ich wartość zależy od bieżących zasad wyceny. Przed zaproponowaniem traktatu sprawdź szczegółowe zestawienie punktów.#!"
 tnt_item_claim:0 "Nadanie roszczenia"
 tnt_item_claim_desc:0 "Nadaj niewysunięte [Concept('claim', 'roszczenie')|E] do tytułu, który dający sam posiada – otwarte zaproszenie do przyszłej wojny i bardzo ciężkie ustępstwo.\n\n#weak Naraz dowolnie wiele.#!"
 tnt_item_prisoner_multi:0 "Uwolnij wskazanych jeńców"
 tnt_item_prisoner_multi_desc:0 "Otwórz loch dla tych jeńców, których wskażesz, i dla nikogo więcej.\n\n#weak O cenie jeńca stanowią jego ranga i jego krew: #high 10#! za kogokolwiek, #high +15#! jeśli jest krewnym drugiej strony, #high +10#! jeśli w ogóle dzierży tytuł, oraz #high +15 / +25 / +40 / +60#! w miarę jak ten tytuł sięga hrabstwa, księstwa, królestwa i imperium. Pojmany król wart jest zatem więcej niż tuzin bezimiennych – na tym właśnie polega wybieranie.#!\n\n#weak Wskazanie kogokolwiek tutaj unieważnia pozycję #high Uwolnienie więźniów#!: inaczej za tych samych ludzi zapłacono by dwa razy.#!"
 tnt_multi_count_prisoner_p:0 "Wskazano jeńców: [GetPlayer.MakeScope.ScriptValue('tnt_count_sel_prisoner_p_value')|0]"
 tnt_sel_count_prisoner_p:0 "Wskazano: [GetPlayer.MakeScope.ScriptValue('tnt_count_sel_prisoner_p_value')|0]"
 tnt_picker_title_prisoner:0 "Wybierz jeńców do uwolnienia"
 tnt_item_prisoners:0 "Uwolnienie więźniów"
 tnt_item_prisoners_desc:0 "Strona uwalniająca otwiera lochy przed każdym więźniem związanym z drugą stroną krwią lub przysięgą wierności."
 tnt_item_hook:0 "Należna przysługa"
 tnt_item_hook_desc:0 "Zaciągnij wobec drugiej strony [hook_i] przysługę. Są trzy stopnie: #high słaba#! trwa dziesięć lat i zużywa się przy pierwszym użyciu; #high mocna#! trwa dwadzieścia lat, można jej używać raz po raz i wymaga pięciu lat przerwy między użyciami; #high wieczna#! nie wygasa nigdy, nie zużywa się wcale i wymaga tych samych pięciu lat przerwy.\n\n#weak Kliknięcie podnosi stopień, prawe kliknięcie go obniża. Przysługi nie można obiecać, jeśli strona, która miałaby ją otrzymać, już trzyma taką nad dającym.#!"
 tnt_item_artifact:0 "Artefakt"
 tnt_item_artifact_desc:0 "Oddaj [artifact_i] artefakt ze skarbca dającego.\n\n#weak Naraz dowolnie wiele. Nie są wymieniane przedmioty, których sama gra nie pozwala oddać: klejnoty koronne związane z tytułem, sztandary dynastyczne oraz relikwie własnej wiary dającego, gdy biorący wyznaje inną.#!"
 tnt_item_nonwar:0 "Obietnica nienapadania"
 tnt_item_nonwar_desc:0 "Zaprzysięgnij jednostronny [Concept('truce', 'rozejm')|E] z trzecim władcą na #high dziesięć lat#!; złamanie rozejmu pociąga za sobą surową karę.\n\nKogo można wskazać: władców, których państwa graniczą z państwem przyrzekającego, oraz posiadaczy tytułów, do których przyrzekający ma roszczenie. Nigdy zaś: samych negocjujących, sojuszników przyrzekającego ani nikogo, z kim już wiąże go rozejm.\n\n#weak Druga strona nie jest nic winna w zamian – przyrzekający po prostu powstrzymuje własną rękę.#!"
 tnt_item_vassal:0 "Przysięga wierności"
 tnt_item_vassal_desc:0 "Jeden władca klęka i zostaje [Concept('vassal', 'wasalem')|E] drugiego – wraz z całym swoim państwem. Najcięższy warunek, jaki ten stół może udźwignąć, i jedyny, do którego dołącza spisany kontrakt otwarty na poprawki."
 tnt_item_indep:0 "Nadanie niezależności"
 tnt_item_indep_desc:0 "Wasal zostaje zwolniony z przysięgi wierności i staje się władcą niezależnym. Po twojej stronie stołu wolność odzyskuje twój własny wasal; po stronie partnera – ty. Jeden traktat nie może nieść tego i przysięgi wierności naraz.\n\n#weak Można to zaproponować tylko tam, gdzie oboje stoicie już jako senior i bezpośredni wasal, uwalniany posiada własną ziemię, żadne z państw nie prowadzi wojny, a jego ziemie nie należą do dziedzictwa seniora de iure.#!"
 tnt_item_hostage:0 "Zakładnik"
 tnt_item_hostage_desc:0 "Bliski krewny dającego – dziecko, wnuczę, rodzeństwo lub dziecko rodzeństwa – jedzie na dwór drugiej strony i żyje tam jako zakładnik, rękojmia tego traktatu. Jest gościem wedle własnych zasad gry o zakładnikach, a nie więźniem.\n\n#weak Zastawić można wyłącznie krewnych bezziemnych, niebędących w związku małżeńskim ani zaręczonych, którzy już przebywają na jego dworze – i nigdy własnego regenta.#!"
 tnt_item_ward:0 "Wychowanek"
 tnt_item_ward_desc:0 "Dziecko z dworu dającego zostaje wysłane na wychowanie do drugiego władcy. Ten władca sam zostaje opiekunem – nie ma trzeciej strony do wyboru.\n\n#weak Zaproponować można wyłącznie dzieci przebywające na jego dworze i zdolne do podróży, a opiekun nie może przyjąć trzeciego wychowanka.#!"
 tnt_item_courtier:0 "Dworzanie"
 tnt_item_courtier_desc:0 "Dworzanie przenoszą się na inny dwór, każdy wraz z małżonkiem i małoletnimi dziećmi.\n\n#weak Oddać można wyłącznie dorosłych, bezziemnych mieszkańców dworu dającego, którzy nie pełnią w nim żadnego urzędu – nie dziedzica, nie małżonka, nie regenta, nie radnych, nie rycerzy ani urzędników dworskich – i nigdy kogoś, kogo biorący uważa za rywala.#!"
 tnt_item_subject_desc:0 "Wybrani wasale zmieniają seniora i przechodzą do państwa drugiego władcy wraz ze wszystkimi swoimi tytułami i wszystkimi własnymi wasalami.\n\n#weak Ich kontrakt wasalny zostaje spisany na nowo, na zwykłych warunkach państwa przyjmującego, więc szczególne zobowiązania przepadają. Po przekazaniu nie powstaje żaden rozejm, a wasala, który przekroczył granicę państwa, nie sprowadzi z powrotem nic prócz wojny. Oddać można wyłącznie bezpośredniego wasala władającego co najmniej hrabstwem, niższego rangą od władcy, który go przyjmuje, i będącego w pokoju ze wszystkimi zainteresowanymi – nigdy regenta i nigdy dziedzica – a wasala raz przeniesionego układem nie wolno przenosić ponownie przez trzy lata.#!"
 tnt_item_subject:0 "Przekazanie wasala"
 tnt_bd_base:0 "Pozycja wyjściowa"
