 tnt_hook_tier_3:0 "Wieczna przysługa"
 tnt_stepper_hook_tt:0 "#weak Lewe kliknięcie: przysługa mocniejsza. Prawe kliknięcie: słabsza.#!\n\n#weak Przysługi nie da się podnieść ponad zero, dopóki strona, która miałaby ją otrzymać, trzyma już hak nad tą, która miałaby ją zaciągnąć.#!"
 tnt_err_hook_taken_p:0 "Partner ma już nad tobą przysługę, a drugiej nie można obiecać, dopóki pierwsza nie zostanie zużyta."
 tnt_err_hook_taken_r:0 "Ty masz już przysługę nad partnerem, a drugiej nie można obiecać, dopóki pierwsza nie zostanie zużyta."
 tnt_picker_title_contract:0 "Warunki przysięgi wierności"
 tnt_btn_edit_contract:0 "Zmień warunki przysięgi."
 tnt_ob_note_p:0 "To #high ty#! klękasz. Każdy warunek poniżej wiąże ciebie i twoich dziedziców."
 tnt_ob_note_r:0 "To #high partner#! klęka. Każdy warunek poniżej wiąże jego i jego dziedziców."
 tnt_ob_note_none:0 "Na stole nie ma jeszcze żadnej przysięgi. Włącz #high Przysięgę wierności#! w którejkolwiek kolumnie, a warunki tej przysięgi znajdą się w twoich rękach: podatki, pospolite ruszenie i prawa, które poddany zachowuje."
 tnt_ob_note_gov:0 "Ta forma rządów nie ma [Concept('vassal_contract', 'kontraktu wasalnego')|E], o który dałoby się targować: podatki, pospolite ruszenie i prawa przynosi na stół wyłącznie poddany feudalny."
 tnt_ob_reset_btn:0 "Prosta przysięga"
 tnt_ob_reset_tt:0 "Cofnij wszystkie warunki do gołej przysięgi wierności: zwykłe podatki, zwykła liczba kmieci i żadne z praw wymienionych poniżej."
 tnt_ob_total_label:0 "Te warunki są warte"
 tnt_ctx_contract:0 "Warunki przysięgi: zmieniono [GetPlayer.MakeScope.ScriptValue('tnt_ob_changed_value')|0], wartość [GetPlayer.MakeScope.ScriptValue('tnt_ob_sheet_total_value')|0]"
 tnt_ob_group_obligations:0 "Co poddany oddaje"
 tnt_ob_group_obligations_tt:0 "Dwa zobowiązania, które idą wraz z samą przysięgą; każde biegnie od zupełnego zwolnienia po zdzierstwo.\n\n#weak Dopóki ich nie ruszysz, oba stoją pośrodku, a środek to dokładnie to, co mówi zwykły [Concept('vassal_contract', 'kontrakt wasalny')|E].#!"
 tnt_ob_group_rights:0 "Co poddany zachowuje"
 tnt_ob_group_rights_tt:0 "Prawa, których senior się zrzeka, punkt po punkcie.\n\n#weak Żadne z nich nie należy do zwykłej przysięgi, więc każda pieczęć poniżej jest ustępstwem – prócz ostatniej, gdzie senior nie daje, lecz bierze.#!"
 tnt_ob_status_default:0 "Zwykła przysięga – nic nie zmieniono."
 tnt_ob_status_changed:0 "Zmieniono: #high [GetPlayer.MakeScope.ScriptValue('tnt_ob_changed_value')|0]#! z dziewięciu warunków."
 tnt_ob_tax_label:0 "Podatki"
 tnt_ob_tax_desc:0 "Jaką część swoich dochodów poddany oddaje co miesiąc seniorowi.\n\n#weak Zejdź drabiną w dół, a poddany zatrzyma więcej – to dar dla tego, kto klęka; podnieś ją, a senior weźmie więcej. Prosta przysięga wierności stoi pośrodku.#!"
 tnt_ob_tax_step_tt:0 "#weak Lewe kliknięcie: o jeden szczebel. Prawe kliknięcie: od razu na koniec.#!"
 tnt_ob_tax_lvl0:0 "[GetSubjectContractType( 'feudal_government_taxes' ).GetObligationNameShortNoTooltip( 'feudal_tax_exempt' )]"
 tnt_ob_tax_lvl1:0 "[GetSubjectContractType( 'feudal_government_taxes' ).GetObligationNameShortNoTooltip( 'feudal_tax_low' )]"
 tnt_ob_tax_lvl2:0 "[GetSubjectContractType( 'feudal_government_taxes' ).GetObligationNameShortNoTooltip( 'feudal_tax_normal' )]"
 tnt_ob_tax_lvl3:0 "[GetSubjectContractType( 'feudal_government_taxes' ).GetObligationNameShortNoTooltip( 'feudal_tax_high' )]"
 tnt_ob_tax_lvl4:0 "[GetSubjectContractType( 'feudal_government_taxes' ).GetObligationNameShortNoTooltip( 'feudal_tax_extortionate' )]"
 tnt_ob_levy_label:0 "Pospolite ruszenie"
 tnt_ob_levy_desc:0 "Ilu kmieci poddanego senior może powołać pod broń.\n\n#weak Zejdź drabiną w dół, a poddany zatrzyma ludzi w domu; podnieś ją, a senior wywoła ich w pole. Prosta przysięga wierności stoi pośrodku.#!"
 tnt_ob_levy_step_tt:0 "#weak Lewe kliknięcie: o jeden szczebel. Prawe kliknięcie: od razu na koniec.#!"
 tnt_ob_levy_lvl0:0 "[GetSubjectContractType( 'feudal_government_levies' ).GetObligationNameShortNoTooltip( 'feudal_levies_exempt' )]"
 tnt_ob_levy_lvl1:0 "[GetSubjectContractType( 'feudal_government_levies' ).GetObligationNameShortNoTooltip( 'feudal_levies_low' )]"
 tnt_ob_levy_lvl2:0 "[GetSubjectContractType( 'feudal_government_levies' ).GetObligationNameShortNoTooltip( 'feudal_levies_normal' )]"
 tnt_ob_levy_lvl3:0 "[GetSubjectContractType( 'feudal_government_levies' ).GetObligationNameShortNoTooltip( 'feudal_levies_high' )]"
 tnt_ob_levy_lvl4:0 "[GetSubjectContractType( 'feudal_government_levies' ).GetObligationNameShortNoTooltip( 'feudal_levies_extortionate' )]"
 tnt_ob_relig_label:0 "Prawa religijne"
 tnt_ob_relig_desc:0 "Poddany może w spokoju trwać przy własnej wierze: #high +5#! do opinii o seniorze, #high +5#! do opinii w jego własnych hrabstwach, a za to, w co wierzy, nie spotka go nigdy prześladowanie.\n\n#weak Najcenniejsze prawo na tym arkuszu – i nic nieznaczące, dopóki oboje wyznajecie tę samą wiarę.#!"
 tnt_ob_council_label:0 "Zagwarantowane miejsce w radzie"
 tnt_ob_council_desc:0 "Poddany może zażądać miejsca w radzie seniora i nie wolno mu odmówić: #high +5#! do opinii o seniorze.\n\n#weak Seniora kosztuje to 2 punkty opinii u jego wasali wpływowych, którym obiecane komu innemu miejsce jest solą w oku.#!"
 tnt_ob_revoke_label:0 "Tytuły nie do odebrania"
 tnt_ob_revoke_desc:0 "Senior zrzeka się prawa do odbierania poddanemu tytułów: #high +5#! do opinii o seniorze.\n\n#weak To, czego senior tu ustępuje, jest zwyczajnym narzędziem karności.#!"
 tnt_ob_war_label:0 "Swoboda wypowiadania wojen"
 tnt_ob_war_desc:0 "Poddanego nie wiążą już zasady seniora co do prowadzenia wojen: #high +5#! do opinii o seniorze.\n\n#weak Wojny wszczęte w ten sposób pozostają wojnami poddanego – jego zwycięstwem albo jego klęską.#!"
 tnt_ob_fort_label:0 "Prawa budowy fortec"
 tnt_ob_fort_desc:0 "Poddany buduje zamki taniej i trzyma każdą fortecę o poziom wyżej.\n\n#weak Kosztuje to seniora dziesiątą część podatku, który daje ten kontrakt, i wymaga, by [Concept('culture', 'kultura')|E] seniora odblokowała innowację #high $innovation_battlements$#!.#!"
 tnt_ob_coin_label:0 "Prawa bicia monet"
 tnt_ob_coin_desc:0 "Poddany bije własną monetę: #high +0,3#! miesięcznego [Concept('development', 'rozwoju')|E] w jego stołecznym [Concept('county', 'hrabstwie')|E].\n\n#weak Senior traci za to 2% własnego przyrostu rozwoju, a rzecz wymaga, by [Concept('culture', 'kultura')|E] seniora odblokowała innowację #high $innovation_currency_02$#!.#!"
 tnt_ob_succ_label:0 "Wymuszony podział"
 tnt_ob_succ_desc:0 "#N Ten warunek sprzyja seniorowi, a nie poddanemu.#! Poddany zostaje zamknięty w sukcesji podziałowej i nigdy nie wyjdzie z niej drogą prawa: #high -5#! do opinii o seniorze.\n\n#weak Zaznaczenie go przesuwa szalę w drugą stronę – to rzecz, którą bierzesz, a nie dajesz.#!"
 tnt_ob_req_feudal:0 "Tylko poddany feudalny ma podatki, pospolite ruszenie i prawa do negocjowania – najpierw włącz #high Przysięgę wierności#! w jednej z dwóch kolumn."
 tnt_ob_req_relig:0 "Aby to cokolwiek chroniło, musicie wyznawać różne wiary."
 tnt_ob_req_fort:0 "Kultura seniora musi mieć odblokowaną innowację #high $innovation_battlements$#!."
 tnt_ob_req_coin:0 "Kultura seniora musi mieć odblokowaną innowację #high $innovation_currency_02$#!."
 tnt_ob_req_succ:0 "Poddany musi być zdolny utrzymać sukcesję #high $confederate_partition_succession_law$#!."
 tnt_ob_req_revoke:0 "Nie wtedy, gdy wiara seniora obciąża podatkiem innowierców, a wasze wiary są różne."
