 tnt_action_can_lean_on:0 "@dread_icon! Przewaga jest po twojej stronie"
 tnt_action_can_lean_on_label:0 "@dread_icon! Możesz naciskać na [recipient.GetPrimaryTitle.Custom('GetTierIcon')][recipient.GetUINameNoTooltip]"
 tnt_action_can_lean_on_desc:0 "[recipient.GetUIName] – na niego możesz naciskać: twoje wojsko, twoje imię i twój postrach, każde zmierzone z jego własnym, sięgają wagi, jakiej wymaga groźba, a ostatnia groźba poszła w niepamięć. Połóż groźbę na stole, a ta sama waga dołoży się do tego, co gotów jest znieść: zapłaci więcej, byle skończyć rozmowę."
 tnt_action_can_lean_on_click:0 "#I Kliknij, aby negocjować traktat#!"
 tnt_action_can_lean_on_combined_label:0 "[recipient.GetPrimaryTitle.Custom('GetTierIcon')] [recipient.GetUINameNoTooltip]"
 tnt_action_can_lean_on_combined_group_label:0 "@dread_icon! Władcy, nad którymi masz przewagę"
 tnt_action_can_lean_on_combined_group_name:0 "@dread_icon! Władcy, na których możesz naciskać"
 tnt_action_can_lean_on_combined_group_description:0 "Wśród twoich własnych wasali, twoich seniorów oraz sąsiadów zza granicy i zza morza na każdego z tych władców możesz naciskać: twoje wojsko, twoje imię i twój postrach, każde zmierzone z jego własnym, sięgają wagi, jakiej wymaga groźba, a ostatnia groźba poszła w niepamięć. Rozpocznij z którymkolwiek z nich negocjacje i zaznacz „Zagroź partnerowi”, aby położyć groźbę na stole."
 tnt_msg_stale:0 "Warunki się zmieniły"
 tnt_err_deal_changed:0 "Umowy nie można już wykonać w zapisanej formie; niczego nie wymieniono."
 tnt_err_currency_opposite_selected:0 "Ten zasób jest już wybrany po drugiej stronie umowy. Najpierw go stamtąd usuń."
 tnt_interest_preview_currency:0 "Podgląd przy obecnych zapasach, przed wyborem ilości. Większe ilości mogą zmienić zainteresowanie."
 tnt_interest_preview_context:0 "Wstępne zainteresowanie na podstawie obecnej sytuacji, nie cena ani zezwolenie. Obiekt, ilość i okoliczności mogą zmienić zainteresowanie. Cechy własne osobno wpływają na wartość bazową."
 tnt_interest_preview_contract:0 "Podgląd zmiany korzystnej dla partnera. Po zmianie zobowiązania kierunek i dokładne zainteresowanie zostaną przeliczone."
 tnt_interest_bd_preview_domain_capacity:0 "Kolejne hrabstwo przekroczyłoby limit domeny"
 tnt_interest_bd_preview_domain_relief:0 "Ulga po oddaniu hrabstwa ponad limit domeny"
 tnt_interest_bd_preview_vassal_capacity:0 "Kolejny bezpośredni wasal przekroczyłby limit"
 tnt_interest_bd_preview_vassal_relief:0 "Ulga po oddaniu bezpośredniego wasala ponad limit"
 tnt_interest_bd_preview_council_vacancies:0 "Wolne stanowiska rady: podgląd dla jednego dworzanina"
 tnt_interest_bd_preview_artifact_base:0 "Bazowe zainteresowanie artefaktem; miejsce i użycie jeszcze nieznane"
 tnt_interest_bd_preview_receiving_demand:0 "Krańcowe zapotrzebowanie przy obecnych zasobach"
 tnt_interest_bd_preview_surrender_reserve:0 "Wrażliwość na uszczuplenie obecnych rezerw"
