 tnt_wed_remove_tip:0 "Wykreśl tę parę z traktatu."
 tnt_sheet_remove_tip:0 "Wykreśl ten warunek z układu."
 tnt_wed_row_line:0 "[Select_CString( GreaterThan_CFixedPoint( Character.MakeScope.Var('tnt_wed_matri').GetValue, '(CFixedPoint)0' ), Localize('tnt_wed_row_line_matri'), Localize('tnt_wed_row_line_patri') )]"
 tnt_wed_row_line_matri:0 "[matrilineal|E]"
 tnt_wed_row_line_patri:0 "[patrilineal|E]"
 tnt_wed_row_line_tip:0 "Do czyjego rodu urodzą się dzieci tej pary. Kliknij, aby zmienić linię: #high [Concept('patrilineal', 'patrylinearna')|E]#! oddaje je rodowi ojca, #high [Concept('matrilineal', 'matrylinearna')|E]#! – rodowi matki.\n\n#weak Każda para w traktacie ma własną linię, a od linii zależy również to, czy wolno ci wyprawić jej wielki ślub.#!"
 tnt_wed_taper:0 "Każda para po pierwszej znaczy dla partnera nieco mniej niż poprzednia, a to, ile małżeństwo go #high kosztuje#! – oddany dziedzic, ustąpiona linia – nie tanieje nigdy.\n\nTrzy pary warte są około #high 2,7#! pojedynczej partii; piąta dokłada już tylko #high 0,6#!, a dalej zysk przestaje rosnąć zupełnie.\n\n#weak Dwie czy trzy dobre partie są więc warte więcej niż tuzin pustych.#!"
 tnt_wed_grand:0 "Obiecaj wielki ślub"
 tnt_wed_grand_desc:0 "Daj słowo, że uczcisz jedną z tych partii wielkim weselem. #high Uhonorowana para zostaje zaręczona, a nie poślubiona#!, a druga strona ceni taką partię o wiele wyżej – za sam honor.\n\nCo bierzesz na siebie: zostajesz obiecanym gospodarzem, a twoje słowo wiąże tylko przez kilka lat. #high Wyprawienie ślubu, zwołanie gości i opłacenie tego wszystkiego pozostaje twoją rzeczą#! – nikt nie zaplanuje tego za ciebie, a dopóki tego nie zrobisz, tych dwoje jest wyłącznie zaręczonych. Pozwól obietnicy wygasnąć, a złamanego słowa nikt ci nie zapomni.\n\n#weak W jednym traktacie uhonorować można jedną parę, musi to być twoja własna rodzina, a linia główna musi pozostać przy tobie.#!"
 tnt_wed_grand_couple:0 "Wielki ślub obiecany parze: [GetPlayer.MakeScope.Var('tnt_wed_principal').Char.GetShortUIName] i [GetPlayer.MakeScope.Var('tnt_wed_principal').Char.MakeScope.Var('tnt_wed_partner').Char.GetShortUIName]"
 tnt_wed_principal_tag:0 "Wielki ślub"
 tnt_wed_set_principal_tip:0 "Przenieś wielki ślub na tę parę. W jednym traktacie uhonorować można tylko jedną parę, a przeniesienie tego zaszczytu nic nie kosztuje, dopóki traktat nie zostanie przypieczętowany."
 tnt_item_wed_dread:0 "Strach przed tobą"
 tnt_wed_dread_detail:0 "Partner się ciebie boi: swoich odda chętnie, sam wiązać się z tobą nie chce"
 tnt_err_no_pairs:0 "Do tego układu nie dodano jeszcze żadnego małżeństwa."
 tnt_err_pair_dup:0 "Jedno z tych dwojga jest już w tym układzie obiecane komu innemu."
 tnt_err_grand_no_dlc:0 "Wielki ślub wymaga dodatku „Tours & Tournaments”."
 tnt_err_grand_no_host:0 "Nie wyprawisz wielkiego ślubu: potrzeba do tego władcy z ziemią o randze wyższej niż baron, a ty musisz mieć swobodę przyjmowania gości."
 tnt_err_grand_no_gold:0 "Nie stać cię na wyprawienie wielkiego ślubu."
 tnt_err_grand_promised:0 "Wielki ślub został już przez ciebie obiecany."
 tnt_err_grand_not_family:0 "Wielki ślub możesz wyprawić wyłącznie własnej rodzinie – bliskiej lub dalszej."
 tnt_err_grand_not_dominant:0 "Wyprawisz go tylko wtedy, gdy linia główna pozostaje przy twojej stronie: dla panny młodej z twojego dworu potrzeba związku matrylinearnego, dla pana młodego – patrylinearnego."
