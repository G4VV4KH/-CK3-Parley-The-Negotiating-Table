 tnt_err_truce_dead:0 "Jedno z was nie jest już wśród żywych."
 tnt_err_hostage_p_unavailable:0 "Nie masz kogo wysłać jako zakładnika albo partner nie przyjmie od ciebie rękojmi."
 tnt_err_hostage_r_unavailable:0 "Partner nie ma kogo wysłać jako zakładnika albo ty nie możesz przyjąć od niego rękojmi."
 tnt_err_ward_p_unavailable:0 "Nie masz dziecka do oddania pod jego opiekę albo jego dwór nie może żadnego wychować."
 tnt_err_ward_r_unavailable:0 "Partner nie ma dziecka do oddania pod twoją opiekę albo twój dwór nie może żadnego wychować."
 tnt_err_courtier_p_unavailable:0 "Nikogo z twojego dworu nie da się oddać – niechętni, zaprzysiężeni i uwięzieni zostają."
 tnt_err_courtier_r_unavailable:0 "Nikogo z dworu partnera nie da się tobie oddać."
 tnt_err_subject_and_vassal:0 "Układ niosący hołd całego państwa nie potrzebuje jeszcze jednego wasala wyłuskanego z niego osobno. Zdejmij ze stołu przysięgę albo zdejmij wasala."
 tnt_err_subject_r_unavailable:0 "Żadnego z ich wasali nie da się teraz tobie oddać: musisz sam władać ziemią i być gotów przyjąć kolejnych poddanych, a wy dwaj musicie być w pokoju."
 tnt_err_subject_p_unavailable:0 "Żadnego z twoich wasali nie da się teraz oddać, a przyczyna może leżeć po ich stronie stołu, nie po twojej: władca, który miałby ich przyjąć, musi sam władać ziemią i być gotów przyjąć kolejnych poddanych, a wy dwaj musicie być w pokoju."
 tnt_err_indep_p_unavailable:0 "Uwolnienie nie jest teraz możliwe: partner musi być twoim wasalem, oboje musicie trwać w pokoju (i żaden z twoich wasali nie może z nim wojować), jego ziemie muszą leżeć poza twoimi tytułami de iure, a on sam nie może być twoim koregentem."
 tnt_err_indep_r_unavailable:0 "Uwolnienie nie jest teraz możliwe: musisz być wasalem partnera, oboje musicie trwać w pokoju (i żaden z jego wasali nie może z tobą wojować), twoje ziemie muszą leżeć poza jego tytułami de iure, a ty nie możesz być jego koregentem."
 tnt_err_people_pair:0 "Ten traktat przeczy sam sobie: nie może jednym tchem uwalniać wasala i brać nowego."
 tnt_ai_offer_title:0 "Poselstwo od [tnt_deal_partner.GetTitledFirstName]"
 tnt_ai_offer_desc_a1:0 "Herold, którego przysyła [tnt_deal_partner.GetTitledFirstName], wchodzi z kurzem drogi jeszcze na płaszczu i przechodzi do rzeczy z obcesowością człowieka, który jechał ostro.\n\nJego pan nie chce z tobą zwady. Prosi o zaprzysiężony pakt: przez #high dziesięć lat#! żadne z was nie dobywa miecza na drugie – a przywiózł i grosz, by obietnicę związać, bo słowo nic nie kosztuje i on o tym wie."
 tnt_ai_offer_desc_a2:0 "[tnt_deal_partner.GetTitledFirstName] przysyła nie pisarza, lecz krewnego, i to samo w sobie jest połową wiadomości.\n\nProponuje zaprzysiężony sojusz wojskowy: wasze chorągwie podniesione razem, każde z was wolne wezwać drugie, gdy przyjdzie wojna – a oboje wiecie, że przyjdzie."
 tnt_ai_offer_desc_a3:0 "Poseł, którego śle [tnt_deal_partner.GetTitledFirstName], mówi cicho i nie prosi o nic, co dałoby się położyć na wadze.\n\nJego pan woli twoje słowo: jedną należną przysługę, do ściągnięcia w chwili przez siebie wybranej. Długi tego rodzaju ściąga się zawsze w najgorszym możliwym momencie – i właśnie dlatego warto je kupować."
 tnt_ai_offer_desc_a9:0 "[tnt_deal_partner.GetTitledFirstName] nie śle ani daru, ani pochlebstwa – tylko przypomnienie.\n\nJest przysługa do oddania, a poseł przybył dopilnować, by stało się jej zadość. To, co kładzie na stole, nie jest prośbą, lecz rachunkiem: dług wymieniono na głos, a warunki poniżej są tym, co go zamknie."
 tnt_ai_offer_desc_a5:0 "Poseł, którego śle [tnt_deal_partner.GetTitledFirstName], nie siada i nie udaje, że to sztuka rządzenia.\n\nW twoich lochach gniją mężczyźni i kobiety z jego rodu i jego wierności. Jego pan chce ich w domu i przywiózł dość, by strata dozorcy lochu ci się opłaciła."
 tnt_ai_offer_desc_a6:0 "To poselstwo przybywa z heroldami, rogami i orszakiem świadków: [tnt_deal_partner.GetTitledFirstName] chce, by cały świat widział, co tu zostanie podpisane.\n\nRzecz dotyczy wzajemnego paktu na #high dziesięć lat#!, a dla przypieczętowania go publicznie jego pan odstąpi ci przed zgromadzonymi dworami część własnego [Concept('prestige', 'prestiżu')|E]. Pokoju kupionego tak głośno trudno się potem wyprzeć którejkolwiek ze stron."
 tnt_ai_offer_desc_a8:0 "[tnt_deal_partner.GetTitledFirstName] pisze o granicach i o groszu. Jest twoja ziemia – wymieniona w warunkach poniżej – która leżałaby naturalniej pod jego chorągwią, a on woli ją uczciwie kupić, niż po cichu jej pożądać. Cena wypisana jest w całości; pieczęć czeka na twoją odpowiedź."
 tnt_ai_offer_desc_a10:0 "[tnt_deal_partner.GetTitledFirstName] oferuje ziemię. Jedna z jego posiadłości – wymieniona poniżej – jest mu bardziej ciężarem niż pożytkiem, a wolałby widzieć ją w twoich rękach, a swoje skrzynie cięższe. Cena, jakiej od ciebie żąda, stoi wśród warunków."
 tnt_ai_offer_desc_a11:0 "[tnt_deal_partner.GetTitledFirstName] oferuje nie ziemię, lecz prawną do niej drogę: roszczenie do jednego z własnych tytułów, spisane i opieczętowane, twoje do wysunięcia, kiedy uznasz za stosowne. Atrament prawników jest tańszy niż krew żołnierzy – choć nie darmowy, o czym świadczą warunki poniżej."
 tnt_ai_offer_desc_a13:0 "Poseł, którego śle [tnt_deal_partner.GetTitledFirstName], odsłania skarb przywieziony dla twoich oczu: przedmiot z jego własnej sali, wymieniony w warunkach poniżej. Oferuje go za uczciwy grosz – takie rzeczy znajdują nowych panów wdzięczniej przez stół niż przez pole bitwy."
 tnt_ai_offer_desc_a14:0 "[tnt_deal_partner.GetTitledFirstName] powierza pergaminowi słowa, jakich mało który władca waży się spisać: gotów jest uklęknąć. Jego państwo przeszłoby pod twoją opiekę, a jego chorągwie pod twoje – za wynagrodzeniem wypisanym w warunkach poniżej. Rozważ to dobrze; raz złożonej przysięgi wierności nie cofa się lekko."
 tnt_ai_offer_desc_a15:0 "[tnt_deal_partner.GetTitledFirstName] prosi o miejsce przy twoim ognisku – nie dla siebie, lecz dla swojego dziecka, wymienionego poniżej, by wychowało się na twoim dworze. Taki wychowanek jest zarazem zaszczytem i więzią między rodami; co dziecku towarzyszy, wypisano w warunkach."
 tnt_ai_offer_desc_a16:0 "Mój poseł niesie propozycję droższą niż złoto: połączmy nasze rody. Oddaję kogoś z własnej krwi za kogoś z twojej, aby obie nasze linie miały jedną przyszłość. Partia wymieniona jest poniżej; zważ ją tak, jak ważysz każdy inny mój układ."
 tnt_ai_offer_desc_a17:0 "[tnt_deal_partner.GetTitledFirstName] pisze jak wasal, który zważył swoją przysięgę i uznał ją za ciężką.\n\nProsi o zwolnienie z wierności wobec ciebie – chorągwie znowu własne, sala nikomu nieodpowiadająca – i nie prosi o to za darmo: to, co kładzie w zamian, stoi wśród warunków poniżej. Przysięga zwrócona nie jest przysięgą złamaną; nie jest też oddawana lekko."
 tnt_ai_offer_desc_a18:0 "Poselstwo, które śle [tnt_deal_partner.GetTitledFirstName], nie przybywa z pustymi rękami, a to, co niesie, nie jest złotem.\n\nDziecko jego własnej krwi, wymienione poniżej, zostaje oddane pod twoją pieczę jako zakładnik – rękojmia, że dane ci słowo będzie trzymać, dopóki dziecko przebywa pod twoim dachem. Czego żąda w zamian za tak drogi zastaw, wpisano w warunki."
 tnt_ai_offer_desc_a19:0 "[tnt_deal_partner.GetTitledFirstName] usłyszał o kimś na twoim dworze i chce go dla siebie.\n\nOsobę tę wymieniono poniżej. Prosi, by wypuścić ją na jego służbę, i nie oczekuje przysługi za darmo – sakiewka stoi wśród warunków. Jeden dworzanin to dla wielkiej sali drobiazg; cena za niego oferowana już nie."
 tnt_ai_offer_desc_a20:0 "[tnt_deal_partner.GetTitledFirstName] gotów jest uklęknąć – lecz nie na ślepo.\n\nJego państwo przeszłoby pod twoją koronę na warunkach wpisanych w kontrakt poniżej: co ci będzie oddawał i co zamierza zachować dla siebie. Wierność kupiona za uczciwą cenę trzyma dłużej niż wierność wzięta siłą. Przeczytaj warunki, zanim je przypieczętujesz."
 tnt_ai_offer_desc_generic:0 "Zapowiedziano posła, którego śle [tnt_deal_partner.GetTitledFirstName]; kłania się i kładzie na stole opieczętowaną propozycję. Warunki spisano poniżej ręką jego pana, a on czeka na twoją odpowiedź."
 tnt_ai_offer_desc_outro:0 "\n\n#weak Twoi dyplomaci zważyli to na tej samej wadze, na której ważysz ty.#!"
 tnt_ai_goal_claim:0 "#weak Twoi informatorzy szepcą: ten ród żywi roszczenie do twojej ziemi, a złoto wydaje mu się tańsze niż krew.#!\n\n"
 tnt_ai_goal_dejure:0 "#weak Twoi prawnicy to potwierdzają: ta ziemia ciąży ku jego koronie dawnym prawem – a on o tym nie zapomniał.#!\n\n"
 tnt_ai_goal_kin:0 "#weak Powodu nie trzeba daleko szukać: jego własna krew siedzi w twoim lochu.#!\n\n"
 tnt_ai_goal_menaced:0 "#weak Twoi ludzie z pogranicza donoszą: nad jego ziemią wisi silniejszy sąsiad, a jemu pilno do przyjaciół.#!\n\n"
 tnt_ai_goal_rich:0 "#weak Twoi kupcy wiedzą to na pewno: jego skarbiec jęczy od złota, które szuka sobie celu.#!\n\n"
 tnt_ai_goal_poor:0 "#weak Twoi kupcy szepcą: jego skrzynie świecą pustkami, a jemu rozpaczliwie brakuje grosza.#!\n\n"
 tnt_ai_goal_overdomain:0 "#weak Twoi prawnicy zauważają: trzyma więcej ziemi, niż jedna ręka utrzymać zdoła – nadmiar szuka kupca.#!\n\n"
 tnt_ai_goal_heir:0 "#weak Na jego dworze nie jest to tajemnicą: dziedzic wszedł w lata, a łoże małżeńskie stoi puste – potrzeba im partii.#!\n\n"
 tnt_ai_goal_brood:0 "#weak Twoi ludzie z tego żartują: jego sale roją się od dzieci, a każde z nich potrzebuje dworu, miejsca przy stole i nauczyciela.#!\n\n"
 tnt_ai_goal_schemer:0 "#weak Twoi informatorzy ostrzegają: ten dwór zbudowano z szeptów, a jego pan nigdy nie kupuje obietnicy, której nie zamierza spieniężyć.#!\n\n"
 tnt_ai_goal_yoke:0 "#weak Twoi zarządcy słyszą to od jego służby: przysięga leży temu rodowi krzywo, a jego panowie mówią o dawnej wolności.#!\n\n"
 tnt_ai_goal_talent:0 "#weak Twój podkomorzy wskazuje powód: jego salom brakuje kogoś tego rzemiosła, a w twoich taki się znajdzie.#!\n\n"
 tnt_ai_goal_surety:0 "#weak Twoi posłowie czytają to wprost: chce wynieść swoją dobrą wiarę ponad wszelkie twoje wątpienie i zastawi w tym celu własną krew.#!\n\n"
 tnt_ai_goal_might:0 "#weak Twoi ludzie z pogranicza donoszą: jego zastępy stoją zebrane i bezczynne, a on od pewnego czasu liczy twoje wojska.#!\n\n"
 tnt_ai_goal_blank:0 ""
 tnt_ai_offer_opt_accept:0 "Przyjmij te warunki"
 tnt_ai_offer_opt_counter:0 "Otwórz stół rokowań"
 tnt_ai_offer_counter_tt:0 "#high Otwiera twoje własne okno rokowań z już rozłożonymi na nim warunkami partnera.#! Zmień, co zechcesz, wykreśl, co ci się nie podoba, dołóż własne żądania – i odeślij traktat przekształcony. Nic nie jest obiecane, dopóki nie naciśniesz „Zaproponuj”."
 tnt_ai_offer_opt_decline:0 "Odpraw posłów"
 tnt_ai_offer_opt_hush:0 "Odpraw posłów i nie przyjmuj więcej poselstw"
 tnt_ai_offer_hush_tt:0 "Przez #high dziesięć lat#! żaden władca nie przystąpi do ciebie z traktatem."
 tnt_ai_demand_title:0 "Żądanie od [tnt_deal_partner.GetTitledFirstName]"
 tnt_ai_demand_desc_a21:0 "Poseł [tnt_deal_partner.GetTitledFirstName] nie przywozi ani daru, ani propozycji. Wymienia sumę i dodaje, że jego panu byłoby przykro, gdyby dano mu powód, by przyjechał po nią sam. Potem stoi i czeka, i nie siada."
 tnt_ai_demand_desc_outro:0 "\n\n#weak Zapłać, a świat usłyszy, że zapłaciłeś. Odpraw go, a świat usłyszy i to.#!"
 tnt_ai_demand_opt_pay:0 "Zapłacić mu, ile żąda"
 tnt_ai_demand_pay_tt:0 "#high Pieniądze zostają odliczone, a poseł odjeżdża zadowolony.#! Jego imię przez to rośnie, a ci, którzy o tym usłyszą, łatwiej się go zlękną. Przez piętnaście lat nie upomni się ponownie."
 tnt_ai_demand_opt_refuse:0 "Odprawić go z pustymi rękami"
 tnt_ai_demand_refuse_tt:0 "#high Nie dostaje nic.#! Ale poseł wszedł do twojej sali, wymienił cenę i odjechał bez odpowiedzi — twój dwór to widział, a twoja sława na tym cierpi. Jego własne imię cierpi także: groźba odrzucona to groźba zmierzona. Przez piętnaście lat nie upomni się ponownie."
 tnt_ai_demand_refuse_free_tt:0 "#high Nie dostaje nic, a ciebie nic to nie kosztuje.#! Twoje wojsko nie jest już tym, które policzył. Jego imię na tym cierpi, a przez piętnaście lat nie upomni się ponownie."
 tnt_ai_offer_row_alliance:0 "Sojusz wojskowy zaprzysiężony między wami"
 tnt_ai_offer_row_truce:0 "Pakt o nieagresji między wami na dziesięć lat"
 tnt_ai_offer_row_gold_r:0 "Partner zapłaci ci [gold_i] [GetPlayer.MakeScope.Var('tnt_gold_r').GetValue|0]"
 tnt_ai_offer_row_prestige_r:0 "Partner odda [prestige_i] [GetPlayer.MakeScope.Var('tnt_prestige_r').GetValue|0]"
 tnt_ai_offer_row_piety_r:0 "Partner odda [piety_i] [GetPlayer.MakeScope.Var('tnt_piety_r').GetValue|0]"
 tnt_ai_offer_row_influence_r:0 "Partner odda [influence_i] [GetPlayer.MakeScope.Var('tnt_influence_r').GetValue|0]"
 tnt_ai_offer_row_gold_p:0 "Partner żąda od ciebie [gold_i] [GetPlayer.MakeScope.Var('tnt_gold_p').GetValue|0]"
 tnt_ai_offer_row_prestige_p:0 "Partner żąda od ciebie [prestige_i] [GetPlayer.MakeScope.Var('tnt_prestige_p').GetValue|0]"
 tnt_ai_offer_row_piety_p:0 "Partner żąda od ciebie [piety_i] [GetPlayer.MakeScope.Var('tnt_piety_p').GetValue|0]"
