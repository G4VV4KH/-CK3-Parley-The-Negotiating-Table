 tnt_err_no_wed_cand_r:0 "Na dworze partnera nie ma nikogo wolnego do małżeństwa."
 tnt_btn_edit_marriage:0 "Wybierz pary, które poniesie ten traktat – na własnym ekranie małżeństw gry albo ręcznie, z obu dworów.\n\n#weak Nikt nie bierze ślubu, dopóki traktat nie zostanie przyjęty.#!"
