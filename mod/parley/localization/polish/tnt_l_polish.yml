 tnt_marriage_line_matri:0 "[matrilineal|E]"
 tnt_marriage_line_matri_desc:0 "Dzieci rodzą się do rodu matki.\n\n#weak Drugą stronę kosztuje to drogo, gdy w związek wchodzi właśnie jej dziedzic, a wiara stawiająca jedną płeć nad drugą odmówi takiego małżeństwa z miejsca.#!"
 tnt_marriage_line_patri:0 "[patrilineal|E]"
 tnt_marriage_line_patri_desc:0 "Dzieci rodzą się do rodu ojca.\n\n#weak Tak zawiera się małżeństwo, jeśli nie postanowisz inaczej.#!"
