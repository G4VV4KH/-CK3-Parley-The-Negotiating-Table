 tnt_interest_penalty_title:0 "Kara za zainteresowanie"
 tnt_interest_penalty_desc:0 "Obniżenie końcowego wyniku zgody: mniejsza użyteczność otrzymywanych warunków i dodatkowy koszt oddania potrzebnych dóbr. Różnica obejmuje relacje i wymagania. Tabela zachowuje punkty bazowe.\n$tnt_interest_net_transfer$"
