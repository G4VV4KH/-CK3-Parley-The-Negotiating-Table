 tnt_err_vassal_invalid:0 "Przysięga wierności między tymi władcami nie jest możliwa."
 tnt_err_ally_already:0 "Jesteś już z partnerem w sojuszu."
 tnt_err_ally_at_war:0 "Nie możecie zawrzeć sojuszu, dopóki prowadzicie ze sobą wojnę."
 tnt_err_ally_same_realm:0 "Sojusz w obrębie jednego państwa jest bezużyteczny – senior i jego [Concept('vassal', 'wasal')|E] nie mogą wzywać się nawzajem na wojnę."
 tnt_err_ally_hegemon:0 "Hegemon bierze trybutariuszy, a nie sojuszników."
 tnt_err_ally_not_ruler:0 "Obie strony muszą być wolnymi władcami, nie zaś więźniami."
 tnt_err_truce_same_realm:0 "Wy dwoje i tak nie moglibyście na siebie ruszyć – pakt wymaga dwóch władców, którzy mogą: dwóch panów niezależnych albo dwóch wasali jednej korony. Nie ma tu czego obiecywać."
 tnt_err_truce_self:0 "Nie możesz obiecać pokoju samemu sobie."
 tnt_err_vassal_self:0 "Nie możesz złożyć przysięgi wierności samemu sobie."
 tnt_err_vassal_own_vassal:0 "Strona, która miałaby przyjąć przysięgę, jest już wasalem tej, która miałaby ją złożyć."
 tnt_err_vassal_not_independent:0 "Tylko władca niezależny ma własną przysięgę wierności do oddania."
 tnt_err_vassal_mutual_war:0 "Przysięgę wierności można złożyć dopiero wtedy, gdy wojna między stronami dobiegnie końca."
 tnt_err_vassal_government:0 "Ta forma rządów nie może ani złożyć, ani przyjąć przysięgi wierności – oddział najemników, zakon rycerski i bezziemny poszukiwacz przygód stoją poza łańcuchem lennym."
 tnt_err_vassal_sworn_order:0 "Nie ma tu przysięgi do wzięcia. Jedno z tych dwojga stoi całkiem poza łańcuchem lennym – związane ślubami, którym żadna korona nie rozkazuje, albo niezwiązane niczym – i żaden traktat nie uczyni z takiej strony seniora ani wasala."
 tnt_err_vassal_confederation:0 "Członek konfederacji nie może złożyć przysięgi wierności."
 tnt_err_vassal_state:0 "Obie strony muszą żyć, posiadać ziemię i cieszyć się wolnością."
 tnt_err_vassal_limit:0 "Strona, która miałaby przyjąć przysięgę, nie ma już miejsca w swoim [Concept('vassal_limit', 'limicie wasali')|E]."
 tnt_err_vassal_tier:0 "Wasal musi mieć niższą rangę niż jego senior."
