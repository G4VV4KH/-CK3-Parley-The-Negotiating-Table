 tnt_confirm_title:0 "Przypieczętować traktat?"
 tnt_confirm_desc:0 "Warunki leżą na stole, wosk i pieczęć pod ręką.\n\nGdy poseł raz ruszy w drogę, [tnt_deal_partner.GetShortUIName] usłyszy ofertę dokładnie w tym kształcie, w jakim stoi teraz – nic dodane, nic cofnięte."
