 tnt_picker_rule_hostage:0 "Widnieją tu wyłącznie bliscy krewni, którzy zgodnie z prawem mogą być rękojmią. Kto został już obiecany w innym punkcie tego traktatu, na liście się nie pojawi."
 tnt_picker_rule_ward:0 "Widnieją tu wyłącznie dzieci na tyle młode, by mogły wychowywać się gdzie indziej, i tylko te, które nie mają własnego opiekuna."
 tnt_picker_rule_courtier:0 "Widnieją tu wyłącznie dworzanie, których wolno wypuścić: bez radnych, bez rywali, bez wasali z ziemią. Wybierz tylu, ilu układ udźwignie."
 tnt_picker_rule_subject:0 "Widnieją tu wyłącznie bezpośredni wasale władający co najmniej hrabstwem, niżsi rangą od władcy, który miałby ich przyjąć, i będący w pokoju ze wszystkimi zainteresowanymi: bez regenta, bez dziedzica i bez nikogo, kogo układ przeniósł w ciągu ostatnich trzech lat. Wybierz tylu, ilu układ udźwignie."
