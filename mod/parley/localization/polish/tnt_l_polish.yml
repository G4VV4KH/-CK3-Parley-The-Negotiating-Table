 setting_tnt_trade_prestige_faith_desc:0 "Prestiż można przekazywać tylko między władcami tej samej wiary. Sama wspólna religia nie wystarcza. Zasada obowiązuje zarówno graczy, jak i SI."
 setting_tnt_trade_prestige_lower:0 "Niższy poziom sławy"
 setting_tnt_trade_prestige_lower_desc:0 "Prestiż można przekazywać tylko od władcy o wyższym poziomie sławy do władcy o niższym poziomie. Równe poziomy są wykluczone; posiadana liczba punktów prestiżu nie ma znaczenia. Zasada obowiązuje zarówno graczy, jak i SI."
 setting_tnt_trade_prestige_peer:0 "Tylko równi i niżsi"
 setting_tnt_trade_prestige_peer_desc:0 "Prestiż można przekazać tylko wtedy, gdy poziom sławy dającego jest co najmniej równy poziomowi odbiorcy. Przeciwny kierunek jest sprawdzany osobno. Zasada obowiązuje zarówno graczy, jak i SI."
 setting_tnt_trade_prestige_off:0 "Wyłączony"
 setting_tnt_trade_prestige_off_desc:0 "Handel prestiżem jest zabroniony zarówno dla graczy, jak i SI. Inne waluty pozostają bez zmian."
 rule_tnt_trade_piety:0 "Parley: handel pobożnością"
 setting_tnt_trade_piety_on:0 "Dostępne"
 setting_tnt_trade_piety_on_desc:0 "Pobożność można oferować dowolnemu władcy i od niego żądać. Zasada obowiązuje zarówno graczy, jak i SI."
 setting_tnt_trade_piety_faith:0 "Tylko ta sama wiara"
 setting_tnt_trade_piety_faith_desc:0 "Pobożność można przekazywać tylko między władcami tej samej wiary. Sama wspólna religia nie wystarcza. Zasada obowiązuje zarówno graczy, jak i SI."
 setting_tnt_trade_piety_faith_lower:0 "Ta sama wiara: niżej"
 setting_tnt_trade_piety_faith_lower_desc:0 "Pobożność można przekazywać tylko między władcami tej samej wiary, z wyższego poziomu dewocji na ściśle niższy. Równe poziomy wykluczają przekazanie. Porównywany jest poziom dewocji, a nie zapas punktów pobożności, zgodnie z rzeczywistym kierunkiem przekazania, niezależnie od inicjatora negocjacji. Zasada obowiązuje zarówno graczy, jak i SI."
 setting_tnt_trade_piety_different_faith:0 "Tylko różne wiary"
 setting_tnt_trade_piety_different_faith_desc:0 "Pobożność można przekazywać tylko między władcami różnych wiar, także w obrębie tej samej religii. Zasada obowiązuje zarówno graczy, jak i SI."
 setting_tnt_trade_piety_religion:0 "Tylko ta sama religia"
 setting_tnt_trade_piety_religion_desc:0 "Pobożność można przekazywać między władcami tej samej religii, nawet jeśli ich wiary się różnią. Zasada obowiązuje zarówno graczy, jak i SI."
 setting_tnt_trade_piety_off:0 "Wyłączony"
 setting_tnt_trade_piety_off_desc:0 "Handel pobożnością jest zabroniony zarówno dla graczy, jak i SI. Inne waluty pozostają bez zmian."
 tnt_err_prestige_trade_rule:0 "Zasady gry zabraniają przekazywania prestiżu w tym kierunku. Usuń tę płatność lub ponownie zrównoważ umowę."
 tnt_err_piety_trade_rule:0 "Zasady gry zabraniają przekazywania pobożności w tym kierunku. Usuń tę płatność lub ponownie zrównoważ umowę."
