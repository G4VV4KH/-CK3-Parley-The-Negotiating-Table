 tnt_err_session_changed:0 "To potwierdzenie nie należy już do otwartego stołu negocjacji. Niczego nie przekazano; wróć do obecnych warunków i wyślij je ponownie."
 tnt_err_title_realm_mix:0 "Jedna umowa nie może zarazem przekazywać tytułów i zmieniać wasalstwa lub niezależności. Usuń jeden z tych warunków."
