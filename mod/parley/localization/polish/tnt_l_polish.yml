 tnt_truce_nonwar:0 "Przysięga nienapadania"
 rule_tnt_advanced_terms:0 "Parley: warunki zaawansowane"
 setting_tnt_advanced_terms_on:0 "Włączone"
 setting_tnt_advanced_terms_on_desc:0 "Zaręczyny, odstępowane tytuły i przysięgę wierności można wykładać na stół rokowań. Po wyłączeniu władcy kierowani przez SI przestają też proponować małżeństwa listownie."
 setting_tnt_advanced_terms_off:0 "Wyłączone"
 setting_tnt_advanced_terms_off_desc:0 "Zaręczyny, odstępowanie tytułów i przysięga wierności nie trafiają na stół rokowań."
 rule_tnt_advanced_valuation:0 "Parley: wycena rozszerzonych warunków"
 setting_tnt_advanced_valuation_classic:0 "Klasyczna"
 setting_tnt_advanced_valuation_classic_desc:0 "Oryginalne ceny rozszerzonych warunków wraz z dotychczasowymi limitami. Tryb domyślny, używany także w starszych zapisach bez tego ustawienia."
 setting_tnt_advanced_valuation_scaled:0 "Skalowana"
 setting_tnt_advanced_valuation_scaled_desc:0 "Wartość ziem i przekazywania władców zależy od rzeczywistego terytorium i rozwoju, a ludzi — od ich użyteczności i znaczenia politycznego. Działa dla gracza i SI. Nie odblokowuje warunków ani nie zmienia zasad handlu zasobami."

