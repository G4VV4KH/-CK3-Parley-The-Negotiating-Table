 tnt_interest_capacity_target:0 "Docelowy użyteczny zapas (jednostki zasobu)"
 tnt_interest_current_stock:0 "Obecny zapas"
 tnt_interest_capacity_note:0 "Te potrzeby określają powyższy procent; nie są dodatkowymi punktami umowy."
 tnt_interest_net_transfer:0 "Złoto, prestiż i pobożność mogą występować tylko po jednej stronie umowy każde. Wyrównanie zastępuje przeciwne kwoty ze starego szkicu jednym transferem netto. Wpływy nadal są wyceniane netto; ich pełne transfery wymagają zgody i wystarczających zasobów."
