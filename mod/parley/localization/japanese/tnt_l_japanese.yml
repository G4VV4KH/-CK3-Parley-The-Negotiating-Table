 tnt_ob_relig_label:0 "宗教的権利の保護"
 tnt_ob_relig_desc:0 "臣従者は自らの信仰を安んじて保てます。主君への好感度#high +5#!、自らの伯爵領での好感度#high +5#!、そして信じるもののゆえに迫害されることが決してなくなります。\n\n#weak この書面で最も値打ちのある権利ですが、二人が別々の信仰でなければ何の意味もありません。#!"
 tnt_ob_council_label:0 "評議会席の保証"
 tnt_ob_council_desc:0 "臣従者は主君の評議会の席を要求でき、拒まれることがありません。主君への好感度#high +5#!。\n\n#weak 主君は有力な封臣たちのあいだで好感度を2失います。約束で譲られた席を彼らは快く思いません。#!"
 tnt_ob_revoke_label:0 "称号の剥奪の禁止"
 tnt_ob_revoke_desc:0 "主君は臣従者の称号を取り上げる権利を手放します。主君への好感度#high +5#!。\n\n#weak ここで主君が明け渡すのは、規律を保つための通常の道具です。#!"
 tnt_ob_war_label:0 "自由な宣戦布告"
 tnt_ob_war_desc:0 "臣従者は、戦争に関する主君の規則に縛られなくなります。主君への好感度#high +5#!。\n\n#weak こうして始めた戦争の勝敗は、依然として臣従者自身のものです。#!"
 tnt_ob_fort_label:0 "要塞建造の権利"
 tnt_ob_fort_desc:0 "臣従者は城をより安く建て、すべての砦を一段高い水準で保ちます。\n\n#weak 主君はこの契約から得る税の十分の一を失います。また、主君の[culture|E]が#high $innovation_battlements$#!を解禁している必要があります。#!"
 tnt_ob_coin_label:0 "貨幣発行の権利"
 tnt_ob_coin_desc:0 "臣従者は自らの貨幣を鋳ます。首都の[county|E]で月あたり[development|E]#high +0.3#!。\n\n#weak 主君はその代わりに自らの開発度の伸びを2%失います。また、主君の[culture|E]が#high $innovation_currency_02$#!を解禁している必要があります。#!"
 tnt_ob_succ_label:0 "分割の強制"
 tnt_ob_succ_desc:0 "#N この条項は臣従者ではなく主君に有利です。#! 臣従者は分割相続に固定され、法によってそこから抜け出すことが決してできなくなります。主君への好感度#high -5#!。\n\n#weak これを入れると釣り合いは逆へ動きます。与えるものではなく、取るものだからです。#!"
 tnt_ob_req_feudal:0 "税金と徴募兵と権利を交渉できるのは封建の臣従者だけです。まずどちらかの列で#high 忠誠を誓う#!を入れてください。"
 tnt_ob_req_relig:0 "これが何かを守るためには、二人が別々の信仰でなければなりません。"
 tnt_ob_req_fort:0 "主君の文化が#high $innovation_battlements$#!の革新性を解禁している必要があります。"
 tnt_ob_req_coin:0 "主君の文化が#high $innovation_currency_02$#!の革新性を解禁している必要があります。"
 tnt_ob_req_succ:0 "臣従者が#high $confederate_partition_succession_law$#!を採れる状態でなければなりません。"
 tnt_ob_req_revoke:0 "主君の信仰が異なる信仰の者に課税していて、かつ二人の信仰が異なるあいだはできません。"
