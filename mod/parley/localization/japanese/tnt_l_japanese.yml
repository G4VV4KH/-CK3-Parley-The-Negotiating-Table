 tnt_action_can_lean_on:0 "@dread_icon! 優位はあなたにある"
 tnt_action_can_lean_on_label:0 "@dread_icon! [recipient.GetPrimaryTitle.Custom('GetTierIcon')][recipient.GetUINameNoTooltip]には圧力をかけられる"
 tnt_action_can_lean_on_desc:0 "[recipient.GetUIName]には圧力をかけられる。あなたの軍、名声、恐怖が、それぞれ相手のものと比べて脅しに必要なだけの重みに達しており、前回の脅しはもう忘れられている。脅しを卓に載せれば、その同じ重みがそのまま相手の呑める幅に加わり、相手は話を終わらせるためにより多く払うだろう。"
 tnt_action_can_lean_on_click:0 "#I クリックして条約の交渉を開く#!"
 tnt_action_can_lean_on_combined_label:0 "[recipient.GetPrimaryTitle.Custom('GetTierIcon')] [recipient.GetUINameNoTooltip]"
 tnt_action_can_lean_on_combined_group_label:0 "@dread_icon! 優位に立っている統治者"
 tnt_action_can_lean_on_combined_group_name:0 "@dread_icon! 圧力をかけられる統治者"
 tnt_action_can_lean_on_combined_group_description:0 "あなたの封臣、あなたの主君、そして陸と海の向こうの隣国のうち、ここに挙げた統治者はいずれも圧力をかけられる。あなたの軍、名声、恐怖が、それぞれ相手のものと比べて脅しに必要なだけの重みに達しており、前回の脅しはもう忘れられている。いずれかと交渉を始め、「脅す」にチェックを入れれば、脅しが卓の上に乗る。"
 tnt_msg_stale:0 "条件が変わった"
 tnt_err_deal_changed:0 "この合意は記されたとおりには履行できなくなりました。何も交換されていません。"
 tnt_err_currency_opposite_selected:0 "この資源は取引の反対側ですでに選択されています。先にそちらを解除してください。"
 tnt_interest_preview_currency:0 "数量を選ぶ前の、現在の備蓄に基づく予測です。数量が増えると関心も変わる場合があります。"
 tnt_interest_preview_context:0 "現在の状況による暫定的な関心であり、価格や取引の許可ではありません。対象、数量、状況によって関心が変わります。対象固有の資質は基本価値に別途反映されます。"
 tnt_interest_preview_contract:0 "交渉相手に有利な変更への予測です。義務を変更すると、方向と正確な関心が再計算されます。"
 tnt_interest_bd_preview_domain_capacity:0 "伯爵領を1つ追加すると直轄領上限を超過"
 tnt_interest_bd_preview_domain_relief:0 "上限を超えた伯爵領を1つ譲渡する負担軽減"
 tnt_interest_bd_preview_vassal_capacity:0 "直属封臣を1人追加すると上限を超過"
 tnt_interest_bd_preview_vassal_relief:0 "上限を超えた直属封臣を1人譲渡する負担軽減"
 tnt_interest_bd_preview_council_vacancies:0 "評議会の空席：廷臣1人に対する予測"
 tnt_interest_bd_preview_artifact_base:0 "宝物の基本的な関心：スロットと装備状態は未確定"
 tnt_interest_bd_preview_receiving_demand:0 "現在の保有量における限界需要"
 tnt_interest_bd_preview_surrender_reserve:0 "現在の備蓄減少への敏感さ"
