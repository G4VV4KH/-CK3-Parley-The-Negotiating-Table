 tnt_ob_group_obligations:0 "臣従者が負うもの"
 tnt_ob_group_obligations_tt:0 "誓いそのものに付いてくる二つの義務です。どちらも、まったくなしから異常な水準までの幅を持ちます。\n\n#weak 動かさないかぎり両方とも中央にあり、その中央が普通の[vassal_contract|E]の定めです。#!"
 tnt_ob_group_rights:0 "臣従者が保つもの"
 tnt_ob_group_rights_tt:0 "主君が一条ずつ手放していく権利です。\n\n#weak いずれも普通の誓いには含まれませんから、下の印はどれも譲歩です。ただし最後の一つだけは、主君が与えるのではなく取る側の条項です。#!"
