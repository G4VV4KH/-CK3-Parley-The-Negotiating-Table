 tnt_ob_note_none:0 "卓上にはまだ誓いがありません。どちらかの列で#high 忠誠を誓う#!を入れれば、その誓いの条件、すなわち税金、徴募兵、そして臣従する側が保つ権利を、あなたが書き入れられるようになります。"
