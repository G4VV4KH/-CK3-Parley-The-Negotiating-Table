 tnt_ob_levy_label:0 "徴募兵"
 tnt_ob_levy_desc:0 "主君が臣従者の徴募兵をどれだけ動員できるかです。\n\n#weak 段を下げれば臣従者は兵を手元に留め、上げれば主君が呼び出します。ただの忠誠の誓いは中央にあります。#!"
