 tnt_wed_row_line_matri:0 "[matrilineal|E]"
 tnt_wed_row_line_patri:0 "[patrilineal|E]"
 tnt_wed_row_line_tip:0 "この組の子がどちらの家に生まれるかです。クリックで切り替わります。#high [patrilineal|E]#!なら父の家に、#high [matrilineal|E]#!なら母の家に入ります。\n\n#weak 条約の組はそれぞれ自分の家系を持ちます。この家系は、あなたがその大結婚式を主催できるかどうかも決めます。#!"
 tnt_wed_taper:0 "二組目以降は、相手にとっての値打ちが一組ごとに少しずつ下がります。一方、縁組が相手に強いる#high 代償#!、すなわち差し出す後継者や譲る家系については、割引は一切ありません。\n\n三組でおよそ#high 2.7#!組ぶんの値打ちになり、五組目が足すのは#high 0.6#!組ぶんだけで、それより先は増分そのものが止まります。\n\n#weak ですから、水増しした十数組より、良い縁組を二、三組のほうが勝ります。#!"
 tnt_wed_grand:0 "大結婚式を約束する"
 tnt_wed_grand_desc:0 "これらの縁組の一つを盛大な祝宴で祝うと約束します。#high 栄誉を受ける組は結婚ではなく婚約になり#!、相手はその栄誉ゆえに縁組をはるかに高く評価します。\n\nあなたが引き受けるもの。あなたは約束した主催者となり、その約束は数年しかもちません。#high 式の手配も、客の招請も、その費用の一切も、あなたが担い続けます#!。代わりに段取りをしてくれる者はおらず、あなたが果たすまで二人は婚約者のままです。約束を流せば、破られた言葉は忘れられません。\n\n#weak 栄誉を受けられるのは一つの条約につき一組だけで、その相手はあなた自身の血縁でなければならず、優位の家系はあなたの側でなければなりません。#!"
 tnt_wed_grand_couple:0 "大結婚式は[GetPlayer.MakeScope.Var('tnt_wed_principal').Char.GetShortUIName]と[GetPlayer.MakeScope.Var('tnt_wed_principal').Char.MakeScope.Var('tnt_wed_partner').Char.GetShortUIName]に約束されています"
 tnt_wed_principal_tag:0 "大結婚式"
 tnt_wed_set_principal_tip:0 "大結婚式をこの組に移します。栄誉を受けられるのは一つの条約につき一組だけで、条約が結ばれるまでは何度移しても代償はありません。"
 tnt_item_wed_dread:0 "あなたへの恐怖"
