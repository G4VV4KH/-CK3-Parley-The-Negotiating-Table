 tnt_refuse_envoys_decision:0 "これ以上使節を受けない"
 tnt_refuse_envoys_decision_desc:0 "街道という街道、港という港に、静かに触れが回ります。この宮廷は条約の使者に耳を貸すのをやめました。提案を抱えた統治者は、それを手元に置いておけばよいのです。あなた自身の使者はこれまでどおり発ちます。扉は内側から閂を掛けられており、その閂はあなたの手の中にあります。"
 tnt_refuse_envoys_decision_tooltip:0 "あなたが取り消すまで、条約を携えて近づく統治者はいなくなります。あなた自身が開く交渉には影響しません。"
 tnt_refuse_envoys_decision_confirm:0 "扉に閂を掛ける"
 tnt_refuse_envoys_decision_effect_tt:0 "この決定を取り消すまで、条約を携えて近づく統治者はいなくなります。"
 tnt_accept_envoys_decision:0 "ふたたび使節を受ける"
 tnt_accept_envoys_decision_desc:0 "閂が外され、門番たちは脇へ退くよう命じられます。条約の使者はふたたび通され、封は解かれぬまま、その提示はこれまでと同じ秤で量られます。"
 tnt_accept_envoys_decision_tooltip:0 "条約を携えた使節が、今日この日からふたたびあなたの宮廷に届くようになります。"
 tnt_accept_envoys_decision_confirm:0 "門を開く"
 tnt_accept_envoys_decision_effect_tt:0 "条約の提示を携えた使節が、ふたたびあなたの宮廷に届きます。以前の沈黙が明けるのを待つのではなく、ただちにです。"
 decision_group_type_tnt_uninstall:0 "MOD削除の決断"
 tnt_uninstall_decision:0 "交渉の卓を畳む"
 tnt_uninstall_decision_desc:0 "使者たちは解散し、帳簿は焼かれ、卓そのものが広間から運び出されます。MOD本体を外す直前に、この決定を選んでください。Parleyがこの世界に残しているあらゆる痕跡が、セーブデータから一掃されます。未回答の書状と作りかけの交渉は無効になり、すでに結ばれた条約はすべてそのまま残ります。"
 tnt_uninstall_decision_tooltip:0 "このセーブデータを、Parley: The Negotiating Tableなしで遊べる状態にします。世界のあらゆるキャラクターについて、このMODが書き込んだ変数、フック、好感度をすべて取り除きます。すでに成立した取引、すなわち婚姻、割譲した称号、忠誠の誓いには手を触れません。"
 tnt_uninstall_decision_confirm:0 "きれいに掃き出す"
 tnt_uninstall_decision_effect_tt:0 "Parleyが書き込んだ変数、リスト、キャラクターフラグ、フック、好感度が、世界のあらゆるキャラクターから取り除かれます。未回答の提示の書状と、作りかけの交渉はすべて無効になります。ゲームをセーブしてからMODを無効にしてください。そのセーブデータには、もうParleyの痕跡は残っていません。"
 tnt_ai_msg_treaty:0 "条約が結ばれた"
 tnt_ai_msg_tt_truce:0 "金で十年の平和が買われた。"
 tnt_ai_msg_tt_ally:0 "金で軍事同盟が買われた。"
 tnt_ai_msg_tt_hook:0 "一方が金と引き換えに、他方に借りを作った。"
 tnt_ai_msg_tt_hookcall:0 "借りが取り立てられた。一方が他方への[hook|E]を握っており、金で回収したのである。"
 tnt_ai_msg_tt_ultimatum:0 "金が一方通行で動いた。二人のうち弱いほうが、放っておいてもらうために支払ったのである。"
 tnt_ai_msg_tt_title:0 "金と引き換えに土地が動いた。二人の統治者の一方が、他方から伯爵領を買い取ったのである。"
 tnt_ai_msg_tt_vassal:0 "一つの領国が膝を折った。弱いほうの統治者が、金と庇護を得て強いほうに忠誠を誓ったのである。"
 tnt_ai_msg_tt_submission:0 "一つの領国が脅威に屈した。圧倒的に強い統治者が、より弱い独立した隣人に無償で忠誠を誓わせた。"
 tnt_ai_msg_tt_artifact:0 "金と引き換えに宝物が動いた。二人の統治者の一方が、他方の広間から一品を買い取ったのである。"
 tnt_ai_msg_tt_wed:0 "二つの家が結ばれた。統治者たちが血縁どうしの婚姻に合意し、金の持参財がそれに添えられたのである。"
 rule_tnt_ai_treaties:0 "Parley：AI同士の条約"
 setting_tnt_ai_treaties_off:0 "無効"
 setting_tnt_ai_treaties_off_desc:0 "AI統治者どうしが、あなたの知らないところで条約を結ぶことはありません。\n\n#weak 負荷はまったくありません。年に一度の参照だけで、それ以上の処理は走りません。AIが#high あなた#!と取引することは、変わらずできます。#!"
 setting_tnt_ai_treaties_rare:0 "ときおり"
 setting_tnt_ai_treaties_rare_desc:0 "隣り合うAI統治者どうしが、ときおり取引を成立させます。マップ全体で年に数件ほどです。\n\nこうして取引されるのは、金、借りを作る約束、貸しの取り立て、最後通牒、そして宝物です。すでに友好的な間柄であれば、国境の伯爵領が相応の値で売られたり、弱い隣人が金を受けて忠誠を誓ったりもします。圧倒的に強い王または皇帝は、代わりに脅威によってより弱い独立した隣人へ忠誠を強いることがあります。#high 両家の婚姻も黙って取引され、誰にも先に伺いは立てられません。#! 境を接する相手、同盟している相手、戦っている相手が条約に関わったときは、あなたに知らせが届きます。"
 setting_tnt_ai_treaties_common:0 "頻繁"
 setting_tnt_ai_treaties_common_desc:0 "「ときおり」のおよそ三倍の頻度です。宮廷が絶えず話し合っているマップ向けです。\n\n取引できる条件は同じで、統治者ごとの三年の制限も同じですから、際限なく増えることはありません。\n\n#weak これが既定値です。#!"
 rule_tnt_ai_offer_rate:0 "Parley：あなたへの提示の頻度"
 setting_tnt_ai_offer_rate_off:0 "なし"
 setting_tnt_ai_offer_rate_off_desc:0 "自分から条約を携えて書き送ってくる統治者はいなくなります。\n\n#weak あなたのほうから誰とでも交渉を開くことはできますし、そのルールが許すかぎりAI統治者どうしの取引も続きます。#!"
 setting_tnt_ai_offer_rate_rare:0 "まれ"
 setting_tnt_ai_offer_rate_rare_desc:0 "書状はときおり届く程度です。使者と使者のあいだには何年もの静けさが挟まると考えてください。\n\n#weak 求めるのは自分のほうでありたい、という遊び方のための設定です。#!"
 setting_tnt_ai_offer_rate_normal:0 "普通"
 setting_tnt_ai_offer_rate_normal_desc:0 "隣人が書き送ってくるのは多くて年に一度で、統治者はそれぞれ三年待ってから次の提示をまとめます。"
 setting_tnt_ai_offer_rate_frequent:0 "頻繁"
 setting_tnt_ai_offer_rate_frequent_desc:0 "使者は年に何度も訪れ、統治者はずっと早くあなたのことを考え直します。\n\nどの提示も、交渉窓であなたが見るのと同じ秤で値付けされますから、賑やかなマップになっても気前がよくなるわけではありません。\n\n#weak これが既定値です。#!"
 setting_tnt_ai_offer_rate_test:0 "試験用：非常に頻繁"
 setting_tnt_ai_offer_rate_test_desc:0 "#N 遊ぶためではなく、MODを試すための設定です。#! 待機期間が数週間まで切り詰められ、開始から数か月で提示が届くはずです。\n\n#weak 書状が届くことを確かめたら、ルールを「頻繁」に戻してください。#!"
 rule_tnt_ai_telemetry:0 "Parley：診断ログ"
 setting_tnt_ai_telemetry_off:0 "オフ"
 setting_tnt_ai_telemetry_off_desc:0 "診断ログを取りません。遊ぶときはこちらです。\n\n#weak これが既定値で、負荷はありません。行が書かれたはずの箇所で、ルールを一度参照するだけです。#!"
 setting_tnt_ai_telemetry_on:0 "オン"
 setting_tnt_ai_telemetry_on_desc:0 "AI統治者が条約について下す判断ごとに、#high error.log#!へ一行ずつ書き出します。誰を検討したか、卓に何を載せたか、取引をいくらと値付けしたか、そして#high なぜ立ち去ったか#!です。\n\nゲーム内の半年あたり、およそ600行から1600行になります。ゲームプレイには一切影響しません。\n\n#weak 長時間の放置実行の前にこれを入れ、あとでログを送って読ませてください。#!"
 setting_tnt_ai_telemetry_verbose:0 "詳細"
 setting_tnt_ai_telemetry_verbose_desc:0 "オンと同じ内容に加え、AI同士の抽選の直前に、AI統治者ごと年ごとに一行を記録します。\n\n行数は数千単位で増えます。これで分かるようになるのはただ一つ、#high 処理がそもそも走らなかった#!のか、#high 走ったうえで抽選が否と出た#!のかの区別です。\n\n#weak 短い確認実行のときだけ使ってください。#!"
 rule_tnt_threat_frequency:0 "Parley：脅しの頻度"
 setting_tnt_threat_frequency_unlimited:0 "0年"
 setting_tnt_threat_frequency_unlimited_desc:0 "異なる統治者への脅しの間に、追加の待機期間を設けません。既定の設定です。同じ統治者を15年間再び脅せない従来の制限は、プレイヤーとAIの両方に引き続き適用されます。"
 setting_tnt_threat_frequency_1_year:0 "1年"
 setting_tnt_threat_frequency_1_year_desc:0 "脅しを使った統治者は、その後1年間、誰に対しても脅しを使えなくなります。プレイヤーとAIに同じ規則が適用されます。同じ統治者を15年間再び脅せない従来の制限も維持されます。"
 setting_tnt_threat_frequency_5_years:0 "5年"
 setting_tnt_threat_frequency_5_years_desc:0 "脅しを使った統治者は、その後5年間、誰に対しても脅しを使えなくなります。プレイヤーとAIに同じ規則が適用されます。同じ統治者を15年間再び脅せない従来の制限も維持されます。"
 setting_tnt_threat_frequency_10_years:0 "10年"
 setting_tnt_threat_frequency_10_years_desc:0 "脅しを使った統治者は、その後10年間、誰に対しても脅しを使えなくなります。プレイヤーとAIに同じ規則が適用されます。同じ統治者を15年間再び脅せない従来の制限も維持されます。"
 tnt_err_threat_cooldown:0 "最近脅しを使ったため、脅しの待機期間が終わるまで誰も脅せません。"
 rule_tnt_threat_scale:0 "Parley：脅しの強さ"
 setting_tnt_threat_scale_rare:0 "弱い"
 setting_tnt_threat_scale_rare_desc:0 "係数N = 2.5。すべての脅しに#high 取引点100点以上#!が必要です。威信と恐怖が同じなら、兵力比41対1が必要になります。\n\n#weak 威信や恐怖が高いほど、必要な兵力差は小さくなります。威信レベルが対象より丸一段低いと、脅しの価値はゼロになります。プレイヤーとAIに同じ規則が適用されます。#!"
 setting_tnt_threat_scale_normal:0 "標準"
 setting_tnt_threat_scale_normal_desc:0 "係数N = 5。すべての脅しに#high 取引点100点以上#!が必要です。威信と恐怖が同じなら、最低兵力比は#high 21対1#!です。\n\n威信や恐怖が高いほど、必要な兵力差は小さくなります。威信レベルが対象より丸一段低いと、脅しの価値はゼロになります。\n\n#weak 既定の設定です。プレイヤーとAIに同じ規則が適用されます。#!"
 setting_tnt_threat_scale_frequent:0 "強い"
 setting_tnt_threat_scale_frequent_desc:0 "係数N = 7.5。すべての脅しには引き続き#high 取引点100点以上#!が必要です。\n\n#weak 威信や恐怖が高いほど、必要な兵力差は小さくなります。威信レベルが対象より丸一段低いと、脅しの価値はゼロになります。プレイヤーとAIに同じ規則が適用されます。#!"
 setting_tnt_threat_scale_constant:0 "非常に強い"
 setting_tnt_threat_scale_constant_desc:0 "係数N = 10。すべての脅しに#high 取引点100点以上#!が必要です。威信と恐怖が同じなら、最低兵力比は#high 11対1#!です。\n\n#weak 威信や恐怖が高いほど、必要な兵力差は小さくなります。威信レベルが対象より丸一段低いと、脅しの価値はゼロになります。プレイヤーとAIに同じ規則が適用されます。#!"
 tnt_mutual_header:0 "双方のあいだ"
 tnt_bd_domain_p:0 "相手の直轄領上限を超える称号。相手にとっての値打ちが下がる"
 tnt_bd_domain_r:0 "あなたの直轄領上限を超える称号。あなたにとっての値打ちが下がる"
 tnt_tt_step_huge_add:0 "一度に大きな額を足します。\n\n#weak 金、威信点、敬虔点は1クリックで1000。影響力は250です。影響力そのものが1000を超えないからです。#!"
 tnt_tt_step_huge_sub:0 "一度に大きな額を引きます。\n\n#weak 金、威信点、敬虔点は1クリックで1000。影響力は250です。影響力そのものが1000を超えないからです。#!"
 tnt_preset_open:0 "…"
 tnt_tt_preset_open:0 "1クリックで額を決めます。\n\n#weak 慣例の額、手持ちの半分、支払える限りすべて、あるいはまったくなしです。#!"
 tnt_preset_menu_header:0 "どれだけ？"
 tnt_preset_std_gold:0 "一年分の収入"
 tnt_preset_std_gift:0 "慣例の贈り物"
 tnt_preset_half:0 "半分"
 tnt_preset_max:0 "出せる限り"
 tnt_preset_max_r:0 "相手が出せる限り"
 tnt_preset_none:0 "なし"
 tnt_tt_preset_std_gold:0 "一年分の収入を提示します。\n\n#weak 実際に国庫にある額が上限です。#!"
 tnt_tt_preset_std_gift:0 "この程度の頼み事に対する慣例の額を提示します。相手の身分の統治者が期待する額です。\n\n#weak 実際の手持ちが上限です。威信点、敬虔点、影響力には年収がありませんから、「一年分」というものが存在しません。#!"
 tnt_tt_preset_half:0 "手持ちの半分を提示します。"
 tnt_tt_preset_max:0 "支払える限りすべてを提示します。"
 tnt_tt_preset_none:0 "この通貨を卓から下げます。"
 tnt_autobalance_btn:0 "自動調整"
 tnt_tt_autobalance:0 "卓上の金、威信点、敬虔点、影響力を、相手がぎりぎり受け入れる線まで調整します。\n\n働きは両方向です。相手が断る提示は甘くし、#high 相手が易々と受けてしまう提示は削ります#!から、払い過ぎになりません。\n\n#weak ほかのものは足しません。土地も請求権も婚姻も貸しも加えませんし、実際に支払える以上を提示することもありません。#!"
 tnt_ab_state_balanced:0 "#P 釣り合いました。#! 提示は相手が受け入れる線のすぐ内側にあります。"
 tnt_ab_state_minimal:0 "すでに最小です。変更の必要はありませんでした。"
 tnt_ab_state_unreachable:0 "#N 届きません。#! 支払える限りすべてを積んでも、相手はなお断ります。"
 tnt_ab_state_closest:0 "受諾可能です。利用できる資源では、自動調整で評価をちょうど+1にできませんでした。"
 tnt_ab_lumpy_hint:0 "もう一度押せば、さらに積み増します。このボタンが加えたもののうち、あなたが外したものは二度と提示されません。"
 tnt_ab_lumpy_line:0 "相手の財布が空だったため、直前の一押しは代わりに相手の側の条件を取りました。土地、請求権、あるいは相手の忠誠です。"
 tnt_stage_marriage_interaction:0 "条約に縁組を加える"
 tnt_stage_marriage_send:0 "この縁組を条約に加える"
 tnt_stage_marriage_prompt:0 "#high 十分に近い縁組は、いまや同盟を伴います#! ― ゲームが自らの縁組に与えるのと同じ同盟が、条約を結んだその日に生まれます。"
 tnt_stage_no_alliance_tt:0 "#high この条約に書き込まれた縁組は、いまや同盟を生みます。#! これはこのモッドの決まりではなく、ゲーム自身の規則です。ゲームは、二人それぞれがその者を差し出す統治者とどれほど近い血縁かを量り、双方とも十分に近ければ、条約を結んだその瞬間にあなたと相手は同盟者になります。ゲーム本来の#high $arrange_marriage_interaction$#!が昔から行ってきたのと、まったく同じことです。この卓で[alliances|E]を買う者はいません。そのような条件は表になく、これからも載りません。同盟は、ただ婚姻に付いてくるのです。\n\n#weak ですから、この窓でゲーム自身が描く同盟の徴は、ふたたび信じてよいものになりました。候補者の横の「締結可能な同盟」の強さの帯と、その隣の小さな王冠付きの紋章のことです。いずれも候補者一覧の中にあり、一覧は二つの肖像を選んだ瞬間に画面から消えますから、あなたがこれを読んでいるときには、その手のものはこの頁に残っていません。しかし、この段落のすぐ上に印字された判定が、いま目の前の二人について答えています。それは予想ではなく、ゲーム自身の答えです。#!\n\n#weak 同盟は二人自身の上に立ちます。ですから縁組が続くかぎり続き、縁組が絶えればゲーム自身の仕組みによって絶えます。どちらかがまだ子供であれば、その組は結婚ではなく婚約となり、同盟は初日からその婚約の上に立ちます。一つの条約は幾組でも運べ、それぞれが個別に判じられます。#!"
 tnt_stage_alliance_opens_tt:0 "#high この縁組は、あなたと相手のあいだに同盟を「生みます」。#! のちに叩く扉ではなく、同盟そのものです。条約を結んだその日、この二人が婚姻するか婚約したその瞬間に生まれます。これはゲーム自身の規則であり、ゲーム本来の#high $arrange_marriage_interaction$#!が従うのとまったく同じものです。ゲームは、二人それぞれがその者を差し出す統治者とどれほど近い血縁かを量りますが、この組は双方とも十分に近いのです。あなたにこれ以上求められることはなく、相手が断ることもできません。同盟は条約とともに来ます。\n\n#high その値は条約点で[SCOPE.ScriptValue('tnt_stage_alliance_offer_value')|+=0]。これは上に印字された縁組の数字に「すでに含まれて」います。二重に足さないでください。#!条約が同盟に払うのは一度だけです。すでに卓上にある組が同盟を開いているなら、この組は代価に何も加えず、盟約を支えるもう一つの理由になります。"
 tnt_stage_alliance_shut_tt:0 "#high この縁組は同盟を生みません。#! ゲームは、二人それぞれがその者を引き渡す統治者とどれほど近い血縁かを測り、二つの隔たりを足し合わせ、その和が小さいあいだだけ同盟を認めます。廷臣どうしの婚姻は、卓に着く誰とも血縁を作りませんから、その組は誰も同盟させません。自分の館から選んだよそ者も同じです。自分の血筋を相手の血筋に嫁がせるか——子、孫、兄弟姉妹、親を——あるいはあなた自身が祭壇に立てば、和はゲームの限りの内に収まります。これはゲーム本来の#high $arrange_marriage_interaction$#!を司るのと同じ規則であり、双方を同時に測ります。あなたの側の近い人選が、相手の側の遠い人選を埋め合わせることはできません。"
 tnt_stage_alliance_already_tt:0 "#high あなたは既に相手の同盟者ですから、この縁組が新たな盟約を開くことはありません。#! すでに結んでいる盟約を、二度結ぶことはできません。この縁組に同盟の条約点が上乗せされることはなく、条約があなたにその代価を求めることもありません。もしこの二人が、ゲーム自身の規則を満たすほど血の近い間柄であれば、その婚姻は、あなたが既に持つ同盟を支えるもう一つの理由として書き留められるだけです。そこまで近くなければ、同盟はもとのまま何も変わりません。いずれにせよ、縁組そのものは上に印字された点数だけの値打ちを保ちますし、あなたと相手の盟約もそのままです。"
 actor_secondary_tnt_stage_marriage_interaction:0 "あなたの候補"
 recipient_secondary_tnt_stage_marriage_interaction:0 "相手の候補"
 tnt_stage_pair_points_line:0 "この縁組は条約を[SCOPE.ScriptValue('tnt_stage_pair_deal_delta_value')|+=0]動かします。卓に載せたとき、交渉窓の天秤が実際に動く量そのものです。\n#weak 提示[SCOPE.ScriptValue('tnt_stage_pair_gain_value')|0]、要求[SCOPE.ScriptValue('tnt_stage_pair_loss_value')|0]、そしてこの縁組が生む同盟[SCOPE.ScriptValue('tnt_stage_alliance_offer_value')|+=0]。この三つが上の数字「そのもの」です。同盟は上の数字の内側にあり、上乗せされることはありません。相手はあなたの差し出すものをx[SCOPE.ScriptValue('tnt_deal_mult_value')|2]で値踏みし、大結婚式を約束するなら、その提示のうち[SCOPE.ScriptValue('tnt_stage_grand_offer_value')|+=0]にあたります。#!\n#weak 条約の中でこの組が持つ「独自の行」は、別の数を載せます：[SCOPE.ScriptValue('tnt_stage_pair_raw_net_value')|+=0]。相手の好感と同盟を除いた、縁組そのものの値です。どちらも正しく、天秤が示すのは一つ目です。#!\n#weak 同じ条約で二組目からは、一つ目の数字は正確な変動量ではなく「概算」です。婚姻の山全体に数量割引がかかり、さらに大結婚式と二人のあいだの威圧は条約につき一度しか支払われないのに、各縁組の行で重ねて数えられます。誤差は数十ポイントに達し、高くも低くも出ます。一組目では正確です。#!"
 tnt_stage_grand_info:0 "$GRAND_WEDDING_PROMISE_INFO$\n\n#high この組にとって条約点[SCOPE.ScriptValue('tnt_stage_grand_offer_value')|+=0]の値打ち#!があり、縁組そのものに上乗せされます。\n\n#weak 実際に婚礼の宴を催すまで、二人は婚約のままです。#high 同盟は宴を待ちません#!。条約を結んだ日から婚約そのものの上に立ち、その婚約が続くかぎり続きます。婚約者がもう結婚できると告げる通常の通知は、大婚礼を約束された組にはあえて出ません。代わりに「大婚礼を催す」の通知がその組を引き受け、約束をした者のもとへ届きます。#!"
 tnt_stage_marriage_desc:0 "あなたは今、卓上の条約のための縁組を選んでいます。#high 婚姻の申し出を送っているのではありません。#!\n\n下の横長のボタンには、ゲーム自身によって#high 「申し出を送る」#!と記されており、この文言はここからは変えられません。それは何も送りませんし、誰も結婚させません。金や土地と並べて、この組を交渉中の条約に書き込むだけです。そして条約の条件は、その縁組を含めて改めて値付けされます。\n\n#high 相手が条約全体を受け入れるまで、誰も結婚せず、誰も婚約しません。#! 条約が断られたり放棄されたりすれば、その縁組は初めからなかったことになります。\n\n#weak 双方の家中から一人ずつ選び、継ぐ家系を定めて確定してください。何度でも戻ってきて構いません。一つの条約は何組でも運べます。#!\n\n#weak この窓では、ゲームが同盟についての独自の案内を描きます。#high それらは、ふたたび信じてよいものになりました#!。条約に書き込まれた縁組は、いまやゲーム本来の#high $arrange_marriage_interaction$#!が運ぶのと同じ同盟を運びます。しかもゲーム自身の規則によってです。二人それぞれがその者を差し出す統治者とどれほど近い血縁かを量り、双方とも十分に近ければ、条約を結んだその瞬間にあなたと相手は同盟者になります。#!\n\n#weak あなたが実際に選んだ二人についての判定は上に印字されており、それは推測ではなくゲーム自身の答えです。その一行と同盟そのものを、まったく同じ検査が決めています。廷臣どうしの婚姻は、やはり誰も同盟させません。同盟は二人の上に立ちますから、縁組が続くかぎり続きます。どちらかがまだ子供なら、初日から婚約の上に立ちます。#!"
 tnt_btn_stage_marriage:0 "いつもの画面で縁組を選ぶ"
 tnt_btn_stage_marriage_full:0 "$tnt_item_marriage_desc$\n\n$tnt_btn_stage_marriage_tip$"
 tnt_btn_stage_marriage_tip:0 "ゲーム本来の婚姻画面を開きます。双方の家中を並べて表示し、すべての絞り込みと検索、二つの肖像、そして継ぐ家系が揃っています。\n\n#high 誰も結婚させません。#! そこで確定した組はこの条約に記録され、結婚は、どちらかが子供であれば婚約は、条約全体が成立したときに初めて起こります。\n\n#weak ゲーム自身の文言に注意してください。あの窓の横長のボタンには「申し出を送る」と書かれていますが、誰にも申し出は送られません。ここに組を加えるだけです。同じ二人は下の一覧から手で選ぶこともできます。すでに条約に入っている組の家系を変えられるのは、そちらの一覧だけです。#!"
 tnt_marriage_stage_note:0 "#weak 何も送られず、誰も結婚しません。この組はこの条約に記録されるだけです。#!"
 tnt_err_grand_host:0 "今は大結婚式を約束できません。男爵より上のランクの有封の統治者であること、高度な活動を含む#high Tours and Tournaments#!があること、主催に足る金があること、そして未履行の約束を抱えていないことが要ります。\n\n#weak しかもこれは約束です。栄誉を受ける組は婚約となり、あなたは約束した主催者になります。祝宴の手配とその費用は、あなたが担い続けます。約束を流せば、破られた言葉は記憶に残ります。#!"
 tnt_err_grand_taken:0 "この条約ではすでに大結婚式が約束されています。まず条約自身の婚姻画面で印を外してください。一つの条約に、祝宴は一つ、栄誉を受ける組も一つです。"
 tnt_intro_title:0 "条約の技法"
 tnt_intro_desc_main:0 "あなたの官房から触れが出た。この宮廷は今後、新しい流儀で交渉する。どの統治者も卓に招くことができる。金は忠誠と、花嫁は停戦協定と、貸しは王冠と量り合わされ、あらゆる条件が一つの秤に載る。双方に同じ秤である。\n\n"
 tnt_intro_desc_rate_normal:0 "使節はときおり来ると考えてよい。世界中を合わせても、あなたのもとに届く書状は年に一通を超えない。一度便りを寄越した統治者は、次に筆を執るまで三年ほど思案する。"
 tnt_intro_desc_rate_frequent:0 "あなたの門に至る街道はよく踏まれることになる。使節と使節のあいだは半年と空かず、統治者たちは一年のうちにまたあなたのことを思い出す。"
 tnt_intro_desc_rate_rare:0 "長い沈黙を覚悟しておくとよい。書状と書状のあいだには何年も流れ、求めるのはおおむねあなたの役になる。"
 tnt_intro_desc_rate_off:0 "書状は届かない。あなたの門は使節に閉ざされており、交渉はすべてあなたから始まることになる。"
 tnt_intro_desc_rate_test:0 "急使には馬ではなく駆け足を命じてある。数か月のうちに提示が届くはずだ。宮廷の歩みではなく、試験の歩みである。"
 tnt_intro_desc_world_rare:0 " 国境の外でも同じ秤が静かに働く。ときおり二つの宮廷が独自の取引を成立させ、それがあなたに関わるときには報せが届く。"
 tnt_intro_desc_world_common:0 " 国境の外でも同じ秤が忙しく揺れる。異国の宮廷は年じゅう独自の取引を成立させている。"
 tnt_intro_desc_world_off:0 " 国境の外では旧来の作法が続く。新しい流儀が行われるのは、あなた自身が着く卓においてだけである。"
 tnt_intro_desc_close:0 "\n\n自ら統治者を卓に招くには、その人物を右クリックして#high 条約の交渉#!を選ぶ。"
 tnt_intro_opt_ok:0 "では、卓へ。"

