 tnt_err_truce_dead:0 "二人のうち一方はもう生きていません。"
 tnt_err_hostage_p_unavailable:0 "人質として送れる者がいないか、あるいはその者があなたの担保になりません。"
 tnt_err_hostage_r_unavailable:0 "相手には人質として送れる者がいないか、あるいはあなたが相手の担保を引き受けられません。"
 tnt_err_ward_p_unavailable:0 "相手に預けられる子供がいないか、あるいは相手の宮廷が子供を育てられません。"
 tnt_err_ward_r_unavailable:0 "相手にあなたへ預けられる子供がいないか、あるいはあなたの宮廷が子供を育てられません。"
 tnt_err_courtier_p_unavailable:0 "あなたの宮廷には引き渡せる者がいません。渡る気のない者、誓いに縛られた者、囚われの者はいずれも残ります。"
 tnt_err_courtier_r_unavailable:0 "相手の宮廷には、あなたへ引き渡せる者がいません。"
 tnt_err_subject_and_vassal:0 "領国まるごとの臣従を運ぶ条約に、そこから一人だけ抜き出した封臣は要りません。臣従の誓いを卓から下ろすか、その封臣を下ろしてください。"
 tnt_err_subject_r_unavailable:0 "今は相手の封臣を誰もあなたに譲り渡せません。あなたは自分の領土を持ち、さらに臣下を迎える用意がなければならず、二人は和平の状態になければなりません。"
 tnt_err_subject_p_unavailable:0 "今はあなたの封臣を誰も譲り渡せません。原因はあなたの側ではなく相手の側かもしれません。受け取る君主は自分の領土を持ち、さらに臣下を迎える用意がなければならず、二人は和平の状態になければなりません。"
 tnt_err_indep_p_unavailable:0 "今は解放できません。相手があなたの封臣であること、双方が平和であること（あなたのどの封臣も相手と戦争していないこと）、相手の土地があなた自身の慣習的な称号の外にあること、そして相手があなたの二君でないことが要ります。"
 tnt_err_indep_r_unavailable:0 "今は解放されません。あなたが相手の封臣であること、双方が平和であること（相手のどの封臣もあなたと戦争していないこと）、あなたの土地が相手の慣習的な称号の外にあること、そしてあなたが相手の二君でないことが要ります。"
 tnt_err_people_pair:0 "この条約は自らと矛盾しています。封臣を解き放つことと、同じ息で封臣を得ることは両立しません。"
 tnt_ai_offer_title:0 "[tnt_deal_partner.GetTitledFirstName]からの使節"
 tnt_ai_offer_desc_a1:0 "[tnt_deal_partner.GetTitledFirstName]の伝令が、外套に街道の埃をつけたまま通される。強行軍を続けた者らしい無遠慮さで、いきなり用件に入った。\n\n主君はあなたと争う気がない。求めるのは誓約である。#high 十年#!のあいだ、どちらも相手に剣を抜かない。そして約束を縛るために金を携えてきた。言葉はただであり、そのことを承知しているからだ。"
 tnt_ai_offer_desc_a2:0 "[tnt_deal_partner.GetTitledFirstName]が寄越したのは書記ではなく血縁の者だった。それ自体が伝言の半分をなしている。\n\n持ちかけられたのは軍事同盟の誓いである。あなたの旗と相手の旗をともに掲げ、戦が来たときには互いを招請できる。戦が来ることは、双方とも承知している。"
 tnt_ai_offer_desc_a3:0 "[tnt_deal_partner.GetTitledFirstName]の使者は声を低く保ち、秤に載る類のものは何も求めない。\n\n主君が欲しいのはあなたの言葉だという。貸しを一つ、取り立てる時期は主君が選ぶ。その種の借りは決まって最悪の折に取り立てられる。だからこそ、買っておく値打ちがある。"
 tnt_ai_offer_desc_a9:0 "[tnt_deal_partner.GetTitledFirstName]が寄越したのは贈り物でも世辞でもなく、ただの督促である。\n\n貸しがある。使者はそれが果たされるのを見届けに来た。卓に置かれたのは嘆願ではなく勘定書だ。借りは声に出して名指しされ、下の条件がその清算にあたる。"
 tnt_ai_offer_desc_a5:0 "[tnt_deal_partner.GetTitledFirstName]の使者は腰を下ろさず、これが国政の話だと繕いもしない。\n\nその家の者、その忠誠に連なる者が、男も女もあなたの牢で朽ちている。主君は彼らを取り戻したい。牢番の損を割に合わせるだけのものを携えてきた。"
 tnt_ai_offer_desc_a6:0 "この使節は伝令と角笛と証人の列を伴って到着する。[tnt_deal_partner.GetTitledFirstName]は、ここで署名されるものを世界中に見せるつもりなのだ。\n\n中身は#high 十年#!の相互の盟約である。これを公に結ぶため、主君は列席する宮廷の前で自らの[prestige|E]の一部をあなたに譲るという。それほど大声で買われた平和は、どちらの側からも否認しにくい。"
 tnt_ai_offer_desc_a8:0 "[tnt_deal_partner.GetTitledFirstName]は国境と金子について書き送ってきた。あなたの土地のうち、下の条件で名指しされたものは、相手の旗の下にあるほうが収まりがよい。相手は黙って欲しがるより、正々堂々と買うほうを選ぶという。価格は残らず書き出されている。印章はあなたの返答を待っている。"
 tnt_ai_offer_desc_a10:0 "[tnt_deal_partner.GetTitledFirstName]は土地を差し出している。下に名指しされた相手の領地は、相手にとって恵みより重荷であり、あなたの手に渡って自らの金庫が重くなるほうがよいという。あなたに求められる代価は条件の中にある。"
 tnt_ai_offer_desc_a11:0 "[tnt_deal_partner.GetTitledFirstName]が差し出すのは土地ではなく、土地への合法の道筋である。相手自身の称号の一つに対する請求権を、書き記し封をして、あなたが好きなときに主張できるようにするという。法律家の墨は兵士の血より安い。もっとも無償ではないことは、下の条件が証している。"
 tnt_ai_offer_desc_a13:0 "[tnt_deal_partner.GetTitledFirstName]の使者が、あなたに見せるために携えてきた宝物の覆いを取る。下の条件に名指しされた、相手自身の広間の一品である。正直な金子と引き換えに差し出されている。この種の品は、戦場を越えるより卓を越えるほうが、品よく新しい持ち主を見つけるものだ。"
 tnt_ai_offer_desc_a14:0 "[tnt_deal_partner.GetTitledFirstName]は、めったに羊皮紙に託されない言葉を書いてきた。膝を折る用意があるという。その領国はあなたの庇護の下に、その旗印はあなたの旗の下に入る。ただし見返りがあり、それは下の条件に書き出されている。よく量ることだ。ひとたび誓われた忠誠は、軽々には解かれない。"
 tnt_ai_offer_desc_a15:0 "[tnt_deal_partner.GetTitledFirstName]は、あなたの炉端に席を求めてきた。自分のためではない。下に名指しされたその子を、あなたの宮廷で育ててほしいという。そうして預かる子は、名誉であると同時に家と家を結ぶ絆でもある。子に添えられるものは条件に書き出されている。"
 tnt_ai_offer_desc_a16:0 "我が使者が携えるのは、金にまさる申し出である。両家を結ばせてほしい。我が血の者を一人、そちらの一人と娶せ、二つの家系が一つの未来を分かち合うようにと願う。縁組は下に名指しされている。私のいかなる取引とも同じように量られたい。"
 tnt_ai_offer_desc_a17:0 "[tnt_deal_partner.GetTitledFirstName]は、自らの誓いを量って重すぎると悟った封臣として書いてきた。\n\n求めるのはあなたへの忠誠からの解放である。旗印を再び自分のものとし、館を誰にも申し開きせずに済むようにしたい。ただで求めているわけではない。引き換えに差し出すものは下の条件の中にある。返された誓いは破られた誓いではない。とはいえ、軽々に返されるものでもない。"
 tnt_ai_offer_desc_a18:0 "[tnt_deal_partner.GetTitledFirstName]の使節は手ぶらでは来ない。しかも携えているのは金ではない。\n\n下に名指しされた自らの血を分けた子を、人質としてあなたの手に委ねるという。その子があなたの屋根の下にあるかぎり、あなたへの言葉は守られるという担保である。これほど貴い担保の見返りに求めるものは、条件に書き込まれている。"
 tnt_ai_offer_desc_a19:0 "[tnt_deal_partner.GetTitledFirstName]は、あなたの宮廷にいるある男の噂を聞き、その男を欲しがっている。\n\n名は下に記されている。自らの下へ移してほしいという願いであり、ただで済ませるつもりもない。財布は条件の中にある。大きな館にとって家臣ひとりは小さなものだ。差し出された値は小さくない。"
 tnt_ai_offer_desc_a20:0 "[tnt_deal_partner.GetTitledFirstName]は膝を折る用意がある。ただし目をつぶってではない。\n\nその領国があなたの王冠の下に入るのは、下の契約に書き込まれた条件のもとにおいてである。すなわち、何を納め、何を自らの手に残すつもりかである。公正な値で買われた忠誠は、奪われた忠誠より長く保たれる。印を捺す前に条件を読むことだ。"
 tnt_ai_offer_desc_generic:0 "[tnt_deal_partner.GetTitledFirstName]の使者が取り次がれ、一礼して封をした提案を卓上に置く。条件は主君自身の筆で下に書き記されており、使者はあなたの返答を待っている。"
 tnt_ai_offer_desc_outro:0 "\n\n#weak あなたの外交官たちは、あなた自身が用いるのと同じ秤でこれを量った。#!"
 tnt_ai_goal_claim:0 "#weak 密偵の囁き。あの家はあなたの土地に請求権を温めており、血より金のほうが安上がりだと踏んでいる。#!\n\n"
 tnt_ai_goal_dejure:0 "#weak 法官たちの確認。くだんの土地は古い権利によって相手の王冠に傾いており、相手はそれを忘れていない。#!\n\n"
 tnt_ai_goal_kin:0 "#weak 理由は遠くにない。相手の血を分けた者が、あなたの牢に座っている。#!\n\n"
 tnt_ai_goal_menaced:0 "#weak 国境の者たちの報告。より強い隣人が相手の土地に覆いかぶさっており、相手は友を切実に求めている。#!\n\n"
 tnt_ai_goal_rich:0 "#weak 商人たちは確かに知っている。相手の国庫は使い道を探す金で軋んでいる。#!\n\n"
 tnt_ai_goal_poor:0 "#weak 商人たちの囁き。相手の金庫は空で、金子に飢えている。#!\n\n"
 tnt_ai_goal_overdomain:0 "#weak 法官たちの見立て。相手は一つの手で正しく保てる以上の土地を抱えており、余りが買い手を探している。#!\n\n"
 tnt_ai_goal_heir:0 "#weak 相手の宮廷では秘密でもない。後継者は年頃で、床は空いたままだ。縁組が要るのである。#!\n\n"
 tnt_ai_goal_brood:0 "#weak 家中の者が冗談にしている。相手の館は子供で溢れ、その一人ひとりに宮廷と食卓と教師が要る。#!\n\n"
 tnt_ai_goal_schemer:0 "#weak 密偵たちの警告。あの宮廷は囁きで組み上がっており、その主は使うつもりのない約束を買うことがない。#!\n\n"
 tnt_ai_goal_yoke:0 "#weak 執事たちが向こうの使用人から聞いている。あの家に誓いは重く、領主たちは昔の自由を口にしている。#!\n\n"
 tnt_ai_goal_talent:0 "#weak 侍従長が理由を言い当てる。相手の館はその技の者を欲しがっており、あなたの館にはその者がいる。#!\n\n"
 tnt_ai_goal_surety:0 "#weak 使者たちの読みは明快だ。相手は自らの誠意をあなたの疑いの及ばぬところに置くつもりで、そのために血を差し出す気でいる。#!\n\n"
 tnt_ai_goal_might:0 "#weak 国境の兵からの報せ。あの者の軍勢は集められたまま暇を持て余し、こちらの徴集兵を数えているという。#!\n\n"
 tnt_ai_goal_blank:0 ""
 tnt_ai_offer_opt_accept:0 "この条件を受け入れる"
 tnt_ai_offer_opt_counter:0 "交渉の卓を開く"
 tnt_ai_offer_counter_tt:0 "#high 相手の条件をすでに並べた状態で、あなた自身の交渉窓を開きます。#! どれでも変更でき、気に入らないものは消し、自分の要求を足して、作り直した条約を送り返せます。提案を押すまで、何も約束されません。"
 tnt_ai_offer_opt_decline:0 "使者を帰らせる"
 tnt_ai_offer_opt_hush:0 "使者を帰らせ、以後の使節も断る"
 tnt_ai_offer_hush_tt:0 "#high 十年#!のあいだ、条約を携えてあなたに近づく統治者はいなくなります。"
 tnt_ai_demand_title:0 "[tnt_deal_partner.GetTitledFirstName]からの要求"
 tnt_ai_demand_desc_a21:0 "[tnt_deal_partner.GetTitledFirstName]の使者は、贈り物も提案も携えていない。金額を告げ、主君は自ら取り立てに赴く口実を与えられては心苦しい、と言う。そして立ったまま待ち、腰を下ろそうとはしない。"
 tnt_ai_demand_desc_outro:0 "\n\n#weak 払えば、払ったことが世に知れる。追い返せば、それもまた世に知れる。#!"
 tnt_ai_demand_opt_pay:0 "求められた額を払う"
 tnt_ai_demand_pay_tt:0 "#high 金が数え上げられ、使者は満足して去る。#! それにより彼の名は高まり、話を聞いた者はいっそう彼を恐れるだろう。以後十五年は、彼が再び求めてくることはない。"
 tnt_ai_demand_opt_refuse:0 "手ぶらで追い返す"
 tnt_ai_demand_refuse_tt:0 "#high 彼は何も得ない。#! だが使者が広間に入り、額を告げ、答えを得ぬまま去った — 宮廷はそれを見ており、あなたの名声はそのぶん傷つく。彼の名もまた傷つく。拒まれた脅しとは、量られた脅しだからだ。以後十五年は、彼が再び求めてくることはない。"
 tnt_ai_demand_refuse_free_tt:0 "#high 彼は何も得ず、あなたも何も失わない。#! あなたの軍勢は、もはや彼が数えたときのものではない。彼の名はそのぶん傷つき、以後十五年は再び求めてこない。"
 tnt_ai_offer_row_alliance:0 "双方で誓う軍事同盟"
 tnt_ai_offer_row_truce:0 "十年にわたる双方の不可侵条約"
 tnt_ai_offer_row_gold_r:0 "相手はあなたに[gold_i] [GetPlayer.MakeScope.Var('tnt_gold_r').GetValue|0]を支払います"
 tnt_ai_offer_row_prestige_r:0 "相手は[prestige_i] [GetPlayer.MakeScope.Var('tnt_prestige_r').GetValue|0]を引き渡します"
 tnt_ai_offer_row_piety_r:0 "相手は[piety_i] [GetPlayer.MakeScope.Var('tnt_piety_r').GetValue|0]を引き渡します"
 tnt_ai_offer_row_influence_r:0 "相手は[influence_i] [GetPlayer.MakeScope.Var('tnt_influence_r').GetValue|0]を引き渡します"
 tnt_ai_offer_row_gold_p:0 "相手はあなたに[gold_i] [GetPlayer.MakeScope.Var('tnt_gold_p').GetValue|0]を求めています"
 tnt_ai_offer_row_prestige_p:0 "相手はあなたに[prestige_i] [GetPlayer.MakeScope.Var('tnt_prestige_p').GetValue|0]を求めています"
