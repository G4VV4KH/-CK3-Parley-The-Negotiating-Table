 setting_tnt_trade_prestige_peer_desc:0 "威信点を譲渡できるのは、与える側の名声レベルが受け取る側以上の場合だけです。逆方向は別に判定されます。プレイヤーとAIに同じ規則が適用されます。"
 setting_tnt_trade_prestige_off:0 "無効"
 setting_tnt_trade_prestige_off_desc:0 "プレイヤーもAIも威信点を取引できません。他の通貨には影響しません。"
 rule_tnt_trade_piety:0 "Parley：敬虔点の取引"
 setting_tnt_trade_piety_on:0 "利用可能"
 setting_tnt_trade_piety_on_desc:0 "どの統治者に対しても敬虔点を提示・要求できます。プレイヤーとAIに同じ規則が適用されます。"
 setting_tnt_trade_piety_faith:0 "同じ宗派のみ"
 setting_tnt_trade_piety_faith_desc:0 "敬虔点を譲渡できるのは同じ宗派の統治者同士だけです。宗教が同じだけでは認められません。プレイヤーとAIに同じ規則が適用されます。"
 setting_tnt_trade_piety_faith_lower:0 "同じ宗派で献身が低い"
 setting_tnt_trade_piety_faith_lower_desc:0 "敬虔点を譲渡できるのは同じ宗派の統治者同士だけで、献身レベルが高い側から低い側への譲渡に限られます。同じレベルでは譲渡できません。比較するのは現在の敬虔点ではなく献身レベルです。交渉を始めた側ではなく実際の譲渡方向で判定します。プレイヤーとAIに同じ規則が適用されます。"
 setting_tnt_trade_piety_different_faith:0 "異なる宗派のみ"
 setting_tnt_trade_piety_different_faith_desc:0 "敬虔点を譲渡できるのは異なる宗派の統治者同士だけです。同じ宗教に属する異なる宗派も含みます。プレイヤーとAIに同じ規則が適用されます。"
 setting_tnt_trade_piety_religion:0 "同じ宗教のみ"
 setting_tnt_trade_piety_religion_desc:0 "宗派が違っていても、双方の統治者の宗教が同じなら敬虔点を譲渡できます。プレイヤーとAIに同じ規則が適用されます。"
 setting_tnt_trade_piety_off:0 "無効"
