 tnt_open_negotiations:0 "条約の交渉"
 tnt_open_negotiations_desc:0 "[recipient.GetShortUIName]に使者を送り、条約の全文を卓上に並べます。あらゆる条件を、双方の分をまとめて一度に。[actor.Custom('TntThreatCooldownStatus')]"
 tnt_bd_floor_panel:0 "贈り物の下限補正"
 tnt_threat_cooldown_status:0 "\n\n#high 脅しの待機期間#!\n残り日数: [GetVarTimeRemaining(tnt_cooldown_actor.MakeScope, 'tnt_threat_cooldown')|0] (終了日 [GetCurrentDateWithDiff(GetVarTimeRemaining(tnt_cooldown_actor.MakeScope, 'tnt_threat_cooldown'))])."
 tnt_threat_cooldown_short:0 "待機期間: [GetVarTimeRemaining(tnt_cooldown_actor.MakeScope, 'tnt_threat_cooldown')|0]日"
 tnt_threat_cooldown_empty:0 ""
 tnt_open_negotiations_extra_icon:0 "@dread_icon! この相手には圧力をかけられます。軍と名声と恐怖が合わさって脅しに必要なだけの重みに達しており、前回の脅しはもう忘れられています"
 tnt_window_title:0 "外交交渉"
 tnt_col_actor:0 "あなたの提示"
 tnt_col_partner:0 "相手の提示"
 tnt_balance_header:0 "相手の返答"
 tnt_balance_accept:0 "#P 相手は応じる構えです#!"
 tnt_balance_reject:0 "#N 相手は断る構えです#!"
 tnt_scale_note:0 "この数字がそのまま相手の返答です。ゼロを超えていれば署名します。どの条件も、それだけを単独で取り決めたならいくらの値打ちになるかで見積もられており、あなたへの好感度、信仰、血縁、そして相手が上乗せで求めるものは、すでにすべて織り込まれています。帯は同じ返答を引き伸ばしたものです。承諾へ傾ける力のすべてと、拒否へ傾ける力のすべての綱引きであり、帯が中央を越えた瞬間、相手は同意します。"
 tnt_label_points:0 "点"
 tnt_label_years:0 "#weak 有効期間は10年#!"
 tnt_picker_empty:0 "#weak 選べるものがありません#!"
 tnt_picker_empty_artifact:0 "#weak この側の所有品は、どれも手放せません。王冠の宝玉は称号に付き従い、王朝の旗印は王朝のもとに留まり、自らの信仰の聖遺物は同じ信仰の者にしか渡せません。#!"
 tnt_item_gold:0 "金"
 tnt_item_gold_desc:0 "国庫から[gold_i]を一度きり支払います。引き渡しは条約が結ばれたその瞬間です。"
 tnt_item_prestige:0 "威信点"
 tnt_item_prestige_desc:0 "卓上で約束される[prestige_i] [prestige|E]です。\n\n#weak 金庫がそのまま移るわけではありません。差し出す側が失い、受け取る側が得るという二つの別々の処理であり、両者を結び付けるものは何もありません。ですから、提案を押した時点で差し出す側が全額を保有していなければ、提案そのものを送れません。#!"
 tnt_item_piety:0 "敬虔点"
 tnt_item_piety_desc:0 "卓上で約束される[piety_i] [piety|E]です。\n\n#weak ここでも移転ではなく、二つの別々の処理です。一方が失った分を他方が得ます。提案を押した時点で差し出す側が全額を保有していなければ、提案は送れません。#!"
 tnt_item_influence:0 "影響力"
 tnt_item_influence_desc:0 "卓上で約束される[influence_i] [influence|E]です。\n\n#weak [influence|E]は、それを基盤とする統治形態のもとにしか存在しません。ですからこの行は、双方の統治形態がともにそれを基盤とする場合にのみ現れます。そうした蓄えを持たない統治者に渡しても、何も起こりません。ここでも処理は二つに分かれており、提案を押した時点で差し出す側が全額を保有していなければ、提案は送れません。#!"
 tnt_item_alliance:0 "軍事同盟"
 tnt_err_ab_already_fair:0 "条約はすでにちょうど#high +1#!で釣り合っています。調整すべきものは残っていません"
 tnt_err_ab_empty:0 "卓上にはまだ、釣り合わせるものがありません"
 tnt_threat_opinion:0 "私を脅した"
 tnt_treaty_favor_opinion:0 "有利な条約"
 tnt_item_usehook_r:0 "相手が借りを取り立てる"
 tnt_item_usehook_r_desc:0 "相手はあなたに対する[hook|E]を握っており、それを使うつもりです。ですから条約にもその分が織り込まれることを期待しています。\n\n#weak これはあなたに切れるものではありません。梃子は相手のものであって、あなたのものではないからです。そのぶん相手は公正な価格より多くを要求します。取り立てられる好意なら#high -45#!、脅迫に相当する梃子なら#high -120#!です。署名すれば借りは清算されます。弱いフックは消え、強いフックは残ります。#!\n\n#weak 断っても失うものは条約だけです。#!"
 tnt_usehook_r_sub:0 "[Select_CString( GreaterThanOrEqualTo_CFixedPoint( GetPlayer.MakeScope.ScriptValue('tnt_usehook_r_strength_value'), '(CFixedPoint)2' ), Localize('tnt_usehook_strong'), Localize('tnt_usehook_weak') )]"
 tnt_bd_usehook_r:0 "あなたに対して行使される借り"
 tnt_item_usehook:0 "フックを行使する"
 tnt_item_usehook_desc:0 "すでにあなたが握っている梃子を使います。これは#high 貸しを与える#!とは逆向きの行いです。あちらは相手にあなたへの貸しを渡すもの、こちらは相手が負っている借りを取り立てるものです。\n\nあなたを決して好きにならない統治者にも効きますから、その重みは相手の好感度に左右されません。あなたが差し出しうるほかのすべてとは違うところです。\n\n#weak 取り立てる[hook|E]の値打ちは#high +45#!、脅迫に相当する梃子なら#high +120#!です。フックが残るかどうかを決めるのはゲーム本体です。弱いものは条約の締結時に使い切られ、強いものは残ります。消費されるのは条約が実際に成立した場合だけです。結ばれなかった条約のために取り立てた好意は、捨てた好意にほかならないからです。#!\n\n#weak 借りを取り立てることは、脅しとまったく同じようにあなたにのしかかります。あなた自身の気質がこの行いを裁きます。良心のある者はそれを自らの#high ストレス#!として背負い、より冷たい統治者はむしろ梃子をついに使えたことに安堵します。どの特性が応じたのかは、使者が発つ前の確認画面に示されます。#!"
 tnt_usehook_sub:0 "[Select_CString( GreaterThanOrEqualTo_CFixedPoint( GetPlayer.MakeScope.ScriptValue('tnt_usehook_strength_value'), '(CFixedPoint)2' ), Localize('tnt_usehook_strong'), Select_CString( GreaterThanOrEqualTo_CFixedPoint( GetPlayer.MakeScope.ScriptValue('tnt_usehook_strength_value'), '(CFixedPoint)1' ), Localize('tnt_usehook_weak'), Localize('tnt_usehook_none') ) )]"
 tnt_usehook_strong:0 "強いフック。使っても失われません"
 tnt_usehook_weak:0 "弱いフック。取り立てれば使い切ります"
 tnt_usehook_none:0 "相手に対するフックを持っていません"
 tnt_bd_usehook_p:0 "行使したフック"
 tnt_err_usehook_none:0 "行使できるフックを相手に対して持っていません"
 tnt_item_threat:0 "脅す"
 tnt_item_threat_desc:0 "拒めば何を失うことになるのかを、相手に分からせます。これは宣戦ではありません。何も誓われず、軍も動きません。卓上に置かれる重みであり、あなたを決して好きにならない統治者にも効きます。金にはできないことです。\n\nその重みは#high あなたの軍が相手の軍をどれだけ上回っているか#!であり、それを#high あなたの名声が相手の名声をどれだけ上回っているか#!と、#high あなたの恐怖が相手の恐怖をどれだけ勝っているか#!が押し上げ、あるいは押し下げます。名声の段が相手より丸ごと一つ低ければ、どれほどの大軍を擁していても脅しは完全に閉じます。そして脅しを開いたその重みが、そのまま条約をあなたに有利へ傾ける重みになります。\n\n#weak 相手はこれを覚えています。脅しのもとで結ばれた条約には「$tnt_threat_opinion$」が付き、好感度が#high -100#!、十五年かけて薄れていきます。あなたの贈り物に値打ちを与えているのは相手の好感度ですから、今日恐怖で奪えば、以後一世代のあいだ、あなたの金は相手から少ししか買えません。しかも支払うのはあなたの金だけではありません。あなた自身の気質がこの行いを裁きます。良心のある者はその重みを自らの#high ストレス#!として背負い、より冷たい統治者はむしろ重荷を下ろした心地になります。どの特性が応じたのか、そして正確な数値は、使者が発つ前の確認画面に示されます。#!"
 tnt_threat_sub:0 "軍[GetPlayer.MakeScope.ScriptValue('tnt_threat_ratio_value')|1]対1、名声×[GetPlayer.MakeScope.ScriptValue('tnt_threat_rep_term_value')|0]、恐怖×[GetPlayer.MakeScope.ScriptValue('tnt_threat_dread_term_value')|2]"
 tnt_bd_threat_p:0 "剥き出しの圧力"
 tnt_bd_threat_panel:0 "圧力"
 tnt_err_threat_weak:0 "脅しには、軍事力・威信・恐怖による取引点が100点以上必要です。この最低値はプレイヤーとAIに共通です。"
 tnt_err_threat_relation:0 "脅せるのは、あなたの同盟者ではなく、互いの人質関係にもない独立した統治者だけです"
 tnt_err_threat_unknown:0 "あなたの名にいくらかの重みが要ります。名声レベルが皆無より上でなければなりません"
 # tnt_err_threat_unafraid RETIRED round 8 (I2). This tombstone holds the line count so no .yml citation moves. ORPHANED 2026-08-24 BY THE RATIO RULING, KEPT DEFINED IN ALL NINE: tnt_err_threat_unknown above and tnt_err_threat_nofear below have ZERO rows - their rules are inside tnt_threat_points_value now. Law 9 and the law-10d control. DO NOT DELETE, DO NOT RE-USE FOR ANOTHER MEANING.
 tnt_err_threat_nofear:0 "相手はあなたを恐れていません。恐怖が75に達するか、大胆でない相手なら40、あなたの支配下にある相手なら20に達する必要があります"
 tnt_err_threat_recent:0 "相手はまだ前回の脅しを覚えています。もう一度圧をかけるなら、その記憶が薄れるのを待ってください"
 tnt_item_alliance_desc:0 "二人がともに誓う、正式な同盟が一つ。一方が他方に手渡すたぐいのものではありません。以後どちらの側も相手を戦争に招請でき、その招請を断れば[prestige|E]を失います。\n\n#weak 一つの盟約に一つの行。条約に入っているか、いないかのどちらかです。#!\n\n#weak 自分の[liege|E]や自分の[vassal|E]と誓った場合は、招請の権利ではなく常設の盟約になります。主君と封臣は互いを招請できない決まりですが、同盟そのものは実在し、同盟が数えられる場所ではすべて数えられ、どちらかが相手の領国を離れた日を越えて残ります。#!\n\n#weak $tnt_tt_alliance_glut$#!"
 tnt_tt_alliance_glut:0 "すでに結んでいる同盟が多いほど、次の同盟は安く買えます。二人目の同盟者からは、自分の主君と自分の封臣を数に入れずに、既存の同盟が一つあるごとに、新しい盟約が相手にとって持つ値打ちが半分になります。相手側の同盟者も、相手に対して同じように働きます。"
 tnt_item_truce:0 "不可侵条約"
 tnt_item_truce_desc:0 "二人がともに結ぶ盟約が一つ。#high 十年#!のあいだ、どちらの側も相手に宣戦できません。\n\n#weak 一つの盟約に一つの行。条約に入っているか、いないかのどちらかです。#!"
 tnt_item_marriage:0 "婚姻の取り決め"
 tnt_item_marriage_desc:0 "両家のあいだの縁組です。#high 一つの条約に何組でも#!入れられます。双方から一人ずつ選び、子が継ぐ家系を定めて、その組を加えてください。どちらかがまだ子供であれば、その組は結婚ではなく婚約になります。\n\n#weak 二組目以降は、相手にとっての値打ちが一組ごとに少しずつ下がりますが、縁組が相手に強いる代償のほうは決して縮みません。ですから、水増しした十数組より、良い縁組を数組のほうが勝ります。自家より低い家格との縁組を求められた家は、その降格に代価を求め、格差が開くほど請求は険しくなります。一組にかぎり、大結婚式を約束することもできます。#!\n\n#high 十分に近い縁組は、いまや同盟を伴います#!。ゲーム自身の縁組とまったく同じです。そして条約の値段はこの同盟を織り込みますから、同盟を生む縁組は、生まない縁組より値打ちがあります。#weak 婚姻の画面が候補者の横に描く「締結可能な同盟」の案内は、ふたたび信じてよいものになりました。#!"
 tnt_item_title:0 "称号の割譲"
 tnt_item_title_desc:0 "保有する伯爵位以上の称号を、その配下のすべてとともに引き渡します。\n\n#weak 一度に何件でも構いません。首都と主要称号が卓上に載ることはありません。受取側の直轄領上限を超える土地も提示できますが、その価値は現在の評価ルールに従います。条約を提案する前に、点数の内訳を確認してください。#!"
 tnt_item_claim:0 "請求権の付与"
 tnt_item_claim_desc:0 "差し出す側が自ら保有する称号に対して、未主張の[claim|E]を与えます。将来の戦争への公然たる招待であり、重大な譲歩です。\n\n#weak 一度に何件でも構いません。#!"
 tnt_item_prisoner_multi:0 "指名した捕虜の解放"
 tnt_item_prisoner_multi_desc:0 "名指しした捕虜だけのために牢を開きます。ほかの者は出しません。\n\n#weak 捕虜の値打ちは、その身分と血筋で決まります。誰であれ#high 10#!、相手方の血縁なら#high +15#!、何らかの称号を持っていれば#high +10#!、その称号が伯爵位・公爵位・王位・皇帝位に届くにつれて#high +15 / +25 / +40 / +60#!です。ですから捕らわれた王は、名もなき十数人より値打ちがあります。選ぶ意味はそこにあります。#!\n\n#weak ここで誰かを選ぶと#high 捕虜の解放#!より優先されます。そうでなければ、同じ人間に二度支払うことになるからです。#!"
 tnt_multi_count_prisoner_p:0 "名指しした捕虜：[GetPlayer.MakeScope.ScriptValue('tnt_count_sel_prisoner_p_value')|0]"
 tnt_sel_count_prisoner_p:0 "名指し：[GetPlayer.MakeScope.ScriptValue('tnt_count_sel_prisoner_p_value')|0]"
 tnt_picker_title_prisoner:0 "解放する捕虜を選ぶ"
 tnt_item_prisoners:0 "捕虜の解放"
 tnt_item_prisoners_desc:0 "解放する側は、相手方と血縁または忠誠で結ばれたすべての囚人に牢を開きます。"
 tnt_item_hook:0 "貸しを与える"
 tnt_item_hook_desc:0 "相手方に[hook_i]借りを作ります。強さは三段階です。#high 弱い#!貸しは十年もち、初めて使われた時点で消費されます。#high 強い#!貸しは二十年もち、何度でも使え、使用と使用のあいだに五年の間を置きます。#high 永遠#!の貸しは期限がなく消費もされず、同じく五年の間を置きます。\n\n#weak 左クリックで強さを上げ、右クリックで下げます。受け取る側が差し出す側に対してすでに貸しを持っている場合、この約束はできません。#!"
 tnt_item_artifact:0 "宝物"
 tnt_item_artifact_desc:0 "差し出す側の宝物庫から[artifact_i]宝物を引き渡します。\n\n#weak 一度に何点でも構いません。ゲームが手元に留めておく品は一覧に出ません。称号に結び付いた王冠の宝玉、王朝の旗印、そして信仰をまたいで差し出される自らの信仰の聖遺物です。#!"
 tnt_item_nonwar:0 "不戦の約束"
 tnt_item_nonwar_desc:0 "第三の統治者との一方的な[truce|E]を#high 十年#!誓います。停戦協定の破棄には重い罰が伴います。\n\n名指しできるのは、誓う側の領国と境を接する統治者、および誓う側が請求権を持つ称号の保持者です。交渉中の二人、誓う側の同盟者、すでに停戦協定下にある者は決して名指しできません。\n\n#weak 相手方は何も返す義務を負いません。誓う側がただ手を控えるだけです。#!"
 tnt_item_vassal:0 "忠誠を誓う"
 tnt_item_vassal_desc:0 "一方の統治者が膝を折り、領国もろとも他方の[vassal|E]になります。この卓が抱えうる最も重い条件であり、書き換えのできる契約書が付く唯一の条件でもあります。"
 tnt_item_indep:0 "独立の承認"
 tnt_item_indep_desc:0 "封臣が忠誠の誓いから解かれ、独立した統治者になります。卓のあなたの側にあるときは自分の封臣が解き放たれ、相手の側にあるときはあなた自身が解き放たれます。一つの条約が、これと忠誠の誓いを同時に抱えることはできません。\n\n#weak 提示できるのは、二人がすでに主君と直属の封臣の関係にあり、解かれる側が自分の土地を持ち、どちらの領国も戦争中でなく、その土地が主君自身の慣習的な相続分に含まれていない場合だけです。#!"
 tnt_item_hostage:0 "人質"
 tnt_item_hostage_desc:0 "差し出す側の近しい血縁、すなわち子、孫、兄弟姉妹、甥または姪が相手の宮廷へ赴き、この条約の担保として人質となって暮らします。囚人ではなく、ゲーム本来の人質の規則に従う客人です。\n\n#weak 差し出せるのは、すでに自らの宮廷にいる、無封で未婚かつ未婚約の血縁だけです。自分の摂政は決して差し出せません。#!"
 tnt_item_ward:0 "被後見人"
 tnt_item_ward_desc:0 "差し出す側の宮廷から子供が送られ、相手の統治者のもとで育てられます。その統治者自身が後見人となり、第三者を選ぶ余地はありません。\n\n#weak 差し出せるのは、自らの宮廷にいて旅に耐えられる子供だけです。後見人は三人目の被後見人を取れません。#!"
 tnt_item_courtier:0 "廷臣"
 tnt_item_courtier_desc:0 "廷臣が家を移ります。それぞれ配偶者と幼い子供を伴っていきます。\n\n#weak 引き渡せるのは、差し出す側の宮廷にいる、成人した無封で役職に就いていない者だけです。後継者、配偶者、摂政、評議員、騎士、王宮役職者はいずれも渡せません。受け取る側が競争相手とみなしている者も決して渡せません。#!"
 tnt_item_subject_desc:0 "選んだ封臣が主君を変え、保有するすべての称号と自分の封臣すべてを連れて、相手の領国へ移ります。\n\n#weak 封臣契約は受け入れ側の領国の通常の条件で書き直されるため、特別な取り決めは失われます。譲渡に停戦協定は伴わず、いったん領国の境を越えた封臣を取り戻す手立ては、このゲームには戦争しかありません。譲り渡せるのは、伯領以上を保有し、受け取る君主より格下で、関係者の誰とも戦っていない直属の封臣だけです。摂政と後継者は決して譲れません。条約で一度動かされた封臣は、三年のあいだ再び動かせません。#!"
 tnt_item_subject:0 "封臣を譲り渡す"
 tnt_bd_base:0 "出発点"
 tnt_bd_gold_p:0 "あなたの提供：金"
 tnt_bd_prestige_p:0 "あなたの提供：威信点"
