 tnt_wed_row_line_tip:0 "En qué casa nacerán los hijos de esta pareja. Haz clic para cambiarlo: #high [patrilineal|E]#! los da a la casa del padre, #high [matrilineal|E]#! a la de la madre.\n\n#weak Cada pareja del tratado lleva su propia línea, y la línea es además lo que decide si puedes acoger su gran boda.#!"
 tnt_wed_taper:0 "Cada pareja posterior a la primera vale para la otra parte algo menos que la anterior, mientras que lo que un enlace le #high cuesta#! (un heredero entregado, una línea cedida) no se descuenta jamás.\n\nTres parejas valen alrededor de #high 2.7#! enlaces sueltos; una quinta añade solo #high 0.6#!, y a partir de ahí la ganancia deja de crecer.\n\n#weak Así que dos o tres buenos enlaces valen más que una docena de relleno.#!"
 tnt_wed_grand:0 "Prometer una gran boda"
 tnt_wed_grand_desc:0 "Da tu palabra de celebrar uno de estos enlaces con un gran festejo. #high La pareja honrada queda comprometida en vez de casada#!, y la otra parte valora el enlace mucho más por el honor que supone.\n\nLo que asumes: te conviertes en el anfitrión prometido, y tu palabra corre solo unos pocos años. #high Concertar la boda, convocar a los invitados y pagarlo todo sigue siendo cosa tuya#!: nada se planifica por ti, y hasta que lo hagas los dos están comprometidos y nada más. Si dejas vencer la promesa, no te olvidarán la palabra rota.\n\n#weak Solo una pareja del tratado puede ser honrada, ha de ser de tu propia sangre y la línea dominante ha de ser la tuya.#!"
 tnt_wed_grand_couple:0 "Se promete una gran boda a [GetPlayer.MakeScope.Var('tnt_wed_principal').Char.GetShortUIName] y [GetPlayer.MakeScope.Var('tnt_wed_principal').Char.MakeScope.Var('tnt_wed_partner').Char.GetShortUIName]"
