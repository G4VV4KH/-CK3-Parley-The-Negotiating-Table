 tnt_action_can_lean_on:0 "@dread_icon! La ventaja es tuya"
 tnt_action_can_lean_on_label:0 "@dread_icon! Puedes presionar a [recipient.GetPrimaryTitle.Custom('GetTierIcon')][recipient.GetUINameNoTooltip]"
 tnt_action_can_lean_on_desc:0 "[recipient.GetUIName] es alguien a quien puedes presionar: tu ejército, tu nombre y tu temor, cada uno medido frente al suyo, alcanzan el peso que exige una amenaza, y ha olvidado tu última amenaza. Pon la amenaza sobre la mesa y ese mismo peso se suma a lo que él está dispuesto a soportar: pagará más con tal de acabar la conversación."
 tnt_action_can_lean_on_click:0 "#I Clic para negociar un tratado#!"
 tnt_action_can_lean_on_combined_label:0 "[recipient.GetPrimaryTitle.Custom('GetTierIcon')] [recipient.GetUINameNoTooltip]"
 tnt_action_can_lean_on_combined_group_label:0 "@dread_icon! Gobernantes sobre los que llevas ventaja"
 tnt_action_can_lean_on_combined_group_name:0 "@dread_icon! Gobernantes a quienes puedes presionar"
 tnt_action_can_lean_on_combined_group_description:0 "Entre tus propios vasallos, tus señores y los vecinos de tus fronteras y de allende el mar, puedes presionar a cada uno de estos gobernantes: tu ejército, tu nombre y tu temor, cada uno medido frente al suyo, alcanzan el peso que exige una amenaza, y ha olvidado tu última amenaza. Abre negociaciones con cualquiera de ellos y marca «Amenazar» para poner la amenaza sobre la mesa."
 tnt_msg_stale:0 "Las condiciones han cambiado"
 tnt_err_deal_changed:0 "El acuerdo ya no puede cumplirse tal como está escrito; no se ha intercambiado nada."
