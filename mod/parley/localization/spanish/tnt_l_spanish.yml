 setting_tnt_advanced_terms_on_desc:0 "Los compromisos, los títulos cedidos y los juramentos de lealtad pueden negociarse en la mesa. Si lo desactivas, los gobernantes de la IA también dejan de proponer matrimonios por carta."
 setting_tnt_advanced_terms_off:0 "Desactivadas"
 setting_tnt_advanced_terms_off_desc:0 "Los compromisos, los títulos cedidos y los juramentos de lealtad quedan ocultos en la mesa de negociación."
 rule_tnt_trade_prestige:0 "Parley: comercio de prestigio"
 setting_tnt_trade_prestige_on:0 "Disponible"
 setting_tnt_trade_prestige_on_desc:0 "El prestigio puede ofrecerse a cualquier gobernante y solicitarse de él. La regla se aplica por igual a jugadores e IA."
 setting_tnt_trade_prestige_faith:0 "Solo la misma fe"
 setting_tnt_trade_prestige_faith_desc:0 "El prestigio solo puede transferirse entre gobernantes de la misma fe. Compartir religión no basta. La regla se aplica por igual a jugadores e IA."
 setting_tnt_trade_prestige_lower:0 "Menor nivel de fama"
 setting_tnt_trade_prestige_lower_desc:0 "El prestigio solo puede transferirse de un gobernante con un nivel de fama estrictamente superior a otro con un nivel inferior. Los niveles iguales quedan excluidos; la cantidad de prestigio acumulada no importa. La regla se aplica por igual a jugadores e IA."
 setting_tnt_trade_prestige_peer:0 "Solo iguales o inferiores"
 setting_tnt_trade_prestige_peer_desc:0 "El prestigio solo puede transferirse si el nivel de fama de quien lo entrega es al menos igual al de quien lo recibe. La dirección contraria se comprueba por separado. La regla se aplica por igual a jugadores e IA."
 setting_tnt_trade_prestige_off:0 "Desactivado"
 setting_tnt_trade_prestige_off_desc:0 "Ni los jugadores ni la IA pueden comerciar con prestigio. Las demás monedas no se ven afectadas."
 rule_tnt_trade_piety:0 "Parley: comercio de piedad"
 setting_tnt_trade_piety_on:0 "Disponible"
 setting_tnt_trade_piety_on_desc:0 "La piedad puede ofrecerse a cualquier gobernante y solicitarse de él. La regla se aplica por igual a jugadores e IA."
 setting_tnt_trade_piety_faith:0 "Solo la misma fe"
 setting_tnt_trade_piety_faith_desc:0 "La piedad solo puede transferirse entre gobernantes de la misma fe. Compartir religión no basta. La regla se aplica por igual a jugadores e IA."
 setting_tnt_trade_piety_faith_lower:0 "Misma fe: menos devoto"
 setting_tnt_trade_piety_faith_lower_desc:0 "La piedad solo puede transferirse entre gobernantes de la misma fe, de un nivel de devoción mayor a uno estrictamente menor. No se permite entre niveles iguales. Se compara el nivel de devoción, no los puntos de piedad disponibles, según la dirección real de la transferencia e independientemente de quién inició las negociaciones. La regla se aplica por igual a jugadores e IA."
 setting_tnt_trade_piety_different_faith:0 "Solo fes diferentes"
 setting_tnt_trade_piety_different_faith_desc:0 "La piedad solo puede transferirse entre gobernantes de distintas fes, incluidas las de una misma religión. La regla se aplica por igual a jugadores e IA."
 setting_tnt_trade_piety_religion:0 "Solo la misma religión"
 setting_tnt_trade_piety_religion_desc:0 "La piedad puede transferirse entre gobernantes de la misma religión, aunque sus fes difieran. La regla se aplica por igual a jugadores e IA."
 setting_tnt_trade_piety_off:0 "Desactivado"
 setting_tnt_trade_piety_off_desc:0 "Ni los jugadores ni la IA pueden comerciar con piedad. Las demás monedas no se ven afectadas."
