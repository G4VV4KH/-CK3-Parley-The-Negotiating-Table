 tnt_ai_offer_row_usehook_r:0 "Reclama un favor [hook_i] que le debes"
 tnt_ai_offer_row_word_kept:0 "Este trato ya no le entusiasma, pero lo ofreció y lo cumplirá"
 tnt_ai_gift_line:0 "Enviado por alta estima: las cláusulas valen más de lo que se pide a cambio. Esta carta es un regalo deliberado."
 tnt_refuse_envoys_decision:0 "No recibir más embajadas"
 tnt_refuse_envoys_decision_desc:0 "La orden corre en voz baja por todos los caminos y por todos los puertos: esta corte ha dejado de escuchar a portadores de tratados. Los gobernantes con propuestas pueden guardárselas. Tus propios emisarios cabalgan como antes: la puerta está atrancada por dentro, y la tranca está en tu mano."
 tnt_refuse_envoys_decision_tooltip:0 "Ningún gobernante te abordará con un tratado hasta que digas lo contrario. Las negociaciones que abras tú no se ven afectadas."
 tnt_refuse_envoys_decision_confirm:0 "Atrancar la puerta"
 tnt_refuse_envoys_decision_effect_tt:0 "Ningún gobernante te abordará con un tratado hasta que revoques esta decisión."
 tnt_accept_envoys_decision:0 "Volver a recibir embajadas"
 tnt_accept_envoys_decision_desc:0 "Se levanta la tranca y se ordena a los guardias de la puerta hacerse a un lado: los portadores de tratados pueden volver a entrar, con sus sellos intactos y sus ofertas pesadas en la balanza de siempre."
 tnt_accept_envoys_decision_tooltip:0 "Las embajadas con tratados pueden llegar de nuevo a tu corte, desde este mismo día."
 tnt_accept_envoys_decision_confirm:0 "Abrir las puertas"
 tnt_accept_envoys_decision_effect_tt:0 "Las embajadas con ofertas de tratado pueden llegar de nuevo a tu corte: de inmediato, no cuando hubiera vencido el antiguo silencio."
 decision_group_type_tnt_uninstall:0 "Decisiones de retirada de mods"
 tnt_uninstall_decision:0 "Recoger la mesa de negociación"
 tnt_uninstall_decision_desc:0 "Se despide a los emisarios, se queman los registros y se saca del salón la mesa misma. Toma esta decisión justo antes de retirar el mod: barre de la partida guardada todo rastro que Parley conserve en este mundo. Las cartas sin responder y las negociaciones a medio armar quedan anuladas; todo tratado ya concluido se mantiene."
 tnt_uninstall_decision_tooltip:0 "Prepara esta partida guardada para jugar sin Parley: The Negotiating Table. Elimina toda variable, anzuelo y opinión que el mod haya escrito, en todos los personajes del mundo. Los tratos concluidos (matrimonios, títulos cedidos, juramentos de lealtad) quedan intactos."
 tnt_uninstall_decision_confirm:0 "Barrerlo todo"
 tnt_uninstall_decision_effect_tt:0 "Toda variable, lista, marca de personaje, anzuelo y opinión escritos por Parley se eliminan de todos los personajes del mundo. Cualquier carta de oferta sin responder y cualquier negociación a medio armar quedan anuladas. Guarda la partida y luego desactiva el mod: la partida queda limpia de Parley."
 tnt_ai_msg_treaty:0 "Se firma un tratado"
 tnt_ai_msg_tt_truce:0 "Han comprado con oro una paz de diez años."
 tnt_ai_msg_tt_ally:0 "Han comprado con oro una alianza militar."
 tnt_ai_msg_tt_hook:0 "Uno debe ahora al otro un favor, comprado con oro."
 tnt_ai_msg_tt_hookcall:0 "Se ha reclamado una deuda: uno de ellos tenía un [hook|E] sobre el otro y cobró en oro."
 tnt_ai_msg_tt_ultimatum:0 "El oro ha cambiado de manos en una sola dirección. El más débil de los dos pagó para que lo dejaran en paz."
 tnt_ai_msg_tt_title:0 "La tierra ha cambiado de manos por oro: uno de los dos gobernantes ha comprado un condado al otro."
 tnt_ai_msg_tt_vassal:0 "Un señorío ha hincado la rodilla: el gobernante más débil ha jurado lealtad al más fuerte, por oro y protección."
 tnt_ai_msg_tt_submission:0 "Un señorío se sometió bajo amenaza: un gobernante abrumadoramente más fuerte obligó a un vecino independiente más débil a jurarle lealtad sin pago."
 tnt_ai_msg_tt_artifact:0 "Un tesoro ha cambiado de manos por oro: uno de los dos gobernantes ha comprado una pieza del salón del otro."
 tnt_ai_msg_tt_wed:0 "Dos casas quedan unidas: los gobernantes han acordado un matrimonio entre sus parientes, y con él fue una dote de oro."
 rule_tnt_ai_treaties:0 "Parley: tratados entre gobernantes de la IA"
 setting_tnt_ai_treaties_off:0 "Desactivados"
 setting_tnt_ai_treaties_off_desc:0 "Los gobernantes de la IA nunca concluyen tratados entre sí a tus espaldas.\n\n#weak No cuesta absolutamente nada: una consulta al año y ningún trabajo más. La IA puede seguir negociando #high contigo#!.#!"
 setting_tnt_ai_treaties_rare:0 "Ocasionales"
 setting_tnt_ai_treaties_rare_desc:0 "Los gobernantes vecinos de la IA cierran tratos entre sí de vez en cuando: un puñado de tratados al año en todo el mapa.\n\nAsí se negocian oro, favores debidos, deudas reclamadas, ultimátums y artefactos; cuando las partes ya son amigas, un condado fronterizo puede venderse por su valor entero, o pagarse a un vecino más débil para que jure lealtad. Un rey o emperador abrumadoramente más fuerte puede, en cambio, obligar bajo amenaza a un vecino independiente más débil a jurarle lealtad. #high También se negocian matrimonios entre casas en silencio, y a nadie se le pregunta antes.#! Se te avisa siempre que un tratado afecte a alguien con quien lindas, con quien estás aliado o contra quien luchas."
 setting_tnt_ai_treaties_common:0 "Frecuentes"
 setting_tnt_ai_treaties_common_desc:0 "Alrededor del triple del ritmo de Ocasionales, para un mapa cuyas cortes hablan sin parar.\n\nLas mismas cláusulas negociables y el mismo límite de tres años por gobernante, de modo que no puede desbocarse.\n\n#weak Es la opción por defecto.#!"
 rule_tnt_ai_offer_rate:0 "Parley: ofertas que te llegan"
 setting_tnt_ai_offer_rate_off:0 "Nunca"
 setting_tnt_ai_offer_rate_off_desc:0 "Ningún gobernante te escribe jamás con un tratado propio.\n\n#weak Sigues pudiendo abrir tú mismo negociaciones con quien quieras, y los gobernantes de la IA siguen tratando entre sí si esa regla lo permite.#!"
 setting_tnt_ai_offer_rate_rare:0 "Raras"
 setting_tnt_ai_offer_rate_rare_desc:0 "Solo de tarde en tarde llega una carta: cuenta con años de silencio entre emisarios.\n\n#weak Para una partida en la que prefieres ser tú quien pide.#!"
 setting_tnt_ai_offer_rate_normal:0 "Normales"
 setting_tnt_ai_offer_rate_normal_desc:0 "Un vecino te escribe como mucho una vez al año, y cada gobernante espera tres años antes de componer otra oferta."
 setting_tnt_ai_offer_rate_frequent:0 "Frecuentes"
 setting_tnt_ai_offer_rate_frequent_desc:0 "Los emisarios llaman varias veces al año, y los gobernantes vuelven a pensar en ti mucho antes.\n\nCada oferta se sigue tasando con la misma balanza que ves en la ventana de negociación, de modo que un mapa más animado no es un mapa más generoso.\n\n#weak Es la opción por defecto.#!"
 setting_tnt_ai_offer_rate_test:0 "Pruebas: muy frecuentes"
 setting_tnt_ai_offer_rate_test_desc:0 "#N Para probar el mod, no para jugar.#! Los periodos de espera se recortan a unas pocas semanas, de modo que una oferta debería llegarte a los pocos meses de empezar.\n\n#weak Úsalo para confirmar que las cartas funcionan y luego devuelve la regla a Frecuentes.#!"
 rule_tnt_ai_telemetry:0 "Parley: registro de diagnóstico"
 setting_tnt_ai_telemetry_off:0 "Desactivado"
 setting_tnt_ai_telemetry_off_desc:0 "Sin registro de diagnóstico, que es lo que quieres para jugar.\n\n#weak Es la opción por defecto y no cuesta nada: una consulta a la regla allí donde se habría escrito una línea.#!"
 setting_tnt_ai_telemetry_on:0 "Activado"
 setting_tnt_ai_telemetry_on_desc:0 "Escribe una línea en #high error.log#! por cada decisión que un gobernante de la IA toma sobre un tratado: a quién consideró, qué puso sobre la mesa, en cuánto tasó el trato y #high por qué se marchó#!.\n\nUnas 600 a 1600 líneas por medio año de juego. La jugabilidad no se ve afectada en modo alguno.\n\n#weak Actívalo antes de una partida larga sin vigilancia y luego envía el registro para que lo lean.#!"
 setting_tnt_ai_telemetry_verbose:0 "Detallado"
 setting_tnt_ai_telemetry_verbose_desc:0 "Como Activado, y además una línea por gobernante de la IA y año, tomada antes de la tirada de dados entre gobernantes de la IA.\n\nMiles de líneas de más. Lo único que compra es distinguir #high el pulso nunca se ejecutó#! de #high se ejecutó y los dados dijeron que no#!.\n\n#weak Solo para una partida corta de comprobación.#!"
 rule_tnt_threat_scale:0 "Parley: las amenazas en la mesa"
 setting_tnt_threat_scale_rare:0 "Raras"
 setting_tnt_threat_scale_rare_desc:0 "Coeficiente N = 2,5. Toda amenaza requiere #high al menos 100 puntos de trato#!. Con el mismo prestigio y temor, hace falta una proporción de ejércitos de 41:1.\n\n#weak Un mayor prestigio y temor reducen la ventaja militar necesaria. Estar un nivel completo de prestigio por debajo del objetivo anula el valor de la amenaza. Las reglas son iguales para el jugador y la IA.#!"
 setting_tnt_threat_scale_normal:0 "Normales"
 setting_tnt_threat_scale_normal_desc:0 "Coeficiente N = 5. Toda amenaza requiere #high al menos 100 puntos de trato#!. Con el mismo prestigio y temor, la proporción mínima de ejércitos es #high 21:1#!.\n\nUn mayor prestigio y temor reducen la ventaja militar necesaria. Estar un nivel completo de prestigio por debajo del objetivo anula el valor de la amenaza.\n\n#weak Ajuste predeterminado. Las reglas son iguales para el jugador y la IA.#!"
 setting_tnt_threat_scale_frequent:0 "Frecuentes"
 setting_tnt_threat_scale_frequent_desc:0 "Coeficiente N = 7,5. Toda amenaza sigue requiriendo #high al menos 100 puntos de trato#!.\n\n#weak Un mayor prestigio y temor reducen la ventaja militar necesaria. Estar un nivel completo de prestigio por debajo del objetivo anula el valor de la amenaza. Las reglas son iguales para el jugador y la IA.#!"
 setting_tnt_threat_scale_constant:0 "Omnipresentes"
 setting_tnt_threat_scale_constant_desc:0 "Coeficiente N = 10. Toda amenaza requiere #high al menos 100 puntos de trato#!. Con el mismo prestigio y temor, la proporción mínima de ejércitos es #high 11:1#!.\n\n#weak Un mayor prestigio y temor reducen la ventaja militar necesaria. Estar un nivel completo de prestigio por debajo del objetivo anula el valor de la amenaza. Las reglas son iguales para el jugador y la IA.#!"
 tnt_mutual_header:0 "Entre los dos"
 tnt_bd_domain_p:0 "Títulos por encima de su límite de dominio: le valen menos"
 tnt_bd_domain_r:0 "Títulos por encima de tu límite de dominio: te valen menos"
 tnt_tt_step_huge_add:0 "Añade una cantidad grande de una vez.\n\n#weak Oro, prestigio y piedad: 1000 por clic. Influencia: 250, porque la influencia misma nunca pasa de 1000.#!"
 tnt_tt_step_huge_sub:0 "Quita una cantidad grande de una vez.\n\n#weak Oro, prestigio y piedad: 1000 por clic. Influencia: 250, porque la influencia misma nunca pasa de 1000.#!"
 tnt_preset_open:0 "…"
 tnt_tt_preset_open:0 "Fija una cantidad de un solo clic.\n\n#weak Una cantidad acostumbrada, la mitad de lo que se tiene, todo lo que se pueda permitir, o nada en absoluto.#!"
 tnt_preset_menu_header:0 "¿Cuánto?"
 tnt_preset_std_gold:0 "Los ingresos de un año"
 tnt_preset_std_gift:0 "Un regalo acostumbrado"
 tnt_preset_half:0 "La mitad"
 tnt_preset_max:0 "Todo lo que pueda"
 tnt_preset_max_r:0 "Todo lo que pueda la otra parte"
 tnt_preset_none:0 "Nada"
 tnt_tt_preset_std_gold:0 "Ofrece los ingresos de un año.\n\n#weak Limitado a lo que hay realmente en el tesoro.#!"
 tnt_tt_preset_std_gift:0 "Ofrece la cantidad acostumbrada para un favor de este tamaño: lo que espera un gobernante de su posición.\n\n#weak Limitado a lo que se tiene realmente. El prestigio, la piedad y la influencia no tienen ingresos anuales, así que no hay «lo de un año» que ofrecer.#!"
 tnt_tt_preset_half:0 "Ofrece la mitad de lo que se tiene."
 tnt_tt_preset_max:0 "Ofrece todo lo que se pueda permitir."
 tnt_tt_preset_none:0 "Retira esta moneda de la mesa."
 tnt_autobalance_btn:0 "Equilibrar"
 tnt_tt_autobalance:0 "Ajusta el oro, el prestigio, la piedad y la influencia que hay sobre la mesa hasta que la oferta sea apenas aceptable para la otra parte.\n\nFunciona en ambos sentidos: endulza una oferta que rechazaría y #high recorta una que aceptaría con demasiada facilidad#!, de modo que nunca pagas de más.\n\n#weak No añade nada más (ni tierra, ni derechos, ni matrimonios, ni favores) y nunca ofrece más de lo que se puede pagar de verdad.#!"
 tnt_ab_state_balanced:0 "#P Equilibrado.#! La oferta queda ahora justo dentro de lo que aceptará."
 tnt_ab_state_minimal:0 "Ya era mínima. No hubo nada que cambiar."
 tnt_ab_state_unreachable:0 "#N Fuera de alcance.#! Sigue rechazándola, incluso con todo lo que puedes pagar."
 tnt_ab_state_closest:0 "Oferta aceptable. El ajuste automático no pudo alcanzar +1 con los recursos disponibles."
 tnt_ab_lumpy_hint:0 "Pulsa de nuevo para seguir añadiendo. Lo que este botón añadió y tú quitaste después no se volverá a ofrecer."
 tnt_ab_lumpy_line:0 "Su bolsa estaba vacía, así que la última pulsación tomó cláusulas de su lado de la mesa: tierra, un derecho o su lealtad."
 tnt_stage_marriage_interaction:0 "Añadir un enlace al tratado"
 tnt_stage_marriage_send:0 "Añadir este enlace al tratado"
 tnt_stage_marriage_prompt:0 "#high Un enlace bastante cercano trae ahora la alianza consigo#! - la misma que el juego concede por su propio matrimonio concertado, el día en que se sella el tratado."
 tnt_stage_no_alliance_tt:0 "#high Un enlace escrito en este tratado crea ahora una alianza.#! Es la regla del propio juego y no la de este mod: el juego mide cuán cerca está cada uno de los dos del gobernante que lo entrega, y si la pareja es lo bastante cercana por ambos lados, tú y él sois aliados en cuanto se sella el tratado, exactamente como siempre lo ha hecho #high $arrange_marriage_interaction$#! del propio juego. Nadie compra [alliances|E] en esta mesa: no existe tal cláusula en la hoja, ni la habrá; la alianza viene sin más con el matrimonio.\n\n#weak Por eso las señales de alianza que el propio juego dibuja en esta ventana pueden creerse de nuevo: la barra de fuerza «Alianza en potencia» junto a cada candidato y los pequeños blasones coronados a su lado. Viven en la lista de candidatos, y la lista se va de la pantalla en cuanto están elegidos ambos retratos, así que cuando lees esto ya no queda nada de eso en la página; pero el veredicto impreso justo encima de este párrafo responde por la pareja que tienes delante, y es la respuesta del propio juego, no un pronóstico.#!\n\n#weak La alianza se apoya en la pareja misma: dura exactamente lo que dure su enlace y se acaba con él, por los propios engranajes del juego. Si alguno de los dos es aún un niño, la pareja queda comprometida en vez de casada, y la alianza se sostiene sobre ese compromiso desde el primer día. Un tratado puede llevar varias parejas, y cada una se juzga por sí misma.#!"
 tnt_stage_alliance_opens_tt:0 "#high Este enlace CREA una alianza entre él y tú.#! No una puerta a la que llamar más tarde, sino la alianza misma, el día en que se sella el tratado, en cuanto estos dos quedan casados o comprometidos. Es la regla del propio juego, exactamente la que sigue su #high $arrange_marriage_interaction$#!: el juego mide cuán cerca está cada uno de los dos del gobernante que lo entrega, y esta pareja es lo bastante cercana por ambos lados. No se te pide nada más, y él no puede negarse: viene con el tratado.\n\n#high Vale [SCOPE.ScriptValue('tnt_stage_alliance_offer_value')|+=0] puntos de tratado, y ya están DENTRO de la cifra impresa arriba para este enlace. No los sumes una segunda vez.#! Un tratado paga la alianza una sola vez: si ya la abre una pareja puesta en la mesa, esta no añade nada al precio y pasa a ser una segunda razón sobre la que se sostiene el pacto."
 tnt_stage_alliance_shut_tt:0 "#high Este enlace NO crea una alianza.#! El juego mide cuán cerca está cada uno de los dos del gobernante que lo entrega, suma ambas distancias y concede la alianza solo mientras esa suma se mantenga pequeña. Un matrimonio entre dos cortesanos no emparenta a nadie en esta mesa, así que esa pareja no alía a nadie; un desconocido sacado de tu propia sala no es mejor. Casa tu propia sangre con la suya —un hijo, un nieto, un hermano o una hermana, un padre o una madre— o ponte tú mismo ante el altar, y la suma cae dentro del límite del juego. Es la misma regla que gobierna #high $arrange_marriage_interaction$#! del propio juego, y se mide en ambos lados a la vez: una elección cercana por tu parte no compensa una lejana por la suya."
 tnt_stage_alliance_already_tt:0 "#high Ya eres su aliado, así que este enlace no abre ningún pacto nuevo.#! Un pacto que ya tienes no se sella una segunda vez: la alianza no añade puntos de tratado por encima de este enlace, y el tratado no te cobra nada por ella. Si la pareja es de sangre lo bastante cercana como para satisfacer la regla del propio juego, la boda quedará anotada sin más como una razón más sobre la que se sostiene la alianza que ya tienes; si no lo es, la alianza quedará exactamente como estaba. En cualquier caso el enlace en sí sigue valiendo los puntos impresos arriba, y el pacto entre él y tú queda intacto."
 actor_secondary_tnt_stage_marriage_interaction:0 "Tu candidato"
 recipient_secondary_tnt_stage_marriage_interaction:0 "Su candidato"
 tnt_stage_pair_points_line:0 "Este enlace mueve el tratado [SCOPE.ScriptValue('tnt_stage_pair_deal_delta_value')|+=0]: exactamente lo que se desplaza la balanza de la ventana de negociación cuando lo pones sobre la mesa.\n#weak Se le ofrece [SCOPE.ScriptValue('tnt_stage_pair_gain_value')|0], se le pide [SCOPE.ScriptValue('tnt_stage_pair_loss_value')|0], y la alianza que este enlace crea: [SCOPE.ScriptValue('tnt_stage_alliance_offer_value')|+=0]. Esas tres cifras SON la de arriba: la alianza va dentro, nunca encima. Valora lo que ofreces a x[SCOPE.ScriptValue('tnt_deal_mult_value')|2], y una gran boda, si la prometes, vale [SCOPE.ScriptValue('tnt_stage_grand_offer_value')|+=0] de esa oferta.#!\n#weak La línea PROPIA de esta pareja en el tratado lleva otra cifra: [SCOPE.ScriptValue('tnt_stage_pair_raw_net_value')|+=0], el enlace por sí solo, antes de su estima y antes de la alianza. Ambas son ciertas; la balanza muestra la primera.#!\n#weak A partir del segundo enlace del mismo tratado la primera cifra es una ESTIMACIÓN y no el desplazamiento exacto: el descuento por volumen se aplica a todo el montón de bodas, y la gran boda y el pavor entre vosotros dos se pagan UNA SOLA VEZ POR TRATADO pero se vuelven a contar en la línea de cada enlace. Puede desviarse decenas de puntos, por arriba o por abajo. En el primer enlace es exacta.#!"
 tnt_stage_grand_info:0 "$GRAND_WEDDING_PROMISE_INFO$\n\n#high Vale [SCOPE.ScriptValue('tnt_stage_grand_offer_value')|+=0] puntos de tratado#! por esta pareja, además del enlace mismo.\n\n#weak Siguen PROMETIDOS hasta que celebres realmente el banquete. #high La alianza no espera al banquete#!: se sostiene sobre el compromiso mismo, desde el día en que se sella el tratado, y dura exactamente lo que dure ese compromiso. El aviso corriente del juego para una pareja prometida que ya puede casarse calla a propósito con una pareja a la que se ha prometido una gran boda: en su lugar se encarga de ella el aviso «Organizar una gran boda», que llega a quien hizo la promesa.#!"
 tnt_stage_marriage_desc:0 "Estás eligiendo un enlace para el tratado que hay sobre la mesa. #high No estás enviando una propuesta de matrimonio.#!\n\nEl botón ancho de abajo lleva la etiqueta #high «Enviar propuesta»#! que le pone el propio juego, y esa palabra no puede cambiarse aquí. No envía nada y no casa a nadie: escribe esta pareja en el tratado que estás negociando, junto al oro y a la tierra, y las cláusulas del tratado se vuelven a tasar con el enlace dentro.\n\n#high Nadie se casa y nadie queda comprometido hasta que la otra parte acepte el tratado entero.#! Si el tratado se rechaza o se abandona, el enlace sencillamente nunca ocurrió.\n\n#weak Elige a una persona de cada casa, fija la línea de descendencia y confirma. Vuelve cuantas veces quieras: un tratado puede llevar cualquier número de parejas.#!\n\n#weak El juego muestra en esta ventana sus propias indicaciones sobre alianzas: #high puedes creerlas de nuevo#!. Un enlace escrito en un tratado lleva ahora la misma alianza que lleva #high $arrange_marriage_interaction$#! del propio juego, y por la regla del juego mismo: mide cuán cerca está cada uno de los dos del gobernante que lo entrega, y si la pareja es lo bastante cercana por ambos lados, tú y él sois aliados en cuanto se sella el tratado.#!\n\n#weak El veredicto sobre la pareja que has elegido de verdad está impreso más arriba, y es la respuesta del propio juego, no una conjetura: una sola y misma prueba decide esa línea y la alianza. Un matrimonio entre dos cortesanos sigue sin aliar a nadie. La alianza se apoya en la pareja: dura lo que dure su enlace; y si alguno de los dos es aún un niño, se sostiene sobre el compromiso desde el primer día.#!"
 tnt_btn_stage_marriage:0 "Elegir un enlace en la pantalla clásica"
 tnt_btn_stage_marriage_full:0 "$tnt_item_marriage_desc$\n\n$tnt_btn_stage_marriage_tip$"
 tnt_btn_stage_marriage_tip:0 "Abre la propia pantalla de matrimonio del juego: las dos casas una junto a otra, todos los filtros y la búsqueda, los dos retratos y la línea de descendencia.\n\n#high No casa a nadie.#! La pareja que confirmes allí queda anotada en este tratado, y la boda (o el compromiso, si alguno de los dos es un niño) solo ocurre cuando se acuerda el tratado entero.\n\n#weak Atención a las palabras del propio juego: el botón ancho de esa ventana dice «Enviar propuesta». No envía ninguna propuesta a nadie: añade la pareja aquí. Esas mismas dos personas también pueden elegirse a mano en las listas de abajo, que es el único sitio donde puede cambiarse la línea de una pareja ya incluida en el tratado.#!"
 tnt_marriage_stage_note:0 "#weak No se envía nada y nadie se casa: la pareja queda anotada en este tratado.#!"
 tnt_err_grand_host:0 "Ahora no puedes prometer una gran boda: hace falta un gobernante con tierras de rango superior al de barón, #high Tours & Tournaments#! con sus actividades avanzadas, oro bastante para acogerla y ninguna promesa tuya pendiente.\n\n#weak Y es justo eso, una promesa: la pareja honrada queda comprometida, tú te conviertes en el anfitrión prometido, y concertar el festejo y pagarlo sigue siendo cosa tuya. Si dejas vencer la promesa, no se olvidará la palabra rota.#!"
 tnt_err_grand_taken:0 "En este tratado ya hay una gran boda prometida. Desmárcala antes en el panel de matrimonios del propio tratado: un tratado, un festejo, una pareja honrada."
 tnt_intro_title:0 "El arte del tratado"
 tnt_intro_desc_main:0 "De tu cancillería ha salido la noticia: esta corte negocia ahora a la manera nueva. Se puede llamar a la mesa a cualquier gobernante (el oro pesado contra la lealtad, una novia contra una tregua, un favor contra una corona) y toda cláusula se pone en una misma balanza, la misma para ambas partes.\n\n"
 tnt_intro_desc_rate_normal:0 "Cuenta con embajadas de vez en cuando: no te llegará más de una carta al año de todo el mundo junto, y un gobernante del que ya hayas sabido rumiará unos tres años antes de volver a escribir."
 tnt_intro_desc_rate_frequent:0 "Cuenta con el camino a tus puertas muy transitado: apenas pasará medio año entre una embajada y la siguiente, y los gobernantes vuelven a pensar en ti dentro del mismo año."
 tnt_intro_desc_rate_rare:0 "Cuenta con largos silencios: pasarán años entre carta y carta, y pedir será casi siempre cosa tuya."
 tnt_intro_desc_rate_off:0 "No llegará ninguna carta: tus puertas están cerradas a las embajadas, y todo trato empezará por ti."
 tnt_intro_desc_rate_test:0 "A los correos se les ha dicho que corran, no que cabalguen: una oferta debería encontrarte en unos pocos meses. Un ritmo de pruebas, no de corte."
 tnt_intro_desc_world_rare:0 " Más allá de tus fronteras la misma balanza sirve en silencio: de vez en cuando dos cortes cierran un trato propio, y la noticia te llega cuando te atañe."
 tnt_intro_desc_world_common:0 " Más allá de tus fronteras la misma balanza se mueve sin descanso: las cortes extranjeras cierran tratos propios todo el año."
 tnt_intro_desc_world_off:0 " Más allá de tus fronteras se mantienen las viejas costumbres: la manera nueva solo se practica en las mesas donde te sientas tú."
 tnt_intro_desc_close:0 "\n\nPara llamar tú mismo a un gobernante a la mesa, haz clic derecho sobre él y elige #high «Negociar un tratado»#!."
 tnt_intro_opt_ok:0 "A la mesa, pues."

