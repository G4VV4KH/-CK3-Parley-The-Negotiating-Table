 tnt_open_negotiations:0 "Negociar un tratado"
 tnt_open_negotiations_desc:0 "Envía un emisario a [recipient.GetShortUIName] y pon sobre la mesa un tratado completo: todas las cláusulas y ambas partes a la vez."
 tnt_open_negotiations_extra_icon:0 "@dread_icon! Puedes presionarlo: ejército, nombre y temor alcanzan juntos el peso que exige una amenaza, y ha olvidado tu última amenaza"
 tnt_window_title:0 "Negociaciones diplomáticas"
 tnt_col_actor:0 "Tú ofreces"
 tnt_col_partner:0 "La otra parte ofrece"
 tnt_balance_header:0 "Su respuesta"
 tnt_balance_accept:0 "#P Se inclina a aceptar#!"
 tnt_balance_reject:0 "#N Se inclina a rechazar#!"
 tnt_scale_note:0 "El número es su respuesta: por encima de cero, firma. Cada cláusula se tasa por lo que valdría si la negociaras por separado, y su opinión sobre ti, la fe, el parentesco y todo lo que quiera de más ya están contados. La barra es esa misma respuesta desplegada: todo lo que la inclina hacia el sí contra todo lo que la inclina hacia el no, de modo que en cuanto la barra pase del centro aceptará."
 tnt_label_points:0 "pts"
 tnt_label_years:0 "#weak Dura 10 años#!"
 tnt_picker_empty:0 "#weak No hay nada disponible#!"
 tnt_picker_empty_artifact:0 "#weak Nada de lo que posee esta parte puede cambiar de manos: las joyas de la corona siguen a su título, los estandartes dinásticos se quedan con la dinastía y las reliquias de la propia fe solo pasan a correligionarios.#!"
 tnt_item_gold:0 "Oro"
 tnt_item_gold_desc:0 "Un único pago de [gold_i] del tesoro, entregado en el momento en que se sella el tratado."
 tnt_item_prestige:0 "Prestigio"
 tnt_item_prestige_desc:0 "[prestige_i] [prestige|E] prometido al otro lado de la mesa.\n\n#weak Esto no es un cofre que cambia de manos: quien da pierde la cantidad y quien recibe la gana en dos actos distintos, y nada mantiene unidos a los dos. Por eso la oferta no puede enviarse siquiera si quien da no tiene la cantidad entera en el momento de pulsar Proponer.#!"
 tnt_item_piety:0 "Piedad"
 tnt_item_piety_desc:0 "[piety_i] [piety|E] prometida al otro lado de la mesa.\n\n#weak De nuevo dos actos distintos, no una transferencia: lo que una parte pierde, la otra lo gana. La oferta no puede enviarse si quien da no tiene la cantidad entera en el momento de pulsar Proponer.#!"
 tnt_item_influence:0 "Influencia"
 tnt_item_influence_desc:0 "[influence_i] [influence|E] prometida al otro lado de la mesa.\n\n#weak La [influence|E] solo existe bajo una forma de gobierno que funcione con ella, así que estas filas aparecen únicamente cuando ambas formas de gobierno funcionan con ella: entregársela a un gobernante que no tenga esa reserva no serviría de nada. También aquí son dos actos distintos, y la oferta no puede enviarse si quien da no tiene la cantidad entera en el momento de pulsar Proponer.#!"
 tnt_item_alliance:0 "Alianza militar"
 tnt_err_ab_already_fair:0 "El tratado ya está exactamente en #high +1#!: no queda nada que equilibrar"
 tnt_err_ab_empty:0 "Todavía no hay nada sobre la mesa que equilibrar"
 tnt_threat_opinion:0 "Me amenazó"
 tnt_treaty_favor_opinion:0 "Tratado favorable"
 tnt_item_usehook_r:0 "Reclama tu deuda"
 tnt_item_usehook_r_desc:0 "Tiene un [hook|E] sobre ti y piensa usarlo, así que espera que el tratado lo tenga en cuenta.\n\n#weak Esto no puedes desactivarlo: la palanca es suya, no tuya. Le hace PEDIR MÁS de lo que sería un precio justo: #high -45#! por un favor que puede reclamar, #high -120#! si la palanca es de las que valen para el chantaje. Firma y la deuda queda gastada: un anzuelo débil desaparece, uno fuerte permanece.#!\n\n#weak Negarse no cuesta nada salvo el tratado.#!"
 tnt_usehook_r_sub:0 "[Select_CString( GreaterThanOrEqualTo_CFixedPoint( GetPlayer.MakeScope.ScriptValue('tnt_usehook_r_strength_value'), '(CFixedPoint)2' ), Localize('tnt_usehook_strong'), Localize('tnt_usehook_weak') )]"
 tnt_bd_usehook_r:0 "Una deuda reclamada contra ti"
 tnt_item_usehook:0 "Reclamar un anzuelo"
 tnt_item_usehook_desc:0 "Gasta la palanca que ya tienes sobre la otra parte. Es la dirección contraria de #high Conceder un anzuelo#!: aquella le entrega un favor sobre ti; esta cobra el favor que te debe.\n\nFunciona con un gobernante que jamás te apreciará, así que su peso no depende de su estima, a diferencia de todo lo que puedas darle.\n\n#weak Un [hook|E] que reclamas vale #high +45#!; una palanca de las que valen para el chantaje vale #high +120#!. Es el propio juego quien decide qué sobrevive a su uso: uno débil se consume al firmarse el tratado, uno fuerte no. Solo se gasta si el tratado llega a acordarse: un favor reclamado por un tratado que nunca ocurrió sería un favor tirado.#!\n\n#weak Cobrar una deuda pesa sobre ti exactamente igual que una amenaza. Tu propia naturaleza juzga el acto: hay conciencias que cargan con ello como #high estrés#! propio, mientras que a un gobernante más frío le alivia haber gastado por fin su ventaja, y la confirmación nombra los rasgos que han respondido antes de que el emisario parta.#!"
 tnt_usehook_sub:0 "[Select_CString( GreaterThanOrEqualTo_CFixedPoint( GetPlayer.MakeScope.ScriptValue('tnt_usehook_strength_value'), '(CFixedPoint)2' ), Localize('tnt_usehook_strong'), Select_CString( GreaterThanOrEqualTo_CFixedPoint( GetPlayer.MakeScope.ScriptValue('tnt_usehook_strength_value'), '(CFixedPoint)1' ), Localize('tnt_usehook_weak'), Localize('tnt_usehook_none') ) )]"
 tnt_usehook_strong:0 "Anzuelo fuerte: sobrevive a su uso"
 tnt_usehook_weak:0 "Anzuelo débil: reclamarlo lo consume"
 tnt_usehook_none:0 "No tienes ningún anzuelo sobre la otra parte"
 tnt_bd_usehook_p:0 "Un anzuelo reclamado"
 tnt_err_usehook_none:0 "No tienes ningún anzuelo sobre la otra parte que gastar"
 tnt_item_threat:0 "Amenazar"
 tnt_item_threat_desc:0 "Deja que la otra parte entienda lo que le costaría negarse. Esto no es una declaración: nada se jura y ningún ejército marcha. Es peso sobre la mesa, y funciona con un gobernante que jamás te apreciará, que es justo lo que el oro no consigue.\n\nSu peso es #high cuánto supera tu ejército al suyo#!, elevado o rebajado por #high cuánto supera tu nombre al suyo#! y por #high cuánto más temible eres tú que él#!. Estar un peldaño entero por debajo de él en fama cierra la amenaza del todo, por grande que sea tu ejército; y el peso que abre la amenaza es exactamente el que ella añade luego al tratado, a tu favor.\n\n#weak No lo olvidará. Un tratado firmado bajo amenaza te cuesta $tnt_threat_opinion$, #high -100#! de opinión que se disipa a lo largo de quince años; y como su estima es lo que da valor a tus regalos, tomar hoy por miedo significa que tu oro comprará menos durante una generación. Pero no paga solo tu oro: tu propia naturaleza juzga el acto. Hay conciencias que cargan con ello como #high estrés#! propio, mientras que a un gobernante más frío le alivia haber gastado por fin su ventaja. La confirmación nombra los rasgos que han respondido, y la cifra exacta, antes de que el emisario parta.#!"
 tnt_threat_sub:0 "Ejército [GetPlayer.MakeScope.ScriptValue('tnt_threat_ratio_value')|1] a 1, nombre ×[GetPlayer.MakeScope.ScriptValue('tnt_threat_rep_term_value')|0], temor ×[GetPlayer.MakeScope.ScriptValue('tnt_threat_dread_term_value')|2]"
 tnt_bd_threat_p:0 "Presión desnuda"
 tnt_bd_threat_panel:0 "Presión"
 tnt_err_threat_weak:0 "Una amenaza requiere al menos 100 puntos de trato por fuerza militar, prestigio y temor. Este mínimo es igual para el jugador y la IA."
 tnt_err_threat_relation:0 "Solo puedes amenazar a un gobernante independiente que no sea tu aliado ni esté vinculado contigo por un rehén"
 tnt_err_threat_unknown:0 "Tu nombre debe pesar algo: tu nivel de fama ha de estar por encima de cero"
 # tnt_err_threat_unafraid RETIRED round 8 (I2). This tombstone holds the line count so no .yml citation moves. ORPHANED 2026-08-24 BY THE RATIO RULING, KEPT DEFINED IN ALL NINE: tnt_err_threat_unknown above and tnt_err_threat_nofear below have ZERO rows - their rules are inside tnt_threat_points_value now. Law 9 and the law-10d control. DO NOT DELETE, DO NOT RE-USE FOR ANOTHER MEANING.
 tnt_err_threat_nofear:0 "No te teme: tu temor debe llegar a 75, o a 40 frente a quien no sea audaz, o a 20 frente a quien esté bajo tu autoridad"
 tnt_err_threat_recent:0 "Todavía recuerda tu última amenaza. Deja que el recuerdo se apague antes de volver a presionar"
 tnt_item_alliance_desc:0 "Una alianza formal, jurada por los dos a la vez: no es algo que una parte entregue a la otra. Cualquiera de las dos podrá luego llamar a la otra a la guerra, y rechazar esa llamada cuesta [prestige|E].\n\n#weak Una sola fila para un solo pacto: o está en el tratado o no lo está.#!\n\n#weak Jurada con tu propio [liege|E] o con tu propio [vassal|E], es un pacto permanente y no una llamada a las armas: el juego no permite que un señor y su vasallo se convoquen mutuamente, pero la alianza es real, cuenta allí donde cuentan las alianzas y sobrevive al día en que uno de los dos salga del señorío del otro.#!\n\n#weak $tnt_tt_alliance_glut$#!"
 tnt_tt_alliance_glut:0 "Cada alianza que ya tienes abarata la siguiente. A partir de tu segundo aliado, sin contar a tu propio señor ni a tus propios vasallos, cada alianza existente reduce a la mitad lo que un pacto nuevo vale para la otra parte, y sus propios aliados le hacen a ella lo mismo."
 tnt_item_truce:0 "Pacto de no agresión"
 tnt_item_truce_desc:0 "Un pacto en el que entráis los dos a la vez: ninguna de las partes podrá declarar la guerra a la otra durante #high diez años#!.\n\n#weak Una sola fila para un solo pacto: o está en el tratado o no lo está.#!"
 tnt_item_marriage:0 "Pacto matrimonial"
 tnt_item_marriage_desc:0 "Un enlace entre las dos casas, y #high tantas parejas en un mismo tratado como quieras#!. Elige a una persona de cada lado, fija la línea que seguirán los hijos y añade la pareja; si alguno de los dos es aún un niño, la pareja queda comprometida en vez de casada.\n\n#weak Cada pareja posterior a la primera vale para la otra parte algo menos que la anterior, mientras que lo que un enlace le cuesta no mengua nunca: unos pocos buenos enlaces valen más que una docena de relleno. A la casa a la que se pide casar por debajo de su rango se le cobra el descenso, y cuanto mayor es la diferencia, más caro sale. A una de las parejas se le puede prometer además una gran boda.#!\n\n#high Un enlace bastante cercano trae ahora una alianza consigo#!, exactamente como lo hace el matrimonio concertado del propio juego, y el precio del tratado carga con esa alianza: un enlace que os alía vale más que uno que no lo hace. #weak Las indicaciones «Alianza en potencia» que la pantalla de matrimonios muestra junto a los candidatos pueden creerse de nuevo.#!"
 tnt_item_title:0 "Ceder título"
 tnt_item_title_desc:0 "Entrega un título en posesión de rango de condado o superior, con todo lo que hay bajo él.\n\n#weak Tantos a la vez como quieras. Ni la capital ni el título principal están nunca sobre la mesa. La tierra que exceda lo que su dominio admite sigue siendo tierra: la tomará, pagará por ella su valor entero y ya se las verá con sus propios administradores por la carga.#!"
 tnt_item_claim:0 "Conceder derecho"
 tnt_item_claim_desc:0 "Concede un [claim|E] sin reclamar sobre un título que el propio otorgante posee: una invitación abierta a una guerra futura y una concesión gravísima.\n\n#weak Tantos a la vez como quieras.#!"
 tnt_item_prisoner_multi:0 "Liberar a prisioneros escogidos"
 tnt_item_prisoner_multi_desc:0 "Abre tu mazmorra para los prisioneros que nombres, y para ningún otro.\n\n#weak Lo que vale un prisionero es su rango y su sangre: #high 10#! por cualquiera, #high +15#! si es pariente de la otra parte, #high +10#! si posee algún título y #high +15 / +25 / +40 / +60#! según ese título alcance condado, ducado, reino o imperio. Un rey preso vale, por tanto, más que una docena de don nadies, y de eso trata escoger.#!\n\n#weak Nombrar aquí a cualquiera anula #high Liberar prisioneros#!: de lo contrario, ambas cláusulas pagarían dos veces por los mismos hombres.#!"
 tnt_multi_count_prisoner_p:0 "Prisioneros nombrados: [GetPlayer.MakeScope.ScriptValue('tnt_count_sel_prisoner_p_value')|0]"
 tnt_sel_count_prisoner_p:0 "Nombrados: [GetPlayer.MakeScope.ScriptValue('tnt_count_sel_prisoner_p_value')|0]"
 tnt_picker_title_prisoner:0 "Elige a los prisioneros que liberarás"
 tnt_item_prisoners:0 "Liberar prisioneros"
 tnt_item_prisoners_desc:0 "La parte que libera abre sus mazmorras a todo prisionero ligado a la otra parte por sangre o por lealtad."
 tnt_item_hook:0 "Favor debido"
 tnt_item_hook_desc:0 "Quedar a deber a la otra parte un favor [hook_i]. Tres intensidades: un favor #high débil#! dura diez años y se gasta la primera vez que se usa; uno #high fuerte#! dura veinte años, puede usarse una y otra vez y descansa cinco años entre usos; uno #high eterno#! no caduca nunca ni se gasta nunca, y descansa esos mismos cinco años entre usos.\n\n#weak Clic para subir la intensidad, clic derecho para bajarla. No se puede prometer un favor si la parte que lo recibiría ya tiene uno sobre la parte que lo daría.#!"
 tnt_item_artifact:0 "Artefacto"
 tnt_item_artifact_desc:0 "Entrega un artefacto [artifact_i] del tesoro del propio otorgante.\n\n#weak Tantos a la vez como quieras. No se enumeran las piezas que el propio juego retiene en casa: las joyas de la corona atadas a un título, los estandartes dinásticos y las reliquias de la fe del otorgante ofrecidas a otra fe.#!"
 tnt_item_nonwar:0 "Prometer no atacar"
 tnt_item_nonwar_desc:0 "Jura una [truce|E] unilateral con un tercer gobernante durante #high diez años#!; romper una tregua acarrea una penalización severa.\n\nA quién se puede nombrar: gobernantes cuyo señorío linde con el de quien promete y titulares de títulos sobre los que quien promete tiene un derecho; nunca a los dos negociadores, ni a los aliados de quien promete, ni a nadie que ya esté bajo su tregua.\n\n#weak La otra parte no debe nada a cambio: quien jura simplemente detiene su mano.#!"
 tnt_item_vassal:0 "Jurar lealtad"
 tnt_item_vassal_desc:0 "Un gobernante hinca la rodilla y se convierte en [vassal|E] del otro, con señorío y todo. La cláusula más grave que puede sostener esta mesa, y la única que trae consigo un pacto escrito que puedes editar."
 tnt_item_indep:0 "Conceder independencia"
 tnt_item_indep_desc:0 "Un vasallo queda liberado de su juramento de lealtad y pasa a ser un gobernante independiente. En tu lado de la mesa quien queda libre es tu propio vasallo; en el suyo, quien queda libre eres tú. Un tratado no puede llevar esto y un juramento de lealtad a la vez.\n\n#weak Solo puede ofrecerse cuando ya sois señor y vasallo directo, quien quedaría libre posee tierras propias, ninguno de los dos señoríos está en guerra y sus tierras no forman parte de la herencia de iure de su señor.#!"
 tnt_item_hostage:0 "Cautivo"
 tnt_item_hostage_desc:0 "Un pariente cercano de quien entrega (un hijo, un nieto, un hermano, una hermana, un sobrino o una sobrina) viaja a la otra corte y vive allí como cautivo, en garantía de este tratado. Es un huésped bajo las propias reglas del juego sobre cautivos, no un prisionero.\n\n#weak Solo pueden entregarse parientes sin tierras, sin cónyuge y sin compromiso que ya estén en su propia corte, y jamás su propio regente.#!"
 tnt_item_ward:0 "Pupilo"
 tnt_item_ward_desc:0 "Un niño de la corte de quien entrega es enviado para que lo críe el otro gobernante, que pasa a ser su tutor en persona: no hay un tercero a quien elegir.\n\n#weak Solo pueden ofrecerse niños de su propia corte en condiciones de viajar, y un tutor no puede tomar un tercer pupilo.#!"
 tnt_item_courtier:0 "Cortesanos"
 tnt_item_courtier_desc:0 "Los cortesanos cambian de casa, y cada uno se lleva consigo a su consorte y a los hijos pequeños que tenga.\n\n#weak Solo pueden entregarse miembros adultos y sin tierras de la corte de quien entrega que no ocupen puesto alguno en ella: ni su heredero, ni su consorte, ni su regente, ni sus consejeros, ni sus caballeros, ni sus oficiales de corte; y nunca alguien a quien quien recibe cuente entre sus rivales.#!"
 tnt_item_subject_desc:0 "Los vasallos elegidos cambian de señor y pasan al señorío del otro gobernante, llevándose todos los títulos que poseen y a todos sus propios vasallos.\n\n#weak Su pacto de vasallaje se redacta de nuevo con las condiciones ordinarias del señorío que los recibe, de modo que las obligaciones especiales se pierden. La entrega no trae tregua alguna, y nada en el juego devuelve a un vasallo al otro lado de una frontera salvo la guerra. Solo pueden entregarse vasallos directos que posean al menos un condado, de rango inferior al gobernante que los recibe y en paz con todos los implicados; nunca un regente ni un heredero, y un vasallo que ya haya sido movido por un tratado no puede moverse de nuevo en tres años.#!"
 tnt_item_subject:0 "Transferir un vasallo"
