 tnt_err_truce_dead:0 "Uno de vosotros ya no está entre los vivos."
 tnt_err_hostage_p_unavailable:0 "No tienes a nadie a quien enviar como cautivo, o la otra parte no aceptará esa garantía."
 tnt_err_hostage_r_unavailable:0 "La otra parte no tiene a quien enviar como cautivo, o tú no puedes servirle de garantía."
 tnt_err_ward_p_unavailable:0 "No tienes ningún niño que enviar a su custodia, o su corte no puede criar a ninguno."
 tnt_err_ward_r_unavailable:0 "La otra parte no tiene ningún niño que enviar a tu custodia, o tu corte no puede criar a ninguno."
 tnt_err_courtier_p_unavailable:0 "En tu corte no hay nadie que pueda entregarse: los que no quieren, los que están juramentados y los encarcelados se quedan todos."
 tnt_err_courtier_r_unavailable:0 "En su corte no hay nadie que pueda entregarse a ti."
 tnt_err_subject_and_vassal:0 "Un tratado que lleva el vasallaje de todo un señorío no necesita además un vasallo arrancado de él. Retira el juramento de la mesa, o retira al vasallo."
 tnt_err_subject_r_unavailable:0 "Ahora mismo no puede entregarse a ninguno de sus vasallos: tú debes poseer tierras propias y estar dispuesto a tomar más súbditos, y ambos debéis estar en paz."
 tnt_err_subject_p_unavailable:0 "Ahora mismo no puede entregarse a ninguno de tus vasallos, y puede que el problema esté en su lado de la mesa y no en el tuyo: el gobernante que los recibiría debe poseer tierras propias y estar dispuesto a tomar más súbditos, y ambos debéis estar en paz."
 tnt_err_indep_p_unavailable:0 "La liberación no es posible ahora mismo: la otra parte ha de ser tu vasalla, ambos en paz (y ninguno de tus vasallos en guerra con ella), sus tierras han de quedar fuera de tus propios títulos de iure y no ha de ser tu diarca."
 tnt_err_indep_r_unavailable:0 "La liberación no es posible ahora mismo: has de ser su vasallo, ambos en paz (y ninguno de sus vasallos en guerra contigo), tus tierras han de quedar fuera de sus títulos de iure y no has de ser su diarca."
 tnt_err_people_pair:0 "Este tratado se contradice: no puede liberar a un vasallo y tomar otro de un mismo aliento."
 tnt_ai_offer_title:0 "Una embajada de [tnt_deal_partner.GetTitledFirstName]"
 tnt_ai_offer_desc_a1:0 "Un heraldo de [tnt_deal_partner.GetTitledFirstName] es conducido a tu presencia con el polvo del camino aún en la capa, y va al grano con la brusquedad de quien ha cabalgado sin descanso.\n\nSu señor no quiere pleito contigo. Pide un pacto jurado: durante #high diez años#! ninguno de los dos desenvainará contra el otro, y ha traído monedas para atar la promesa, porque una palabra no cuesta nada y él lo sabe."
 tnt_ai_offer_desc_a2:0 "[tnt_deal_partner.GetTitledFirstName] no envía a un escribano, sino a un pariente, y eso ya es la mitad del mensaje.\n\nLo que propone es una alianza militar jurada: tus estandartes y los suyos alzados juntos, y cada cual libre de llamar al otro cuando llegue la guerra, como ambos sabéis que llegará."
 tnt_ai_offer_desc_a3:0 "El emisario de [tnt_deal_partner.GetTitledFirstName] habla quedo y no pide nada que pueda pesarse en una balanza.\n\nSu señor prefiere tu palabra: un favor debido, que reclamará cuando a él le convenga. Las deudas de esa clase se cobran siempre en el peor momento posible, que es justo lo que las hace valiosas."
 tnt_ai_offer_desc_a9:0 "[tnt_deal_partner.GetTitledFirstName] no envía regalo ni halago, solo un recordatorio.\n\nHay un favor debido, y el emisario ha venido a verlo cumplido. Lo que pone sobre la mesa no es una petición, sino una cuenta: la deuda se nombra en voz alta, y las cláusulas de abajo son lo que la saldará."
 tnt_ai_offer_desc_a5:0 "El emisario de [tnt_deal_partner.GetTitledFirstName] no se sienta ni finge que esto sea alta política.\n\nHay hombres y mujeres de su casa y de su lealtad pudriéndose en tus mazmorras. Su señor los quiere en casa, y ha traído bastante para que la pérdida del carcelero te compense."
 tnt_ai_offer_desc_a6:0 "Esta embajada llega con heraldos, cuernos y un séquito de testigos: [tnt_deal_partner.GetTitledFirstName] quiere que el mundo entero vea lo que aquí se firme.\n\nLa sustancia es un pacto mutuo de #high diez años#!, y para sellarlo en público su señor te cederá una parte de su propio [prestige|E] ante las cortes reunidas. Una paz comprada tan a voces es difícil de repudiar para cualquiera de las dos partes."
 tnt_ai_offer_desc_a8:0 "[tnt_deal_partner.GetTitledFirstName] escribe de fronteras y de monedas. Hay tierra tuya, nombrada en las cláusulas de abajo, que encajaría con más naturalidad bajo su estandarte, y prefiere comprarla honradamente antes que codiciarla en silencio. El precio está expuesto por entero; el sello aguarda tu respuesta."
 tnt_ai_offer_desc_a10:0 "[tnt_deal_partner.GetTitledFirstName] ofrece tierra. Una posesión suya, nombrada abajo, le pesa más de lo que le rinde, y prefiere verla en tus manos y sus arcas más llenas. El precio que se te pide figura entre las cláusulas."
 tnt_ai_offer_desc_a11:0 "[tnt_deal_partner.GetTitledFirstName] no ofrece tierra, sino un camino legal hacia ella: un derecho sobre uno de sus propios títulos, escrito y sellado, tuyo para reclamarlo cuando lo estimes oportuno. La tinta de los letrados es más barata que la sangre de los soldados, aunque no gratis, como atestiguan las cláusulas de abajo."
 tnt_ai_offer_desc_a13:0 "Un emisario de [tnt_deal_partner.GetTitledFirstName] descubre un tesoro traído para tus ojos: una pieza de su propio salón, nombrada en las cláusulas de abajo. Se ofrece por moneda honrada; tales cosas encuentran nuevo dueño con más gracia sobre una mesa que sobre un campo de batalla."
 tnt_ai_offer_desc_a14:0 "[tnt_deal_partner.GetTitledFirstName] escribe palabras que pocos gobernantes confían jamás al pergamino: está dispuesta a hincar la rodilla. Su señorío pasaría bajo tu protección y sus estandartes bajo los tuyos, a cambio de una contrapartida expuesta en las cláusulas de abajo. Sopésalo bien: una lealtad jurada no se desjura a la ligera."
 tnt_ai_offer_desc_a15:0 "[tnt_deal_partner.GetTitledFirstName] pide un lugar junto a tu hogar, no para sí, sino para su hijo, nombrado abajo, a fin de que se críe en tu corte. Un pupilo así es a la vez un honor y un lazo entre casas; lo que acompaña al niño se expone en las cláusulas."
 tnt_ai_offer_desc_a16:0 "Mi emisario lleva una propuesta más valiosa que el oro: que nuestras casas se unan. Ofrezco a alguien de mi propia sangre para desposar a alguien de la tuya, de modo que nuestras dos líneas compartan un mismo futuro. El enlace se nombra abajo; sopésalo como sopesarías cualquier trato mío."
 tnt_ai_offer_desc_a17:0 "[tnt_deal_partner.GetTitledFirstName] escribe como un vasallo que ha sopesado su juramento y lo ha hallado pesado.\n\nPide que lo liberes de tu lealtad, con sus estandartes suyos de nuevo y su salón sin dar cuentas a nadie, y no lo pide por nada: lo que deja a cambio figura entre las cláusulas de abajo. Un juramento devuelto no es un juramento roto; tampoco se devuelve a la ligera."
 tnt_ai_offer_desc_a18:0 "La embajada de [tnt_deal_partner.GetTitledFirstName] no llega con las manos vacías, y lo que trae no es oro.\n\nUn hijo de su propia sangre, nombrado abajo, se ofrece a tu custodia como cautivo: garantía de que su palabra se sostendrá mientras el niño esté bajo tu techo. Lo que pide a cambio de prenda tan querida está escrito en las cláusulas."
 tnt_ai_offer_desc_a19:0 "[tnt_deal_partner.GetTitledFirstName] ha oído hablar de un hombre de tu corte y lo quiere.\n\nEstá nombrado abajo. Pide que lo dejes marchar a su servicio, y no espera el favor de balde: la bolsa figura entre las cláusulas. Un servidor es poca cosa para un gran salón; el precio que se ofrece por él, no."
 tnt_ai_offer_desc_a20:0 "[tnt_deal_partner.GetTitledFirstName] está dispuesta a hincar la rodilla, pero no a ciegas.\n\nSu señorío pasaría bajo tu corona con las condiciones fijadas en el pacto de abajo: lo que te rendirá y lo que piensa reservarse. Una lealtad comprada a precio justo se sostiene más que una lealtad tomada. Lee las cláusulas antes de sellarlas."
 tnt_ai_offer_desc_generic:0 "Se anuncia a un emisario de [tnt_deal_partner.GetTitledFirstName], que hace una reverencia y deja sobre la mesa una propuesta sellada. Las cláusulas están escritas abajo de puño y letra de su señor, y él aguarda tu respuesta."
 tnt_ai_offer_desc_outro:0 "\n\n#weak Tus diplomáticos lo han pesado en la misma balanza que usas tú.#!"
 tnt_ai_goal_claim:0 "#weak Tus informadores susurran: esa casa alimenta un derecho sobre tu tierra, y le parece el oro más barato que la sangre.#!\n\n"
 tnt_ai_goal_dejure:0 "#weak Tus letrados lo confirman: la tierra en cuestión se inclina hacia su corona por derecho antiguo, y no lo ha olvidado.#!\n\n"
 tnt_ai_goal_kin:0 "#weak La razón no hay que buscarla lejos: su propia sangre está en tu mazmorra.#!\n\n"
 tnt_ai_goal_menaced:0 "#weak Tus hombres de la frontera informan: un vecino más fuerte se cierne sobre su tierra, y anda con urgente necesidad de amigos.#!\n\n"
 tnt_ai_goal_rich:0 "#weak Tus mercaderes lo saben de cierto: su tesoro gime de oro en busca de un propósito.#!\n\n"
 tnt_ai_goal_poor:0 "#weak Tus mercaderes susurran: sus arcas están vacías, y anda desesperada por moneda.#!\n\n"
 tnt_ai_goal_overdomain:0 "#weak Tus letrados observan: tiene más tierra de la que una sola mano puede sostener con derecho, y el excedente busca comprador.#!\n\n"
 tnt_ai_goal_heir:0 "#weak No es secreto en su corte: el heredero tiene edad y el lecho conyugal sigue vacío; necesita un enlace.#!\n\n"
 tnt_ai_goal_brood:0 "#weak Tu gente bromea con ello: sus salones rebosan de niños, y cada uno necesita una corte, una mesa y un tutor.#!\n\n"
 tnt_ai_goal_schemer:0 "#weak Tus informadores te advierten: esa corte está hecha de susurros, y su señor nunca compra una promesa que no piense gastar.#!\n\n"
 tnt_ai_goal_yoke:0 "#weak Tus administradores lo oyen de sus criados: el juramento sienta mal a esa casa, y sus señores hablan de la vieja libertad.#!\n\n"
 tnt_ai_goal_talent:0 "#weak Tu chambelán nombra la razón: sus salones quieren un hombre de ese oficio, y los tuyos lo tienen.#!\n\n"
 tnt_ai_goal_surety:0 "#weak Tus emisarios lo leen sin dificultad: quiere poner su buena fe más allá de tu duda, y empeñará sangre para lograrlo.#!\n\n"
 tnt_ai_goal_might:0 "#weak Tus hombres de la frontera lo informan: su hueste está reunida y ociosa, y lleva tiempo contando tus levas.#!\n\n"
 tnt_ai_goal_blank:0 ""
 tnt_ai_offer_opt_accept:0 "Aceptar estas cláusulas"
 tnt_ai_offer_opt_counter:0 "Abrir la mesa de negociación"
 tnt_ai_offer_counter_tt:0 "#high Abre tu propia ventana de negociación con sus cláusulas ya dispuestas sobre ella.#! Cambia las que quieras, tacha lo que no te guste, añade exigencias propias y devuelve el tratado rehecho. Nada queda prometido hasta que pulses Proponer."
 tnt_ai_offer_opt_decline:0 "Despedir a la embajada"
 tnt_ai_offer_opt_hush:0 "Despedirla y no escuchar más embajadas"
 tnt_ai_offer_hush_tt:0 "Ningún gobernante te abordará con un tratado durante #high diez años#!."
 tnt_ai_demand_title:0 "Una exigencia de [tnt_deal_partner.GetTitledFirstName]"
 tnt_ai_demand_desc_a21:0 "El enviado de [tnt_deal_partner.GetTitledFirstName] no trae regalo ni propuesta. Nombra una suma y añade que a su señor le apenaría que le dieran motivo para venir a cobrarla en persona. Luego se queda de pie y espera, y no se sienta."
 tnt_ai_demand_desc_outro:0 "\n\n#weak Paga, y el mundo sabrá que pagaste. Despídelo, y el mundo lo sabrá también.#!"
 tnt_ai_demand_opt_pay:0 "Pagarle lo que exige"
 tnt_ai_demand_pay_tt:0 "#high Se cuenta la moneda y el enviado se marcha satisfecho.#! Su nombre crece con ello, y a quienes lo oigan les resultará más fácil temerle. No volverá a pedir en quince años."
 tnt_ai_demand_opt_refuse:0 "Despedirlo con las manos vacías"
 tnt_ai_demand_refuse_tt:0 "#high No obtiene nada.#! Pero un enviado entró en tu salón, puso precio y se fue sin respuesta — tu corte lo ha visto, y tu prestigio lo sufre. También lo sufre su propio nombre: una amenaza rechazada es una amenaza que ya ha sido medida. No volverá a pedir en quince años."
 tnt_ai_demand_refuse_free_tt:0 "#high No obtiene nada, y a ti no te cuesta nada.#! Tu hueste ya no es la que él contó. Su nombre lo sufre, y no volverá a pedir en quince años."
