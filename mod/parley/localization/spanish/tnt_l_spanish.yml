 tnt_ctx_contract:0 "Términos de la lealtad: [GetPlayer.MakeScope.ScriptValue('tnt_ob_changed_value')|0] alterados, valen [GetPlayer.MakeScope.ScriptValue('tnt_ob_sheet_total_value')|0]"
 tnt_ob_group_obligations:0 "Lo que debe el súbdito"
 tnt_ob_group_obligations_tt:0 "Las dos obligaciones que vienen con el juramento mismo, cada una desde nada en absoluto hasta lo abusivo.\n\n#weak Ambas están en el centro hasta que las muevas, y el centro es lo que dice un [vassal_contract|E] corriente.#!"
 tnt_ob_group_rights:0 "Lo que conserva el súbdito"
 tnt_ob_group_rights_tt:0 "Derechos a los que el señor renuncia, cláusula a cláusula.\n\n#weak Ninguno pertenece a un juramento corriente, así que cada sello de abajo es una concesión, salvo el último, en el que el señor toma en vez de dar.#!"
 tnt_ob_status_default:0 "Un juramento corriente: nada alterado."
 tnt_ob_status_changed:0 "Alterados: #high [GetPlayer.MakeScope.ScriptValue('tnt_ob_changed_value')|0]#! de nueve términos."
 tnt_ob_tax_label:0 "Impuestos"
 tnt_ob_tax_desc:0 "Qué parte de sus ingresos entrega el súbdito a su señor cada mes.\n\n#weak Baja un escalón y el súbdito conserva más, lo que es un regalo para quien hinca la rodilla; súbelo y el señor toma más. Un juramento de lealtad escueto está en el centro.#!"
 tnt_ob_tax_step_tt:0 "#weak Clic izquierdo: un escalón. Clic derecho: hasta el extremo.#!"
 tnt_ob_tax_lvl0:0 "[GetSubjectContractType( 'feudal_government_taxes' ).GetObligationNameShortNoTooltip( 'feudal_tax_exempt' )]"
 tnt_ob_tax_lvl1:0 "[GetSubjectContractType( 'feudal_government_taxes' ).GetObligationNameShortNoTooltip( 'feudal_tax_low' )]"
 tnt_ob_tax_lvl2:0 "[GetSubjectContractType( 'feudal_government_taxes' ).GetObligationNameShortNoTooltip( 'feudal_tax_normal' )]"
 tnt_ob_tax_lvl3:0 "[GetSubjectContractType( 'feudal_government_taxes' ).GetObligationNameShortNoTooltip( 'feudal_tax_high' )]"
 tnt_ob_tax_lvl4:0 "[GetSubjectContractType( 'feudal_government_taxes' ).GetObligationNameShortNoTooltip( 'feudal_tax_extortionate' )]"
 tnt_ob_levy_label:0 "Levas"
 tnt_ob_levy_desc:0 "Cuántas levas del súbdito puede levantar el señor.\n\n#weak Baja un escalón y el súbdito conserva a sus hombres en casa; súbelo y el señor los llama a filas. Un juramento de lealtad escueto está en el centro.#!"
 tnt_ob_levy_step_tt:0 "#weak Clic izquierdo: un escalón. Clic derecho: hasta el extremo.#!"
 tnt_ob_levy_lvl0:0 "[GetSubjectContractType( 'feudal_government_levies' ).GetObligationNameShortNoTooltip( 'feudal_levies_exempt' )]"
 tnt_ob_levy_lvl1:0 "[GetSubjectContractType( 'feudal_government_levies' ).GetObligationNameShortNoTooltip( 'feudal_levies_low' )]"
 tnt_ob_levy_lvl2:0 "[GetSubjectContractType( 'feudal_government_levies' ).GetObligationNameShortNoTooltip( 'feudal_levies_normal' )]"
 tnt_ob_levy_lvl3:0 "[GetSubjectContractType( 'feudal_government_levies' ).GetObligationNameShortNoTooltip( 'feudal_levies_high' )]"
 tnt_ob_levy_lvl4:0 "[GetSubjectContractType( 'feudal_government_levies' ).GetObligationNameShortNoTooltip( 'feudal_levies_extortionate' )]"
 tnt_ob_relig_label:0 "Protección religiosa"
 tnt_ob_relig_desc:0 "El súbdito puede conservar su fe en paz: #high +5#! de opinión sobre su señor, #high +5#! de opinión en sus propios condados, y jamás podrá ser perseguido por lo que cree.\n\n#weak El derecho más valioso de esta hoja, y no significa nada salvo que los dos sigáis fes distintas.#!"
 tnt_ob_council_label:0 "Puesto garantizado en el consejo"
 tnt_ob_council_desc:0 "El súbdito puede exigir un puesto en el consejo de su señor sin que se le pueda negar: #high +5#! de opinión sobre su señor.\n\n#weak Le cuesta al señor 2 de opinión entre sus vasallos poderosos, a quienes disgusta ver un puesto prometido de antemano.#!"
 tnt_ob_revoke_label:0 "Los títulos no pueden revocarse"
 tnt_ob_revoke_desc:0 "El señor renuncia al derecho de quitarle los títulos al súbdito: #high +5#! de opinión sobre su señor.\n\n#weak Lo que el señor cede aquí es el instrumento ordinario de disciplina.#!"
 tnt_ob_war_label:0 "Puede declarar la guerra libremente"
 tnt_ob_war_desc:0 "El súbdito deja de estar atado a las reglas de su señor sobre hacer la guerra: #high +5#! de opinión sobre su señor.\n\n#weak Las guerras iniciadas así siguen siendo suyas, para ganarlas o perderlas.#!"
 tnt_ob_fort_label:0 "Derechos de fortificación"
 tnt_ob_fort_desc:0 "El súbdito construye castillos más baratos y mantiene cada fortificación un nivel más alta.\n\n#weak Le cuesta al señor la décima parte de los impuestos que rinde este pacto, y exige que la [culture|E] del señor haya desbloqueado #high $innovation_battlements$#!.#!"
 tnt_ob_coin_label:0 "Derechos de acuñación"
 tnt_ob_coin_desc:0 "El súbdito acuña su propia moneda: #high +0.3#! de [development|E] mensual en su [county|E] capital.\n\n#weak Al señor le cuesta un 2 % de su propio crecimiento de desarrollo, y exige que la [culture|E] del señor haya desbloqueado #high $innovation_currency_02$#!.#!"
 tnt_ob_succ_label:0 "Reparto forzado"
 tnt_ob_succ_desc:0 "#N Este término favorece al señor, no al súbdito.#! El súbdito queda encerrado en la sucesión por reparto y jamás podrá legislar para salir de ella: #high -5#! de opinión sobre su señor.\n\n#weak Marcarlo mueve el equilibrio en sentido contrario: es algo que tomas, no algo que das.#!"
 tnt_ob_req_feudal:0 "Solo un súbdito feudal tiene impuestos, levas y derechos que negociar: activa antes #high Jurar lealtad#! en una de las dos columnas."
 tnt_ob_req_relig:0 "Los dos debéis seguir fes distintas para que esto proteja algo."
 tnt_ob_req_fort:0 "La cultura del señor debe haber desbloqueado la innovación #high $innovation_battlements$#!."
 tnt_ob_req_coin:0 "La cultura del señor debe haber desbloqueado la innovación #high $innovation_currency_02$#!."
 tnt_ob_req_succ:0 "El súbdito debe poder sostener la sucesión #high $confederate_partition_succession_law$#!."
 tnt_ob_req_revoke:0 "No mientras la fe del señor grave a los de otra fe y vuestras dos fes difieran."
