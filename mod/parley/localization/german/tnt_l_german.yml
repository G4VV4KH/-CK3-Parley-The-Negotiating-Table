 tnt_confirm_title:0 "Den Vertrag besiegeln?"
 tnt_confirm_desc:0 "Die Bedingungen liegen auf dem Tisch, Wachs und Siegel zur Hand.\n\nSobald der Gesandte ausreitet, hört [tnt_deal_partner.GetShortUIName] das Angebot genau so, wie es dasteht: nichts hinzugefügt, nichts zurückgenommen."
