 tnt_wed_row_line_matri:0 "[matrilineal|E]"
 tnt_wed_row_line_patri:0 "[patrilineal|E]"
 tnt_wed_row_line_tip:0 "In welches Haus die Kinder dieses Paares hineingeboren werden. Klickt, um es umzustellen: #high [patrilineal|E]#! gibt sie dem Haus des Vaters, #high [matrilineal|E]#! dem der Mutter.\n\n#weak Jedes Paar im Vertrag trägt seine eigene Linie, und die Linie entscheidet auch darüber, ob Ihr seine Prachthochzeit ausrichten dürft.#!"
 tnt_wed_taper:0 "Jedes Paar nach dem ersten ist der Gegenseite ein wenig weniger wert als das vorige, während das, was eine Verbindung sie #high kostet#! – ein weggegebener Erbe, eine preisgegebene Linie –, niemals nachgelassen wird.\n\nDrei Paare sind etwa #high 2,7#! einzelne Verbindungen wert; ein fünftes fügt nur noch #high 0,6#! hinzu, und darüber hinaus wächst der Gewinn gar nicht mehr.\n\n#weak Zwei oder drei gute Verbindungen schlagen also ein Dutzend gefüllter.#!"
 tnt_wed_grand:0 "Prachthochzeit versprechen"
 tnt_wed_grand_desc:0 "Gebt Euer Wort, eine dieser Verbindungen mit einem großen Fest zu feiern. #high Das geehrte Paar wird verlobt statt vermählt#!, und die andere Seite schätzt die Verbindung um dieser Ehre willen weit höher.\n\nWas Ihr auf Euch nehmt: Ihr werdet zum versprochenen Gastgeber, und Euer Wort gilt nur wenige Jahre. #high Die Hochzeit auszurichten, die Gäste zu laden und alles zu bezahlen bleibt Eure Sache#! – nichts wird für Euch geplant, und bis dahin sind die beiden verlobt und nicht mehr. Lasst das Versprechen verfallen, und das gebrochene Wort wird nicht vergessen.\n\n#weak Ein Paar im Vertrag darf geehrt werden, es muss Eure eigene Verwandtschaft sein, und die vorherrschende Linie muss die Eure sein.#!"
 tnt_wed_grand_couple:0 "Eine Prachthochzeit ist [GetPlayer.MakeScope.Var('tnt_wed_principal').Char.GetShortUIName] und [GetPlayer.MakeScope.Var('tnt_wed_principal').Char.MakeScope.Var('tnt_wed_partner').Char.GetShortUIName] versprochen"
 tnt_wed_principal_tag:0 "Prachthochzeit"
 tnt_wed_set_principal_tip:0 "Gebt die Prachthochzeit stattdessen diesem Paar. Nur ein Paar im Vertrag kann geehrt werden, und die Ehre umzusetzen kostet nichts, solange der Vertrag nicht besiegelt ist."
 tnt_item_wed_dread:0 "Furcht vor Euch"
