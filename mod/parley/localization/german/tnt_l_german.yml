 tnt_deal_strong_hook:0 "Eidschuld"
 tnt_deal_eternal_hook:0 "Ewige Pflicht"
 tnt_hook_tier_0:0 "Kein Druckmittel"
 tnt_hook_tier_1:0 "Schwacher Gefallen"
 tnt_hook_tier_2:0 "Starker Gefallen"
 tnt_hook_tier_3:0 "Ewiger Gefallen"
 tnt_stepper_hook_tt:0 "#weak Linksklick: ein stärkerer Gefallen. Rechtsklick: ein schwächerer.#!\n\n#weak Ein Gefallen kann nicht über nichts hinaus erhöht werden, solange die empfangende Partei bereits ein Druckmittel gegen die schuldende hält.#!"
 tnt_err_hook_taken_p:0 "Die Gegenseite hält bereits einen Gefallen über Euch, und ein zweiter kann nicht zugesagt werden, ehe der erste verbraucht ist."
 tnt_err_hook_taken_r:0 "Ihr haltet bereits einen Gefallen über die Gegenseite, und ein zweiter kann nicht zugesagt werden, ehe der erste verbraucht ist."
 tnt_picker_title_contract:0 "Bedingungen der Lehnstreue"
 tnt_btn_edit_contract:0 "Die Bedingungen des Eides bearbeiten."
 tnt_ob_note_p:0 "#high Ihr#! kniet hier nieder. Jede Bedingung unten bindet Euch und Eure Erben."
 tnt_ob_note_r:0 "#high Die Gegenseite#! kniet hier nieder. Jede Bedingung unten bindet sie und ihre Erben."
 tnt_ob_note_none:0 "Noch liegt kein Eid auf dem Tisch. Schaltet #high Treue schwören#! in einer der beiden Spalten ein, und die Bedingungen dieses Eides sind die Euren: Steuern, Aufgebote und die Rechte, die der Untergebene behält."
 tnt_ob_note_gov:0 "Diese Regierungsform kennt keine verhandelbaren [vassal_contract|E]: Nur ein feudaler Untergebener bringt Steuern, Aufgebote und Rechte an den Tisch."
 tnt_ob_reset_btn:0 "Schlichter Eid"
 tnt_ob_reset_tt:0 "Setzt jede Bedingung auf einen blanken Treueeid zurück: gewöhnliche Steuern, gewöhnliche Aufgebote und keines der Rechte unten."
 tnt_ob_total_label:0 "Diese Bedingungen sind wert"
 tnt_ctx_contract:0 "Bedingungen der Lehnstreue: [GetPlayer.MakeScope.ScriptValue('tnt_ob_changed_value')|0] geändert, wert [GetPlayer.MakeScope.ScriptValue('tnt_ob_sheet_total_value')|0]"
 tnt_ob_group_obligations:0 "Was der Untergebene schuldet"
 tnt_ob_group_obligations_tt:0 "Die beiden Pflichten, die zum Eid selbst gehören, jede von gar nichts bis erpresserisch.\n\n#weak Beide stehen in der Mitte, bis Ihr sie bewegt, und die Mitte ist das, was gewöhnliche [vassal_contract|E] vorsehen.#!"
 tnt_ob_group_rights:0 "Was der Untergebene behält"
 tnt_ob_group_rights_tt:0 "Rechte, die der Lehnsherr abtritt, eine Klausel nach der anderen.\n\n#weak Keines davon gehört zu einem gewöhnlichen Eid, darum ist jedes Siegel unten ein Zugeständnis – bis auf das letzte, bei dem der Lehnsherr nimmt statt gibt.#!"
 tnt_ob_status_default:0 "Ein gewöhnlicher Eid – nichts geändert."
 tnt_ob_status_changed:0 "Geändert: #high [GetPlayer.MakeScope.ScriptValue('tnt_ob_changed_value')|0]#! von neun Bedingungen."
 tnt_ob_tax_label:0 "Steuern"
 tnt_ob_tax_desc:0 "Wie viel seiner Einkünfte der Untergebene seinem Lehnsherrn Monat für Monat abgibt.\n\n#weak Stuft die Leiter herab, und der Untergebene behält mehr, was ein Geschenk an den Knienden ist; stuft sie hinauf, und der Lehnsherr nimmt mehr. Ein blanker Treueeid steht in der Mitte.#!"
 tnt_ob_tax_step_tt:0 "#weak Linksklick: eine Stufe. Rechtsklick: ganz ans Ende.#!"
 tnt_ob_tax_lvl0:0 "[GetSubjectContractType( 'feudal_government_taxes' ).GetObligationNameShortNoTooltip( 'feudal_tax_exempt' )]"
 tnt_ob_tax_lvl1:0 "[GetSubjectContractType( 'feudal_government_taxes' ).GetObligationNameShortNoTooltip( 'feudal_tax_low' )]"
 tnt_ob_tax_lvl2:0 "[GetSubjectContractType( 'feudal_government_taxes' ).GetObligationNameShortNoTooltip( 'feudal_tax_normal' )]"
 tnt_ob_tax_lvl3:0 "[GetSubjectContractType( 'feudal_government_taxes' ).GetObligationNameShortNoTooltip( 'feudal_tax_high' )]"
 tnt_ob_tax_lvl4:0 "[GetSubjectContractType( 'feudal_government_taxes' ).GetObligationNameShortNoTooltip( 'feudal_tax_extortionate' )]"
 tnt_ob_levy_label:0 "Aufgebote"
 tnt_ob_levy_desc:0 "Wie viele der Aufgebote des Untergebenen der Lehnsherr ausheben darf.\n\n#weak Stuft die Leiter herab, und der Untergebene behält seine Männer daheim; stuft sie hinauf, und der Lehnsherr ruft sie ins Feld. Ein blanker Treueeid steht in der Mitte.#!"
 tnt_ob_levy_step_tt:0 "#weak Linksklick: eine Stufe. Rechtsklick: ganz ans Ende.#!"
 tnt_ob_levy_lvl0:0 "[GetSubjectContractType( 'feudal_government_levies' ).GetObligationNameShortNoTooltip( 'feudal_levies_exempt' )]"
 tnt_ob_levy_lvl1:0 "[GetSubjectContractType( 'feudal_government_levies' ).GetObligationNameShortNoTooltip( 'feudal_levies_low' )]"
 tnt_ob_levy_lvl2:0 "[GetSubjectContractType( 'feudal_government_levies' ).GetObligationNameShortNoTooltip( 'feudal_levies_normal' )]"
 tnt_ob_levy_lvl3:0 "[GetSubjectContractType( 'feudal_government_levies' ).GetObligationNameShortNoTooltip( 'feudal_levies_high' )]"
 tnt_ob_levy_lvl4:0 "[GetSubjectContractType( 'feudal_government_levies' ).GetObligationNameShortNoTooltip( 'feudal_levies_extortionate' )]"
 tnt_ob_relig_label:0 "Religiöser Schutz"
 tnt_ob_relig_desc:0 "Der Untergebene darf seinen eigenen Glauben in Frieden behalten: #high +5#! Meinung über seinen Lehnsherrn, #high +5#! Meinung in seinen eigenen Grafschaften, und er kann für seinen Glauben niemals verfolgt werden.\n\n#weak Das wertvollste Recht auf diesem Blatt, und es bedeutet nichts, solange Ihr beide nicht verschiedenen Glauben folgt.#!"
 tnt_ob_council_label:0 "Garantierter Ratssitz"
 tnt_ob_council_desc:0 "Der Untergebene darf einen Sitz im Rat seines Lehnsherrn fordern und kann nicht abgewiesen werden: #high +5#! Meinung über seinen Lehnsherrn.\n\n#weak Es kostet den Lehnsherrn 2 Meinung bei seinen mächtigen Vasallen, die einen weggegebenen Sitz übelnehmen.#!"
 tnt_ob_revoke_label:0 "Titel unaberkennbar"
 tnt_ob_revoke_desc:0 "Der Lehnsherr gibt das Recht auf, dem Untergebenen seine Titel abzuerkennen: #high +5#! Meinung über seinen Lehnsherrn.\n\n#weak Was der Lehnsherr hier preisgibt, ist sein gewöhnliches Zuchtmittel.#!"
 tnt_ob_war_label:0 "Darf frei Krieg erklären"
 tnt_ob_war_desc:0 "Der Untergebene ist nicht länger an die Kriegsregeln seines Lehnsherrn gebunden: #high +5#! Meinung über seinen Lehnsherrn.\n\n#weak So begonnene Kriege bleiben die des Untergebenen, zu gewinnen oder zu verlieren.#!"
 tnt_ob_fort_label:0 "Befestigungsrecht"
 tnt_ob_fort_desc:0 "Der Untergebene baut Burgen billiger und hält jede Festung eine Stufe höher.\n\n#weak Es kostet den Lehnsherrn ein Zehntel der Steuern, die dieser Vertrag einbringt, und setzt voraus, dass die [culture|E] des Lehnsherrn #high $innovation_battlements$#! freigeschaltet hat.#!"
 tnt_ob_coin_label:0 "Prägerecht"
 tnt_ob_coin_desc:0 "Der Untergebene prägt eigene Münzen: #high +0,3#! monatliche [development|E] in der [county|E] seiner Hauptstadt.\n\n#weak Der Lehnsherr verliert dafür 2 % seines eigenen Entwicklungswachstums, und es setzt voraus, dass die [culture|E] des Lehnsherrn #high $innovation_currency_02$#! freigeschaltet hat.#!"
 tnt_ob_succ_label:0 "Zwangsteilung"
 tnt_ob_succ_desc:0 "#N Diese Bedingung begünstigt den Lehnsherrn, nicht den Untergebenen.#! Der Untergebene ist auf Erbteilung festgelegt und kann sich niemals per Gesetz daraus befreien: #high -5#! Meinung über seinen Lehnsherrn.\n\n#weak Sie anzuhaken verschiebt die Waage in die andere Richtung: Es ist etwas, das Ihr nehmt, nicht etwas, das Ihr gebt.#!"
 tnt_ob_req_feudal:0 "Nur ein feudaler Untergebener hat Steuern, Aufgebote und Rechte zu verhandeln. Schaltet zuerst #high Treue schwören#! in einer der beiden Spalten ein."
 tnt_ob_req_relig:0 "Ihr beide müsst verschiedenen Glauben folgen, damit dies überhaupt etwas schützt."
 tnt_ob_req_fort:0 "Die Kultur des Lehnsherrn muss die Innovation #high $innovation_battlements$#! freigeschaltet haben."
 tnt_ob_req_coin:0 "Die Kultur des Lehnsherrn muss die Innovation #high $innovation_currency_02$#! freigeschaltet haben."
 tnt_ob_req_succ:0 "Der Untergebene muss die Nachfolge #high $confederate_partition_succession_law$#! halten können."
 tnt_ob_req_revoke:0 "Nicht, solange der Glaube des Lehnsherrn Andersgläubige besteuert und Eure beiden Glauben sich unterscheiden."
