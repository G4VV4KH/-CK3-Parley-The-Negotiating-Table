 tnt_open_negotiations:0 "Vertrag aushandeln"
 tnt_open_negotiations_desc:0 "Schickt einen Gesandten zu [recipient.GetShortUIName] und legt einen vollständigen Vertrag auf den Tisch – jede Bedingung, beide Seiten auf einmal."
 tnt_open_negotiations_extra_icon:0 "@dread_icon! Ihr könnt Druck auf ihn ausüben – Heer, Name und Schrecken erreichen zusammen das Gewicht, das eine Drohung braucht, und Eure letzte Drohung ist vergessen"
 tnt_window_title:0 "Diplomatische Verhandlungen"
 tnt_col_actor:0 "Ihr bietet"
 tnt_col_partner:0 "Gegenseite bietet"
 tnt_balance_header:0 "Antwort der Gegenseite"
 tnt_balance_accept:0 "#P Die Gegenseite neigt zur Annahme#!"
 tnt_balance_reject:0 "#N Die Gegenseite neigt zur Ablehnung#!"
 tnt_scale_note:0 "Die Zahl ist die Antwort der Gegenseite: über null wird unterschrieben. Jede Bedingung ist mit dem bewertet, was sie wert wäre, hättet Ihr sie einzeln ausgehandelt, und die Meinung über Euch, der Glaube, die Verwandtschaft und alles, was obendrein verlangt wird, sind bereits eingerechnet. Der Balken ist dieselbe Antwort, nur ausgebreitet: alles, was zur Zusage drängt, gegen alles, was zur Absage drängt – sobald der Balken die Mitte überschreitet, wird zugestimmt."
 tnt_label_points:0 "Pkt."
 tnt_label_years:0 "#weak Hält 10 Jahre#!"
 tnt_picker_empty:0 "#weak Nichts verfügbar#!"
 tnt_picker_empty_artifact:0 "#weak Nichts, was diese Seite besitzt, darf den Besitzer wechseln: Kronjuwelen folgen ihrem Titel, Dynastiebanner bleiben bei der Dynastie, und Reliquien des eigenen Glaubens gehen nur an Glaubensgenossen.#!"
 tnt_item_gold:0 "Gold"
 tnt_item_gold_desc:0 "Eine einmalige Zahlung von [gold_i] aus der Schatzkammer, übergeben in dem Augenblick, in dem der Vertrag besiegelt wird."
 tnt_item_prestige:0 "Prestige"
 tnt_item_prestige_desc:0 "[prestige_i] [prestige|E], über den Tisch hinweg zugesagt.\n\n#weak Hier wechselt keine Truhe den Besitzer: Der Gebende verliert den Betrag und der Empfangende gewinnt ihn, in zwei getrennten Vorgängen, und nichts hält die beiden zusammen. Darum kann das Angebot überhaupt nur abgeschickt werden, wenn der Gebende den vollen Betrag in dem Augenblick besitzt, in dem „Vorschlagen“ gedrückt wird.#!"
 tnt_item_piety:0 "Frömmigkeit"
 tnt_item_piety_desc:0 "[piety_i] [piety|E], über den Tisch hinweg zugesagt.\n\n#weak Wieder zwei getrennte Vorgänge und keine Übertragung: Was die eine Seite verliert, gewinnt die andere. Das Angebot kann nur abgeschickt werden, wenn der Gebende den vollen Betrag in dem Augenblick besitzt, in dem „Vorschlagen“ gedrückt wird.#!"
 tnt_item_influence:0 "Einfluss"
 tnt_item_influence_desc:0 "[influence_i] [influence|E], über den Tisch hinweg zugesagt.\n\n#weak [influence|E] gibt es nur unter einer Regierungsform, die darauf beruht, und darum erscheinen diese Zeilen nur, wenn beide Regierungsformen darauf beruhen – einem Herrscher ohne solchen Vorrat wäre damit überhaupt nicht gedient. Auch hier zwei getrennte Vorgänge, und das Angebot kann nur abgeschickt werden, wenn der Gebende den vollen Betrag in dem Augenblick besitzt, in dem „Vorschlagen“ gedrückt wird.#!"
 tnt_item_alliance:0 "Militärbündnis"
 tnt_err_ab_already_fair:0 "Der Vertrag steht bereits genau bei #high +1#! – es bleibt nichts mehr auszugleichen"
 tnt_err_ab_empty:0 "Auf dem Tisch liegt noch nichts, was sich ausgleichen ließe"
 tnt_threat_opinion:0 "Hat mich bedroht"
 tnt_treaty_favor_opinion:0 "Vorteilhafter Vertrag"
 tnt_item_usehook_r:0 "Er fordert seine Schuld ein"
 tnt_item_usehook_r_desc:0 "Er hält ein [hook|E] über Euch und gedenkt es einzusetzen, also erwartet er, dass der Vertrag dies berücksichtigt.\n\n#weak Dies lässt sich nicht abschalten – es ist sein Hebel, nicht Eurer. Es lässt ihn MEHR VERLANGEN als einen billigen Preis: #high -45#! für einen Gefallen, den er einfordern kann, #high -120#!, wenn der Hebel von der Güte einer Erpressung ist. Unterschreibt, und die Schuld ist beglichen: Ein schwaches Druckmittel ist dahin, ein starkes bleibt.#!\n\n#weak Ablehnen kostet nichts als den Vertrag.#!"
 tnt_usehook_r_sub:0 "[Select_CString( GreaterThanOrEqualTo_CFixedPoint( GetPlayer.MakeScope.ScriptValue('tnt_usehook_r_strength_value'), '(CFixedPoint)2' ), Localize('tnt_usehook_strong'), Localize('tnt_usehook_weak') )]"
 tnt_bd_usehook_r:0 "Eine gegen Euch eingeforderte Schuld"
 tnt_item_usehook:0 "Druckmittel einfordern"
 tnt_item_usehook_desc:0 "Setzt den Hebel ein, den Ihr ohnehin schon über ihn habt. Dies ist die Gegenrichtung zu #high Gefallen schulden#!: Jenes gibt ihm einen Gefallen über Euch in die Hand, dieses treibt den Gefallen ein, den er Euch schuldet.\n\nEs wirkt auch bei einem Herrscher, der Euch niemals mögen wird, und darum rührt sein Gewicht nicht an seiner Wertschätzung – anders als alles, was Ihr ihm geben könntet.\n\n#weak Ein eingefordertes [hook|E] ist #high +45#! wert, ein Hebel von der Güte einer Erpressung #high +120#!. Was ein Druckmittel übersteht, entscheidet das Spiel selbst: Ein schwaches wird beim Unterzeichnen aufgebraucht, ein starkes nicht. Verbraucht wird es nur, wenn der Vertrag auch wirklich zustande kommt – ein Gefallen, der für einen geplatzten Vertrag eingefordert wird, wäre ein weggeworfener Gefallen.#!\n\n#weak Eine Schuld einzutreiben wiegt genauso schwer wie eine Drohung. Euer eigenes Wesen urteilt über die Tat: Manches Gewissen trägt sie als eigene #high Anspannung#!; einen kälteren Herrscher erleichtert es, den Druck endlich eingesetzt zu haben, und die Bestätigung nennt die Eigenschaften, die geantwortet haben, bevor der Gesandte ausreitet.#!"
 tnt_usehook_sub:0 "[Select_CString( GreaterThanOrEqualTo_CFixedPoint( GetPlayer.MakeScope.ScriptValue('tnt_usehook_strength_value'), '(CFixedPoint)2' ), Localize('tnt_usehook_strong'), Select_CString( GreaterThanOrEqualTo_CFixedPoint( GetPlayer.MakeScope.ScriptValue('tnt_usehook_strength_value'), '(CFixedPoint)1' ), Localize('tnt_usehook_weak'), Localize('tnt_usehook_none') ) )]"
 tnt_usehook_strong:0 "Starkes Druckmittel – es übersteht seinen Einsatz"
 tnt_usehook_weak:0 "Schwaches Druckmittel – das Einfordern verbraucht es"
 tnt_usehook_none:0 "Ihr habt kein Druckmittel gegen ihn"
 tnt_bd_usehook_p:0 "Ein eingefordertes Druckmittel"
 tnt_err_usehook_none:0 "Ihr habt kein Druckmittel gegen ihn, das Ihr einsetzen könntet"
 tnt_item_threat:0 "Ihm drohen"
 tnt_item_threat_desc:0 "Lasst ihn begreifen, was eine Absage ihn kosten würde. Dies ist keine Kriegserklärung: Nichts wird geschworen und kein Heer setzt sich in Marsch. Es ist Gewicht auf dem Tisch, und es wirkt auch bei einem Herrscher, der Euch niemals mögen wird – genau dort, wo Gold nichts ausrichtet.\n\nSein Gewicht ist, #high um wie viel Euer Heer das seine übertrifft#!, gehoben oder gesenkt davon, #high um wie viel Euer Name den seinen überragt#!, und davon, #high um wie viel furchtbarer Euer Schrecken ist als der seine#!. Eine ganze Ruhmstufe unter ihm zu stehen schließt die Drohung vollständig, wie groß Euer Heer auch sei – und das Gewicht, das die Drohung öffnet, ist genau das Gewicht, das sie dem Vertrag dann zu Euren Gunsten hinzufügt.\n\n#weak Er wird es sich merken. Ein unter Drohung geschlossener Vertrag kostet Euch „$tnt_threat_opinion$“, #high -100#! Meinung, die über fünfzehn Jahre abklingt – und da erst seine Wertschätzung Euren Gaben ihren Wert gibt, heißt heute mit Furcht genommen, dass Euer Gold bei ihm eine Generation lang weniger kauft. Doch es zahlt nicht Euer Gold allein: Euer eigenes Wesen urteilt über die Tat. Manches Gewissen trägt dieses Gewicht selbst, als eigene #high Anspannung#!; einen kälteren Herrscher erleichtert es, den Druck endlich eingesetzt zu haben. Die Bestätigung nennt die Eigenschaften, die geantwortet haben, und die genaue Zahl, bevor der Gesandte ausreitet.#!"
 tnt_threat_sub:0 "Heer [GetPlayer.MakeScope.ScriptValue('tnt_threat_ratio_value')|1] zu 1, Name ×[GetPlayer.MakeScope.ScriptValue('tnt_threat_rep_term_value')|0], Schrecken ×[GetPlayer.MakeScope.ScriptValue('tnt_threat_dread_term_value')|2]"
 tnt_bd_threat_p:0 "Nackter Druck"
 tnt_bd_threat_panel:0 "Druck"
 tnt_err_threat_weak:0 "Eine Drohung benötigt mindestens 100 Vertragspunkte aus militärischer Stärke, Prestige und Schrecken. Dieses Minimum gilt gleichermaßen für Spieler und KI."
 tnt_err_threat_relation:0 "Ihr könnt nur einem unabhängigen Herrscher drohen, der weder Euer Verbündeter noch durch eine Geisel mit Euch verbunden ist"
 tnt_err_threat_unknown:0 "Euer Name muss etwas gelten, die Ruhmstufe also über nichts liegen"
 # tnt_err_threat_unafraid RETIRED round 8 (I2). This tombstone holds the line count so no .yml citation moves. ORPHANED 2026-08-24 BY THE RATIO RULING, KEPT DEFINED IN ALL NINE: tnt_err_threat_unknown above and tnt_err_threat_nofear below have ZERO rows - their rules are inside tnt_threat_points_value now. Law 9 and the law-10d control. DO NOT DELETE, DO NOT RE-USE FOR ANOTHER MEANING.
 tnt_err_threat_nofear:0 "Er fürchtet Euch nicht. Euer Schrecken muss 75 erreichen; bei einem, der nicht kühn ist, genügen 40, und bei einem, der Euch untersteht, 20"
 tnt_err_threat_recent:0 "Er erinnert sich noch an Eure letzte Drohung. Lasst die Erinnerung verblassen, ehe Ihr ihn erneut bedrängt"
 tnt_item_alliance_desc:0 "Ein förmliches Bündnis, von Euch beiden gemeinsam geschworen – nichts, was eine Seite der anderen überreicht. Danach darf jede Seite die andere in den Krieg rufen, und diesen Ruf abzuschlagen kostet [prestige|E].\n\n#weak Eine einzige Zeile für einen einzigen Pakt: Er steht im Vertrag oder er steht nicht darin.#!\n\n#weak Ist die andere Seite der eigene [liege|E] oder der eigene [vassal|E], so ist es ein fortdauernder Pakt statt eines Waffenrufs: Das Spiel lässt Lehnsherr und Vasall einander nicht aufbieten, doch das Bündnis ist wirklich, wird überall mitgezählt, wo Bündnisse zählen, und überdauert den Tag, an dem einer von Euch das Reich des anderen verlässt.#!\n\n#weak $tnt_tt_alliance_glut$#!"
 tnt_tt_alliance_glut:0 "Jedes Bündnis, das Ihr bereits haltet, macht das nächste billiger. Vom zweiten Verbündeten an – den eigenen Lehnsherrn und die eigenen Vasallen nicht mitgezählt – halbiert jedes bestehende Bündnis, was ein frischer Pakt einem Partner wert ist, und seine eigenen Verbündeten tun bei ihm dasselbe."
 tnt_item_truce:0 "Nichtangriffspakt"
 tnt_item_truce_desc:0 "Ein Pakt, in den Ihr beide gemeinsam eintretet: Keine Seite darf der anderen für #high zehn Jahre#! den Krieg erklären.\n\n#weak Eine einzige Zeile für einen einzigen Pakt: Er steht im Vertrag oder er steht nicht darin.#!"
 tnt_item_marriage:0 "Heiratspakt"
 tnt_item_marriage_desc:0 "Eine Verbindung zwischen den beiden Häusern, und #high so viele Paare in einem Vertrag, wie Ihr wollt#!. Wählt auf jeder Seite eine Person, legt die Linie fest, in der die Kinder geboren werden, und fügt das Paar hinzu; ist eines der beiden noch ein Kind, wird das Paar verlobt statt vermählt.\n\n#weak Jedes Paar nach dem ersten ist der Gegenseite ein wenig weniger wert als das vorige, während das, was eine Verbindung sie kostet, niemals schrumpft – ein paar gute Verbindungen schlagen ein Dutzend gefüllter. Ein Haus, das unter den eigenen Rang heiraten soll, lässt sich den Abstieg bezahlen, und je weiter die Kluft, desto steiler der Preis. Einem Paar kann außerdem eine Prachthochzeit versprochen werden.#!\n\n#high Eine nahe genug Verbindung bringt nun ein Bündnis mit sich#!, genau wie es die spieleigene arrangierte Heirat tut – und der Preis des Vertrags trägt dieses Bündnis mit, sodass eine Verbindung, die Euch verbündet, mehr wert ist als eine, die es nicht tut. #weak Den Hinweisen „Mögliches Bündnis“, die der Heiratsbildschirm neben den Anwärtern zeigt, darf man wieder trauen.#!"
 tnt_item_title:0 "Titel abtreten"
 tnt_item_title_desc:0 "Übergebt einen gehaltenen Titel von Grafschaftsrang oder darüber, mit allem, was darunter liegt.\n\n#weak So viele auf einmal, wie Ihr wollt. Ein Hauptsitz und ein Haupttitel liegen niemals auf dem Tisch. Land jenseits dessen, was die Domäne fasst, ist immer noch Land: Man wird es nehmen und den vollen Wert dafür zahlen und die Last mit den eigenen Verwaltern ausmachen.#!"
 tnt_item_claim:0 "Anspruch gewähren"
 tnt_item_claim_desc:0 "Gewährt einen nicht geltend gemachten [claim|E] auf einen Titel, den der Gebende selbst hält – eine offene Einladung zu einem künftigen Krieg und ein schweres Zugeständnis.\n\n#weak So viele auf einmal, wie Ihr wollt.#!"
 tnt_item_prisoner_multi:0 "Ausgewählte Gefangene freilassen"
 tnt_item_prisoner_multi_desc:0 "Öffnet Euren Kerker für die Gefangenen, die Ihr benennt, und für keine anderen.\n\n#weak Was ein Gefangener wert ist, sind sein Rang und sein Blut: #high 10#! für jeden, #high +15#!, wenn er von der Sippe der Gegenseite ist, #high +10#!, wenn er überhaupt einen Titel hält, und #high +15 / +25 / +40 / +60#!, je nachdem, ob dieser Titel Grafschafts-, Herzogtums-, Königreichs- oder Großreichsrang erreicht. Ein gefangener König ist darum mehr wert als ein Dutzend Namenloser – und genau darum wählt man aus.#!\n\n#weak Wird hier irgendjemand ausgewählt, hebt das #high Gefangene freilassen#! auf: Sonst würde für dieselben Männer zweimal bezahlt.#!"
 tnt_multi_count_prisoner_p:0 "Benannte Gefangene: [GetPlayer.MakeScope.ScriptValue('tnt_count_sel_prisoner_p_value')|0]"
 tnt_sel_count_prisoner_p:0 "Benannt: [GetPlayer.MakeScope.ScriptValue('tnt_count_sel_prisoner_p_value')|0]"
 tnt_picker_title_prisoner:0 "Freizulassende Gefangene wählen"
 tnt_item_prisoners:0 "Gefangene freilassen"
 tnt_item_prisoners_desc:0 "Die freilassende Seite öffnet ihre Kerker für jeden Gefangenen, den Blut oder Lehnstreue an die andere Partei bindet."
 tnt_item_hook:0 "Gefallen schulden"
 tnt_item_hook_desc:0 "Schuldet der anderen Partei einen [hook_i] Gefallen. Drei Stärken: Ein #high schwacher#! Gefallen hält zehn Jahre und ist beim ersten Gebrauch verbraucht; ein #high starker#! hält zwanzig Jahre, darf immer wieder eingesetzt werden und ruht fünf Jahre zwischen zwei Malen; ein #high ewiger#! verfällt nie und wird nie verbraucht und ruht ebenso fünf Jahre zwischen zwei Malen.\n\n#weak Linksklick erhöht die Stärke, Rechtsklick senkt sie. Ein Gefallen kann nicht zugesagt werden, wenn die empfangende Partei bereits ein Druckmittel gegen die gebende hält.#!"
 tnt_item_artifact:0 "Artefakt"
 tnt_item_artifact_desc:0 "Übergebt ein [artifact_i] Artefakt aus der eigenen Schatzkammer des Gebenden.\n\n#weak So viele auf einmal, wie Ihr wollt. Stücke, die das Spiel selbst zu Hause behält, werden nicht aufgeführt: an einen Titel gebundene Kronjuwelen, Dynastiebanner und Reliquien des eigenen Glaubens des Gebenden, die über Glaubensgrenzen hinweg angeboten würden.#!"
 tnt_item_nonwar:0 "Nichtangriff versprechen"
 tnt_item_nonwar_desc:0 "Schwört einem dritten Herrscher einen einseitigen [truce|E] für #high zehn Jahre#!; einen Waffenstillstand zu brechen zieht eine schwere Strafe nach sich.\n\nWer benannt werden kann: Herrscher, deren Reich an das des Schwörenden grenzt, und Halter von Titeln, auf die der Schwörende einen Anspruch hat – niemals die beiden Verhandelnden, die Verbündeten des Schwörenden oder jemand, mit dem er ohnehin schon einen Waffenstillstand hat.\n\n#weak Die andere Partei schuldet nichts dafür – der Schwörende hält lediglich seine Hand zurück.#!"
 tnt_item_vassal:0 "Treue schwören"
 tnt_item_vassal_desc:0 "Ein Herrscher kniet nieder und wird der [vassal|E] des anderen, samt Reich. Die schwerste Bedingung, die dieser Tisch tragen kann – und die einzige, zu der ein geschriebener Vertrag gehört, den Ihr bearbeiten dürft."
 tnt_item_indep:0 "Unabhängigkeit gewähren"
 tnt_item_indep_desc:0 "Ein Vasall wird aus seinem Treueeid entlassen und zum unabhängigen Herrscher. Auf Eurer Seite des Tisches geht der eigene Vasall frei; auf seiner Seite seid Ihr es. Ein Vertrag darf dies und einen Treueeid nicht zugleich tragen.\n\n#weak Angeboten werden kann es nur, wo Ihr beide bereits als Lehnsherr und unmittelbarer Vasall zueinander steht, der zu Befreiende eigenes Land hält, keines der beiden Reiche im Krieg steht und seine Ländereien kein Teil des de-jure-Erbes seines Lehnsherrn sind.#!"
 tnt_item_hostage:0 "Geisel"
 tnt_item_hostage_desc:0 "Ein naher Verwandter des Gebenden – ein Kind, ein Enkelkind, ein Geschwister, eine Nichte oder ein Neffe – reist an den anderen Hof und lebt dort als Geisel, als Bürgschaft für diesen Vertrag. Er ist ein Gast nach den Geiselregeln des Spiels, kein Gefangener.\n\n#weak Verpfändet werden darf nur unbelehnte, unverheiratete und unverlobte Verwandtschaft, die sich bereits an seinem eigenen Hof aufhält, und niemals sein eigener Regent.#!"
 tnt_item_ward:0 "Mündel"
 tnt_item_ward_desc:0 "Ein Kind vom Hof des Gebenden wird zur Erziehung zum anderen Herrscher geschickt. Dieser Herrscher wird selbst zum Vormund – es gibt keinen Dritten zu wählen.\n\n#weak Angeboten werden dürfen nur Kinder an seinem eigenen Hof, die reisefähig sind, und ein Vormund darf kein drittes Mündel annehmen.#!"
 tnt_item_courtier:0 "Höflinge"
 tnt_item_courtier_desc:0 "Höflinge wechseln den Haushalt, jeder nimmt seinen Gemahl und etwaige kleine Kinder mit sich.\n\n#weak Übergeben werden dürfen nur erwachsene, unbelehnte Mitglieder des Hofes des Gebenden, die dort kein Amt bekleiden – nicht sein Erbe, sein Gemahl, sein Regent, seine Ratsmitglieder, seine Ritter oder seine Hofbediensteten – und niemals ein Mann, den der Empfangende als Rivalen zählt.#!"
 tnt_item_subject_desc:0 "Die gewählten Vasallen wechseln den Lehnsherrn und treten in das Reich des anderen Herrschers über, mit allen Titeln, die sie halten, und allen eigenen Vasallen.\n\n#weak Ihre Vasallenbande werden zu den gewöhnlichen Bedingungen des aufnehmenden Reiches neu geschrieben, besondere Verpflichtungen entfallen also. Ein Waffenstillstand folgt der Übergabe nicht, und nichts im Spiel holt einen Vasallen über eine Reichsgrenze zurück außer Krieg. Übergeben werden dürfen nur unmittelbare Vasallen mit mindestens einer Grafschaft, die im Rang unter dem empfangenden Herrscher stehen und mit allen Beteiligten Frieden halten – niemals ein Regent und niemals ein Erbe – und ein Vasall, den ein Vertrag bereits verschoben hat, darf drei Jahre lang nicht erneut verschoben werden.#!"
 tnt_item_subject:0 "Vasall übergeben"
