 tnt_err_truce_dead:0 "Einer von Euch weilt nicht mehr unter den Lebenden."
 tnt_err_hostage_p_unavailable:0 "Ihr habt niemanden, den Ihr als Geisel schicken könntet, oder die Gegenseite nimmt von Euch keine Bürgschaft an."
 tnt_err_hostage_r_unavailable:0 "Die Gegenseite hat niemanden, den sie als Geisel schicken könnte, oder Ihr könnt für sie keine Bürgschaft annehmen."
 tnt_err_ward_p_unavailable:0 "Ihr habt kein Kind, das Ihr in ihre Obhut geben könntet, oder ihr Hof kann keines erziehen."
 tnt_err_ward_r_unavailable:0 "Die Gegenseite hat kein Kind, das sie in Eure Obhut geben könnte, oder Euer Hof kann keines erziehen."
 tnt_err_courtier_p_unavailable:0 "Niemand an Eurem Hof kann übergeben werden. Die Unwilligen, die Vereidigten und die Gefangenen bleiben allesamt."
 tnt_err_courtier_r_unavailable:0 "Niemand an ihrem Hof kann Euch übergeben werden."
 tnt_err_subject_and_vassal:0 "Ein Vertrag, der die Lehnstreue eines ganzen Reiches trägt, braucht nicht auch noch einen einzeln herausgebrochenen Vasallen. Nehmt den Treueid vom Tisch oder den Vasallen."
 tnt_err_subject_r_unavailable:0 "Zurzeit kann Euch keiner ihrer Vasallen übergeben werden: Ihr müsst selbst Land halten und bereit sein, weitere Untergebene aufzunehmen, und Ihr beide müsst Frieden halten."
 tnt_err_subject_p_unavailable:0 "Zurzeit kann keiner Eurer Vasallen übergeben werden, und es kann an der anderen Seite des Tisches liegen statt an Eurer: Der empfangende Herrscher muss selbst Land halten und bereit sein, weitere Untergebene aufzunehmen, und Ihr beide müsst Frieden halten."
 tnt_err_indep_p_unavailable:0 "Eine Entlassung ist im Augenblick nicht möglich: Die Gegenseite muss Euer Vasall sein, Ihr beide müsst in Frieden stehen (und keiner Eurer Vasallen darf mit ihr im Krieg liegen), ihre Ländereien müssen außerhalb Eurer eigenen de-jure-Titel liegen, und sie darf nicht Euer Diarch sein."
 tnt_err_indep_r_unavailable:0 "Eine Entlassung ist im Augenblick nicht möglich: Ihr müsst ihr Vasall sein, Ihr beide müsst in Frieden stehen (und keiner ihrer Vasallen darf mit Euch im Krieg liegen), Eure Ländereien müssen außerhalb ihrer de-jure-Titel liegen, und Ihr dürft nicht ihr Diarch sein."
 tnt_err_people_pair:0 "Dieser Vertrag widerspricht sich selbst: Er kann nicht im selben Atemzug einen Vasallen freigeben und einen annehmen."
 tnt_ai_offer_title:0 "Eine Gesandtschaft von [tnt_deal_partner.GetTitledFirstName]"
 tnt_ai_offer_desc_a1:0 "Ein Herold von [tnt_deal_partner.GetTitledFirstName] wird hereingeführt, den Staub der Straße noch auf dem Mantel, und kommt zur Sache mit der Schroffheit eines Mannes, der hart geritten ist.\n\nSein Herr will keinen Streit mit Euch. Er bittet um einen beschworenen Pakt: #high zehn Jahre#! lang zieht keiner von Euch das Schwert gegen den anderen – und er hat Münze mitgebracht, um das Versprechen zu binden, denn ein Wort kostet nichts, und das weiß er."
 tnt_ai_offer_desc_a2:0 "[tnt_deal_partner.GetTitledFirstName] schickt keinen Schreiber, sondern einen Verwandten, und schon das ist die halbe Botschaft.\n\nWas er vorschlägt, ist ein beschworenes Militärbündnis: Eure Banner und die seinen gemeinsam erhoben, jeder von Euch frei, den anderen zu rufen, wenn der Krieg kommt – wie Ihr beide wisst, dass er kommen wird."
 tnt_ai_offer_desc_a3:0 "Der Gesandte von [tnt_deal_partner.GetTitledFirstName] spricht leise und bittet um nichts, was sich auf einer Waage wiegen ließe.\n\nSein Herr hätte lieber Euer Wort: einen geschuldeten Gefallen, einzufordern zu einer Stunde seiner eigenen Wahl. Schulden dieser Art werden stets im denkbar ungünstigsten Augenblick eingetrieben – und genau das macht sie wert, gekauft zu werden."
 tnt_ai_offer_desc_a9:0 "[tnt_deal_partner.GetTitledFirstName] schickt weder Geschenk noch Schmeichelei, nur eine Erinnerung.\n\nEs steht ein Gefallen aus, und der Gesandte ist gekommen, ihn eingelöst zu sehen. Was er auf den Tisch legt, ist keine Bittschrift, sondern eine Abrechnung: Die Schuld wird laut benannt, und die Bedingungen unten sind es, die sie begleichen."
 tnt_ai_offer_desc_a5:0 "Der Gesandte von [tnt_deal_partner.GetTitledFirstName] setzt sich nicht und gibt auch nicht vor, dies sei Staatskunst.\n\nMänner und Frauen seines Hauses und seiner Lehnstreue verfaulen in Euren Kerkern. Sein Herr will sie heim haben, und er hat genug mitgebracht, um Euch den Verlust des Kerkermeisters zu vergüten."
 tnt_ai_offer_desc_a6:0 "Diese Gesandtschaft trifft mit Herolden, Hörnern und einem Zug von Zeugen ein: [tnt_deal_partner.GetTitledFirstName] will, dass alle Welt sieht, was hier unterzeichnet wird.\n\nDer Inhalt ist ein beiderseitiger Pakt über #high zehn Jahre#!, und um ihn öffentlich zu besiegeln, tritt er Euch vor den versammelten Höfen etwas von seinem eigenen [prestige|E] ab. So laut erkaufter Friede lässt sich von keiner Seite leicht verleugnen."
 tnt_ai_offer_desc_a8:0 "[tnt_deal_partner.GetTitledFirstName] schreibt von Grenzen und von Münze. Es gibt Land von Euch – in den Bedingungen unten benannt –, das unter seinem Banner natürlicher läge, und er kauft es lieber ehrlich, als still danach zu gieren. Der Preis ist in voller Höhe ausgewiesen; das Siegel wartet auf Eure Antwort."
 tnt_ai_offer_desc_a10:0 "[tnt_deal_partner.GetTitledFirstName] bietet Land. Eine Besitzung von ihm – unten benannt – ist ihm mehr Last als Segen, und er sähe sie lieber in Euren Händen und seine Truhen schwerer. Der Preis, der von Euch verlangt wird, steht unter den Bedingungen."
 tnt_ai_offer_desc_a11:0 "[tnt_deal_partner.GetTitledFirstName] bietet nicht Land, sondern einen rechtmäßigen Weg dorthin: einen Anspruch auf einen seiner eigenen Titel, geschrieben und gesiegelt, der Eure zu erheben ist, wann immer es Euch gutdünkt. Advokatentinte ist billiger als Soldatenblut – wenn auch nicht umsonst, wie die Bedingungen unten bezeugen."
 tnt_ai_offer_desc_a13:0 "Ein Gesandter von [tnt_deal_partner.GetTitledFirstName] enthüllt einen Schatz, der für Eure Augen mitgebracht wurde: ein Stück aus seiner eigenen Halle, in den Bedingungen unten benannt. Es wird für ehrliche Münze angeboten – solche Dinge finden über einen Tisch hinweg anmutiger neue Herren als über ein Schlachtfeld."
 tnt_ai_offer_desc_a14:0 "[tnt_deal_partner.GetTitledFirstName] schreibt Worte, die wenige Herrscher je einem Pergament anvertrauen: Er ist bereit niederzuknien. Sein Reich träte unter Euren Schutz und seine Banner unter die Euren – gegen eine Gegenleistung, die in den Bedingungen unten ausgewiesen ist. Wägt es gut ab; einmal geschworene Treue nimmt man nicht leichthin zurück."
 tnt_ai_offer_desc_a15:0 "[tnt_deal_partner.GetTitledFirstName] bittet um einen Platz an Eurem Herd – nicht für sich, sondern für sein Kind, unten benannt, das an Eurem Hof erzogen werden soll. Ein solches Ziehkind ist zugleich eine Ehre und ein Band zwischen Häusern; was dem Kind beigegeben wird, steht in den Bedingungen."
 tnt_ai_offer_desc_a16:0 "Mein Gesandter überbringt einen Vorschlag, teurer als Gold: Lasst unsere Häuser sich verbinden. Ich biete jemanden meines eigenen Blutes, um jemanden des Euren zu ehelichen, auf dass unsere beiden Linien eine Zukunft teilen. Die Verbindung ist unten benannt; wägt sie ab wie jedes andere Geschäft von mir."
 tnt_ai_offer_desc_a17:0 "[tnt_deal_partner.GetTitledFirstName] schreibt als ein Vasall, der seinen Eid gewogen und schwer befunden hat.\n\nEr bittet darum, aus Eurer Lehnstreue entlassen zu werden – seine Banner wieder die seinen, seine Halle niemandem verantwortlich –, und er bittet nicht umsonst darum: Was er dafür hinlegt, steht unter den Bedingungen. Ein zurückgegebener Eid ist kein gebrochener Eid; leichthin zurückgegeben wird er ebenso wenig."
 tnt_ai_offer_desc_a18:0 "Die Gesandtschaft von [tnt_deal_partner.GetTitledFirstName] kommt nicht mit leeren Händen, und was sie bringt, ist kein Gold.\n\nEin Kind seines eigenen Blutes, unten benannt, wird Euch als Geisel in Obhut gegeben – als Bürgschaft dafür, dass sein Wort Euch gegenüber hält, solange das Kind unter Eurem Dach ist. Was er für ein so teures Pfand verlangt, ist in die Bedingungen geschrieben."
 tnt_ai_offer_desc_a19:0 "[tnt_deal_partner.GetTitledFirstName] hat von einem Mann an Eurem Hof gehört und will ihn haben.\n\nEr ist unten benannt. Man bittet Euch, ihn in seine Dienste zu entlassen, und erwartet den Gefallen nicht umsonst: Die Börse steht unter den Bedingungen. Ein Gefolgsmann ist einer großen Halle eine kleine Sache; der Preis, der für ihn geboten wird, ist es nicht."
 tnt_ai_offer_desc_a20:0 "[tnt_deal_partner.GetTitledFirstName] ist bereit niederzuknien – doch nicht blind.\n\nSein Reich träte unter Eure Krone, zu den Bedingungen, die in den Vertrag unten geschrieben sind: was er Euch entrichten wird und was er für sich selbst zu behalten gedenkt. Zu billigem Preis erkaufte Treue hält länger als genommene. Lest die Bedingungen, ehe Ihr sie besiegelt."
 tnt_ai_offer_desc_generic:0 "Ein Gesandter von [tnt_deal_partner.GetTitledFirstName] wird gemeldet, verneigt sich und legt einen versiegelten Vorschlag auf den Tisch. Die Bedingungen stehen unten geschrieben, in der eigenen Hand seines Herrn, und er wartet auf Eure Antwort."
 tnt_ai_offer_desc_outro:0 "\n\n#weak Eure Diplomaten haben es auf denselben Waagen gewogen, die Ihr selbst benutzt.#!"
 tnt_ai_goal_claim:0 "#weak Eure Kundschafter flüstern: Jenes Haus hegt einen Anspruch auf Euer Land, und Gold erscheint ihm billiger als Blut.#!\n\n"
 tnt_ai_goal_dejure:0 "#weak Eure Rechtskundigen bestätigen es: Das fragliche Land neigt sich nach altem Recht seiner Krone zu – und vergessen hat er das nicht.#!\n\n"
 tnt_ai_goal_kin:0 "#weak Der Grund liegt nicht fern: Sein eigenes Blut sitzt in Eurem Kerker.#!\n\n"
 tnt_ai_goal_menaced:0 "#weak Eure Grenzleute melden: Ein stärkerer Nachbar ragt über sein Land, und er ist dringend auf Freunde angewiesen.#!\n\n"
 tnt_ai_goal_rich:0 "#weak Eure Kaufleute wissen es gewiss: Seine Schatzkammer ächzt unter Gold, das eine Bestimmung sucht.#!\n\n"
 tnt_ai_goal_poor:0 "#weak Eure Kaufleute flüstern: Seine Truhen sind leer, und er ist verzweifelt auf Münze aus.#!\n\n"
 tnt_ai_goal_overdomain:0 "#weak Eure Rechtskundigen bemerken: Er hält mehr Land, als eine Hand mit Recht halten kann – der Überschuss sucht einen Käufer.#!\n\n"
 tnt_ai_goal_heir:0 "#weak An seinem Hof ist es kein Geheimnis: Der Erbe ist mündig und das Ehebett steht leer – er braucht eine Verbindung.#!\n\n"
 tnt_ai_goal_brood:0 "#weak Eure Leute spotten darüber: Seine Hallen wimmeln von Kindern, und jedes davon braucht einen Hof, einen Tisch und einen Lehrer.#!\n\n"
 tnt_ai_goal_schemer:0 "#weak Eure Kundschafter warnen Euch: Jener Hof ist aus Geflüster gebaut, und sein Herr kauft nie ein Versprechen, das er nicht auch einzusetzen gedenkt.#!\n\n"
 tnt_ai_goal_yoke:0 "#weak Eure Verwalter hören es von seinen Dienern: Der Eid liegt jenem Haus schwer auf, und seine Herren sprechen von der alten Freiheit.#!\n\n"
 tnt_ai_goal_talent:0 "#weak Euer Kämmerer nennt den Grund: Seinen Hallen fehlt ein Mann dieses Handwerks, und die Euren haben einen.#!\n\n"
 tnt_ai_goal_surety:0 "#weak Eure Gesandten lesen es unverstellt: Er will seinen guten Glauben über jeden Zweifel von Euch hinausheben und wird dafür Blut verpfänden.#!\n\n"
 tnt_ai_goal_might:0 "#weak Eure Grenzleute melden: Sein Heer steht gesammelt und müßig, und er zählt seit einer Weile Eure Aufgebote.#!\n\n"
 tnt_ai_goal_blank:0 ""
 tnt_ai_offer_opt_accept:0 "Diese Bedingungen annehmen"
 tnt_ai_offer_opt_counter:0 "Den Verhandlungstisch öffnen"
 tnt_ai_offer_counter_tt:0 "#high Öffnet Euer eigenes Verhandlungsfenster, seine Bedingungen bereits darauf ausgebreitet.#! Ändert jede davon, streicht, was Euch missfällt, fügt eigene Forderungen hinzu – und schickt den Vertrag umgeformt zurück. Nichts ist zugesagt, ehe Ihr „Vorschlagen“ drückt."
 tnt_ai_offer_opt_decline:0 "Ihn fortschicken"
 tnt_ai_offer_opt_hush:0 "Ihn fortschicken und keine Gesandtschaften mehr empfangen"
 tnt_ai_offer_hush_tt:0 "#high Zehn Jahre#! lang tritt kein Herrscher mit einem Vertrag an Euch heran."
 tnt_ai_demand_title:0 "Eine Forderung von [tnt_deal_partner.GetTitledFirstName]"
 tnt_ai_demand_desc_a21:0 "Der Gesandte von [tnt_deal_partner.GetTitledFirstName] bringt weder Geschenk noch Vorschlag. Er nennt eine Summe und sagt, es täte seinem Herrn leid, wenn man ihm einen Grund gäbe, sie selbst zu holen. Dann bleibt er stehen und wartet, und setzt sich nicht."
 tnt_ai_demand_desc_outro:0 "\n\n#weak Zahlt, und die Welt wird hören, dass Ihr gezahlt habt. Schickt ihn fort, und die Welt wird auch das hören.#!"
 tnt_ai_demand_opt_pay:0 "Ihm zahlen, was er fordert"
 tnt_ai_demand_pay_tt:0 "#high Das Geld wird abgezählt, und der Gesandte zieht zufrieden ab.#! Sein Name wächst daran, und wer davon hört, wird ihn leichter fürchten. Fünfzehn Jahre lang wird er nicht wieder fordern."
 tnt_ai_demand_opt_refuse:0 "Ihn mit leeren Händen fortschicken"
 tnt_ai_demand_refuse_tt:0 "#high Er bekommt nichts.#! Doch ein Gesandter kam in Euren Saal, nannte einen Preis und ging ohne Antwort wieder — Euer Hof hat es gesehen, und Euer Ansehen leidet darunter. Sein eigener Name leidet ebenfalls: eine abgewiesene Drohung ist eine gemessene Drohung. Fünfzehn Jahre lang wird er nicht wieder fordern."
 tnt_ai_demand_refuse_free_tt:0 "#high Er bekommt nichts, und es kostet Euch nichts.#! Euer Heer ist nicht mehr jenes, das er gezählt hat. Sein Name leidet darunter, und fünfzehn Jahre lang wird er nicht wieder fordern."
 tnt_ai_offer_row_alliance:0 "Ein zwischen Euch geschworenes Militärbündnis"
 tnt_ai_offer_row_truce:0 "Ein Nichtangriffspakt zwischen Euch für zehn Jahre"
