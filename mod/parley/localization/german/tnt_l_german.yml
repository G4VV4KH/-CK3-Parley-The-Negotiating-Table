 tnt_action_can_lean_on:0 "@dread_icon! Ihr habt die Oberhand"
 tnt_action_can_lean_on_label:0 "@dread_icon! Ihr könnt Druck auf [recipient.GetPrimaryTitle.Custom('GetTierIcon')][recipient.GetUINameNoTooltip] ausüben"
 tnt_action_can_lean_on_desc:0 "[recipient.GetUIName] – auf ihn könnt Ihr Druck ausüben: Euer Heer, Euer Name und Euer Schrecken, jedes gegen das seine gemessen, erreichen das Gewicht, das eine Drohung braucht, und Eure letzte Drohung ist vergessen. Legt die Drohung auf den Tisch, und genau dieses Gewicht kommt zu dem hinzu, was er zu tragen bereit ist – er zahlt mehr, nur um das Gespräch zu beenden."
 tnt_action_can_lean_on_click:0 "#I Klicken, um einen Vertrag auszuhandeln#!"
 tnt_action_can_lean_on_combined_label:0 "[recipient.GetPrimaryTitle.Custom('GetTierIcon')] [recipient.GetUINameNoTooltip]"
 tnt_action_can_lean_on_combined_group_label:0 "@dread_icon! Herrscher, über die Ihr die Oberhand habt"
 tnt_action_can_lean_on_combined_group_name:0 "@dread_icon! Herrscher, auf die Ihr Druck ausüben könnt"
 tnt_action_can_lean_on_combined_group_description:0 "Unter Euren eigenen Vasallen, Euren Lehnsherren und den Nachbarn an Euren Grenzen wie jenseits des Wassers könnt Ihr auf jeden dieser Herrscher Druck ausüben: Euer Heer, Euer Name und Euer Schrecken, jedes gegen das seine gemessen, erreichen das Gewicht, das eine Drohung braucht, und Eure letzte Drohung ist vergessen. Eröffnet mit einem von ihnen Verhandlungen und setzt das Häkchen bei „Ihm drohen“, um die Drohung auf den Tisch zu legen."
 tnt_msg_stale:0 "Die Bedingungen haben sich geändert"
 tnt_err_deal_changed:0 "Die Vereinbarung kann in dieser Form nicht mehr erfüllt werden; nichts wurde ausgetauscht."
