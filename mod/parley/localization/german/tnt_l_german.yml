 tnt_ai_offer_row_contract:0 "Der Vertrag seiner Lehnstreue, so wie er ihn geschrieben sehen will (geänderte Bedingungen: [GetPlayer.MakeScope.ScriptValue('tnt_ob_changed_value')|0]):"
 tnt_ai_offer_row_marriage:0 "Zwischen den Häusern wird eine Heirat vorgeschlagen:"
 tnt_ai_offer_row_usehook_r:0 "Er fordert einen [hook_i] Gefallen ein, den Ihr ihm schuldet"
 tnt_ai_offer_row_word_kept:0 "Er ist von diesem Geschäft nicht mehr angetan, doch er hat es angeboten und wird dazu stehen"
 tnt_ai_gift_line:0 "Aus hoher Wertschätzung geschickt: Die Bedingungen sind mehr wert als das, was dafür verlangt wird. Dieser Brief ist ein bewusstes Geschenk."
 tnt_refuse_envoys_decision:0 "Keine Gesandtschaften mehr empfangen"
 tnt_refuse_envoys_decision_desc:0 "Leise geht das Wort über jede Straße und in jeden Hafen: Dieser Hof hört Vertragsboten nicht länger an. Herrscher mit Vorschlägen mögen sie behalten. Eure eigenen Gesandten reiten wie zuvor – der Riegel liegt von innen vor, und er liegt in Eurer Hand."
 tnt_refuse_envoys_decision_tooltip:0 "Kein Herrscher tritt mit einem Vertrag an Euch heran, bis Ihr es anders bestimmt. Verhandlungen, die Ihr selbst eröffnet, bleiben unberührt."
 tnt_refuse_envoys_decision_confirm:0 "Den Riegel vorlegen"
 tnt_refuse_envoys_decision_effect_tt:0 "Kein Herrscher tritt mit einem Vertrag an Euch heran, bis Ihr diese Entscheidung zurücknehmt."
 tnt_accept_envoys_decision:0 "Wieder Gesandtschaften empfangen"
 tnt_accept_envoys_decision_desc:0 "Der Riegel wird gehoben und den Torwächtern gesagt, sie sollen beiseitetreten: Vertragsboten dürfen wieder vorgelassen werden, ihre Siegel unversehrt, ihre Angebote auf denselben Waagen gewogen wie eh und je."
 tnt_accept_envoys_decision_tooltip:0 "Gesandtschaften mit Verträgen erreichen Euren Hof wieder, von diesem Tage an."
 tnt_accept_envoys_decision_confirm:0 "Die Tore öffnen"
 tnt_accept_envoys_decision_effect_tt:0 "Gesandtschaften mit Vertragsangeboten können Euren Hof wieder erreichen – sofort, nicht erst dann, wenn das alte Schweigen abgelaufen wäre."
 decision_group_type_tnt_uninstall:0 "Entscheidungen zur Mod-Entfernung"
 tnt_uninstall_decision:0 "Den Verhandlungstisch zusammenklappen"
 tnt_uninstall_decision_desc:0 "Die Gesandten sind entlassen, die Aufzeichnungen verbrannt, der Tisch selbst aus der Halle getragen. Trefft diese Entscheidung unmittelbar bevor Ihr den Mod entfernt: Sie fegt jede Spur, die Parley in dieser Welt hält, aus dem Spielstand. Unbeantwortete Briefe und halbfertige Verhandlungen werden ungültig; jeder bereits geschlossene Vertrag bleibt bestehen."
 tnt_uninstall_decision_tooltip:0 "Bereitet diesen Spielstand auf ein Spiel ohne Parley: The Negotiating Table vor. Entfernt jede Variable, jedes Druckmittel und jede Meinung, die der Mod geschrieben hat, bei jedem Charakter der Welt. Abgeschlossene Geschäfte – Heiraten, abgetretene Titel, Treueeide – bleiben unangetastet."
 tnt_uninstall_decision_confirm:0 "Rein fegen"
 tnt_uninstall_decision_effect_tt:0 "Jede Variable, jede Liste, jede Charakterflagge, jedes Druckmittel und jede Meinung, die Parley geschrieben hat, wird von jedem Charakter der Welt entfernt. Jeder unbeantwortete Angebotsbrief und jede halbfertige Verhandlung werden ungültig. Speichert das Spiel und deaktiviert dann den Mod: Der Spielstand ist nun frei von Parley."
 tnt_ai_msg_treaty:0 "Ein Vertrag wird geschlossen"
 tnt_ai_msg_tt_truce:0 "Sie haben mit Gold einen zehnjährigen Frieden erkauft."
 tnt_ai_msg_tt_ally:0 "Sie haben mit Gold ein Militärbündnis erkauft."
 tnt_ai_msg_tt_hook:0 "Einer schuldet dem anderen nun einen Gefallen, mit Gold erkauft."
 tnt_ai_msg_tt_hookcall:0 "Eine Schuld wurde eingefordert: Einer von beiden hielt ein [hook|E] über den anderen und ließ sich in Gold auszahlen."
 tnt_ai_msg_tt_ultimatum:0 "Gold hat nur in eine Richtung den Besitzer gewechselt. Der Schwächere von beiden zahlte dafür, in Ruhe gelassen zu werden."
 tnt_ai_msg_tt_title:0 "Land hat gegen Gold den Besitzer gewechselt: Einer der beiden Herrscher hat dem anderen eine Grafschaft abgekauft."
 tnt_ai_msg_tt_vassal:0 "Ein Reich hat sich gebeugt: Der schwächere Herrscher hat dem stärkeren die Treue geschworen, für Gold und Schutz."
 tnt_ai_msg_tt_submission:0 "Ein Reich hat sich der Drohung gebeugt: Ein erdrückend stärkerer Herrscher zwang einen schwächeren unabhängigen Nachbarn ohne Zahlung zum Treueeid."
 tnt_ai_msg_tt_artifact:0 "Ein Schatz hat gegen Gold den Besitzer gewechselt: Einer der beiden Herrscher hat dem anderen ein Stück aus dessen Halle abgekauft."
 tnt_ai_msg_tt_wed:0 "Zwei Häuser sind verbunden: Die Herrscher haben eine Heirat zwischen ihrer Verwandtschaft vereinbart, und eine Mitgift aus Gold ging damit einher."
 rule_tnt_ai_treaties:0 "Parley: Verträge zwischen KI-Herrschern"
 setting_tnt_ai_treaties_off:0 "Deaktiviert"
 setting_tnt_ai_treaties_off_desc:0 "KI-Herrscher schließen niemals hinter Eurem Rücken Verträge miteinander.\n\n#weak Kostet überhaupt nichts: eine Abfrage im Jahr und keine weitere Arbeit. Mit #high Euch#! kann die KI weiterhin handeln.#!"
 setting_tnt_ai_treaties_rare:0 "Gelegentlich"
 setting_tnt_ai_treaties_rare_desc:0 "Benachbarte KI-Herrscher schließen gelegentlich Geschäfte miteinander – über die ganze Karte hinweg etwa eine Handvoll Verträge im Jahr.\n\nGold, geschuldete Gefallen, eingeforderte Schulden, Ultimaten und Artefakte werden auf diesem Wege gehandelt; wo die Parteien einander ohnehin gewogen sind, mag eine Grenzgrafschaft zum vollen Wert verkauft oder ein schwächerer Nachbar für einen Treueeid bezahlt werden. Ein erdrückend stärkerer König oder Kaiser kann stattdessen einen schwächeren unabhängigen Nachbarn unter Drohung zum Treueeid zwingen. #high Auch Heiraten zwischen Häusern werden still gehandelt, und niemand wird vorher gefragt.#! Ihr erfahrt davon, sooft ein Vertrag jemanden betrifft, an den Ihr grenzt, mit dem Ihr verbündet seid oder gegen den Ihr Krieg führt."
 setting_tnt_ai_treaties_common:0 "Häufig"
 setting_tnt_ai_treaties_common_desc:0 "Etwa das Dreifache von „Gelegentlich“, für eine Karte, deren Höfe unablässig reden.\n\nDieselben handelbaren Bedingungen und dieselbe Dreijahresgrenze für jeden Herrscher, damit es sich nicht verselbstständigt.\n\n#weak Dies ist die Voreinstellung.#!"
 rule_tnt_ai_offer_rate:0 "Parley: an Euch gerichtete Angebote"
 setting_tnt_ai_offer_rate_off:0 "Nie"
 setting_tnt_ai_offer_rate_off_desc:0 "Kein Herrscher schreibt Euch je mit einem eigenen Vertrag.\n\n#weak Ihr könnt weiterhin selbst mit jedem Verhandlungen eröffnen, und KI-Herrscher handeln weiterhin untereinander, sofern jene Regel es zulässt.#!"
 setting_tnt_ai_offer_rate_rare:0 "Selten"
 setting_tnt_ai_offer_rate_rare_desc:0 "Nur hin und wieder trifft ein Brief ein – rechnet mit Jahren der Stille zwischen zwei Gesandten.\n\n#weak Für ein Spiel, in dem Ihr lieber selbst der Fragende seid.#!"
 setting_tnt_ai_offer_rate_normal:0 "Gewöhnlich"
 setting_tnt_ai_offer_rate_normal_desc:0 "Ein Nachbar schreibt Euch höchstens einmal im Jahr, und jeder Herrscher wartet drei Jahre, ehe er ein weiteres Angebot verfasst."
 setting_tnt_ai_offer_rate_frequent:0 "Häufig"
 setting_tnt_ai_offer_rate_frequent_desc:0 "Gesandte sprechen mehrmals im Jahr vor, und Herrscher besinnen sich weit früher wieder auf Euch.\n\nJedes Angebot wird weiterhin auf denselben Waagen bewertet, die Ihr im Verhandlungsfenster seht; eine geschäftigere Karte ist also keine großzügigere.\n\n#weak Dies ist die Voreinstellung.#!"
 setting_tnt_ai_offer_rate_test:0 "Test – sehr häufig"
 setting_tnt_ai_offer_rate_test_desc:0 "#N Zum Prüfen des Mods, nicht zum Spielen.#! Die Wartezeiten sind auf wenige Wochen gekürzt, ein Angebot sollte Euch also binnen Monaten nach Spielbeginn erreichen.\n\n#weak Prüft damit, dass die Briefe ankommen, und stellt die Regel danach wieder auf „Häufig“.#!"
 rule_tnt_ai_telemetry:0 "Parley: Diagnoseprotokoll"
 setting_tnt_ai_telemetry_off:0 "Aus"
 setting_tnt_ai_telemetry_off_desc:0 "Keine Diagnoseaufzeichnung, was zum Spielen das Richtige ist.\n\n#weak Dies ist die Voreinstellung und kostet nichts: eine Regelabfrage überall dort, wo sonst eine Zeile geschrieben worden wäre.#!"
 setting_tnt_ai_telemetry_on:0 "An"
 setting_tnt_ai_telemetry_on_desc:0 "Schreibt für jede Entscheidung, die ein KI-Herrscher über einen Vertrag trifft, eine Zeile in #high error.log#!: wen er erwogen hat, was er auf den Tisch gelegt hat, wie er das Geschäft bewertet hat und #high warum er sich abgewandt hat#!.\n\nEtwa 600 bis 1600 Zeilen je halbem Spieljahr. Das Spielgeschehen wird in keiner Weise beeinflusst.\n\n#weak Schaltet dies vor einem langen unbeaufsichtigten Lauf ein und schickt das Protokoll danach zum Lesen ein.#!"
 setting_tnt_ai_telemetry_verbose:0 "Ausführlich"
 setting_tnt_ai_telemetry_verbose_desc:0 "Wie „An“, und zusätzlich eine Zeile je KI-Herrscher und Jahr, genommen vor dem Würfelwurf zwischen den KI-Herrschern.\n\nTausende zusätzlicher Zeilen. Das Einzige, was es einbringt, ist die Unterscheidung zwischen #high der Puls lief nie#! und #high er lief, und die Würfel sagten Nein#!.\n\n#weak Nur für einen kurzen Bestätigungslauf.#!"
 rule_tnt_threat_scale:0 "Parley: Drohungen am Tisch"
 setting_tnt_threat_scale_rare:0 "Selten"
 setting_tnt_threat_scale_rare_desc:0 "Koeffizient N = 2,5. Jede Drohung benötigt #high mindestens 100 Vertragspunkte#!. Bei gleichem Prestige und Schrecken ist dafür ein Heeresverhältnis von 41:1 nötig.\n\n#weak Höheres Prestige und größerer Schrecken senken die nötige militärische Überlegenheit. Eine volle Prestigestufe unter dem Ziel setzt den Drohwert auf null. Diese Regeln gelten für Spieler und KI.#!"
 setting_tnt_threat_scale_normal:0 "Normal"
 setting_tnt_threat_scale_normal_desc:0 "Koeffizient N = 5. Jede Drohung benötigt #high mindestens 100 Vertragspunkte#!. Bei gleichem Prestige und Schrecken beträgt das Mindestverhältnis der Heere #high 21:1#!.\n\nHöheres Prestige und größerer Schrecken senken die nötige militärische Überlegenheit. Eine volle Prestigestufe unter dem Ziel setzt den Drohwert auf null.\n\n#weak Standardeinstellung. Diese Regeln gelten für Spieler und KI.#!"
 setting_tnt_threat_scale_frequent:0 "Häufig"
 setting_tnt_threat_scale_frequent_desc:0 "Koeffizient N = 7,5. Jede Drohung benötigt weiterhin #high mindestens 100 Vertragspunkte#!.\n\n#weak Höheres Prestige und größerer Schrecken senken die nötige militärische Überlegenheit. Eine volle Prestigestufe unter dem Ziel setzt den Drohwert auf null. Diese Regeln gelten für Spieler und KI.#!"
 setting_tnt_threat_scale_constant:0 "Allgegenwärtig"
 setting_tnt_threat_scale_constant_desc:0 "Koeffizient N = 10. Jede Drohung benötigt #high mindestens 100 Vertragspunkte#!. Bei gleichem Prestige und Schrecken beträgt das Mindestverhältnis der Heere #high 11:1#!.\n\n#weak Höheres Prestige und größerer Schrecken senken die nötige militärische Überlegenheit. Eine volle Prestigestufe unter dem Ziel setzt den Drohwert auf null. Diese Regeln gelten für Spieler und KI.#!"
 tnt_mutual_header:0 "Zwischen Euch beiden"
 tnt_bd_domain_p:0 "Titel über ihrer Domänenschwelle – ihnen weniger wert"
 tnt_bd_domain_r:0 "Titel über Eurer Domänenschwelle – Euch weniger wert"
 tnt_tt_step_huge_add:0 "Fügt auf einen Schlag einen großen Betrag hinzu.\n\n#weak Gold, Prestige und Frömmigkeit: 1000 je Klick. Einfluss: 250, denn Einfluss selbst geht nie über 1000 hinaus.#!"
 tnt_tt_step_huge_sub:0 "Nimmt auf einen Schlag einen großen Betrag weg.\n\n#weak Gold, Prestige und Frömmigkeit: 1000 je Klick. Einfluss: 250, denn Einfluss selbst geht nie über 1000 hinaus.#!"
 tnt_preset_open:0 "…"
 tnt_tt_preset_open:0 "Legt einen Betrag mit einem Klick fest.\n\n#weak Ein üblicher Betrag, die Hälfte des Vorhandenen, alles Erschwingliche oder gar nichts.#!"
 tnt_preset_menu_header:0 "Wie viel?"
 tnt_preset_std_gold:0 "Ein Jahreseinkommen"
 tnt_preset_std_gift:0 "Ein übliches Geschenk"
 tnt_preset_half:0 "Die Hälfte"
 tnt_preset_max:0 "Alles, was ich kann"
 tnt_preset_max_r:0 "Alles, was er kann"
 tnt_preset_none:0 "Nichts"
 tnt_tt_preset_std_gold:0 "Bietet ein Jahreseinkommen.\n\n#weak Begrenzt auf das, was wirklich in der Schatzkammer liegt.#!"
 tnt_tt_preset_std_gift:0 "Bietet den üblichen Betrag für einen Gefallen dieser Größe – das, was ein Herrscher dieses Ranges erwartet.\n\n#weak Begrenzt auf das, was wirklich vorhanden ist. Prestige, Frömmigkeit und Einfluss haben kein Jahreseinkommen, es gibt davon also keinen „Jahreswert“ anzubieten.#!"
 tnt_tt_preset_half:0 "Bietet die Hälfte des Vorhandenen."
 tnt_tt_preset_max:0 "Bietet alles, was aufgebracht werden kann."
 tnt_tt_preset_none:0 "Nimmt diese Währung vom Tisch."
 tnt_autobalance_btn:0 "Selbstausgleich"
 tnt_tt_autobalance:0 "Passt Gold, Prestige, Frömmigkeit und Einfluss auf dem Tisch so lange an, bis das Angebot für die Gegenseite gerade eben annehmbar ist.\n\nEs wirkt in beide Richtungen: Es versüßt ein Angebot, das abgelehnt würde, und es #high beschneidet eines, das zu leicht angenommen würde#!, damit Ihr niemals zu viel zahlt.\n\n#weak Es fügt nichts anderes hinzu – kein Land, keinen Anspruch, keine Heirat, keinen Gefallen – und es bietet niemals mehr, als tatsächlich bezahlt werden kann.#!"
 tnt_ab_state_balanced:0 "#P Ausgeglichen.#! Das Angebot liegt nun knapp innerhalb dessen, was die Gegenseite annimmt."
 tnt_ab_state_minimal:0 "Bereits am Minimum. Es war nichts zu ändern."
 tnt_ab_state_unreachable:0 "#N Außer Reichweite.#! Die Gegenseite lehnt weiterhin ab, selbst mit allem, was Ihr zahlen könnt."
 tnt_ab_state_closest:0 "Annehmbar. Mit den verfügbaren Ressourcen konnte der automatische Ausgleich +1 nicht erreichen."
 tnt_ab_lumpy_hint:0 "Drückt erneut, um weiter hinzuzufügen. Was dieser Knopf hinzugefügt hat und Ihr danach entfernt habt, wird nicht erneut angeboten."
 tnt_ab_lumpy_line:0 "Seine Börse war leer, darum hat der letzte Druck stattdessen Bedingungen von seiner Seite des Tisches genommen: Land, einen Anspruch oder seine Lehnstreue."
 tnt_stage_marriage_interaction:0 "Verbindung zum Vertrag hinzufügen"
 tnt_stage_marriage_send:0 "Diese Verbindung zum Vertrag hinzufügen"
 tnt_stage_marriage_prompt:0 "#high Eine nahe genug Verbindung bringt das Bündnis nun mit sich#! - dasselbe, das das Spiel für seine eigene arrangierte Heirat gewährt, an dem Tag, an dem der Vertrag besiegelt wird."
 tnt_stage_no_alliance_tt:0 "#high Eine in diesen Vertrag geschriebene Verbindung stiftet nun ein Bündnis.#! Das ist die Regel des Spiels selbst und nicht die dieses Mods: Das Spiel wiegt ab, wie nah jeder der beiden mit dem Herrscher verwandt ist, der ihn weggibt, und ist das Paar auf beiden Seiten nah genug, so seid Ihr und er verbündet, sobald der Vertrag besiegelt ist – genau wie es die spieleigene #high $arrange_marriage_interaction$#! seit jeher tut. Niemand kauft an diesem Tisch [alliances|E]: Eine solche Bedingung steht nicht auf dem Blatt und wird nie darauf stehen; sie kommt schlicht mit der Ehe.\n\n#weak Den Bündnishinweisen, die das Spiel selbst in diesem Fenster zeichnet, darf man daher wieder trauen – dem Stärkebalken „Mögliches Bündnis“ neben jedem Anwärter und den kleinen gekrönten Wappen daneben. Sie sitzen in der Anwärterliste, und die Liste verschwindet in dem Augenblick, in dem beide Bildnisse gewählt sind, sodass davon nichts mehr auf der Seite steht, wenn Ihr dies lest; doch der Spruch unmittelbar über diesem Absatz antwortet für das Paar vor Euch, und es ist die Antwort des Spiels selbst und keine Vorhersage.#!\n\n#weak Das Bündnis ruht auf dem Paar selbst: Es währt genau so lange wie deren Verbindung und endet mit ihr, durch das eigene Werk des Spiels. Ist eines der beiden noch ein Kind, wird das Paar verlobt statt vermählt, und das Bündnis steht vom ersten Tag an auf diesem Verlöbnis. Ein Vertrag darf mehrere Paare tragen, und jedes wird für sich beurteilt.#!"
 tnt_stage_alliance_opens_tt:0 "#high Diese Verbindung STIFTET ein Bündnis zwischen Euch und ihm.#! Keine Tür, an die später zu klopfen wäre, sondern das Bündnis selbst, an dem Tag, an dem der Vertrag besiegelt wird, sobald diese beiden vermählt oder verlobt sind. Es ist die Regel des Spiels selbst, genau jene, der auch seine #high $arrange_marriage_interaction$#! folgt: Es wiegt ab, wie nah jeder der beiden mit dem Herrscher verwandt ist, der ihn weggibt, und dieses Paar ist auf beiden Seiten nah genug. Mehr wird von Euch nicht verlangt, und ablehnen kann er es nicht – es kommt mit dem Vertrag.\n\n#high Das ist [SCOPE.ScriptValue('tnt_stage_alliance_offer_value')|+=0] Vertragspunkte wert – und die stecken BEREITS in der Zahl, die oben für diese Verbindung steht. Zählt sie kein zweites Mal hinzu.#! Ein Vertrag zahlt das Bündnis nur einmal: Öffnet es bereits ein Paar, das schon auf dem Tisch liegt, so schlägt dieses hier nichts mehr auf den Preis, sondern wird ein zweiter Grund, auf dem der Pakt ruht."
 tnt_stage_alliance_shut_tt:0 "#high Diese Verbindung stiftet KEIN Bündnis.#! Das Spiel misst, wie nah jeder der beiden mit dem Herrscher verwandt ist, der ihn übergibt, zählt beide Abstände zusammen und gewährt das Bündnis nur, solange diese Summe klein bleibt. Eine Verbindung zweier Höflinge macht niemanden an diesem Tisch verwandt – ein solches Paar verbündet niemanden, und ein Fremder aus der eigenen Halle ist nicht besser. Vermählt Euer eigenes Blut mit seinem – ein Kind, ein Enkelkind, einen Bruder oder eine Schwester, einen Elternteil – oder tretet selbst vor den Altar, und die Summe bleibt innerhalb der Grenze des Spiels. Es ist dieselbe Regel, die auch die spieleigene #high $arrange_marriage_interaction$#! lenkt, und sie wird auf beiden Seiten zugleich gemessen: Eine nahe Wahl auf Eurer Seite wiegt eine ferne auf seiner nicht auf."
 tnt_stage_alliance_already_tt:0 "#high Ihr seid bereits sein Verbündeter, und diese Verbindung stiftet daher keinen neuen Pakt.#! Einen Pakt, den Ihr schon haltet, schließt man kein zweites Mal: Das Bündnis schlägt keine Vertragspunkte auf diese Verbindung, und der Vertrag lässt Euch nichts dafür zahlen. Ist das Paar nah genug verwandt, um der Regel des Spiels selbst zu genügen, so wird die Vermählung schlicht als ein weiterer Grund vermerkt, auf dem das Bündnis ruht, das Ihr bereits habt; ist sie es nicht, so bleibt das Bündnis genau so, wie es war. In beiden Fällen ist die Verbindung selbst weiterhin die oben genannten Punkte wert, und der Pakt zwischen Euch und ihm bleibt unberührt."
 actor_secondary_tnt_stage_marriage_interaction:0 "Euer Kandidat"
 recipient_secondary_tnt_stage_marriage_interaction:0 "Sein Kandidat"
 tnt_stage_pair_points_line:0 "Diese Verbindung verschiebt den Vertrag um [SCOPE.ScriptValue('tnt_stage_pair_deal_delta_value')|+=0] – genau so weit bewegt sich die Waage im Verhandlungsfenster, wenn Ihr sie auf den Tisch legt.\n#weak Geboten [SCOPE.ScriptValue('tnt_stage_pair_gain_value')|0], verlangt [SCOPE.ScriptValue('tnt_stage_pair_loss_value')|0], und das Bündnis, das diese Verbindung stiftet: [SCOPE.ScriptValue('tnt_stage_alliance_offer_value')|+=0]. Diese drei Zahlen SIND die Zahl darüber – das Bündnis steckt darin, niemals obendrauf. Er bewertet Euer Angebot mit x[SCOPE.ScriptValue('tnt_deal_mult_value')|2], und eine Prachthochzeit ist, wenn Ihr sie versprecht, [SCOPE.ScriptValue('tnt_stage_grand_offer_value')|+=0] dieses Angebots wert.#!\n#weak Die EIGENE Zeile dieses Paares im Vertrag trägt eine andere Zahl: [SCOPE.ScriptValue('tnt_stage_pair_raw_net_value')|+=0] – die Verbindung für sich, vor seiner Wertschätzung und vor dem Bündnis. Beide stimmen; die Waage zeigt die erste.#!\n#weak Ab der zweiten Verbindung im selben Vertrag ist die erste Zahl eine SCHÄTZUNG und nicht der genaue Ausschlag: Auf den gesamten Heiratsstapel greift ein Mengenrabatt, und die Prachthochzeit wie auch die Furcht zwischen euch beiden werden NUR EINMAL JE VERTRAG bezahlt, aber in der Zeile jeder Verbindung erneut mitgezählt. Die Abweichung kann Dutzende Punkte betragen, nach oben wie nach unten. Bei der ersten Verbindung stimmt die Zahl genau.#!"
 tnt_stage_grand_info:0 "$GRAND_WEDDING_PROMISE_INFO$\n\n#high [SCOPE.ScriptValue('tnt_stage_grand_offer_value')|+=0] Vertragspunkte wert#! für dieses Paar, zusätzlich zur Verbindung selbst.\n\n#weak Sie bleiben VERLOBT, bis Ihr das Fest wirklich ausrichtet. #high Das Bündnis wartet nicht auf das Fest#! - es steht auf dem Verlöbnis selbst, von dem Tag an, an dem der Vertrag besiegelt wird, und währt genau so lange wie dieses. Der gewöhnliche Hinweis des Spiels für ein verlobtes Paar, das nun heiraten darf, schweigt bei einem Paar mit versprochener großer Hochzeit absichtlich - stattdessen übernimmt der Hinweis „Große Hochzeit ausrichten“ dieses Paar, und er erreicht denjenigen, der das Versprechen gab.#!"
 tnt_stage_marriage_desc:0 "Ihr wählt eine Verbindung für den Vertrag, der auf dem Tisch liegt. #high Ihr schickt kein Heiratsangebot.#!\n\nDer breite Knopf unten trägt vom Spiel selbst die Aufschrift #high „Vorschlag abschicken“#!, und dieser Wortlaut lässt sich hier nicht ändern. Er schickt nichts ab und vermählt niemanden: Er schreibt dieses Paar in den Vertrag, den Ihr aushandelt, neben das Gold und das Land, und die Bedingungen des Vertrags werden mit der Verbindung darin neu bewertet.\n\n#high Niemand wird vermählt und niemand verlobt, ehe die andere Seite den ganzen Vertrag annimmt.#! Wird der Vertrag abgelehnt oder fallengelassen, hat es die Verbindung schlicht nie gegeben.\n\n#weak Wählt aus jedem Haushalt eine Person, legt die Abstammungslinie fest und bestätigt. Kommt so oft wieder, wie Ihr mögt – ein Vertrag darf beliebig viele Paare tragen.#!\n\n#weak Das Spiel blendet in diesem Fenster seine eigenen Hinweise zu Bündnissen ein – #high Ihr dürft ihnen wieder glauben#!. Eine im Vertrag geschlossene Verbindung trägt nun dasselbe Bündnis, das auch die spieleigene #high $arrange_marriage_interaction$#! trägt, und zwar nach der Regel des Spiels selbst: Es wiegt ab, wie nah jeder der beiden mit dem Herrscher verwandt ist, der ihn weggibt, und ist das Paar auf beiden Seiten nah genug, so seid Ihr und er verbündet, sobald der Vertrag besiegelt ist.#!\n\n#weak Der Spruch über das Paar, das Ihr tatsächlich gewählt habt, steht weiter oben, und es ist die Antwort des Spiels selbst und keine Vermutung – ein und dieselbe Prüfung entscheidet jene Zeile und das Bündnis. Eine Verbindung zweier Höflinge verbündet weiterhin niemanden. Das Bündnis ruht auf dem Paar: Es währt so lange wie deren Verbindung; und ist eines der beiden noch ein Kind, so steht es vom ersten Tag an auf dem Verlöbnis.#!"
 tnt_btn_stage_marriage:0 "Eine Verbindung auf dem klassischen Bildschirm wählen"
 tnt_btn_stage_marriage_full:0 "$tnt_item_marriage_desc$\n\n$tnt_btn_stage_marriage_tip$"
 tnt_btn_stage_marriage_tip:0 "Öffnet den spieleigenen Heiratsbildschirm: beide Haushalte nebeneinander, alle Filter und die Suche, die zwei Porträts und die Abstammungslinie.\n\n#high Er vermählt niemanden.#! Das Paar, das Ihr dort bestätigt, wird in diesem Vertrag vermerkt, und die Hochzeit – oder das Verlöbnis, falls eines der beiden ein Kind ist – findet erst statt, wenn der ganze Vertrag geschlossen ist.\n\n#weak Achtet auf den Wortlaut des Spiels: Der breite Knopf in jenem Fenster liest sich „Vorschlag abschicken“. Er schickt niemandem einen Vorschlag, er fügt das Paar hier hinzu. Dieselben zwei Personen lassen sich auch von Hand aus den Listen unten wählen, und nur dort kann ein Paar, das bereits im Vertrag steht, seine Linie ändern.#!"
 tnt_marriage_stage_note:0 "#weak Nichts wird verschickt und niemand vermählt sich – das Paar wird in diesem Vertrag vermerkt.#!"
 tnt_err_grand_host:0 "Ihr könnt jetzt keine Prachthochzeit versprechen: Dazu braucht es einen belehnten Herrscher von höherem Rang als ein Baron, #high Tours and Tournaments#! mit seinen erweiterten Aktivitäten, Gold genug zum Ausrichten und kein noch offenes Versprechen von Euch.\n\n#weak Und es ist ein Versprechen: Das geehrte Paar wird verlobt, Ihr werdet zum versprochenen Gastgeber, und das Fest auszurichten und zu bezahlen bleibt Eure Sache. Lasst das Versprechen verfallen, und das gebrochene Wort bleibt in Erinnerung.#!"
 tnt_err_grand_taken:0 "In diesem Vertrag ist bereits eine Prachthochzeit versprochen. Nehmt sie zuerst im Heiratsblatt des Vertrags heraus: ein Vertrag, ein Fest, ein geehrtes Paar."
 tnt_intro_title:0 "Die Kunst des Vertrags"
 tnt_intro_desc_main:0 "Aus Eurer Kanzlei ist das Wort ergangen: Dieser Hof verhandelt fortan auf die neue Weise. Jeder Herrscher kann an den Tisch gerufen werden – Gold gegen Lehnstreue gewogen, eine Braut gegen einen Waffenstillstand, ein Gefallen gegen eine Krone –, und jede Bedingung liegt auf einer einzigen Waage, derselben für beide Seiten.\n\n"
 tnt_intro_desc_rate_normal:0 "Rechnet dann und wann mit Gesandtschaften: Nicht mehr als ein Brief im Jahr findet Euch, aus aller Welt zusammen, und ein Herrscher, von dem Ihr einmal gehört habt, brütet an die drei Jahre, ehe er erneut schreibt."
 tnt_intro_desc_rate_frequent:0 "Rechnet mit gut berittener Straße vor Euren Toren: Kaum ein halbes Jahr vergeht zwischen einer Gesandtschaft und der nächsten, und Herrscher besinnen sich noch im selben Jahr wieder auf Euch."
 tnt_intro_desc_rate_rare:0 "Rechnet mit langem Schweigen: Jahre werden zwischen zwei Briefen vergehen, und das Fragen bleibt zumeist Euch überlassen."
 tnt_intro_desc_rate_off:0 "Es werden keine Briefe kommen: Eure Tore sind Gesandtschaften verschlossen, und jedes Verhandeln beginnt bei Euch."
 tnt_intro_desc_rate_test:0 "Den Boten wurde befohlen zu laufen, nicht zu reiten: Ein Angebot sollte Euch binnen weniger Monate finden. Ein Tempo zum Prüfen, keines für den Hof."
 tnt_intro_desc_world_rare:0 " Jenseits Eurer Grenzen dient dieselbe Waage im Stillen: Dann und wann schließen zwei Höfe ein eigenes Geschäft, und Kunde davon erreicht Euch, wenn es Euch berührt."
 tnt_intro_desc_world_common:0 " Jenseits Eurer Grenzen schwingt dieselbe Waage geschäftig: Fremde Höfe schließen das ganze Jahr über eigene Geschäfte."
 tnt_intro_desc_world_off:0 " Jenseits Eurer Grenzen gilt der alte Brauch: Die neue Weise wird nur an Tischen geübt, an denen Ihr selbst sitzt."
 tnt_intro_desc_close:0 "\n\nUm selbst einen Herrscher an den Tisch zu rufen, klickt ihn mit der rechten Maustaste an und wählt #high Vertrag aushandeln#!."
 tnt_intro_opt_ok:0 "Dann an den Tisch."

