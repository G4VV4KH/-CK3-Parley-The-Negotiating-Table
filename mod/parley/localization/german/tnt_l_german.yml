 tnt_err_ally_at_war:0 "Ihr könnt kein Bündnis schließen, solange Ihr miteinander im Krieg steht."
 tnt_err_ally_same_realm:0 "Ein Bündnis innerhalb eines Reiches kann nicht aufgerufen werden: Ein Lehnsherr und sein [vassal|E] können einander nicht in den Krieg rufen."
 tnt_err_ally_hegemon:0 "Ein Hegemon nimmt Tributzahler, keine Verbündeten."
 tnt_err_ally_not_ruler:0 "Beide Parteien müssen freie, nicht gefangene Herrscher sein."
 tnt_err_truce_same_realm:0 "Ihr beide könntet niemals gegeneinander zu Felde ziehen, und ein Pakt braucht zwei Herrscher, die es könnten: zwei unabhängige Fürsten oder zwei Vasallen einer Krone. Hier gibt es nichts zu versprechen."
 tnt_err_truce_self:0 "Ihr könnt Euch selbst keinen Frieden versprechen."
 tnt_err_vassal_self:0 "Ihr könnt Euch selbst keine Treue schwören."
 tnt_err_vassal_own_vassal:0 "Die Partei, welche die Treue empfangen soll, ist bereits Vasall der Partei, die sie schwören soll."
 tnt_err_vassal_not_independent:0 "Nur ein unabhängiger Herrscher hat eigene Lehnstreue zu vergeben."
 tnt_err_vassal_mutual_war:0 "Treue kann erst geschworen werden, wenn der Krieg zwischen den beiden Parteien beendet ist."
 tnt_err_vassal_government:0 "Diese Regierungsform kann Lehnstreue weder geben noch empfangen: Eine Söldnerkompanie, ein Ritterorden und ein landloser Abenteurer stehen allesamt außerhalb der Lehnskette."
 tnt_err_vassal_sworn_order:0 "Hier ist keine Lehnstreue zu haben. Einer der beiden steht gänzlich außerhalb der Lehnskette, gebunden durch Gelübde, über die keine Krone gebietet, oder durch gar nichts gebunden, und kein Vertrag kann eine solche Partei zum Lehnsherrn oder zum Vasallen machen."
 tnt_err_vassal_confederation:0 "Ein Mitglied einer Konföderation kann keine Treue schwören."
 tnt_err_vassal_state:0 "Beide Parteien müssen lebend, belehnt und in Freiheit sein."
 tnt_err_vassal_limit:0 "Die Partei, welche die Treue empfangen soll, hat unter ihrer [vassal_limit|E] keinen Platz mehr frei."
 tnt_err_vassal_tier:0 "Ein Vasall muss im Rang unter seinem Lehnsherrn stehen."
