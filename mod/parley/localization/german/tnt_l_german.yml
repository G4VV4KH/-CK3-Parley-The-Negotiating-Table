 tnt_err_grand_no_host:0 "Ihr könnt keine Prachthochzeit ausrichten: Dazu braucht es einen belehnten Herrscher von höherem Rang als ein Baron, und Ihr müsst frei sein, um Gäste zu empfangen."
 tnt_err_grand_no_gold:0 "Ihr könnt Euch keine Prachthochzeit als Gastgeber leisten."
