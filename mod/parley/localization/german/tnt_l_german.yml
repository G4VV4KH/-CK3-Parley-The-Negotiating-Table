 tnt_err_session_changed:0 "Diese Bestätigung gehört nicht mehr zum geöffneten Verhandlungstisch. Nichts wurde ausgetauscht; kehrt zu den aktuellen Bedingungen zurück und sendet sie erneut."
 tnt_err_title_realm_mix:0 "Ein Vertrag kann nicht zugleich Titel übertragen und Vasallität oder Unabhängigkeit ändern. Entfernt eine dieser Bedingungen."
 tnt_msg_accepted:0 "Der Vertrag ist besiegelt"
 tnt_msg_rejected:0 "Das Angebot ist abgelehnt"
