 tnt_truce_negotiated:0 "Ausgehandelter Waffenstillstand"
 tnt_truce_nonwar:0 "Nichtangriff geschworen"
 rule_tnt_advanced_terms:0 "Parley: erweiterte Bedingungen"
 setting_tnt_advanced_terms_on:0 "Aktiviert"
 setting_tnt_advanced_terms_on_desc:0 "Verlöbnisse, abgetretene Titel und geschworene Lehnstreue dürfen am Verhandlungstisch gehandelt werden. Schaltet es ab, und KI-Herrscher tragen auch keine Heiraten mehr brieflich an."
 setting_tnt_advanced_terms_off:0 "Deaktiviert"
 setting_tnt_advanced_terms_off_desc:0 "Verlöbnisse, abgetretene Titel und geschworene Lehnstreue sind vom Verhandlungstisch verborgen."
 rule_tnt_trade_prestige:0 "Parley: Prestigehandel"
 setting_tnt_trade_prestige_on:0 "Aktiviert"
 setting_tnt_trade_prestige_on_desc:0 "Prestige darf am Verhandlungstisch mit jedem Partner geboten und gefordert werden – von Euch und von KI-Herrschern gleichermaßen. Die weiteste der drei Einstellungen."
 setting_tnt_trade_prestige_peer:0 "Nur Ebenbürtige und Geringere"
 setting_tnt_trade_prestige_peer_desc:0 "Prestige darf nur mit einem Herrscher gehandelt werden, dessen Ruhmstufe nicht über der Euren liegt – Ruhm wird nicht nach oben verkauft. Setzt Euch einem Berühmteren gegenüber, und beide Prestigezeilen verschwinden für diese Verhandlung einfach, der Ausgleichsknopf gibt kein Prestige aus, und keiner seiner Briefe fordert je welches. Bei allen anderen ändert sich nichts."
 setting_tnt_trade_prestige_off:0 "Deaktiviert"
 setting_tnt_trade_prestige_off_desc:0 "Prestige wird niemals gehandelt, mit niemandem: Beide Prestigezeilen verschwinden vom Verhandlungstisch, der Ausgleichsknopf gibt niemals Prestige aus, und kein KI-Angebot enthält je welches. Gold, Frömmigkeit und Einfluss bleiben unberührt."
 rule_tnt_trade_piety:0 "Parley: Frömmigkeitshandel"
 setting_tnt_trade_piety_on:0 "Aktiviert"
 setting_tnt_trade_piety_on_desc:0 "Frömmigkeit darf am Verhandlungstisch mit jedem Partner geboten und gefordert werden – von Euch und von KI-Herrschern gleichermaßen. Die weiteste der vier Einstellungen."
 setting_tnt_trade_piety_faith:0 "Nur gleicher Glaube"
 setting_tnt_trade_piety_faith_desc:0 "Frömmigkeit darf nur zwischen zwei Herrschern desselben Glaubens gehandelt werden – Hingabe zählt vor fremder Geistlichkeit nichts. Setzt Euch einem Partner anderen Glaubens gegenüber, und beide Frömmigkeitszeilen verschwinden für diese Verhandlung einfach, der Ausgleichsknopf gibt keine Frömmigkeit aus, und keiner seiner Briefe fordert je welche."
 setting_tnt_trade_piety_religion:0 "Nur gleiche Religion"
 setting_tnt_trade_piety_religion_desc:0 "Frömmigkeit darf gehandelt werden, sobald beide Herrscher dieselbe Religion teilen, auch wenn ihr Glaube sich unterscheidet: Ein Katholik und ein Orthodoxer handeln weiterhin mit Hingabe, ein Katholik und ein Sunnit nicht. Bei einem Partner anderer Religion verschwinden beide Frömmigkeitszeilen für diese Verhandlung einfach, der Ausgleichsknopf gibt keine Frömmigkeit aus, und keiner seiner Briefe fordert je welche."
 setting_tnt_trade_piety_off:0 "Deaktiviert"
 setting_tnt_trade_piety_off_desc:0 "Frömmigkeit wird niemals gehandelt, mit niemandem: Beide Frömmigkeitszeilen verschwinden vom Verhandlungstisch, der Ausgleichsknopf gibt niemals Frömmigkeit aus, und kein KI-Angebot enthält je welche. Gold, Prestige und Einfluss bleiben unberührt."
