 tnt_picker_rule_hostage:0 "Hier erscheinen nur nahe Verwandte, die rechtmäßig Bürgschaft leisten dürfen. Wer anderswo in diesem Vertrag bereits versprochen ist, wird nicht angeboten."
 tnt_picker_rule_ward:0 "Hier erscheinen nur Kinder, die noch jung genug sind, um anderswo erzogen zu werden, und nur solche ohne eigenen Vormund."
 tnt_picker_rule_courtier:0 "Hier erscheinen nur Höflinge, denen es freisteht zu gehen: keine Ratsmitglieder, keine Rivalen, keine belehnten Vasallen. Wählt so viele, wie das Geschäft trägt."
 tnt_picker_rule_subject:0 "Hier erscheinen nur unmittelbare Vasallen mit mindestens einer Grafschaft, die im Rang unter dem empfangenden Herrscher stehen und mit allen Beteiligten Frieden halten: kein Regent, kein Erbe und niemand, den ein Vertrag in den letzten drei Jahren verschoben hat. Wählt so viele, wie das Geschäft trägt."
