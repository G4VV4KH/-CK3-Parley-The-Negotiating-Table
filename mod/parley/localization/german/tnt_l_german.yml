 tnt_ai_offer_row_artifact_r:0 "Er bietet einen Schatz aus seiner Halle, unten benannt (gewählt: [GetPlayer.MakeScope.ScriptValue('tnt_count_sel_artifact_r_value')|0])"
 tnt_ai_offer_row_vassal_r:0 "Er bietet an, Treue zu schwören und Euer Vasall zu werden"
