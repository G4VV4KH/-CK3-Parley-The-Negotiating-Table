 # TWO FAMILIES OF COUNTER, BOTH LIVE, AND THAT IS DELIBERATE.
 #   tnt_sel_count_*   the multi-select PANEL's own counter line
 #                     (gui\tnt_panel_multiselect.gui:345, :931, :1027, :1101,
