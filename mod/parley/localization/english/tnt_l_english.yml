 # ===================================================================
 # THE DEMAND - tnt_ai_offer.0003, archetype A21 (B2, 2026-08-23).
 # The AI's extortion letter to the player. These are event title / desc /
 # option-name / option-custom_tooltip keys, so LAW 10a DOES NOT APPLY and
 # [..] tokens are legal here - the same surface tnt_ai_offer_title and
 # tnt_ai_offer_counter_tt already ship tokens on.
 # The two refusal tooltips are a matched pair and BOTH must stay true:
 # _refuse_tt promises a prestige loss, _refuse_free_tt is the out-grown
 # waiver (T53 no longer passes at click time, so the refusal is free).
 # The event branches between them on exactly the trigger the effect uses.
 # NEITHER NAMES A NUMBER: the rung is 75 or 150 prestige by the size of the
 # pressure, and a literal in prose would be the stale-figure defect this
 # file has already paid for once - see tnt_item_threat_desc, section C.
 # ===================================================================
 tnt_ai_demand_title:0 "A Demand from [tnt_deal_partner.GetTitledFirstName]"
 tnt_ai_demand_desc_a21:0 "The envoy of [tnt_deal_partner.GetTitledFirstName] brings no gift and no proposal. He names a sum, and says his master would be sorry to be given a reason to come and collect it himself. Then he stands and waits, and does not sit."
 tnt_ai_demand_desc_outro:0 "\n\n#weak Pay him, and the world will hear that you paid. Send him away, and the world will hear that too.#!"
 tnt_ai_demand_opt_pay:0 "Pay him what he asks"
 tnt_ai_demand_pay_tt:0 "#high The coin is counted out and the envoy leaves satisfied.#! His name grows by it, and men who hear of this will find him easier to fear. He will not ask again for fifteen years."
 tnt_ai_demand_opt_refuse:0 "Send him away empty-handed"
 tnt_ai_demand_refuse_tt:0 "#high He gets nothing.#! But an envoy came into your hall, named a price, and left unanswered — your court has seen it, and your standing suffers for it. His own name suffers too: a threat that is refused is a threat that has been measured. He will not ask again for fifteen years."
 tnt_ai_demand_refuse_free_tt:0 "#high He gets nothing, and it costs you nothing.#! Your host is no longer the one he counted. His name suffers for it, and he will not ask again for fifteen years."
