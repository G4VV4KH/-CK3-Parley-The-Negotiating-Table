 # --- Y. Game rule, AI-to-AI treaties (7) -------------------------------
 # The second sanctioned exception to the tnt_ prefix. The three _desc values
 # are where this rule is DOCUMENTED for the player, which the brief requires:
 # each one states the rate, names what the silent pulse may trade - now
 # including E20/E21's county sale and paid fealty - and states what it costs.
 # The rule gates ONE thing: the silent AI-to-AI pulse of tnt_72_ai_world.txt.
 # 2026-08-19 TOMBSTONE. The sentence that stood here - "it does NOT gate the
 # three interactions of section W, which are ordinary interactions the player
 # can see and answer" - is struck as false on both halves. Section W is RETIRED
 # (its own header says so), and the file it argued about,
 # common\character_interactions\tnt_11_ai_interactions.txt, NEVER SHIPPED - see
 # the tombstone at tnt_81_ai_rules.txt:11-20. The pulse is the only thing this
 # rule has ever gated. Kept, not deleted, so the wrong claim cannot be re-made.
 rule_tnt_ai_treaties:0 "Parley: AI-to-AI treaties"
 setting_tnt_ai_treaties_off:0 "Disabled"
 setting_tnt_ai_treaties_off_desc:0 "AI rulers never conclude treaties with one another behind your back.\n\n#weak Costs nothing at all: one lookup a year, and no further work. The AI can still bargain with #high you#!.#!"
 setting_tnt_ai_treaties_rare:0 "Occasional"
 setting_tnt_ai_treaties_rare_desc:0 "Neighboring AI rulers occasionally strike bargains with one another - roughly a handful of treaties a year across the whole map.\n\nGold, favors owed, debts called in, ultimatums and artifacts are traded this way; where the parties are already friendly, a border county may be sold for its full worth, or a weaker neighbor paid to swear fealty. An overwhelmingly stronger king or emperor may instead force a weaker independent neighbor to swear fealty under threat. #high Marriages between houses are traded silently too, and no one is asked first.#! You are told whenever a treaty involves somebody you border, are allied to, or are fighting."
 setting_tnt_ai_treaties_common:0 "Frequent"
 setting_tnt_ai_treaties_common_desc:0 "About three times the rate of Occasional, for a map whose courts are always talking.\n\nThe same tradeable terms, and the same three-year limit upon each ruler, so it cannot run away with itself.\n\n#weak This is the default.#!"

 # How often an AI ruler sends YOU a composed offer as a letter.
 rule_tnt_ai_offer_rate:0 "Parley: offers sent to you"
 setting_tnt_ai_offer_rate_off:0 "Never"
 setting_tnt_ai_offer_rate_off_desc:0 "No ruler ever writes to you with a treaty of their own.\n\n#weak You can still open negotiations yourself with anyone, and AI rulers still deal with one another if that rule allows it.#!"
 setting_tnt_ai_offer_rate_rare:0 "Rare"
 setting_tnt_ai_offer_rate_rare_desc:0 "A letter arrives only now and then — expect years of quiet between envoys.\n\n#weak For a game where you would rather do the asking.#!"
 setting_tnt_ai_offer_rate_normal:0 "Normal"
 setting_tnt_ai_offer_rate_normal_desc:0 "A neighbour writes to you at most once a year, and each ruler waits three years before composing another offer."
 setting_tnt_ai_offer_rate_frequent:0 "Frequent"
 setting_tnt_ai_offer_rate_frequent_desc:0 "Envoys call several times a year, and rulers reconsider you far sooner.\n\nEvery offer is still priced by the same scales you see in the negotiation window, so a busier map does not mean a more generous one.\n\n#weak This is the default.#!"
 setting_tnt_ai_offer_rate_test:0 "Testing — very frequent"
