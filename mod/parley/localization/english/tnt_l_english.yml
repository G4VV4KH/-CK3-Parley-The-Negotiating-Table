 setting_tnt_ai_telemetry_on:0 "On"
 setting_tnt_ai_telemetry_on_desc:0 "Writes one line to #high error.log#! for every decision an AI ruler makes about a treaty — who it considered, what it put on the table, what it priced the deal at, and #high why it walked away#!.\n\nAbout 600 to 1600 lines per half a game year. Gameplay is not affected in any way.\n\n#weak Turn this on before a long unattended run, then send the log to be read.#!"
 setting_tnt_ai_telemetry_verbose:0 "Verbose"
