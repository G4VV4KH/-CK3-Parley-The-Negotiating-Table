 tnt_err_ward_p_unavailable:0 "You have no child to send into their keeping, or their court cannot raise one."
 tnt_err_ward_r_unavailable:0 "They have no child to send into your keeping, or your court cannot raise one."
 tnt_err_courtier_p_unavailable:0 "Nobody in your court can be handed over — the unwilling, the sworn and the imprisoned all stay."
 tnt_err_courtier_r_unavailable:0 "Nobody in their court can be handed over to you."
 tnt_err_subject_and_vassal:0 "A treaty that carries the fealty of a whole realm has no need of one vassal prised out of it as well. Take the oath off the table, or take the vassal off it."
 tnt_err_subject_r_unavailable:0 "None of their vassals can be handed over to you right now: you must hold land of your own and be willing to take on more subjects, and the two of you must be at peace."
