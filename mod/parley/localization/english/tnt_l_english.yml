  # macro uses (data_binding/tnt_macros.txt:271). An absent variable reads 0,
  # which is what makes absent-means-patrilineal safe - GAME\gui\hud.gui:294
  # relies on the same and carries no Exists guard either.
 tnt_wed_row_line:0 "[Select_CString( GreaterThan_CFixedPoint( Character.MakeScope.Var('tnt_wed_matri').GetValue, '(CFixedPoint)0' ), Localize('tnt_wed_row_line_matri'), Localize('tnt_wed_row_line_patri') )]"
 tnt_wed_row_line_matri:0 "[matrilineal|E]"
 tnt_wed_row_line_patri:0 "[patrilineal|E]"
 tnt_wed_row_line_tip:0 "Which house this couple's children are born into. Click to switch it: #high [patrilineal|E]#! gives them to the father's house, #high [matrilineal|E]#! to the mother's.\n\n#weak Every couple in the treaty carries its own line, and the line is also what decides whether you may host their grand wedding.#!"
  # THE TAPER, TOLD IN WORDS SO NOBODY HAS TO DO ARITHMETIC. The numbers are the
  # script author's: gains x1.00 / 0.95 / 0.90 / 0.85 / 0.80, floored from the
  # fifth couple on, so the marginal match is worth 1.00, 0.90, 0.80, 0.70,
  # 0.60. COSTS ARE NOT TAPERED - if they shrank with volume a player could pad
  # a deal with throwaway matches to dilute a lineality veto.
 tnt_wed_taper:0 "Every couple after the first is worth a little less to them than the one before, while what a match #high costs#! them - an heir given away, a line surrendered - is never discounted.\n\nThree couples are worth about #high 2.7#! single matches; a fifth adds only #high 0.6#!, and past that the gain stops growing at all.\n\n#weak So two or three good matches beat a dozen padded ones.#!"
  # THE GRAND WEDDING. One promise per host, so one honoured couple per treaty,
  # and it is named by READING tnt_wed_principal - never as "the first couple",
  # which a variable list cannot express, and never a couple this text picked.
 tnt_wed_grand:0 "Promise a grand wedding"
 tnt_wed_grand_desc:0 "Give your word to celebrate one of these matches with a great feast. #high The honoured couple is betrothed rather than wed#!, and the other side values the match far more for the honour of it.\n\nWhat you take on: you become the promised host, and your word runs for a few years only. #high Arranging the wedding, summoning the guests and paying for all of it remains yours to do#! - nothing is planned for you, and until you do it the two are betrothed and no more. Let the promise lapse and the broken word will not be forgotten.\n\n#weak One couple in a treaty may be honoured, it must be your own kin, and the dominant line must be yours.#!"
 tnt_wed_grand_couple:0 "A grand wedding is promised to [GetPlayer.MakeScope.Var('tnt_wed_principal').Char.GetShortUIName] and [GetPlayer.MakeScope.Var('tnt_wed_principal').Char.MakeScope.Var('tnt_wed_partner').Char.GetShortUIName]"
 tnt_wed_principal_tag:0 "Grand wedding"
 tnt_wed_set_principal_tip:0 "Give the grand wedding to this couple instead. Only one couple in a treaty can be honoured, and moving the honour costs nothing until the treaty is sealed."
  # FEAR OF YOU - THE DEAL SHEET'S ROW FOR VANILLA'S OWN DREAD BLOCK (V15 item 1).
  # A LABEL AND A DETAIL for tnt_sheet_wed_dread, the row that goes beside
  # tnt_sheet_wed_grand and prints tnt_marriage_dread_value signed - exactly as the
  # taper row above it prints a negative. Vanilla's marriage acceptance carries ten
  # dread rungs and this mod priced none of them, which is why the same match read
  # +150 in the game's own window and about +5 here
  # (GAME\common\scripted_modifiers\00_marriage_scripted_modifiers.txt:1690-1825).
  # WHICH WAY IT CUTS, and that is the whole content of the detail line: every rung
  # measures the PARTNER'S dread of YOU. The more he fears you the more readily he
  # grants a match - most of all as your own vassal, +75 intimidated and +150
  # terrified (:1694-1717, cowed_marriage_reason_value = 150 at
  # 00_basic_values.txt:917) - and only +10 / +20 from outside your realm
  # (:1719-1744). But if the couple is the two of you in person he refuses at the
  # same magnitude, -75 and -150 (:1773-1798), while a match between him and
  # somebody else of yours is +25 / +50 again (:1800-1825).
  # NO TIER IS NAMED IN THE TEXT. tnt_sheet_detail is a text_single 170 px wide
  # (gui\tnt_panels.gui:408, :495-509), so the line must stay one short clause, and
  # the signed number beside it already carries the tier. The player who wants the
  # tier hovers vanilla's own breakdown, where these rows print as COWED_REASON /
