 # --- Y2. Game rule, the weight of a threat (9) --------------------------
 # N, the scale of the threat formula, common\script_values\tnt_57_threat_values.txt
 # (tnt_threat_scale_value) and common\game_rules\tnt_80_game_rules.txt.
 # ONE number does TWO jobs, and the four _desc values must keep saying both:
 # the threat opens when its weight reaches the bar, and THAT SAME WEIGHT is
 # what the threat adds to the treaty (tnt_50_values.txt figure row 5). So the
 # rungs read as MORE THREAT DEALS versus FEWER - the user's own words - and
 # never as bare numbers, which is why no _desc prints N.
 # THE ARITHMETIC BEHIND THE PROSE, so nobody re-words it into a lie: the host
 # a rung asks for at equal fame and equal dread is 1 + 100/N, i.e. 3.00x at
 # Rare, 2.00x at Standard, 1.67x at Frequent, 1.50x at Ever-present; and the
 # weight of a twofold host is N itself, i.e. 50 / 100 / 150 / 200 against the
 # alliance term's own ceiling of 150 (tnt_50_values.txt:1326) - which is why
 # only the Ever-present rung may claim to outweigh a sworn alliance.
 # NO tnt_err_* KEY IS BORN with this rule, by the same principle the currency
 # rungs used (tnt_80_game_rules.txt:175-180): the toggle's surviving reason
 # explains the greyed box, and the rung's own _desc is where the player chose
 # the scale. NO game_rule_category_* key either - game_modes, ai and tweaks
 # all exist in vanilla.
 rule_tnt_threat_scale:0 "Parley: threats at the table"
 setting_tnt_threat_scale_rare:0 "Rare"
 setting_tnt_threat_scale_rare_desc:0 "Coefficient N = 2.5. Every threat needs #high at least 100 deal points#!. With equal prestige and dread, this requires an army ratio of 41:1.\n\n#weak Higher prestige and dread reduce the army advantage required. A full prestige level below the target makes the threat worth zero. The same rules apply to players and AI.#!"
 setting_tnt_threat_scale_normal:0 "Standard"
 setting_tnt_threat_scale_normal_desc:0 "Coefficient N = 5. Every threat needs #high at least 100 deal points#!. With equal prestige and dread, the minimum army ratio is #high 21:1#!.\n\nHigher prestige and dread reduce the army advantage required. A full prestige level below the target makes the threat worth zero.\n\n#weak Default setting. The same rules apply to players and AI.#!"
 setting_tnt_threat_scale_frequent:0 "Frequent"
 setting_tnt_threat_scale_frequent_desc:0 "Coefficient N = 7.5. Every threat still needs #high at least 100 deal points#!.\n\n#weak Higher prestige and dread reduce the army advantage required. A full prestige level below the target makes the threat worth zero. The same rules apply to players and AI.#!"
 setting_tnt_threat_scale_constant:0 "Ever-present"
 setting_tnt_threat_scale_constant_desc:0 "Coefficient N = 10. Every threat needs #high at least 100 deal points#!. With equal prestige and dread, the minimum army ratio is #high 11:1#!.\n\n#weak Higher prestige and dread reduce the army advantage required. A full prestige level below the target makes the threat worth zero. The same rules apply to players and AI.#!"

