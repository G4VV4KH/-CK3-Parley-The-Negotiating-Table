 # ORPHANED and KEPT DEFINED - they were the only two keys on the whole
 # BuildTooltip path to lose their call site this pass, so _docs\tools\
 # tnt_loc_token_check.ps1 now reports two fewer call-site keys and must still
 # exit 0. Both are plain text and carry no [..] token, which is why they were
 # never among the offenders (house law 10). See the note over tnt_item_ward in
