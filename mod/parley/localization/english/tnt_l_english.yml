 # =========================================================================
 # PARLEY: THE NEGOTIATING TABLE - English localization
 #
 # THE KEY SET IS THE SAME IN ALL NINE LANGUAGES, IN THE SAME ORDER - house law
 # 9's fan: english, french, german, japanese, korean, polish, russian,
 # simp_chinese, spanish. A diff of any two files' key columns must come back
 # empty.
 #
 # *** DO NOT TRUST A COUNT WRITTEN IN THIS HEADER. *** It was "570" here for
 # several rounds while the tree carried 615, because every round that adds a
 # key has to remember nine headers and never does. THE LIVE NUMBER IS THE ONE
 # tnt_family_gate.ps1 check 4 prints beside this file's name, and that check is
 # what actually enforces the fan (key-set identity plus token parity per
 # language). Read it there. The per-pass arithmetic further down this header is
 # left as its authors wrote it and has not added up for a long time; it is
 # history, not a measurement.
 # RE-MEASURED IN V16 AND CORRECTED: this heading read 566 in both languages
 # while both files held 570, so it was the heading that had gone stale, not the
 # files - CLAUDE.md section 2.9 and checklist item 4 have both said 570 since
 # the last verification. The four keys the heading missed were added by a pass
 # that never wrote itself a ledger entry below. 570 = 570 is the invariant the
 # check tests; this line is the number it must agree with.
 #
 # V16, USER ITEM 5 - THE WARD / FOSTERAGE FAMILY IS RETIRED: 570 -> 570.
 #   NOT ONE KEY IS ADDED AND NOT ONE IS DELETED. Twelve keys lose their last
 #   reader and all twelve stay DEFINED and marked where they stand. The
 #   authoritative note is over tnt_item_ward in section C; the other eleven
 #   point at it, exactly as the alliance family's orphans point at
 #   tnt_item_alliance. Retiring a family has never once cost this file a key,
 #   and the reason is house law 9: a key present in one language only renders
 #   as its own id in the other, so the two files are pinned to one another and
 #   "tidying up" an orphan is how that pin gets broken.
 #   ONE LIVE KEY IS REWORDED, ID UNCHANGED: tnt_err_people_pair drops its
 #   "hostage and ward" clause. Its trigger keeps only the delegated
 #   independence-versus-fealty rule once the four ward-versus-hostage rows go,
 #   and a greyed button must not name a rule the treaty can no longer break.
 #   It was token-free before and still is.
 #   ARCHETYPE INDEX 15 AND GOAL CODE 9 ARE BURNT and never reused - burnt
 #   indices are now 1, 2, 4, 5, 6, 7, 11, 12, 15 and burnt goal codes 3 and 9.
 #   The letter's desc and its motive line both branch on those numbers, so a
 #   reused one would print a retired archetype's prose over a live letter.
 #
 # V13, USER ITEMS 1 AND 2: 553 -> 566, AND NOT ONE KEY IS DELETED.
 #   +11 (user item 2) Four letter bodies (a17-a20), three motive lines
 #       (yoke/talent/surety) and four summary rows for the four archetypes
 #       that make independence, hostages, courtier transfer and the vassal
 #       contract reachable by the AI. The nine per-obligation detail rows need
 #       NO new keys: tnt_ob_tt_council / _revoke / _war / _fort / _coin / _succ
 #       already exist in section S and self-localize through
 #       GetSubjectContractType().GetObligationName(), and vanilla's own
 #       low_obligations_taxes / low_obligations_levies / religious_protection_tt
 #       cover the rest.
 #   +2  (user item 1) tnt_ai_msg_tt_artifact and tnt_ai_msg_tt_wed in section
 #       X - the AI-to-AI sandbox's replacement content. Retiring the alliance
 #       and the pact took away the only two treaties it ever composed, so the
 #       world gets the artifact sale and the marriage instead.
 #   -0  USER ITEM 1 DELETES NOTHING. It retires three term families - the
 #       alliance, the non-aggression pact and the granted claim - and
 #       THIRTY-EIGHT keys lose their last reference. Every one stays defined
 #       and is marked where it stands; the authoritative note is over
 #       tnt_item_alliance in section C, and five of the thirty-eight are the
 #       reason two script values must stay defined. DO NOT SWEEP THEM.
 #   Two section banners are RE-MEASURED in the same pass: V read (44) while
 #   holding 55 and now reads (66); X read (8), held 8, now reads (10).
 #
 # ITEMS 1, 3, 5 AND 7 PASS: 551 -> 553.
 #   +2  tnt_bd_gain_panel, tnt_bd_relation_panel - the last two _panel twins of
 #       the balance figures, added because the panel's label slot is 169 px and
 #       elides the long desc keys (user item 3). Section D carries the detail.
 #   Item 5 ("many unlocalized variables, e.g. tnt_err_threat_unafraid") ADDED
 #       NOTHING: the premise does not reproduce. Every key referenced anywhere
 #       in the mod resolves, tnt_err_threat_unafraid included, and the run's
 #       error.log shows no tnt_ key missing localization. What the player sees
 #       is a TRUNCATED label, not an untranslated one - which is why the fix
 #       above is a width fix. Do not spend a future pass adding keys for this.
 #   Items 1 and 7 retired the non-aggression promise and the prisoner family.
 #       Their keys are KEPT DEFINED and marked RETIRED where they are defined;
 #       nothing was deleted, and the key count did not fall. See the tombstones
 #       in section C.
 #
 # BUILD 3 RECONCILIATION, DERIVED MECHANICALLY. Every loc-bearing site in the
 # mod was extracted by script and diffed against the defined keys:
 #   .gui   `text = "key"` / `tooltip = "key"` / `Localize('key')`
 #   .txt   desc= / custom_tooltip= / custom_description{text=} / title= /
 #          send_name= / notification_text= / answer_accept_key= /
 #          answer_reject_key= / options_heading= / send_option{localization=} /
 #          event option{name=} / add_truce{name=}
 #   derived  modifier keys, hook-type ids, game-rule + setting ids
 #   data_binding\tnt_macros.txt:268  TntHookTier -> tnt_hook_tier_0..3
 #   v1 shipped 114.  Build 2: 172.  Build 3: +202 = 374.
 #
 # THE 202 ADDITIONS, BY OWNER:
 #   extended marriage editor        22   (sections P)
 #   multi-select + domain counter   22   (Q)
 #   hook tiers                      10   (R)
 #   vassal contract sheet           65   (S)
 #   same-realm alliance              3   (T)
 #   hidden-row gating                1   (U)
 #   the AI's letter                 21   (V)
 #   the three AI interactions       46   (W)
 #   AI-to-AI treaty messages         5   (X)
 #   the AI game rule                 7   (Y)
 # 188 of the 202 are referenced by a live site TODAY. The remaining 14 are
 # FORWARD DECLARATIONS, each marked FORWARD below and each named by the author
 # who will make it live. Policy, unchanged since build 2: an unreferenced key
 # costs nothing, an undefined one prints its raw id on screen.
 #
 # THREE EXISTING KEYS ARE REWORDED IN BUILD 3, ids unchanged:
 #   tnt_item_alliance_desc  - the old text said "either side may call the other
 #       to war", which is FALSE for a liege/vassal pair, a shape build 3 now
 #       permits. NOTES3-gates-interaction.md section 4.2 required this.
 #   tnt_item_marriage_desc  - the old tail said the pair "is chosen for you".
 #       The player now picks both spouses and the line (NOTES3-marriage 3.F).
 #   tnt_item_hook_desc      - the row is no longer one favor but a three-tier
 #       choice, weak / strong / eternal (NOTES3-hooks-contracts 6.1).
 #
 # DELETED AT LAST: tnt_err_marriage_nobody. Integration section 3.D.1 landed -
 # the marriage toggles report tnt_err_no_spouse_p / _r / tnt_err_pair_illegal
 # now (tnt_20_scripted_guis.txt) - so the key lost its final reader and is
 # gone from both languages, exactly as 30-V2-DESIGN section 3.1 scheduled.
 #
 # V5 ADDS 30 KEYS, 487 -> 517, AND REWORDS ONE:
 #   item 19's four new terms - hostage, grant independence, ward, courtier
 #     transfer - own 27 of them: 8 in section C (four row names, four row
 #     tooltips), 8 in section D, 9 in section G, 2 in section Q.
 #     V16: THE WARD IS RETIRED and item 19 is down to three live terms. This
 #     arithmetic is left exactly as V5 wrote it, per the "THE HEADING NUMBER"
 #     policy at the top of the file:
 #     it records a past pass, and the seven ward keys it counted (2 in C, 2 in
 #     D, 3 in G) are all still defined, so the total it feeds is unchanged.
 #   the auto-balance button's lumpy pass owns 2, tnt_ab_lumpy_hint and
 #     tnt_ab_lumpy_line, in the V3-iteration-3 block far below.
 #   item 22 owns 1, tnt_tt_alliance_glut in section C, AND THE REWORDING of
 #     tnt_relmod_ally in section E: the -15-per-existing-ally block is gone
 #     from tnt_relmod_ally_value (tnt_51_relation_values.txt:684-707 is now a
 #     bare +10), so the old label "Existing alliances" promised a penalty the
 #     row no longer holds. That charge is a multiplier inside the alliance
 #     term now, with no breakdown row of its own - which is the whole reason
 #     tnt_tt_alliance_glut has to exist.
 # tnt_tt_alliance_glut is this pass's ONLY forward declaration: no .gui was in
 # the scope of the author who wrote it. The other 29 are read by a live site
 # today - the four terms' rows and pickers shipped in gui\tnt_diplomacy_window
 # .gui, gui\tnt_panels.gui and gui\tnt_panel_people.gui in the same pass.
 #
 # THE PARLEY PASS: 526 -> 538 KEYS, AND THE BRAND LEAVES THE VALUES.
 #   Before this pass both files held 526 keys, not the 517 the older
 #   arithmetic above reaches: item 19's nine refusal keys
 #   (tnt_err_hostage_p_unavailable .. tnt_err_people_pair) shipped without a
 #   ledger entry. This pass: +12 in section V (six letter bodies a8-a15 of
 #   the ruling-supersession wave, six summary rows), +2 in section X (the
 #   sandbox's title and fealty tooltips), -2 in section N2 (the pause
 #   decision retired the message pair - see the tombstone there). Every
 #   VALUE that carried "Total War Diplomacy" now reads "Parley", and the two
 #   AI-treaty rule descriptions stopped claiming titles and fealty are never
 #   traded silently - E20/E21 in tnt_38_ai_world.txt trade exactly those,
 #   under their own tight gates.
 #
 # THE GIFT-MARKER PASS: 537 -> 538, AND THE LEDGER IS SET STRAIGHT.
 #   ONE key added, tnt_ai_gift_line in section V - the letter row for
 #   var:tnt_ai_gift (user items 5+9), FORWARD to author:gui, marked where it
 #   stands. The old head-count 538 was ONE HIGH against the files, which
 #   held 537: V7's deletion of tnt_bd_ally_inrealm - section T's only key -
 #   was never subtracted (that banner now reads an honest 0), and section
 #   P's banner still said 22 over the 24 keys the section actually holds.
 #   The pass totals above are HISTORY and stand as written; the live truth
 #   is the count at the head of this file and the section banners.
 #   The same pass REWORDS four keys in place, ids unchanged:
 #   tnt_ai_offer_row_title_p / _title_r / _claim_r / _artifact_r read as
 #   count statements from the days when the count was all the letter showed;
 #   the widget now names every object in rows underneath
 #   (tnt_offer_summary.gui:422-810), so each head points at those rows
 #   ("named below") and keeps its count in the plural-proof label form.
 #
 # THE MARRIAGE-LETTER PASS: 538 -> 540, AND A FALSE WARNING IS DEFUSED.
 #   TWO keys added in section V for archetype A16, the composed marriage
 #   offer: tnt_ai_offer_desc_a16, the letter's prose
 #   (events\tnt_ai_events.txt:1056), and tnt_ai_offer_row_marriage, the head
 #   line over the letter's pair rows (tnt_offer_summary.gui:848) - the
 #   couple itself reuses the shipped tnt_wed_pair_row, so there is no third
 #   key. The same pass REWORDS ONE key in place, tnt_err_too_many: its old
 #   text claimed a domain limit that no cap and no price enforce for claims
 #   or artifacts - the visible face of the "artifacts count toward the
 #   domain limit" bug - and only tnt_domain_warning may speak of domains.
 #   The key is unreachable today and held as the future cap warning; its
 #   own comment in section Q carries the whole ruling.
 #
 # KNOWINGLY ACCEPTED ORPHANS - defined, referenced nowhere:
 #   tnt_err_vassal_invalid   (build 2; T15's nine specific reasons replaced it)
 #   tnt_picker_available / tnt_picker_chosen are NO LONGER orphans - build 3
 #   instantiates tnt_multiselect_columns, gui\tnt_panels.gui:1310, :1342 and
 #   gui\tnt_panel_multiselect.gui:591, :664.
 #   tnt_err_ally_same_realm is referenced only by the defined-but-uncalled
 #   T14 (tnt_40_triggers.txt:814), which the tnt_41_gates.txt:309-316 ruling
 #   keeps on purpose; tnt_err_truce_same_realm is LIVE again - V5 item 3 put
 #   the row into T21 (tnt_41_gates.txt:633). Neither may be deleted.
 #
 # SECTIONS D, E and the rows marked [DESC ROW] CARRY NO VALUE TOKEN. They are
 # `desc` rows of script values or of an interaction's ai_accept;
 # GetScriptValueBreakdown and GetAcceptanceBreakdown render the number in their
 # own right-aligned column, so a value macro inside the label prints it twice
 # (project law R10). That applies to all 36 of section D, all 8 of section E,
 # the 9 tnt_bd_ob_* rows (tnt_bd_ally_inrealm was deleted with its variable in V7; the 18 tnt_ai_bd_* rows
 # left with section W's interactions).
 # Every OTHER key may use $tokens$, [datafunctions] and the colour tags
 # #high #low #weak #P #N #I, each closed with #!.
 #
 # Datafunctions used in loc, every one proven in vanilla loc (none invented):
 #   [GetPlayer.MakeScope.ScriptValue('x')|0]
 #        GAME\localization\english\buildings_l_english.yml:2341
 #   [GetPlayer.MakeScope.Var('x').GetValue|0]
 #        GAME\localization\english\activities\coronation_activity_l_english.yml:196
 #   [GetPlayer.MakeScope.Var('x').Char.GetShortUIName]
 #        dotted traversal through a variable: activities\survey_activity_l_english.yml:697
 #   [<saved_scope>.GetTitledFirstName]   8526 vanilla uses
 #   [GetSubjectContractType( 'T' ).GetObligationName( 'L' )]        1224 vanilla uses
 #   [GetSubjectContractType( 'T' ).GetObligationNameShortNoTooltip( 'L' )]
 #        GAME\localization\english\dlc\tgp\dlc_tgp_faction_l_english.yml:168, :170,
 #        :172, :174.  *** GetObligationNameNoTooltip DOES NOT EXIST (W-7) ***
 #   [Character.GetAge]                   in a datamodel row's own scope
 # Text icons: [gold_i] [prestige_i] [piety_i] [influence_i] [hook_i]
 # [artifact_i]. Concept links: [prestige|E] [piety|E] [influence|E] [vassal|E]
 # [claim|E] [truce|E] [vassal_contract|E] [obligation|E] [domain_limit|E]
 # [prestige_level|E] [culture|E] [innovation|E] [matrilineal|E]
 # [patrilineal|E] [county|E] [development|E] - all attested in vanilla loc.
 # Loc-key tokens: $innovation_battlements$ $innovation_currency_02$
