 # --- T. An alliance inside one realm (0) -------------------------------
 # Build 3 permits a liege and their vassal to ally; such an alliance still
 # cannot be CALLED in either direction
 # (GAME\common\scripted_triggers\00_war_and_peace_triggers.txt:166-221), and
 # tnt_item_alliance_desc in section C says so to the player. The special-
 # cased row that renamed itself over this fact - a second, weaker species of
 # alliance - was REMOVED with the uniform-alliance ruling (the REMOVED box
 # at tnt_41_gates.txt:93): the .gui binds plain keys now, so the rename pair
 # tnt_item_alliance_inrealm / tnt_tt_ally_inrealm lost its last reader and
 # is deleted from both languages.
 # FORWARD (author:values). Needed only if the balance takes NOTES3-gates
 # section 1.8's recommendation and prices a same-realm alliance at 0.35 of a
 # summonable one. [DESC ROW] NO VALUE TOKEN.

 # --- U. Hidden-row gating (1) ------------------------------------------
 # Structural impossibility now HIDES a row instead of disabling it, so most of
 # section J is rarely seen. This one key exists because deleting the
 # same-realm row from tnt_truce_anyrealm_available_trigger would otherwise
 # have left that wrapper with zero reasons. The death path normally closes the
 # window first; this is the belt.
 # V13, USER ITEM 1: ORPHANED, KEPT DEFINED - T21, the wrapper this key was
 # written to keep non-empty, is retired with the pact. Section C has the
 # reason. This section now holds no live key at all.
