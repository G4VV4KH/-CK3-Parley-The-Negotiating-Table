  # 0 or 1 here. The count moved into this detail when the marriage head rows were
  # deleted, so tnt_wed_count keeps its other callers and loses none of its uses.
 tnt_item_wed_taper:0 "Volume discount"
 tnt_wed_taper_detail:0 "[GetDataModelSize( GetPlayer.MakeScope.GetList('tnt_wed_list') )|v0] couples: each further match is worth less than the first"
