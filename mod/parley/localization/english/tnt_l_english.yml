  # --- P2. Unlimited marriages and the grand-wedding promise (29) ----------
  #     V3 ITERATION 4, in the user's own words: "an UNLIMITED number of
  #     marriages in one deal, and also a GRAND WEDDING option".
  #
  # THE DEAL HOLDS A LIST OF COUPLES NOW - tnt_wed_list, one member per couple.
  # The member IS the player-side spouse and the other half lives ON that member
  # as tnt_wed_partner, because a CK3 variable list has no index access from
  # script or from gui and two parallel lists could therefore never be zipped
  # into pairs. Everything below that names a couple reads the pair off ONE
  # character: tnt_wed_pair_row and tnt_wed_row_line are evaluated with the
  # row's own Character in context; tnt_wed_grand_couple has no row to stand in,
  # so it walks tnt_wed_principal instead.
  #
  # WHY THE COUNT IS COMPUTED IN LOC AND NOT BY A SCRIPT VALUE. A .gui `text =`
  # is one expression and cannot pass a parameter to a loc key - the same reason
  # section Q's counters look the way they do - but loc CAN read a data model's
  # size, and vanilla does exactly that at
  # GAME\localization\english\ledger\ledger_filtersorts_l_english.yml:441. So no
  # value had to be invented (R2), and the number cannot drift from the list
  # below it because it IS the list.
  #
  # THE WORD "PROMISE" IS LOAD-BEARING AND IS NOT A HEDGE. The mechanism is
  # vanilla's own set_grand_wedding_betrothal_variables: the honoured couple is
  # BETROTHED, the player becomes the promised host, a countdown runs and
  # vanilla warns him before it lapses. This mod creates no activity and
  # schedules nothing - arranging and paying for the feast stays the host's job,
  # and vanilla's own penalty falls on him if he never does it. Nothing in this
  # section may be reworded into "a grand wedding will be held".
 tnt_wed_col:0 "Marriages in this treaty"
 tnt_wed_count:0 "Couples in this treaty: [GetDataModelSize( GetPlayer.MakeScope.GetList('tnt_wed_list') )|v0]"
