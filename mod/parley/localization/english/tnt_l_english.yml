 # --- V2. The embassy door (10) - user item 11 ----------------------------
 # Two decisions in common\decisions\tnt_85_decisions.txt, one latch between
 # them: refusing sets the UNTIMED var:tnt_envoys_refused (plus the same
 # ten-year cooldown write the letter's hush option makes), accepting removes
 # both - so the door opens AT ONCE, not when the old silence would have
 # lapsed, and the two _effect_tt keys state exactly that split. The bare
 # <decision> key is the title and <decision>_confirm the button, both
 # engine-derived; desc / selection_tooltip / custom_tooltip are named
 # explicitly (tnt_85_decisions.txt:86-96, :129-139). Only arriving LETTERS
 # are stopped: negotiations the player opens himself are untouched, and
 # both texts say so.
 tnt_refuse_envoys_decision:0 "Receive No More Embassies"
 tnt_refuse_envoys_decision_desc:0 "The word is passed quietly along every road and into every harbor: this court is done listening to treaty-bearers. Rulers with proposals may keep them. Your own envoys ride as before - the door is barred from the inside, and the bar is in your hand."
 tnt_refuse_envoys_decision_tooltip:0 "No ruler will approach you with a treaty until you say otherwise. Negotiations you open yourself are untouched."
 tnt_refuse_envoys_decision_confirm:0 "Bar the door"
 tnt_refuse_envoys_decision_effect_tt:0 "No ruler will approach you with a treaty until you reverse this decision."
 tnt_accept_envoys_decision:0 "Receive Embassies Again"
 tnt_accept_envoys_decision_desc:0 "The bar is lifted and the gate wardens are told to stand aside: treaty-bearers may once more be shown in, their seals unbroken, their offers weighed on the same scales as ever."
 tnt_accept_envoys_decision_tooltip:0 "Embassies bearing treaties may reach your court again, from this very day."
 tnt_accept_envoys_decision_confirm:0 "Open the gates"
 tnt_accept_envoys_decision_effect_tt:0 "Embassies with treaty offers can reach your court again - at once, not when the old silence would have lapsed."

 # The core uninstall decision (common\decisions\tnt_86_uninstall.txt): the
 # pre-unsubscribe sweep, same five-key scheme as the envoy pair above. Its
 # whole sweep body is variable removal, which draws no auto-tooltip (law
 # 10), so the _effect_tt key carries the entire player-facing consequence:
 # what is removed (everything the mod wrote, on every character), what is
 # voided (unanswered letters, half-built negotiations), what stands (every
 # concluded treaty - vanilla-typed outcomes), and the save-then-disable
 # order of operations.
 # The mod-removal decision GROUP's title. The key is ENGINE-COMPOSED as
 # "decision_group_type" + <key>, which is why it does not begin tnt_
 # (GAME\common\decision_group_types\_decision_group_types.info:1). The
 # group is declared in common\decision_group_types\tnt_92_decision_groups.txt
 # and holds BOTH uninstall decisions - this one and the MCA addon's - so the
 # panel shows ONE collapsible header at the bottom of the list instead of two
 # loose buttons standing among the play decisions. Vanilla's own naming
 # scheme is "<X> Decisions" (decision_group_types_l_english.yml). No [..]
 # token and no #markup by design.
 decision_group_type_tnt_uninstall:0 "Mod Removal Decisions"
 tnt_uninstall_decision:0 "Fold Away the Negotiating Table"
 tnt_uninstall_decision_desc:0 "The envoys are dismissed, the ledgers burned, the table itself carried out of the hall. Take this decision immediately before removing the mod: it sweeps every trace Parley keeps in this world out of the savegame. Unanswered letters and half-built negotiations are voided; every treaty already concluded stands."
 tnt_uninstall_decision_tooltip:0 "Prepares this save for play without Parley: The Negotiating Table. Removes every variable, hook and opinion the mod has written, on every character in the world. Concluded deals - marriages, ceded titles, oaths of fealty - are untouched."
 tnt_uninstall_decision_confirm:0 "Sweep it clean"
 tnt_uninstall_decision_effect_tt:0 "Every variable, list, character flag, hook and opinion written by Parley is removed from every character in the world. Any unanswered offer letter and any half-built negotiation are voided. Save the game, then disable the mod: the save is now clean of Parley."

