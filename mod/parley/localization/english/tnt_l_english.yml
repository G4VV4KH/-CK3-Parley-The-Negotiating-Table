 # vanilla passes every casus belli.
 # engine's ATTACKER / DEFENDER / CLAIMANT / TITLE tokens, as in
 # for [CLAIMANT.GetShortUINamePossessive] Claim on the [TITLE.GetBaseName]"). Ours
 # names both sides and no title, because this war is not fought for one.
 # Printed by the casus belli's on_declaration, because that is when the tnt_w_*
 # snapshot is fresh; at victory it has already been restored and consumed. Every
 # figure is read live off the attacker, and the lists are counted with
 # GetDataModelSize, which vanilla prints in localization too
 # (ledger_filtersorts_l_english.yml:441). Zeroes are shown rather than hidden - a
 # treaty is a list of what IS in it, and a reader who sees "Counties: 0" knows the
 # war is not about land.
 tnt_err_ab_already_fair:0 "The treaty already sits at exactly #high +1#! - there is nothing left to balance"
 tnt_err_ab_empty:0 "There is nothing on the table to balance yet"
 # ===================================================================
 # THE THREAT (V4 expansion 1). Every number in the sub-line and the tooltip is
 # read live, so nothing here can go stale when the calibration in
 # tnt_57_threat_values.txt is retuned. The wording never promises a war: the
 # THE NAME OF THE OPINION MODIFIER ITSELF (common\opinion_modifiers\tnt_61_opinions.txt).
 # An opinion modifier is localized by its own id, and without this key the partner's
 # opinion breakdown would show the raw "tnt_threat_opinion" for fifteen years.
 tnt_threat_opinion:0 "Threatened me"
 # THE SECOND OPINION MODIFIER: the goodwill a clearly favorable treaty buys
 # (common\opinion_modifiers\tnt_61_opinions.txt:5, applied by
 # tnt_32_apply.txt:162). The engine appends the +N in the partner's opinion
 # ledger, so the name carries no number of its own - same register as
 # tnt_threat_opinion above.
 tnt_treaty_favor_opinion:0 "Favorable treaty"
 # ===================================================================
 # SPENDING A HOOK YOU HOLD (V4 item 2). The sub-line names the strength live, so it
 # cannot go stale, and it says "no hook" rather than nothing when there is none -
 # the row is visible either way now.
 # V4 item A2 - the mirror: HE calls in a debt he holds on US. Read-only in the
 # window; his composer sets it. The figure is negative because a debt he can
 # invoke makes him more demanding, not more willing.
 tnt_item_usehook_r:0 "He calls in your debt"
 tnt_item_usehook_r_desc:0 "He holds a [hook|E] over you and intends to use it, so he expects the treaty to account for it.\n\n#weak This is not something you can switch off - it is his leverage, not yours. It makes him ASK FOR MORE than a fair price: #high -45#! for a favour he can call in, #high -120#! if the leverage is blackmail-grade. Sign, and the debt is spent - a weak hook is gone, a strong one remains.#!\n\n#weak Refusing costs nothing but the treaty.#!"
 tnt_usehook_r_sub:0 "[Select_CString( GreaterThanOrEqualTo_CFixedPoint( GetPlayer.MakeScope.ScriptValue('tnt_usehook_r_strength_value'), '(CFixedPoint)2' ), Localize('tnt_usehook_strong'), Localize('tnt_usehook_weak') )]"
 tnt_bd_usehook_r:0 "A debt called in on you"
 tnt_item_usehook:0 "Call in a hook"
 tnt_item_usehook_desc:0 "Spend the leverage you already hold over him. This is the other direction from #high Grant a hook#! - that one hands him a favour over you; this one collects on the favour he owes.\n\nIt works on a ruler who will never like you, so its weight is not touched by his regard - unlike everything you might give him.\n\n#weak A [hook|E] you call in is worth #high +45#!; blackmail-grade leverage is worth #high +120#!. The game itself decides what a hook survives: a weak one is used up when the treaty is signed, a strong one is not. It is spent only if the treaty is actually agreed - a favour called in for a treaty that never happened would be a favour thrown away.#!\n\n#weak Calling a debt in weighs on you exactly as a threat does. Your own nature reads the act: some consciences carry it as #high stress#! of their own, a colder ruler is eased by having spent the leverage, and the confirmation names the traits that answered before the envoy rides out.#!"
 tnt_usehook_sub:0 "[Select_CString( GreaterThanOrEqualTo_CFixedPoint( GetPlayer.MakeScope.ScriptValue('tnt_usehook_strength_value'), '(CFixedPoint)2' ), Localize('tnt_usehook_strong'), Select_CString( GreaterThanOrEqualTo_CFixedPoint( GetPlayer.MakeScope.ScriptValue('tnt_usehook_strength_value'), '(CFixedPoint)1' ), Localize('tnt_usehook_weak'), Localize('tnt_usehook_none') ) )]"
 # UNREFERENCED ON PURPOSE - and, unlike every other orphan in this file, these
 # three were the only ones with no note saying so, which is why each audit
 # re-flagged them. They are the hook-tier names from before TntHookTier took
 # over; data_binding\tnt_macros.txt now renders tnt_hook_tier_0..3 instead.
 # Kept because an unreferenced key costs nothing and a re-added one would have
 # to be re-translated. NOT to be confused with the LIVE tnt_err_usehook_none
 # (common\scripted_guis\tnt_23_usehook.txt) one line below the block.
 tnt_usehook_strong:0 "Strong hook - it survives being used"
 tnt_usehook_weak:0 "Weak hook - calling it in uses it up"
 tnt_usehook_none:0 "You hold no hook on him"
 tnt_bd_usehook_p:0 "A hook called in"
 tnt_err_usehook_none:0 "You hold no hook on him to spend"
 # === EXPERIMENT I2 INSTRUMENT: the tnt_err_threat_* family below is an experiment
 # === instrument, not ordinary prose. DO NOT TIDY. Verdict at the foot of this file
 # === and at the row itself, common\scripted_guis\tnt_20_scripted_guis.txt. 2026-08-24: the ratio ruling left ONE credibility row, so _weak was RE-WORDED and is now the law-10d instrument in place of _nofear - same surface, same custom_tooltip wrapper, same control; _unknown and _nofear are PINNED with zero rows. ===
 tnt_item_threat:0 "Threaten him"
 tnt_item_threat_desc:0 "Let him understand what refusing would cost him. This is not a declaration - nothing is sworn and no army marches. It is weight on the table, and it works on a ruler who will never like you, which is exactly what gold cannot do.\n\nIts weight is #high how far your host outweighs his#!, raised or lowered by #high how much greater your name is than his#! and by #high how much more dread you carry than he does#!. Standing a whole rung below him in fame closes the threat entirely, however large your army - and the weight that opens the threat is exactly the weight it then adds to the treaty in your favour.\n\n#weak He will remember it. A treaty signed under threat costs you $tnt_threat_opinion$, #high -100#! opinion decaying over fifteen years - and since his regard is what makes your gifts worth anything, taking by fear today means your gold buys less from him for a generation. But it is not your gold alone that pays: your own nature reads the act. Some consciences carry the weight of it as #high stress#! of their own; a colder ruler is eased by having spent the leverage at last. The confirmation names the traits that answered, and the exact figure, before the envoy rides out.#!"
 # NOT `SCOPE.ScriptValue` HERE. That token means "the script context this text is
 # being resolved in" and exists when the engine expands a tooltip inside an effect
 # (which is why tnt_stage_pair_points_line may use it). This key is printed from a
 # .gui blockoverride, where there is no script context - only datacontexts - so it
 # has to name its own root, exactly as tnt_wed_count does with GetPlayer.MakeScope.
 tnt_threat_sub:0 "Host [GetPlayer.MakeScope.ScriptValue('tnt_threat_ratio_value')|1] to 1, name x[GetPlayer.MakeScope.ScriptValue('tnt_threat_rep_term_value')|0], dread x[GetPlayer.MakeScope.ScriptValue('tnt_threat_dread_term_value')|2]"
 tnt_bd_threat_p:0 "Naked pressure"
 tnt_bd_threat_panel:0 "Pressure"
 tnt_err_threat_weak:0 "A threat needs at least 100 deal points from military strength, prestige and dread. This minimum applies equally to players and AI."
 tnt_err_threat_relation:0 "Threats may be made only against an independent ruler who is neither your ally nor joined to you by a hostage"
 tnt_err_threat_unknown:0 "Your name must carry some weight - prestige level above nothing"
 # tnt_err_threat_unafraid RETIRED round 8 (I2). This tombstone holds the line count so no .yml citation moves. ORPHANED 2026-08-24 BY THE RATIO RULING, KEPT DEFINED IN ALL NINE: tnt_err_threat_unknown above and tnt_err_threat_nofear below have ZERO rows - their rules are inside tnt_threat_points_value now. Law 9 (a retired name stays readable so a revival needs no archaeology) and the law-10d control. DO NOT DELETE, DO NOT RE-USE FOR ANOTHER MEANING.
 tnt_err_threat_nofear:0 "He does not fear you: your dread must reach 75, or 40 against a man who is not bold, or 20 against a man under your own authority"
 tnt_err_threat_recent:0 "He still remembers your last threat. Let the memory fade before you lean on him again"
 # ===================================================================
 # V13, USER ITEM 1: ORPHANED, KEPT DEFINED - the alliance row is retired. It
 # is also the only reader tnt_tt_alliance_glut ever had, through the $...$
 # token in its last paragraph, so that key is orphaned with it.
 tnt_item_alliance_desc:0 "One formal alliance, sworn by the two of you together - not something one side hands to the other. Either party may then call the other to war, and to refuse that call costs [prestige|E].\n\n#weak A single row for a single pact: it is either in the treaty or it is not.#!\n\n#weak Sworn with your own [liege|E] or your own [vassal|E], it is a standing pact rather than a call to arms: the game does not let a liege and his vassal summon one another, but the alliance is real, is counted everywhere alliances are counted, and outlives the day one of you leaves the other's realm.#!\n\n#weak $tnt_tt_alliance_glut$#!"
 # ITEM 22'S ALLY GLUT - THE ONE CHARGE ON THIS TABLE WITH NO BREAKDOWN ROW.
 # Vanilla's own alliance factors were imported into the alliance term rather
 # than invented (user ruling on item 22), and the ally count is one of them:
 # tnt_ally_glut_self_value x tnt_ally_glut_partner_value multiply the whole
 # term (tnt_50_values.txt:704, :768, applied at :1084-1085), reproducing
 # MSM:181-204's x0.5-per-non-vassal-non-liege-ally ladder plus the -15 rows of
 # 00_alliance.txt:2126-2146 / :2148-2169. A MULTIPLIER is the only I4-safe
 # shape - it can pull a non-negative addend toward zero but never through it -
 # and the price of that shape is that the headline shows no row for it. So
 # this sentence is the only place the player can ever meet the rule.
 # FORWARD DECLARATION: no .gui was in the scope of the author who wrote it, so
 # nothing reads this key yet. Whoever adds the alliance row's tooltip wires it.
 tnt_tt_alliance_glut:0 "Every alliance you already hold makes the next one cheaper to buy. From your second ally onward — not counting your own liege or your own vassals — each existing alliance halves what a fresh pact is worth to a partner, and his own allies do the same to him."
 # V13, USER ITEM 1: ORPHANED, KEPT DEFINED - the pact row is retired.
 tnt_item_truce:0 "Non-aggression pact"
 tnt_item_truce_desc:0 "One pact the two of you enter together: neither side may declare war upon the other for #high ten years#!.\n\n#weak A single row for a single pact: it is either in the treaty or it is not.#!"
 tnt_item_marriage:0 "Marriage pact"
 tnt_item_marriage_desc:0 "A match between the two houses, and #high as many couples in one treaty as you like#!. Choose one person on each side, set the line the children take, and add the couple; if either of them is still a child that couple is betrothed rather than wed.\n\n#weak Each couple after the first is worth a little less to them than the one before, while what a match costs them never shrinks - so a few good matches beat a dozen padded ones. A house asked to marry beneath its own rank charges for the descent, and the wider the gap the steeper the charge. One couple may also be promised a grand wedding.#!\n\n#high A close enough match now brings an alliance with it#!, exactly as the game's own arranged marriage does - and the treaty's price carries that alliance, so a match that allies you is worth more than one that does not. #weak The “Potential alliance” hints the marriage screen draws beside the candidates may be believed again.#!"
 tnt_item_title:0 "Cede title"
 tnt_item_title_desc:0 "Hand over a held title of county rank or above, with everything beneath it.\n\n#weak As many at a time as you like. A capital and a primary title are never on the table. Land beyond what their domain can hold is still land - they will take it, and pay full worth for it, and answer to their own stewards for the strain.#!"
 # V13, USER ITEM 1: ORPHANED, KEPT DEFINED - both generations of the claim
 # grant are retired, the single-object one and the multi-select one.
 tnt_item_claim:0 "Grant claim"
 tnt_item_claim_desc:0 "Grant an unpressed [claim|E] upon a title the giver holds himself - an open invitation to a future war, and a grave concession.\n\n#weak As many at a time as you like.#!"
 # ===================================================================
 # ===================================================================
 # RETIRED TERMS - THE PRISONER FAMILY (user item 7). Both captive terms, the
 # all-or-nothing release and the chosen-captives list, were built, played and
 # then WITHDRAWN FOR AN INDEFINITE PERIOD. The user's own reason for the
 # withdrawal is recorded with the code: doing captives properly means leaning
 # on the VANILLA prisoner system rather than on this mod's own bookkeeping.
 # The tombstone that carries the full ruling is in
 # common\scripted_effects\tnt_32_apply.txt.
 #
 # ALL SEVEN KEYS BELOW STAY DEFINED, AND THAT IS DELIBERATE, NOT AN OVERSIGHT:
 # the two files are pinned to the same key count with identical key sets, so
 # deleting any one of them breaks parity in two files at once; an unreferenced
 # key costs nothing while an undefined one prints its raw id on screen, and a
 # raw key inside a tooltip is a recorded crash class in this mod. A revival
 # must not have to re-translate either.
 # tnt_multi_count_prisoner_p and tnt_sel_count_prisoner_p still resolve
 # tnt_count_sel_prisoner_p_value, which is kept live for exactly this reason.
 # ===================================================================
 # RELEASING CHOSEN CAPTIVES (V4 item A1) - the list term, beside the all-or-nothing one.
 # The count keys follow the shape the other three multi-select terms use, so the badge,
 # the row label and the sheet detail all read one number.
 tnt_item_prisoner_multi:0 "Release chosen captives"
 tnt_item_prisoner_multi_desc:0 "Open your dungeon for the captives you name, and no others.\n\n#weak What a captive is worth is his rank and his blood: #high 10#! for anyone, #high +15#! if he is the other party's own kin, #high +10#! if he holds a title at all, and #high +15 / +25 / +40 / +60#! as that title reaches county, duchy, kingdom or empire. A captive king is therefore worth more than a dozen nobodies - which is the point of choosing.#!\n\n#weak Choosing anybody here overrides #high Release prisoners#!: the two would otherwise pay twice for the same men.#!"
 tnt_multi_count_prisoner_p:0 "Captives named: [GetPlayer.MakeScope.ScriptValue('tnt_count_sel_prisoner_p_value')|0]"
 tnt_sel_count_prisoner_p:0 "Named: [GetPlayer.MakeScope.ScriptValue('tnt_count_sel_prisoner_p_value')|0]"
 tnt_picker_title_prisoner:0 "Choose captives to release"
 # ===================================================================
 tnt_item_prisoners:0 "Release prisoners"
 tnt_item_prisoners_desc:0 "The releasing side opens its dungeons to every prisoner bound to the other party by blood or by fealty."
 tnt_item_hook:0 "Favor owed"
 tnt_item_hook_desc:0 "Owe the other party a [hook_i] favor. Three strengths: a #high weak#! favor lasts ten years and is spent the first time it is used; a #high strong#! one lasts twenty years, may be used again and again, and rests five years between uses; an #high eternal#! one never expires and is never spent, and rests the same five years between uses.\n\n#weak Click to raise the strength, right click to lower it. A favor cannot be promised if the party who would receive it already holds one over the giver.#!"
 tnt_item_artifact:0 "Artifact"
 tnt_item_artifact_desc:0 "Hand over an [artifact_i] artifact out of the giver's own treasury.\n\n#weak As many at a time as you like. Pieces the game itself keeps at home are not listed: crown jewels bound to a title, dynastic banners, and relics of the giver's own faith offered across faiths.#!"
 # ===================================================================
 # RETIRED TERM - THE THIRD-PARTY NON-AGGRESSION PROMISE (user item 1). It was
 # built, it was played, and it was judged SURPLUS TO PLEASANT PLAY and
 # WITHDRAWN FOR AN INDEFINITE PERIOD - not deleted. The tombstone carrying the
 # ruling sits with the code in common\scripted_effects\tnt_32_apply.txt.
 #
 # Its nine keys stay defined for the reasons given over the prisoner block
 # above, and tnt_truce_nonwar has one reason of its own: it is the `name` of a
 # live add_truce_one_way, so every save made before the retirement still holds
 # one-way truces that print it. Deleting it would put a raw key on the truce
 # readout of an existing game.
 # ===================================================================
 tnt_item_nonwar:0 "Promise not to attack"
 tnt_item_nonwar_desc:0 "Swear a one-sided [truce|E] with a third ruler for #high ten years#!; breaking a truce carries a severe penalty.\n\nWho can be named: rulers whose realm borders the promiser's, and holders of titles the promiser has a claim on - never the two negotiators, the promiser's allies, or anyone already under his truce.\n\n#weak The other party owes nothing in return - the swearer simply stays his hand.#!"
 tnt_item_vassal:0 "Swear fealty"
 tnt_item_vassal_desc:0 "One ruler kneels and becomes the [vassal|E] of the other, realm and all. The gravest term this table can hold - and the only one that comes with a written contract you may edit."
 # ===================================================================
 # THE FOUR NEW TERMS OF ITEM 19. Each has ONE name key serving both columns -
 # the column it sits in already says whose kin travels - and ONE _desc, bound
 # in exactly one place, the row's own `tnt_row_tooltip` blockoverride.
 #
 # EACH _desc IS A MERGE OF TWO SUBMISSIONS, AND THE MERGE IS NOT A COMPROMISE.
 # Two authors wrote each of these four keys: one a one-sentence row tooltip,
 # one the POPULATION RULE its candidate trigger actually enforces
 # (common\scripted_triggers\tnt_42_people_gates.txt, gates P1, P5/P6, P9, P13).
 # A key holds one string and the row has one tooltip, and both halves were
 # declared load-bearing, so the tooltip carries both: what the term is, then
 # who may be named. tnt_item_nonwar_desc above has had that shape since v1.
 #
 # WHY THE POPULATION RULE BELONGS IN THE TEXT AT ALL. These rows are HIDDEN
 # when nobody qualifies (macro TntRow), so a player who never reads the rule
 # never learns why a row he saw yesterday is gone today. The clause that will
 # hide each row most often is named on purpose - a guardian's third ward
 # (vanilla's own num_of_relation_ward < 2) and land inside the liege's own de
 # jure inheritance - because an unexplained missing row reads as a bug.
 # V16: the third-ward example is now HISTORY - the ward row is retired and its
 # gate is commented out, so the rule this paragraph is teaching survives only
 # in the three remaining terms. It is kept because the reasoning is the point:
 # a hidden row still needs its population rule written into the tooltip, and
 # the courtier and hostage descs below are where that now has to hold.
 #
 # ONE KEY, BOTH DIRECTIONS, AND THE TRAP IN IT: "grant independence" in YOUR
 # column frees YOUR vassal, in HIS column frees YOU. The desc says so in as
 # many words; the two _p/_r breakdown rows of section D say it again, and the
 # six per-side picker titles of section G exist for the same reason.
 tnt_item_indep:0 "Grant independence"
 tnt_item_indep_desc:0 "A vassal is released from his oath of fealty and becomes an independent ruler. On your side of the table it is your own vassal who walks free; on his side, it is you. A treaty may not carry this and an oath of fealty at once.\n\n#weak It can only be offered where the two of you already stand as liege and direct vassal, the one who would be freed holds land of his own, neither realm is at war, and his lands are no part of his liege's own de jure inheritance.#!"
 tnt_item_hostage:0 "Hostage"
 tnt_item_hostage_desc:0 "A close relative of the giver — a child, grandchild, sibling, niece or nephew — travels to the other court and lives there as a hostage, surety for this treaty. He is a guest under the game's own hostage rules, not a prisoner.\n\n#weak Only unlanded, unmarried, unbetrothed kin who are already at his own court may be pledged, and never his own regent.#!"
 # RETIRED WITH THE WARD / FOSTERAGE FAMILY (V16, user item 5) - AND THIS IS THE
 # AUTHORITATIVE NOTE THE OTHER ELEVEN WARD KEYS POINT AT, the same way the
 # alliance family's orphans point at tnt_item_alliance above.
 # The user's reason: the term is too abusable on points, and the hostage row
 # already covers the same immersive ground. The audit agreed and found the
 # abuse is NOT one number - tnt_val_ward_p_value prices a child on vanilla's
 # hostage ladder, whose rank rows fire when the GIVER outranks the RECEIVER,
 # and the player chooses the receiver; so up to +190 of the price is
 # player-selected, and lowering the multiplier enough to stop it collapses
 # every child below an heir onto the min = 10 floor.
 # TWELVE KEYS LOSE THEIR LAST READER AND NOT ONE IS DELETED: tnt_item_ward,
 # tnt_item_ward_desc, tnt_bd_ward_p, tnt_bd_ward_r, tnt_picker_title_ward_p,
 # tnt_picker_title_ward_r, tnt_picker_rule_ward, tnt_err_ward_p_unavailable,
 # tnt_err_ward_r_unavailable, tnt_ai_offer_desc_a15, tnt_ai_offer_row_ward_r,
 # tnt_ai_goal_brood. Each is marked where it stands. The key count is PINNED -
 # 570 = 570, identical key sets (house law 9, checklist item 4) - so deleting a
 # retired key FAILS the parity test rather than tidying anything.
 # ARCHETYPE 15 RETIRES WITH THE FAMILY AND INDEX 15 IS BURNT, never reused:
 # burnt indices are now 1, 2, 4, 5, 6, 7, 11, 12, 15 and the next free one is
 # still 21. Goal code 9 is burnt with it - see tnt_ai_goal_brood below.
 # WHAT THE HOSTAGE ROW DOES NOT INHERIT, recorded so a revival need not
 # rediscover it: a hostage is not EDUCATED by his warden (vanilla's own
 # hostage_depart_effect strips the guardian relation as its first act), the
 # hostage pool is not children-only, and this was the one row that read as an
 # alliance of houses rather than a security arrangement.
 # IF IT IS EVER REVIVED, revive the _r LEG ONLY. The abuse is entirely in _p:
 # a ward the player RECEIVES costs him, so it cannot be farmed.
 tnt_item_ward:0 "Ward"
 tnt_item_ward_desc:0 "A child from the giver's court is sent to be raised by the other ruler. That ruler becomes the guardian himself — there is no third party to choose.\n\n#weak Only children at his own court who are fit to travel may be offered, and a guardian may not take a third ward.#!"
 tnt_item_courtier:0 "Courtiers"
 tnt_item_courtier_desc:0 "Courtiers change households, each taking a consort and any young children with him.\n\n#weak Only grown, landless members of the giver's court who hold no post in it may be handed over — not his heir, his consort, his regent, his councillors, his knights or his court officers — and never a man the receiver counts as a rival.#!"
 tnt_item_subject_desc:0 "Chosen vassals of the giver change liege and pass into the other ruler's realm, taking every title they hold and every vassal beneath them.\n\n#weak Their contract of subjection is written afresh on the receiving realm's ordinary terms, so any special obligations lapse. No truce follows the move, and nothing in the game brings a vassal back across a realm border except war. Only direct vassals who hold a county or more, who rank below the ruler receiving them and who are at peace with everyone concerned may be handed over - never a regent and never an heir - and a vassal a treaty has already moved may not be moved again for three years.#!"
 tnt_item_subject:0 "Transfer a vassal"

