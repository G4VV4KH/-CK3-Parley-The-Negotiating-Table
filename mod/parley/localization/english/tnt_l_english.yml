 tnt_ai_goal_menaced:0 "#weak Your border men report: a stronger neighbour looms over their land, and they are in urgent want of friends.#!\n\n"
 tnt_ai_goal_rich:0 "#weak Your merchants know it for certain: their treasury groans with gold in search of a purpose.#!\n\n"
 tnt_ai_goal_poor:0 "#weak Your merchants whisper: their coffers are bare, and they are desperate for coin.#!\n\n"
 tnt_ai_goal_overdomain:0 "#weak Your lawmen observe: they hold more land than one hand may rightly keep — the surplus seeks a buyer.#!\n\n"
 tnt_ai_goal_heir:0 "#weak It is no secret at their court: the heir is of age and the marriage bed stands empty — they need a match.#!\n\n"
 # RETIRED WITH THE WARD / FOSTERAGE FAMILY (V16, user item 5): KEPT DEFINED.
