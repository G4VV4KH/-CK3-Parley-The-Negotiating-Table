 # --- A. Interaction (3) --------------------------------------------------
 tnt_open_negotiations:0 "Negotiate a Treaty"
 tnt_open_negotiations_desc:0 "Send an envoy to [recipient.GetShortUIName] and lay a full treaty upon the table - every term, both sides at once."
 # THE ENGINE NAMES THIS KEY, NOT A CALL SITE. <interaction id>_extra_icon is
 # the fixed tooltip of the extra icon drawn on the right-click menu row
 # (GAME\common\character_interactions\_character_interactions.info:150-155);
 # ours is armed by a should_use_extra_icon BLOCK of TWO parameterised trigger calls, ANDed -
 # tnt_can_threat_trigger AND tnt_door_open_trigger, both { A = scope:actor  B = scope:recipient } -
 # at common\character_interactions\tnt_10_interaction.txt:203-206, so the badge appears when fear
 # would work on him AND the row is clickable at all, BEFORE the window is
 # opened. It has no BuildTooltip call site, so law 10a does not apply and the
 # @icon! texicon is legal here - vanilla's own hook_extra_icon:0
 # "@weak_hook_icon! [hook|E] available" is the same shape
 # (GAME\localization\english\interactions_l_english.yml:262). SINCE THE RATIO RULING THERE ARE NO FOUR CONDITIONS: tnt_can_threat_trigger has TWO rows - tnt_threat_points_value against the bar 100, and the fifteen-year pair lock (common\scripted_triggers\tnt_41_gates.txt:2388-2402) - while tnt_door_open_trigger (:2991-2994) ANDs on not-at-war and his opinion of you off the floor. The value below names the two threat rows only: the weaker claim, hence always true when the badge is drawn.
 tnt_open_negotiations_extra_icon:0 "@dread_icon! You can lean on him - host, name and dread together come to the weight a threat needs, and he has forgotten your last threat"

 # --- B. Window chrome and the centre panel (10) -------------------------
 # tnt_balance_header, tnt_balance_accept and tnt_balance_reject are READ IN
 # TWO PLACES as of build 3: the negotiation window's centre panel and the
 # balance widget embedded in the AI's letter
 # (gui\event_window_widgets\tnt_offer_summary.gui:152, :182, :189). Do not
 # reword any of the three into something that only makes sense inside the
 # window.
 tnt_window_title:0 "Diplomatic Negotiations"
 tnt_col_actor:0 "You offer"
 tnt_col_partner:0 "They offer"
 tnt_balance_header:0 "Their Answer"
 tnt_balance_accept:0 "#P They are inclined to accept#!"
 tnt_balance_reject:0 "#N They are inclined to refuse#!"
 tnt_scale_note:0 "The number is their answer: above zero, they sign. Every term is priced at what it would be worth if you arranged it on its own, and their opinion of you, faith, kinship and whatever they want on top are already counted in. The bar is the same answer drawn out: everything pushing them towards yes against everything pushing them towards no, so the moment the bar passes the middle they will agree."
 tnt_label_points:0 "pts"
 # V13, USER ITEM 1: ORPHANED, KEPT DEFINED. This was the ten-year sub-line of
 # the alliance and pact rows, and both rows are retired. See the retirement
 # note over tnt_item_alliance in section C.
 tnt_label_years:0 "#weak Lasts 10 years#!"
 tnt_picker_empty:0 "#weak Nothing available#!"
 tnt_picker_empty_artifact:0 "#weak Nothing this side owns may change hands: crown jewels follow their title, dynastic banners stay with the dynasty, relics of one's own faith go only to co-believers.#!"

 # --- C. The eighteen deal items -----------------------------------------
 # Row order matches the columns in tnt_diplomacy_window.gui. Row index 2, the
 # yearly tribute, is RETIRED: its code and its keys are gone and the index is
 # not reused. FOURTEEN BECAME EIGHTEEN in V5: item 19 approved exactly four
 # more terms and they are the last four rows of both columns - grant
 # independence, hostage, ward, courtier transfer, at
 # gui\tnt_diplomacy_window.gui:1170-1302 (yours) and :2167-2254 (theirs).
 # They sit at the end of this section, so row order still matches the columns.
 # V16, USER ITEM 5: THE WARD ROW IS RETIRED and item 19 is down to three live
 # terms. Both columns lose the row in the same commit, so row order still
 # matches the columns - the way a retirement always leaves this section is with
 # a hole in the middle of it, not a renumbering. The pair of keys stays defined;
 # the authoritative note is over tnt_item_ward below.
 # Build 3 rewords three of the descriptions - see the header. Rows that a
 # structural impossibility rules out are now HIDDEN rather than disabled
 # (tnt_41_gates.txt, macro TntRow), so a row the player can still see with a
 # refusal on it is short of something he can fix. That is why every _desc and
 # every section-J reason names WHAT is short.
 # "(one-time)" DROPPED (user item 3). The qualifier only ever distinguished this
 # row from the yearly tribute at row index 2, and that term is retired (see the
 # section header above), so it now distinguishes gold from nothing while costing
 # 128 px against the 120 px the currency row budgets for a name
 # (gui\tnt_types.gui:546-554) - it ran flush into the first stepper button.
 # The one-time sense survives where there is room for it, in tnt_item_gold_desc.
 tnt_item_gold:0 "Gold"
 tnt_item_gold_desc:0 "A single payment of [gold_i] out of the treasury, handed over the moment the treaty is sealed."
 tnt_item_prestige:0 "Prestige"
 tnt_item_prestige_desc:0 "[prestige_i] [prestige|E] promised across the table.\n\n#weak This is not a strongbox changing hands: the giver loses the amount and the receiver gains it in two separate strokes, and nothing holds the two together. So the offer cannot be sent at all unless the giver holds the whole amount at the moment Propose is pressed.#!"
 tnt_item_piety:0 "Piety"
 tnt_item_piety_desc:0 "[piety_i] [piety|E] promised across the table.\n\n#weak Two separate strokes again, not a transfer: what one side loses the other gains. The offer cannot be sent unless the giver holds the whole amount at the moment Propose is pressed.#!"
 tnt_item_influence:0 "Influence"
 tnt_item_influence_desc:0 "[influence_i] [influence|E] promised across the table.\n\n#weak [influence|E] exists only under a form of rule that runs on it, so these rows appear only when both forms of rule run on it - handing it to a ruler who has no such pool would do nothing at all. Two separate strokes here as well, and the offer cannot be sent unless the giver holds the whole amount at the moment Propose is pressed.#!"
