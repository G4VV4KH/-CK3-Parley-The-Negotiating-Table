 # --- V. The AI's letter (66) - user item 4, phase AI-1 -----------------
 # THE BANNER IS RE-MEASURED, NOT INCREMENTED. It read (44) from the pass that
 # created the section and was never updated through four later passes; the
 # section held 55 keys before V13 and holds 66 after it.
 # tnt_ai_offer.0002 arrives ON THE PLAYER, so root is the player and the AI is
 # scope:tnt_deal_partner - which is why every one of the mod's 55 script values
 # keeps its exact meaning and why the embedded widget can reuse
 # tnt_balance_header / _accept / _reject unchanged.
 # THE PROSE IS THE MOST VISIBLE NEW TEXT IN THE MOD. Each archetype branch
 # names the terms its own composer actually wrote (tnt_37_ai_offer.txt) and
 # nothing else, so the letter can never promise a term the package does not
 # contain. The FIGURES are printed by the tnt_ai_offer_row_* lines in the
 # embedded widget, not by the prose, because which side pays is decided
 # after the archetype is chosen.
 tnt_ai_offer_title:0 "An Embassy from [tnt_deal_partner.GetTitledFirstName]"
 # V13, USER ITEM 1: tnt_ai_offer_desc_a1 (the plain pact) and _a2 (the
 # alliance) are ORPHANED and KEPT DEFINED - archetypes 1 and 2 are retired
 # with their terms, and indices 1, 2, 6 and 11 are burnt and never reused.
 # Same treatment as _a5 below. See the note over tnt_item_alliance, section C.
 tnt_ai_offer_desc_a1:0 "A herald of [tnt_deal_partner.GetTitledFirstName] is shown in with the road still on his cloak, and comes to the point with the bluntness of a man who has ridden hard.\n\nHis master wants no quarrel with you. He asks for a sworn pact: for #high ten years#! neither of you draws a sword upon the other - and he has brought coin to bind the promise, because a word costs nothing and he knows it."
 tnt_ai_offer_desc_a2:0 "[tnt_deal_partner.GetTitledFirstName] sends no clerk but a kinsman, and that is itself half the message.\n\nWhat he proposes is a sworn military alliance: your banners and theirs raised together, each of you free to call upon the other when the war comes - as both of you know it will."
 tnt_ai_offer_desc_a3:0 "The envoy of [tnt_deal_partner.GetTitledFirstName] speaks softly, and asks for nothing that can be weighed in a scale.\n\nHis master would have your word instead: one favor owed, to be called in at a time of his own choosing. Debts of that kind are always collected at the worst possible moment - which is precisely what makes them worth buying."
 tnt_ai_offer_desc_a9:0 "[tnt_deal_partner.GetTitledFirstName] sends neither gift nor flattery, only a reminder.\n\nThere is a favor owed, and the envoy has come to see it honoured. What he lays upon the table is not a petition but an accounting: the debt is named aloud, and the terms below are what will settle it."
 # RETIRED WITH THE PRISONER FAMILY (user item 7): archetype A5 is the ransom
 # letter, and it has nothing left to ask for once the captive terms are gone.
 # It never composed even once in the last playtest, so no player has read it.
 # Kept defined - see the tombstone over the captive block in section C.
 tnt_ai_offer_desc_a5:0 "The envoy of [tnt_deal_partner.GetTitledFirstName] does not sit, and does not pretend this is statecraft.\n\nThere are men and women of their house and their fealty rotting in your dungeons. Their master wants them home, and he has brought enough to make the gaoler's loss worth your while."
 # V13, USER ITEM 1: ORPHANED, KEPT DEFINED - A6 was the proud pact, a truce
 # paid in prestige, and it retires with the truce. PRESTIGE ITSELF IS NOT
 # RETIRED: the settle-up ladder still writes tnt_prestige_r. What is gone is
 # the only archetype that wrote it directly.
 tnt_ai_offer_desc_a6:0 "This embassy arrives with heralds, horns and a train of witnesses: [tnt_deal_partner.GetTitledFirstName] means the whole world to see whatever is signed here.\n\nThe substance is a mutual pact of #high ten years#!, and to seal it in public their master will yield a portion of their own [prestige|E] to you before the assembled courts. Peace bought that loudly is hard for either side to disown."
 # THE RULING-SUPERSESSION WAVE - the user's "нужно использовать весь масштаб
 # опций": arch 8 buys the player's land, 10 sells the AI's own, 11 sells a
 # claim on one of its own titles, 13 sells an artifact, 14 offers fealty, 15
 # offers a ward (the a15 branch is at events\tnt_ai_events.txt:1037-1043, NOT the
 # :327-368 this line claimed for four passes; 11 and 15 are both retired now and
 # their branches are commented out). Same register and the
 # same single addressable scope, tnt_deal_partner, as a1-a6. WHICH titles or
 # heads are meant is shown by the summary rows and the counter-offer table,
 # never promised by the prose.
 tnt_ai_offer_desc_a8:0 "[tnt_deal_partner.GetTitledFirstName] writes of borders and of coin. There is land of yours — named in the terms below — that would sit more naturally under their banner, and they would sooner buy it honestly than covet it quietly. The price is set out in full; the seal awaits your answer."
 tnt_ai_offer_desc_a10:0 "[tnt_deal_partner.GetTitledFirstName] offers land. A holding of theirs — named below — is more burden than boon to them, and they would rather see it in your hands and their coffers heavier. The price asked of you stands among the terms."
 # V13, USER ITEM 1: ORPHANED, KEPT DEFINED - A11 sold a claim, and the claim
 # family is retired. Index 11 is burnt.
 tnt_ai_offer_desc_a11:0 "[tnt_deal_partner.GetTitledFirstName] offers not land but a lawful path to it: a claim upon one of their own titles, written and sealed, yours to press when you see fit. Lawyers' ink is cheaper than soldiers' blood — though not free, as the terms below attest."
 tnt_ai_offer_desc_a13:0 "An envoy of [tnt_deal_partner.GetTitledFirstName] uncovers a treasure brought for your eyes: a piece from their own hall, named in the terms below. It is offered for honest coin — such things find new masters more gracefully across a table than across a battlefield."
 tnt_ai_offer_desc_a14:0 "[tnt_deal_partner.GetTitledFirstName] writes words few rulers ever trust to parchment: they are willing to kneel. Their realm would pass under your protection and their banners under yours — for a consideration, set out in the terms below. Weigh it well; fealty once sworn is not lightly unsworn."
 # RETIRED WITH THE WARD / FOSTERAGE FAMILY (V16, user item 5): KEPT DEFINED.
 # ARCHETYPE 15 IS ALREADY GONE FROM THE COMPOSER - measured, not assumed: no
 # site in the mod writes `tnt_ai_offer_arch value = 15` any more, so no letter
 # can ever select this branch again, and index 15 is burnt. The triggered_desc
 # that names this key retires with it; while that block is still live it is
 # merely unreachable, never wrong. Same treatment as _a5 and _a11 above.
 # It was read by a player: A15 composed 4 times in the 2026-08-17 run, 3 of
 # them reached him and all 3 were declined - the letter asked 798, 512 and 91
 # gold FOR TAKING A CHILD IN, i.e. the player paid for the privilege of doing
 # the AI a favour, which is the direction fault behind the points fault.
 # THE WARMEST AI LETTER ABOUT A CHILD LEAVES WITH IT and nothing replaces that
 # register; A18's hostage prose is a surety, not a bond between houses.
 # See the note over tnt_item_ward in section C.
 tnt_ai_offer_desc_a15:0 "[tnt_deal_partner.GetTitledFirstName] asks a place at your hearth — not for themselves, but for their child, named below, to be raised at your court. Such a fosterling is both an honour and a bond between houses; what accompanies the child is set out in the terms."
 # A16, THE COMPOSED MARRIAGE OFFER (events\tnt_ai_events.txt:1056, taken on
 # var:tnt_ai_offer_arch = 16). The prose never names the couple, on purpose:
 # the composer's staging cursor (tnt_spouse_p/_r) is cleared when the pair
 # is committed, so prose reaching for it would resolve dead variables - the
 # event's own comment at :383-389 records the same rule. The concrete
 # couple, names and portraits both, is the pair row under
 # tnt_ai_offer_row_marriage below.
 tnt_ai_offer_desc_a16:0 "My envoy carries a proposal dearer than gold: let our houses be joined. I offer one of my own blood to wed one of yours, that our two lines may share one future. The match is named below; weigh it as you would any bargain of mine."
 # V13, USER ITEM 2 - THE FOUR ARCHETYPES THAT CLOSE THE COVERAGE GAP.
 # 17 asks to be released from his fealty and lays a county down for it,
 # 18 pledges a kinsman as a hostage, 19 buys one grown retainer out of
 # your court, 20 kneels on the contract terms written into the sheet.
 # The prose never names the county, the child or the man: those are the
 # summary rows' business (tnt_ai_offer_row_* below), exactly as a8-a15.
 tnt_ai_offer_desc_a17:0 "[tnt_deal_partner.GetTitledFirstName] writes as a vassal who has weighed his oath and found it heavy.\n\nHe asks to be released from your fealty — his banners his own again, his hall answerable to no one — and he does not ask it for nothing: what he lays down in exchange stands among the terms below. An oath returned is not an oath broken; it is also not lightly given back."
 tnt_ai_offer_desc_a18:0 "The embassy of [tnt_deal_partner.GetTitledFirstName] does not come empty-handed, and what it brings is not gold.\n\nA child of their own blood, named below, is offered into your keeping as a hostage — surety that their word to you will hold while the child is under your roof. What they ask in return for so dear a pledge is written into the terms."
 tnt_ai_offer_desc_a19:0 "[tnt_deal_partner.GetTitledFirstName] has heard of a man at your court, and wants him.\n\nHe is named below. They ask that you release him into their service, and they do not expect the favour freely — the purse stands among the terms. One retainer is a small thing to a great hall; the price offered for him is not."
 tnt_ai_offer_desc_a20:0 "[tnt_deal_partner.GetTitledFirstName] is willing to kneel — but not blindly.\n\nTheir realm would pass under your crown on the conditions set into the contract below: what they will render you, and what they mean to keep for themselves. Fealty bought at a fair price is held longer than fealty taken. Read the terms before you seal them."
 tnt_ai_offer_desc_generic:0 "An envoy of [tnt_deal_partner.GetTitledFirstName] is announced, bows, and lays a sealed proposal upon the table. The terms stand written below in their master's own hand, and he waits on your answer."
 tnt_ai_offer_desc_outro:0 "\n\n#weak Your diplomats have weighed it on the same scales you use yourself.#!"

