 # =========================================================================
 # V3 ITERATION 3 - THE COARSE STEP, THE PRESETS, AND AUTO-BALANCE
 # 23 keys (21 + the two tnt_ab_lumpy_* lines V5 added at the foot of the
 # block). Nothing here is a value-breakdown desc row, so none of them may
 # contain the $VALUE$ token and none of them does (Law R8).
 #
 # NO KEY PRINTS AN AMOUNT IT CANNOT KNOW. The preset labels name what they DO -
 # "A year's income", "Half", "All I can", "None" - because the number is
 # different for every player and every partner, and a label that says "1500"
 # would be wrong for everybody else. The arithmetic is in the tooltips, where a
 # sentence has room to be honest about the cap.
 #
 # THE PARTNER IS "THEY", not "he", matching tnt_col_partner above.
 # =========================================================================

 # --- The coarse stepper pair. One key for both, because one sentence has to
 #     cover all four currencies and only influence differs.
 tnt_tt_step_huge_add:0 "Add a large amount at once.\n\n#weak Gold, prestige and piety: 1000 a click. Influence: 250, because influence itself never passes 1000.#!"
 tnt_tt_step_huge_sub:0 "Take away a large amount at once.\n\n#weak Gold, prestige and piety: 1000 a click. Influence: 250, because influence itself never passes 1000.#!"

 # --- The preset opener in the row. The mark is an ellipsis: the universal "more
 #     choices behind this" and the only label that needs no translation.
 tnt_preset_open:0 "…"
 tnt_tt_preset_open:0 "Set an amount in one click.\n\n#weak A customary amount, half of what is held, everything that can be afforded, or nothing at all.#!"

 # --- The preset menu itself.
 tnt_preset_menu_header:0 "How much?"
 tnt_preset_std_gold:0 "A year's income"
 tnt_preset_std_gift:0 "A customary gift"
 tnt_preset_half:0 "Half"
 tnt_preset_max:0 "All I can"
 tnt_preset_max_r:0 "All they can"
 tnt_preset_none:0 "None"

 # tnt_preset_std_gift is NOT "a year's worth". Prestige, piety and influence have
 # no yearly income in CK3 - there is no monthly_prestige, monthly_piety or
 # monthly_influence field anywhere in the game - so the amount is one customary
 # gift, the size of gift a ruler of that standing expects for a favour like this.
 # Saying "a year" on those three rows would be a lie about a number the player
 # cannot check.
 tnt_tt_preset_std_gold:0 "Offer one year of income.\n\n#weak Capped at what is actually in the treasury.#!"
 tnt_tt_preset_std_gift:0 "Offer the customary amount for a favour of this size - what a ruler of their standing expects.\n\n#weak Capped at what is actually held. Prestige, piety and influence have no yearly income, so there is no 'year's worth' of them to offer.#!"
 tnt_tt_preset_half:0 "Offer half of what is held."
 tnt_tt_preset_max:0 "Offer everything that can be afforded."
 tnt_tt_preset_none:0 "Take this currency off the table."

 # --- Auto-balance. The three state lines are printed BOTH in the button's
 #     tooltip and on the balance panel itself, so the unreachable case cannot be
 #     mistaken for a button that does nothing.
 tnt_autobalance_btn:0 "Auto-balance"
 tnt_tt_autobalance:0 "Adjust the gold, prestige, piety and influence on the table until the offer is only just acceptable to them.\n\nIt works both ways: it sweetens an offer they would refuse, and it #high trims one they would accept too easily#!, so you never overpay.\n\n#weak It adds nothing else - no land, no claim, no marriage, no favour - and it never offers more than can actually be paid.#!"
 tnt_ab_state_balanced:0 "#P Balanced.#! The offer now sits just inside what they will accept."
 tnt_ab_state_minimal:0 "Already minimal. Nothing needed changing."
 tnt_ab_state_unreachable:0 "#N Out of reach.#! They still refuse, even with everything you can pay."
 tnt_ab_state_closest:0 "Acceptable. Auto-balance could not reach +1 with the available currencies."
 # THE TWO LUMPY LINES, both in the button's own tooltip
 # (common\scripted_guis\tnt_22_v2.txt:2246, :2256).
 # tnt_ab_lumpy_hint is bound with `always = yes` and NO trigger_if, so it is
 # the button's standing description and must read true before the first press
 # as well as after it. It is the contract's own mandated wording for the
 # deleted re-roll hint (integration contract 1.C / R2) and it carries two
 # promises that may not be dropped in translation: pressing again keeps
 # ADDING, and a deletion is REMEMBERED.
 # tnt_ab_lumpy_line sits inside a trigger_if on var:tnt_ab_lumpy_n > 0, so it
 # appears only after a press that actually took a lumpy term. THE COUNT IS
 # DELIBERATELY NOT IN THE TEXT: the variable is 1..3 while it exists, but
 # tnt_39_autobalance.txt removes it again when a press took nothing, and a
 # raw or absent key inside a tooltip aborts the whole tooltip's evaluation.
 tnt_ab_lumpy_hint:0 "Press again to keep adding. Anything this button added and you then removed will not be offered again."
 tnt_ab_lumpy_line:0 "His purse was empty, so the last press took terms from his side of the table instead: land, a claim, or his fealty."

 # =========================================================================
 # V3 ITERATION 6 - THE BORROWED MARRIAGE SCREEN
 # 8 keys. Two existing keys are reworded in place (tnt_picker_title_spouse,
 # tnt_btn_edit_marriage) and are marked where they stand.
 #
 # WHAT WAS BORROWED. The interaction tnt_stage_marriage_interaction
 # (common\character_interactions\tnt_12_marriage_picker.txt) sets
 # `interface = marriage` and omits `special_interaction`, so CK3's own
 # matchmaker window opens - two portraits, both households, sixteen filters,
 # the line checkbox, the grand-wedding checkbox - and NOBODY IS MARRIED. The
 # pair it returns is staged into the treaty being negotiated.
 #
 # THE ONE THING WE DO NOT OWN IS THE BIG BUTTON'S LABEL. It reads
 # "Send Proposal" because GAME\gui\interaction_marriage.gui:229 hardcodes
 # text = "send_marriage_proposal_button_name", and the button itself is in
 # interaction_templates.gui:95-102. Renaming it would mean overriding a
 # vanilla .gui (R1) or renaming the same button inside vanilla's real marriage
 # window. SO EVERY KEY BELOW IS WRITTEN AGAINST THAT LABEL: none of them may
 # promise different words on it, and each of the three the player meets before
 # he gets there - the launch button's tooltip, the note beside it, and the
 # window's own header and body - says plainly that confirming RECORDS THE
 # COUPLE IN THE TREATY and that nobody weds until the whole treaty is agreed.
 #
 # WEDDING AND BETROTHAL ARE NOT THE SAME THING AND ARE NOT MIXED HERE: a pair
 # of adults is wed when the treaty is applied, children are betrothed, and the
 # grand wedding is a PROMISE whose couple is betrothed. Section P2's wording
 # stands; nothing here restates it differently.
 #
 # THE INTERACTION'S DISPLAY NAME IS THE BARE OBJECT KEY, as section W explains
 # at length (_character_interactions.info:120-123, vanilla
 # GAME\localization\english\interactions_l_english.yml:245
 # arrange_marriage_interaction:0 "Arrange Marriage"). It is never seen in a
 # right-click menu - the interaction's is_shown demands an open negotiation
 # with this very partner - but the engine looks it up all the same.
 tnt_stage_marriage_interaction:0 "Add a Match to the Treaty"
 # THE HEADER OF THE BORROWED WINDOW. send_name is what
 # interaction_marriage.gui:44 prints through
 # [CharacterInteractionConfirmationWindow.GetSendName]. One line, so it says
 # the load-bearing half: this is an entry in a treaty, not a proposal.
 tnt_stage_marriage_send:0 "Add This Match to the Treaty"
 # THE LINE OVER THE CANDIDATE LIST (interaction's `prompt`, drawn centred at
 # interaction_marriage.gui:338-345, right above the list where vanilla paints its
 # "Potential alliance" strength bars). It is a text_single with autoresize = no, so
 # it MUST stay one short line - no \n, no paragraph. The full wording lives in
 # tnt_stage_no_alliance_tt and in the interaction's desc.
 tnt_stage_marriage_prompt:0 "#high A close enough match now brings the alliance with it#! - the same one the game grants for its own arranged marriage, on the day the treaty is sealed."
 # THE SAME FACT IN FULL, printed into the effects block once both spouses are picked.
 #
 # USER ITEM 5 ADDS THE THIRD PARAGRAPH: the fact was true and unhelpful. It told
 # the player what a treaty match does NOT do and left him with nowhere to go. The
 # tip says where to go, and every condition in it is read off vanilla, not
 # invented - GAME\common\character_interactions\00_alliance.txt:
 #   negotiate_alliance_interaction, is_shown :1128-1151 - the pair must ALREADY be
 #     family (is_any_family_relation_or_spouse_trigger, 00_family_triggers.txt:230),
 #     or blood-brothers' kin, or bound by the hostage oath, or allied house heads.
 #     A perk does NOT open this one to a stranger; that is the next paragraph.
 #   its is_valid OR-block :1182-1283 - spouse (:1186), parent / grandparent /
 #     great-grandparent (:1188-1190), child / grandchild / great-grandchild
 #     (:1191-1193), uncle or aunt (:1194), nibling (:1195), sibling (:1196); OR one
 #     ruler's spouse is close family, nibling or uncle-aunt of the other
 #     (:1205-1235, both directions); OR one's child, parent or sibling is married to
 #     the other's child, parent or sibling (:1237-1258). THOSE LAST TWO ARE WHAT A
 #     TREATY WEDDING BUYS, which is why the tip tells him to marry close.
 #   the flat rows above it :1155-1181 - either imprisoned, at war with each other,
 #     refused_alliance_opinion still standing (:1167-1178), and BOTH parties below
 #     hegemony rank (:1180-1181, highest_held_title_tier < tier_hegemony = 6,
 #     00_title_tiers_values.txt:7). The last one is named out loud because a
 #     hegemon reading a tip that cannot work for him would call it a bug.
 # THE PERK IS A SECOND DOOR, NOT A KEY TO THIS ONE. has_perk =
 # defensive_negotiations_perk appears in the OR-block at :1184, but is_shown still
 # demands kinship, so the perk's real use is its own interaction:
 # perk_alliance_interaction :2379-2416 needs no kin at all, is hidden while
 # Negotiate Alliance is shown (:2410-2413), refuses your own liege or vassal
 # (:2397-2398, :2423-2424), holds one such pact at a time (:2427-2440) and wants
 # neither side at war (:2442-2452).
 # THE THREE NAMES ARE QUOTED AS $...$ so each language prints the game's own button
 # text rather than our translation of it (vanilla english/interactions_l_english.yml
 # :1496, :1491 and lifestyles/perks_l_english.yml:108; vanilla's own tutorial uses
 # exactly this form, tutorial_objectives_l_english.yml:58).
 # ROUND 10, AND IT REVERSES V15'S REASON WHILE KEEPING ITS CONCLUSION. Two claims
 # that stood here were MEASURED FALSE this round and must not be restated.
 # (1) "Read the Potential alliance bars anyway - the door below opens on exactly
 #     that kinship." Two different predicates: the crest is drawn by C++ in the
 #     matchmaker (GAME\gui\interaction_marriage.gui:433-459, tooltip at :443), the
 #     door is negotiate_alliance's OR-block (00_alliance.txt:1182-1268), and the
 #     two are mutually EXCLUSIVE - is_shown hides that interaction once the pair
 #     are already allied (:1123). The bars are not even on screen beside this text:
 #     the list is visible = Not(HasPickedCharacters) (:247), this block :182.
 # (2) "The game keeps a pact of arms behind kinship, so a wedding that came with
 #     one would sell what you must earn." Vanilla's own wedding DOES come with one:
 #     special_interaction = arrange_marriage_interaction "sets up alliances"
 #     (_character_interactions.info:580, repeated :661), the engine carries the
 #     predicate yields_alliance for it (00_rules.txt:807), and vanilla BREAKS that
 #     alliance when the betrothal breaks (00_marriage_interaction_effects.txt:1659-
 #     1668) - you cannot break what was never made. So the refusal is OURS, not the
 #     game's: the picker sets no special_interaction on purpose, and the key now
 #     says exactly that. The tip paragraphs below are unchanged and still correct.
 #
 # *** ROUND 11, 2026-08-23 - THE CONCLUSION IS NOW REVERSED TOO, BY USER RULING,
 # *** AND PARAGRAPH (2) ABOVE IS WHY IT WAS ALWAYS GOING TO BE. Read it again: it
 # *** had the whole evidence right - vanilla's own wedding grants the alliance, the
 # *** engine exposes the predicate, vanilla breaks the alliance when the betrothal
 # *** breaks - and then drew the OPPOSITE conclusion from it, that the refusal was
 # *** ours and should be stated plainly to the player. The user ruled that a deal
 # *** marriage must behave like a vanilla one. The mod now GRANTS the alliance
 # *** (tnt_34_marriage.txt, tnt_wed_one_pair_effect, above the grand/plain
 # *** dispatch) on exactly the pairs the engine approves, tested through T54
 # *** tnt_pair_yields_alliance_trigger. Nothing in paragraph (2)'s evidence
 # *** changed; only what we do about it.
 #
 # WHAT THAT COSTS THIS KEY: ITS ENTIRE PREMISE. "This marriage will not create an
 # alliance" was the first sentence and it is now false. The KEY NAME AND THE CALL
 # SITE ARE KEPT (tnt_12_marriage_picker.txt on_accept) - renaming would cost nine
 # files and the gate's key-set identity check for nothing a player can see - and
 # the value is rewritten into the standing RULE paragraph: a match written into a
 # treaty carries the same alliance the game's own Arrange Marriage carries, the
 # window's own alliance signs may be believed again, and the pact rests on the
 # couple so it lasts as long as the match does. READ THE KEY, NOT ITS NAME.
 # THE ALLIANCE TERM FAMILY STAYS RETIRED. Nobody buys an alliance on the sheet;
 # there is no such term and there will not be one. What came back is a CONSEQUENCE
 # of the marriage, not a thing for sale - the distinction is CLAUDE.md section 4's
 # dated ruling and this key must never be reworded as if an alliance were priced
 # on its own.
 # Tokens after the rewrite: $arrange_marriage_interaction$ once and [alliances|E]
 # once, in all nine languages. The three that left - $negotiate_alliance_interaction$,
 # $defensive_negotiations_perk_name$, $perk_alliance_interaction$ - left the whole
 # fan in the same edit, because token parity is measured per key across languages.
 tnt_stage_no_alliance_tt:0 "#high A match written into this treaty now creates an alliance.#! It is the game's own rule and not this mod's: the game weighs how closely each of the two people is related to the ruler who is giving them away, and if the pair is close enough on both sides, you and he are allies from the moment the treaty is sealed - exactly as the game's own #high $arrange_marriage_interaction$#! has always done. Nobody buys [alliances|E] at this table, there is no such term on the sheet, and there never will be: it simply comes with the marriage.\n\n#weak The game's own alliance signs in this window may therefore be believed again - the “Potential alliance” strength bar beside each candidate and the little crowned coats of arms next to it. They live in the candidate list and that list leaves the screen the instant both portraits are picked, so by the time you read this there is nothing of the kind left on the page; but the verdict printed just above this paragraph answers for the couple in front of you, and it is the game's own answer rather than a forecast of one.#!\n\n#weak The alliance rests on the couple themselves, so it lasts exactly as long as their match does and ends with it, through the game's own machinery. If either of them is still a child the pair is betrothed rather than wed, and the alliance stands on that betrothal from the first day. A treaty may carry several couples, and each one is judged on its own.#!"
 # ROUND 9 - THE VERDICT ON THE PAIR ACTUALLY ON SCREEN. The key above states the
 # RULE; these two state the FACT about these two portraits, and the mod's own pool
 # makes the answer "no" far more often than a player would guess - a
 # courtier-on-courtier match, which is the commonest thing this window produces,
 # opens no alliance door at all. *** THE DECIDING TRIGGER CHANGED IN ROUND 11 -
 # IT IS T54 tnt_pair_yields_alliance_trigger NOW, NOT T52. See the round-11 note
 # at the foot of this block; T52 is retired to an orphan and the paragraph below
 # is kept as the record of what it derived. *** T52
 # tnt_pair_opens_alliance_trigger
 # (common\scripted_triggers\tnt_41_gates.txt) was vanilla's own OR restated
 # over the post-wedding state: GAME\common\character_interactions\00_alliance.txt
 # :1186, :1205-1219, :1221-1235, :1237-1258. Printed from the interaction's
 # on_accept, so law 10a never applies and a $key$ inclusion is safe here - vanilla
 # ships the identical if/custom_tooltip shape at 00_artifact_interactions.txt:397-431.
 # ROUND 11 - THREE MEASURED CORRECTIONS, AND THE FIRST OF THEM RETIRES A PROMISE.
 # (1) THE OPENS LINE SAID "becomes available on him" AND T52 CANNOT PROVE THAT.
 #     T52 restates ONE block - the kinship OR of negotiate_alliance_interaction's
 #     is_valid_showing_failures_only (00_alliance.txt:1182-1283). The interaction
 #     is blocked by a great deal more, and NONE of it is knowable at the moment a
 #     match is staged: diplomatic range (use_diplomatic_range defaults to YES,
 #     _character_interactions.info:106-108, and negotiate_alliance never declares
 #     it; the send order lists the range check at :681, one step AHEAD of is_shown
 #     at :683); is_shown's own rows (:1120-1153) - both parties still rulers, the
 #     two not already allied, and the actor human or duke-or-above; and the flat
 #     is_valid rows above the OR (:1155-1181) - both playable and unimprisoned,
 #     not at war with each other, no refused_alliance_opinion of his still
 #     standing, and both BELOW hegemony rank. THE CHOICE WAS TO SOFTEN THE STRING,
 #     NOT TO WIDEN T52, and the reason is on T52's own header: every one of those
 #     rows is TRANSIENT STATE read years before the wedding, so folding them in
 #     would flip a structural verdict on a passing war and would report "shut" on
 #     a match that does open the door. The string now claims exactly what the
 #     trigger proves - the KINSHIP condition - and names the rest as weighed later.
 #     LEFT TO THE ALLIANCE-GRANT LANE OF THIS SAME ROUND: if a deal marriage ends
 #     up GRANTING the alliance through create_alliance, this key stops being a
 #     forecast altogether and is rewritten by that lane; nothing here presumes it
 #     either way, which is why only the false half was touched.
 # (2) THE GRANDPARENT CLAUSE WAS TRUE OF ONE DOOR ONLY. Doors 2 and 3
 #     (:1205-1219, :1221-1235) test is_close_family_of, and vanilla's close family
 #     is "parents, GRANDPARENTS, children, GRANDCHILDREN, siblings"
 #     (GAME\localization\english\game_concepts_l_english.yml:1237) - plus
 #     is_nibling_of and is_uncle_or_aunt_of beside it. Only door 4 (:1237-1258)
 #     cuts back to parent/child/sibling. The clause is qualified per door now.
 # (3) NO CREST APPEARS ONCE BOTH PORTRAITS ARE PICKED - MEASURED IN THE .gui.
 #     The "Potential alliance" surface is ONE thing: the alliances_grid inside a
 #     CANDIDATE ROW (GAME\gui\interaction_marriage.gui:433-459) - hbox_alliance_
 #     strength, the bar, at :445, and a coa_realm_tiny_crown at :452, sharing the
 #     tooltip MATCHMAKER_INTERACTION_ALLIANCE (:443), whose text is "#T Potential
 #     alliance#!\n[Character.GetPrimaryTitle.GetName]"
 #     (GAME\localization\english\specialinteractions_l_english.yml:642). The whole
 #     character list is visible = Not(HasPickedCharacters) (:247), and the picked
 #     state (:182) shows two prestige labels (:143-175), MARRIAGE_INFO (:208,
 #     = [MarriageInfo.GetMarriageOrBetrothal]), the marriage-details box
 #     (interaction_templates.gui:105-220 - marriage type, house/matrilineal,
 #     child chance, inbreeding, inheritable traits) and the effects contents
 #     (:216) - and NOT ONE alliance widget. Both keys name the real marks now.
 # *** ROUND 11, 2026-08-23 - AND THE LANE (1) LEFT OPEN ABOVE IS THE ONE THAT
 # *** ARRIVED. BOTH KEYS HAVE STOPPED BEING FORECASTS. *** The user ruled that a
 # deal marriage must behave like a vanilla one, so the mod now GRANTS the alliance
 # outright (tnt_34_marriage.txt, tnt_wed_one_pair_effect). Consequences for these
 # two strings, each one a correction of something that is now literally false:
 # (a) THE DECIDING TRIGGER IS T54 tnt_pair_yields_alliance_trigger, the single
 #     wrapper around the engine's own `yields_alliance`. The SAME trigger decides
 #     the grant, so the line and the deed cannot disagree - they are one call.
 #     T52 kept its body and lost its call site; do not restore it.
 # (b) THE OPENS KEY NO LONGER PROMISES A BUTTON. It promised "the door to ASKING",
 #     and asking is now pointless twice over: the alliance is already there, and
 #     negotiate_alliance hides itself on an allied pair (00_alliance.txt:1123).
 #     $negotiate_alliance_interaction$ therefore left this key IN ALL NINE
 #     LANGUAGES in one edit, and $arrange_marriage_interaction$ took its place -
 #     token parity is measured per key across the fan.
 # (c) THE SHUT KEY'S REASON IS THE ENGINE'S RULE, NOT VANILLA'S KINSHIP OR. The
 #     condition is a C++ define, NMarriage.MAX_ALLIANCE_FAMILY_DISTANCE_SUM = 4
 #     (GAME\common\defines\00_defines.txt:436, with vanilla's own comment: "How far
 #     can the married characters be related (a sum of both distances) to the
 #     arrangers in order for the arrangers to get alliances"), so the string now
 #     describes a SUM OF TWO DISTANCES measured on both sides at once.
 # (d) TWO CLAUSES WERE DELETED FROM THE SHUT KEY BECAUSE THEY BECAME FALSE. The
 #     adulthood clause ("a betrothal is not yet a marriage") - a betrothal now
 #     carries the alliance in its own right (00_rules.txt:354,
 #     alliance_on_actions.txt:331-338, fp1_trade_events.txt:2231-2247). And the
 #     "ignore the Potential alliance marks" clause - the crest is telling the
 #     truth now, so the marks are believed rather than dismissed, which is
 #     paragraph (3) above read the other way round.
 # *** 2026-08-24 - THE OPENS KEY NOW CARRIES THE ALLIANCE'S OWN NUMBER, AND THIS
 # *** IS THE ONLY LOC KEY IN THE MOD THAT LEGALLY CAN. *** The user reported that
 # the pair preview never showed the alliance points. It could not: a script value
 # may not ask yields_alliance (ZERO vanilla call sites in common\script_values;
 # CLAUDE.md requirement (b)), and a bridge variable written in the same on_accept
 # is not readable while the engine DESCRIBES that on_accept - that is the I1
 # storm. So the figure sits where the engine has already answered the question:
 # inside the `if` whose `limit` ran T54, common\character_interactions\
 # tnt_12_marriage_picker.txt:829-851. On a pair the trigger refused, the shut key
 # renders instead and no counterfactual number is ever printed. Law 10a does not
 # reach here - this is a character_interaction custom_tooltip, not a BuildTooltip
 # path (:823-824) - and the sibling tnt_stage_pair_points_line has been printing
 # [SCOPE.ScriptValue] on this exact path since V4.
 # THE VALUE IS tnt_stage_alliance_offer_value (tnt_52_marriage_values.txt), the
 # preview twin of the price, gated on the staged pair rather than on the treaty
 # flag. ONE new [..] token, born in ALL NINE languages in the same edit (law 9),
 # ZERO new keys. The second-pair case is closed in WORDS, not with a third key:
 # a treaty pays for the alliance once, so a second qualifying couple adds nothing
 # to the price and becomes a second reason the pact rests on
 # (tnt_34_marriage.txt:2274-2290 - two questions, two guards).
 # *** THE "ON TOP" INSTRUCTION IS RETRACTED AND MUST NEVER COME BACK. *** For one
 # round this key told the player to ADD this figure to the headline himself, and
 # the third report is the measurement of what that costs: he read -9 here, +106
 # in the deal, and reported a desync rather than performing the addition. The
 # headline is tnt_stage_pair_deal_delta_value now and the alliance is INSIDE it,
 # so this sentence says "already counted" and warns against adding it twice.
 # The figure itself is unchanged in meaning but is now SCALED by the partner's
 # regard, because it must be in the same currency as the headline it sits under -
 # the standing rule at tnt_stage_alliance_offer_value's own header.
 tnt_stage_alliance_opens_tt:0 "#high This match CREATES an alliance between you and him.#! Not a door to knock on later - the alliance itself, on the day the treaty is sealed, the moment these two are wed or betrothed. It is the game's own rule and the very same one its #high $arrange_marriage_interaction$#! follows: the game weighs how closely each of the two is related to the ruler giving them away, and this pair is close enough on both sides. Nothing further is asked of you, and he cannot refuse it - it comes with the treaty.\n\n#high Worth [SCOPE.ScriptValue('tnt_stage_alliance_offer_value')|+=0] treaty points - and that is ALREADY INSIDE the figure printed for this match above. Do not add it a second time.#! A treaty pays for the alliance once: if a couple already on the table opens it, this pair adds nothing to the price and becomes a second reason the pact stands on instead."
 tnt_stage_alliance_shut_tt:0 "#high This match does NOT create an alliance.#! The game measures how closely each of the two people is related to the ruler handing them over, adds the two distances together, and allows the alliance only while that sum stays small. A courtier married to a courtier is no relation to anybody at the table, so that pair allies nobody, and a stranger picked out of your own hall is no better. Marry your own blood to his - a child, a grandchild, a brother or sister, a parent - or stand at the altar yourself, and the sum falls inside the game's limit. This is the same rule that governs the game's own #high $arrange_marriage_interaction$#!, and it is measured on both sides at once, so a close pick on your side cannot make up for a distant one on his."
 # *** 2026-08-24 - THE THIRD VERDICT, BORN BECAUSE THE SHUT KEY WAS GIVING AN
 # *** ALREADY-ALLIED PLAYER THE WRONG REASON. *** The `if` that prints the opens
 # key gained a SECOND row - the two rulers must not be allied yet, so that the
 # verdict and the price die on the same input - but the `else` behind it still
 # attributed every refusal to FAMILY DISTANCE ALONE and told the player to marry
 # his own blood to the partner's. A man already allied to his partner who stages
 # his own son against the partner's daughter passes the kinship rule outright,
 # reads that advice, and takes it as an instruction to do what he has just done;
 # he then re-picks through closer and closer kin and is refused every time with
 # the same false explanation. The verdict is split three ways instead, and this
 # key is the middle branch - common\character_interactions\
 # tnt_12_marriage_picker.txt, the on_accept.
 # THE STRING IS CONDITIONAL BECAUSE THE BRANCH IS. It fires whether or not the
 # couple passes the kinship rule, so it may assert only what is certain - no new
 # pact, no treaty points for one, no second charge - and it must never claim the
 # couple qualifies. The "if the couple is close enough" half is the shipped
 # asymmetry said in words: the GRANT deliberately carries no already-allied
 # guard, because every qualifying marriage is registered as one more reason the
 # pact stands (tnt_34_marriage.txt:2274-2290), while the PRICE carries one so
 # nobody is charged twice. Two questions, two guards - do not harmonise them.
 # NO BRACKET TOKEN AND NO NESTED KEY, deliberately. Law 10a does not reach this
 # surface - it is a character_interaction custom_tooltip, not a BuildTooltip
 # path - but this key needs neither, and token-free is the safe default.
 tnt_stage_alliance_already_tt:0 "#high You are already his ally, so this match opens no new pact.#! A pact you already hold cannot be struck a second time: the alliance adds no treaty points on top of this match, and the treaty does not charge you for one. If the couple is close enough by blood to satisfy the game's own rule, the wedding is simply written down as one more reason the alliance you already have stands; if they are not, the alliance is left exactly as it was. Either way the match itself is still worth the points printed above, and the pact between you and him is untouched."
 # THE TWO LABELS THE ENGINE BUILDS FROM THE INTERACTION'S OWN NAME, and the reason
 # the raw key "actor_secondary_tnt_stage_marriage_interaction" was showing on screen:
 # a matchmaker interaction needs actor_secondary_<name> and recipient_secondary_<name>
 # for the two picked characters. Vanilla's own pair is
 # GAME\localization\english\interactions_l_english.yml:252-255
 #   actor_secondary_arrange_marriage_interaction:0 "[spouse|E]"
 #   recipient_secondary_arrange_marriage_interaction:0 "[spouse|E]"
 # Vanilla says "spouse" because it is arranging a wedding. Ours is staging a treaty
 # entry, so it names the SIDE instead - the one thing a player cannot read off the
 # portrait. Kept to two words: this is a caption under a portrait, not a sentence.
 actor_secondary_tnt_stage_marriage_interaction:0 "Your candidate"
 recipient_secondary_tnt_stage_marriage_interaction:0 "Their candidate"
 # THE POINTS, IN VANILLA'S OWN WINDOW, THE MOMENT BOTH SPOUSES ARE PICKED. This
 # is the custom_tooltip in tnt_stage_marriage_interaction's on_accept; the engine
 # renders it in the block that appears only when both are chosen
 # (interaction_marriage.gui:182, :216). `SCOPE` is vanilla's token for the script
 # context this text is resolved in, and it is what carries scope:tnt_sp /
 # scope:tnt_sr / scope:tnt_p into the script value - council_tasks_l_english.yml:83
 # uses exactly this form. The values delegate to the deal's own pair formula -
 # but delegating is NOT the same as equalling the number in the centre of the
 # negotiation window, and for THREE rounds this key printed a different quantity.
 # *** ROUND ONE REWORDED THE PROMISE. ROUND TWO SWAPPED THE NUMBER FOR THE SHEET
 # *** ROW. ROUND THREE STOPPED GUESSING AND PRINTED THE BALANCE'S OWN ARITHMETIC.
 # The third report named the cause the first two had missed: "the pair preview
 # says 'points for this match -9' and the deal shows +106, and I think it is
 # because of the strength of the alliance". It was: -9 + 115 = +106, and 115 is
 # tnt_alliance_worth_value paying for the pact the match CREATES. Every earlier
 # headline - tnt_stage_pair_net_value in round one, tnt_stage_pair_raw_net_value
 # in round two - was the couple WITHOUT that term, so no wording could join the
 # two figures; only the missing term could.
 # SO THE HEADLINE NOW PRINTS tnt_stage_pair_deal_delta_value = offered - asked +
 # alliance, term for term what tnt_ai_accept_value moves by when the pair is
 # staged, rounded by the same `round = yes`. The three sub-terms are printed on
 # the line below IN THE ORDER THEY ADD UP, so the player can check the sum with
 # his eyes, and the alliance line says out loud that it is INSIDE the headline
 # and not on top of it - which is exactly what tnt_stage_alliance_opens_tt used
 # to tell him to do by hand, and what he did not do. The sheet-row figure keeps
 # a labelled line of its own so nothing was taken away. Full argument at the head
 # of tnt_stage_pair_deal_delta_value in tnt_52_marriage_values.txt.
 # THE ONE RESIDUE IS STATED ON SCREEN INSTEAD OF HIDDEN: from the second couple
 # the volume taper makes the delta read a few points high (its own header
 # explains why exactness there would need a second copy of the taper ladder).
 tnt_stage_pair_points_line:0 "This couple moves the treaty by [SCOPE.ScriptValue('tnt_stage_pair_deal_delta_value')|+=0] - exactly how far the balance in the negotiation window moves when you stage it.\n#weak Offered [SCOPE.ScriptValue('tnt_stage_pair_gain_value')|0], asked [SCOPE.ScriptValue('tnt_stage_pair_loss_value')|0], and the alliance this match creates [SCOPE.ScriptValue('tnt_stage_alliance_offer_value')|+=0]. Those three ARE the figure above - the alliance is inside it, never on top of it. He values what you offer at x[SCOPE.ScriptValue('tnt_deal_mult_value')|2], and a grand wedding, if you promise one, is worth [SCOPE.ScriptValue('tnt_stage_grand_offer_value')|+=0] of that offer.#!\n#weak This couple's OWN row in the treaty carries a different number: [SCOPE.ScriptValue('tnt_stage_pair_raw_net_value')|+=0] - the match by itself, before his regard and before the alliance. Both are true; the balance shows the first.#!\n#weak From the second match in the same treaty the first figure is an ESTIMATE, not the exact move: a volume discount applies to the whole marriage pile, and the grand wedding and the dread between the two of you are paid ONCE PER TREATY yet counted again in every match's line. It can be tens of points out, high or low. At the first match it is exact.#!"
 # =====================================================================
 # THE SAME FIGURE, HUNG ON THE OPTION ITSELF. The engine rebuilds a send_option's
 # current_description when the option is toggled - that is what the field is for -
 # while nothing promises the same for an interaction's effect description, which is
 # why ticking the box appeared to do nothing. `$GRAND_WEDDING_PROMISE_INFO$` is
 # vanilla's own text for this option (00_marriage_interactions.txt:780), kept in
 # front so the player still reads what a grand wedding IS.
 # ROUND 9 - THE TRAP THAT HAD NO TEXT, AND IT IS A REAL HOLE THE PLAYER CAN FALL
 # INTO. tnt_wed_grand_pair_effect (tnt_34_marriage.txt) calls create_betrothal for
 # the principal pair even when BOTH are adults, and if the engine accepts that the
 # couple carry promised_grand_wedding_* from then on. Vanilla's completion alert
 # then refuses to fire on them by explicit NOR -
 # GAME\common\important_actions\00_marriage_actions.txt:147-150, whose own comment
 # says the pair "should trigger the specific Organize Grand Wedding action" - and
 # GAME\localization\english\game_concepts_l_english.yml:525 states the only exit:
 # "Grand Wedding Betrothals are converted into a Marriage by completing a wedding
 # activity". A player who never throws the feast keeps a betrothal for ever with no
 # reminder of any kind. ZERO NEW KEYS: one sentence appended to the string that
 # already describes this option, because the option's own tooltip is the only place
 # the warning is read at the moment of choosing. The engine mechanic itself is
 # vanilla's and is NOT touched.
 tnt_stage_grand_info:0 "$GRAND_WEDDING_PROMISE_INFO$\n\n#high Worth [SCOPE.ScriptValue('tnt_stage_grand_offer_value')|+=0] treaty points#! for this couple, on top of the match itself.\n\n#weak They stay BETROTHED until you actually hold the feast. #high The alliance does not wait for the feast#! - it stands on the betrothal itself, from the day the treaty is sealed, and it lasts exactly as long as that betrothal does. The game's ordinary alert for a betrothed couple who may now marry is deliberately silent on a pair promised a grand wedding - its Organize Grand Wedding alert takes that couple over instead, and it reaches whoever made the promise.#!"
 # THE BODY BESIDE THE PANEL. This is the last text the player reads before he
 # presses a button labelled by somebody else, so it names that label out loud.
 # USER ITEM 5: the closing paragraph's short form of the tip. The full statement
 # of the vanilla condition, with its file:line evidence, is on
 # tnt_stage_no_alliance_tt above; this one only has to leave the player knowing
 # that a CLOSE match is worth choosing and what it buys him afterwards.
 # V15 USER ITEM 4, the second of the two places: the fifth paragraph claimed the
 # alliance was "a separate term of the treaty, priced separately, and yours to add or
 # leave out". There is no such term and no such price - the row is retired. Reason and
 # vanilla citations are on tnt_stage_no_alliance_tt above; this key gets the short form,
 # because the closing paragraph that follows it already carries the useful half.
 # ROUND 11 - THE SECOND PARAGRAPH QUOTES A VANILLA BUTTON AND ONE LANGUAGE HAD
 # INVENTED ITS OWN. The label is vanilla's send_marriage_proposal_button_name
 # (GAME\localization\<lang>\tutorial_l_<lang>.yml:268, english :325), bound at
 # GAME\gui\interaction_marriage.gui:229. It is quoted as PLAIN TEXT rather than
 # $send_marriage_proposal_button_name$ so the sentence can carry the quotation
 # marks its own language uses - which is exactly why it can drift. Measured this
 # round across all nine: eight matched vanilla verbatim; simp_chinese quoted
 # "song chu ti yi", our own rendering of "Send Proposal", while the button in that
 # language reads QIU HUN (tutorial_l_simp_chinese.yml:268). Corrected there only.
 # TWO KEYS QUOTE THAT BUTTON, NOT ONE, and the second is easy to miss because it
 # lives in a different section: tnt_btn_stage_marriage_tip, the launch button's
 # tooltip in gui\tnt_panel_marriage.gui. simp_chinese carried the same wrong
 # label there and was corrected in the same edit; grep the vanilla value across
 # all nine rather than fixing the key you happened to open. NOT a third site:
 # tnt_confirm_opt_yes is OUR OWN option label ("Send the offer") on the treaty
 # confirmation event and has nothing to do with vanilla's button - russian's value
 # happens to read the same as vanilla's and must NOT be "harmonised" either way.
 # ANY ROUND THAT EDITS EITHER KEY MUST RE-CHECK THE QUOTE AGAINST VANILLA'S OWN
 # VALUE IN THAT LANGUAGE - a wrong label sends the player hunting for a button
 # that is not on the screen.
 tnt_stage_marriage_desc:0 "You are choosing a match for the treaty on the table. #high You are not sending a marriage proposal.#!\n\nThe wide button below is labelled #high 'Send Proposal'#! by the game itself and that wording cannot be changed here. It sends nothing and it marries nobody: it writes this couple into the treaty you are negotiating, beside the gold and the land, and the treaty's terms are priced again with the match in them.\n\n#high Nobody is wed and nobody is betrothed until the other side accepts the whole treaty.#! If the treaty is refused or abandoned, the match simply never happened.\n\n#weak Choose one person from each household, set the line of descent, and confirm. Come back as often as you like - a treaty may carry any number of couples.#!\n\n#weak The game draws its own hints about alliances in this window - #high you may believe them again#!. A match written into a treaty now carries the same alliance the game's own #high $arrange_marriage_interaction$#! carries, and by the game's own rule: it weighs how closely each of the two is related to the ruler giving them away, and if the pair is close enough on both sides, you and he are allies the moment the treaty is sealed.#!\n\n#weak The verdict for the couple you have actually picked is printed above, and it is the game's own answer rather than a guess - one and the same test decides that line and the alliance itself. A courtier married to a courtier still allies nobody. The alliance rests on the couple, so it lasts as long as their match does; and if either of them is still a child, it stands on the betrothal from the first day.#!"
 # THE LAUNCH BUTTON in the treaty's marriage panel (gui\tnt_panel_marriage.gui).
 # "The classic screen" is the player's own name for it, and it is honest: it is
 # the very window the game opens for an ordinary marriage.
 tnt_btn_stage_marriage:0 "Choose a match on the classic screen"
 # V4 FIX 3. The centre line is now a button (type tnt_action_line), and a button is
 # the only widget on that line the mouse may touch - so the term's own description
 # has nowhere else to live and is glued in front of the button's tooltip here.
 # `$KEY$` inclusion is vanilla's own mechanism, 359 uses of the `$…_desc$` form in
 # its English localization alone.
 tnt_btn_stage_marriage_full:0 "$tnt_item_marriage_desc$\n\n$tnt_btn_stage_marriage_tip$"
 # Its tooltip. It must carry the whole warning ALONE, because a player who
 # trusts a tooltip and clicks straight through will read nothing else of ours
 # until vanilla's label is in front of him.
 tnt_btn_stage_marriage_tip:0 "Opens the game's own marriage screen: both households side by side, every filter and the search, the two portraits, and the line of descent.\n\n#high It marries nobody.#! The couple you confirm there is recorded in this treaty, and the wedding - or the betrothal, if either of them is a child - happens only when the whole treaty is agreed.\n\n#weak Mind the game's own wording: the wide button in that window reads 'Send Proposal'. It sends no proposal to anyone - it adds the couple here. The same two people can also be picked by hand in the lists below, which is the only place a couple already in the treaty can have its line changed.#!"
 # The note printed beside the launch button, on the panel itself. One line, and
 # it says the single thing a player must not misunderstand.
 tnt_marriage_stage_note:0 "#weak Nothing is sent and nobody weds - the couple is recorded in this treaty.#!"
 # THE TWO REFUSALS THE BORROWED WINDOW'S GRAND-WEDDING CHECKBOX NEEDS.
 # tnt_err_grand_host wraps the seven-row host gate (T44 tnt_wed_host_gate_trigger,
 # vanilla's own rows at 00_marriage_interactions.txt:763-793) in one sentence,
 # because the checkbox has room for one; the six tnt_err_grand_* keys of section
 # P2 still report our own panel's checkbox one reason at a time.
 tnt_err_grand_host:0 "You cannot promise a grand wedding now: it takes a landed ruler of higher rank than a baron, #high Tours & Tournaments#! with its advanced activities, gold enough to host, and no promise of yours still outstanding.\n\n#weak And it is a promise: the honoured couple is betrothed, you become the promised host, and arranging the feast and paying for it remains yours to do. Let the promise lapse and the broken word is remembered.#!"
 tnt_err_grand_taken:0 "A grand wedding is already promised in this treaty. Untick it in the treaty's own marriage panel first - one treaty, one feast, one honoured couple."

 # =========================================================================
 # THE INTRO EVENT (12) - user item 23, events\tnt_intro_events.txt
 # One letter-styled primer on first unpause. Its desc is ASSEMBLED from four
 # seams: the main paragraph, ONE rate line picked by the tnt_ai_offer_rate
 # setting, ONE world line picked by the tnt_ai_treaties setting, and the
 # closing how-to. The seam rules are load-bearing: tnt_intro_desc_main ENDS
 # with \n\n; every tnt_intro_desc_world_* line STARTS with one leading space,
 # because it continues the rate line's paragraph; tnt_intro_desc_close STARTS
 # with \n\n. The closing line quotes the tnt_open_negotiations button text
 # exactly as shipped in each language.
 # =========================================================================
 tnt_intro_title:0 "The Art of the Treaty"
 tnt_intro_desc_main:0 "Word has gone out from your chancery: this court now treats after the new fashion. Any ruler may be called to the table - gold weighed against fealty, a bride against a truce, a favor against a crown - and every term is laid on one pair of scales, the same scales for both sides.\n\n"
 tnt_intro_desc_rate_normal:0 "Expect embassies now and then: no more than one letter in a year will find you, from all the world together, and a ruler once heard from broods some three years before he writes again."
 tnt_intro_desc_rate_frequent:0 "Expect the road to your gates well ridden: scarcely half a year will pass between one embassy and the next, and rulers return to the thought of you within the year."
 tnt_intro_desc_rate_rare:0 "Expect long silences: years will pass between letters, and the asking will mostly be yours to do."
 tnt_intro_desc_rate_off:0 "No letters will come: your gates are closed to embassies, and any treating will begin with you."
 tnt_intro_desc_rate_test:0 "The couriers have been told to run, not ride: an offer should find you within a few months. A testing pace, not a courtly one."
 tnt_intro_desc_world_rare:0 " Beyond your borders the same scales serve quietly: now and then two courts strike a bargain of their own, and word of it reaches you when it touches you."
 tnt_intro_desc_world_common:0 " Beyond your borders the same scales swing busily: foreign courts strike bargains of their own the whole year round."
 tnt_intro_desc_world_off:0 " Beyond your borders the old ways hold: the new fashion is practised only at tables where you yourself sit."
 tnt_intro_desc_close:0 "\n\nTo call a ruler to the table yourself, right-click him and choose #high Negotiate a Treaty#!."
 tnt_intro_opt_ok:0 "To the table, then."

 # =========================================================================
 # THE IMPORTANT-ACTION ALERT (13) - common\important_actions\tnt_91_alerts.txt
 # The full shipped key set for a combine_into_one = yes entry with no
 # `unimportant` block: <key> / _label / _desc / _click (95/95 of vanilla's
 # combine entries) plus the four _combined* keys (85-87/95). Model:
 # GAME\localization\english\important_actions_l_english.yml:521-529
 # (action_can_vassalize).
 # LAW 10 DOES NOT BIND THESE VALUES: important-action loc is rendered by the
 # important-action tooltip system against a real scope, not by
 # GetScriptedGui(S).BuildTooltip - GAME\gui\hud_notification_templates.gui
 # :2407 binds tooltip = "[ImportantActionItem.GetTooltip]", and vanilla's own
 # file carries 619 [..] tokens over 1220 keys. So tokens and #markup are safe
 # here, exactly as on tnt_open_negotiations_extra_icon.
 # NO $NUM$ ANYWHERE: _important_actions.info:38 documents it for
 # _combined_group_label, and it occurs ZERO times in vanilla's shipped
 # localization - unproven under house law 1, so the group label never promises
 # a count.
 # THE CLAUSE THAT MUST SURVIVE TRANSLATION: _combined_group_description names
 # THREE pools in all nine languages - your vassals, your lieges, and the
 # neighbours on your borders AND across the water - because that is exactly
 # what the sweep walks (tnt_91_alerts.txt:296, :363, :388). Drop it and it lies.
 # The wording deliberately echoes tnt_open_negotiations_extra_icon so the badge
 # on the right-click row and this alert read as one voice.
 # =========================================================================
 tnt_action_can_lean_on:0 "@dread_icon! You Have The Upper Hand"
 tnt_action_can_lean_on_label:0 "@dread_icon! You can lean on [recipient.GetPrimaryTitle.Custom('GetTierIcon')][recipient.GetUINameNoTooltip]"
 tnt_action_can_lean_on_desc:0 "[recipient.GetUIName] can be leaned on - your host, your name and your dread, each measured against his own, come to the weight a threat needs, and he has forgotten your last threat. Put the threat on the table and that same weight is added to what he will bear, so he pays more to have the conversation over."
 tnt_action_can_lean_on_click:0 "#I Click to negotiate a treaty#!"
 tnt_action_can_lean_on_combined_label:0 "[recipient.GetPrimaryTitle.Custom('GetTierIcon')] [recipient.GetUINameNoTooltip]"
 tnt_action_can_lean_on_combined_group_label:0 "@dread_icon! Rulers You Can Lean On"
 tnt_action_can_lean_on_combined_group_name:0 "@dread_icon! Rulers you can lean on"
 tnt_action_can_lean_on_combined_group_description:0 "Among your own vassals, your lieges and the neighbours on your borders and across the water, each of these rulers can be leaned on - your host, your name and your dread, each measured against his own, come to the weight a threat needs, and he has forgotten your last threat. Open negotiations with any of them and tick “Threaten him” to put the threat on the table."
 # =========================================================================
 # EXPERIMENT I2 - THE «has no localization» TOOLTIP DEFECT.
 # ROUND 7 written 2026-08-19; ROUND 7's VERDICT and ROUND 8's FIX added 2026-08-23.
 # Read the two ROUND 8 paragraphs further down FIRST - they supersede the
 # crossover plan and the em-dash hypothesis that the older text argues for.
 #
 # *** DO NOT "TIDY" tnt_err_threat_weak / _unknown / _nofear / _recent (grep for
 # *** them; the line numbers in this block have rotted twice and are not worth
 # *** repairing). Their exact bytes are the instrument of a live experiment.
 # *** Seven rounds have failed on this defect and FOUR of them shipped a fix and
 # *** a hypothesis at once, so nothing was learned. Read this block before
 # *** touching those four lines. `_unafraid` was RETIRED in round 8 - see below.
 # *** This block is appended at the FOOT on purpose: inserting it above the
 # *** keys would shift every .yml line number cited below 415, and four such
 # *** citations live in gui\tnt_panel_contract.gui and two in
 # *** common\script_values\tnt_54_multiselect_values.txt.
 #
 # THE ONLY OBSERVATION THE PROJECT HAS. parley\temp\screen5.png: a RUSSIAN
 # session, 23 Feb 1185, partner Atabeg Karadzha. The greyed «Угрожать»
 # checkbox showed ONE line, italic magenta with a red (!):
 #     tnt_err_threat_unafraid has no localization
 # Rows 1, 2 and 4 of that same tooltip PASSED, so they were never described
 # and nothing rendered beside it. The mod has never once been seen rendering a
 # custom_description sentence on the BuildTooltip path. The ledger is:
 # observed renders 0, observed message 1, never observed 44. Every "control"
 # the earlier rounds leaned on was an inference from absence, not a
 # measurement - seven of them are named and refuted in
 # _docs\tools\tnt_bare_tooltip_row_check.ps1's header.
 #
 # WHAT THE MESSAGE MEANS, FROM THE BINARY. "%s has no localization" sits in
 # ck3.exe at offset 72140771, between "Current level cannot be automatically
 # flattened. Use custom_tooltip or custom_description" (72140672) and "Trigger
 # loc for '%s' is missing" (72140792). Those last two are DIFFERENT failures:
 # "Trigger loc ... is missing" means the trigger has no
 # common\trigger_localization\ entry, while "%s has no localization" means A
 # NAMED LOCALIZATION KEY COULD NOT BE RESOLVED. So %s is a loc key, and
 # tnt_err_threat_unafraid is a loc key rather than a trigger name. Every round
 # that read the message as naming a TRIGGER read it wrong, and that is why
 # this file is now part of the investigation instead of a bystander.
 #
 # ALREADY ELIMINATED BY MEASUREMENT - do not re-derive any of it. The key name
 # is pure ASCII in both .yml (every codepoint dumped: no homoglyph, no
 # zero-width character); both files parse canonically (0 non-canonical lines of
 # 2036 and 2102, exactly two `"` per data line, no multi-line value); the key
 # sets are identical at 570 = 570 with no duplicate and no one-sided key. THE
 # KEY IS LOADED. The `#high 75#!` / `#high 40#!` markup this key used to carry
 # was stripped in round 6 and the symptom survived that fix.
 #
 # THE ONE VARIABLE STILL LIVE INSIDE THIS FILE: U+2014 EM DASH in the VALUE of
 # the described key. Of the four threat keys, Russian carries one on exactly
 # two (_unknown at :440, _unafraid at :441) and English on exactly one
 # (_unafraid, line 415 here). Screen5 is a Russian session, so Russian
 # governs: 6 of the 45 reachable custom_description keys carry an em dash and
 # 39 do not, and the one key ever observed is one of the 6. That is 1-of-1
 # against 0-of-0: neither a proof nor a refutation. Mechanically it is weak - a
 # character inside the VALUE cannot make the KEY lookup fail - but round 6's
 # exoneration of it rested on tnt_err_no_influence_gov, a key that has never
 # once been described, so it is UNDETERMINED rather than cleared.
 # THE CENSUS IS NOW MECHANICAL, so nobody eyeballs it again: PASS E of
 # _docs\tools\tnt_bare_tooltip_row_check.ps1 prints it on every run and
 # independently reproduces the figures - RU 6 of 45 (tnt_err_grand_not_dominant,
 # tnt_err_indep_p_unavailable, tnt_err_indep_r_unavailable,
 # tnt_err_no_influence_gov, tnt_err_threat_unafraid, tnt_err_threat_unknown) and
 # EN 2 of 45 (tnt_err_courtier_p_unavailable, tnt_err_threat_unafraid). Under the
 # null hypothesis the chance the one observation lands on an em-dash key is
 # 6/45 = 13%, i.e. unremarkable. The pass carries a -FailOnEmDash switch which is
 # OFF and MUST STAY OFF until a hover proves the hypothesis: making an unproven
 # guess block the launch gate is the round-6 mistake wearing a tool as a costume.
 #
 # *** ROUND 7 IS OVER. WHAT ACTUALLY RAN WAS THE RENAME, NOT THE CROSSOVER. ***
 # The crossover specified here was never armed. What shipped instead was a
 # RENAME of row 3's key, tnt_err_threat_unafraid -> tnt_err_threat_nofear, with
 # a byte-identical value - the same single-variable logic, the key varied and
 # everything else held. THE USER'S RUN OF 2026-08-23 PRINTED
 #     tnt_err_threat_nofear has no localization
 # so the failure FOLLOWED the rename. That exonerates the key NAME and indicts
 # the ROW or the CONSTRUCT, and it is why this file's em-dash paragraph above is
 # now history rather than a live hypothesis: the message survived a rename, and
 # a rename cannot change a character in the value.
 #
 # ROUND 8'S FIX, AND WHY IT IS A CONTROL RATHER THAN ANOTHER GUESS. The one
 # thing unique to row 3 in the whole mod was a LEAF: the block-form, parameter-
 # bearing engine trigger has_dread_level_towards = { target level } inside
 # tnt_threat_feared_trigger, which has ZERO entries in vanilla's
 # common\trigger_localization\ (1,636 entries, 51 files) while every other leaf
 # this tooltip reaches has one. It was 1 of 90 census rows and 1 of 45 reached
 # keys. Round 8 replaced that branch with two entried leaves - dread >= 30 on a
 # man who is target_is_liege_or_above of the threatener - so THE MOD NOW SHIPS
 # NO SUCH LEAF ANYWHERE ON A DESCRIBED PATH, and tnt_bare_tooltip_row_check.ps1
 # PASS G FAILS on the shape from now on instead of noting it.
 # THE NEXT HOVER IS THEREFORE DECISIVE EITHER WAY:
 #   * a SENTENCE -> the leaf was the mechanism; this is closed.
 #   * `tnt_err_threat_nofear has no localization` AGAIN -> the leaf hypothesis is
 #     DEAD, because no such leaf remains, and hypothesis (f) below is confirmed:
 #     all 45 reason keys must be REPLACED, not patched. DO NOT HUNT ANOTHER LEAF.
 #
 # tnt_err_threat_unafraid IS RETIRED AND DELETED from all nine languages. The
 # experiment it served has concluded, and after the fix its text described a rule
 # the mod no longer has; a stale orphan in nine languages is a trap, not a spare.
 # A future key-level experiment mints its own key in all nine files in the same
 # edit, which law 9 requires anyway. The core count moved 578 -> 577 per language.
 #
 # ============ PHASE 1: FOUR FREE HOVERS, AND NOT ONE EDIT ============
 # THE BIGGEST QUESTION IS NOT IN THIS FILE AT ALL, and it is settled without
 # changing a byte. HYPOTHESIS (f): a custom_description inside a scripted_gui
 # is_valid reached by ScriptedGui.BuildTooltip may simply not be SUPPORTED by
 # the engine's description walker - in which case all 45 reached keys would
 # print the message and this mod's entire reason-tooltip design has to be
 # REPLACED rather than patched. What raises it: VANILLA SHIPS ZERO INSTANCES OF
 # THE CONSTRUCT. ScriptedGui.BuildTooltip occurs exactly twice in the whole
 # vanilla gui tree (<vanilla>\gui\window_faith.gui:902 and :915) and both resolve
 # to an is_valid that is ONE bare parameterised call with no custom_description
 # in it (<vanilla>\common\scripted_guis\00_religion.txt:317-319 and :333-335).
 # The vanilla scripted_guis that DO use custom_description are reached by other
 # means entirely. So the mod is the only thing in the game doing this, the
 # observed render rate on this surface is 0 of 1, and six rounds of edits INSIDE
 # the construct changed nothing - which is what you expect if the construct
 # itself is the fault.
 #
 # HOW TO READ ANY OF THE FIVE PROBES. Report EVERY line in the box, verbatim. A
 # line that reads as a sentence is a RENDER; a line reading
 # `<key> has no localization` in italic magenta with a red (!) is a MESSAGE.
 # Rows that PASS are never described, so a one-line box is the NORMAL shape and
 # is not by itself evidence of anything - reading it as evidence is exactly
 # vacuous control 1.
 #   PROBE A  «Threaten him» against a partner whose army is BIGGER than yours.
 #            The row is not hidden when he is stronger: the visible at
 #            gui\tnt_diplomacy_window.gui:1706 is a bare
 #            "[TntRow('tnt_show_threat_p')]" with no second conjunct, and TntRow
 #            keys on tnt_hide_unavailable, which nothing writes
 #            (data_binding\tnt_macros.txt:201-205), so it is unconditionally
 #            true. Row 1, tnt_err_threat_weak (line 412 of this file,
 #            tnt_20_scripted_guis.txt:552), then FAILS and is described for the
 #            first time ever. Its value is plain - no dash, no markup, no token -
 #            and its only leaf max_military_strength HAS a vanilla entry.
 #            RENDERS -> (f) dies and (h) dies: the surface works for a plain,
 #            fully-entried key and the defect is specific to row 3.
 #            PRINTS -> (f) confirmed for practical purposes; (a) (b) (c) (d')
 #            and (g) all become irrelevant at once.
 #   PROBE B  «Use a hook» in the LEFT column with no hook on him. This is the
 #            DEFAULT state and literally screen5's state, so it needs no setup.
 #            tnt_err_usehook_none (line 401 of this file, tnt_23_usehook.txt:27)
 #            is a plain value over ONE SIMPLE leaf that is entry-less by
 #            construction: tnt_usehook_strength_value >= 1 is a script value, and
 #            of vanilla's 1,636 trigger_localization entry names (51 files, my
 #            own count with this project's tokenizer) not one is a script value.
 #            RENDERS -> (d') badly damaged and (f) dies.
 #            PRINTS -> (d') strongly confirmed on a different gui, a different
 #            key, a plain value and a SIMPLE leaf; and (a), (b) and (g) all die
 #            in one observation.
 #   PROBE C  «Propose» with an empty table - screen5's own state as well.
 #            tnt_err_nothing (line 832 of this file,
 #            tnt_20_scripted_guis.txt:1423) over tnt_offer_nonempty_trigger ->
 #            tnt_items_count_value > 0 (tnt_40_triggers.txt:1000-1001). With
 #            nothing staged every other shortfall row passes, so expect a clean
 #            ONE-line box. It is B's independent replicate through one more level
 #            of scripted-trigger recursion, and the direct test of vacuous
 #            control 6, which asserted this row "fails on every empty window
 #            without ever printing".
 #   PROBE D  «Sworn fealty» in the LEFT column WHILE AT WAR with him.
 #            tnt_err_vassal_mutual_war (line 875 of this file,
 #            tnt_20_scripted_guis.txt:1028, and mirrored for the _r side at
 #            :1153) is NOT = { root = { is_at_war_with = var:tnt_partner } };
 #            BOTH leaves have vanilla entries and the value is plain. Expect the
 #            other vassal rows (tier, wall) to fail too - report every line.
 #            RENDERS -> independent confirmation of A on a SECOND gui, so (f)
 #            dies twice over. PRINTS -> (f) confirmed on a second gui with a
 #            fully-entried plain key. Decisive either way.
 #   PROBE E  OPPORTUNISTIC VANILLA CONTROL, no mod involvement: the faith
 #            window's greyed Create / Recreate Head of Faith button
 #            (<vanilla>\gui\window_faith.gui:894-918). Visible only on your OWN
 #            faith, only with a head-of-faith doctrine, and only when the head
 #            title is absent (:897) or exists with no holder (:910), so it may
 #            not be available - take it if it is.
 #            PRINTS `can_create_head_of_faith_title_trigger has no localization`
 #            -> vacuous control 5 collapses and (h) becomes the leading
 #            structural reading. RENDERS a sentence -> bare rows are proven safe
 #            on this surface at last by observation instead of by assertion.
 #
 # *** THESE THREE KEYS ARE INSTRUMENTS NOW - DO NOT TIDY THEM EITHER. ***
 # tnt_err_usehook_none (line 401), tnt_err_nothing (line 832) and
 # tnt_err_vassal_mutual_war (line 875). Each is deliberately PLAIN - no dash, no
 # format markup, no [..] token, no nested $key$ - and that plainness IS the
 # control. Adding a single flourish to any of the three destroys the probe it
 # carries, and the probe is worth more than the flourish.
 #
 # ROUND 8 STRIPPED THE EM DASH TOO - as a free rider on an edit the fix already
 # required, never as the fix itself. tnt_err_threat_nofear had to be re-worded in
 # all nine languages anyway (the rule gained a third rung), so the clause was
 # RESTRUCTURED around a colon in every language rather than having a hyphen
 # substituted for a dash, which in Russian and Polish would be a fresh error
 # rather than a fix. The em dash is therefore no longer a live variable on THIS
 # key; five reached Russian keys and one English one still carry it and the
 # census below still prints them, so if a future hover ever shows the message on
 # one of THOSE, the hypothesis is back and -FailOnEmDash is how to gate it. 2026-08-24, THE RATIO RULING: tnt_err_threat_weak inherits the instrument role from _nofear and was re-worded around a COLON in all nine for exactly this reason - it carries no em dash either, so the described key stays dash-free. AND THE DASH CONTROL IS DEAD, not merely retired: tnt_err_threat_unknown kept its dash because it REFUSED at prestige level zero, and that row is now inside tnt_threat_points_value, so the key describes nothing and can never be reached. If the hypothesis is ever revived it needs a NEW live dash-bearing row, not this one.
 #
 # MECHANICAL GUARD: _docs\tools\tnt_bare_tooltip_row_check.ps1 prints the
 # em-dash census of every reached custom_description key as a NOTE, and its
 # -FailOnEmDash switch turns that census into a FAIL the day the hypothesis is
 # proven. PASS F of the same tool now guards the SHIPPED threat-row roster
 # (weak / unknown / nofear / recent, plus no_partner in the else) and asserts
 # that tnt_err_threat_unafraid is absent from both authored .yml, so no future
 # round has to guess whether an experiment is armed. PASS G is the round-8 FAIL
 # class described above.
 # =========================================================================
 tnt_msg_stale:0 "The terms have changed"
 tnt_err_deal_changed:0 "The agreement can no longer be carried out as written; nothing has been exchanged."
